schema_version: 1
source_id: "stable-source-id"

# Extraction coverage is multidimensional. A complete author-text scan does not
# imply inspected figures, comments, links, code, metadata or reuse rights.
scan:
  accessed_at: "YYYY-MM-DD"
  retrieval_method: "direct-page | api | indexed-text | author-mirror | repository | other"
  author_text: {status: not-inspected, coverage: null, notes: []}
  figures_media: {status: not-inspected, coverage: null, notes: []}
  code_data: {status: not-inspected, coverage: null, notes: []}
  comments: {status: not-inspected, coverage: null, notes: []}
  linked_resources: {status: not-inspected, coverage: null, notes: []}
  metadata: {status: not-inspected, coverage: null, notes: []}
  rights: {status: unknown, coverage: null, notes: []}
  unresolved_questions: []

# Required for instructional source types (blog, tutorial, course, book-chapter).
# See docs/source-catalogue-schema.md for the exact contract.
pedagogical_model:
  reconstruction:
    status: partial # partial | complete | not-applicable
    basis: []
    inferred_elements: []
  source_graph:
    nodes:
      - id: "src-concept-or-operation"
        kind: "concept | representation | parameter | operation | intermediate | constraint | example | visualization"
        description: "Concise paraphrase of the source-local element."
        locator: "Heading, section, timestamp, page or code symbol."
        inferred: false
    edges:
      - from: "src-node-a"
        type: "typed-relation"
        to: "src-node-b"
        inferred: false
    interpretation: "State that this is an editorial reconstruction unless the source defines a formal graph."
  learning_outcomes:
    - status: inferred # declared | inferred
      outcome: "Observable learner capability."
      basis: "Source evidence or reason for inference."
  assumed_prerequisites:
    - status: inferred # declared | inferred
      topic: "Required prior knowledge."
      basis: "Source evidence or reason for inference."
  teaching_route:
    - order: 1
      section: "Source heading or segment"
      function: "pedagogical-function"
      moves: ["What this segment asks the learner to do."]
  pedagogical_strengths: []
  pedagogical_limits: []
  comparison:
    dossier: "docs/source-reviews/topic-source-collection.md"
    canonical_graph: "data/concepts.yml"
    canonical_routes: []
    decision: "State the source-to-project comparison outcome."
    structures_kept_separate:
      - "Source-local graph and route"
      - "Canonical concept graph"
      - "Project learner route"

# One item per atomic contribution. Include useful, redundant, rejected and deferred items.
items:
  - id: "stable-source-id:atomic-contribution-id"
    kind: claim # choose an exact value from data/source-taxonomy.yml extraction_kinds
    summary: "Faithful concise paraphrase; do not copy extended source wording."
    locator: {type: section, value: "exact section, page, timestamp, code symbol or comment locator", label: "Heading"}
    # Optional: include provenance only when the item's voice differs from the parent source.
    # For example, a reader comment embedded in an article:
    # provenance:
    #   voice: reader-comment # primary-author | reader-comment | editorial-note | maintainer | other
    #   speaker: null
    #   parent_source_id: "stable-source-id"
    #   locator: {type: comment, value: "Exact comment locator"}
    #   captured_at: "YYYY-MM-DD"
    evidence:
      kind: direct-statement # describe the evidence basis; keep author statements separate from inference
      confidence: well-supported # exact value from evidence_confidence_levels in data/source-taxonomy.yml
      scope: "State the scope of the claim and inspected evidence."
      assumptions: []
      limitations: []
    technical_assessment:
      status: not-reviewed
      rationale: ""
      corroborating_sources: []
    # Mandatory complementarity check before classifying an item as already-covered,
    # reinforcement or reject: compare learner question, explanatory lens, mental model,
    # example phenomenon, teaching move, abstraction level and hidden assumptions.
    # Test a bounded integration (optional note, contrast, example, misconception,
    # exercise or cross-link); record why it helps or why it would add cognitive load.
    pedagogical_assessment:
      learner_question: ""
      explanatory_lens: ""
      teaching_form: []
      novelty: {level: uncertain, rationale: ""}
      complementarity: {level: uncertain, rationale: ""}
      pedagogical_value: {level: uncertain, rationale: ""}
      applicability: {level: uncertain, rationale: ""}
      redundancy: {level: uncertain, rationale: ""}
      evidence_quality: {level: uncertain, rationale: ""}
    classification:
      primary_theme: text-tokenization
      tags: []
      concept_ids: []
    candidate_destinations:
      pages: []
      concepts: []
      route_ids: []
    disposition: defer # exact value from item_dispositions in data/source-taxonomy.yml
    disposition_rationale: ""

# Never equate source-local graph IDs with canonical concept IDs.
canonical_mapping:
  proposed_concepts: []
  proposed_relations: []
  route_implications: []
  decision_summary: ""
