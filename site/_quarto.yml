project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - en/index.qmd
    - fr/transformer.qmd
    - en/transformer.qmd
    - fr/cosine-similarity.qmd
    - en/cosine-similarity.qmd
    - fr/linearite-embeddings.qmd
    - en/embedding-linearity.qmd
    - references.qmd

website:
  title: "LLM Lab"
  description: "A bilingual, code-first guide to the mathematics and implementation of language models."
  site-url: "https://jm-brun.github.io/llm-lab/"
  repo-url: "https://github.com/JM-Brun/llm-lab"
  repo-actions: [source, issue]
  page-navigation: true
  search: true
  navbar:
    background: "#10233f"
    foreground: "#f8fafc"
    left:
      - text: "Français"
        href: index.qmd
      - text: "English"
        href: en/index.qmd
      - text: "Références / References"
        href: references.qmd
    right:
      - icon: github
        href: https://github.com/JM-Brun/llm-lab
        aria-label: "GitHub repository"
  sidebar:
    style: "docked"
    contents:
      - section: "Français"
        contents:
          - index.qmd
          - fr/transformer.qmd
          - fr/cosine-similarity.qmd
          - fr/linearite-embeddings.qmd
      - section: "English"
        contents:
          - en/index.qmd
          - en/transformer.qmd
          - en/cosine-similarity.qmd
          - en/embedding-linearity.qmd
      - references.qmd
  page-footer:
    left: "LLM Lab · Mathématiques, code et expériences reproductibles"
    right:
      - text: "Code source"
        href: https://github.com/JM-Brun/llm-lab

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true

execute:
  freeze: auto
