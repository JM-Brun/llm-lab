website:
  title: "LLM Lab"
  description: "A bilingual learning lab to understand, build, and investigate language models."
  site-url: "https://jm-brun.github.io/llm-lab/"
  repo-url: "https://github.com/JM-Brun/llm-lab"
  repo-actions: [source, issue]
  page-navigation: true
  search: true
  navbar:
    background: "#14532D"
    foreground: "#f8fafc"
    left:
      - text: "Références / References"
        href: references.qmd
    right:
      - icon: github
        href: https://github.com/JM-Brun/llm-lab
        aria-label: "GitHub repository"
  sidebar:
    - id: fr
      title: "LLM Lab · Français"
      style: "docked"
      collapse-level: 1
      contents:
        - index.qmd
        - section: "Comprendre les LLM"
          contents:
            - fr/llm-overview.qmd
            - fr/transformer-architectures.qmd
            - fr/transformer.qmd
            - fr/generation.qmd
            - fr/llm-limits.qmd
            - section: "Du texte aux représentations"
              contents:
                - fr/text-data.qmd
                - fr/unicode-text.qmd
                - fr/tokenization-strategies.qmd
                - fr/embedding-space.qmd
                - fr/positional-encoding.qmd
                - fr/contextualized-representations.qmd
            - section: "Attention et sortie du Transformer"
              contents:
                - fr/queries-keys-values.qmd
                - fr/scaled-dot-product-attention.qmd
                - fr/causal-masking.qmd
                - fr/logits.qmd
                - fr/probabilites.qmd
            - section: "Apprendre à partir des données"
              contents:
                - fr/training-examples.qmd
                - fr/vraisemblance.qmd
                - fr/entropy.qmd
                - fr/cross-entropy.qmd
                - fr/loss.qmd
                - fr/gradients.qmd
                - fr/mathematical-foundations.qmd
        - section: "Construire un petit GPT"
          contents:
            - fr/build-path.qmd
        - section: "S'exercer et expérimenter"
          contents:
            - fr/exercises.qmd
            - fr/transformer-explainer.qmd
            - fr/evaluation-experimentale.qmd
        - section: "Approfondir"
          contents:
            - section: "Échelle et capacités"
              contents:
                - fr/scaling-laws.qmd
                - fr/emergence.qmd
            - section: "Adaptation à l'inférence"
              contents:
                - fr/in-context-learning.qmd
            - section: "Outils mathématiques et géométrie"
              contents:
                - fr/tensors.qmd
                - fr/cosine-similarity.qmd
                - fr/linearite-embeddings.qmd
            - section: "Fondamentaux du Machine Learning"
              contents:
                - fr/bias-variance.qmd
                - fr/decision-trees.qmd
                - fr/gradient-boosting.qmd
                - fr/xgboost.qmd
                - fr/lightgbm.qmd
                - fr/catboost.qmd
        - section: "Références"
          contents:
            - fr/glossary.qmd
            - fr/transformer-history.qmd
            - references.qmd
    - id: en
      title: "LLM Lab · English"
      style: "docked"
      collapse-level: 1
      contents:
        - en/index.qmd
        - section: "Understand LLMs"
          contents:
            - en/llm-overview.qmd
            - en/transformer-architectures.qmd
            - en/transformer.qmd
            - en/generation.qmd
            - en/llm-limits.qmd
            - section: "From text to representations"
              contents:
                - en/text-data.qmd
                - en/unicode-text.qmd
                - en/tokenization-strategies.qmd
                - en/embedding-space.qmd
                - en/positional-encoding.qmd
                - en/contextualized-representations.qmd
            - section: "Attention and the Transformer's output"
              contents:
                - en/queries-keys-values.qmd
                - en/scaled-dot-product-attention.qmd
                - en/causal-masking.qmd
                - en/logits.qmd
                - en/probabilities.qmd
            - section: "Learn from data"
              contents:
                - en/training-examples.qmd
                - en/likelihood.qmd
                - en/entropy.qmd
                - en/cross-entropy.qmd
                - en/loss.qmd
                - en/gradients.qmd
                - en/mathematical-foundations.qmd
        - section: "Build a small GPT"
          contents:
            - en/build-path.qmd
        - section: "Practice and experiment"
          contents:
            - en/exercises.qmd
            - en/transformer-explainer.qmd
            - en/experimental-evaluation.qmd
        - section: "Deepen your understanding"
          contents:
            - section: "Scale and capabilities"
              contents:
                - en/scaling-laws.qmd
                - en/emergence.qmd
            - section: "Adaptation at inference"
              contents:
                - en/in-context-learning.qmd
            - section: "Mathematical tools and geometry"
              contents:
                - en/tensors.qmd
                - en/cosine-similarity.qmd
                - en/embedding-linearity.qmd
            - section: "Machine Learning fundamentals"
              contents:
                - en/bias-variance.qmd
                - en/decision-trees.qmd
                - en/gradient-boosting.qmd
                - en/xgboost.qmd
                - en/lightgbm.qmd
                - en/catboost.qmd
        - section: "Reference"
          contents:
            - en/glossary.qmd
            - en/transformer-history.qmd
            - references.qmd
  page-footer:
    left: "LLM Lab · Mathématiques, code et expériences reproductibles"
    right:
      - text: "Code source"
        href: https://github.com/JM-Brun/llm-lab

format:
  html:
    theme:
      - cosmo
      - styles.scss
    include-after-body: includes/language-switch.html
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true

execute:
  freeze: auto
