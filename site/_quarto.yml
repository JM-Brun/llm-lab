format:
  html:
    theme:
      - cosmo
      - styles.scss
    template-partials:
      - includes/title-metadata.html
    filters:
      - filters/meta-description.lua
    include-after-body:
      - includes/language-switch.html
      - includes/learning-map.html
      - includes/accessibility-fixes.html
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true

execute:
  freeze: auto
