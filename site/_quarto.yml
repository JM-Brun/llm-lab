website:
  title: "LLM Lab"
  description: "A bilingual, code-first guide to the mathematics and implementation of language models."
  site-url: "https://jm-brun.github.io/llm-lab/"
  repo-url: "https://github.com/JM-Brun/llm-lab"
  repo-actions: [source, issue]
  page-navigation: true
  search: true
  navbar:
    background: "#10233f"
    foreground: "#f8fafc"
    left:
      - text: "Références / References"
        href: references.qmd
    right:
      - icon: github
        href: https://github.com/JM-Brun/llm-lab
        aria-label: "GitHub repository"
  sidebar:
    - id: fr
      title: "LLM Lab · Français"
      style: "docked"
      collapse-level: 1
      contents:
        - index.qmd
        - section: "1 · Comprendre le système"
          contents:
            - fr/transformer.qmd
            - fr/transformer-history.qmd
        - section: "2 · Préparer le texte et les données"
          contents:
            - fr/text-data.qmd
            - fr/unicode-text.qmd
            - fr/tokenization-strategies.qmd
            - fr/training-examples.qmd
        - section: "3 · Construire les représentations"
          contents:
            - fr/tensors.qmd
            - fr/embedding-space.qmd
            - fr/contextualized-representations.qmd
            - fr/positional-encoding.qmd
        - section: "4 · Contextualiser avec le Transformer"
          contents:
            - fr/queries-keys-values.qmd
            - fr/scaled-dot-product-attention.qmd
            - fr/causal-masking.qmd
        - section: "5 · Prédire le prochain token"
          contents:
            - fr/logits.qmd
            - fr/probabilites.qmd
        - section: "6 · Apprendre à partir de l'erreur"
          contents:
            - fr/vraisemblance.qmd
            - fr/entropy.qmd
            - fr/cross-entropy.qmd
            - fr/loss.qmd
            - fr/gradients.qmd
            - fr/mathematical-foundations.qmd
        - section: "7 · Évaluer et mettre à l'épreuve"
          contents:
            - fr/evaluation-experimentale.qmd
            - fr/exercises.qmd
        - section: "Approfondir et prendre du recul"
          contents:
            - fr/cosine-similarity.qmd
            - fr/linearite-embeddings.qmd
        - fr/glossary.qmd
    - id: en
      title: "LLM Lab · English"
      style: "docked"
      collapse-level: 1
      contents:
        - en/index.qmd
        - section: "1 · Understand the system"
          contents:
            - en/transformer.qmd
            - en/transformer-history.qmd
        - section: "2 · Prepare text and data"
          contents:
            - en/text-data.qmd
            - en/unicode-text.qmd
            - en/tokenization-strategies.qmd
            - en/training-examples.qmd
        - section: "3 · Build the representations"
          contents:
            - en/tensors.qmd
            - en/embedding-space.qmd
            - en/contextualized-representations.qmd
            - en/positional-encoding.qmd
        - section: "4 · Contextualize with the Transformer"
          contents:
            - en/queries-keys-values.qmd
            - en/scaled-dot-product-attention.qmd
            - en/causal-masking.qmd
        - section: "5 · Predict the next token"
          contents:
            - en/logits.qmd
            - en/probabilities.qmd
        - section: "6 · Learn from prediction error"
          contents:
            - en/likelihood.qmd
            - en/entropy.qmd
            - en/cross-entropy.qmd
            - en/loss.qmd
            - en/gradients.qmd
            - en/mathematical-foundations.qmd
        - section: "7 · Evaluate and challenge"
          contents:
            - en/experimental-evaluation.qmd
            - en/exercises.qmd
        - section: "Deep dives and critical perspectives"
          contents:
            - en/cosine-similarity.qmd
            - en/embedding-linearity.qmd
        - en/glossary.qmd
  page-footer:
    left: "LLM Lab · Mathématiques, code et expériences reproductibles"
    right:
      - text: "Code source"
        href: https://github.com/JM-Brun/llm-lab

format:
  html:
    theme:
      - cosmo
      - styles.scss
    include-after-body: includes/language-switch.html
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true

execute:
  freeze: auto
