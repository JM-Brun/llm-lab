website:
  title: "LLM Lab"
  description: "A bilingual learning lab to understand, build, and investigate language models."
  site-url: "https://jm-brun.github.io/llm-lab/"
  repo-url: "https://github.com/JM-Brun/llm-lab"
  repo-subdir: "site"
  repo-actions: [source, issue]
  page-navigation: true
  search: true
  open-graph: true
  twitter-card: true
  navbar:
    background: "#14532D"
    foreground: "#f8fafc"
    right:
      - icon: github
        href: https://github.com/JM-Brun/llm-lab
        aria-label: "GitHub repository"
  sidebar:
    - id: fr
      title: "LLM Lab · Français"
      style: "docked"
      collapse-level: 1
      contents:
        - index.qmd
        - fr/learning-map.qmd
        - section: "Comprendre les LLM"
          contents:
            - fr/llm-overview.qmd
            - fr/generation.qmd
            - section: "Comment le modèle calcule sa prédiction"
              href: fr/text-data.qmd
              contents:
                - section: "Des identifiants aux représentations"
                  href: fr/embedding-space.qmd
                  contents:
                    - fr/positional-encoding.qmd
                    - fr/contextualized-representations.qmd
                - section: "Transformer les représentations"
                  contents:
                    - fr/transformer.qmd
                    - fr/queries-keys-values.qmd
                    - fr/scaled-dot-product-attention.qmd
                    - fr/causal-masking.qmd
                - section: "Des scores aux probabilités"
                  contents:
                    - fr/logits.qmd
                    - fr/probabilites.qmd
                    - fr/entropy.qmd
            - section: "Scoring des tokens observés"
              contents:
                - fr/vraisemblance.qmd
                - fr/cross-entropy.qmd
            - section: "Loss et gradients"
              contents:
                - fr/loss.qmd
                - fr/gradients.qmd
                - fr/training-loop.qmd
                - fr/post-training.qmd
            - section: "Architectures Transformer et limites des LLM"
