<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1450" viewBox="0 0 820 1450" role="img" aria-labelledby="title desc"><title id="title">Trois règles de mise à jour, trois informations</title><desc id="desc">Même objectif et même gradient : c’est la règle de mise à jour qui change.</desc><rect width="820" height="1450" rx="28" fill="#f8fafc"/><text x="55" y="62" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#15803d">APPRENTISSAGE · OPTIMISATION</text><text x="55" y="112" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17212b">Trois règles de mise à jour, trois informations</text><text x="55" y="150" font-family="Arial,sans-serif" font-size="19" fill="#475569">Même objectif et même gradient : c’est la règle de mise à jour qui change.</text><rect x="55" y="190" width="710" height="330" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="55" y="190" width="10" height="330" rx="5" fill="#2563eb"/><text x="87" y="242" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#17212b">SGD</text><text x="87" y="282" font-family="Arial,sans-serif" font-size="23" fill="#475569">Descente de gradient</text><rect x="87" y="310" width="646" height="38" rx="19" fill="#2563eb" opacity=".12"/><text x="105" y="336" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2563eb">Premier ordre</text><text x="87" y="395" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212b">Utilise le gradient courant</text><text x="87" y="448" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">θₜ₊₁ = θₜ − η gₜ</text><text x="87" y="455" font-family="Arial,sans-serif" font-size="20" fill="#475569">Un pas dans la direction opposée au gradient.</text><text x="87" y="495" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2563eb">Pas de courbure explicite</text><rect x="55" y="570" width="710" height="330" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="55" y="570" width="10" height="330" rx="5" fill="#d97706"/><text x="87" y="622" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#17212b">Newton</text><text x="87" y="662" font-family="Arial,sans-serif" font-size="23" fill="#475569">Méthode du second ordre</text><rect x="87" y="690" width="646" height="38" rx="19" fill="#d97706" opacity=".12"/><text x="105" y="716" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#d97706">Second ordre</text><text x="87" y="775" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212b">Utilise gradient + Hessienne</text><text x="87" y="828" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">θₜ₊₁ = θₜ − Hₜ⁻¹ gₜ</text><text x="87" y="835" font-family="Arial,sans-serif" font-size="20" fill="#475569">La courbure réoriente et redimensionne le pas.</text><text x="87" y="875" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#d97706">H = ∇²L : dérivées secondes</text><rect x="55" y="950" width="710" height="330" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="55" y="950" width="10" height="330" rx="5" fill="#059669"/><text x="87" y="1002" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#17212b">Adam / AdamW</text><text x="87" y="1042" font-family="Arial,sans-serif" font-size="23" fill="#475569">Optimiseur adaptatif</text><rect x="87" y="1070" width="646" height="38" rx="19" fill="#059669" opacity=".12"/><text x="105" y="1096" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#059669">Premier ordre adaptatif</text><text x="87" y="1155" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212b">Moyennes des gradients et de leurs carrés</text><text x="87" y="1208" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">mₜ ← β₁mₜ₋₁ + (1−β₁)gₜ</text><text x="87" y="1215" font-family="Arial,sans-serif" font-size="20" fill="#475569">vₜ suit le second moment des gradients ; il règle l’échelle coordonnée par coordonnée.</text><text x="87" y="1255" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#059669">vₜ ≠ Hₜ : pas de Hessienne</text><rect x="55" y="1338" width="710" height="62" rx="14" fill="#e2e8f0"/><text x="410" y="1375" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">Le « second moment » d’Adam est statistique ; ce n’est pas une dérivée seconde.</text></svg>