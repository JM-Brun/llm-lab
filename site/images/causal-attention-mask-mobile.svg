<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
<title id="title">Causal attention mask</title><desc id="desc">Four-by-four matrix. Rows are queries and columns are keys. A query sees only earlier positions and itself.</desc>
<rect width="720" height="900" rx="24" fill="#f8fafc"/>
<text x="32" y="55" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#10233f">Causal mask</text>
<text x="32" y="94" font-family="Arial,sans-serif" font-size="20" fill="#51627a">Rows = queries · columns = keys</text>
<g font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233f" text-anchor="middle"><text x="210" y="170">t1</text><text x="130" y="250">t1</text><text x="302" y="170">t2</text><text x="130" y="342">t2</text><text x="394" y="170">t3</text><text x="130" y="434">t3</text><text x="486" y="170">t4</text><text x="130" y="526">t4</text></g>
<g stroke="#fff" stroke-width="4"><rect x="164" y="185" width="88" height="84" rx="9" fill="#087f8c"/><rect x="256" y="185" width="88" height="84" rx="9" fill="#f0c9bd"/><rect x="348" y="185" width="88" height="84" rx="9" fill="#f0c9bd"/><rect x="440" y="185" width="88" height="84" rx="9" fill="#f0c9bd"/><rect x="164" y="277" width="88" height="84" rx="9" fill="#087f8c"/><rect x="256" y="277" width="88" height="84" rx="9" fill="#087f8c"/><rect x="348" y="277" width="88" height="84" rx="9" fill="#f0c9bd"/><rect x="440" y="277" width="88" height="84" rx="9" fill="#f0c9bd"/><rect x="164" y="369" width="88" height="84" rx="9" fill="#087f8c"/><rect x="256" y="369" width="88" height="84" rx="9" fill="#087f8c"/><rect x="348" y="369" width="88" height="84" rx="9" fill="#087f8c"/><rect x="440" y="369" width="88" height="84" rx="9" fill="#f0c9bd"/><rect x="164" y="461" width="88" height="84" rx="9" fill="#087f8c"/><rect x="256" y="461" width="88" height="84" rx="9" fill="#087f8c"/><rect x="348" y="461" width="88" height="84" rx="9" fill="#087f8c"/><rect x="440" y="461" width="88" height="84" rx="9" fill="#087f8c"/></g>
<g font-family="Arial,sans-serif" font-size="30" font-weight="800" text-anchor="middle"><text x="208" y="239" fill="#fff">✓</text><text x="300" y="239" fill="#9b4e3c">×</text><text x="392" y="239" fill="#9b4e3c">×</text><text x="484" y="239" fill="#9b4e3c">×</text><text x="208" y="331" fill="#fff">✓</text><text x="300" y="331" fill="#fff">✓</text><text x="392" y="331" fill="#9b4e3c">×</text><text x="484" y="331" fill="#9b4e3c">×</text><text x="208" y="423" fill="#fff">✓</text><text x="300" y="423" fill="#fff">✓</text><text x="392" y="423" fill="#fff">✓</text><text x="484" y="423" fill="#9b4e3c">×</text><text x="208" y="515" fill="#fff">✓</text><text x="300" y="515" fill="#fff">✓</text><text x="392" y="515" fill="#fff">✓</text><text x="484" y="515" fill="#fff">✓</text></g>
<rect x="32" y="610" width="26" height="26" rx="5" fill="#087f8c"/><text x="72" y="631" font-family="Arial,sans-serif" font-size="20" fill="#10233f">Allowed position</text>
<rect x="360" y="610" width="26" height="26" rx="5" fill="#f0c9bd"/><text x="400" y="631" font-family="Arial,sans-serif" font-size="20" fill="#10233f">Masked position</text>
<text x="32" y="710" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233f">Rule: j ≤ i</text>
<text x="32" y="750" font-family="Arial,sans-serif" font-size="18" fill="#51627a">The query at position i can read</text>
<text x="32" y="780" font-family="Arial,sans-serif" font-size="18" fill="#51627a">keys at positions j ≤ i, never the future.</text>
</svg>