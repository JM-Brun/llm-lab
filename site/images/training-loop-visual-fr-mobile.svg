<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1371" role="img" aria-labelledby="title desc"><title id="title">Un pas de mise à jour</title><desc id="desc">Seule l’étape de l’optimiseur modifie les paramètres. Batch d’entraînement, Préfixes + cibles, du token suivant; Passe avant, Logits avec les, paramètres θₖ; Loss, Entropie croisée, par cible + masque; Rétropropagation, Gradient ∇θ L(θₖ), ; Mise à jour, θₖ → θₖ₊₁, par l’optimiseur. Validation : mesurer, pas mettre à jour: Batch réservé → passe avant → loss de validation. Paramètres fixes à l’évaluation ; aucun gradient ni mise à jour.</desc><rect width="720" height="1371" rx="24" fill="#F8FAFC"/><text x="32" y="54" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#15803D">APPRENTISSAGE · UN PAS</text><text x="32" y="102" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17212B">Un pas de mise à jour</text><text x="32" y="137" font-family="Arial,sans-serif" font-size="17" fill="#475569">Seule l’étape de l’optimiseur modifie les paramètres</text><rect x="32" y="175" width="656" height="116" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="32" y="175" width="8" height="116" rx="4" fill="#64748B"/><text x="56" y="211" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212B">Batch d’entraînement</text><text x="56" y="245" font-family="Arial,sans-serif" font-size="18" fill="#475569">Préfixes + cibles · du token suivant</text><path d="M360 293 V312" stroke="#64748B" stroke-width="3"/><path d="M352 304 L360 312 L368 304" stroke="#64748B" stroke-width="3" fill="none"/><rect x="32" y="315" width="656" height="116" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="32" y="315" width="8" height="116" rx="4" fill="#64748B"/><text x="56" y="351" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212B">Passe avant</text><text x="56" y="385" font-family="Arial,sans-serif" font-size="18" fill="#475569">Logits avec les · paramètres θₖ</text><path d="M360 433 V452" stroke="#64748B" stroke-width="3"/><path d="M352 444 L360 452 L368 444" stroke="#64748B" stroke-width="3" fill="none"/><rect x="32" y="455" width="656" height="116" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="32" y="455" width="8" height="116" rx="4" fill="#64748B"/><text x="56" y="491" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212B">Loss</text><text x="56" y="525" font-family="Arial,sans-serif" font-size="18" fill="#475569">Entropie croisée · par cible + masque</text><path d="M360 573 V592" stroke="#64748B" stroke-width="3"/><path d="M352 584 L360 592 L368 584" stroke="#64748B" stroke-width="3" fill="none"/><rect x="32" y="595" width="656" height="116" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="32" y="595" width="8" height="116" rx="4" fill="#64748B"/><text x="56" y="631" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212B">Rétropropagation</text><text x="56" y="665" font-family="Arial,sans-serif" font-size="18" fill="#475569">Gradient ∇θ L(θₖ)</text><path d="M360 713 V732" stroke="#64748B" stroke-width="3"/><path d="M352 724 L360 732 L368 724" stroke="#64748B" stroke-width="3" fill="none"/><rect x="32" y="735" width="656" height="116" rx="16" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><rect x="32" y="735" width="8" height="116" rx="4" fill="#15803D"/><text x="56" y="771" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212B">Mise à jour</text><text x="56" y="805" font-family="Arial,sans-serif" font-size="18" fill="#475569">θₖ → θₖ₊₁ · par l’optimiseur</text><rect x="32" y="879" width="656" height="166" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="54" y="917" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17212B">Un exemple pour une cible</text><text x="54" y="961" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15803D">p(cible) = 0,6  →  −ln(0,6) ≈ 0,511 nat</text><text x="54" y="999" font-family="Arial,sans-serif" font-size="16" fill="#475569">Gradient des logits : (−0,4 ; 0,2 ; 0,1 ; 0,1)</text><rect x="32" y="1069" width="656" height="166" rx="16" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="54" y="1107" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0369A1">Validation : mesurer, pas mettre à jour</text><text x="54" y="1151" font-family="Arial,sans-serif" font-size="17" fill="#17212B">Batch réservé → passe avant → loss de validation</text><text x="54" y="1189" font-family="Arial,sans-serif" font-size="16" fill="#475569">Paramètres fixes à l’évaluation ; aucun gradient ni mise à jour</text><rect x="32" y="1259" width="656" height="62" rx="14" fill="#DCFCE7"/><text x="54" y="1298" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15803D">Batch suivant avec θₖ₊₁ · répéter</text></svg>