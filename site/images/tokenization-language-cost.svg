<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">One string, different token segmentations</title>
<desc id="desc">A schematic example shows the string unbelievable split into two pieces in one possible segmentation and three pieces in another. These are illustrative, not outputs from a named tokenizer.</desc>
<rect width="1000" height="360" rx="18" fill="#f8fafc"/>
<text x="36" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172554">One string, different segmentations</text>
<text x="36" y="72" font-family="Arial,sans-serif" font-size="16" fill="#475569">Schematic example only — not output from a real, named tokenizer.</text>
<text x="40" y="124" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">Input text</text>
<rect x="40" y="142" width="260" height="52" rx="9" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="170" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">unbelievable</text>
<text x="40" y="235" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">Illustrative segmentation A · 2 pieces</text>
<rect x="40" y="252" width="170" height="48" rx="8" fill="#dbeafe" stroke="#60a5fa"/><text x="125" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1e3a8a">un</text>
<rect x="224" y="252" width="220" height="48" rx="8" fill="#dbeafe" stroke="#60a5fa"/><text x="334" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1e3a8a">believable</text>
<text x="520" y="235" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">Illustrative segmentation B · 3 pieces</text>
<rect x="520" y="252" width="110" height="48" rx="8" fill="#ffedd5" stroke="#fb923c"/><text x="575" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#9a3412">un</text>
<rect x="644" y="252" width="130" height="48" rx="8" fill="#ffedd5" stroke="#fb923c"/><text x="709" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#9a3412">believ</text>
<rect x="788" y="252" width="110" height="48" rx="8" fill="#ffedd5" stroke="#fb923c"/><text x="843" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#9a3412">able</text>
<text x="40" y="333" font-family="Arial,sans-serif" font-size="14" fill="#475569">A smaller token count alone does not establish better model quality.</text>
</svg>