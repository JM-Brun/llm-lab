<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Illustration of tokenization cost differences across languages</title>
<desc id="desc">A conceptual comparison of equivalent meaning represented by different numbers of tokens. It is illustrative, not a reproduction of the study's measured results.</desc>
<rect width="1000" height="340" rx="18" fill="#f8fafc"/>
<text x="36" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172554">One meaning, different token counts</text>
<text x="36" y="69" font-family="Arial,sans-serif" font-size="15" fill="#475569">Conceptual illustration only — not measured values from Ahia et al. (2023).</text>
<g font-family="Arial,sans-serif">
<text x="40" y="119" font-size="18" font-weight="700" fill="#334155">English example</text>
<text x="40" y="146" font-size="16" fill="#334155">“What is the capital?”</text>
<rect x="40" y="165" width="108" height="44" rx="7" fill="#dbeafe" stroke="#60a5fa"/><text x="94" y="192" text-anchor="middle" font-size="15" fill="#1e3a8a">What</text><rect x="162" y="165" width="108" height="44" rx="7" fill="#dbeafe" stroke="#60a5fa"/><text x="216" y="192" text-anchor="middle" font-size="15" fill="#1e3a8a"> is</text><rect x="284" y="165" width="108" height="44" rx="7" fill="#dbeafe" stroke="#60a5fa"/><text x="338" y="192" text-anchor="middle" font-size="15" fill="#1e3a8a"> the</text><rect x="406" y="165" width="108" height="44" rx="7" fill="#dbeafe" stroke="#60a5fa"/><text x="460" y="192" text-anchor="middle" font-size="15" fill="#1e3a8a"> capital</text><rect x="528" y="165" width="108" height="44" rx="7" fill="#dbeafe" stroke="#60a5fa"/><text x="582" y="192" text-anchor="middle" font-size="15" fill="#1e3a8a">?</text>
<text x="40" y="244" font-size="18" font-weight="700" fill="#334155">Equivalent meaning in another script</text>
<text x="40" y="270" font-size="16" fill="#334155">A tokenizer may split the same information into more pieces:</text>
<rect x="40" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="94" y="306" text-anchor="middle" font-size="13" fill="#9a3412">piece</text><rect x="162" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="216" y="306" text-anchor="middle" font-size="13" fill="#9a3412">piece</text><rect x="284" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="338" y="306" text-anchor="middle" font-size="13" fill="#9a3412">piece</text><rect x="406" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="460" y="306" text-anchor="middle" font-size="13" fill="#9a3412">piece</text><rect x="528" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="582" y="306" text-anchor="middle" font-size="13" fill="#9a3412">piece</text><rect x="650" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="704" y="306" text-anchor="middle" font-size="13" fill="#9a3412">piece</text><rect x="772" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="826" y="306" text-anchor="middle" font-size="13" fill="#9a3412">…</text>
</g>
</svg>