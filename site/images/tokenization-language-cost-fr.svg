<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Illustration des différences de coût de tokenisation entre langues</title>
<desc id="desc">Comparaison conceptuelle d'un même sens représenté par des nombres différents de tokens. Illustration schématique, pas une reproduction des résultats mesurés d'une étude.</desc>
<rect width="1000" height="340" rx="18" fill="#f8fafc"/>
<text x="36" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172554">Un même sens, des nombres de tokens différents</text>
<text x="36" y="69" font-family="Arial,sans-serif" font-size="15" fill="#475569">Illustration conceptuelle — pas de valeurs mesurées tirées d'Ahia et al. (2023).</text>
<g font-family="Arial,sans-serif">
<text x="40" y="119" font-size="18" font-weight="700" fill="#334155">Exemple en anglais</text>
<text x="40" y="146" font-size="16" fill="#334155">« Quelle est la capitale ? »</text>
<rect x="40" y="165" width="108" height="44" rx="7" fill="#dbeafe" stroke="#60a5fa"/><text x="94" y="192" text-anchor="middle" font-size="15" fill="#1e3a8a">What</text><rect x="162" y="165" width="108" height="44" rx="7" fill="#dbeafe" stroke="#60a5fa"/><text x="216" y="192" text-anchor="middle" font-size="15" fill="#1e3a8a"> is</text><rect x="284" y="165" width="108" height="44" rx="7" fill="#dbeafe" stroke="#60a5fa"/><text x="338" y="192" text-anchor="middle" font-size="15" fill="#1e3a8a"> the</text><rect x="406" y="165" width="108" height="44" rx="7" fill="#dbeafe" stroke="#60a5fa"/><text x="460" y="192" text-anchor="middle" font-size="15" fill="#1e3a8a"> capital</text><rect x="528" y="165" width="108" height="44" rx="7" fill="#dbeafe" stroke="#60a5fa"/><text x="582" y="192" text-anchor="middle" font-size="15" fill="#1e3a8a">?</text>
<text x="40" y="244" font-size="18" font-weight="700" fill="#334155">Même sens dans une autre écriture</text>
<text x="40" y="270" font-size="16" fill="#334155">Un tokenizer peut découper la même information en davantage de fragments :</text>
<rect x="40" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="94" y="306" text-anchor="middle" font-size="13" fill="#9a3412">fragment</text><rect x="162" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="216" y="306" text-anchor="middle" font-size="13" fill="#9a3412">piece</text><rect x="284" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="338" y="306" text-anchor="middle" font-size="13" fill="#9a3412">piece</text><rect x="406" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="460" y="306" text-anchor="middle" font-size="13" fill="#9a3412">piece</text><rect x="528" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="582" y="306" text-anchor="middle" font-size="13" fill="#9a3412">piece</text><rect x="650" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="704" y="306" text-anchor="middle" font-size="13" fill="#9a3412">piece</text><rect x="772" y="285" width="108" height="32" rx="7" fill="#ffedd5" stroke="#fb923c"/><text x="826" y="306" text-anchor="middle" font-size="13" fill="#9a3412">…</text>
</g>
</svg>