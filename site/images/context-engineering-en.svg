<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">From system to accessible context</title><desc id="desc">The application stores multiple sources, selects some to build the sequence supplied to the model, and the causal mask limits which positions are accessible at each position.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#475569"/></marker></defs><rect x="1" y="1" width="898" height="518" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212B" text-anchor="start">From system to accessible context</text><rect x="28" y="72" width="236" height="230" rx="12" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.5"/><text x="46" y="104" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0369A1" text-anchor="start">1 · Available sources</text><text x="48" y="139" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#17212B" text-anchor="start">• Instructions</text><text x="48" y="164" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#17212B" text-anchor="start">• User question</text><text x="48" y="189" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#17212B" text-anchor="start">• Relevant history</text><text x="48" y="214" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#17212B" text-anchor="start">• Retrieved documents</text><text x="48" y="239" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#17212B" text-anchor="start">• Tool results</text><text x="48" y="264" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#17212B" text-anchor="start">• Task state / memory</text><path d="M268 185 L320 185" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="326" y="72" width="246" height="230" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="344" y="104" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#15803D" text-anchor="start">2 · Assemble context</text><text x="348" y="145" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Select</text><text x="348" y="174" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Filter and verify</text><text x="348" y="203" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Prioritize</text><text x="348" y="232" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Summarize / update</text><text x="348" y="261" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Structure roles</text><path d="M576 185 L626 185" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="632" y="72" width="240" height="230" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="650" y="104" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#B45309" text-anchor="start">3 · Supplied sequence</text><rect x="652" y="124" width="198" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="751" y="143" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212B" text-anchor="middle">Instructions</text><rect x="652" y="162" width="198" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="751" y="181" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212B" text-anchor="middle">Message</text><rect x="652" y="200" width="198" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="751" y="219" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212B" text-anchor="middle">Selected context</text><rect x="652" y="238" width="198" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="751" y="257" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212B" text-anchor="middle">Data / tools</text><text x="28" y="342" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Not everything stored is supplied · the window is a token budget.</text><rect x="28" y="374" width="844" height="88" rx="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/><text x="48" y="406" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#6D28D9" text-anchor="start">4 · Access at position t in a causal decoder</text><text x="48" y="438" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17212B" text-anchor="start">Query t can access the prefix up to t; future tokens are masked.</text><text x="28" y="492" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">System context ≠ input sequence ≠ positions accessible to a query.</text></svg>