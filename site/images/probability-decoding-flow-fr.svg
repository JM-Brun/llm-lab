<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Des logits au token choisi</title>
<desc id="desc">La chaîne de génération : logits, division facultative par la température, softmax, filtres top-k ou top-p facultatifs suivis d'une renormalisation, puis sélection par argmax ou échantillonnage. Pour les logits zéro et log trois, la distribution est 25 et 75 pour cent à température un, puis 36,6 et 63,4 pour cent à température deux. Le classement reste le même, mais la distribution s'aplatit.</desc>
<rect width="1200" height="680" rx="24" fill="#f7f9fc"/>
<text x="52" y="48" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#526b9c">FICHE DE RÉVISION · INFÉRENCE</text>
<text x="600" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172b4d">Des logits au token choisi</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="35" y="130" width="175" height="90" rx="14" fill="#e8eef8" stroke="#9aacc8"/><text x="122" y="166" font-size="19" font-weight="700" fill="#263d61">Logits</text><text x="122" y="194" font-size="14" fill="#526b9c">scores bruts</text>
<path d="M210 175H242" stroke="#64748b" stroke-width="3"/><path d="M235 168L244 175L235 182" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="245" y="130" width="185" height="90" rx="14" fill="#fff4df" stroke="#d9b56d"/><text x="337" y="166" font-size="18" font-weight="700" fill="#72501b">÷ température τ</text><text x="337" y="194" font-size="14" fill="#8a672b">facultatif</text>
<path d="M430 175H462" stroke="#64748b" stroke-width="3"/><path d="M455 168L464 175L455 182" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="465" y="130" width="170" height="90" rx="14" fill="#e5f3f1" stroke="#7bb7af"/><text x="550" y="166" font-size="19" font-weight="700" fill="#176b63">Softmax</text><text x="550" y="194" font-size="14" fill="#327d75">distribution</text>
<path d="M635 175H667" stroke="#64748b" stroke-width="3"/><path d="M660 168L669 175L660 182" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="670" y="130" width="225" height="90" rx="14" fill="#fff" stroke="#9aacc8"/><text x="782" y="166" font-size="18" font-weight="700" fill="#263d61">Top-k / top-p</text><text x="782" y="194" font-size="14" fill="#526b9c">facultatifs + renormalisation</text>
<path d="M895 175H927" stroke="#64748b" stroke-width="3"/><path d="M920 168L929 175L920 182" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="930" y="130" width="235" height="90" rx="14" fill="#e9eafa" stroke="#a3a6d1"/><text x="1047" y="166" font-size="18" font-weight="700" fill="#42457d">Sélection</text><text x="1047" y="194" font-size="14" fill="#6265a0">argmax ou échantillonnage</text>
</g>
<text x="600" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#526b9c">EXEMPLE NUMÉRIQUE · LOGITS z = (0, ln 3)</text>
<rect x="45" y="295" width="535" height="290" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="620" y="295" width="535" height="290" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="312" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d61">τ = 1 · distribution initiale</text>
<text x="887" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d61">τ = 2 · distribution plus plate</text>
<g font-family="Arial,sans-serif" font-size="15" fill="#334155">
<text x="85" y="390">Token A</text><text x="85" y="470">Token B</text><text x="660" y="390">Token A</text><text x="660" y="470">Token B</text>
</g>
<g>
<rect x="190" y="365" width="320" height="30" rx="7" fill="#edf1f6"/><rect x="190" y="365" width="80" height="30" rx="7" fill="#0f8792"/><text x="280" y="386" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f6e76">25,0 %</text>
<rect x="190" y="445" width="320" height="30" rx="7" fill="#edf1f6"/><rect x="190" y="445" width="240" height="30" rx="7" fill="#315b9a"/><text x="440" y="466" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315b9a">75,0 %</text>
<rect x="765" y="365" width="320" height="30" rx="7" fill="#edf1f6"/><rect x="765" y="365" width="117" height="30" rx="7" fill="#0f8792"/><text x="892" y="386" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f6e76">36,6 %</text>
<rect x="765" y="445" width="320" height="30" rx="7" fill="#edf1f6"/><rect x="765" y="445" width="203" height="30" rx="7" fill="#315b9a"/><text x="978" y="466" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315b9a">63,4 %</text>
</g>
<text x="312" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526b9c">Token B reste le plus probable</text>
<text x="887" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526b9c">Le classement ne change pas</text>
<rect x="125" y="610" width="950" height="42" rx="12" fill="#e8eef8"/>
<text x="600" y="637" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#263d61">La température change les probabilités, pas l'ordre des logits ni les paramètres du modèle.</text>
</svg>