t x="28" y="340" width="600" height="145" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="52" y="378" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17212B">One illustrative target</text><text x="52" y="420" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15803D">p(target) = 0.6  →  −ln(0.6) ≈ 0.511 nats</text><text x="52" y="454" font-family="Arial,sans-serif" font-size="17" fill="#475569">Logit gradient: (−0.4, 0.2, 0.1, 0.1)</text><rect x="652" y="340" width="600" height="145" rx="18" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="676" y="378" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0369A1">Validation: measure, do not update</text><text x="676" y="420" font-family="Arial,sans-serif" font-size="17" fill="#17212B">Held-out batch → forward pass → validation loss</text><text x="676" y="454" font-family="Arial,sans-serif" font-size="15" fill="#475569">Current parameters are fixed for evaluation; no gradient or update</text><path d="M1140 314 V326 H1120" stroke="#15803D" stroke-width="2" fill="none"/><rect x="28" y="520" width="1224" height="58" rx="14" fill="#DCFCE7"/><path d="M55 549 H90" stroke="#15803D" stroke-width="3"/><path d="M82 541 L90 549 L82 557" stroke="#15803D" stroke-width="3" fill="none"/><text x="110" y="556" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#15803D">Next batch uses θₖ₊₁ · repeat</text></svg>