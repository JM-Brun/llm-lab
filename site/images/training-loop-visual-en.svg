<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc"><title id="title">One training update</title><desc id="desc">Only the optimizer step changes parameters. Training batch, Prefixes + next-token, targets; Forward pass, Logits with current, parameters θₖ; Loss, Per-token cross-entropy, + target mask; Backpropagation, Gradient ∇θ L(θₖ), ; Optimizer update, θₖ → θₖ₊₁, . Validation: measure, do not update: Held-out batch → forward pass → validation loss. Current parameters are fixed for evaluation; no gradient or update.</desc><rect width="1280" height="610" rx="24" fill="#F8FAFC"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.2" fill="#15803D">LEARNING · ONE STEP</text><text x="36" y="103" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17212B">One training update</text><text x="36" y="132" font-family="Arial,sans-serif" font-size="18" fill="#475569">Only the optimizer step changes parameters</text><rect x="28" y="154" width="210" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="28" y="154" width="8" height="150" rx="4" fill="#64748B"/><text x="48" y="192" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17212B">Training batch</text><text x="48" y="232" font-family="Arial,sans-serif" font-size="16" fill="#475569">Prefixes + next-token</text><text x="48" y="258" font-family="Arial,sans-serif" font-size="16" fill="#475569">targets</text><path d="M243 229 H268" stroke="#64748B" stroke-width="3" fill="none"/><path d="M259 222 L268 229 L259 236" stroke="#64748B" stroke-width="3" fill="none"/><rect x="278" y="154" width="210" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="278" y="154" width="8" height="150" rx="4" fill="#64748B"/><text x="298" y="192" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17212B">Forward 