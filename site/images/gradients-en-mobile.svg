<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 830" role="img" aria-labelledby="title desc"><title id="title">From loss to parameters</title><desc id="desc">The forward pass computes logits, probabilities and loss. Backpropagation applies the chain rule to compute gradients with respect to logits and then parameters. The optimizer applies a separate update rule.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#475569"/></marker></defs><rect x="1" y="1" width="478" height="828" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><text x="24" y="40" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17212B" text-anchor="start">From loss to parameters</text><rect x="70" y="78" width="340" height="58" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="240" y="114" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15803D" text-anchor="middle">Parameters θ</text><path d="M240 138 L240 158" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="70" y="166" width="340" height="58" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="240" y="202" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15803D" text-anchor="middle">Logits z</text><path d="M240 226 L240 246" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="70" y="254" width="340" height="58" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="240" y="290" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15803D" text-anchor="middle">Probabilities p</text><path d="M240 314 L240 334" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="70" y="342" width="340" height="58" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="240" y="378" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15803D" text-anchor="middle">Local losses</text><path d="M240 402 L240 422" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="70" y="430" width="340" height="58" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="240" y="466" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">Loss L</text><text x="24" y="542" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="start">Forward pass: θ to loss</text><rect x="24" y="578" width="432" height="66" rx="12" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.5"/><text x="240" y="618" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0369A1" text-anchor="middle">Backpropagation · ∇z L then ∇θ L</text><rect x="24" y="674" width="432" height="74" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="240" y="704" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">Optimizer: applies the update</text><text x="240" y="730" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">θ ← θ − ηg (SGD)</text><text x="24" y="790" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Computing gradients and changing θ are distinct steps.</text></svg>