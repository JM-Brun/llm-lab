<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">Comparaison des architectures Transformer</title><desc id="d">L'encodeur seul utilise une auto-attention bidirectionnelle. Le décodeur seul utilise une auto-attention causale. L'encodeur-décodeur combine l'auto-attention de l'encodeur, l'auto-attention causale du décodeur et l'attention croisée des requêtes du décodeur vers les clés et valeurs de l'encodeur.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#475569"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#15803d"/></marker><style>
.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.h{font:700 24px system-ui;fill:#0f172a}.s{font:15px system-ui;fill:#475569}.b{fill:#e2e8f0;stroke:#64748b;stroke-width:1.5}.e{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.d{fill:#dcfce7;stroke:#15803d;stroke-width:2}.m{fill:#fef3c7;stroke:#d97706;stroke-width:2}.l{font:600 16px system-ui;fill:#0f172a}.sm{font:13px system-ui;fill:#334155}.ar{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}.cr{stroke:#15803d;stroke-width:3.5;fill:none;marker-end:url(#g)}
</style></defs><rect width="1200" height="680" fill="#fff"/>
<text x="600" y="40" text-anchor="middle" class="h">Trois architectures Transformer · trois flux d'information</text>
<rect x="25" y="70" width="350" height="560" rx="16" class="panel"/><text x="200" y="110" text-anchor="middle" class="h">1 · Encodeur seul</text><text x="200" y="137" text-anchor="middle" class="s">Représenter l'entrée entière</text>
<rect x="85" y="175" width="230" height="58" rx="9" class="b"/><text x="200" y="199" text-anchor="middle" class="l">Séquence d'entrée</text><text x="200" y="220" text-anchor="middle" class="sm">x₁ · x₂ · x₃ · x₄</text><path d="M200 233V285" class="ar"/>
<rect x="65" y="285" width="270" height="108" rx="11" class="e"/><text x="200" y="320" text-anchor="middle" class="l">Auto-attention</text><text x="200" y="348" text-anchor="middle" class="sm">Q, K, V de la même entrée</text><text x="200" y="373" text-anchor="middle" class="sm">Bidirectionnelle · sans masque causal</text><path d="M200 393V450" class="ar"/>
<rect x="85" y="450" width="230" height="66" rx="9" class="b"/><text x="200" y="479" text-anchor="middle" class="l">États contextualisés</text><text x="200" y="500" text-anchor="middle" class="sm">toutes les positions d'entrée</text><text x="200" y="575" text-anchor="middle" class="s">Pas de décodeur séparé</text>
<rect x="425" y="70" width="350" height="560" rx="16" class="panel"/><text x="600" y="110" text-anchor="middle" class="h">2 · Décodeur seul</text><text x="600" y="137" text-anchor="middle" class="s">Prolonger un préfixe</text>
<rect x="485" y="175" width="230" height="58" rx="9" class="b"/><text x="600" y="199" text-anchor="middle" class="l">Préfixe disponible</text><text x="600" y="220" text-anchor="middle" class="sm">x₁ · x₂ · x₃ · x₄</text><path d="M600 233V285" class="ar"/>
<rect x="465" y="285" width="270" height="108" rx="11" class="d"/><text x="600" y="320" text-anchor="middle" class="l">Auto-attention causale</text><text x="600" y="348" text-anchor="middle" class="sm">Q, K, V du même préfixe</text><text x="600" y="373" text-anchor="middle" class="sm">Positions futures masquées</text><path d="M600 393V450" class="ar"/>
<rect x="485" y="450" width="230" height="66" rx="9" class="b"/><text x="600" y="479" text-anchor="middle" class="l">Scores du prochain token</text><text x="600" y="500" text-anchor="middle" class="sm">prédire x₅, puis continuer</text><text x="600" y="575" text-anchor="middle" class="s">Pas de mémoire d'encodeur</text>
<rect x="825" y="70" width="350" height="560" rx="16" class="panel"/><text x="1000" y="110" text-anchor="middle" class="h">3 · Encodeur–décodeur</text><text x="1000" y="137" text-anchor="middle" class="s">Générer depuis l'entrée encodée</text>
<rect x="845" y="165" width="135" height="52" rx="8" class="b"/><text x="912" y="187" text-anchor="middle" class="l">Source</text><text x="912" y="207" text-anchor="middle" class="sm">x₁ … xₙ</text><path d="M912 217V248" class="ar"/>
<rect x="845" y="248" width="135" height="74" rx="9" class="e"/><text x="912" y="278" text-anchor="middle" class="l">Encodeur</text><text x="912" y="301" text-anchor="middle" class="sm">auto-attention</text><path d="M912 322V352" class="ar"/>
<rect x="845" y="352" width="135" height="58" rx="9" class="m"/><text x="912" y="377" text-anchor="middle" class="l">Mémoire</text><text x="912" y="397" text-anchor="middle" class="sm">états de l'encodeur</text>
<rect x="1010" y="165" width="145" height="52" rx="8" class="b"/><text x="1082" y="187" text-anchor="middle" class="l">Préfixe cible</text><text x="1082" y="207" text-anchor="middle" class="sm">y₁ … yₜ₋₁</text><path d="M1082 217V248" class="ar"/>
<rect x="1000" y="248" width="165" height="74" rx="9" class="d"/><text x="1082" y="278" text-anchor="middle" class="l">Auto-attn. causale</text><text x="1082" y="301" text-anchor="middle" class="sm">Q, K, V de la cible</text><path d="M1082 322V352" class="ar"/>
<rect x="1000" y="352" width="165" height="86" rx="9" class="d"/><text x="1082" y="382" text-anchor="middle" class="l">Attention croisée</text><text x="1082" y="405" text-anchor="middle" class="sm">Q du décodeur</text><text x="1082" y="425" text-anchor="middle" class="sm">K, V de l'encodeur</text><path d="M980 381C990 381 990 393 1000 393" class="cr"/><path d="M1082 438V470" class="ar"/>
<rect x="1010" y="470" width="145" height="55" rx="8" class="b"/><text x="1082" y="493" text-anchor="middle" class="l">Prochain token</text><text x="1082" y="514" text-anchor="middle" class="sm">yₜ</text><text x="1000" y="575" text-anchor="middle" class="s">Deux flux · un lien d'attention croisée</text>
<text x="600" y="660" text-anchor="middle" class="sm">Attention croisée : les requêtes viennent d'une séquence, les clés et valeurs d'une autre.</text></svg>
