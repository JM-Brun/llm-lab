<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc"><title id="title">Trois distributions, trois entropies</title><desc id="desc">Une distribution concentrée (100, 0, 0, 0 %) a une entropie nulle ; l’exemple (60, 20, 10, 10 %) a une entropie de 1,089 nat ; la distribution uniforme (25 % chacun) atteint le maximum de 1,386 nats.</desc><rect width="720" height="1500" rx="24" fill="#f8fafc"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172b4d">Trois distributions, trois entropies</text><text x="36" y="100" font-family="Arial,sans-serif" font-size="19" fill="#526b9c">Quatre tokens possibles · logarithme naturel</text><rect x="35" y="145" width="650" height="365" rx="18" fill="#fff" stroke="#15803D" stroke-width="2"/><text x="70" y="193" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#15803D">Concentrée</text><text x="70" y="255" font-family="Arial,sans-serif" font-size="19" fill="#334155">Être</text><rect x="190" y="231" width="370" height="28" rx="7" fill="#e2e8f0"/><rect x="190" y="231" width="370" height="28" rx="7" fill="#15803D"/><text x="625" y="253" text-anchor="end" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334155">100%</text><text x="70" y="307" font-family="Arial,sans-serif" font-size="19" fill="#334155">Vous</text><rect x="190" y="283" width="370" height="28" rx="7" fill="#e2e8f0"/><rect x="190" y="283" width="0" height="28" rx="7" fill="#15803D"/><text x="625" y="305" text-anchor="end" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334155">0%</text><text x="70" y="359" font-family="Arial,sans-serif" font-size="19" fill="#334155">Oui</text><rect x="190" y="335" width="370" height="28" rx="7" fill="#e2e8f0"/><rect x="190" y="335" width="0" height="28" rx="7" fill="#15803D"/><text x="625" y="357" text-anchor="end" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334155">0%</text><text x="70" y="411" font-family="Arial,sans-serif" font-size="19" fill="#334155">Non</text><rect x="190" y="387" width="370" height="28" rx="7" fill="#e2e8f0"/><rect x="190" y="387" width="0" height="28" rx="7" fill="#15803D"/><text x="625" y="409" text-anchor="end" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334155">0%</text><text x="70" y="475" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Entropie H(p)</text><text x="625" y="477" text-anchor="end" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#15803D">0 nat</text><rect x="35" y="560" width="650" height="365" rx="18" fill="#fff" stroke="#15803D" stroke-width="2"/><text x="70" y="608" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#15803D">Exemple du scribe</text><text x="70" y="670" font-family="Arial,sans-serif" font-size="19" fill="#334155">Être</text><rect x="190" y="646" width="370" height="28" rx="7" fill="#e2e8f0"/><rect x="190" y="646" width="222" height="28" rx="7" fill="#15803D"/><text x="625" y="668" text-anchor="end" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334155">60%</text><text x="70" y="722" font-family="Arial,sans-serif" font-size="19" fill="#334155">Vous</text><rect x="190" y="698" width="370" height="28" rx="7" fill="#e2e8f0"/><rect x="190" y="698" width="74" height="28" rx="7" fill="#15803D"/><text x="625" y="720" text-anchor="end" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334155">20%</text><text x="70" y="774" font-family="Arial,sans-serif" font-size="19" fill="#334155">Oui</text><rect x="190" y="750" width="370" height="28" rx="7" fill="#e2e8f0"/><rect x="190" y="750" width="37" height="28" rx="7" fill="#15803D"/><text x="625" y="772" text-anchor="end" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334155">10%</text><text x="70" y="826" font-family="Arial,sans-serif" font-size="19" fill="