ct x="190" y="1217" width="92.5" height="28" rx="7" fill="#315b9a"/><text x="625" y="1239" text-anchor="end" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334155">25%</text><text x="70" y="1305" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Entropie H(p)</text><text x="625" y="1307" text-anchor="end" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#315b9a">1,386 nats</text><text x="36" y="1395" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#172b4d">Maximum : ln(4) ≈ 1,386 nats</text><text x="36" y="1435" font-family="Arial,sans-serif" font-size="18" fill="#475569">L’entropie résume la dispersion de toute la distribution.</text></svg>