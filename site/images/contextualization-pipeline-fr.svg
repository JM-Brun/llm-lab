<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
<title id="title">Pipeline du texte aux représentations contextualisées</title>
<desc id="desc">Le texte est tokenisé, converti en IDs, transformé en vecteurs par lookup, traité selon la position, puis contextualisé par les blocs Transformer.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#52665a"/></marker></defs>
<style>.label{font:600 12.5px system-ui,sans-serif;fill:#1f3528}.sub{font:12px system-ui,sans-serif;fill:#52665a}</style>
<path d="M 165 90 H 182" fill="none" stroke="#52665a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 335 90 H 352" fill="none" stroke="#52665a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 505 90 H 522" fill="none" stroke="#52665a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 675 90 H 692" fill="none" stroke="#52665a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 845 90 H 862" fill="none" stroke="#52665a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 1015 90 H 1032" fill="none" stroke="#52665a" stroke-width="2.5" marker-end="url(#arrow)"/><g transform="translate(20,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#f5f7f6" stroke="#789184" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">Texte</text><text x="70" y="111" text-anchor="middle" class="sub">séquence brute</text></g><g transform="translate(190,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#f5f7f6" stroke="#789184" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">Tokenisation</text><text x="70" y="111" text-anchor="middle" class="sub">tokens</text></g><g transform="translate(360,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#f5f7f6" stroke="#789184" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">IDs de tokens</text><text x="70" y="111" text-anchor="middle" class="sub">indices entiers</text></g><g transform="translate(530,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#f5f7f6" stroke="#789184" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">Lookup d’embedding</text><text x="70" y="111" text-anchor="middle" class="sub">E[ID]</text></g><g transform="translate(700,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#f5f7f6" stroke="#789184" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">Traitement positionnel</text><text x="70" y="111" text-anchor="middle" class="sub">selon l’architecture</text></g><g transform="translate(870,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#f5f7f6" stroke="#789184" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">Blocs Transformer</text><text x="70" y="111" text-anchor="middle" class="sub">attention + MLP</text></g><g transform="translate(1040,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#e7f3eb" stroke="#28734b" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">États contextualisés</text><text x="70" y="111" text-anchor="middle" class="sub">hₜ⁽ˡ⁾</text></g></svg>