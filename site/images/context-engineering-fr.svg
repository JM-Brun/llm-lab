<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Du système au contexte accessible</title><desc id="desc">L'application conserve plusieurs sources, en sélectionne certaines pour construire la séquence transmise au modèle, puis le masque causal limite les positions accessibles à chaque position.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#475569"/></marker></defs><rect x="1" y="1" width="898" height="518" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212B" text-anchor="start">Du système au contexte accessible</text><rect x="28" y="72" width="236" height="230" rx="12" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.5"/><text x="46" y="104" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0369A1" text-anchor="start">1 · Sources disponibles</text><text x="48" y="139" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#17212B" text-anchor="start">• Instructions</text><text x="48" y="164" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#17212B" text-anchor="start">• Question utilisateur</text><text x="48" y="189" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#17212B" text-anchor="start">• Historique utile</text><text x="48" y="214" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#17212B" text-anchor="start">• Documents récupérés</text><text x="48" y="239" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#17212B" text-anchor="start">• Résultats d'outils</text><text x="48" y="264" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#17212B" text-anchor="start">• État de tâche / mémoire</text><path d="M268 185 L320 185" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="326" y="72" width="246" height="230" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="344" y="104" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#15803D" text-anchor="start">2 · Construire le contexte</text><text x="348" y="145" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Sélectionner</text><text x="348" y="174" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Filtrer et vérifier</text><text x="348" y="203" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Prioriser</text><text x="348" y="232" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Résumer / actualiser</text><text x="348" y="261" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Organiser les rôles</text><path d="M576 185 L626 185" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="632" y="72" width="240" height="230" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="650" y="104" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#B45309" text-anchor="start">3 · Séquence transmise</text><rect x="652" y="124" width="198" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="751" y="143" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212B" text-anchor="middle">Instructions</text><rect x="652" y="162" width="198" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="751" y="181" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212B" text-anchor="middle">Message</text><rect x="652" y="200" width="198" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="751" y="219" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212B" text-anchor="middle">Contexte retenu</text><rect x="652" y="238" width="198" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="751" y="257" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212B" text-anchor="middle">Données / outils</text><text x="28" y="342" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Tout ce qui est stocké n'est pas transmis · la fenêtre fixe un budget en tokens.</text><rect x="28" y="374" width="844" height="88" rx="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/><text x="48" y="406" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#6D28D9" text-anchor="start">4 · Accès à la position t dans un décodeur causal</text><text x="48" y="438" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17212B" text-anchor="start">La requête t peut consulter le préfixe jusqu'à t ; les tokens futurs sont masqués.</text><text x="28" y="492" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Contexte système ≠ séquence d'entrée ≠ positions accessibles à une requête.</text></svg>