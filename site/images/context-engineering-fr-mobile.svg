<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 830" role="img" aria-labelledby="title desc"><title id="title">Du système au contexte accessible</title><desc id="desc">L'application conserve plusieurs sources, en sélectionne certaines pour construire la séquence transmise au modèle, puis le masque causal limite les positions accessibles à chaque position.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#475569"/></marker></defs><rect x="1" y="1" width="478" height="828" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><text x="24" y="40" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17212B" text-anchor="start">Du système au contexte accessible</text><rect x="24" y="76" width="432" height="190" rx="12" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.5"/><text x="44" y="107" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0369A1" text-anchor="start">1 · Sources disponibles</text><text x="48" y="140" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Instructions</text><text x="48" y="165" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Question</text><text x="48" y="190" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Historique</text><text x="48" y="215" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Documents</text><text x="48" y="240" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Outils / état</text><rect x="24" y="300" width="432" height="188" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="44" y="331" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#15803D" text-anchor="start">2 · Sélection et organisation</text><text x="48" y="364" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Sélectionner</text><text x="48" y="389" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Filtrer / vérifier</text><text x="48" y="414" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Prioriser</text><text x="48" y="439" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Résumer / actualiser</text><rect x="24" y="522" width="432" height="154" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="44" y="553" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#B45309" text-anchor="start">3 · Séquence transmise</text><text x="48" y="586" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Instructions + message</text><text x="48" y="611" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Contexte retenu</text><text x="48" y="636" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">• Données / outils</text><path d="M240 268 L240 292" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M240 490 L240 514" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M240 678 L240 702" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="712" width="432" height="88" rx="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/><text x="44" y="744" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#6D28D9" text-anchor="start">4 · À la position t : préfixe ≤ t</text><text x="44" y="776" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17212B" text-anchor="start">Les tokens futurs sont masqués.</text></svg>