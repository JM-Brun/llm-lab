<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Softmax over axis V or T</title>
  <desc id="desc">Normalizing over the vocabulary gives a sum of one per position. Normalizing over positions gives a row sum of 1.5 in this example.</desc>
  <rect width="1120" height="440" rx="18" fill="#f7f9fc"/>
  <text x="34" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17324d">Same shape, different question</text>
  <text x="34" y="72" font-family="Arial,sans-serif" font-size="15" fill="#52677c">logits (B=1, T=2, V=3): [2, 1, 0] and [0, 1, 2]</text>
  <rect x="28" y="95" width="520" height="300" rx="14" fill="#ffffff" stroke="#b7dacc" stroke-width="2"/>
  <rect x="572" y="95" width="520" height="300" rx="14" fill="#ffffff" stroke="#e5c7a2" stroke-width="2"/>
  <g font-family="Arial,sans-serif" fill="#17324d">
    <text x="52" y="130" font-size="20" font-weight="700" fill="#23785f">Correct: softmax over V</text>
    <text x="52" y="155" font-size="15">Distribution over tokens, at each position</text>
    <text x="74" y="188" font-size="14" fill="#52677c">T \ V</text><text x="188" y="188" font-size="14" text-anchor="middle">token 1</text><text x="276" y="188" font-size="14" text-anchor="middle">token 2</text><text x="364" y="188" font-size="14" text-anchor="middle">token 3</text>
    <g fill="#d9efe8" stroke="#26856c" stroke-width="1.5"><rect x="148" y="198" width="80" height="46" rx="5"/><rect x="236" y="198" width="80" height="46" rx="5"/><rect x="324" y="198" width="80" height="46" rx="5"/><rect x="148" y="250" width="80" height="46" rx="5"/><rect x="236" y="250" width="80" height="46" rx="5"/><rect x="324" y="250" width="80" height="46" rx="5"/></g>
    <g font-size="17" text-anchor="middle"><text x="112" y="227">pos 0</text><text x="112" y="279">pos 1</text><text x="188" y="227">0.665</text><text x="276" y="227">0.245</text><text x="364" y="227">0.090</text><text x="188" y="279">0.090</text><text x="276" y="279">0.245</text><text x="364" y="279">0.665</text></g>
    <text x="430" y="223" font-size="16" font-weight="700" fill="#23785f">Σ = 1</text><text x="430" y="275" font-size="16" font-weight="700" fill="#23785f">Σ = 1</text>
    <text x="52" y="337" font-size="15" font-weight="700" fill="#23785f">Invariant: each position sums to 1 over V</text>
    <text x="596" y="130" font-size="20" font-weight="700" fill="#a15c19">Wrong for this goal: softmax over T</text>
    <text x="596" y="155" font-size="15">Distributes mass across positions, token by token</text>
    <text x="618" y="188" font-size="14" fill="#52677c">T \ V</text><text x="732" y="188" font-size="14" text-anchor="middle">token 1</text><text x="820" y="188" font-size="14" text-anchor="middle">token 2</text><text x="908" y="188" font-size="14" text-anchor="middle">token 3</text>
    <g fill="#fff1cc" stroke="#c58a18" stroke-width="1.5"><rect x="692" y="198" width="80" height="46" rx="5"/><rect x="780" y="198" width="80" height="46" rx="5"/><rect x="868" y="198" width="80" height="46" rx="5"/><rect x="692" y="250" width="80" height="46" rx="5"/><rect x="780" y="250" width="80" height="46" rx="5"/><rect x="868" y="250" width="80" height="46" rx="5"/></g>
    <g font-size="17" text-anchor="middle"><text x="656" y="227">pos 0</text><text x="656" y="279">pos 1</text><text x="732" y="227">0.881</text><text x="820" y="227">0.500</text><text x="908" y="227">0.119</text><text x="732" y="279">0.119</text><text x="820" y="279">0.500</text><text x="908" y="279">0.881</text></g>
    <text x="972" y="223" font-size="16" font-weight="700" fill="#a15c19">Σ = 1.5</text><text x="972" y="275" font-size="16" font-weight="700" fill="#a15c19">Σ = 1.5</text>
    <text x="596" y="337" font-size="15" font-weight="700" fill="#a15c19">Shape alone does not reveal the semantic error</text>
  </g>
  <text x="34" y="422" font-family="Arial,sans-serif" font-size="14" fill="#52677c">Values are rounded; the correct axis depends on the distribution you intend to represent.</text>
</svg>