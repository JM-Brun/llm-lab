<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1980" viewBox="0 0 720 1980" role="img" aria-labelledby="title desc"><title id="title">How an autoregressive LLM generates text</title><desc id="desc">From the supplied prefix to the next token, then back with the extended context. Six stages show input, tokenization, initial representations, Transformer computation, next-token distribution and decoding. The selected token is appended and the next pass uses the extended sequence.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#315f9f"/></marker></defs><rect width="720" height="1980" rx="24" fill="#fff"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172b4d">How an autoregressive LLM generates text</text><text x="36" y="103" font-family="Arial,sans-serif" font-size="18" fill="#52647f">From the supplied prefix to the next token, then back with the extended context.</text><rect x="40" y="150" width="640" height="205" rx="18" fill="#f1f6ff" stroke="#9dbcf0" stroke-width="2"/><circle cx="78" cy="192" r="23" fill="#2866b8"/><text x="78" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">1</text><text x="118" y="199" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172b4d">1 · Input text</text><text x="75" y="255" font-family="Arial,sans-serif" font-size="19" fill="#334155">The prompt and context already available.</text><path d="M360 355V387" stroke="#315f9f" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="395" width="640" height="205" rx="18" fill="#f7f2ff" stroke="#c7b1ee" stroke-width="2"/><circle cx="78" cy="437" r="23" fill="#7046b8"/><text x="78" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">2</text><text x="118" y="444" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172b4d">2 · Tokenization</text><text x="75" y="500" font-family="Arial,sans-serif" font-size="19" fill="#334155">The tokenizer splits text and assigns an ID to each token.</text><rect x="75" y="525" width="570" height="45" rx="9" fill="#fff" stroke="#c7b1ee"/><text x="360" y="554" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">IDs: 17 · 204 · …</text><path d="M360 600V632" stroke="#315f9f" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="640" width="640" height="205" rx="18" fill="#eff8ff" stroke="#a9cfe7" stroke-width="2"/><circle cx="78" cy="682" r="23" fill="#2876a8"/><text x="78" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">3</text><text x="118" y="689" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172b4d">3 · Initial representations</text><text x="75" y="745" font-family="Arial,sans-serif" font-size="19" fill="#334155">IDs select embeddings; positional handling depends on the architecture.</text><path d="M360 845V877" stroke="#315f9f" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="885" width="640" height="205" rx="18" fill="#f0faf4" stroke="#9bd3b2" stroke-width="2"/><circle cx="78" cy="927" r="23" fill="#238653"/><text x="78" y="935" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">4</text><text x="118" y="934" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172b4d">4 · Transformer computation</text><text x="75" y="990" font-family="Arial,sans-serif" font-size="19" fill="#334155">Causal attention, MLP, residual connections and normalization, repeated across blocks.</text><path d="M360 1090V1122" stroke="#315f9f" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="1130" width="640" height="205" rx="18" fill="#fff8e9" stroke="#e8c77f" stroke-width="2"/><circle cx="78" cy="1172" r="23" fill="#ad7a16"/><text x="78" y="1180" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">5</text><text x="118" y="1179" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172b4d">5 · Next-token distribution</text><text x="75" y="1235" font-family="Arial,sans-serif" font-size="19" fill="#334155">The output head produces logits; softmax gives one probability per vocabulary token.</text><text x="75" y="1275" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#7c5a18">Illustrative distribution : Vous 60 % · Aqueducs 20 % · autres 20 %</text><path d="M360 1335V1367" stroke="#315f9f" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="1375" width="640" height="205" rx="18" fill="#fff4ed" stroke="#efbd9a" stroke-width="2"/><circle cx="78" cy="1417" r="23" fill="#d9782a"/><text x="78" y="1425" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">6</text><text x="118" y="1424" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172b4d">6 · Decoding</text><text x="75" y="1480" font-family="Arial,sans-serif" font-size="19" fill="#334155">A rule selects one token, whose ID is appended to the sequence.</text><path d="M360 1580V1820H20V740H35" stroke="#315f9f" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="50" y="1880" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315f9f">Resume at stage 3 with the extended context</text><text x="50" y="1920" font-family="Arial,sans-serif" font-size="16" fill="#52647f">Probabilities are illustrative. Tokenizer and architecture vary by model.</text></svg>