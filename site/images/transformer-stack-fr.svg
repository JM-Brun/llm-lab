<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Architecture d'un GPT décodeur seul et détail d'un bloc Transformer</title>
<desc id="desc">À gauche, les identifiants de tokens deviennent des embeddings enrichis d'information positionnelle, traversent une pile de N blocs Transformer, puis une normalisation finale et une projection vers le vocabulaire produisent les logits. À droite, un bloc pré-LN est agrandi : normalisation, attention multi-têtes causale, addition résiduelle, normalisation, MLP position par position et seconde addition résiduelle.</desc>
<defs>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker>
 <marker id="dash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7c3aed"/></marker>
 <style>
 .title{font:700 30px system-ui,sans-serif;fill:#0f172a}.paneltitle{font:700 23px system-ui,sans-serif;fill:#0f172a}
 .label{font:650 17px system-ui,sans-serif;fill:#172554}.small{font:14px system-ui,sans-serif;fill:#334155}.tiny{font:12px system-ui,sans-serif;fill:#475569}
 .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.input{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.stack{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.norm{fill:#fef3c7;stroke:#d97706;stroke-width:1.8}.attn{fill:#dbeafe;stroke:#2563eb;stroke-width:1.8}.mlp{fill:#dcfce7;stroke:#16a34a;stroke-width:1.8}.out{fill:#ffe4e6;stroke:#e11d48;stroke-width:1.8}.res{stroke:#64748b;stroke-width:2.4;fill:none;marker-end:url(#arr)}.zoom{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#dash)}
 </style>
</defs>
<rect width="1440" height="900" fill="#ffffff"/>
<text x="720" y="48" text-anchor="middle" class="title">Dans un GPT, le Transformer est le réseau de blocs empilés</text>
<rect x="30" y="82" width="535" height="770" rx="18" class="panel"/>
<text x="297" y="122" text-anchor="middle" class="paneltitle">Le modèle complet (vue simplifiée)</text>
<rect x="155" y="155" width="285" height="66" rx="11" class="input"/>
<text x="297" y="183" text-anchor="middle" class="label">Identifiants de tokens</text><text x="297" y="205" text-anchor="middle" class="small">[x₁, x₂, …, xₜ]</text>
<path d="M297 221V250" class="res"/>
<rect x="155" y="250" width="285" height="75" rx="11" class="input"/>
<text x="297" y="280" text-anchor="middle" class="label">Embeddings + positions</text><text x="297" y="304" text-anchor="middle" class="small">vecteurs d'entrée (B × T × d)</text>
<path d="M297 325V355" class="res"/>
<rect x="115" y="355" width="365" height="235" rx="14" class="stack"/>
<text x="297" y="386" text-anchor="middle" class="label">Transformer · pile de N blocs</text>
<rect x="155" y="405" width="285" height="42" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="297" y="432" text-anchor="middle" class="label">Bloc Transformer 1</text>
<rect x="155" y="458" width="285" height="42" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="297" y="485" text-anchor="middle" class="label">Bloc Transformer 2</text>
<text x="297" y="525" text-anchor="middle" class="paneltitle">⋮</text>
<rect x="155" y="540" width="285" height="36" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="297" y="564" text-anchor="middle" class="label">Bloc Transformer N</text>
<text x="297" y="612" text-anchor="middle" class="small">Chaque bloc reçoit la sortie du précédent</text>
<path d="M297 590V640" class="res"/>
<rect x="155" y="640" width="285" height="55" rx="10" class="norm"/>
<text x="297" y="674" text-anchor="middle" class="label">Normalisation finale</text>
<path d="M297 695V720" class="res"/>
<rect x="155" y="720" width="285" height="55" rx="10" class="out"/>
<text x="297" y="754" text-anchor="middle" class="label">Tête de sortie · projection vocabulaire</text>
<path d="M297 775V800" class="res"/>
<text x="297" y="827" text-anchor="middle" class="label">Logits · (B × T × V)</text>
<path d="M480 472C535 472 545 275 620 275" class="zoom"/>
<text x="548" y="350" text-anchor="middle" class="tiny" transform="rotate(-69 548 350)">agrandissement d'un bloc</text>
<rect x="620" y="82" width="790" height="770" rx="18" class="panel"/>
<text x="1015" y="122" text-anchor="middle" class="paneltitle">À l'intérieur d'un bloc Transformer (exemple pré-LN)</text>
<text x="1015" y="151" text-anchor="middle" class="small">La même séquence de positions traverse les deux sous-couches</text>
<rect x="680" y="185" width="165" height="58" rx="10" class="input"/>
<text x="762" y="209" text-anchor="middle" class="label">Entrée H⁽ˡ⁾</text><text x="762" y="230" text-anchor="middle" class="small">flux résiduel</text>
<path d="M845 214H885" class="res"/>
<rect x="885" y="185" width="145" height="58" rx="10" class="norm"/>
<text x="957" y="209" text-anchor="middle" class="label">LayerNorm</text><text x="957" y="230" text-anchor="middle" class="small">pré-LN</text>
<path d="M1030 214H1065" class="res"/>
<rect x="1065" y="185" width="190" height="58" rx="10" class="attn"/>
<text x="1160" y="209" text-anchor="middle" class="label">Attention multi-têtes</text><text x="1160" y="230" text-anchor="middle" class="small">masquée · causale</text>
<path d="M1255 214H1300" class="res"/>
<circle cx="1330" cy="214" r="23" fill="#fff" stroke="#64748b" stroke-width="2.2"/><text x="1330" y="222" text-anchor="middle" class="paneltitle">+</text>
<path d="M762 243V285H1330V237" class="res"/>
<text x="1045" y="278" text-anchor="middle" class="tiny">connexion résiduelle : entrée + sortie de l'attention</text>
<path d="M1330 237V360H762V405" class="res"/>
<text x="1040" y="340" text-anchor="middle" class="small">représentation intermédiaire H′</text>
<rect x="680" y="405" width="165" height="58" rx="10" class="input"/>
<text x="762" y="429" text-anchor="middle" class="label">Entrée H′</text><text x="762" y="450" text-anchor="middle" class="small">flux résiduel</text>
<path d="M845 434H885" class="res"/>
<rect x="885" y="405" width="145" height="58" rx="10" class="norm"/>
<text x="957" y="429" text-anchor="middle" class="label">LayerNorm</text><text x="957" y="450" text-anchor="middle" class="small">pré-LN</text>
<path d="M1030 434H1065" class="res"/>
<rect x="1065" y="405" width="190" height="58" rx="10" class="mlp"/>
<text x="1160" y="429" text-anchor="middle" class="label">MLP / feed-forward</text><text x="1160" y="450" text-anchor="middle" class="small">position par position</text>
<path d="M1255 434H1300" class="res"/>
<circle cx="1330" cy="434" r="23" fill="#fff" stroke="#64748b" stroke-width="2.2"/><text x="1330" y="442" text-anchor="middle" class="paneltitle">+</text>
<path d="M762 463V505H1330V457" class="res"/>
<text x="1045" y="498" text-anchor="middle" class="tiny">connexion résiduelle : entrée + sortie du MLP</text>
<path d="M1330 457V555" class="res"/>
<rect x="1150" y="555" width="180" height="58" rx="10" class="stack"/>
<text x="1240" y="579" text-anchor="middle" class="label">Sortie H⁽ˡ⁺¹⁾</text><text x="1240" y="600" text-anchor="middle" class="small">vers le bloc suivant</text>
<text x="1015" y="675" text-anchor="middle" class="label">Deux rôles complémentaires</text>
<rect x="700" y="700" width="300" height="92" rx="12" class="attn"/>
<text x="850" y="730" text-anchor="middle" class="label">Attention</text><text x="850" y="755" text-anchor="middle" class="small">mélange l'information entre positions</text><text x="850" y="777" text-anchor="middle" class="tiny">en respectant le masque causal</text>
<rect x="1030" y="700" width="340" height="92" rx="12" class="mlp"/>
<text x="1200" y="730" text-anchor="middle" class="label">MLP</text><text x="1200" y="755" text-anchor="middle" class="small">transforme chaque position séparément</text><text x="1200" y="777" text-anchor="middle" class="tiny">avec les mêmes poids à chaque position</text>
<text x="720" y="828" text-anchor="start" class="tiny">Schéma d'un GPT décodeur seul ; l'ordre pré-LN est un choix d'architecture courant, non universel.</text>
</svg>