<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">LLM training mathematics pipeline</title><desc id="desc">Logits are transformed into probabilities, the target probability gives negative log likelihood, token losses are aggregated, and gradients update model parameters.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#51627a"/></marker></defs>
<rect width="1200" height="300" rx="20" fill="#f7f9fc"/>
<g font-family="Inter, system-ui, sans-serif" text-anchor="middle" fill="#10233f">
<rect x="28" y="70" width="190" height="120" rx="16" fill="#eaf4f5" stroke="#087f8c" stroke-width="2"/>
<text x="123" y="105" font-size="23" font-weight="700">Logits</text><text x="123" y="139" font-size="18">z ∈ ℝᵛ</text><text x="123" y="164" font-size="14">raw scores</text>
<rect x="268" y="70" width="190" height="120" rx="16" fill="#eaf4f5" stroke="#087f8c" stroke-width="2"/>
<text x="363" y="105" font-size="23" font-weight="700">Softmax</text><text x="363" y="139" font-size="18">p ∈ Δᵛ⁻¹</text><text x="363" y="164" font-size="14">probability distribution</text>
<rect x="508" y="70" width="190" height="120" rx="16" fill="#fff4ef" stroke="#e27a5f" stroke-width="2"/>
<text x="603" y="105" font-size="23" font-weight="700">Target</text><text x="603" y="139" font-size="18">−log pᵧ</text><text x="603" y="164" font-size="14">negative log-likelihood</text>
<rect x="748" y="70" width="190" height="120" rx="16" fill="#fff4ef" stroke="#e27a5f" stroke-width="2"/>
<text x="843" y="105" font-size="23" font-weight="700">Loss</text><text x="843" y="139" font-size="18">𝓛(θ)</text><text x="843" y="164" font-size="14">aggregate valid tokens</text>
<rect x="988" y="70" width="184" height="120" rx="16" fill="#eaf4f5" stroke="#087f8c" stroke-width="2"/>
<text x="1080" y="105" font-size="23" font-weight="700">Gradient</text><text x="1080" y="139" font-size="18">∇θ 𝓛</text><text x="1080" y="164" font-size="14">parameter update</text>
</g>
<g stroke="#51627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M220 130 H260"/><path d="M460 130 H500"/><path d="M700 130 H740"/><path d="M940 130 H980"/></g>
<text x="600" y="240" font-family="Inter, system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#51627a">Training minimizes an objective built from observed next-token targets.</text>
</svg>