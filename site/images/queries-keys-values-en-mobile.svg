<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1190" role="img" aria-labelledby="title desc">
<title id="title">Q, K and V projections and attention computation</title>
<desc id="desc">Vertical small-screen view. Input X is projected into Q, K and V. Q and K determine scores and then attention weights; those weights are combined with V values to produce the output. Each Q, K and V card includes a schematic three-row, four-column matrix; the actual tensor dimensions are labelled below each matrix.</desc></desc>
<defs><linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8f8"/><stop offset="1" stop-color="#fff5ef"/></linearGradient><marker id="arrm" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3z" fill="#60758b"/></marker></defs>
<rect width="390" height="1190" rx="22" fill="url(#bgm)"/>
<text x="24" y="38" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#087f8c">SELF-ATTENTION · MOBILE VIEW</text>
<text x="24" y="70" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="750" fill="#10233f">One input, three projections</text>
<rect x="25" y="96" width="340" height="92" rx="14" fill="#fff" stroke="#cbd9e3" stroke-width="2"/>
<text x="195" y="126" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750" fill="#10233f">Shared input X</text>
<text x="195" y="151" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#51627a">representations at every position</text>
<text x="195" y="173" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#51627a">T × d_model</text>
<path d="M195 188 V218" stroke="#60758b" stroke-width="2.2" marker-end="url(#arrm)"/>
<text x="195" y="238" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#51627a">THREE LEARNED TRANSFORMATIONS</text>
<rect x="25" y="255" width="340" height="100" rx="14" fill="#dff2f1" stroke="#087f8c" stroke-width="2"/>
<text x="145" y="285" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#075d65">Q · Query</text>
<text x="145" y="311" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#24545a">what this position seeks</text>
<text x="145" y="337" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#24545a">Q = XW_Q</text><text x="307" y="318" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#075d65">T × d_k</text><g fill="#ffffff" stroke="#087f8c" stroke-width="1"><rect x="280" y="270" width="10" height="7" rx="1.5"/><rect x="293" y="270" width="10" height="7" rx="1.5"/><rect x="306" y="270" width="10" height="7" rx="1.5"/><rect x="319" y="270" width="10" height="7" rx="1.5"/><rect x="280" y="280" width="10" height="7" rx="1.5"/><rect x="293" y="280" width="10" height="7" rx="1.5"/><rect x="306" y="280" width="10" height="7" rx="1.5"/><rect x="319" y="280" width="10" height="7" rx="1.5"/><rect x="280" y="290" width="10" height="7" rx="1.5"/><rect x="293" y="290" width="10" height="7" rx="1.5"/><rect x="306" y="290" width="10" height="7" rx="1.5"/><rect x="319" y="290" width="10" height="7" rx="1.5"/></g>
<rect x="25" y="375" width="340" height="100" rx="14" fill="#e7edff" stroke="#617bc5" stroke-width="2"/>
<text x="145" y="405" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#29478e">K · Key</text>
<text x="145" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334c7d">what each position makes addressable</text>
<text x="145" y="457" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334c7d">K = XW_K</text><text x="307" y="438" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#29478e">T × d_k</text><g fill="#ffffff" stroke="#617bc5" stroke-width="1"><rect x="280" y="390" width="10" height="7" rx="1.5"/><rect x="293" y="390" width="10" height="7" rx="1.5"/><rect x="306" y="390" width="10" height="7" rx="1.5"/><rect x="319" y="390" width="10" height="7" rx="1.5"/><rect x="280" y="400" width="10" height="7" rx="1.5"/><rect x="293" y="400" width="10" height="7" rx="1.5"/><rect x="306" y="400" width="10" height="7" rx="1.5"/><rect x="319" y="400" width="10" height="7" rx="1.5"/><rect x="280" y="410" width="10" height="7" rx="1.5"/><rect x="293" y="410" width="10" height="7" rx="1.5"/><rect x="306" y="410" width="10" height="7" rx="1.5"/><rect x="319" y="410" width="10" height="7" rx="1.5"/></g>
<rect x="25" y="495" width="340" height="100" rx="14" fill="#fff0e8" stroke="#df8b67" stroke-width="2"/>
<text x="145" y="525" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#9b4e3c">V · Value</text>
<text x="145" y="551" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#7c5143">the content that can be aggregated</text>
<text x="145" y="577" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#7c5143">V = XW_V</text><text x="307" y="558" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#9b4e3c">T × d_v</text><g fill="#ffffff" stroke="#df8b67" stroke-width="1"><rect x="280" y="510" width="10" height="7" rx="1.5"/><rect x="293" y="510" width="10" height="7" rx="1.5"/><rect x="306" y="510" width="10" height="7" rx="1.5"/><rect x="319" y="510" width="10" height="7" rx="1.5"/><rect x="280" y="520" width="10" height="7" rx="1.5"/><rect x="293" y="520" width="10" height="7" rx="1.5"/><rect x="306" y="520" width="10" height="7" rx="1.5"/><rect x="319" y="520" width="10" height="7" rx="1.5"/><rect x="280" y="530" width="10" height="7" rx="1.5"/><rect x="293" y="530" width="10" height="7" rx="1.5"/><rect x="306" y="530" width="10" height="7" rx="1.5"/><rect x="319" y="530" width="10" height="7" rx="1.5"/></g>
<path d="M195 355 V615 H105 V646 M195 475 V615 H285 V646" fill="none" stroke="#60758b" stroke-width="2.2" marker-end="url(#arrm)"/>
<rect x="25" y="652" width="340" height="104" rx="14" fill="#fff" stroke="#a9b9c8" stroke-width="2"/>
<text x="195" y="682" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750" fill="#10233f">1 · Compare Q and K</text>
<text x="195" y="712" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#51627a">QKᵀ → scores</text>
<text x="195" y="738" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#51627a">scale by √d_k, then softmax</text>
<path d="M195 756 V786" stroke="#60758b" stroke-width="2.2" marker-end="url(#arrm)"/>
<rect x="25" y="792" width="340" height="94" rx="14" fill="#dff2f1" stroke="#087f8c" stroke-width="2"/>
<text x="195" y="824" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750" fill="#075d65">2 · Attention weights</text>
<text x="195" y="852" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#24545a">which positions to attend to more?</text>
<path d="M195 886 V918" stroke="#60758b" stroke-width="2.2" marker-end="url(#arrm)"/>
<path d="M195 595 H12 V977 H25" fill="none" stroke="#df8b67" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrm)"/>
<rect x="25" y="925" width="340" height="104" rx="14" fill="#fff" stroke="#a9b9c8" stroke-width="2"/>
<text x="195" y="956" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750" fill="#10233f">3 · Aggregate values V</text>
<text x="195" y="985" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#51627a">attention weights × value vectors</text>
<text x="195" y="1010" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#51627a">weighted sum</text>
<path d="M195 1029 V1060" stroke="#60758b" stroke-width="2.2" marker-end="url(#arrm)"/>
<rect x="25" y="1067" width="340" height="82" rx="14" fill="#10233f"/>
<text x="195" y="1098" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="750" fill="#fff">Attention output</text>
<text x="195" y="1128" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#fff">A = softmax(QKᵀ / √d_k) · O = AV</text>
<text x="195" y="1175" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#51627a">Q/K set the weights · V supplies the content</text>
</svg>