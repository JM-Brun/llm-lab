<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">Trois architectures de recherche</title><desc id="d">Le bi-encodeur encode séparément requête et document en un vecteur chacun. Le cross-encodeur concatène requête et candidat et calcule un score conjoint. L'interaction tardive encode séparément des vecteurs contextualisés par token, applique MaxSim entre tokens de requête et de document, puis somme les maxima.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L0 8L9 4z" fill="#475569"/></marker><style>
.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.q{fill:#dcfce7;stroke:#15803d;stroke-width:2}.d{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.m{fill:#fef3c7;stroke:#d97706;stroke-width:2}.n{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.h{font:700 25px system-ui;fill:#0f172a}.s{font:16px system-ui;fill:#475569}.b{font:600 17px system-ui;fill:#0f172a}.sm{font:14px system-ui;fill:#334155}.arr{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}
</style></defs><rect width="1200" height="760" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="h">Quand la requête et le document interagissent-ils ?</text>
<rect x="25" y="75" width="365" height="600" rx="18" class="bg"/><text x="207" y="116" text-anchor="middle" class="h">1 · Bi-encodeur</text><text x="207" y="145" text-anchor="middle" class="s">Encodage indépendant · un vecteur chacun</text>
<rect x="55" y="185" width="115" height="55" rx="9" class="q"/><text x="112" y="219" text-anchor="middle" class="b">Requête</text><rect x="245" y="185" width="115" height="55" rx="9" class="d"/><text x="302" y="219" text-anchor="middle" class="b">Document</text>
<path d="M112 240V282" class="arr"/><path d="M302 240V282" class="arr"/><rect x="55" y="282" width="115" height="80" rx="9" class="q"/><text x="112" y="314" text-anchor="middle" class="b">Encodeur Q</text><text x="112" y="339" text-anchor="middle" class="sm">branche</text><rect x="245" y="282" width="115" height="80" rx="9" class="d"/><text x="302" y="314" text-anchor="middle" class="b">Encodeur D</text><text x="302" y="339" text-anchor="middle" class="sm">branche</text>
<path d="M112 362V410" class="arr"/><path d="M302 362V410" class="arr"/><rect x="70" y="410" width="85" height="54" rx="9" class="q"/><text x="112" y="443" text-anchor="middle" class="b">q⃗</text><rect x="260" y="410" width="85" height="54" rx="9" class="d"/><text x="302" y="443" text-anchor="middle" class="b">d⃗</text><path d="M112 464V505H207V530" class="arr"/><path d="M302 464V505H207" class="arr"/><rect x="125" y="530" width="165" height="58" rx="10" class="m"/><text x="207" y="565" text-anchor="middle" class="b">Score de similarité</text><text x="207" y="625" text-anchor="middle" class="sm">Poids partagés ou distincts</text>
<rect x="418" y="75" width="365" height="600" rx="18" class="bg"/><text x="600" y="116" text-anchor="middle" class="h">2 · Cross-encodeur</text><text x="600" y="145" text-anchor="middle" class="s">Traitement conjoint de chaque paire</text>
<rect x="465" y="185" width="270" height="55" rx="9" class="n"/><text x="600" y="219" text-anchor="middle" class="b">[Requête ; Document]</text><path d="M600 240V285" class="arr"/><rect x="465" y="285" width="270" height="95" rx="10" class="n"/><text x="600" y="321" text-anchor="middle" class="b">Transformer conjoint</text><text x="600" y="350" text-anchor="middle" class="sm">Interaction entre tokens des deux textes</text><path d="M600 380V440" class="arr"/><rect x="500" y="440" width="200" height="65" rx="10" class="m"/><text x="600" y="468" text-anchor="middle" class="b">Score propre à la paire</text><text x="600" y="490" text-anchor="middle" class="sm">pas nécessairement une probabilité</text><text x="600" y="565" text-anchor="middle" class="sm">Pas de vecteur documentaire réutilisable</text><text x="600" y="590" text-anchor="middle" class="sm">pour toute requête future</text><text x="600" y="625" text-anchor="middle" class="sm">Interaction riche · coûteux à grande échelle</text>
<rect x="810" y="75" width="365" height="600" rx="18" class="bg"/><text x="992" y="116" text-anchor="middle" class="h">3 · Interaction tardive</text><text x="992" y="145" text-anchor="middle" class="s">Type ColBERT · vecteurs contextualisés</text>
<rect x="835" y="180" width="130" height="52" rx="9" class="q"/><text x="900" y="213" text-anchor="middle" class="b">Requête</text><rect x="1020" y="180" width="130" height="52" rx="9" class="d"/><text x="1085" y="213" text-anchor="middle" class="b">Document</text><path d="M900 232V270" class="arr"/><path d="M1085 232V270" class="arr"/><rect x="835" y="270" width="130" height="70" rx="9" class="q"/><text x="900" y="299" text-anchor="middle" class="sm">Encodeur requête</text><text x="900" y="322" text-anchor="middle" class="sm">contextualisé</text><rect x="1020" y="270" width="130" height="70" rx="9" class="d"/><text x="1085" y="299" text-anchor="middle" class="sm">Encodeur document</text><text x="1085" y="322" text-anchor="middle" class="sm">index hors ligne</text><path d="M900 340V375" class="arr"/><path d="M1085 340V375" class="arr"/>
<rect x="845" y="375" width="28" height="34" rx="5" class="q"/><rect x="880" y="375" width="28" height="34" rx="5" class="q"/><rect x="915" y="375" width="28" height="34" rx="5" class="q"/><rect x="1030" y="375" width="28" height="34" rx="5" class="d"/><rect x="1065" y="375" width="28" height="34" rx="5" class="d"/><rect x="1100" y="375" width="28" height="34" rx="5" class="d"/><text x="900" y="430" text-anchor="middle" class="sm">q₁ q₂ q₃</text><text x="1085" y="430" text-anchor="middle" class="sm">d₁ d₂ … dₘ</text><path d="M900 442V475H992" class="arr"/><path d="M1085 442V475H992" class="arr"/><rect x="915" y="475" width="155" height="64" rx="10" class="m"/><text x="992" y="502" text-anchor="middle" class="b">MaxSim par qᵢ</text><text x="992" y="523" text-anchor="middle" class="sm">maxⱼ sim(qᵢ,dⱼ)</text><path d="M992 539V570" class="arr"/><rect x="930" y="570" width="125" height="48" rx="9" class="n"/><text x="992" y="600" text-anchor="middle" class="b">Σ des maxima</text><text x="992" y="646" text-anchor="middle" class="sm">Correspondance fine · index multi-vecteurs plus lourd</text>
<text x="600" y="720" text-anchor="middle" class="s">Schéma indicatif : encodeurs, pooling, score et index varient selon les modèles.</text></svg>