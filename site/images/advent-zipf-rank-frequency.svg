<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Illustrative Zipf rank-frequency curve</title>
<desc id="desc">A descending straight line on logarithmic axes, showing the synthetic relation frequency equals one thousand divided by rank.</desc>
<rect x="0" y="0" width="760" height="430" fill="#fbfcfa"/>
<text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#183d2b">A power law becomes a straight line in log-log space</text>
<g stroke="#d7e1da" stroke-width="1">
<line x1="100" y1="75" x2="100" y2="340"/><line x1="100" y1="340" x2="700" y2="340"/>
<line x1="100" y1="75" x2="700" y2="75" stroke-dasharray="3 5"/><line x1="100" y1="128" x2="700" y2="128" stroke-dasharray="3 5"/><line x1="100" y1="181" x2="700" y2="181" stroke-dasharray="3 5"/><line x1="100" y1="234" x2="700" y2="234" stroke-dasharray="3 5"/><line x1="100" y1="287" x2="700" y2="287" stroke-dasharray="3 5"/>
<line x1="250" y1="75" x2="250" y2="340" stroke-dasharray="3 5"/><line x1="400" y1="75" x2="400" y2="340" stroke-dasharray="3 5"/><line x1="550" y1="75" x2="550" y2="340" stroke-dasharray="3 5"/><line x1="700" y1="75" x2="700" y2="340" stroke-dasharray="3 5"/>
</g>
<g font-family="system-ui,sans-serif" font-size="12" fill="#42574a">
<text x="88" y="79" text-anchor="end">1,000</text><text x="88" y="132" text-anchor="end">100</text><text x="88" y="185" text-anchor="end">10</text><text x="88" y="238" text-anchor="end">1</text><text x="88" y="291" text-anchor="end">0.1</text>
<text x="100" y="360" text-anchor="middle">1</text><text x="250" y="360" text-anchor="middle">10</text><text x="400" y="360" text-anchor="middle">100</text><text x="550" y="360" text-anchor="middle">1,000</text><text x="700" y="360" text-anchor="middle">10,000</text>
<text x="400" y="400" text-anchor="middle" font-size="14">Word rank r (log scale)</text><text transform="translate(28 210) rotate(-90)" text-anchor="middle" font-size="14">Relative frequency f(r) (log scale)</text>
</g>
<path d="M100 75 L700 287" fill="none" stroke="#28744b" stroke-width="4" stroke-linecap="round"/>
<g fill="#28744b" stroke="#ffffff" stroke-width="2"><circle cx="100" cy="75" r="6"/><circle cx="250" cy="128" r="6"/><circle cx="400" cy="181" r="6"/><circle cx="550" cy="234" r="6"/><circle cx="700" cy="287" r="6"/></g>
<text x="535" y="105" font-family="system-ui,sans-serif" font-size="13" fill="#28744b">slope = −1</text>
<text x="380" y="423" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#718077">Synthetic relation: f(r) = 1000 / r</text>
</svg>