<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1450" viewBox="0 0 820 1450" role="img" aria-labelledby="title desc"><title id="title">Three update rules, three kinds of information</title><desc id="desc">Same objective and gradient: the update rule determines what additional information is used.</desc><rect width="820" height="1450" rx="28" fill="#f8fafc"/><text x="55" y="62" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#15803d">LEARNING · OPTIMIZATION</text><text x="55" y="112" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17212b">Three update rules, three kinds of information</text><text x="55" y="150" font-family="Arial,sans-serif" font-size="19" fill="#475569">Same objective and gradient: the update rule determines what additional information is used.</text><rect x="55" y="190" width="710" height="330" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="55" y="190" width="10" height="330" rx="5" fill="#2563eb"/><text x="87" y="242" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#17212b">SGD</text><text x="87" y="282" font-family="Arial,sans-serif" font-size="23" fill="#475569">Gradient descent</text><rect x="87" y="310" width="646" height="38" rx="19" fill="#2563eb" opacity=".12"/><text x="105" y="336" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2563eb">First order</text><text x="87" y="395" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212b">Uses the current gradient</text><text x="87" y="448" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">θₜ₊₁ = θₜ − η gₜ</text><text x="87" y="475" font-family="Arial,sans-serif" font-size="20" fill="#475569">A step in the direction opposite to the gradient.</text><text x="87" y="505" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2563eb">No explicit curvature</text><rect x="55" y="570" width="710" height="330" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="55" y="570" width="10" height="330" rx="5" fill="#d97706"/><text x="87" y="622" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#17212b">Newton</text><text x="87" y="662" font-family="Arial,sans-serif" font-size="23" fill="#475569">Second-order method</text><rect x="87" y="690" width="646" height="38" rx="19" fill="#d97706" opacity=".12"/><text x="105" y="716" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#d97706">Second order</text><text x="87" y="775" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212b">Uses gradient + Hessian</text><text x="87" y="828" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">θₜ₊₁ = θₜ − Hₜ⁻¹ gₜ</text><text x="87" y="850" font-family="Arial,sans-serif" font-size="20" fill="#475569">Curvature reshapes and rescales the step.</text><text x="87" y="885" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#d97706">H = ∇²L: second derivatives</text><rect x="55" y="950" width="710" height="330" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="55" y="950" width="10" height="330" rx="5" fill="#059669"/><text x="87" y="1002" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#17212b">Adam / AdamW</text><text x="87" y="1042" font-family="Arial,sans-serif" font-size="23" fill="#475569">Adaptive optimizer</text><rect x="87" y="1070" width="646" height="38" rx="19" fill="#059669" opacity=".12"/><text x="105" y="1096" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#059669">Adaptive first order</text><text x="87" y="1155" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212b">Running averages of gradients and squared gradients</text><text x="87" y="1208" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">mₜ ← β₁mₜ₋₁ + (1−β₁)gₜ</text><text x="87" y="1250" font-family="Arial,sans-serif" font-size="20" fill="#475569">vₜ tracks squared gradients and rescales each coordinate.</text><rect x="55" y="1338" width="710" height="62" rx="14" fill="#e2e8f0"/><text x="410" y="1375" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">Adam’s “second moment” is statistical; it is not a second derivative.</text></svg>