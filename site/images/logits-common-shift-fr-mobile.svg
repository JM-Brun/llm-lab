<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1250" viewBox="0 0 720 1250" role="img" aria-labelledby="title desc"><title id="title">Même écart de logits, même distribution</title><desc id="desc">The vectors (2, 1) and (102, 101) have the same gap of one. Softmax gives both the same distribution: token A 73.1 percent and token B 26.9 percent.</desc><rect width="720" height="1250" rx="24" fill="#f7f9fc"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172b4d">Même écart de logits, même distribution</text><text x="36" y="100" font-family="Arial,sans-serif" font-size="19" fill="#526b9c">Un décalage commun ne change pas la softmax.</text><rect x="40" y="145" width="640" height="300" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="72" y="195" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#334155">Vecteur A · z = (2, 1)</text><path d="M120 300H600" stroke="#94a3b8" stroke-width="3"/><circle cx="245" cy="300" r="12" fill="#0f8792"/><circle cx="475" cy="300" r="12" fill="#315b9a"/><text x="245" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#087f8c">1</text><text x="475" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#315b9a">2</text><text x="245" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#087f8c">Token B</text><text x="475" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#315b9a">Token A</text><text x="360" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">Écart = 1</text><rect x="40" y="475" width="640" height="300" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="72" y="525" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#334155">Vecteur B · z′ = (102, 101)</text><path d="M120 630H600" stroke="#94a3b8" stroke-width="3"/><circle cx="245" cy="630" r="12" fill="#0f8792"/><circle cx="475" cy="630" r="12" fill="#315b9a"/><text x="245" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#087f8c">101</text><text x="475" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#315b9a">102</text><text x="245" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#087f8c">Token B</text><text x="475" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#315b9a">Token A</text><text x="360" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">Écart = 1</text><path d="M360 775V830" stroke="#64748b" stroke-width="3"/><path d="M350 820L360 832L370 820" fill="none" stroke="#64748b" stroke-width="3"/><rect x="40" y="850" width="640" height="270" rx="18" fill="#e9eef6"/><text x="360" y="900" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172b4d">Après softmax</text><text x="90" y="970" font-family="Arial,sans-serif" font-size="21" fill="#315b9a">Token A</text><rect x="230" y="944" width="350" height="34" rx="8" fill="#dbe3ed"/><rect x="230" y="944" width="256" height="34" rx="8" fill="#315b9a"/><text x="610" y="970" text-anchor="end" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315b9a">73.1%</text><text x="90" y="1040" font-family="Arial,sans-serif" font-size="21" fill="#087f8c">Token B</text><rect x="230" y="1014" width="350" height="34" rx="8" fill="#dbe3ed"/><rect x="230" y="1014" width="94" height="34" rx="8" fill="#087f8c"/><text x="610" y="1040" text-anchor="end" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#087f8c">26.9%</text><text x="360" y="1090" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">Ajouter une même constante à chaque logit ne change pas les probabilités.</text><text x="36" y="1190" font-family="Arial,sans-serif" font-size="17" fill="#475569">La softmax est invariante à un décalage commun des logits.</text></svg>