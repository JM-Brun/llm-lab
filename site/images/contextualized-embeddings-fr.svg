<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Du même embedding aux états contextualisés selon le contexte accessible</title>
<desc id="desc">Les deux occurrences de bank ont le même ID et le même embedding initial. Elles sont à la même position simplifiée, mais leurs préfixes diffèrent. Chaque bloc Transformer combine l'état de bank avec les informations accessibles dans sa séquence et produit un état caché qui peut différer.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 z" fill="#64748b"/></marker></defs>
<rect width="960" height="500" rx="22" fill="#f8fafc"/>
<text x="36" y="40" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172554">Même lookup, contextes accessibles différents</text>
<rect x="36" y="60" width="420" height="66" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="85" font-family="Arial,sans-serif" font-size="14" fill="#475569">Séquence A</text>
<text x="56" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f766e">The river <tspan fill="#1d4ed8">bank</tspan> eroded.</text>
<rect x="504" y="60" width="420" height="66" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="524" y="85" font-family="Arial,sans-serif" font-size="14" fill="#475569">Séquence B</text>
<text x="524" y="111" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f766e">The financial <tspan fill="#1d4ed8">bank</tspan> collapsed.</text>
<path d="M246 126 L246 150 L480 150 L480 174 M714 126 L714 150 L480 150" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="295" y="174" width="370" height="62" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
<text x="480" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1e40af">Lookup partagé : même ID, même vecteur</text>
<text x="480" y="222" text-anchor="middle" font-family="monospace" font-size="17" fill="#1e40af">e_bank = E[ID_bank]</text>
<text x="480" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">Même position simplifiée (3e token) ; préfixes différents</text>
<path d="M380 236 L246 292 M580 236 L714 292" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M246 126 L246 292 M714 126 L714 292" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="36" y="292" width="420" height="82" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/>
<text x="246" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#115e59">Bloc(s) Transformer — occurrence A</text>
<text x="246" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">embedding de bank + contexte accessible</text>
<text x="246" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">notamment « The river » (décodeur causal)</text>
<rect x="504" y="292" width="420" height="82" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/>
<text x="714" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#92400e">Bloc(s) Transformer — occurrence B</text>
<text x="714" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">embedding de bank + contexte accessible</text>
<text x="714" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">notamment « The financial » (décodeur causal)</text>
<path d="M246 374 L246 407 M714 374 L714 407" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="36" y="407" width="420" height="58" rx="12" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/>
<rect x="504" y="407" width="420" height="58" rx="12" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
<text x="246" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#115e59">État caché contextualisé A</text>
<text x="714" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#92400e">État caché contextualisé B</text>
<text x="246" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#115e59">peut différer de B</text>
<text x="714" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#92400e">peut différer de A</text>
<text x="36" y="487" font-family="Arial,sans-serif" font-size="12.5" fill="#475569">Schéma conceptuel, pas des vecteurs mesurés. En encodeur bidirectionnel, le contexte accessible inclut aussi les tokens suivants.</text>
</svg>