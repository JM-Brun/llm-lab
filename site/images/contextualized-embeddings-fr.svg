<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Du même embedding de token à des représentations contextualisées différentes</title>
<desc id="desc">Sous l'hypothèse que le mot bank est un même token, les deux occurrences récupèrent la même ligne de la matrice d'embeddings initiale. Après traitement dans des contextes différents, les représentations peuvent différer.</desc>
<rect width="960" height="390" rx="22" fill="#f8fafc"/>
<text x="36" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172554">Même token, contexte différent, état contextualisé différent</text>
<rect x="36" y="68" width="420" height="72" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="96" font-family="Arial,sans-serif" font-size="15" fill="#475569">Contexte A</text>
<text x="56" y="122" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f766e">“We sat on the bank of the river.”</text>
<rect x="504" y="68" width="420" height="72" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="524" y="96" font-family="Arial,sans-serif" font-size="15" fill="#475569">Contexte B</text>
<text x="524" y="122" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f766e">“The bank approved the loan.”</text>
<path d="M246 140 L246 168 L480 168 L480 190" stroke="#64748b" stroke-width="2.5" fill="none"/>
<path d="M714 140 L714 168 L480 168" stroke="#64748b" stroke-width="2.5" fill="none"/>
<rect x="295" y="190" width="370" height="62" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
<text x="480" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1e40af">Embedding initial (même ID, hypothèse)</text>
<text x="480" y="237" text-anchor="middle" font-family="monospace" font-size="17" fill="#1e40af">E[bank]</text>
<path d="M480 252 L480 273 L246 273 L246 290 M480 273 L714 273 L714 290" stroke="#64748b" stroke-width="2.5" fill="none"/>
<rect x="36" y="290" width="420" height="62" rx="12" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/>
<rect x="504" y="290" width="420" height="62" rx="12" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
<text x="246" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#115e59">État contextualisé A</text>
<text x="246" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#115e59">sens lié à la rive</text>
<text x="714" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#92400e">État contextualisé B</text>
<text x="714" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#92400e">sens lié à l'institution financière</text>
<text x="36" y="375" font-family="Arial,sans-serif" font-size="13" fill="#475569">Schéma conceptuel : les vecteurs et les sens sont illustratifs, pas des mesures calculées.</text>
</svg>