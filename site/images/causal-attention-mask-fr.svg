<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Masque causal de l’attention</title><desc id="desc">Les lignes sont les positions des requêtes et les colonnes celles des clés. Chaque requête accède à sa propre position et aux positions précédentes, mais pas aux positions futures.</desc>
<rect width="1000" height="460" rx="24" fill="#f8fafc"/>
<text x="52" y="54" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#10233f">Masque causal : seul le préfixe est visible</text>
<text x="52" y="92" font-family="Arial,sans-serif" font-size="17" fill="#51627a">Lignes = requêtes · colonnes = clés</text>
<g font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233f" text-anchor="middle"><text x="375" y="160">t1</text><text x="310" y="210">t1</text><text x="435" y="160">t2</text><text x="310" y="270">t2</text><text x="495" y="160">t3</text><text x="310" y="330">t3</text><text x="555" y="160">t4</text><text x="310" y="390">t4</text></g>
<g stroke="#fff" stroke-width="3"><rect x="345" y="175" width="58" height="56" rx="7" fill="#087f8c"/><rect x="405" y="175" width="58" height="56" rx="7" fill="#f0c9bd"/><rect x="465" y="175" width="58" height="56" rx="7" fill="#f0c9bd"/><rect x="525" y="175" width="58" height="56" rx="7" fill="#f0c9bd"/><rect x="345" y="235" width="58" height="56" rx="7" fill="#087f8c"/><rect x="405" y="235" width="58" height="56" rx="7" fill="#087f8c"/><rect x="465" y="235" width="58" height="56" rx="7" fill="#f0c9bd"/><rect x="525" y="235" width="58" height="56" rx="7" fill="#f0c9bd"/><rect x="345" y="295" width="58" height="56" rx="7" fill="#087f8c"/><rect x="405" y="295" width="58" height="56" rx="7" fill="#087f8c"/><rect x="465" y="295" width="58" height="56" rx="7" fill="#087f8c"/><rect x="525" y="295" width="58" height="56" rx="7" fill="#f0c9bd"/><rect x="345" y="355" width="58" height="56" rx="7" fill="#087f8c"/><rect x="405" y="355" width="58" height="56" rx="7" fill="#087f8c"/><rect x="465" y="355" width="58" height="56" rx="7" fill="#087f8c"/><rect x="525" y="355" width="58" height="56" rx="7" fill="#087f8c"/></g>
