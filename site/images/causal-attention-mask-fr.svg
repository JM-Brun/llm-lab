<rect x="650" y="210" width="18" height="18" rx="4" fill="#087f8c"/><text x="680" y="225" font-family="Arial,sans-serif" font-size="15" fill="#10233f">Visible</text><rect x="650" y="250" width="18" height="18" rx="4" fill="#f0c9bd"/><text x="680" y="265" font-family="Arial,sans-serif" font-size="15" fill="#10233f">Masqué</text>
<text x="650" y="325" font-family="Arial,sans-serif" font-size="15" fill="#51627a">Les tokens futurs ne</text><text x="650" y="348" font-family="Arial,sans-serif" font-size="15" fill="#51627a">peuvent influencer</text><text x="650" y="371" font-family="Arial,sans-serif" font-size="15" fill="#51627a">les positions passées.</text></svg>