<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1560" viewBox="0 0 720 1560" role="img" aria-labelledby="title desc">
<title id="title">Where positional information enters</title>
<desc id="desc">Three distinct paths: absolute addition at the input, RoPE rotation of queries and keys, or a relative bias added to scores. Causal masking remains a separate constraint.</desc>
<rect width="720" height="1560" rx="24" fill="#ffffff"/>
<text x="36" y="54" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Where does positional information enter?</text>
<text x="36" y="90" font-family="Arial,sans-serif" font-size="19" fill="#475569">Same sequence · three distinct mechanisms</text>
<rect x="24" y="125" width="672" height="400" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="48" y="167" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#334155">A · Absolute addition at input</text>
<rect x="74" y="197" width="572" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#172033">Token IDs</text><path d="M360 249 V267" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M352 259 L360 268 L368 259" fill="none" stroke="#64748b" stroke-width="2.5"/><rect x="74" y="269" width="572" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#172033">Token embedding</text><path d="M360 321 V339" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M352 331 L360 340 L368 331" fill="none" stroke="#64748b" stroke-width="2.5"/><rect x="74" y="341" width="572" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="374" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#172033">+ position vector</text><path d="M360 393 V411" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M352 403 L360 412 L368 403" fill="none" stroke="#64748b" stroke-width="2.5"/><rect x="74" y="413" width="572" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="446" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#172033">Transformer blocks</text>
<rect x="24" y="550" width="672" height="460" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<text x="48" y="592" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1e40af">B · RoPE inside attention</text>
<rect x="74" y="622" width="572" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#172033">Hidden states</text><path d="M360 674 V692" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M352 684 L360 693 L368 684" fill="none" stroke="#64748b" stroke-width="2.5"/><rect x="74" y="694" width="572" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="727" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#172033">Q · K · V projections</text><path d="M360 746 V764" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M352 756 L360 765 L368 756" fill="none" stroke="#64748b" stroke-width="2.5"/><rect x="74" y="766" width="572" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="799" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#172033">RoPE on Q and K</text><path d="M360 818 V836" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M352 828 L360 837 L368 828" fill="none" stroke="#64748b" stroke-width="2.5"/><rect x="74" y="838" width="572" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="871" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#172033">QK scores</text>
<text x="48" y="942" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#1e40af">RoPE does not rotate V.</text><rect x="24" y="1035" width="672" height="400" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
<text x="48" y="1077" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#5b21b6">C · Relative bias on scores</text>
<rect x="74" y="1107" width="572" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="1140" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#172033">Q · K projections</text><path d="M360 1159 V1177" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M352 1169 L360 1178 L368 1169" fill="none" stroke="#64748b" stroke-width="2.5"/><rect x="74" y="1179" width="572" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="1212" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#172033">QK score / √dₖ</text><path d="M360 1231 V1249" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M352 1241 L360 1250 L368 1241" fill="none" stroke="#64748b" stroke-width="2.5"/><rect x="74" y="1251" width="572" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="1284" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#172033">+ relative bias</text><path d="M360 1303 V1321" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M352 1313 L360 1322 L368 1313" fill="none" stroke="#64748b" stroke-width="2.5"/><rect x="74" y="1323" width="572" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="1356" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#172033">Softmax and aggregation</text>

<text x="36" y="1490" font-family="Arial,sans-serif" font-size="17" fill="#64748b">Conceptual map: exact variants depend on the architecture.</text>
</svg>