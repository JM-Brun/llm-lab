<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1600" viewBox="0 0 720 1600" role="img" aria-labelledby="title desc"><title id="title">Même lookup, contextes différents</title><desc id="desc">Un ID commun peut conduire à des états contextualisés différents. Two contexts feed the same initial embedding lookup, then separate Transformer computations may produce different hidden states.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><rect width="720" height="1600" rx="24" fill="#f8fafc"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172554">Même lookup, contextes différents</text><text x="36" y="100" font-family="Arial,sans-serif" font-size="18" fill="#475569">Un ID commun peut conduire à des états contextualisés différents.</text><rect x="40" y="145" width="640" height="165" rx="16" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="70" y="188" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#115e59">Contexte A</text><text x="70" y="245" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f766e">… bonne situation, ça, scribe ?</text><rect x="40" y="345" width="640" height="165" rx="16" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="70" y="388" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#92400e">Contexte B</text><text x="70" y="445" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#92400e">… de bonne ou de mauvaise situation …</text><path d="M360 310V550M360 510V550" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="70" y="565" width="580" height="150" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="360" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1e40af">Lookup partagé</text><text x="360" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#1e40af">Même ID supposé · même vecteur initial</text><text x="360" y="690" text-anchor="middle" font-family="monospace" font-size="20" fill="#1e40af">e_situation = E[ID_situation]</text><path d="M360 715V765H360" stroke="#64748b" stroke-width="3" fill="none"/><path d="M360 765H360V790" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="805" width="640" height="145" rx="16" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="70" y="850" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#115e59">Bloc(s) Transformer · occurrence A</text><text x="70" y="900" font-family="Arial,sans-serif" font-size="18" fill="#334155">poste / profession</text><path d="M360 950V985" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="1000" width="640" height="105" rx="16" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/><text x="360" y="1062" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#115e59">État caché contextualisé A</text><path d="M360 1105V1140" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="1155" width="640" height="145" rx="16" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="70" y="1200" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#92400e">Bloc(s) Transformer · occurrence B</text><text x="70" y="1250" font-family="Arial,sans-serif" font-size="18" fill="#334155">circonstances</text><path d="M360 1300V1335" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="1350" width="640" height="105" rx="16" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><text x="360" y="1412" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#92400e">État caché contextualisé B</text><text x="36" y="1515" font-family="Arial,sans-serif" font-size="17" fill="#475569">Schéma conceptuel : les exemples supposent un ID commun pour « situation » ; les vecteurs ne sont pas mesurés.</text></svg>