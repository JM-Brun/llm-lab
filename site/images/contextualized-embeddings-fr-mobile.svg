<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1600" viewBox="0 0 720 1600" role="img" aria-labelledby="title desc"><title id="title">Même lookup, contextes différents</title><desc id="desc">Un ID commun peut conduire à des états contextualisés différents. Two contexts feed the same initial embedding lookup, then separate Transformer computations may produce different hidden states.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><rect width="720" height="1600" rx="24" fill="#f8fafc"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172554">Même lookup, contextes différents</text><text x="36" y="100" font-family="Arial,sans-serif" font-size="18" fill="#475569">Un ID commun peut conduire à des états contextualisés différents.</text><rect x="40" y="145" width="640" height="165" rx="16" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="70" y="188" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#115e59">Contexte A</text><text x="70" y="245" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f766e">… bonne situation, ça, scribe ?</text><rect x="40" y="345" width="640" height="165" rx="16" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="70" y="388" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#92400e">Contexte B</text><text x="70" y="445" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#92400e">… de bonne ou de mauvaise situation …</text><path d="M360 310V550M360 510V550" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="70" y="565" width="580" height="150" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="360" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1e40af">Lookup partagé</text><text x="360" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#1e40af">Même ID supposé · même vecteur initial</text><text x="360" y="690" text-anchor="middle" font-family="monospace" font-size="20" fill="#1e40af">e_situation = E[ID_situation]</text><path d="M360 715V760H190V790" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M360 760H530V790" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="25" y="805" width="320" height="185" rx="16" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="185" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#115e59">Bloc(s) Transformer · A</text><text x="185" y="900" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">Contexte accessible A</text><text x="185" y="930" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">embedding initial commun</text>
<rect x="375" y="805" width="320" height="185" rx="16" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="535" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#92400e">Bloc(s) Transformer · B</text><text x="535" y="900" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">Contexte accessible B</text><text x="535" y="930" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">embedding initial commun</text>
<path d="M185 990V1035" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M535 990V1035" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<rect x="25" y="1050" width="320" height="120" rx="16" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/><text x="185" y="1100" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#115e59">État contextualisé A</text><text x="185" y="1135" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#115e59">peut différer de B</text>
<rect x="375" y="1050" width="320" height="120" rx="16" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><text x="535" y="1100" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#92400e">État contextualisé B</text><text x="535" y="1135" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#92400e">peut différer de A</text>
<text x="36" y="1250" font-family="Arial,sans-serif" font-size="17" fill="#475569">Schéma conceptuel : ID commun supposé ; vecteurs non mesurés.</text></svg>