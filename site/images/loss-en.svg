<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Two masks, two different questions</title><desc id="desc">The causal mask determines which positions a prediction can see; the loss mask determines which targets contribute to the mean. Ignored positions are excluded from both numerator and denominator.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#475569"/></marker></defs><rect x="1" y="1" width="898" height="458" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212B" text-anchor="start">Two masks, two different questions</text><rect x="28" y="66" width="405" height="190" rx="12" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.5"/><text x="48" y="96" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0369A1" text-anchor="start">Causal attention mask</text><text x="48" y="124" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">What can be attended to?</text><rect x="58" y="146" width="34" height="26" rx="4" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="75" y="165" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><rect x="101" y="146" width="34" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="118" y="165" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">×</text><rect x="144" y="146" width="34" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="161" y="165" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">×</text><rect x="58" y="180" width="34" height="26" rx="4" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="75" y="199" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><rect x="101" y="180" width="34" height="26" rx="4" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="118" y="199" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><rect x="144" y="180" width="34" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="161" y="199" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">×</text><rect x="58" y="214" width="34" height="26" rx="4" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="75" y="233" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><rect x="101" y="214" width="34" height="26" rx="4" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="118" y="233" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><rect x="144" y="214" width="34" height="26" rx="4" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="161" y="233" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><text x="220" y="168" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Future positions</text><text x="220" y="191" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">are masked.</text><rect x="467" y="66" width="405" height="190" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="487" y="96" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#B45309" text-anchor="start">Loss mask</text><text x="487" y="124" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B" text-anchor="start">Which targets are counted?</text><rect x="492" y="151" width="72" height="55" rx="8" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="528" y="174" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">x₁</text><text x="528" y="225" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">included</text><rect x="578" y="151" width="72" height="55" rx="8" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="614" y="174" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">x₂</text><text x="614" y="225" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">included</text><rect x="664" y="151" width="72" height="55" rx="8" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="700" y="174" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">x₃</text><text x="700" y="225" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">included</text><rect x="750" y="151" width="72" height="55" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="786" y="174" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="middle">PAD</text><text x="786" y="225" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">ignored</text><rect x="28" y="284" width="844" height="108" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="48" y="316" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17212B" text-anchor="start">Aggregate over valid targets only</text><text x="48" y="357" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#15803D" text-anchor="start">L = (ℓ₁ + ℓ₂ + ℓ₃) / 3</text><text x="520" y="357" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">PAD excluded from numerator and denominator</text><text x="28" y="430" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">The loss mask does not replace the attention mask: they control different operations.</text></svg>