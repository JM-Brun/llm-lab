<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Exact dense attention versus sparse attention</title>
<desc id="desc">Two attention connectivity matrices are compared. Dense attention allows every query row to attend to every key column. A sparse example allows only a local band and selected blocks. FlashAttention changes the execution strategy but retains the dense connectivity pattern; sparse attention changes the pattern itself.</desc>
