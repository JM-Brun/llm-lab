 text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#172b3a}.h{font-size:27px;font-weight:750}.l{font-size:21px;font-weight:700}.s{font-size:17px}
 .on{fill:#3f7eaa;stroke:#fff;stroke-width:2}.off{fill:#edf1f5;stroke:#fff;stroke-width:2}
</style></defs>
<rect width="960" height="480" rx="24" fill="#f8fafc"/>
<text x="48" y="55" class="h">Two different ideas: execution vs connectivity</text>
<text x="250" y="115" text-anchor="middle" class="l">Dense attention</text>
