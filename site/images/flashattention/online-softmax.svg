<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Online softmax: merge a new tile into running statistics</title>
<desc id="desc">A previous running state consisting of maximum m, exponential sum l and weighted value sum u is merged with a new tile's local maximum, sum and weighted sum. Both partial states are rescaled to the new maximum before addition. The final attention output is u divided by l.</desc>
<defs>
 <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#526579"/></marker>
 <style>
 text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#172b3a}.h{font-size:27px;font-weight:750}.l{font-size:20px;font-weight:650}.s{font-size:17px}
 .box{fill:#edf3fb;stroke:#527da8;stroke-width:2}.new{fill:#fff5df;stroke:#bd8732;stroke-width:2}.merge{fill:#e8f5ee;stroke:#39845d;stroke-width:2}
 .arr{stroke:#526579;stroke-width:3;fill:none;marker-end:url(#a)}
 </style>
</defs>
<rect width="960" height="560" rx="24" fill="#f8fafc"/>
<text x="48" y="55" class="h">Online softmax: merge partial statistics exactly</text>
<rect x="55" y="115" width="245" height="150" rx="16" class="box"/>
<text x="177" y="150" text-anchor="middle" class="l">Running state</text>
<text x="177" y="190" text-anchor="middle" class="s">m, ℓ, u</text>
<text x="177" y="222" text-anchor="middle" class="s">previous key/value tiles</text>
<rect x="55" y="315" width="245" height="150" rx="16" class="new"/>
<text x="177" y="350" text-anchor="middle" class="l">New tile statistics</text>
<text x="177" y="390" text-anchor="middle" class="s">mₜ, ℓₜ, uₜ</text>
<text x="177" y="422" text-anchor="middle" class="s">current key/value tile</text>
<path d="M310 190 H385 V250 H425" class="arr"/><path d="M310 390 H385 V330 H425" class="arr"/>
<rect x="438" y="205" width="190" height="170" rx="16" class="merge"/>
<text x="533" y="244" text-anchor="middle" class="l">Rescale</text>
<text x="533" y="282" text-anchor="middle" class="s">m′ = max(m, mₜ)</text>
<text x="533" y="315" text-anchor="middle" class="s">a = exp(m − m′)</text>
<text x="533" y="346" text-anchor="middle" class="s">b = exp(mₜ − m′)</text>
<path d="M638 290 H700" class="arr"/>
<rect x="713" y="205" width="195" height="170" rx="16" class="box"/>
<text x="810" y="244" text-anchor="middle" class="l">Merge</text>
<text x="810" y="282" text-anchor="middle" class="s">ℓ′ = aℓ + bℓₜ</text>
<text x="810" y="315" text-anchor="middle" class="s">u′ = au + buₜ</text>
<text x="810" y="346" text-anchor="middle" class="s">keep (m′, ℓ′, u′)</text>
<path d="M810 385 V435" class="arr"/>
<rect x="713" y="450" width="195" height="70" rx="14" class="merge"/>
<text x="810" y="480" text-anchor="middle" class="l">Output = u′ / ℓ′</text>
<text x="480" y="510" text-anchor="middle" class="s">Stable normalization without storing every attention probability.</text>
</svg>