<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Quatre dimensions de l’évaluation des tokenizers</title>
<desc id="desc">Schéma conceptuel en quatre panneaux, sans données quantitatives.</desc>
<rect width="1000" height="440" rx="18" fill="#f7f8fa"/>
<text x="500" y="43" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172033">Évaluer selon la question posée</text>
<g>
<rect x="32" y="70" width="452" height="150" rx="14" fill="#ffffff" stroke="#8a96a8" stroke-width="1.5"/>
<circle cx="68" cy="106" r="20" fill="#e4ebf5" stroke="#526783"/>
<text x="68" y="113" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">1</text>
<text x="102" y="112" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">Efficacité</text>
<text x="54" y="152" font-family="sans-serif" font-size="18" fill="#25344a">Tokens / octets</text>
<text x="54" y="186" font-family="sans-serif" font-size="15" fill="#475569">Compression, longueur</text>
</g><g>
<rect x="514" y="70" width="452" height="150" rx="14" fill="#ffffff" stroke="#8a96a8" stroke-width="1.5"/>
<circle cx="550" cy="106" r="20" fill="#e4ebf5" stroke="#526783"/>
<text x="550" y="113" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">2</text>
<text x="584" y="112" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">En aval</text>
<text x="536" y="152" font-family="sans-serif" font-size="18" fill="#25344a">Tâches mesurées</text>
<text x="536" y="186" font-family="sans-serif" font-size="15" fill="#475569">Qualité dépendante de la tâche</text>
</g><g>
<rect x="32" y="248" width="452" height="150" rx="14" fill="#ffffff" stroke="#8a96a8" stroke-width="1.5"/>
<circle cx="68" cy="284" r="20" fill="#e4ebf5" stroke="#526783"/>
<text x="68" y="291" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">3</text>
<text x="102" y="290" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">Multilingue</text>
<text x="54" y="330" font-family="sans-serif" font-size="18" fill="#25344a">Écarts entre langues</text>
<text x="54" y="364" font-family="sans-serif" font-size="15" fill="#475569">Contexte, coûts, couverture</text>
</g><g>
<rect x="514" y="248" width="452" height="150" rx="14" fill="#ffffff" stroke="#8a96a8" stroke-width="1.5"/>
<circle cx="550" cy="284" r="20" fill="#e4ebf5" stroke="#526783"/>
<text x="550" y="291" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">4</text>
<text x="584" y="290" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">Protocole</text>
<text x="536" y="330" font-family="sans-serif" font-size="18" fill="#25344a">Version + corpus</text>
<text x="536" y="364" font-family="sans-serif" font-size="15" fill="#475569">Comparaison reproductible</text>
</g>
<text x="500" y="426" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">Cadre conceptuel : aucun classement ni résultat expérimental n’est représenté.</text>
</svg>