<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Three update rules, three kinds of information</title><desc id="desc">Same objective and gradient: the update rule determines what additional information is used.</desc><rect width="1440" height="760" rx="28" fill="#f8fafc"/><text x="45" y="62" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#15803d">LEARNING · OPTIMIZATION</text><text x="45" y="112" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17212b">Three update rules, three kinds of information</text><text x="45" y="150" font-family="Arial,sans-serif" font-size="20" fill="#475569">Same objective and gradient: the update rule determines what additional information is used.</text><rect x="45" y="180" width="430" height="440" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="45" y="180" width="10" height="440" rx="5" fill="#2563eb"/><text x="77" y="232" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17212b">SGD</text><text x="77" y="272" font-family="Arial,sans-serif" font-size="22" fill="#475569">Gradient descent</text><rect x="77" y="300" width="366" height="38" rx="19" fill="#2563eb" opacity=".12"/><text x="95" y="326" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2563eb">First order</text><text x="77" y="385" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17212b">Uses the current gradient</text><text x="77" y="438" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">θₜ₊₁ = θₜ − η gₜ</text><text x="77" y="482" font-family="Arial,sans-serif" font-size="18" fill="#475569">A step in the direction opposite to the gradient.</text><text x="77" y="588" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2563eb">No explicit curvature</text><rect x="505" y="180" width="430" height="440" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="505" y="180" width="10" height="440" rx="5" fill="#d97706"/><text x="537" y="232" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17212b">Newton</text><text x="537" y="272" font-family="Arial,sans-serif" font-size="22" fill="#475569">Second-order method</text><rect x="537" y="300" width="366" height="38" rx="19" fill="#d97706" opacity=".12"/><text x="555" y="326" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#d97706">Second order</text><text x="537" y="385" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17212b">Uses gradient + Hessian</text><text x="537" y="438" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">θₜ₊₁ = θₜ − Hₜ⁻¹ gₜ</text><text x="537" y="482" font-family="Arial,sans-serif" font-size="18" fill="#475569">Curvature reshapes and rescales the step.</text><text x="537" y="588" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#d97706">H = ∇²L: second derivatives</text><rect x="965" y="180" width="430" height="440" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="965" y="180" width="10" height="440" rx="5" fill="#059669"/><text x="997" y="232" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17212b">Adam / AdamW</text><text x="997" y="272" font-family="Arial,sans-serif" font-size="22" fill="#475569">Adaptive optimizer</text><rect x="997" y="300" width="366" height="38" rx="19" fill="#059669" opacity=".12"/><text x="1015" y="326" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#059669">Adaptive first order</text><text x="997" y="375" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17212b">Running averages of gradients</text><text x="997" y="402" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17212b">and squared gradients</text><text x="997" y="450" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">mₜ ← β₁mₜ₋₁ + (1−β₁)gₜ</text><text x="997" y="500" font-family="Arial,sans-serif" font-size="18" fill="#475569">vₜ tracks the second moment of gradients; it scales updates coordinate by coordinate.</text><text x="997" y="588" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#059669">vₜ ≠ Hₜ: no Hessian</text><rect x="45" y="658" width="1350" height="44" rx="14" fill="#e2e8f0"/><text x="720" y="695" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#334155">Adam’s “second moment” is statistical; it is not a second derivative.</text></svg>