<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">From prefix to embedding vector</title>
<desc id="desc">A token ID is used as a row address to select a vector from matrix E. The vector, not the address, is represented as a point in embedding space.</desc>
<rect width="1120" height="470" rx="22" fill="#f7f9fc"/>
<text x="42" y="42" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#526b9c">FROM TEXT TO VECTOR</text>
<rect x="40" y="76" width="230" height="118" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="58" y="105" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#334155">1 · Prefix</text><text x="58" y="137" font-family="Arial,sans-serif" font-size="17" fill="#172b4d">“What have the Romans</text><text x="58" y="162" font-family="Arial,sans-serif" font-size="17" fill="#172b4d">ever done for us?”</text>
<path d="M270 135H315" stroke="#64748b" stroke-width="2.5"/><path d="M306 127L316 135L306 143" fill="none" stroke="#64748b" stroke-width="2.5"/>
<rect x="320" y="76" width="165" height="118" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="338" y="105" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#334155">2 · Token ID</text><text x="402" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#315b9a">i</text><text x="402" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">vocabulary integer</text>
<path d="M485 135H530" stroke="#64748b" stroke-width="2.5"/><path d="M521 127L531 135L521 143" fill="none" stroke="#64748b" stroke-width="2.5"/>
<rect x="535" y="64" width="280" height="245" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="555" y="94" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">3 · Matrix E</text><text x="555" y="117" font-family="Arial,sans-serif" font-size="12" fill="#64748b">one row per ID · d columns</text>
<g font-family="Arial,sans-serif" font-size="13" fill="#475569"><text x="555" y="158">…</text><text x="555" y="203">i − 1</text><text x="555" y="247" font-weight="700" fill="#075985">i</text><text x="555" y="291">i + 1</text></g>
<g stroke="#cbd5e1" stroke-width="1.5" fill="#f8fafc"><rect x="602" y="137" width="187" height="28" rx="5"/><rect x="602" y="181" width="187" height="28" rx="5"/><rect x="602" y="225" width="187" height="28" rx="5" fill="#dff3f5" stroke="#0f8792" stroke-width="2.5"/><rect x="602" y="269" width="187" height="28" rx="5"/></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="middle"><text x="695" y="156">… · … · …</text><text x="695" y="200">… · … · …</text><text x="695" y="244" font-weight="700" fill="#075985">e₁ · e₂ · … · e_d</text><text x="695" y="288">… · … · …</text></g>
<path d="M815 239C832 239 832 135 855 135" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M846 127L856 135L846 143" fill="none" stroke="#64748b" stroke-width="2.5"/>
<rect x="860" y="76" width="220" height="118" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="880" y="105" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#334155">4 · Vector</text><text x="970" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#087f8c">Eᵢ,: ∈ ℝᵈ</text><text x="970" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">d real coordinates</text>
<path d="M970 194V245" stroke="#64748b" stroke-width="2.5"/><path d="M962 236L970 246L978 236" fill="none" stroke="#64748b" stroke-width="2.5"/>
<rect x="860" y="252" width="220" height="116" rx="14" fill="#fff" stroke="#0f8792" stroke-width="2"/><text x="880" y="280" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#075985">5 · Vector space</text><path d="M900 340L900 301M900 340L1045 340" stroke="#94a3b8" stroke-width="1.5"/><path d="M900 340L1010 294" stroke="#0f8792" stroke-width="2.5"/><circle cx="1010" cy="294" r="7" fill="#0f8792"/><text x="1025" y="294" font-family="Arial,sans-serif" font-size="12" fill="#075985">point xᵢ</text>
<rect x="40" y="397" width="1040" height="48" rx="12" fill="#e9eef6"/><text x="560" y="427" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">The ID tells us which row to read; the row's vector is the point in space.</text>
</svg>