 <text x="20" y="68" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10233f">Des scores aux poids, puis à la sortie</text>
 <text x="20" y="92" font-family="Inter,Arial,sans-serif" font-size="13" fill="#51627a">Trois matrices, trois significations différentes</text>
 
