<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1125" role="img" aria-labelledby="title desc">
 <title id="title">Des scores aux poids, puis à la sortie</title><desc id="desc">Les scores peuvent être négatifs ; les poids sont positifs et normalisés. Les scores et les poids ont la forme T × T ; la sortie a la forme T × d_v.</desc><defs>
