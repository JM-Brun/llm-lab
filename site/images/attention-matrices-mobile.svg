<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1050" role="img" aria-labelledby="title desc">
 <title id="title">Des scores aux poids, puis à la sortie</title><desc id="desc">Les scores peuvent être négatifs ; les poids sont positifs et normalisés. Les matrices de scores et de poids sont T × T ; la sortie est T × d_v.</desc><defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f5ff"/><stop offset="1" stop-color="#fff5ee"/></linearGradient>
 <linearGradient id="score" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#d9d4f5"/><stop offset="1" stop-color="#6555a5"/></linearGradient>
 <linearGradient id="weight" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#c9eee5"/><stop offset="1" stop-color="#087f70"/></linearGradient>
 <linearGradient id="output" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffe0ce"/><stop offset="1" stop-color="#df8b67"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#60758b"/></marker>
 </defs>
