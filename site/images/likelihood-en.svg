<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Scoring an observed continuation</title><desc id="desc">Three reference tokens are evaluated in turn with increasingly long observed prefixes. Conditional probabilities 0.6, 0.5 and 0.8 multiply to 0.24; their logarithms add. Parameters remain fixed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#475569"/></marker></defs><rect x="1" y="1" width="898" height="418" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212B" text-anchor="start">Scoring an observed continuation</text><rect x="32" y="76" width="248" height="142" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="48" y="108" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">Step 1</text><text x="48" y="139" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17212B" text-anchor="start">Prefix: c</text><text x="48" y="170" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17212B" text-anchor="start">Observed target x₁</text><text x="48" y="199" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">P(x₁ | c) = 0,6</text><path d="M284 147 L316 147" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="326" y="76" width="248" height="142" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="342" y="108" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">Step 2</text><text x="342" y="139" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17212B" text-anchor="start">Prefix: c, x₁</text><text x="342" y="170" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17212B" text-anchor="start">Observed target x₂</text><text x="342" y="199" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">P(x₂ | c, x₁) = 0,5</text><path d="M578 147 L610 147" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="620" y="76" width="248" height="142" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="636" y="108" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">Step 3</text><text x="636" y="139" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17212B" text-anchor="start">Prefix: c, x₁, x₂</text><text x="636" y="170" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17212B" text-anchor="start">Observed target x₃</text><text x="636" y="199" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">P(x₃ | c, x₁, x₂) = 0,8</text><rect x="32" y="246" width="836" height="112" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="52" y="280" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17212B" text-anchor="start">Continuation likelihood</text><text x="52" y="318" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#15803D" text-anchor="start">0,6 × 0,5 × 0,8 = 0,24</text><text x="485" y="280" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17212B" text-anchor="start">Log-likelihood</text><text x="485" y="318" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0369A1" text-anchor="start">ln 0,6 + ln 0,5 + ln 0,8 = ln 0,24</text><text x="32" y="388" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Reference prefix extended at each step · no generated token · fixed parameters θ</text></svg>