<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 820" role="img" aria-labelledby="title desc"><title id="title">Deux masques, deux questions</title><desc id="desc">Le masque causal détermine quelles positions sont visibles pour une prédiction ; le masque de perte détermine quelles cibles contribuent à la moyenne. Les positions ignorées sont exclues du numérateur et du dénominateur.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#475569"/></marker></defs><rect x="1" y="1" width="478" height="818" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><text x="24" y="40" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17212B" text-anchor="start">Deux masques, deux questions</text><rect x="24" y="68" width="432" height="276" rx="12" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.5"/><text x="44" y="100" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0369A1" text-anchor="start">1 · Masque d'attention causal</text><text x="44" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B" text-anchor="start">Positions visibles par chaque requête</text><rect x="76" y="158" width="56" height="40" rx="5" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="104" y="185" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><rect x="148" y="158" width="56" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="176" y="185" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#475569" text-anchor="middle">×</text><rect x="220" y="158" width="56" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="248" y="185" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#475569" text-anchor="middle">×</text><rect x="76" y="210" width="56" height="40" rx="5" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="104" y="237" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><rect x="148" y="210" width="56" height="40" rx="5" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="176" y="237" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><rect x="220" y="210" width="56" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="248" y="237" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#475569" text-anchor="middle">×</text><rect x="76" y="262" width="56" height="40" rx="5" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="104" y="289" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><rect x="148" y="262" width="56" height="40" rx="5" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="176" y="289" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><rect x="220" y="262" width="56" height="40" rx="5" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="248" y="289" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><text x="24" y="372" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#0369A1" text-anchor="start">Les positions futures sont masquées.</text><rect x="24" y="410" width="432" height="218" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="44" y="442" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#B45309" text-anchor="start">2 · Masque de perte</text><text x="44" y="470" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B" text-anchor="start">Cibles incluses dans l'objectif</text><rect x="44" y="494" width="82" height="56" rx="7" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="85" y="518" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">x₁</text><text x="85" y="572" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">incluse</text><rect x="142" y="494" width="82" height="56" rx="7" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="183" y="518" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">x₂</text><text x="183" y="572" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">incluse</text><rect x="240" y="494" width="82" height="56" rx="7" fill="#15803D" stroke="#15803D" stroke-width="1.5"/><text x="281" y="518" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">x₃</text><text x="281" y="572" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">incluse</text><rect x="338" y="494" width="82" height="56" rx="7" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="379" y="518" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="middle">PAD</text><text x="379" y="572" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">ignorée</text><rect x="24" y="660" width="432" height="106" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="44" y="690" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B" text-anchor="start">Moyenne sur les cibles valides</text><text x="44" y="730" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#15803D" text-anchor="start">L = (ℓ₁ + ℓ₂ + ℓ₃) / 3</text><text x="24" y="792" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Deux masques indépendants</text></svg>