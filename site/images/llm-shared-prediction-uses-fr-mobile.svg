<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1540" role="img" aria-labelledby="title desc">
<title id="title">Un calcul, trois usages</title><desc id="desc">Même prédiction, objectifs différents.</desc>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#405a72" stroke-width="2"/></marker><style>
text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#183247}.h{font-size:36px;font-weight:700}.b{font-size:30px;font-weight:600}.s{font-size:26px}.small{font-size:23px}.box{stroke-width:3}
</style></defs>
<rect width="720" height="1540" fill="#fff"/>
<text x="360" y="55" text-anchor="middle" class="h">Un calcul prédictif, trois usages</text><text x="360" y="95" text-anchor="middle" class="small">Le modèle calcule une distribution.</text>
<rect x="90" y="130" width="540" height="125" rx="18" fill="#edf4ff" stroke="#8eb1df" class="box"/><text x="360" y="180" text-anchor="middle" class="h">Contexte</text><text x="360" y="220" text-anchor="middle" class="s">Tokens déjà connus</text>
<path d="M360 260 V290" stroke="#405a72" stroke-width="4" marker-end="url(#arr)"/>
<rect x="90" y="300" width="540" height="125" rx="18" fill="#eaf6ef" stroke="#8fc5a4" class="box"/><text x="360" y="350" text-anchor="middle" class="h">Modèle</text><text x="360" y="395" text-anchor="middle" class="s">Passe avant</text>
<path d="M360 430 V460" stroke="#405a72" stroke-width="4" marker-end="url(#arr)"/>
<rect x="90" y="470" width="540" height="125" rx="18" fill="#fff5e5" stroke="#e3c17d" class="box"/><text x="360" y="520" text-anchor="middle" class="h">Logits</text><text x="360" y="565" text-anchor="middle" class="s">Un score par token</text>
<path d="M360 600 V630" stroke="#405a72" stroke-width="4" marker-end="url(#arr)"/>
<rect x="90" y="640" width="540" height="125" rx="18" fill="#fff1e9" stroke="#e4ad8d" class="box"/><text x="360" y="690" text-anchor="middle" class="h">Probabilités</text><text x="360" y="735" text-anchor="middle" class="s">Softmax · distribution sur le vocabulaire</text>
<path d="M360 770 V790 H28 V1350" fill="none" stroke="#8093a4" stroke-width="4"/>
<g fill="none" stroke="#405a72" stroke-width="4" marker-end="url(#arr)"><path d="M28 900 H48"/><path d="M28 1125 H48"/><path d="M28 1350 H48"/></g>
<rect x="55" y="810" width="610" height="180" rx="20" fill="#edf4ff" stroke="#8eb1df" class="box"/><text x="360" y="865" text-anchor="middle" class="h">1. Génération</text><text x="360" y="920" text-anchor="middle" class="b">Choisir un token</text><text x="360" y="960" text-anchor="middle" class="s">L’ajouter au contexte ↺</text>

<rect x="55" y="1035" width="610" height="180" rx="20" fill="#fff6e8" stroke="#e3c17d" class="box"/><text x="360" y="1090" text-anchor="middle" class="h">2. Scoring</text><text x="360" y="1145" text-anchor="middle" class="b">Regarder le token attendu</text><text x="360" y="1185" text-anchor="middle" class="s">Quelle probabilité lui est attribuée ?</text>

<rect x="55" y="1260" width="610" height="180" rx="20" fill="#edf7ef" stroke="#8fc5a4" class="box"/><text x="360" y="1315" text-anchor="middle" class="h">3. Apprentissage</text><text x="360" y="1370" text-anchor="middle" class="b">Comparer à la cible</text><text x="360" y="1415" text-anchor="middle" class="s">Loss → gradients → mise à jour des paramètres</text>
<text x="360" y="1470" text-anchor="middle" class="small">Génération et scoring : paramètres fixes.</text><text x="360" y="1505" text-anchor="middle" class="small">Apprentissage : paramètres ajustés.</text></svg>
