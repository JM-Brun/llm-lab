<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc"><title id="title">Same target, different probability</title><desc id="desc">For the same one-hot target, p(y)=0.9 gives loss 0.105 nats, while p(y)=0.1 gives loss 2.303 nats. The two probability bars share a 0–1 scale; the two loss bars share a 0–2.303 nats scale.</desc><rect width="720" height="1120" rx="24" fill="#f8fafc"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">Same target, different probability</text><text x="36" y="100" font-family="Arial,sans-serif" font-size="19" fill="#526b9c">Loss depends on the probability assigned to the observed token.</text><rect x="35" y="155" width="650" height="350" rx="18" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="70" y="203" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#16a34a">High target probability</text><text x="70" y="260" font-family="Arial,sans-serif" font-size="19" fill="#334155">Target probability p(y) · p(y) = 0.9</text><rect x="70" y="280" width="500" height="28" rx="7" fill="#e2e8f0"/><rect x="70" y="280" width="360" height="28" rx="7" fill="#16a34a"/><text x="70" y="365" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">Loss −ln p(y)</text><text x="70" y="403" font-family="Arial,sans-serif" font-size="20" fill="#334155">Loss ≈ 0.105 nats</text><rect x="70" y="425" width="500" height="28" rx="7" fill="#e2e8f0"/><rect x="70" y="425" width="16" height="28" rx="7" fill="#16a34a"/><rect x="35" y="560" width="650" height="350" rx="18" fill="#fff" stroke="#e11d48" stroke-width="2"/><text x="70" y="608" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#e11d48">Low target probability</text><text x="70" y="665" font-family="Arial,sans-serif" font-size="19" fill="#334155">Target probability p(y) · p(y) = 0.1</text><rect x="70" y="685" width="500" height="28" rx="7" fill="#e2e8f0"/><rect x="70" y="685" width="40" height="28" rx="7" fill="#e11d48"/><text x="70" y="770" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">Loss −ln p(y)</text><text x="70" y="808" font-family="Arial,sans-serif" font-size="20" fill="#334155">Loss ≈ 2.303 nats</text><rect x="70" y="830" width="500" height="28" rx="7" fill="#e2e8f0"/><rect x="70" y="830" width="400" height="28" rx="7" fill="#e11d48"/><text x="36" y="970" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">The observed target token is the same in both cases.</text><text x="36" y="1015" font-family="Arial,sans-serif" font-size="16" fill="#475569">The two probability bars share a 0–1 scale; the two loss bars share a 0–2.303 nats scale.</text><text x="36" y="1060" font-family="Arial,sans-serif" font-size="16" fill="#475569">A lower target probability produces a larger loss.</text></svg>