<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Architecture of a decoder-only GPT and one Transformer block</title>
<desc id="desc">On the left, token IDs become embeddings with positional information, pass through a stack of N Transformer blocks, then a final normalization and vocabulary projection produce logits. On the right, one pre-LN block is expanded: normalization, causal multi-head attention, residual addition, normalization, a position-wise MLP, and a second residual addition.</desc>
<defs>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker>
 <marker id="dash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7c3aed"/></marker>
 <style>
 .title{font:700 30px system-ui,sans-serif;fill:#0f172a}.paneltitle{font:700 23px system-ui,sans-serif;fill:#0f172a}
 .label{font:650 17px system-ui,sans-serif;fill:#172554}.small{font:14px system-ui,sans-serif;fill:#334155}.tiny{font:12px system-ui,sans-serif;fill:#475569}
 .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.input{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.stack{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.norm{fill:#fef3c7;stroke:#d97706;stroke-width:1.8}.attn{fill:#dbeafe;stroke:#2563eb;stroke-width:1.8}.mlp{fill:#dcfce7;stroke:#16a34a;stroke-width:1.8}.out{fill:#ffe4e6;stroke:#e11d48;stroke-width:1.8}.res{stroke:#64748b;stroke-width:2.4;fill:none;marker-end:url(#arr)}.zoom{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#dash)}
 </style>
</defs>
<rect width="1440" height="900" fill="#ffffff"/>
<text x="720" y="48" text-anchor="middle" class="title">In a GPT, the Transformer is the stack of neural network blocks</text>
<rect x="30" y="82" width="535" height="770" rx="18" class="panel"/>
<text x="297" y="122" text-anchor="middle" class="paneltitle">The complete model (simplified view)</text>
<rect x="155" y="155" width="285" height="66" rx="11" class="input"/>
<text x="297" y="183" text-anchor="middle" class="label">Token IDs</text><text x="297" y="205" text-anchor="middle" class="small">[x₁, x₂, …, xₜ]</text>
<path d="M297 221V250" class="res"/>
<rect x="155" y="250" width="285" height="75" rx="11" class="input"/>
<text x="297" y="280" text-anchor="middle" class="label">Embeddings + positional information</text><text x="297" y="304" text-anchor="middle" class="small">input vectors (B × T × d)</text>
<path d="M297 325V355" class="res"/>
<rect x="115" y="355" width="365" height="235" rx="14" class="stack"/>
<text x="297" y="386" text-anchor="middle" class="label">Transformer · stack of N blocks</text>
<rect x="155" y="405" width="285" height="42" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="297" y="432" text-anchor="middle" class="label">Transformer block 1</text>
<rect x="155" y="458" width="285" height="42" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="297" y="485" text-anchor="middle" class="label">Transformer block 2</text>
<text x="297" y="525" text-anchor="middle" class="paneltitle">⋮</text>
<rect x="155" y="540" width="285" height="36" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="297" y="564" text-anchor="middle" class="label">Transformer block N</text>
<text x="297" y="612" text-anchor="middle" class="small">Each block receives the previous block's output</text>
<path d="M297 590V640" class="res"/>
<rect x="155" y="640" width="285" height="55" rx="10" class="norm"/>
<text x="297" y="674" text-anchor="middle" class="label">Final normalization</text>
<path d="M297 695V720" class="res"/>
<rect x="155" y="720" width="285" height="55" rx="10" class="out"/>
<text x="297" y="754" text-anchor="middle" class="label">Output head · vocabulary projection</text>
<path d="M297 775V800" class="res"/>
<text x="297" y="827" text-anchor="middle" class="label">Logits · (B × T × V)</text>
<path d="M480 472C535 472 545 275 620 275" class="zoom"/>
<text x="548" y="350" text-anchor="middle" class="tiny" transform="rotate(-69 548 350)">one block expanded</text>
<rect x="620" y="82" width="790" height="770" rx="18" class="panel"/>
<text x="1015" y="122" text-anchor="middle" class="paneltitle">Inside one Transformer block (pre-LN example)</text>
<text x="1015" y="151" text-anchor="middle" class="small">The same sequence of positions passes through both sublayers</text>
<rect x="680" y="185" width="165" height="58" rx="10" class="input"/>
<text x="762" y="209" text-anchor="middle" class="label">Input H⁽ˡ⁾</text><text x="762" y="230" text-anchor="middle" class="small">residual stream</text>
<path d="M845 214H885" class="res"/>
<rect x="885" y="185" width="145" height="58" rx="10" class="norm"/>
<text x="957" y="209" text-anchor="middle" class="label">LayerNorm</text><text x="957" y="230" text-anchor="middle" class="small">pré-LN</text>
<path d="M1030 214H1065" class="res"/>
<rect x="1065" y="185" width="190" height="58" rx="10" class="attn"/>
<text x="1160" y="209" text-anchor="middle" class="label">Multi-head attention</text><text x="1160" y="230" text-anchor="middle" class="small">causal · masked</text>
<path d="M1255 214H1300" class="res"/>
<circle cx="1330" cy="214" r="23" fill="#fff" stroke="#64748b" stroke-width="2.2"/><text x="1330" y="222" text-anchor="middle" class="paneltitle">+</text>
<path d="M762 243V285H1330V237" class="res"/>
<text x="1045" y="278" text-anchor="middle" class="tiny">residual connection: input + attention output</text>
<path d="M1330 237V360H762V405" class="res"/>
<text x="1040" y="340" text-anchor="middle" class="small">intermediate representation H′</text>
<rect x="680" y="405" width="165" height="58" rx="10" class="input"/>
<text x="762" y="429" text-anchor="middle" class="label">Input H′</text><text x="762" y="450" text-anchor="middle" class="small">flux résiduel</text>
<path d="M845 434H885" class="res"/>
<rect x="885" y="405" width="145" height="58" rx="10" class="norm"/>
<text x="957" y="429" text-anchor="middle" class="label">LayerNorm</text><text x="957" y="450" text-anchor="middle" class="small">pré-LN</text>
<path d="M1030 434H1065" class="res"/>
<rect x="1065" y="405" width="190" height="58" rx="10" class="mlp"/>
<text x="1160" y="429" text-anchor="middle" class="label">MLP / feed-forward</text><text x="1160" y="450" text-anchor="middle" class="small">position-wise</text>
<path d="M1255 434H1300" class="res"/>
<circle cx="1330" cy="434" r="23" fill="#fff" stroke="#64748b" stroke-width="2.2"/><text x="1330" y="442" text-anchor="middle" class="paneltitle">+</text>
<path d="M762 463V505H1330V457" class="res"/>
<text x="1045" y="498" text-anchor="middle" class="tiny">residual connection: input + MLP output</text>
<path d="M1330 457V555" class="res"/>
<rect x="1150" y="555" width="180" height="58" rx="10" class="stack"/>
<text x="1240" y="579" text-anchor="middle" class="label">Output H⁽ˡ⁺¹⁾</text><text x="1240" y="600" text-anchor="middle" class="small">to the next block</text>
<text x="1015" y="675" text-anchor="middle" class="label">Two complementary roles</text>
<rect x="700" y="700" width="300" height="92" rx="12" class="attn"/>
<text x="850" y="730" text-anchor="middle" class="label">Attention</text><text x="850" y="755" text-anchor="middle" class="small">mixes information across positions</text><text x="850" y="777" text-anchor="middle" class="tiny">subject to the causal mask</text>
<rect x="1030" y="700" width="340" height="92" rx="12" class="mlp"/>
<text x="1200" y="730" text-anchor="middle" class="label">MLP</text><text x="1200" y="755" text-anchor="middle" class="small">transforms each position independently</text><text x="1200" y="777" text-anchor="middle" class="tiny">using the same weights at every position</text>
<text x="720" y="828" text-anchor="start" class="tiny">Decoder-only GPT; pre-LN ordering is a common architectural choice, not a universal rule.</text>
</svg>