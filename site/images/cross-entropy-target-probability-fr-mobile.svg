<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc"><title id="title">Même cible, probabilité différente</title><desc id="desc">Pour une même cible one-hot, p(y)=0,9 donne une perte de 0,105 nat, tandis que p(y)=0,1 donne une perte de 2,303 nats. Les deux barres de probabilité partagent l’échelle 0–1 ; les deux barres de perte partagent l’échelle 0–2,303 nats.</desc><rect width="720" height="1120" rx="24" fill="#f8fafc"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172554">Même cible, probabilité différente</text><text x="36" y="100" font-family="Arial,sans-serif" font-size="19" fill="#526b9c">La perte dépend de la probabilité attribuée au token observé.</text><rect x="35" y="155" width="650" height="350" rx="18" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="70" y="203" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#16a34a">Probabilité cible élevée</text><text x="70" y="260" font-family="Arial,sans-serif" font-size="19" fill="#334155">Probabilité de la cible p(y) · p(y) = 0,9</text><rect x="70" y="280" width="500" height="28" rx="7" fill="#e2e8f0"/><rect x="70" y="280" width="450" height="28" rx="7" fill="#16a34a"/><text x="70" y="365" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">Perte −ln p(y)</text><text x="70" y="403" font-family="Arial,sans-serif" font-size="20" fill="#334155">Perte ≈ 0,105 nat</text><rect x="70" y="425" width="500" height="28" rx="7" fill="#e2e8f0"/><rect x="70" y="425" width="23" height="28" rx="7" fill="#16a34a"/><rect x="35" y="560" width="650" height="350" rx="18" fill="#fff" stroke="#e11d48" stroke-width="2"/><text x="70" y="608" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#e11d48">Probabilité cible faible</text><text x="70" y="665" font-family="Arial,sans-serif" font-size="19" fill="#334155">Probabilité de la cible p(y) · p(y) = 0,1</text><rect x="70" y="685" width="500" height="28" rx="7" fill="#e2e8f0"/><rect x="70" y="685" width="50" height="28" rx="7" fill="#e11d48"/><text x="70" y="770" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">Perte −ln p(y)</text><text x="70" y="808" font-family="Arial,sans-serif" font-size="20" fill="#334155">Perte ≈ 2,303 nats</text><rect x="70" y="830" width="500" height="28" rx="7" fill="#e2e8f0"/><rect x="70" y="830" width="500" height="28" rx="7" fill="#e11d48"/><text x="36" y="970" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">Même token cible dans les deux cas.</text><text x="36" y="1015" font-family="Arial,sans-serif" font-size="16" fill="#475569">Les deux barres de probabilité partagent l’échelle 0–1 ; les deux barres de perte partagent l’échelle 0–2,303 nats.</text><text x="36" y="1060" font-family="Arial,sans-serif" font-size="16" fill="#475569">Une probabilité cible plus faible entraîne une perte plus élevée.</text></svg>