<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1450" viewBox="0 0 720 1450" role="img" aria-labelledby="title desc"><title id="title">Du préfixe au vecteur</title><desc id="desc">L’ID est une adresse de ligne, pas une coordonnée. Préfixe fourni au tokenizer becomes a token ID, which selects row i in E. That row contains a vector with d real components, represented as a point in vector space.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><rect width="720" height="1450" rx="24" fill="#f7f9fc"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#172b4d">Du préfixe au vecteur</text><text x="36" y="98" font-family="Arial,sans-serif" font-size="19" fill="#526b9c">L’ID est une adresse de ligne, pas une coordonnée.</text><rect x="45" y="140" width="630" height="140" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="75" y="182" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#334155">Préfixe fourni au tokenizer</text><text x="75" y="226" font-family="Arial,sans-serif" font-size="23" fill="#172b4d">« C’est une bonne situation, ça, scribe ? »</text><path d="M360 280V330" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="45" y="345" width="630" height="125" rx="16" fill="#e8f1ff" stroke="#4778b8" stroke-width="2"/><text x="360" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#173b67">Token ID i</text><text x="360" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#173b67">Vocabulaire : i désigne une entrée</text><path d="M360 470V520" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="45" y="535" width="630" height="330" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="75" y="580" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#334155">Matrice d’embeddings E</text><text x="75" y="620" font-family="Arial,sans-serif" font-size="17" fill="#64748b">V lignes × d colonnes</text><g font-family="Arial,sans-serif" font-size="18" fill="#475569"><text x="95" y="685">…</text><text x="95" y="748">i − 1</text><text x="95" y="811" font-weight="700" fill="#075985">i</text></g><rect x="185" y="650" width="430" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><rect x="185" y="713" width="430" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><rect x="185" y="776" width="430" height="46" rx="8" fill="#dff3f5" stroke="#0f8792" stroke-width="3"/><text x="400" y="681" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">… · … · …</text><text x="400" y="744" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">… · … · …</text><text x="400" y="807" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#075985">e₁ · e₂ · … · e_d</text><text x="400" y="848" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#075985">Ligne i sélectionnée</text><path d="M360 865V915" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="45" y="930" width="630" height="150" rx="16" fill="#e9f7f0" stroke="#3a9270" stroke-width="2"/><text x="360" y="985" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17583f">Vecteur E[i, :]</text><text x="360" y="1028" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#17583f">d composantes réelles</text><path d="M360 1080V1130" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="45" y="1145" width="630" height="210" rx="16" fill="#fff" stroke="#0f8792" stroke-width="2"/><text x="75" y="1187" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#075985">Espace vectoriel</text><path d="M145 1300V1220M145 1300H570" stroke="#94a3b8" stroke-width="2"/><path d="M145 1300L440 1230" stroke="#0f8792" stroke-width="3"/><circle cx="440" cy="1230" r="9" fill="#0f8792"/><text x="465" y="1235" font-family="Arial,sans-serif" font-size="18" fill="#075985">xᵢ</text><text x="75" y="1330" font-family="Arial,sans-serif" font-size="17" fill="#475569">Le vecteur est représenté comme un point.</text><text x="36" y="1410" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">L’ID indique quelle ligne lire ; il n’est pas le vecteur.</text></svg>