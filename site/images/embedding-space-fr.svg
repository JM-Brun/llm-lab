<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Projection schématique d'un espace d'embeddings</title><desc id="d">Des vecteurs sont projetés dans un plan abstrait. Les regroupements sont illustratifs et ne sont pas des catégories sémantiques garanties.</desc><rect width="1000" height="520" rx="24" fill="#f7f8fc"/><text x="45" y="48" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#617bc5">ESPACE DE REPRÉSENTATION</text><text x="45" y="83" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#10233f">Chaque point représente un vecteur</text><g stroke="#d9e0eb" stroke-width="1"><path d="M120 140H900M120 220H900M120 300H900M120 380H900M120 460H900M200 125V475M340 125V475M480 125V475M620 125V475M760 125V475M900 125V475"/></g><path d="M120 475H920M120 475V120" fill="none" stroke="#52627a" stroke-width="2"/><text x="910" y="500" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#52627a">axe projeté 1</text><g fill="#087f8c"><circle cx="240" cy="245" r="8"/><circle cx="270" cy="265" r="8"/><circle cx="225" cy="285" r="8"/><circle cx="300" cy="235" r="8"/><circle cx="285" cy="300" r="8"/></g><g fill="#df8b67"><circle cx="635" cy="205" r="8"/><circle cx="675" cy="225" r="8"/><circle cx="650" cy="255" r="8"/><circle cx="710" cy="200" r="8"/><circle cx="690" cy="270" r="8"/></g><g fill="#617bc5"><circle cx="460" cy="380" r="8"/><circle cx="500" cy="405" r="8"/><circle cx="530" cy="370" r="8"/><circle cx="480" cy="430" r="8"/></g><g font-family="Arial,sans-serif" font-size="16" font-weight="700"><text x="220" y="200" fill="#075d65">Groupe A</text><text x="630" y="165" fill="#9b4e3c">Groupe B</text><text x="455" y="345" fill="#29478e">Groupe C</text></g><rect x="140" y="480" width="720" height="25" rx="8" fill="#e7edf5"/><text x="500" y="498" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52627a">Projection fictive : distances et voisinages peuvent être déformés.</text></svg>