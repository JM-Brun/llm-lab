<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">XOR before and after a feature transformation</title>
  <desc id="desc">In the original two-dimensional input space, XOR classes alternate at the four corners and no straight line separates them. In the transformed feature space u equals x1 plus x2 and v equals x1 times x2, the two positive cases coincide at (1,0), while the negative cases lie at (0,0) and (2,1); the straight boundary u minus 2v equals one half separates the classes.</desc>
  <defs>
    <style>
      .panel{fill:#fbfcfb;stroke:#cbd5ce;stroke-width:2}
      .axis{stroke:#46534a;stroke-width:2;fill:none}
      .grid{stroke:#dce4de;stroke-width:1}
      .boundary{stroke:#247b4b;stroke-width:4;stroke-dasharray:10 7;fill:none}
      .positive{fill:#238b57;stroke:#145b39;stroke-width:3}
      .negative{fill:#ffffff;stroke:#49564d;stroke-width:3}
      .label{font: 20px sans-serif;fill:#25342a}
      .small{font: 16px sans-serif;fill:#536258}
      .math{font: italic 19px sans-serif;fill:#25342a}
    </style>
  </defs>
  <rect x="18" y="18" width="520" height="394" rx="14" class="panel"/>
  <rect x="582" y="18" width="520" height="394" rx="14" class="panel"/>
  <text x="278" y="55" text-anchor="middle" class="label">$(x₁,x₂)$</text>
  <text x="842" y="55" text-anchor="middle" class="label">$(u,v)$</text>

  <!-- Original XOR square -->
  <path d="M125 95 V340 H430" class="axis"/>
  <path d="M125 95 H430 M125 218 H430 M125 340 H430 M125 95 V340 M278 95 V340 M430 95 V340" class="grid"/>
  <text x="278" y="386" text-anchor="middle" class="math">x₁</text>
  <text x="82" y="218" text-anchor="middle" class="math" transform="rotate(-90 82 218)">x₂</text>
  <circle cx="160" cy="305" r="13" class="negative"/>
  <circle cx="395" cy="305" r="13" class="positive"/>
  <circle cx="160" cy="130" r="13" class="positive"/>
  <circle cx="395" cy="130" r="13" class="negative"/>
  <text x="160" y="334" text-anchor="middle" class="small">00 · y=0</text>
  <text x="395" y="334" text-anchor="middle" class="small">10 · y=1</text>
  <text x="160" y="103" text-anchor="middle" class="small">01 · y=1</text>
  <text x="395" y="103" text-anchor="middle" class="small">11 · y=0</text>
  <text x="278" y="375" text-anchor="middle" class="small">Alternating classes: no separating line</text>

  <!-- Feature space: u=x1+x2, v=x1*x2 -->
  <path d="M680 340 V95 M680 340 H1045" class="axis"/>
  <path d="M680 340 H1045 M680 217 H1045 M680 95 H1045 M802 95 V340 M924 95 V340 M1045 95 V340" class="grid"/>
  <text x="862" y="386" text-anchor="middle" class="math">u = x₁ + x₂</text>
  <text x="642" y="218" text-anchor="middle" class="math" transform="rotate(-90 642 218)">v = x₁x₂</text>
  <path d="M786 340 L1045 161" class="boundary"/>
  <circle cx="710" cy="340" r="13" class="negative"/>
  <circle cx="862" cy="340" r="15" class="positive"/>
  <circle cx="1014" cy="130" r="13" class="negative"/>
  <text x="710" y="365" text-anchor="middle" class="small">(0,0) · y=0</text>
  <text x="862" y="365" text-anchor="middle" class="small">(1,0) · y=1</text>
  <text x="1014" y="103" text-anchor="middle" class="small">(2,1) · y=0</text>
  <text x="910" y="83" text-anchor="middle" class="small">Dashed boundary: u − 2v = 0.5</text>
  <circle cx="625" cy="405" r="8" class="positive"/>
  <text x="642" y="411" class="small">y=1</text>
  <circle cx="710" cy="405" r="8" class="negative"/>
  <text x="727" y="411" class="small">y=0</text>
</svg>