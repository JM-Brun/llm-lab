<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Four dimensions of tokenizer evaluation</title>
<desc id="desc">Conceptual four-panel diagram, without quantitative data.</desc>
<rect width="1000" height="440" rx="18" fill="#f7f8fa"/>
<text x="500" y="43" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172033">Evaluate against the question being asked</text>
<g>
<rect x="32" y="70" width="452" height="150" rx="14" fill="#ffffff" stroke="#8a96a8" stroke-width="1.5"/>
<circle cx="68" cy="106" r="20" fill="#e4ebf5" stroke="#526783"/>
<text x="68" y="113" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">1</text>
<text x="102" y="112" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">Efficiency</text>
<text x="54" y="152" font-family="sans-serif" font-size="18" fill="#25344a">Tokens / bytes</text>
<text x="54" y="186" font-family="sans-serif" font-size="15" fill="#475569">Compression, length</text>
</g><g>
<rect x="514" y="70" width="452" height="150" rx="14" fill="#ffffff" stroke="#8a96a8" stroke-width="1.5"/>
<circle cx="550" cy="106" r="20" fill="#e4ebf5" stroke="#526783"/>
<text x="550" y="113" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">2</text>
<text x="584" y="112" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">Downstream</text>
<text x="536" y="152" font-family="sans-serif" font-size="18" fill="#25344a">Measured tasks</text>
<text x="536" y="186" font-family="sans-serif" font-size="15" fill="#475569">Task-dependent quality</text>
</g><g>
<rect x="32" y="248" width="452" height="150" rx="14" fill="#ffffff" stroke="#8a96a8" stroke-width="1.5"/>
<circle cx="68" cy="284" r="20" fill="#e4ebf5" stroke="#526783"/>
<text x="68" y="291" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">3</text>
<text x="102" y="290" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">Multilingual</text>
<text x="54" y="330" font-family="sans-serif" font-size="18" fill="#25344a">Cross-language gaps</text>
<text x="54" y="364" font-family="sans-serif" font-size="15" fill="#475569">Context, cost, coverage</text>
</g><g>
<rect x="514" y="248" width="452" height="150" rx="14" fill="#ffffff" stroke="#8a96a8" stroke-width="1.5"/>
<circle cx="550" cy="284" r="20" fill="#e4ebf5" stroke="#526783"/>
<text x="550" y="291" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#172033">4</text>
<text x="584" y="290" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">Protocol</text>
<text x="536" y="330" font-family="sans-serif" font-size="18" fill="#25344a">Version + corpus</text>
<text x="536" y="364" font-family="sans-serif" font-size="15" fill="#475569">Reproducible comparison</text>
</g>
<text x="500" y="426" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">Conceptual framework: no ranking or experimental result is shown.</text>
