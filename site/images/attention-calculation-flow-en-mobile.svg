<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1420" viewBox="0 0 720 1420" role="img" aria-labelledby="title desc">
<title id="title">Attention computation</title><desc id="desc">Queries Q and keys K produce scores; an optional mask is applied before row-wise softmax. Weights A and values V are separate inputs to the aggregation O = AV.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker></defs>
<rect width="720" height="1420" rx="24" fill="#fbfcfe"/>
<text x="36" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172b4d">Attention computation</text>
<text x="36" y="98" font-family="Arial,sans-serif" font-size="19" fill="#475569">Two paths meet</text>
<rect x="55" y="145" width="610" height="105" rx="16" fill="#e8f1ff" stroke="#4778b8" stroke-width="2"/><text x="360" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173b67">Q and K · queries and keys</text><path d="M360 250 V290" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="310" width="610" height="105" rx="16" fill="#fff3d6" stroke="#bc8a24" stroke-width="2"/><text x="360" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#704d0a">Scores · QKᵀ / √dₖ</text><path d="M360 415 V455" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="475" width="610" height="105" rx="16" fill="#fde9e7" stroke="#c66a5c" stroke-width="2"/><text x="360" y="537" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#813b32">Mask M before softmax (optional)</text><path d="M360 580 V620" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="640" width="610" height="105" rx="16" fill="#f0eaff" stroke="#8063b3" stroke-width="2"/><text x="360" y="702" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#4b337b">Row-wise softmax · weights A</text><path d="M360 745 V785" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="36" y="820" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172b4d">Two inputs to the aggregation</text>
<rect x="40" y="850" width="300" height="110" rx="16" fill="#e9f7f0" stroke="#3a9270" stroke-width="2"/><text x="190" y="915" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17583f">Weights A</text>
<rect x="380" y="850" width="300" height="110" rx="16" fill="#e8f1ff" stroke="#4778b8" stroke-width="2"/><text x="530" y="915" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173b67">Values V</text>
<path d="M190 960 V1000 H360 V1050" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M530 960 V1000 H360" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="55" y="1060" width="610" height="115" rx="16" fill="#f0eaff" stroke="#8063b3" stroke-width="2"/><text x="360" y="1128" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#4b337b">Aggregation · O = AV</text>
<text x="36" y="1255" font-family="Arial,sans-serif" font-size="18" fill="#344054">Q and K determine the weights; V supplies the content.</text><text x="36" y="1292" font-family="Arial,sans-serif" font-size="18" fill="#344054">Softmax is over the key positions accessible to each query.</text>
</svg>