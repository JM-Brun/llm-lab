<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
<title id="title">Attention computation, step by step</title><desc id="desc">Queries Q and keys K produce scores, then softmax gives weights A. Values V are aggregated with those weights to form O.</desc>
<rect width="720" height="1500" rx="24" fill="#fbfcfe"/>
<text x="36" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172b4d">Attention computation</text>
<text x="36" y="96" font-family="Arial,sans-serif" font-size="19" fill="#475569">Scores determine weights; V supplies the content.</text>
<rect x="55" y="135" width="610" height="112" rx="16" fill="#e8f1ff" stroke="#4778b8" stroke-width="2"/><text x="360" y="201" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173b67">Q and K · queries and keys</text><path d="M360 247 V285" stroke="#344054" stroke-width="3"/><path d="M350 275 L360 286 L370 275" fill="none" stroke="#344054" stroke-width="3"/><rect x="55" y="330" width="610" height="112" rx="16" fill="#fff3d6" stroke="#bc8a24" stroke-width="2"/><text x="360" y="396" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#704d0a">Scores · QKᵀ / √dₖ</text><path d="M360 442 V480" stroke="#344054" stroke-width="3"/><path d="M350 470 L360 481 L370 470" fill="none" stroke="#344054" stroke-width="3"/><rect x="55" y="525" width="610" height="112" rx="16" fill="#fde9e7" stroke="#c66a5c" stroke-width="2"/><text x="360" y="591" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#813b32">Mask M before softmax (optional)</text><path d="M360 637 V675" stroke="#344054" stroke-width="3"/><path d="M350 665 L360 676 L370 665" fill="none" stroke="#344054" stroke-width="3"/><rect x="55" y="720" width="610" height="112" rx="16" fill="#f0eaff" stroke="#8063b3" stroke-width="2"/><text x="360" y="786" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#4b337b">Row-wise softmax · weights A</text><path d="M360 832 V870" stroke="#344054" stroke-width="3"/><path d="M350 860 L360 871 L370 860" fill="none" stroke="#344054" stroke-width="3"/><rect x="55" y="915" width="610" height="112" rx="16" fill="#e8f1ff" stroke="#4778b8" stroke-width="2"/><text x="360" y="981" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173b67">Values V · content being passed</text><path d="M360 1027 V1065" stroke="#344054" stroke-width="3"/><path d="M350 1055 L360 1066 L370 1055" fill="none" stroke="#344054" stroke-width="3"/><rect x="55" y="1110" width="610" height="112" rx="16" fill="#e9f7f0" stroke="#3a9270" stroke-width="2"/><text x="360" y="1176" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17583f">Aggregation · O = AV</text>
<text x="36" y="1325" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172b4d">Keep distinct</text>
<text x="36" y="1365" font-family="Arial,sans-serif" font-size="18" fill="#344054">Scores are raw; A is a distribution over positions;</text>
<text x="36" y="1395" font-family="Arial,sans-serif" font-size="18" fill="#344054">O is a weighted combination of value vectors V.</text>
</svg>