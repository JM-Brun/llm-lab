<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Comment un LLM génère du texte</title><desc id="desc">Un repère commun : du préfixe fourni au prochain token — puis retour au début. Six étapes : texte d’entrée, tokenisation, représentations numériques, calcul dans le Transformer, distribution du prochain token et décodage avec boucle de retour.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#315f9f" stroke-width="2"/></marker>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b4d}.title{font-size:36px;font-weight:750}.subtitle{font-size:21px;fill:#52647f}.head{font-size:20px;font-weight:700}.stage{font-size:18px;font-weight:750}.body{font-size:17px}.small{font-size:15px}.tiny{font-size:14px}.panel{stroke-width:2.2}</style></defs>
<rect width="1600" height="980" fill="#fff"/><text x="40" y="60" class="title">Comment un LLM génère du texte</text><text x="42" y="98" class="subtitle">Un repère commun : du préfixe fourni au prochain token — puis retour au début</text><path d="M40 125 H1560" stroke="#d9e2ef" stroke-width="2"/><rect x="30" y="190" width="240" height="510" rx="18" fill="#f1f6ff" stroke="#9dbcf0" class="panel"/><circle cx="58" cy="222" r="19" fill="#2866b8"/><text x="58" y="230" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">1</text><text x="85" y="229" class="stage">Texte d’entrée</text><text x="48" y="281" class="head">Préfixe / prompt</text><text x="48" y="330" class="body">Le texte et le contexte</text><text x="48" y="360" class="body">déjà disponibles</text><text x="48" y="390" class="body">Le modèle prolonge</text><text x="48" y="420" class="body">ce préfixe.</text><path d="M274 440 H281" stroke="#315f9f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="290" y="190" width="240" height="510" rx="18" fill="#f7f2ff" stroke="#c7b1ee" class="panel"/><circle cx="318" cy="222" r="19" fill="#7046b8"/><text x="318" y="230" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">2</text><text x="345" y="229" class="stage">Tokenisation</text><text x="308" y="281" class="head">Tokenizer</text><text x="308" y="330" class="body">Découper le texte en tokens</text><text x="308" y="360" class="body">Attribuer un identifiant</text><text x="308" y="390" class="body">entier à chaque token.</text><text x="308" y="420" class="body">Les frontières dépendent</text><text x="308" y="450" class="body">du tokenizer.</text><rect x="308" y="470" width="204" height="62" rx="10" fill="#fff" stroke="#c7b1ee"/><text x="410" y="495" text-anchor="middle" class="small">token A · token B</text><text x="410" y="518" text-anchor="middle" class="small">token C · …</text><text x="308" y="576" class="small" font-weight="700">IDs</text><g fill="#fff" stroke="#c7b1ee"><rect x="308" y="590" width="55" height="42" rx="7"/><rect x="373" y="590" width="55" height="42" rx="7"/><rect x="438" y="590" width="55" height="42" rx="7"/></g><g class="small" text-anchor="middle"><text x="335" y="616">17</text><text x="400" y="616">204</text><text x="465" y="616">…</text></g><path d="M534 440 H541" stroke="#315f9f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="550" y="190" width="240" height="510" rx="18" fill="#eff8ff" stroke="#a9cfe7" class="panel"/><circle cx="578" cy="222" r="19" fill="#2876a8"/><text x="578" y="230" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">3</text><text x="605" y="229" class="stage">Vecteurs + position</text><text x="568" y="281" class="head">Embedding + position</text><text x="568" y="330" class="body">Associer les identifiants</text><text x="568" y="360" class="body">à des vecteurs</text><text x="568" y="390" class="body">Intégrer l’information</text><text x="568" y="420" class="body">de position.</text><text x="568" y="450" class="body">Une suite de vecteurs</text><text x="568" y="480" class="body">numériques est obtenue.</text><g fill="#fff" stroke="#a9cfe7"><rect x="568" y="490" width="58" height="76" rx="8"/><rect x="641" y="490" width="58" height="76" rx="8"/><rect x="714" y="490" width="58" height="76" rx="8"/></g><g fill="#2876a8"><circle cx="584" cy="509" r="4"/><circle cx="598" cy="530" r="4"/><circle cx="612" cy="550" r="4"/><circle cx="657" cy="509" r="4"/><circle cx="671" cy="530" r="4"/><circle cx="685" cy="550" r="4"/><circle cx="730" cy="509" r="4"/><circle cx="744" cy="530" r="4"/><circle cx="758" cy="550" r="4"/></g><path d="M794 440 H801" stroke="#315f9f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="810" y="190" width="240" height="510" rx="18" fill="#f0faf4" stroke="#9bd3b2" class="panel"/><circle cx="838" cy="222" r="19" fill="#238653"/><text x="838" y="230" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">4</text><text x="865" y="229" class="stage">Calcul Transformer</text><text x="828" y="281" class="head">Blocs décodeur × N</text><text x="828" y="330" class="body">Attention causale</text><text x="828" y="360" class="body">MLP · connexions résiduelles</text><text x="828" y="390" class="body">· normalisation</text><text x="828" y="420" class="body">Les représentations deviennent</text><text x="828" y="450" class="body">contextualisées.</text><rect x="828" y="485" width="204" height="150" rx="12" fill="#fff" stroke="#9bd3b2"/><rect x="845" y="505" width="170" height="42" rx="8" fill="#e3f3e9"/><text x="930" y="532" text-anchor="middle" class="small" font-weight="700">Attention causale</text><path d="M930 550 V570" stroke="#238653" stroke-width="2" marker-end="url(#arrow)"/><rect x="845" y="576" width="170" height="42" rx="8" fill="#e3f3e9"/><text x="930" y="603" text-anchor="middle" class="small" font-weight="700">MLP</text><text x="828" y="668" class="small">Répété dans une pile de blocs</text><path d="M1054 440 H1061" stroke="#315f9f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1070" y="190" width="240" height="510" rx="18" fill="#fff8e9" stroke="#e8c77f" class="panel"/><circle cx="1098" cy="222" r="19" fill="#ad7a16"/><text x="1098" y="230" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">5</text><text x="1125" y="229" class="stage">Distribution</text><text x="1088" y="281" class="head">Tête de sortie</text><text x="1088" y="310" class="small">Logits → softmax</text><text x="1088" y="330" class="body">Un logit par token du</text><text x="1088" y="360" class="body">vocabulaire ; softmax</text><text x="1088" y="390" class="body">convertit les scores</text><text x="1088" y="420" class="body">en probabilités.</text><text x="1088" y="450" class="body">Distribution illustrative :</text><text x="1088" y="494" class="small">Être</text><text x="1290" y="494" text-anchor="end" class="small" font-weight="700">60 %</text><rect x="1088" y="502" width="204" height="9" rx="4" fill="#ead9b2"/><rect x="1088" y="502" width="122.39999999999999" height="9" rx="4" fill="#bd9344"/><text x="1088" y="542" class="small">Vous</text><text x="1290" y="542" text-anchor="end" class="small" font-weight="700">20 %</text><rect x="1088" y="550" width="204" height="9" rx="4" fill="#ead9b2"/><rect x="1088" y="550" width="40.800000000000004" height="9" rx="4" fill="#bd9344"/><text x="1088" y="590" class="small">Oui</text><text x="1290" y="590" text-anchor="end" class="small" font-weight="700">10 %</text><rect x="1088" y="598" width="204" height="9" rx="4" fill="#ead9b2"/><rect x="1088" y="598" width="20.400000000000002" height="9" rx="4" fill="#bd9344"/><text x="1088" y="638" class="small">Non</text><text x="1290" y="638" text-anchor="end" class="small" font-weight="700">10 %</text><rect x="1088" y="646" width="204" height="9" rx="4" fill="#ead9b2"/><rect x="1088" y="646" width="20.400000000000002" height="9" rx="4" fill="#bd9344"/><path d="M1314 440 H1321" stroke="#315f9f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1330" y="190" width="240" height="510" rx="18" fill="#fff4ed" stroke="#efbd9a" class="panel"/><circle cx="1358" cy="222" r="19" fill="#d9782a"/><text x="1358" y="230" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">6</text><text x="1385" y="229" class="stage">Génération</text><text x="1348" y="281" class="head">Règle de décodage</text><text x="1348" y="330" class="body">Sélectionner un token</text><text x="1348" y="360" class="body">Ajouter son ID à la séquence</text><text x="1348" y="390" class="body">et relancer le modèle.</text><text x="1348" y="420" class="body">La boucle s’arrête selon</text><text x="1348" y="450" class="body">une condition d’arrêt.</text><rect x="1348" y="485" width="204" height="78" rx="10" fill="#fff" stroke="#efbd9a"/><text x="1450" y="516" text-anchor="middle" class="head">Décodage</text><text x="1450" y="541" text-anchor="middle" class="small">Maximum ou échantillonnage</text><rect x="1348" y="585" width="204" height="65" rx="10" fill="#ffe5d2" stroke="#efbd9a"/><text x="1450" y="612" text-anchor="middle" class="head">Être</text><text x="1450" y="635" text-anchor="middle" class="small">Token sélectionné : 60 %</text><text x="1348" y="680" class="tiny">La sélection suit la sortie du modèle.</text><path d="M1450 710 V790 Q1450 830 1410 830 H190 Q150 830 150 790 V710" fill="none" stroke="#315f9f" stroke-width="4" marker-end="url(#arrow)"/><rect x="380" y="770" width="840" height="105" rx="16" fill="#edf4ff" stroke="#8eafe0" stroke-width="2"/><text x="800" y="812" text-anchor="middle" class="head">Ajouter l’identifiant du token sélectionné à la séquence</text><text x="800" y="844" text-anchor="middle" class="body">Puis reprendre à l’étape 3 avec la séquence enrichie</text><text x="40" y="930" class="small">Vue d’un GPT autorégressif décodeur seul. Tokenisation et architecture varient ; probabilités illustratives.</text></svg>