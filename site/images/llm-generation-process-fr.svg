<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Le processus de génération autorégressive</title>
<desc id="desc">Le contexte est préparé et tokenisé, traité par un GPT à paramètres fixes, puis converti en distribution de probabilités. Une règle de décodage sélectionne un token, qui est ajouté au contexte avant de recommencer.</desc>
<defs>
 <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1 L11 7 L1 13" fill="none" stroke="#315f9f" stroke-width="2.5"/></marker>
 <style>
 text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b4d}
 .title{font-size:38px;font-weight:750}.subtitle{font-size:24px;fill:#52647f}
 .head{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:19px}.tiny{font-size:17px}
 .panel{stroke-width:2.5}
 </style>
</defs>
<rect width="1600" height="900" fill="#fff"/>
<text x="48" y="62" class="title">Le processus de génération autorégressive</text>
<text x="50" y="104" class="subtitle">Du texte fourni à la sélection du prochain token — puis le processus recommence</text>
<path d="M50 132 H1550" stroke="#d9e2ef" stroke-width="2"/>
<!-- context -->
<rect x="30" y="175" width="285" height="505" rx="22" fill="#f1f6ff" stroke="#9dbcf0" class="panel"/>
<circle cx="70" cy="220" r="24" fill="#2866b8"/><text x="70" y="228" text-anchor="middle" font-size="23" font-weight="750" fill="#fff">1</text>
<text x="108" y="228" class="head">Contexte</text>
<text x="55" y="285" class="body">Le prompt et les</text><text x="55" y="315" class="body">échanges précédents.</text>
<rect x="55" y="355" width="235" height="245" rx="15" fill="#fff" stroke="#8eb1eb" stroke-width="2"/>
<text x="77" y="398" class="body" font-weight="700">« C’est une bonne</text><text x="77" y="430" class="body" font-weight="700">situation, ça, scribe ? »</text>
<text x="77" y="485" class="small" font-weight="700">CONTEXTE DISPONIBLE</text>
<rect x="77" y="508" width="190" height="14" rx="7" fill="#c4d1e3"/><rect x="77" y="535" width="172" height="14" rx="7" fill="#c4d1e3"/><rect x="77" y="562" width="184" height="14" rx="7" fill="#c4d1e3"/>
<!-- tokenize -->
<rect x="345" y="175" width="285" height="505" rx="22" fill="#f7f2ff" stroke="#c7b1ee" class="panel"/>
<circle cx="385" cy="220" r="24" fill="#7046b8"/><text x="385" y="228" text-anchor="middle" font-size="23" font-weight="750" fill="#fff">2</text>
<text x="423" y="228" class="head">Préparer l’entrée</text>
<text x="370" y="285" class="body">Le tokenizer découpe</text><text x="370" y="315" class="body">le texte en tokens.</text>
<text x="370" y="365" class="small" font-weight="700">EXEMPLE SCHÉMATIQUE</text>
<g fill="#d8c9f1" stroke="#b9a3e4" stroke-width="1.5">
 <rect x="370" y="390" width="52" height="58" rx="9"/><rect x="432" y="390" width="40" height="58" rx="9"/><rect x="482" y="390" width="90" height="58" rx="9"/>
</g>
<text x="396" y="426" text-anchor="middle" class="small">ça</text><text x="452" y="426" text-anchor="middle" class="small">,</text><text x="527" y="426" text-anchor="middle" class="small">scribe</text>
<text x="370" y="500" class="body">Les tokens sont ensuite</text><text x="370" y="530" class="body">convertis en identifiants</text><text x="370" y="560" class="body">et en représentations.</text>
<!-- model -->
<rect x="660" y="175" width="285" height="505" rx="22" fill="#f0faf4" stroke="#9bd3b2" class="panel"/>
<circle cx="700" cy="220" r="24" fill="#238653"/><text x="700" y="228" text-anchor="middle" font-size="23" font-weight="750" fill="#fff">3</text>
<text x="738" y="228" class="head">Modèle GPT</text>
<text x="685" y="285" class="body">Le réseau traite le</text><text x="685" y="315" class="body">contexte et calcule</text><text x="685" y="345" class="body">des scores de sortie.</text>
<rect x="690" y="390" width="225" height="185" rx="18" fill="#e0f4e7" stroke="#26845a" stroke-width="3"/>
<rect x="727" y="412" width="151" height="38" rx="18" fill="#fff" stroke="#9bcfb0"/>
<text x="802" y="438" text-anchor="middle" class="small" font-weight="700">PARAMÈTRES FIXES</text>
<text x="802" y="510" text-anchor="middle" font-size="42" font-weight="750" fill="#145b3b">GPT</text>
<text x="802" y="548" text-anchor="middle" class="small">Passe avant</text>
<!-- distribution -->
<rect x="975" y="175" width="285" height="505" rx="22" fill="#fff8e9" stroke="#e8c77f" class="panel"/>
<circle cx="1015" cy="220" r="24" fill="#ad7a16"/><text x="1015" y="228" text-anchor="middle" font-size="23" font-weight="750" fill="#fff">4</text>
<text x="1053" y="228" class="head">Distribution</text>
<text x="1000" y="285" class="body">Softmax transforme</text><text x="1000" y="315" class="body">les scores en probabilités.</text>
<text x="1000" y="365" class="small" font-weight="700">CONTINUATIONS POSSIBLES</text>
<text x="1000" y="415" class="body">« Être »</text><text x="1228" y="415" text-anchor="end" class="body" font-weight="700">60 %</text>
<rect x="1000" y="426" width="220" height="12" rx="6" fill="#ead9b2"/><rect x="1000" y="426" width="132" height="12" rx="6" fill="#bd9344"/>
<text x="1000" y="475" class="body">« Vous »</text><text x="1228" y="475" text-anchor="end" class="body" font-weight="700">20 %</text>
<rect x="1000" y="486" width="220" height="12" rx="6" fill="#ead9b2"/><rect x="1000" y="486" width="44" height="12" rx="6" fill="#bd9344"/>
<text x="1000" y="535" class="body">« Oui »</text><text x="1228" y="535" text-anchor="end" class="body" font-weight="700">10 %</text>
<rect x="1000" y="546" width="220" height="12" rx="6" fill="#ead9b2"/><rect x="1000" y="546" width="22" height="12" rx="6" fill="#bd9344"/>
<text x="1000" y="590" class="small">« Non » : 10 %</text>
<!-- select -->
<rect x="1290" y="175" width="280" height="505" rx="22" fill="#fff4ed" stroke="#efbd9a" class="panel"/>
<circle cx="1330" cy="220" r="24" fill="#d9782a"/><text x="1330" y="228" text-anchor="middle" font-size="23" font-weight="750" fill="#fff">5</text>
<text x="1368" y="228" class="head">Sélection</text>
<text x="1315" y="285" class="body">Une règle choisit</text><text x="1315" y="315" class="body">le prochain token.</text>
<rect x="1315" y="365" width="230" height="100" rx="14" fill="#fff" stroke="#e9b18b" stroke-width="2"/>
<text x="1430" y="405" text-anchor="middle" class="body" font-weight="700">Décodage</text><text x="1430" y="438" text-anchor="middle" class="small">Maximum ou échantillonnage</text>
<rect x="1315" y="495" width="230" height="100" rx="14" fill="#ffe5d2" stroke="#df8b4c" stroke-width="2"/>
<text x="1430" y="535" text-anchor="middle" class="body" font-weight="700">« Être »</text><text x="1430" y="568" text-anchor="middle" class="small">Token sélectionné : 60 %</text>
<text x="1315" y="630" class="tiny">L’échantillonnage peut choisir</text><text x="1315" y="653" class="tiny">un token moins probable que le maximum.</text>
<!-- arrows -->
<g fill="none" stroke="#315f9f" stroke-width="5" marker-end="url(#arrow)">
 <path d="M320 420 H337"/><path d="M635 420 H652"/><path d="M950 420 H967"/><path d="M1265 420 H1282"/>
</g>
<path d="M1430 690 V760 Q1430 800 1390 800 H170 Q130 800 130 760 V690" fill="none" stroke="#315f9f" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="470" y="735" width="660" height="105" rx="18" fill="#edf4ff" stroke="#8eafe0" stroke-width="2"/>
<text x="800" y="778" text-anchor="middle" class="head">Ajouter le token au contexte</text>
<text x="800" y="812" text-anchor="middle" class="body">Puis recommencer le calcul avec le contexte enrichi</text>
<text x="50" y="875" class="small">Les probabilités sont illustratives et ne proviennent pas d’un modèle particulier.</text>
</svg>