<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1660" viewBox="0 0 720 1660" role="img" aria-labelledby="title desc"><title id="title">Le flux d’un GPT autorégressif</title><desc id="desc">The context is tokenized, converted to vectors, processed by Transformer blocks, mapped to logits and probabilities, then one token is selected and fed back into the context. Parameters remain fixed.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#344054"/></marker></defs><rect width="720" height="1660" rx="24" fill="#fbfcfe"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172b4d">Le flux d’un GPT autorégressif</text><rect x="55" y="140" width="610" height="112" rx="16" fill="#e8f1ff" stroke="#4778b8" stroke-width="2"/><text x="360" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173b67">Contexte fourni</text><path d="M360 252V295" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="55" y="315" width="610" height="112" rx="16" fill="#e9f7f0" stroke="#3a9270" stroke-width="2"/><text x="360" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17583f">Tokenisation · IDs</text><path d="M360 427V470" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="55" y="490" width="610" height="112" rx="16" fill="#fff3d6" stroke="#bc8a24" stroke-width="2"/><text x="360" y="557" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#704d0a">Embeddings + position</text><path d="M360 602V645" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="55" y="665" width="610" height="112" rx="16" fill="#f0eaff" stroke="#8063b3" stroke-width="2"/><text x="360" y="732" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#4b337b">Blocs Transformer répétés</text><path d="M360 777V820" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="55" y="840" width="610" height="112" rx="16" fill="#fde9e7" stroke="#c66a5c" stroke-width="2"/><text x="360" y="907" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#813b32">Logits · scores du vocabulaire</text><path d="M360 952V995" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="55" y="1015" width="610" height="112" rx="16" fill="#e8f1ff" stroke="#4778b8" stroke-width="2"/><text x="360" y="1082" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173b67">Softmax · distribution</text><path d="M360 1127V1170" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="55" y="1190" width="610" height="112" rx="16" fill="#e9f7f0" stroke="#3a9270" stroke-width="2"/><text x="360" y="1257" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17583f">Sélection du prochain token</text><path d="M360 1302V1345" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="55" y="1365" width="610" height="112" rx="16" fill="#fff3d6" stroke="#bc8a24" stroke-width="2"/><text x="360" y="1432" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#704d0a">Ajouter le token au contexte</text><path d="M55 1420H25V196H45" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="72" y="1575" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#172b4d">Les paramètres restent fixes pendant la génération.</text><text x="72" y="1610" font-family="Arial,sans-serif" font-size="17" fill="#475569">La boucle s’arrête selon un critère de fin ou une limite.</text></svg>