<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="460" viewBox="0 0 1050 460" role="img" aria-labelledby="t d"><title id="t">Où l'information de position entre dans le calcul</title><desc id="d">Un encodage absolu est ajouté aux embeddings en entrée. RoPE fait tourner les requêtes et les clés après leurs projections, avant le produit QK, si bien que les scores d'attention portent l'information de position.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526b82"/></marker></defs><rect width="1050" height="460" rx="24" fill="#f5f8fc"/><text x="44" y="48" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#087f8c">ENCODAGE POSITIONNEL</text><text x="44" y="84" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#10233f">Où l'information de position entre-t-elle ?</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="40" y="110" width="465" height="300" rx="18" fill="#fff" stroke="#cbd6e3" stroke-width="2"/><text x="272" y="142" font-size="20" font-weight="700" fill="#10233f">Encodage absolu</text><text x="272" y="166" font-size="14" fill="#52627a">ajouté aux vecteurs en entrée</text><rect x="177" y="186" width="190" height="46" rx="10" fill="#e8f1ff" stroke="#4778b8" stroke-width="2"/><text x="272" y="215" font-size="15" font-weight="700" fill="#173b67">Embeddings des tokens</text><path d="M272 232 V251" stroke="#526b82" stroke-width="2.5" fill="none" marker-end="url(#a)"/><circle cx="272" cy="267" r="14" fill="#fff" stroke="#526b82" stroke-width="2"/><path d="M262 267 H282 M272 257 V277" stroke="#526b82" stroke-width="2.5" fill="none"/><rect x="48" y="242" width="125" height="50" rx="10" fill="#fff3d6" stroke="#bc8a24" stroke-width="2"/><text x="110" y="262" font-size="12.5" font-weight="700" fill="#704d0a">Encodage</text><text x="110" y="280" font-size="12.5" font-weight="700" fill="#704d0a">de position</text><path d="M173 267 H254" stroke="#526b82" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M272 281 V300" stroke="#526b82" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="177" y="303" width="190" height="46" rx="10" fill="#e9f7f0" stroke="#3a9270" stroke-width="2"/><text x="272" y="332" font-size="15" font-weight="700" fill="#17583f">Vecteurs d'entrée</text><text x="272" y="380" font-size="13" fill="#52627a">Toute la suite du calcul voit la position</text><text x="272" y="398" font-size="13" fill="#52627a">à travers ces vecteurs.</text><rect x="545" y="110" width="465" height="300" rx="18" fill="#fff" stroke="#cbd6e3" stroke-width="2"/><text x="777" y="142" font-size="20" font-weight="700" fill="#10233f">RoPE</text><text x="777" y="166" font-size="14" fill="#52627a">appliqué aux requêtes et aux clés, dans l'attention</text><rect x="682" y="186" width="190" height="46" rx="10" fill="#e8f1ff" stroke="#4778b8" stroke-width="2"/><text x="777" y="215" font-size="14" font-weight="700" fill="#173b67">Q et K après projection</text><path d="M777 232 V251" stroke="#526b82" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="682" y="254" width="190" height="46" rx="10" fill="#dff2f1" stroke="#087f8c" stroke-width="2"/><text x="777" y="283" font-size="14" font-weight="700" fill="#075d65">Rotation selon la position</text><path d="M777 300 V319" stroke="#526b82" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="667" y="322" width="220" height="46" rx="10" fill="#fbe9e0" stroke="#df8b67" stroke-width="2"/><text x="777" y="351" font-size="14" font-weight="700" fill="#8a4d2a">Scores QK : décalage relatif</text><text x="777" y="380" font-size="13" fill="#52627a">Les valeurs V ne sont pas tournées :</text><text x="777" y="398" font-size="13" fill="#52627a">la position entre dans les scores d'attention.</text><text x="525" y="445" font-size="14" fill="#52627a">Schéma conceptuel : la position entre dans le calcul à des endroits différents selon la méthode.</text></g></svg>