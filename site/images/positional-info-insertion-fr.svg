<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="450" viewBox="0 0 1050 450" role="img" aria-labelledby="t d"><title id="t">Où l’information de position entre dans le calcul</title><desc id="d">Un encodage absolu est ajouté aux embeddings en entrée, avant toute projection. RoPE applique des rotations aux requêtes et aux clés après leurs projections, avant le produit QK, si bien que les scores d’attention portent l’information de position.</desc><rect width="1050" height="450" rx="24" fill="#f5f8fc"/><text x="44" y="48" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#087f8c">ENCODAGE POSITIONNEL · OÙ ENTRE LA POSITION</text><text x="44" y="84" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#10233f">Deux endroits d’injection : en entrée ou dans les requêtes et clés</text><rect x="44" y="104" width="462" height="270" rx="18" fill="#fff" stroke="#cbd6e3" stroke-width="2"/><rect x="130" y="166" width="290" height="46" rx="10" fill="#f5f8fc" stroke="#cbd6e3" stroke-width="2"/><text x="275" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#10233f">Embeddings des tokens</text><path d="M275 216V236" stroke="#526b82" stroke-width="2.5"/><path d="M268 234L275 246L282 234" fill="none" stroke="#526b82" stroke-width="2.5"/><rect x="130" y="250" width="290" height="46" rx="10" fill="#dff2f1" stroke="#087f8c" stroke-width="2"/><text x="275" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#075d65">+ vecteur d’encodage de position</text><path d="M275 300V320" stroke="#526b82" stroke-width="2.5"/><path d="M268 318L275 330L282 318" fill="none" stroke="#526b82" stroke-width="2.5"/><rect x="130" y="334" width="290" height="40" rx="10" fill="#fff" stroke="#cbd6e3" stroke-width="2"/><text x="275" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#10233f">Projections linéaires → Q, K, V</text><text x="275" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233f">Encodage absolu</text><text x="275" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52627a">la position entre avant toute projection</text><rect x="544" y="104" width="462" height="270" rx="18" fill="#fff" stroke="#cbd6e3" stroke-width="2"/><text x="715" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233f">RoPE</text><rect x="570" y="166" width="290" height="46" rx="10" fill="#f5f8fc" stroke="#cbd6e3" stroke-width="2"/><text x="715" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#10233f">Embeddings des tokens</text><path d="M715 216V236" stroke="#526b82" stroke-width="2.5"/><path d="M708 234L715 246L722 234" fill="none" stroke="#526b82" stroke-width="2.5"/><rect x="570" y="250" width="290" height="46" rx="10" fill="#fff" stroke="#cbd6e3" stroke-width="2"/><text x="715" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#10233f">Projections linéaires → Q, K, V</text><path d="M715 300V310" stroke="#526b82" stroke-width="2.5"/><path d="M715 310H627V318" fill="none" stroke="#526b82" stroke-width="2.5"/><path d="M715 310H775V318" fill="none" stroke="#526b82" stroke-width="2.5"/><path d="M715 310H923V318" fill="none" stroke="#526b82" stroke-width="2.5"/><path d="M620 312L627 322L634 312" fill="none" stroke="#526b82" stroke-width="2.5"/><path d="M768 312L775 322L782 312" fill="none" stroke="#526b82" stroke-width="2.5"/><path d="M916 312L923 322L930 312" fill="none" stroke="#526b82" stroke-width="2.5"/><rect x="564" y="326" width="126" height="42" rx="10" fill="#dff2f1" stroke="#087f8c" stroke-width="2"/><text x="627" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#075d65">Requête Q</text><text x="627" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#075d65">rotation</text><rect x="712" y="326" width="126" height="42" rx="10" fill="#dff2f1" stroke="#087f8c" stroke-width="2"/><text x="775" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#075d65">Clé K</text><text x="775" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#075d65">rotation</text><rect x="860" y="326" width="126" height="42" rx="10" fill="#f1f4f8" stroke="#cbd6e3" stroke-width="2"/><text x="923" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#52627a">Valeur V</text><text x="923" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#52627a">non tournée</text><text x="715" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52627a">la position entre après les projections, avant le produit QK</text><text x="525" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52627a">Schéma conceptuel, pas les valeurs numériques d’un modèle réel.</text></svg>