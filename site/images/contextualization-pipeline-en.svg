<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
<title id="title">Pipeline from text to contextualized representations</title>
<desc id="desc">Text is tokenized into IDs, mapped to vectors by lookup, positionally handled, then contextualized by Transformer blocks.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#52665a"/></marker></defs>
<style>.label{font:600 12.5px system-ui,sans-serif;fill:#1f3528}.sub{font:12px system-ui,sans-serif;fill:#52665a}</style>
<path d="M 165 90 H 182" fill="none" stroke="#52665a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 335 90 H 352" fill="none" stroke="#52665a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 505 90 H 522" fill="none" stroke="#52665a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 675 90 H 692" fill="none" stroke="#52665a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 845 90 H 862" fill="none" stroke="#52665a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 1015 90 H 1032" fill="none" stroke="#52665a" stroke-width="2.5" marker-end="url(#arrow)"/><g transform="translate(20,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#f5f7f6" stroke="#789184" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">Text</text><text x="70" y="111" text-anchor="middle" class="sub">raw sequence</text></g><g transform="translate(190,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#f5f7f6" stroke="#789184" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">Tokenization</text><text x="70" y="111" text-anchor="middle" class="sub">tokens</text></g><g transform="translate(360,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#f5f7f6" stroke="#789184" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">Token IDs</text><text x="70" y="111" text-anchor="middle" class="sub">integer indices</text></g><g transform="translate(530,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#f5f7f6" stroke="#789184" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">Embedding lookup</text><text x="70" y="111" text-anchor="middle" class="sub">E[ID]</text></g><g transform="translate(700,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#f5f7f6" stroke="#789184" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">Positional handling</text><text x="70" y="111" text-anchor="middle" class="sub">architecture-dependent</text></g><g transform="translate(870,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#f5f7f6" stroke="#789184" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">Transformer blocks</text><text x="70" y="111" text-anchor="middle" class="sub">attention + MLP</text></g><g transform="translate(1040,0)"><rect x="0" y="34" width="140" height="112" rx="12" fill="#e7f3eb" stroke="#28734b" stroke-width="2"/><text x="70" y="78" text-anchor="middle" class="label">Contextualized states</text><text x="70" y="111" text-anchor="middle" class="sub">hₜ⁽ˡ⁾</text></g></svg>