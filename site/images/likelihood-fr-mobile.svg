<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="title desc"><title id="title">Scorer une continuation observée</title><desc id="desc">Trois tokens de référence sont évalués successivement avec des préfixes observés qui s'allongent. Les probabilités conditionnelles 0,6, 0,5 et 0,8 se multiplient pour donner 0,24 ; leurs logarithmes s'additionnent. Les paramètres restent fixes.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#475569"/></marker></defs><rect x="1" y="1" width="478" height="798" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><text x="24" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17212B" text-anchor="start">Scorer une continuation observée</text><rect x="24" y="78" width="432" height="132" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="44" y="108" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">Étape 1</text><text x="44" y="140" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17212B" text-anchor="start">Préfixe : c</text><text x="44" y="169" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17212B" text-anchor="start">Cible observée x₁</text><text x="44" y="196" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">P(x₁ | c) = 0,6</text><path d="M240 213 L240 236" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="244" width="432" height="132" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="44" y="274" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">Étape 2</text><text x="44" y="306" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17212B" text-anchor="start">Préfixe : c, x₁</text><text x="44" y="335" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17212B" text-anchor="start">Cible observée x₂</text><text x="44" y="362" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">P(x₂ | c, x₁) = 0,5</text><path d="M240 379 L240 402" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="410" width="432" height="132" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="44" y="440" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">Étape 3</text><text x="44" y="472" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17212B" text-anchor="start">Préfixe : c, x₁, x₂</text><text x="44" y="501" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17212B" text-anchor="start">Cible observée x₃</text><text x="44" y="528" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D" text-anchor="start">P(x₃ | c, x₁, x₂) = 0,8</text><rect x="24" y="596" width="432" height="132" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="44" y="628" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17212B" text-anchor="start">Produit = vraisemblance</text><text x="44" y="660" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15803D" text-anchor="start">0,6 × 0,5 × 0,8 = 0,24</text><text x="44" y="696" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0369A1" text-anchor="start">Somme des logs = ln 0,24</text><text x="24" y="770" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#475569" text-anchor="start">Référence observée · θ fixe</text></svg>