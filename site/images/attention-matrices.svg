  <text x="210" y="188" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10233f">Scores bruts</text>
  <text x="210" y="214" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#51627a">Compatibilités avant normalisation</text>
  <text x="210" y="246" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="750" fill="#34465e">S = QKᵀ / √d_k</text>
  <text x="210" y="270" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#51627a">Forme : T × T</text>
