<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
  <title id="title">Des scores aux poids, puis à la sortie</title><desc id="desc">Les scores peuvent être négatifs ; les poids sont positifs et normalisés. S et A ont la forme T × T ; O a la forme T × d_v. Les poids affichés sont des exemples dont chaque ligne somme à un.</desc><defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f5ff"/><stop offset="1" stop-color="#fff5ee"/></linearGradient>
 <linearGradient id="score" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#d9d4f5"/><stop offset="1" stop-color="#6555a5"/></linearGradient>
 <linearGradient id="weight" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#c9eee5"/><stop offset="1" stop-color="#087f70"/></linearGradient>
 <linearGradient id="output" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffe0ce"/><stop offset="1" stop-color="#df8b67"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#60758b"/></marker></defs>
  <rect width="1200" height="550" rx="26" fill="url(#bg)"/>
  <text x="52" y="52" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#6555a5">MATRICES D’ATTENTION</text>
  <text x="52" y="94" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#10233f">Des scores aux poids, puis à la sortie</text>
  <text x="52" y="122" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51627a">Trois matrices, trois significations différentes</text>
  
