<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">How an autoregressive LLM generates text</title><desc id="desc">A shared map: from the supplied prefix to the next token — and back again. Six stages: input, tokenization, numeric representations, Transformer computation, next-token distribution, and decoding with a feedback loop.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#315f9f" stroke-width="2"/></marker>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b4d}.title{font-size:36px;font-weight:750}.subtitle{font-size:21px;fill:#52647f}.head{font-size:20px;font-weight:700}.stage{font-size:18px;font-weight:750}.body{font-size:17px}.small{font-size:15px}.tiny{font-size:14px}.panel{stroke-width:2.2}</style></defs>
<rect width="1600" height="980" fill="#fff"/><text x="40" y="60" class="title">How an autoregressive LLM generates text</text><text x="42" y="98" class="subtitle">A shared map: from the supplied prefix to the next token — and back again</text><path d="M40 125 H1560" stroke="#d9e2ef" stroke-width="2"/><rect x="30" y="190" width="240" height="510" rx="18" fill="#f1f6ff" stroke="#9dbcf0" class="panel"/><circle cx="58" cy="222" r="19" fill="#2866b8"/><text x="58" y="230" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">1</text><text x="85" y="229" class="stage">Input text</text><text x="48" y="281" class="head">Prefix / prompt</text><text x="48" y="330" class="body">The text and context</text><text x="48" y="360" class="body">already available</text><text x="48" y="390" class="body">The model continues</text><text x="48" y="420" class="body">from this prefix.</text><path d="M274 440 H281" stroke="#315f9f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="290" y="190" width="240" height="510" rx="18" fill="#f7f2ff" stroke="#c7b1ee" class="panel"/><circle cx="318" cy="222" r="19" fill="#7046b8"/><text x="318" y="230" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">2</text><text x="345" y="229" class="stage">Tokenization</text><text x="308" y="281" class="head">Tokenizer</text><text x="308" y="330" class="body">Split text into tokens</text><text x="308" y="360" class="body">Assign an integer ID</text><text x="308" y="390" class="body">to each token.</text><text x="308" y="420" class="body">Token boundaries depend</text><text x="308" y="450" class="body">on the tokenizer.</text><rect x="308" y="470" width="204" height="62" rx="10" fill="#fff" stroke="#c7b1ee"/><text x="410" y="495" text-anchor="middle" class="small">token A · token B</text><text x="410" y="518" text-anchor="middle" class="small">token C · …</text><text x="308" y="576" class="small" font-weight="700">IDs</text><g fill="#fff" stroke="#c7b1ee"><rect x="308" y="590" width="55" height="42" rx="7"/><rect x="373" y="590" width="55" height="42" rx="7"/><rect x="438" y="590" width="55" height="42" rx="7"/></g><g class="small" text-anchor="middle"><text x="335" y="616">17</text><text x="400" y="616">204</text><text x="465" y="616">…</text></g><path d="M534 440 H541" stroke="#315f9f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="550" y="190" width="240" height="510" rx="18" fill="#eff8ff" stroke="#a9cfe7" class="panel"/><circle cx="578" cy="222" r="19" fill="#2876a8"/><text x="578" y="230" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">3</text><text x="605" y="229" class="stage">Numeric vectors</text><text x="568" y="281" class="head">Embedding + position</text><text x="568" y="330" class="body">Map token IDs to vectors</text><text x="568" y="360" class="body">Add or encode position</text><text x="568" y="390" class="body">information.</text><text x="568" y="420" class="body">The result is a sequence</text><text x="568" y="450" class="body">of numeric vectors.</text><g fill="#fff" stroke="#a9cfe7"><rect x="568" y="490" width="58" height="76" rx="8"/><rect x="641" y="490" width="58" height="76" rx="8"/><rect x="714" y="490" width="58" height="76" rx="8"/></g><g fill="#2876a8"><circle cx="584" cy="509" r="4"/><circle cx="598" cy="530" r="4"/><circle cx="612" cy="550" r="4"/><circle cx="657" cy="509" r="4"/><circle cx="671" cy="530" r="4"/><circle cx="685" cy="550" r="4"/><circle cx="730" cy="509" r="4"/><circle cx="744" cy="530" r="4"/><circle cx="758" cy="550" r="4"/></g><path d="M794 440 H801" stroke="#315f9f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="810" y="190" width="240" height="510" rx="18" fill="#f0faf4" stroke="#9bd3b2" class="panel"/><circle cx="838" cy="222" r="19" fill="#238653"/><text x="838" y="230" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">4</text><text x="865" y="229" class="stage">Transformer computation</text><text x="828" y="281" class="head">Decoder blocks × N</text><text x="828" y="330" class="body">Causal self-attention</text><text x="828" y="360" class="body">MLP · residual paths</text><text x="828" y="390" class="body">· normalization</text><text x="828" y="420" class="body">Representations become</text><text x="828" y="450" class="body">context-dependent.</text><rect x="828" y="485" width="204" height="150" rx="12" fill="#fff" stroke="#9bd3b2"/><rect x="845" y="505" width="170" height="42" rx="8" fill="#e3f3e9"/><text x="930" y="532" text-anchor="middle" class="small" font-weight="700">Causal attention</text><path d="M930 550 V570" stroke="#238653" stroke-width="2" marker-end="url(#arrow)"/><rect x="845" y="576" width="170" height="42" rx="8" fill="#e3f3e9"/><text x="930" y="603" text-anchor="middle" class="small" font-weight="700">MLP</text><text x="828" y="668" class="small">Repeated across blocks</text><path d="M1054 440 H1061" stroke="#315f9f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1070" y="190" width="240" height="510" rx="18" fill="#fff8e9" stroke="#e8c77f" class="panel"/><circle cx="1098" cy="222" r="19" fill="#ad7a16"/><text x="1098" y="230" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">5</text><text x="1125" y="229" class="stage">Distribution</text><text x="1088" y="281" class="head">Output head</text><text x="1088" y="310" class="small">Logits → softmax</text><text x="1088" y="330" class="body">One logit per vocabulary</text><text x="1088" y="360" class="body">token; softmax converts</text><text x="1088" y="390" class="body">scores into probabilities.</text><text x="1088" y="420" class="body">Illustrative distribution:</text><text x="1088" y="494" class="small">They</text><text x="1290" y="494" text-anchor="end" class="small" font-weight="700">60%</text><rect x="1088" y="502" width="204" height="9" rx="4" fill="#ead9b2"/><rect x="1088" y="502" width="122.39999999999999" height="9" rx="4" fill="#bd9344"/><text x="1088" y="542" class="small">Aqueducts</text><text x="1290" y="542" text-anchor="end" class="small" font-weight="700">20%</text><rect x="1088" y="550" width="204" height="9" rx="4" fill="#ead9b2"/><rect x="1088" y="550" width="40.800000000000004" height="9" rx="4" fill="#bd9344"/><text x="1088" y="590" class="small">Nothing</text><text x="1290" y="590" text-anchor="end" class="small" font-weight="700">10%</text><rect x="1088" y="598" width="204" height="9" rx="4" fill="#ead9b2"/><rect x="1088" y="598" width="20.400000000000002" height="9" rx="4" fill="#bd9344"/><text x="1088" y="638" class="small">Well</text><text x="1290" y="638" text-anchor="end" class="small" font-weight="700">10%</text><rect x="1088" y="646" width="204" height="9" rx="4" fill="#ead9b2"/><rect x="1088" y="646" width="20.400000000000002" height="9" rx="4" fill="#bd9344"/><path d="M1314 440 H1321" stroke="#315f9f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="1330" y="190" width="240" height="510" rx="18" fill="#fff4ed" stroke="#efbd9a" class="panel"/><circle cx="1358" cy="222" r="19" fill="#d9782a"/><text x="1358" y="230" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">6</text><text x="1385" y="229" class="stage">Generation</text><text x="1348" y="281" class="head">Decoding rule</text><text x="1348" y="330" class="body">Select one token</text><text x="1348" y="360" class="body">Append its ID to the sequence</text><text x="1348" y="390" class="body">and run the model again.</text><text x="1348" y="420" class="body">The loop stops when a</text><text x="1348" y="450" class="body">stopping rule is met.</text><rect x="1348" y="485" width="204" height="78" rx="10" fill="#fff" stroke="#efbd9a"/><text x="1450" y="516" text-anchor="middle" class="head">Decoding</text><text x="1450" y="541" text-anchor="middle" class="small">Maximum or sampling</text><rect x="1348" y="585" width="204" height="65" rx="10" fill="#ffe5d2" stroke="#efbd9a"/><text x="1450" y="612" text-anchor="middle" class="head">They</text><text x="1450" y="635" text-anchor="middle" class="small">Selected token: 60%</text><text x="1348" y="680" class="tiny">Selection follows model output.</text><path d="M1450 710 V790 Q1450 830 1410 830 H190 Q150 830 150 790 V710" fill="none" stroke="#315f9f" stroke-width="4" marker-end="url(#arrow)"/><rect x="380" y="770" width="840" height="105" rx="16" fill="#edf4ff" stroke="#8eafe0" stroke-width="2"/><text x="800" y="812" text-anchor="middle" class="head">Append the selected token ID to the sequence</text><text x="800" y="844" text-anchor="middle" class="body">Then resume at step 3 with the extended sequence</text><text x="40" y="930" class="small">Decoder-only autoregressive GPT. Tokenization and architecture vary; probabilities are illustrative.</text></svg>