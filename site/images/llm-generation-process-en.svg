<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">Autoregressive generation at a glance</title>
<desc id="desc">Input text is split into tokens. The model processes them with fixed parameters and produces a probability distribution. A token is selected and appended to the context; the process repeats.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#315f9f" stroke-width="2.5"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b4d}
    .heading{font-size:34px;font-weight:750}.sub{font-size:22px;fill:#52647f}
    .step{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:18px}
    .panel{stroke-width:2.5}
  </style>
</defs>
<rect width="1400" height="700" fill="#fff"/>
<text x="48" y="62" class="heading">Autoregressive generation at a glance</text>
<text x="50" y="101" class="sub">The model progressively extends the supplied text</text>
<path d="M50 125 H1350" stroke="#d9e2ef" stroke-width="2"/>
<g>
  <rect x="35" y="190" width="235" height="310" rx="20" fill="#f1f6ff" stroke="#9dbcf0" class="panel"/>
  <circle cx="72" cy="230" r="22" fill="#2866b8"/><text x="72" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text>
  <text x="108" y="238" class="step">Context</text>
  <text x="58" y="295" class="body">The input text</text>
  <text x="58" y="326" class="body">and previous</text>
  <text x="58" y="357" class="body">turns.</text>
  <rect x="58" y="395" width="188" height="65" rx="12" fill="#fff" stroke="#8eb1eb" stroke-width="2"/>
  <text x="152" y="435" text-anchor="middle" class="body">“The report…”</text>
</g>
<g>
  <rect x="300" y="190" width="235" height="310" rx="20" fill="#f7f2ff" stroke="#c7b1ee" class="panel"/>
  <circle cx="337" cy="230" r="22" fill="#7046b8"/><text x="337" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text>
  <text x="373" y="238" class="step">Tokenize</text>
  <text x="323" y="295" class="body">Split the text</text>
  <text x="323" y="326" class="body">into units called</text>
  <text x="323" y="357" class="body">tokens.</text>
  <g fill="#d8c9f1">
    <rect x="323" y="395" width="52" height="45" rx="8"/><rect x="382" y="395" width="70" height="45" rx="8"/><rect x="459" y="395" width="52" height="45" rx="8"/>
  </g>
  <text x="349" y="424" text-anchor="middle" class="small">The</text><text x="417" y="424" text-anchor="middle" class="small">re-</text><text x="485" y="424" text-anchor="middle" class="small">port</text>
  <text x="417" y="470" text-anchor="middle" class="small">Schematic example</text>
</g>
<g>
  <rect x="565" y="190" width="235" height="310" rx="20" fill="#f0faf4" stroke="#9bd3b2" class="panel"/>
  <circle cx="602" cy="230" r="22" fill="#238653"/><text x="602" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text>
  <text x="638" y="238" class="step">Model</text>
  <text x="588" y="295" class="body">GPT processes the</text>
  <text x="588" y="326" class="body">context using its</text>
  <text x="588" y="357" class="body">learned parameters.</text>
  <rect x="588" y="395" width="188" height="65" rx="12" fill="#fff" stroke="#9bcfb0" stroke-width="2"/>
  <text x="682" y="422" text-anchor="middle" class="step">GPT</text>
  <text x="682" y="447" text-anchor="middle" class="small">Fixed parameters</text>
</g>
<g>
  <rect x="830" y="190" width="235" height="310" rx="20" fill="#fff8e9" stroke="#e8c77f" class="panel"/>
  <circle cx="867" cy="230" r="22" fill="#ad7a16"/><text x="867" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text>
  <text x="903" y="238" class="step">Distribution</text>
  <text x="853" y="295" class="body">The model assigns</text>
  <text x="853" y="326" class="body">probabilities to</text>
  <text x="853" y="357" class="body">possible tokens.</text>
  <g fill="#d9c18c">
    <rect x="853" y="400" width="160" height="12" rx="6"/><rect x="853" y="426" width="115" height="12" rx="6"/><rect x="853" y="452" width="78" height="12" rx="6"/>
  </g>
</g>
<g>
  <rect x="1095" y="190" width="270" height="310" rx="20" fill="#fff4ed" stroke="#efbd9a" class="panel"/>
  <circle cx="1132" cy="230" r="22" fill="#d9782a"/><text x="1132" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">5</text>
  <text x="1168" y="238" class="step">Selection</text>
  <text x="1118" y="295" class="body">A rule selects</text>
  <text x="1118" y="326" class="body">the next token.</text>
  <rect x="1118" y="395" width="224" height="65" rx="12" fill="#fff" stroke="#e9b18b" stroke-width="2"/>
  <text x="1230" y="435" text-anchor="middle" class="body">Selected token</text>
</g>
<g fill="none" stroke="#315f9f" stroke-width="4" marker-end="url(#arrow)">
  <path d="M275 345 H292"/><path d="M540 345 H557"/><path d="M805 345 H822"/><path d="M1070 345 H1087"/>
</g>
<path d="M1230 510 V570 Q1230 610 1190 610 H150 Q110 610 110 570 V515" fill="none" stroke="#315f9f" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="430" y="565" width="540" height="80" rx="16" fill="#edf4ff" stroke="#8eafe0" stroke-width="2"/>
<text x="700" y="598" text-anchor="middle" class="step">Append the token to the context</text>
<text x="700" y="627" text-anchor="middle" class="small">Then repeat the computation with the extended context</text>
</svg>