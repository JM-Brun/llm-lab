<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1190" role="img" aria-labelledby="title desc">
<title id="title">Projections Q, K et V et calcul de l'attention</title>
<desc id="desc">Vue verticale pour petit écran. L'entrée X est projetée en Q, K et V. Q et K déterminent les scores puis les poids d'attention ; ces poids sont combinés aux valeurs V pour produire la sortie. Les cartes Q, K et V contiennent chacune une matrice schématique de trois lignes et quatre colonnes, avec un dégradé de couleur et des dimensions explicites ; le nombre de cellules est illustratif.</desc>
<defs><linearGradient id="qMatrix" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#b7e7e2"/><stop offset="1" stop-color="#087f8c"/></linearGradient><linearGradient id="kMatrix" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#d5defe"/><stop offset="1" stop-color="#617bc5"/></linearGradient><linearGradient id="vMatrix" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffe0ce"/><stop offset="1" stop-color="#df8b67"/></linearGradient><linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8f8"/><stop offset="1" stop-color="#fff5ef"/></linearGradient><marker id="arrm" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3z" fill="#60758b"/></marker></defs>
<rect width="390" height="1190" rx="22" fill="url(#bgm)"/>
<text x="24" y="38" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#087f8c">AUTO-ATTENTION · VUE MOBILE</text>
<text x="24" y="70" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="750" fill="#10233f">Une entrée, trois projections</text>
<rect x="25" y="96" width="340" height="92" rx="14" fill="#fff" stroke="#cbd9e3" stroke-width="2"/>
<text x="195" y="126" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750" fill="#10233f">Entrée commune X</text>
<text x="195" y="151" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#51627a">représentations de toutes les positions</text>
<text x="195" y="173" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#51627a">T × d_model</text>
<path d="M195 188 V218" stroke="#60758b" stroke-width="2.2" marker-end="url(#arrm)"/>
<text x="195" y="238" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#51627a">TROIS TRANSFORMATIONS APPRISES</text>
<rect x="25" y="255" width="340" height="100" rx="14" fill="#dff2f1" stroke="#087f8c" stroke-width="2"/>
<text x="145" y="285" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#075d65">Q · Requête</text>
<text x="145" y="311" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#24545a">ce que la position cherche</text>
<text x="145" y="337" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#24545a">Q = XW_Q</text><text x="314" y="267" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="750" fill="#087f8c">Matrice T × d_k</text><g><rect x="270" y="270" width="88" height="47" rx="7" fill="#ffffff" fill-opacity=".72" stroke="#087f8c" stroke-opacity=".38" stroke-width="1"/><rect x="275" y="276" width="16" height="9" rx="2.5" fill="url(#qMatrix)" fill-opacity="0.76" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="294" y="276" width="16" height="9" rx="2.5" fill="url(#qMatrix)" fill-opacity="0.88" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="313" y="276" width="16" height="9" rx="2.5" fill="url(#qMatrix)" fill-opacity="1" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="332" y="276" width="16" height="9" rx="2.5" fill="url(#qMatrix)" fill-opacity="0.76" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="275" y="288" width="16" height="9" rx="2.5" fill="url(#qMatrix)" fill-opacity="0.88" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="294" y="288" width="16" height="9" rx="2.5" fill="url(#qMatrix)" fill-opacity="1" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="313" y="288" width="16" height="9" rx="2.5" fill="url(#qMatrix)" fill-opacity="0.76" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="332" y="288" width="16" height="9" rx="2.5" fill="url(#qMatrix)" fill-opacity="0.88" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="275" y="300" width="16" height="9" rx="2.5" fill="url(#qMatrix)" fill-opacity="1" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="294" y="300" width="16" height="9" rx="2.5" fill="url(#qMatrix)" fill-opacity="0.76" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="313" y="300" width="16" height="9" rx="2.5" fill="url(#qMatrix)" fill-opacity="0.88" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="332" y="300" width="16" height="9" rx="2.5" fill="url(#qMatrix)" fill-opacity="1" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><path d="M273 273 V311 M273 273 h4 M273 311 h4" fill="none" stroke="#087f8c" stroke-width="1" stroke-linecap="round" opacity=".8"/></g>
<rect x="25" y="375" width="340" height="100" rx="14" fill="#e7edff" stroke="#617bc5" stroke-width="2"/>
<text x="145" y="405" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#29478e">K · Clé</text>
<text x="145" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#334c7d">ce que chaque position rend repérable</text>
<text x="145" y="457" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334c7d">K = XW_K</text><text x="314" y="387" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="750" fill="#617bc5">Matrice T × d_k</text><g><rect x="270" y="390" width="88" height="47" rx="7" fill="#ffffff" fill-opacity=".72" stroke="#617bc5" stroke-opacity=".38" stroke-width="1"/><rect x="275" y="396" width="16" height="9" rx="2.5" fill="url(#kMatrix)" fill-opacity="0.76" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="294" y="396" width="16" height="9" rx="2.5" fill="url(#kMatrix)" fill-opacity="0.88" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="313" y="396" width="16" height="9" rx="2.5" fill="url(#kMatrix)" fill-opacity="1" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="332" y="396" width="16" height="9" rx="2.5" fill="url(#kMatrix)" fill-opacity="0.76" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="275" y="408" width="16" height="9" rx="2.5" fill="url(#kMatrix)" fill-opacity="0.88" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="294" y="408" width="16" height="9" rx="2.5" fill="url(#kMatrix)" fill-opacity="1" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="313" y="408" width="16" height="9" rx="2.5" fill="url(#kMatrix)" fill-opacity="0.76" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="332" y="408" width="16" height="9" rx="2.5" fill="url(#kMatrix)" fill-opacity="0.88" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="275" y="420" width="16" height="9" rx="2.5" fill="url(#kMatrix)" fill-opacity="1" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="294" y="420" width="16" height="9" rx="2.5" fill="url(#kMatrix)" fill-opacity="0.76" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="313" y="420" width="16" height="9" rx="2.5" fill="url(#kMatrix)" fill-opacity="0.88" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="332" y="420" width="16" height="9" rx="2.5" fill="url(#kMatrix)" fill-opacity="1" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><path d="M273 393 V431 M273 393 h4 M273 431 h4" fill="none" stroke="#617bc5" stroke-width="1" stroke-linecap="round" opacity=".8"/></g>
<rect x="25" y="495" width="340" height="100" rx="14" fill="#fff0e8" stroke="#df8b67" stroke-width="2"/>
<text x="145" y="525" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#9b4e3c">V · Valeur</text>
<text x="145" y="551" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#7c5143">le contenu qui pourra être agrégé</text>
<text x="145" y="577" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#7c5143">V = XW_V</text><text x="314" y="507" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="750" fill="#df8b67">Matrice T × d_v</text><g><rect x="270" y="510" width="88" height="47" rx="7" fill="#ffffff" fill-opacity=".72" stroke="#df8b67" stroke-opacity=".38" stroke-width="1"/><rect x="275" y="516" width="16" height="9" rx="2.5" fill="url(#vMatrix)" fill-opacity="0.76" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="294" y="516" width="16" height="9" rx="2.5" fill="url(#vMatrix)" fill-opacity="0.88" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="313" y="516" width="16" height="9" rx="2.5" fill="url(#vMatrix)" fill-opacity="1" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="332" y="516" width="16" height="9" rx="2.5" fill="url(#vMatrix)" fill-opacity="0.76" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="275" y="528" width="16" height="9" rx="2.5" fill="url(#vMatrix)" fill-opacity="0.88" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="294" y="528" width="16" height="9" rx="2.5" fill="url(#vMatrix)" fill-opacity="1" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="313" y="528" width="16" height="9" rx="2.5" fill="url(#vMatrix)" fill-opacity="0.76" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="332" y="528" width="16" height="9" rx="2.5" fill="url(#vMatrix)" fill-opacity="0.88" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="275" y="540" width="16" height="9" rx="2.5" fill="url(#vMatrix)" fill-opacity="1" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="294" y="540" width="16" height="9" rx="2.5" fill="url(#vMatrix)" fill-opacity="0.76" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="313" y="540" width="16" height="9" rx="2.5" fill="url(#vMatrix)" fill-opacity="0.88" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><rect x="332" y="540" width="16" height="9" rx="2.5" fill="url(#vMatrix)" fill-opacity="1" stroke="#ffffff" stroke-opacity=".82" stroke-width=".8"/><path d="M273 513 V551 M273 513 h4 M273 551 h4" fill="none" stroke="#df8b67" stroke-width="1" stroke-linecap="round" opacity=".8"/></g>
<path d="M195 355 V615 H105 V646 M195 475 V615 H285 V646" fill="none" stroke="#60758b" stroke-width="2.2" marker-end="url(#arrm)"/>
<rect x="25" y="652" width="340" height="104" rx="14" fill="#fff" stroke="#a9b9c8" stroke-width="2"/>
<text x="195" y="682" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750" fill="#10233f">1 · Comparer Q et K</text>
<text x="195" y="712" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#51627a">QKᵀ → T × T</text>
<text x="195" y="738" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#51627a">division par √d_k, puis softmax</text>
<path d="M195 756 V786" stroke="#60758b" stroke-width="2.2" marker-end="url(#arrm)"/>
<rect x="25" y="792" width="340" height="94" rx="14" fill="#dff2f1" stroke="#087f8c" stroke-width="2"/>
<text x="195" y="824" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750" fill="#075d65">2 · Poids d'attention</text>
<text x="195" y="852" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#24545a">quelles positions regarder davantage ?</text><text x="195" y="875" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#24545a">A : T × T</text>
<path d="M195 886 V918" stroke="#60758b" stroke-width="2.2" marker-end="url(#arrm)"/>
<path d="M195 595 H12 V977 H25" fill="none" stroke="#df8b67" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrm)"/>
<rect x="25" y="925" width="340" height="104" rx="14" fill="#fff" stroke="#a9b9c8" stroke-width="2"/>
<text x="195" y="956" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750" fill="#10233f">3 · Agréger les valeurs V</text>
<text x="195" y="985" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#51627a">poids d'attention × vecteurs V</text>
<text x="195" y="1010" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#51627a">A (T×T) · V (T×d_v) → O (T×d_v)</text>
<path d="M195 1029 V1060" stroke="#60758b" stroke-width="2.2" marker-end="url(#arrm)"/>
<rect x="25" y="1067" width="340" height="82" rx="14" fill="#10233f"/>
<text x="195" y="1098" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="750" fill="#fff">Sortie de l'attention</text>
<text x="195" y="1128" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#fff">A = softmax(QKᵀ / √d_k) · O = AV</text>
<text x="195" y="1175" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#51627a">Q/K règlent la pondération · V apporte le contenu</text>
</svg>