<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1900" viewBox="0 0 720 1900" role="img" aria-labelledby="title desc"><title id="title">Decoder-only GPT architecture</title><desc id="desc">The complete GPT maps token IDs to embeddings and positional information, through repeated Transformer blocks, final normalization and vocabulary projection to logits. One common pre-LN block contains causal multi-head attention and a position-wise MLP, each with a residual addition.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs><rect width="720" height="1900" rx="24" fill="#fff"/><text x="36" y="60" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0f172a">Decoder-only GPT architecture</text><text x="36" y="105" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">1 · Complete model</text><rect x="55" y="145" width="610" height="78" rx="14" fill="#e8f1ff" stroke="#4778b8" stroke-width="2"/><text x="360" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172b4d">Token IDs</text><path d="M360 223V265" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><rect x="55" y="275" width="610" height="78" rx="14" fill="#e8f1ff" stroke="#4778b8" stroke-width="2"/><text x="360" y="323" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172b4d">Embeddings + position</text><path d="M360 353V395" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><rect x="55" y="405" width="610" height="78" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="360" y="453" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172b4d">Stack of N Transformer blocks</text><path d="M360 483V525" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><rect x="55" y="535" width="610" height="78" rx="14" fill="#e8f1ff" stroke="#4778b8" stroke-width="2"/><text x="360" y="583" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172b4d">Final normalization</text><path d="M360 613V655" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><rect x="55" y="665" width="610" height="78" rx="14" fill="#e8f1ff" stroke="#4778b8" stroke-width="2"/><text x="360" y="713" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172b4d">Vocabulary projection</text><path d="M360 743V785" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><rect x="55" y="795" width="610" height="78" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="360" y="843" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172b4d">Logits</text><rect x="25" y="930" width="670" height="850" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="36" y="975" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">One pre-LN Transformer block</text><rect x="55" y="1010" width="610" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="360" y="1048" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172b4d">Input Hˡ</text><path d="M360 1072V1103" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="55" y="1104" width="610" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="360" y="1142" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172b4d">LayerNorm</text><path d="M360 1166V1197" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="55" y="1198" width="610" height="62" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="360" y="1236" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172b4d">Causal multi-head attention</text><path d="M360 1260V1291" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="55" y="1292" width="610" height="62" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="360" y="1330" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172b4d">Residual addition: H′ + MLP output: Hˡ + attention output</text><path d="M360 1354V1385" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="55" y="1386" width="610" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="360" y="1424" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172b4d">LayerNorm</text><path d="M360 1448V1479" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="55" y="1480" width="610" height="62" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="360" y="1518" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172b4d">MLP · position-wise</text><path d="M360 1542V1573" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="55" y="1574" width="610" height="62" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="360" y="1612" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172b4d">Residual addition</text><path d="M360 1636V1667" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="55" y="1668" width="610" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="360" y="1706" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172b4d">Output Hˡ⁺¹</text><text x="36" y="1830" font-family="Arial,sans-serif" font-size="17" fill="#475569">Pre-LN is a common variant, not a universal rule.</text></svg>