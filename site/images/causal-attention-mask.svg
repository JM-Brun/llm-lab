<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Causal attention mask</title>
<desc id="desc">Four token positions. Each row can attend to itself and earlier positions, but not to future positions shown in pale coral.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf7f8"/><stop offset="1" stop-color="#fbf5f1"/></linearGradient></defs>
<rect width="1000" height="430" rx="24" fill="url(#bg)"/>
<text x="52" y="54" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2.5" fill="#087f8c">CAUSAL ATTENTION</text>
<text x="52" y="88" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="750" fill="#10233f">Each position sees only its prefix</text>
<text x="52" y="120" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51627a">Rows = query positions · Columns = visible key positions</text>
<g font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#10233f" text-anchor="middle">
<text x="390" y="165">t₁</text><text x="472" y="165">t₂</text><text x="554" y="165">t₃</text><text x="636" y="165">t₄</text>
<text x="300" y="207">t₁</text><text x="300" y="289">t₂</text><text x="300" y="371">t₃</text><text x="300" y="453">t₄</text>
</g>
<g stroke="#fff" stroke-width="4">
<rect x="350" y="178" width="78" height="74" rx="10" fill="#087f8c"/><rect x="432" y="178" width="78" height="74" rx="10" fill="#f0c9bd"/><rect x="514" y="178" width="78" height="74" rx="10" fill="#f0c9bd"/><rect x="596" y="178" width="78" height="74" rx="10" fill="#f0c9bd"/>
<rect x="350" y="260" width="78" height="74" rx="10" fill="#087f8c"/><rect x="432" y="260" width="78" height="74" rx="10" fill="#087f8c"/><rect x="514" y="260" width="78" height="74" rx="10" fill="#f0c9bd"/><rect x="596" y="260" width="78" height="74" rx="10" fill="#f0c9bd"/>
<rect x="350" y="342" width="78" height="74" rx="10" fill="#087f8c"/><rect x="432" y="342" width="78" height="74" rx="10" fill="#087f8c"/><rect x="514" y="342" width="78" height="74" rx="10" fill="#087f8c"/><rect x="596" y="342" width="78" height="74" rx="10" fill="#f0c9bd"/>
</g>
<g font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">
<g fill="#fff"><text x="389" y="224">✓</text><text x="389" y="306">✓</text><text x="471" y="306">✓</text><text x="389" y="388">✓</text><text x="471" y="388">✓</text><text x="553" y="388">✓</text></g>
<g fill="#9b4e3c"><text x="471" y="224">×</text><text x="553" y="224">×</text><text x="635" y="224">×</text><text x="553" y="306">×</text><text x="635" y="306">×</text><text x="635" y="388">×</text></g>
</g>
<rect x="725" y="215" width="18" height="18" rx="4" fill="#087f8c"/><text x="755" y="230" font-family="Inter,Arial,sans-serif" font-size="15" fill="#10233f">Visible</text>
<rect x="725" y="253" width="18" height="18" rx="4" fill="#f0c9bd"/><text x="755" y="268" font-family="Inter,Arial,sans-serif" font-size="15" fill="#10233f">Masked</text>
<text x="725" y="325" font-family="Inter,Arial,sans-serif" font-size="15" fill="#51627a">Future tokens</text><text x="725" y="347" font-family="Inter,Arial,sans-serif" font-size="15" fill="#51627a">cannot influence</text><text x="725" y="369" font-family="Inter,Arial,sans-serif" font-size="15" fill="#51627a">earlier positions.</text>
</svg>