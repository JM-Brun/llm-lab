<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Causal attention mask</title>
<desc id="desc">Four token positions. Each row can attend to itself and earlier positions, but not to future positions shown in pale coral.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf7f8"/><stop offset="1" stop-color="#fbf5f1"/></linearGradient></defs>
<rect width="1000" height="460" rx="24" fill="url(#bg)"/>
<text x="52" y="54" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2.5" fill="#087f8c">CAUSAL ATTENTION / ATTENTION CAUSALE</text>
<text x="52" y="88" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="750" fill="#10233f">Only the prefix is visible</text>
<text x="52" y="120" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51627a">Rows = query positions · Columns = key positions</text>
<g font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#10233f" text-anchor="middle">
<text x="375" y="166">t₁</text><text x="435" y="166">t₂</text><text x="495" y="166">t₃</text><text x="555" y="166">t₄</text>
<text x="310" y="214">t₁</text><text x="310" y="274">t₂</text><text x="310" y="334">t₃</text><text x="310" y="394">t₄</text>
</g>
<g stroke="#fff" stroke-width="3">
<rect x="345" y="180" width="58" height="52" rx="8" fill="#087f8c"/><rect x="405" y="180" width="58" height="52" rx="8" fill="#f0c9bd"/><rect x="465" y="180" width="58" height="52" rx="8" fill="#f0c9bd"/><rect x="525" y="180" width="58" height="52" rx="8" fill="#f0c9bd"/>
<rect x="345" y="240" width="58" height="52" rx="8" fill="#087f8c"/><rect x="405" y="240" width="58" height="52" rx="8" fill="#087f8c"/><rect x="465" y="240" width="58" height="52" rx="8" fill="#f0c9bd"/><rect x="525" y="240" width="58" height="52" rx="8" fill="#f0c9bd"/>
<rect x="345" y="300" width="58" height="52" rx="8" fill="#087f8c"/><rect x="405" y="300" width="58" height="52" rx="8" fill="#087f8c"/><rect x="465" y="300" width="58" height="52" rx="8" fill="#087f8c"/><rect x="525" y="300" width="58" height="52" rx="8" fill="#f0c9bd"/>
<rect x="345" y="360" width="58" height="52" rx="8" fill="#087f8c"/><rect x="405" y="360" width="58" height="52" rx="8" fill="#087f8c"/><rect x="465" y="360" width="58" height="52" rx="8" fill="#087f8c"/><rect x="525" y="360" width="58" height="52" rx="8" fill="#087f8c"/>
</g>
<g font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" text-anchor="middle">
<g fill="#fff"><text x="374" y="213">✓</text><text x="374" y="273">✓</text><text x="434" y="273">✓</text><text x="374" y="333">✓</text><text x="434" y="333">✓</text><text x="494" y="333">✓</text><text x="374" y="393">✓</text><text x="434" y="393">✓</text><text x="494" y="393">✓</text><text x="554" y="393">✓</text></g>
<g fill="#9b4e3c"><text x="434" y="213">×</text><text x="494" y="213">×</text><text x="554" y="213">×</text><text x="494" y="273">×</text><text x="554" y="273">×</text><text x="554" y="333">×</text></g>
</g>
<rect x="650" y="215" width="18" height="18" rx="4" fill="#087f8c"/><text x="680" y="230" font-family="Inter,Arial,sans-serif" font-size="15" fill="#10233f">Visible / Visible</text>
<rect x="650" y="253" width="18" height="18" rx="4" fill="#f0c9bd"/><text x="680" y="268" font-family="Inter,Arial,sans-serif" font-size="15" fill="#10233f">Masked / Masqué</text>
<text x="650" y="325" font-family="Inter,Arial,sans-serif" font-size="15" fill="#51627a">Future tokens</text><text x="650" y="347" font-family="Inter,Arial,sans-serif" font-size="15" fill="#51627a">cannot influence</text><text x="650" y="369" font-family="Inter,Arial,sans-serif" font-size="15" fill="#51627a">earlier positions.</text>
</svg>