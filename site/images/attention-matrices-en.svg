  <text x="600" y="408" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#087f70">Each row sums to 1</text>
  
  <rect x="825" y="145" width="330" height="300" rx="20" fill="#fff" stroke="#d2dce7" stroke-width="2"/>
  <text x="990" y="181" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10233f">Aggregated output</text>
