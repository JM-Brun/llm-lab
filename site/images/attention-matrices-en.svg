="1.2"/></g>
  <text x="210" y="408" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#6555a5">Raw values are unbounded</text>
  
  <rect x="435" y="145" width="330" height="300" rx="20" fill="#fff" stroke="#d2dce7" stroke-width="2"/>
  <text x="600" y="181" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10233f">Attention weights</text>
  <text x="600" y="207" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#51627a">Row-wise softmax</text>
  <text x="600" y="238" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="750" fill="#34465e">A = softmax(S)</text>
