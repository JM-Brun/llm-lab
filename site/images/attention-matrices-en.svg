<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">From scores to weights, then output</title><desc id="desc">Scores may be negative; weights are positive and normalized. Les trois matrices ont respectivement les dimensions T × T, T × T et T × d_v.</desc><defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f5ff"/><stop offset="1" stop-color="#fff5ee"/></linearGradient>
 <linearGradient id="score" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#d9d4f5"/><stop offset="1" stop-color="#6555a5"/></linearGradient>
 <linearGradient id="weight" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#c9eee5"/><stop offset="1" stop-color="#087f70"/></linearGradient>
 <linearGradient id="output" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffe0ce"/><stop offset="1" stop-color="#df8b67"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#60758b"/></marker>
 </defs>
  <rect width="1200" height="520" rx="26" fill="url(#bg)"/>
  <text x="52" y="54" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#6555a5">ATTENTION MATRICES</text>
  <text x="52" y="94" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#10233f">From scores to weights, then output</text>
  <text x="52" y="122" font-family="Inter,Arial,sans-serif" font-size="16" fill="#51627a">Three matrices, three different meanings</text>
  
  <rect x="45" y="145" width="330" height="300" rx="20" fill="#fff" stroke="#d2dce7" stroke-width="2"/>
  <text x="210" y="181" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10233f">Raw scores</text>
  <text x="210" y="207" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#51627a">Compatibility before normalization</text>
  <text x="210" y="238" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="750" fill="#34465e">S = QKᵀ / √d_k</text>
