<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="450" viewBox="0 0 1050 450" role="img" aria-labelledby="t d"><title id="t">Geometric principle of RoPE</title><desc id="d">A pair of coordinates is rotated by an angle that depends on position. RoPE applies this kind of rotation to pairs of query and key coordinates.</desc><rect width="1050" height="450" rx="24" fill="#f5f8fc"/><text x="44" y="48" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#087f8c">POSITIONAL ENCODING · RoPE</text><text x="44" y="84" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#10233f">Position acts like a rotation</text><g transform="translate(260 250)"><circle r="125" fill="#fff" stroke="#d6e0ea" stroke-width="2"/><path d="M-150 0H165M0 145V-145" stroke="#52627a" stroke-width="2"/><path d="M0 0L100 -65" stroke="#617bc5" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="-65" r="7" fill="#617bc5"/><path d="M0 0L65 -100" stroke="#087f8c" stroke-width="5" stroke-linecap="round"/><circle cx="65" cy="-100" r="7" fill="#087f8c"/><path d="M75 -49 A90 90 0 0 0 49 -75" fill="none" stroke="#df8b67" stroke-width="3"/><text x="110" y="-70" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#29478e">vector</text><text x="70" y="-120" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#075d65">after rotation</text><text x="0" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52627a">one pair of coordinates</text></g><path d="M450 250H520" stroke="#526b82" stroke-width="2.5"/><path d="M510 243L522 250L510 257" fill="none" stroke="#526b82" stroke-width="2.5"/><rect x="535" y="140" width="455" height="220" rx="18" fill="#fff" stroke="#cbd6e3" stroke-width="2"/><text x="762" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233f">In attention</text><rect x="575" y="210" width="155" height="52" rx="10" fill="#dff2f1" stroke="#087f8c" stroke-width="2"/><text x="652" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#075d65">Query Q</text><rect x="795" y="210" width="155" height="52" rx="10" fill="#e7edff" stroke="#617bc5" stroke-width="2"/><text x="872" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#29478e">Key K</text><path d="M652 262V290H762M872 262V290H762V310" fill="none" stroke="#526b82" stroke-width="2"/><text x="762" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#52627a">scores depend on relative positions</text><text x="525" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#52627a">Conceptual diagram, not numerical values from a real model.</text></svg>