<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Compare three distributions and their entropy</title>
<desc id="desc">Three distributions over four tokens. A concentrated distribution (100%, 0%, 0%, 0%) has zero entropy. The example distribution (60%, 20%, 10%, 10%) has entropy 1.089 nats, about 79% of the maximum. A uniform distribution (25% each) reaches the maximum of 1.386 nats. Entropy summarizes the spread of the whole distribution, not the surprisal of one token.</desc>
<rect width="1200" height="700" rx="24" fill="#F8FAFC"/>
<text x="48" y="48" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D">REVISION SHEET · ENTROPY</text>
<text x="600" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#17212B">Distribution spread determines entropy</text>
<text x="600" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Four possible tokens · natural logarithm · illustrative probabilities</text>
