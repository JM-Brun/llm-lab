<rect x="422" y="155" width="355" height="470" rx="18" fill="#FFFFFF" stroke="#15803D" stroke-width="3"/>
<rect x="804" y="155" width="355" height="470" rx="18" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
</g>
