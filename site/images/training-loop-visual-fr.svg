<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc"><title id="title">Un pas de mise à jour</title><desc id="desc">Seule l’étape de l’optimiseur modifie les paramètres. Batch d’entraînement, Préfixes + cibles, du token suivant; Passe avant, Logits avec les, paramètres θₖ; Loss, Entropie croisée, par cible + masque; Rétropropagation, Gradient ∇θ L(θₖ), ; Mise à jour, θₖ → θₖ₊₁, par l’optimiseur. Validation : mesurer, pas mettre à jour: Batch réservé → passe avant → loss de validation. Paramètres fixes à l’évaluation ; aucun gradient ni mise à jour.</desc><rect width="1280" height="610" rx="24" fill="#F8FAFC"/><text x="36" y="58" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.2" fill="#15803D">APPRENTISSAGE · UN PAS</text><text x="36" y="103" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17212B">Un pas de mise à jour</text><text x="36" y="132" font-family="Arial,sans-serif" font-size="18" fill="#475569">Seule l’étape de l’optimiseur modifie les paramètres</text><rect x="28" y="154" width="210" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="28" y="154" width="8" height="150" rx="4" fill="#64748B"/><text x="48" y="192" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17212B">Batch d’entraînement</text><text x="48" y="232" font-family="Arial,sans-serif" font-size="16" fill="#475569">Préfixes + cibles</text><text x="48" y="258" font-family="Arial,sans-serif" font-size="16" fill="#475569">du token suivant</text><path d="M243 229 H268" stroke="#64748B" stroke-width="3" fill="none"/><path d="M259 222 L268 229 L259 236" stroke="#64748B" stroke-width="3" fill="none"/><rect x="278" y="154" width="210" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="278" y="154" width="8" height="150" rx="4" fill="#64748B"/><text x="298" y="192" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17212B">Passe avant</text><text x="298" y="232" font-family="Arial,sans-serif" font-size="16" fill="#475569">Logits avec les</text><text x="298" y="258" font-family="Arial,sans-serif" font-size="16" fill="#475569">paramètres θₖ</text><path d="M493 229 H518" stroke="#64748B" stroke-width="3" fill="none"/><path d="M509 222 L518 229 L509 236" stroke="#64748B" stroke-width="3" fill="none"/><rect x="528" y="154" width="210" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="528" y="154" width="8" height="150" rx="4" fill="#64748B"/><text x="548" y="192" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17212B">Loss</text><text x="548" y="232" font-family="Arial,sans-serif" font-size="16" fill="#475569">Entropie croisée</text><text x="548" y="258" font-family="Arial,sans-serif" font-size="16" fill="#475569">par cible + masque</text><path d="M743 229 H768" stroke="#64748B" stroke-width="3" fill="none"/><path d="M759 222 L768 229 L759 236" stroke="#64748B" stroke-width="3" fill="none"/><rect x="778" y="154" width="210" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="778" y="154" width="8" height="150" rx="4" fill="#64748B"/><text x="798" y="192" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17212B">Rétropropagation</text><text x="798" y="232" font-family="Arial,sans-serif" font-size="16" fill="#475569">Gradient ∇θ L(θₖ)</text><path d="M993 229 H1018" stroke="#64748B" stroke-width="3" fill="none"/><path d="M1009 222 L1018 229 L1009 236" stroke="#64748B" stroke-width="3" fill="none"/><rect x="1028" y="154" width="224" height="150" rx="18" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><rect x="1028" y="154" width="8" height="150" rx="4" fill="#15803D"/><text x="1048" y="192" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17212B">Mise à jour</text><text x="1048" y="232" font-family="Arial,sans-serif" font-size="16" fill="#475569">θₖ → θₖ₊₁</text><text x="1048" y="258" font-family="Arial,sans-serif" font-size="16" fill="#475569">par l’optimiseur</text><rect x="28" y="340" width="600" height="145" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="52" y="378" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17212B">Un exemple pour une cible</text><text x="52" y="420" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15803D">p(cible) = 0,6  →  −ln(0,6) ≈ 0,511 nat</text><text x="52" y="454" font-family="Arial,sans-serif" font-size="17" fill="#475569">Gradient des logits : (−0,4 ; 0,2 ; 0,1 ; 0,1)</text><rect x="652" y="340" width="600" height="145" rx="18" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="676" y="378" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0369A1">Validation : mesurer, pas mettre à jour</text><text x="676" y="420" font-family="Arial,sans-serif" font-size="17" fill="#17212B">Batch réservé → passe avant → loss de validation</text><text x="676" y="454" font-family="Arial,sans-serif" font-size="15" fill="#475569">Paramètres fixes à l’évaluation ; aucun gradient ni mise à jour</text><path d="M1140 314 V326 H1120" stroke="#15803D" stroke-width="2" fill="none"/><rect x="28" y="520" width="1224" height="58" rx="14" fill="#DCFCE7"/><path d="M55 549 H90" stroke="#15803D" stroke-width="3"/><path d="M82 541 L90 549 L82 557" stroke="#15803D" stroke-width="3" fill="none"/><text x="110" y="556" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#15803D">Batch suivant avec θₖ₊₁ · répéter</text></svg>