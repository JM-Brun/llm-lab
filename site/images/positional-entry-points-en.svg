<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Three places to inject positional information</title><desc id="desc">Same token sequence · different mechanisms. Three lanes compare absolute position addition, RoPE on queries and keys, and a relative bias added to attention scores.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="1200" height="690" rx="22" fill="#ffffff"/>
<text x="48" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Three places to inject positional information</text>
<text x="48" y="91" font-family="Arial,sans-serif" font-size="18" fill="#475569">Same token sequence · different mechanisms</text>
<g font-family="Arial,sans-serif">
<rect x="35" y="120" width="1130" height="145" rx="16" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="58" y="153" font-size="21" font-weight="700" fill="#334155">A · Add at the input</text>
<rect x="58" y="174" width="170" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="143" y="209" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">Token IDs</text><path d="M228 203 H265" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="265" y="174" width="190" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="360" y="209" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">Token embedding</text><path d="M455 203 H492" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="492" y="174" width="220" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="602" y="209" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">+ position vector</text><path d="M712 203 H749" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="749" y="174" width="310" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="904" y="209" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">Transformer blocks</text>
<rect x="35" y="282" width="1130" height="190" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="58" y="315" font-size="21" font-weight="700" fill="#1e40af">B · Rotate inside attention</text>
<rect x="58" y="344" width="170" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="143" y="379" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">Hidden states</text><path d="M228 373 H265" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="265" y="344" width="205" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="367.5" y="379" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">Q · K · V projections</text><path d="M470 373 H507" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="507" y="344" width="220" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="617" y="379" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">RoPE on Q and K</text><path d="M727 373 H764" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="764" y="344" width="230" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="879" y="379" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">QK scores</text>
<path d="M367 402 V430 H1010" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1010" y="435" font-size="16" text-anchor="end" fill="#475569">V stays unchanged</text>
<rect x="35" y="489" width="1130" height="145" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
<text x="58" y="522" font-size="21" font-weight="700" fill="#5b21b6">C · Bias the attention scores</text>
<rect x="58" y="543" width="205" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="160.5" y="578" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">Q · K projections</text><path d="M263 572 H300" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="300" y="543" width="220" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="410" y="578" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">QK score / √d</text><path d="M520 572 H557" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="557" y="543" width="220" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="667" y="578" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">+ relative bias</text><path d="M777 572 H814" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/><rect x="814" y="543" width="275" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="951.5" y="578" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">Softmax and aggregation</text>
</g>
<text x="48" y="666" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Conceptual map: exact variants depend on the architecture.</text>
</svg>