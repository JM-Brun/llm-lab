<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Comparer trois distributions et leur entropie</title>
<desc id="desc">Trois distributions sur quatre tokens. Une distribution concentrée (100 %, 0 %, 0 %, 0 %) a une entropie de zéro nat. L'exemple du scribe (60 %, 20 %, 10 %, 10 %) a une entropie de 1,089 nat, soit environ 79 % du maximum. Une distribution uniforme (25 % chacun) atteint le maximum de 1,386 nat. L'entropie résume la dispersion de toute la distribution, pas la surprise d'un token particulier.</desc>
<rect width="1200" height="700" rx="24" fill="#F8FAFC"/>
<text x="48" y="48" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803D">FICHE DE RÉVISION · ENTROPIE</text>
<text x="600" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#17212B">La dispersion détermine l'entropie</text>
<text x="600" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Quatre tokens possibles · logarithme naturel · probabilités illustratives</text>
<g>
<rect x="40" y="155" width="355" height="470" rx="18" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
<rect x="422" y="155" width="355" height="470" rx="18" fill="#FFFFFF" stroke="#15803D" stroke-width="3"/>
<rect x="804" y="155" width="355" height="470" rx="18" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
</g>
