<text x="217" y="196" font-size="22" font-weight="700" fill="#334155">Concentrée</text>
<text x="599" y="196" font-size="22" font-weight="700" fill="#14532D">Exemple du scribe</text>
<text x="981" y="196" font-size="22" font-weight="700" fill="#334155">Uniforme</text>
<text x="217" y="226" font-size="15" fill="#64748B">p = (1, 0, 0, 0)</text>
<text x="599" y="226" font-size="15" fill="#64748B">p = (0,6 ; 0,2 ; 0,1 ; 0,1)</text>
<text x="981" y="226" font-size="15" fill="#64748B">p = (0,25 ; 0,25 ; 0,25 ; 0,25)</text>
</g>
<g font-family="Arial,sans-serif" font-size="14" fill="#334155">
<text x="62" y="294">Être</text><text x="62" y="359">Vous</text><text x="62" y="424">Oui</text><text x="62" y="489">Non</text>
