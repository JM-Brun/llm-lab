<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">From loss to parameters</title><desc id="desc">The forward pass computes logits, probabilities and loss. Backpropagation applies the chain rule to compute gradients with respect to logits and then parameters. The optimizer applies a separate update rule.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#475569"/></marker></defs><rect x="1" y="1" width="898" height="468" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212B" text-anchor="start">From loss to parameters</text><rect x="28" y="78" width="136" height="72" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="96" y="120" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Parameters θ</text><path d="M168 114 L198 114" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="205" y="78" width="136" height="72" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="273" y="120" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Logits z</text><path d="M345 114 L375 114" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="382" y="78" width="136" height="72" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="450" y="120" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Probabilities p</text><path d="M522 114 L552 114" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="559" y="78" width="136" height="72" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="627" y="120" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle">Local losses</text><path d="M699 114 L729 114" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="736" y="78" width="136" height="72" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="804" y="120" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">Loss L</text><text x="28" y="194" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="start">Forward pass · compute values</text><path d="M804 158 L804 236" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M804 236 L630 236" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M630 236 L630 278" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="278" width="250" height="82" rx="12" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.5"/><text x="153" y="309" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0369A1" text-anchor="middle">Logit gradient</text><text x="153" y="339" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0369A1" text-anchor="middle">∇z L</text><rect x="326" y="278" width="250" height="82" rx="12" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.5"/><text x="451" y="309" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0369A1" text-anchor="middle">Chain rule</text><text x="451" y="339" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0369A1" text-anchor="middle">(∂z/∂θ)ᵀ ∇z L</text><rect x="624" y="278" width="248" height="82" rx="12" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.5"/><text x="748" y="309" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0369A1" text-anchor="middle">Parameter gradient</text><text x="748" y="339" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0369A1" text-anchor="middle">∇θ L</text><path d="M282 319 L318 319" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580 319 L616 319" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="624" y="388" width="248" height="56" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="748" y="412" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">Optimizer: update rule</text><text x="748" y="433" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">θ ← θ − ηg (SGD)</text><path d="M748 364 L748 382" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="28" y="420" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Gradient ≠ update: the optimizer acts after derivatives have been computed.</text></svg>