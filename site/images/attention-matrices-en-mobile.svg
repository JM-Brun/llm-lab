<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1125" role="img" aria-labelledby="title desc">
 <title id="title">From scores to weights, then output</title><desc id="desc">Scores may be negative; weights are non-negative and normalized. Scores and weights have shape T × T; the output has shape T × d_v.</desc><defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f5ff"/><stop offset="1" stop-color="#fff5ee"/></linearGradient>
 <linearGradient id="score" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#d9d4f5"/><stop offset="1" stop-color="#6555a5"/></linearGradient>
 <linearGradient id="weight" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#c9eee5"/><stop offset="1" stop-color="#087f70"/></linearGradient>
 <linearGradient id="output" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffe0ce"/><stop offset="1" stop-color="#df8b67"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#60758b"/></marker></defs>
 <rect width="390" height="1125" rx="22" fill="url(#bg)"/>
 <text x="20" y="35" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.3" fill="#6555a5">ATTENTION MATRICES</text>
 <text x="20" y="68" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10233f">From scores to weights, then output</text>
 <text x="20" y="92" font-family="Inter,Arial,sans-serif" font-size="13" fill="#51627a">Three matrices, three different meanings</text>
 
 <rect x="20" y="110" width="350" height="300" rx="18" fill="#fff" stroke="#d2dce7" stroke-width="2"/>
 <text x="195" y="144" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#10233f">Raw scores</text>
 <text x="195" y="169" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#51627a">Compatibility before normalization</text>
 <text x="195" y="198" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="750" fill="#34465e">S = QKᵀ / √d_k</text>
