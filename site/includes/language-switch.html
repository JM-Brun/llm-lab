<!--
  Primary navigation is language-aware and deliberately limited to the four main
  user intents. The sidebar remains the detailed information architecture.
-->
<script>
(() => {
  const basePath = window.location.pathname.startsWith("/llm-lab/") ? "/llm-lab/" : "/";
  const siteRoot = new URL(basePath, window.location.origin);
  const pathname = window.location.pathname;
  if (!pathname.startsWith(siteRoot.pathname)) return;

  const relativePath = pathname.slice(siteRoot.pathname.length);
  const isEnglish = relativePath === "en" || relativePath.startsWith("en/");
  const language = isEnglish ? "en" : "fr";
  const routes = {
    fr: [
      { label: "Parcours", path: "fr/learning-map.html", match: ["fr/learning-map.html"] },
      { label: "Comprendre", path: "fr/llm-overview.html", match: ["fr/llm-overview.html", "fr/generation.html", "fr/transformer.html"] },
      { label: "Construire", path: "fr/build-path.html", match: ["fr/build-path.html", "fr/corpus-preparation.html", "fr/training-examples.html"] },
      { label: "Pratiquer", path: "fr/exercises.html", match: ["fr/exercises.html", "fr/evaluation-experimentale.html", "fr/transformer-explainer.html"] }
    ],
    en: [
      { label: "Learning paths", path: "en/learning-map.html", match: ["en/learning-map.html"] },
      { label: "Understand", path: "en/llm-overview.html", match: ["en/llm-overview.html", "en/generation.html", "en/transformer.html"] },
      { label: "Build", path: "en/build-path.html", match: ["en/build-path.html", "en/corpus-preparation.html", "en/training-examples.html"] },
      { label: "Practice", path: "en/exercises.html", match: ["en/exercises.html", "en/experimental-evaluation.html", "en/transformer-explainer.html"] }
    ]
  };

  const primaryNav = document.querySelector("#quarto-header .navbar .navbar-nav.me-auto")
    || document.querySelector("#quarto-header .navbar .navbar-nav:not(.ms-auto)");
  if (primaryNav && !primaryNav.querySelector("[data-primary-navigation]")) {
    routes[language].forEach((route) => {
      const item = document.createElement("li");
      item.className = "nav-item";
      item.dataset.primaryNavigation = "true";
      const link = document.createElement("a");
      link.className = "nav-link";
      link.href = new URL(route.path, siteRoot).href;
      link.textContent = route.label;
      link.setAttribute("lang", language);
      const current = relativePath.replace(/\/$/, "");
      if (route.match.includes(current)) {
        link.setAttribute("aria-current", "page");
        item.classList.add("active");
      }
      item.appendChild(link);
      primaryNav.appendChild(item);
    });
  }

  const frenchToEnglish = {
    "mathematical-foundations": "mathematical-foundations",
    "next-concept-modeling": "next-concept-modeling",
    "jepa-platonic-representation": "jepa-platonic-representation",
    "build-path": "build-path",
    "corpus-preparation": "corpus-preparation",
    "gpt-config-walkthrough": "gpt-config-walkthrough",
    "gpt-ops-walkthrough": "gpt-ops-walkthrough",
    "transformer-block-walkthrough": "transformer-block-walkthrough",
    "gpt-model-walkthrough": "gpt-model-walkthrough",
    "gpt-generation-walkthrough": "gpt-generation-walkthrough",
    "logits": "logits",
    "probabilites": "probabilities",
    "vraisemblance": "likelihood",
    "entropy": "entropy",
    "cross-entropy": "cross-entropy",
    "loss": "loss",
    "gradients": "gradients",
    "training-loop": "training-loop",
    "post-training": "post-training",
    "score-centering": "score-centering",
    "transformer": "transformer",
    "transformer-architectures": "transformer-architectures",
    "cross-attention": "cross-attention",
    "hybrid-llm-architectures": "hybrid-llm-architectures",
    "llm-computational-complexity": "llm-computational-complexity",
    "transformer-explainer": "transformer-explainer",
    "generation": "generation",
    "glossary": "glossary",
    "transformer-history": "transformer-history",
    "queries-keys-values": "queries-keys-values",
    "queries-keys-values-advanced": "queries-keys-values-advanced",
    "scaled-dot-product-attention": "scaled-dot-product-attention",
    "attention-score-scaling": "attention-score-scaling",
    "causal-masking": "causal-masking",
    "cosine-similarity": "cosine-similarity",
    "linearite-embeddings": "embedding-linearity",
    "llm-overview": "llm-overview",
    "learning-map": "learning-map",
    "language-modeling-math": "language-modeling-math",
    "scaling-laws": "scaling-laws",
    "emergence": "emergence",
    "in-context-learning": "in-context-learning",
    "llm-limits": "llm-limits",
    "tensors": "tensors",
    "text-data": "text-data",
    "unicode-text": "unicode-text",
    "tokenization-strategies": "tokenization-strategies",
    "tokenizer-design-evaluation": "tokenizer-design-evaluation",
    "decoding-strategies": "decoding-strategies",
    "deepen": "deepen",
    "training-examples": "training-examples",
    "embedding-space": "embedding-space",
    "contextualized-representations": "contextualized-representations",
    "contextualized-representations-advanced": "contextualized-representations-advanced",
    "positional-encoding": "positional-encoding",
    "sinusoidal-positional-encoding": "sinusoidal-positional-encoding",
    "rope": "rope",
    "exercises": "exercises",
    "exercises-foundations": "exercises-foundations",
    "exercises-text-data": "exercises-text-data",
    "exercises-attention": "exercises-attention",
    "exercises-transformer": "exercises-transformer",
    "exercises-generation": "exercises-generation",
    "evaluation-experimentale": "experimental-evaluation",
    "llm-evolution": "llm-evolution"
  };
  const englishToFrench = Object.fromEntries(
    Object.entries(frenchToEnglish).map(([fr, en]) => [en, fr])
  );

  let target;
  let label;
  if (relativePath === "" || relativePath === "index.html") {
    target = "en/index.html";
    label = "English";
  } else if (relativePath === "en/" || relativePath === "en/index.html") {
    target = "index.html";
    label = "Français";
  } else if (relativePath === "references.html") {
    target = "en/index.html";
    label = "English";
  } else if (relativePath.startsWith("fr/")) {
    const slug = relativePath.slice(3).replace(/\.html$/, "");
    target = frenchToEnglish[slug]
      ? `en/${frenchToEnglish[slug]}.html`
      : "en/index.html";
    label = "English";
  } else if (relativePath.startsWith("en/")) {
    const slug = relativePath.slice(3).replace(/\.html$/, "");
    target = englishToFrench[slug]
      ? `fr/${englishToFrench[slug]}.html`
      : "index.html";
    label = "Français";
  } else {
    return;
  }

  const navbar = document.querySelector("#quarto-header .navbar .navbar-nav.ms-auto");
  if (!navbar || navbar.querySelector(".language-toggle")) return;

  const item = document.createElement("li");
  item.className = "nav-item language-toggle";
  const link = document.createElement("a");
  link.className = "nav-link";
  link.href = new URL(target, siteRoot).href;
  link.textContent = label;
  link.setAttribute("aria-label", label === "English" ? "Switch to English" : "Passer en français");
  link.setAttribute("lang", label === "English" ? "en" : "fr");
  item.appendChild(link);

  const githubItem = navbar.querySelector('a[href="https://github.com/JM-Brun/llm-lab"]')?.closest("li");
  if (githubItem) navbar.insertBefore(item, githubItem);
  else navbar.appendChild(item);
})();
</script>
