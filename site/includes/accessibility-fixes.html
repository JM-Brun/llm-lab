<script>
(() => {
  const selector = ".callout-header[data-bs-toggle='collapse']";

  const enhanceCalloutButtons = () => {
    document.querySelectorAll(selector).forEach((header) => {
      if (header.dataset.accessibilityEnhanced === "true") return;

      // Quarto currently renders a div as the collapse trigger. Replace it
      // with a native button so keyboard activation and button semantics are
      // provided by the browser rather than reimplemented with key handlers.
      const button = document.createElement("button");
      for (const attribute of [...header.attributes]) {
        button.setAttribute(attribute.name, attribute.value);
      }
      button.type = "button";
      button.dataset.accessibilityEnhanced = "true";
      button.append(...header.childNodes);

      const title = button.querySelector(".callout-title-container");
      const accessibleName = title?.textContent?.trim().replace(/\s+/g, " ");
      if (accessibleName) {
        button.setAttribute("aria-label", accessibleName);
      }

      header.replaceWith(button);
    });
  };

  const enhancePageNavigation = () => {
    document.querySelectorAll(".page-navigation a.pagination-link").forEach((link) => {
      const direction = link.closest(".nav-page-previous") ? "previous" : link.closest(".nav-page-next") ? "next" : null;
      if (!direction || link.dataset.navigationLabelEnhanced === "true") return;
      const title = link.querySelector(".nav-page-text")?.textContent?.trim().replace(/\s+/g, " ") || link.getAttribute("title")?.trim();
      if (!title) return;
      const french = document.documentElement.lang.toLowerCase().startsWith("fr");
      const label = french ? (direction === "previous" ? "Page précédente" : "Page suivante") : (direction === "previous" ? "Previous page" : "Next page");
      const separator = french ? " : " : ": ";
      link.setAttribute("aria-label", label + separator + title);
      link.dataset.navigationLabelEnhanced = "true";
    });
  };

  // Preserve deep links into optional resource sections: opening a hash target
  // must reveal its containing disclosure before the browser scrolls to it.
  const openResourceDisclosureForHash = () => {
    if (!window.location.hash) return;
    let target;
    try {
      target = document.getElementById(decodeURIComponent(window.location.hash.slice(1)));
    } catch {
      return;
    }
    const disclosure = target?.closest("details.learning-resources");
    if (disclosure) disclosure.open = true;
  };

  const enhanceAccessibility = () => {
    enhanceCalloutButtons();
    enhancePageNavigation();
    openResourceDisclosureForHash();
  };

  window.addEventListener("hashchange", openResourceDisclosureForHash);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", enhanceAccessibility, { once: true });
  } else {
    enhanceAccessibility();
  }
})();
</script>
