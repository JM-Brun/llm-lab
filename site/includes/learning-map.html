<script>
(() => {
  const root = document.querySelector("[data-learning-map]");
  if (!root) return;

  const language = root.dataset.language || "en";
  const copy = language === "fr" ? {
    columns: ["Comprendre", "Construire", "Approfondir", "Pratiquer et consulter"],
    route: "Parcours suggéré",
    hierarchy: "Hiérarchie pédagogique",
    related: "Pages associées",
    sectionHeadings: "Titres de section",
    modePages: "Graphe des pages",
    modeConcepts: "Graphe conceptuel",
    conceptRelations: "Relations conceptuelles",
    resources: "Pages ressources",
    noResources: "Aucune page associée.",
    purpose: "Rôle dans le parcours",
    open: "Ouvrir la page",
    selectHint: "Sélectionnez un bloc pour afficher ses détails ; utilisez ensuite « Ouvrir la page » pour naviguer.",
    empty: "Aucune page ne correspond à ces filtres.",
    count: (shown, total) => shown + " page(s) affichée(s) sur " + total + ".",
    countConcepts: (shown, total) => shown + " concept(s) affiché(s) sur " + total + ".",
    emptyConcepts: "Aucun concept ne correspond à cette recherche.",
    loadError: "La carte n’a pas pu être chargée. Vérifiez que les données ont été générées pendant le rendu Quarto.",
    unknown: "Page",
    conceptLabel: "Notion",
    noSectionHeadings: "Aucun titre de section disponible.",
    destinations: { orient: "S’orienter", understand: "Comprendre", build: "Construire", deepen: "Approfondir", practice: "Pratiquer", reference: "Référence" },
    domainLabel: "Domaine d’approfondissement",
    domains: {
      "architectures-mechanisms": "Architectures et mécanismes",
      "text-tokenization": "Texte et tokenisation",
      "mathematical-tools-geometry": "Outils mathématiques et géométrie",
      "probabilistic-foundations-training": "Fondements probabilistes et entraînement",
      "inference-efficiency": "Inférence et efficacité",
      "scale-research": "Échelle et questions de recherche"
    },
    domainShort: {
      "architectures-mechanisms": "Architectures",
      "text-tokenization": "Texte / tokens",
      "mathematical-tools-geometry": "Maths / géométrie",
      "probabilistic-foundations-training": "Probabilités / entraînement",
      "inference-efficiency": "Inférence / efficacité",
      "scale-research": "Échelle / recherche"
    }
  } : {
    columns: ["Understand", "Build", "Deepen", "Practice and reference"],
    route: "Suggested route",
    hierarchy: "Pedagogical hierarchy",
    related: "Related pages",
    sectionHeadings: "Section headings on this page",
    modePages: "Page graph",
    modeConcepts: "Concept graph",
    conceptRelations: "Concept relationships",
    resources: "Resource pages",
    noResources: "No linked pages.",
    purpose: "Role in the learning path",
    open: "Open page",
    selectHint: "Select a node to inspect its details, then use “Open page” to navigate.",
    empty: "No pages match these filters.",
    count: (shown, total) => shown + " of " + total + " pages shown.",
    countConcepts: (shown, total) => shown + " of " + total + " concepts shown.",
    emptyConcepts: "No concepts match this search.",
    loadError: "The map could not be loaded. Check that the data files were generated during the Quarto render.",
    unknown: "Page",
    conceptLabel: "Concept",
    noSectionHeadings: "No section headings available.",
    destinations: { orient: "Orientation", understand: "Understand", build: "Build", deepen: "Deepen", practice: "Practice", reference: "Reference" },
    domainLabel: "Deepen domain",
    domains: {
      "architectures-mechanisms": "Architectures and mechanisms",
      "text-tokenization": "Text and tokenization",
      "mathematical-tools-geometry": "Mathematical tools and geometry",
      "probabilistic-foundations-training": "Probabilistic foundations and training",
      "inference-efficiency": "Inference and efficiency",
      "scale-research": "Scale and research questions"
    },
    domainShort: {
      "architectures-mechanisms": "Architectures",
      "text-tokenization": "Text / tokens",
      "mathematical-tools-geometry": "Math / geometry",
      "probabilistic-foundations-training": "Probability / training",
      "inference-efficiency": "Inference / efficiency",
      "scale-research": "Scale / research"
    }
  };

  const svg = root.querySelector(".learning-map-svg");
  const canvas = root.querySelector(".learning-map-canvas");
  const details = root.querySelector(".learning-map-details");
  const status = root.querySelector(".learning-map-status");
  const search = root.querySelector("#learning-map-search");
  const destination = root.querySelector("#learning-map-destination");
  const domain = root.querySelector("#learning-map-domain");
  const mode = root.querySelector("#learning-map-mode");
  const pageControls = [...root.querySelectorAll("[data-map-page-controls]")];
  const conceptLegend = root.querySelector(".learning-map-concept-legend");
  const relationInputs = [...root.querySelectorAll("[data-map-relation]")];
  const NS = "http://www.w3.org/2000/svg";
  const WIDTH = 244;
  const HEIGHT = 98;
  const X_GAP = 285;
  const Y_GAP = 116;
  const X_START = 18;
  const Y_START = 78;
  let pages = [];
  let concepts = [];
  let conceptRelations = [];
  let conceptRelationTypes = {};
  let selectedId = null;

  const syncSelection = () => {
    svg.querySelectorAll("[data-map-node-id]").forEach(node => {
      node.classList.toggle("is-selected", node.dataset.mapNodeId === selectedId);
    });
  };

  const svgElement = (name, attributes = {}) => {
    const element = document.createElementNS(NS, name);
    Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, String(value)));
    return element;
  };

  const appendText = (parent, x, y, lines, className) => {
    const text = svgElement("text", { x, y, class: className });
    lines.forEach((line, index) => {
      const span = svgElement("tspan", { x, dy: index === 0 ? 0 : 16 });
      span.textContent = line;
      text.appendChild(span);
    });
    parent.appendChild(text);
    return text;
  };

  const wrap = (value, maxLength, maxLines = 2) => {
    const words = String(value || "").split(/\s+/).filter(Boolean);
    const lines = [];
    let line = "";
    for (const word of words) {
      const candidate = line ? line + " " + word : word;
      if (candidate.length > maxLength && line) {
        lines.push(line);
        line = word;
      } else {
        line = candidate;
      }
      if (lines.length === maxLines) break;
    }
    if (line && lines.length < maxLines) lines.push(line);
    if (words.join(" ").length > lines.join(" ").length && lines.length) {
      lines[lines.length - 1] = lines[lines.length - 1].replace(/[.,;:]?$/, "…");
    }
    return lines;
  };

  const columnFor = page => {
    if (page.destination === "orient" || page.destination === "understand") return 0;
    if (page.destination === "build") return 1;
    if (page.destination === "deepen") return 2;
    return 3;
  };

  const visiblePages = () => {
    const query = search.value.trim().toLocaleLowerCase();
    const selectedDestination = destination.value;
    const selectedDomain = domain ? domain.value : "all";
    return pages.filter(page => {
      const destinationMatches = selectedDestination === "all"
        || (selectedDestination === "understand"
          ? ["orient", "understand"].includes(page.destination)
          : page.destination === selectedDestination);
      const searchable = [
        page.title, page.scope, page.purpose, page.topic, page.domain,
        ...(page.section_headings || [])
      ].join(" ").toLocaleLowerCase();
      const domainMatches = selectedDomain === "all" || (page.destination === "deepen" && page.domain === selectedDomain);
      return destinationMatches && domainMatches && (!query || searchable.includes(query));
    });
  };

  const activeRelations = () => Object.fromEntries(
    relationInputs.map(input => [input.dataset.mapRelation, input.checked])
  );

  const renderDefs = () => {
    const defs = svgElement("defs");
    [["route", "#16834a"], ["hierarchy", "#2563a6"], ["related", "#94a3b8"]].forEach(([id, color]) => {
      const marker = svgElement("marker", {
        id: "map-arrow-" + id, markerWidth: 8, markerHeight: 8,
        refX: 6, refY: 3, orient: "auto", markerUnits: "strokeWidth"
      });
      marker.appendChild(svgElement("path", { d: "M0,0 L6,3 L0,6 Z", fill: color }));
      defs.appendChild(marker);
    });
    svg.appendChild(defs);
  };

  const buildEdges = (visible, positions, relations) => {
    const visibleIds = new Set(visible.map(page => page.id));
    const edges = [];
    const seen = new Set();
    const add = (from, to, type) => {
      if (!relations[type] || !visibleIds.has(from) || !visibleIds.has(to)) return;
      const key = type + ":" + from + ":" + to;
      if (seen.has(key)) return;
      seen.add(key);
      edges.push({ from, to, type });
    };
    visible.forEach(page => {
      if (page.route && page.route.next) add(page.id, page.route.next, "route");
      (page.children || []).forEach(child => add(page.id, child, "hierarchy"));
      (page.related || []).forEach(other => {
        if (page.id < other) add(page.id, other, "related");
      });
    });

    edges.forEach(edge => {
      const from = positions.get(edge.from);
      const to = positions.get(edge.to);
      if (!from || !to) return;
      const forward = to.x >= from.x;
      let x1 = from.x + WIDTH / 2;
      let x2 = to.x + WIDTH / 2;
      if (from.column !== to.column) {
        x1 = from.x + (forward ? WIDTH : 0);
        x2 = to.x + (forward ? 0 : WIDTH);
      }
      const y1 = from.y + HEIGHT / 2;
      const y2 = to.y + HEIGHT / 2;
      const bend = from.column === to.column ? 74 : 0;
      const controlX = (x1 + x2) / 2 + (from.column === to.column ? (y2 >= y1 ? bend : -bend) : 0);
      const path = svgElement("path", {
        d: "M " + x1 + " " + y1 + " C " + controlX + " " + y1 + ", " + controlX + " " + y2 + ", " + x2 + " " + y2,
        class: "map-edge map-edge-" + edge.type,
        "marker-end": "url(#map-arrow-" + edge.type + ")",
        "aria-hidden": "true"
      });
      svg.appendChild(path);
    });
  };

  const updateDetails = page => {
    if (!page) return;
    selectedId = page.id;
    syncSelection();
    details.replaceChildren();

    const eyebrow = document.createElement("p");
    eyebrow.className = "map-detail-eyebrow";
    eyebrow.textContent = (page.domain && copy.domains[page.domain]) || copy.destinations[page.destination] || copy.unknown;
    details.appendChild(eyebrow);

    const heading = document.createElement("h3");
    heading.textContent = page.title;
    details.appendChild(heading);

    const role = document.createElement("p");
    role.className = "map-detail-label";
    role.textContent = copy.purpose;
    details.appendChild(role);

    const summary = document.createElement("p");
    summary.textContent = page.scope || page.purpose || "";
    details.appendChild(summary);

    const instruction = document.createElement("p");
    instruction.className = "map-selection-hint";
    instruction.textContent = copy.selectHint;
    details.appendChild(instruction);

    const sectionHeadingTitle = document.createElement("h4");
    sectionHeadingTitle.textContent = copy.sectionHeadings;
    details.appendChild(sectionHeadingTitle);

    const sectionHeadingList = document.createElement("ul");
    sectionHeadingList.className = "map-section-heading-list";
    (page.section_headings || []).forEach(concept => {
      const item = document.createElement("li");
      item.textContent = concept;
      sectionHeadingList.appendChild(item);
    });
    if (!sectionHeadingList.childElementCount) {
      const item = document.createElement("li");
      item.textContent = copy.noSectionHeadings;
      sectionHeadingList.appendChild(item);
    }
    details.appendChild(sectionHeadingList);

    const open = document.createElement("a");
    open.className = "map-open-page";
    open.href = page.href;
    open.textContent = copy.open;
    details.appendChild(open);

    const relations = [
      [copy.route, [page.route && page.route.previous, page.route && page.route.next]],
      [copy.hierarchy, [...(page.parents || []), ...(page.children || [])]],
      [copy.related, page.related || []]
    ];
    const byId = new Map(pages.map(item => [item.id, item]));
    relations.forEach(([label, ids]) => {
      const targets = ids.map(id => byId.get(id)).filter(Boolean);
      if (!targets.length) return;
      const subheading = document.createElement("h4");
      subheading.textContent = label;
      details.appendChild(subheading);
      const list = document.createElement("ul");
      list.className = "map-related-list";
      targets.forEach(target => {
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.href = target.href;
        link.textContent = target.title;
        item.appendChild(link);
        list.appendChild(item);
      });
      details.appendChild(list);
    });
  };


  const updateConceptDetails = concept => {
    selectedId = concept.id;
    syncSelection();
    details.replaceChildren();
    const eyebrow = document.createElement("p");
    eyebrow.className = "map-detail-eyebrow";
    eyebrow.textContent = copy.conceptLabel;
    details.appendChild(eyebrow);
    const heading = document.createElement("h3");
    heading.textContent = concept.label;
    details.appendChild(heading);
    const definition = document.createElement("p");
    definition.textContent = concept.definition;
    details.appendChild(definition);

    const related = conceptRelations.filter(edge => edge.from === concept.id || edge.to === concept.id);
    if (related.length) {
      const title = document.createElement("h4");
      title.textContent = copy.conceptRelations;
      details.appendChild(title);
      const list = document.createElement("ul");
      list.className = "map-related-list";
      related.forEach(edge => {
        const otherId = edge.from === concept.id ? edge.to : edge.from;
        const other = concepts.find(item => item.id === otherId);
        if (!other) return;
        const item = document.createElement("li");
        const source = concepts.find(item => item.id === edge.from);
        const target = concepts.find(item => item.id === edge.to);
        if (!source || !target) return;
        const relation = conceptRelationTypes[edge.type];
        const arrow = relation && relation.direction === "symmetric" ? " ↔ " : " → ";
        item.textContent = source.label + " — " + (relation ? relation.label : edge.type) + arrow + target.label;
        list.appendChild(item);
      });
      details.appendChild(list);
    }
    const resourceTitle = document.createElement("h4");
    resourceTitle.textContent = copy.resources;
    details.appendChild(resourceTitle);
    const resources = document.createElement("ul");
    resources.className = "map-related-list";
    concept.resources.forEach(resource => {
      const item = document.createElement("li");
      const link = document.createElement("a");
      link.href = resource.href;
      link.textContent = resource.title;
      item.appendChild(link);
      resources.appendChild(item);
    });
    if (!resources.childElementCount) {
      const item = document.createElement("li");
      item.textContent = copy.noResources;
      resources.appendChild(item);
    }
    details.appendChild(resources);
  };

  const renderConceptLegend = () => {
    if (!conceptLegend) return;
    conceptLegend.replaceChildren();
    const heading = document.createElement("h4");
    heading.textContent = language === "fr" ? "Sens des relations (source → cible)" : "Relationship meaning (source → target)";
    conceptLegend.appendChild(heading);
    const list = document.createElement("ul");
    Object.entries(conceptRelationTypes).forEach(([type, relation]) => {
      const item = document.createElement("li");
      const direction = document.createElement("span");
      direction.className = "map-relation-direction";
      direction.textContent = relation.direction === "symmetric" ? "↔ " : "→ ";
      const label = document.createElement("strong");
      label.textContent = relation.label;
      const description = document.createElement("span");
      description.textContent = " — " + relation.description;
      item.append(direction, label, description);
      list.appendChild(item);
    });
    conceptLegend.appendChild(list);
  };

  const renderConceptGraph = () => {
    const query = search.value.trim().toLocaleLowerCase();
    const visible = concepts.filter(concept =>
      !query || [concept.id, concept.label, concept.definition].join(" ").toLocaleLowerCase().includes(query)
    );
    pageControls.forEach(element => { element.hidden = true; });
    if (conceptLegend) conceptLegend.hidden = false;
    const columns = 3;
    const nodeWidth = 220;
    const nodeHeight = 76;
    const gapX = 54;
    const gapY = 36;
    const startX = 24;
    const startY = 48;
    const rows = Math.max(1, Math.ceil(visible.length / columns));
    const width = startX * 2 + columns * nodeWidth + (columns - 1) * gapX;
    const height = startY + rows * (nodeHeight + gapY) + 20;
    svg.replaceChildren();
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.setAttribute("width", String(width));
    svg.setAttribute("height", String(height));
    const defs = svgElement("defs");
    const marker = svgElement("marker", {
      id: "map-arrow-concept", markerWidth: 8, markerHeight: 8,
      refX: 6, refY: 3, orient: "auto", markerUnits: "strokeWidth"
    });
    marker.appendChild(svgElement("path", { d: "M0,0 L6,3 L0,6 Z", fill: "#7C6BB1" }));
    defs.appendChild(marker);
    svg.appendChild(defs);

    const positions = new Map();
    visible.forEach((concept, index) => {
      positions.set(concept.id, {
        x: startX + (index % columns) * (nodeWidth + gapX),
        y: startY + Math.floor(index / columns) * (nodeHeight + gapY)
      });
    });
    conceptRelations.forEach(edge => {
      const from = positions.get(edge.from);
      const to = positions.get(edge.to);
      if (!from || !to) return;
      const fromCenter = { x: from.x + nodeWidth / 2, y: from.y + nodeHeight / 2 };
      const toCenter = { x: to.x + nodeWidth / 2, y: to.y + nodeHeight / 2 };
      const dx = toCenter.x - fromCenter.x;
      const dy = toCenter.y - fromCenter.y;
      const scale = 1 / Math.max(Math.abs(dx) / (nodeWidth / 2), Math.abs(dy) / (nodeHeight / 2));
      const relation = conceptRelationTypes[edge.type];
      const symmetric = relation && relation.direction === "symmetric";
      const path = svgElement("path", {
        d: "M " + (fromCenter.x + dx * scale) + " " + (fromCenter.y + dy * scale)
          + " L " + (toCenter.x - dx * scale) + " " + (toCenter.y - dy * scale),
        class: "map-edge map-edge-concept" + (symmetric ? " map-edge-concept-symmetric" : ""),
        "marker-end": symmetric ? "none" : "url(#map-arrow-concept)",
        "aria-hidden": "true"
      });
      svg.appendChild(path);
    });
    visible.forEach(concept => {
      const position = positions.get(concept.id);
      const node = svgElement("g", {
        class: "map-node map-concept-node" + (selectedId === concept.id ? " is-selected" : ""),
        "data-map-node-id": concept.id,
        tabindex: "0",
        role: "button",
        "aria-label": concept.label + ". " + concept.definition
      });
      node.appendChild(svgElement("rect", {
        x: position.x, y: position.y, width: nodeWidth, height: nodeHeight, rx: 9,
        class: "map-node-card"
      }));
      appendText(node, position.x + 12, position.y + 27, wrap(concept.label, 27, 1), "map-node-title");
      node.addEventListener("click", () => updateConceptDetails(concept));
      node.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          node.click();
        }
      });
      svg.appendChild(node);
    });
    status.textContent = copy.countConcepts(visible.length, concepts.length);
    if (!visible.length) {
      const empty = svgElement("text", { x: 24, y: 115, class: "map-empty" });
      empty.textContent = copy.emptyConcepts;
      svg.appendChild(empty);
    }
    if (!visible.some(item => item.id === selectedId) && visible.length) {
      updateConceptDetails(visible[0]);
    } else if (visible.length) {
      updateConceptDetails(visible.find(item => item.id === selectedId));
    }
  };

  const render = () => {
    if (mode && mode.value === "concepts") {
      renderConceptGraph();
      return;
    }
    pageControls.forEach(element => { element.hidden = false; });
    if (conceptLegend) conceptLegend.hidden = true;
    const visible = visiblePages();
    const relations = activeRelations();
    const grouped = [[], [], [], []];
    visible.forEach(page => grouped[columnFor(page)].push(page));
    grouped.forEach(group => group.sort((a, b) => a.rank - b.rank || a.title.localeCompare(b.title)));

    const maxRows = Math.max(1, ...grouped.map(group => group.length));
    const viewHeight = Y_START + maxRows * Y_GAP + 32;
    svg.replaceChildren();
    svg.setAttribute("viewBox", "0 0 " + (X_START * 2 + 4 * X_GAP) + " " + viewHeight);
    svg.setAttribute("width", String(X_START * 2 + 4 * X_GAP));
    svg.setAttribute("height", String(viewHeight));
    renderDefs();

    const positions = new Map();
    grouped.forEach((group, column) => {
      const x = X_START + column * X_GAP;
      const heading = svgElement("text", { x, y: 34, class: "map-column-heading" });
      heading.textContent = copy.columns[column];
      svg.appendChild(heading);
      group.forEach((page, index) => {
        positions.set(page.id, { x, y: Y_START + index * Y_GAP, column });
      });
    });

    buildEdges(visible, positions, relations);

    grouped.forEach(group => group.forEach(page => {
      const position = positions.get(page.id);
      const anchor = svgElement("g", {
        class: "map-node map-node-" + page.destination + (selectedId === page.id ? " is-selected" : ""),
        "data-map-node-id": page.id,
        tabindex: "0",
        role: "button",
        "aria-label": page.title + ". " + (page.section_headings || []).slice(0, 3).join(", ")
      });
      const title = svgElement("title");
      title.textContent = page.title;
      anchor.appendChild(title);
      anchor.appendChild(svgElement("rect", {
        x: position.x, y: position.y, width: WIDTH, height: HEIGHT, rx: 10,
        class: "map-node-card"
      }));
      const topic = svgElement("text", {
        x: position.x + 13, y: position.y + 18, class: "map-node-topic"
      });
      topic.textContent = (page.domain && copy.domainShort[page.domain]) || copy.destinations[page.destination] || copy.unknown;
      anchor.appendChild(topic);
      appendText(anchor, position.x + 13, position.y + 39, wrap(page.title, 30, 2), "map-node-title");
      const headings = (page.section_headings || []).slice(0, 2).join(" · ");
      const conceptLine = svgElement("text", {
        x: position.x + 13, y: position.y + 84, class: "map-node-section-headings"
      });
      conceptLine.textContent = headings.length > 44 ? headings.slice(0, 43) + "…" : headings;
      anchor.appendChild(conceptLine);
      anchor.addEventListener("pointerenter", () => updateDetails(page));
      anchor.addEventListener("focus", () => updateDetails(page));
      anchor.addEventListener("click", () => updateDetails(page));
      anchor.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          anchor.click();
        }
      });
      svg.appendChild(anchor);
    }));

    status.textContent = copy.count(visible.length, pages.length);
    if (!visible.length) {
      const empty = svgElement("text", { x: 24, y: 115, class: "map-empty" });
      empty.textContent = copy.empty;
      svg.appendChild(empty);
    }
    const current = pages.find(page => page.id === selectedId);
    if (!current && visible.length) updateDetails(visible[0]);
  };

  search.addEventListener("input", render);
  if (mode) mode.addEventListener("change", render);
  destination.addEventListener("change", () => {
    if (domain && destination.value !== "deepen") domain.value = "all";
    render();
  });
  if (domain) domain.addEventListener("change", () => {
    if (domain.value !== "all") destination.value = "deepen";
    render();
  });
  relationInputs.forEach(input => input.addEventListener("change", render));

  fetch(root.dataset.source)
    .then(response => {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then(payload => {
      pages = Array.isArray(payload.pages) ? payload.pages : [];
      concepts = Array.isArray(payload.concepts) ? payload.concepts : [];
      conceptRelations = Array.isArray(payload.concept_relations) ? payload.concept_relations : [];
      conceptRelationTypes = payload.concept_relation_types || {};
      renderConceptLegend();
      if (!pages.length) throw new Error("No page metadata found");
      selectedId = pages.some(page => page.id === language + "/llm-overview")
        ? language + "/llm-overview"
        : pages[0].id;
      render();
      updateDetails(pages.find(page => page.id === selectedId));
    })
    .catch(error => {
      console.error("Learning map:", error);
      status.textContent = copy.loadError;
      canvas.classList.add("map-load-error");
    });
})();
</script>
