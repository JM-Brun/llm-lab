  pedagogical_limits:
    - "The article's central slogan 'LLMs do not guess; they optimize' conflates training-time parameter optimization with inference-time probabilistic decoding. A model can sample at inference; sampling is not generally optimization of its weights."
    - "Gradient descent is not a 'stripped-down Newton' in the strict algorithmic sense. Gradient descent uses first-order gradient information; Newton's method uses curvature/Hessian information. They are related optimization methods, not a simple parent/child reduction."
    - "The claim that gradient descent is the version used to train LLMs is overgeneralized: practical training commonly uses stochastic/minibatch gradient methods and adaptive optimizers such as Adam/AdamW, distributed training, schedules, clipping and other engineering choices."
    - "The text's reference to trillions of optimization steps is not a reliable general description of training runs. Parameter count, token count, optimizer steps and FLOPs are distinct quantities."
    - "The golden-section method requires a suitable unimodal one-dimensional interval. It is not a general method for high-dimensional hyperparameter tuning; random search, Bayesian optimization, successive halving and other methods are common alternatives."
    - "The article overstates the role of KKT conditions in LLM training. Regularization is often implemented as a penalty term (for example weight decay), and general fairness constraints are not automatically enforced by KKT conditions."
    - "The claim that inference approximations such as 4-bit quantization are evaluated using minimax criteria is not generally true. Common calibration objectives include reconstruction error, MSE, KL divergence and downstream task metrics; worst-case criteria are one possible design choice."
    - "The description of Chebyshev polynomials is imprecise: best uniform approximation is characterized by equioscillation under the relevant approximation conditions; the monic-polynomial extremal property is a related but distinct theorem."
    - "A non-uniform next-token distribution is structured, but that alone does not make the generated token an optimized choice. Sampling, greedy decoding, beam search and other decoding policies have different decision rules."
    - "The article's 'uniform random output' comparison is a straw-man contrast. In ordinary language, guessing can be informed and probabilistic; a more precise contrast is learned conditional distribution versus unstructured random choice."
    - "No source code, training configuration, dataset, reproducible experiment or direct primary-source citations are supplied in the inspected article."
