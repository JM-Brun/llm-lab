  pedagogical_strengths:
    - "Provides a broad map of optimization problem families rather than presenting gradient descent in isolation."
    - "The valley/hill intuition offers a low-barrier entry point to objective functions."
    - "Contrasts derivative-based and derivative-free search, linear and nonlinear constraints, and average versus worst-case approximation."
