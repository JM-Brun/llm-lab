learning_outcomes:
  - {status: inferred, outcome: "Distinguish predictive performance from structural properties of learned representations.", basis: "§§2, 6.4 and critical review."}
  - {status: inferred, outcome: "Explain why cross-entropy does not directly measure understanding, causal knowledge or semantic grounding.", basis: "§§4, 6."}
  - {status: inferred, outcome: "Separate formal definitions, mathematical analogies and philosophical interpretations.", basis: "§§2.2b, 6.4, 7, 8."}
  - {status: inferred, outcome: "Design a controlled test of sequence structure while preserving marginal symbol frequencies.", basis: "§7 and project experiment proposal."}
assumed_prerequisites:
  - {status: inferred, topic: "Conditional probabilities, entropy, surprisal and cross-entropy.", basis: "§§1–2."}
  - {status: inferred, topic: "Basic next-token training and generalization.", basis: "§§2.2, 4."}
teaching_route:
  - {order: 1, section: "§1–2: Shannon, algorithmic complexity and epiplexity", function: foundations, moves: ["State what Shannon entropy measures.", "Separate entropy, Kolmogorov complexity, effective complexity and epiplexity."]}
  - {order: 2, section: "§3–4: positive and negative subjectivity", function: comparison, moves: ["Present narrative and probability-distribution compression as the author's models.", "Mark the comparison as philosophical rather than a demonstrated implementation equivalence."]}
  - {order: 3, section: "§6: functional and structural effectiveness", function: conceptual-distinction, moves: ["Separate task success/generalization from representational parsimony and recombination.", "Explain that the proposed definition of understanding is stipulative."]}
  - {order: 4, section: "§7: verifiable predictions", function: research-method, moves: ["Translate each prediction into measurable outcomes.", "List confounders and falsification criteria."]}
  - {order: 5, section: "§8: grey subjectivity", function: hypothesis, moves: ["Describe the proposed mixed objective and embodied interaction condition.", "Keep the model explicitly hypothetical."]}
pedagogical_strengths:
  - "A clear contrast between predictive fit and selective retention of structure."
  - "The paper offers explicit predictions rather than stopping at a metaphor."
  - "Its own caveats about algebraic analogy and conditional embodiment support critical teaching."
pedagogical_limits:
  - "Several key terms (effective compression, understanding, positive/negative subjectivity) are author-defined and not consensus operational measures."
  - "The An/Fn mapping to neural parameters and human cognition is analogical, not a demonstrated isomorphism."
  - "Epiplexity is sometimes paraphrased intuitively in ways that can blur its formal time-bounded MDL definition."
  - "Claims about FineWeb-Edu, CoT, RLHF/DPO and scaling require independent controlled evaluation."
