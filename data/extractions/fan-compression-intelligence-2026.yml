schema_version: 1
source_id: fan-compression-intelligence-2026
items:
  - id: fan-compression-intelligence-2026:effective-compression
    kind: claim
    summary: "Fan frames intelligence as effective compression, distinguishing epiplexity-oriented and cross-entropy-oriented strategies."
    locator: {type: section, value: "Abstract; §§1, 9"}
    evidence:
      kind: philosophical-argument
      confidence: speculative
      scope: "Conceptual framework proposed by the author."
      assumptions: ["The definition of intelligence as effective compression is adopted for the argument."]
      limitations: ["Not a consensus definition or an empirically established general theory."]
    disposition: clarify
    classification:
      primary_theme: probabilistic-foundations-training
      concept_ids: [predictive-compression, cross-entropy]
    candidate_destinations:
      pages: [fr/compression-revision, en/compression-revision]
  - id: fan-compression-intelligence-2026:epiplexity
    kind: definition
    summary: "Epiplexity is used for structured information accessible to a computationally bounded observer, with a formal time-bounded MDL basis."
    locator: {type: section, value: "§2.1b"}
    evidence:
      kind: cited-preprint
      confidence: context-dependent
      scope: "Finzi et al. 2026, arXiv:2601.03220, as cited by Fan and checked against the primary source."
      assumptions: ["The relevant computational model, program class and time budget are specified."]
      limitations: ["Do not equate epiplexity with Shannon entropy or generic complexity; it is not a guarantee of task-specific OOD generalization."]
    disposition: clarify
    classification:
      primary_theme: probabilistic-foundations-training
      concept_ids: [entropy, predictive-compression]
    candidate_destinations:
      pages: [fr/compression-revision, en/compression-revision]
  - id: fan-compression-intelligence-2026:functional-vs-structural
    kind: claim
    summary: "The paper distinguishes functional task success from structural effectiveness, defined in terms of parsimonious and recombinable internal representations."
    locator: {type: section, value: "§6.4"}
    evidence:
      kind: author-definition
      confidence: speculative
      scope: "Stipulative distinction used by Fan to discuss intelligence and understanding."
      assumptions: ["Structural effectiveness is treated as a central criterion for understanding."]
      limitations: ["Other accounts of understanding are possible; the proposed An/Fn bridge is not established for neural networks."]
    disposition: clarify
    classification:
      primary_theme: scale-research
      concept_ids: [predictive-compression]
    candidate_destinations:
      pages: [fr/compression-revision, en/compression-revision]
  - id: fan-compression-intelligence-2026:grey-subjectivity
    kind: claim
    summary: "A mixed global probabilistic layer and temporary task-level structure is proposed as a possible intermediate strategy under embodied interaction."
    locator: {type: section, value: "§8"}
    evidence:
      kind: conceptual-model
      confidence: speculative
      scope: "Author's proposed layered architecture and conditional scenario."
      assumptions: ["Sensorimotor interaction changes the relevant compression objective.", "Task-level causal structures can be represented and integrated across tasks."]
      limitations: ["No implementation or empirical validation is supplied; embodiment does not establish subjective experience."]
    disposition: defer
    classification:
      primary_theme: scale-research
      concept_ids: [predictive-compression]
    candidate_destinations:
      pages: [fr/llm-limits, en/llm-limits]
  - id: fan-compression-intelligence-2026:an-fn-analogy
    kind: analogy
    summary: "The paper maps commutative and non-commutative monoid expansion onto flexible conceptual recombination versus context-dependent sequence patterns."
    locator: {type: section, value: "§2.2b; §6.4"}
    evidence:
      kind: mathematical-analogy
      confidence: context-dependent
      scope: "Analogy to Aksenov et al. 2026, arXiv:2603.20396; primary-source qualifications are recorded in the source review."
      assumptions: ["The structural features being compared are specified."]
      limitations: ["Not an isomorphism; neural parameters are not independent macro symbols; formal theorems do not transfer automatically to LLMs."]
    disposition: clarify
    classification:
      primary_theme: mathematical-tools-geometry
      concept_ids: [predictive-compression]
    candidate_destinations:
      pages: [fr/compression-revision, en/compression-revision]
