  - id: piantadosi-zipf-word-frequency-2014:theory-underdetermination
    kind: limitation
    summary: "The review surveys multiple mechanisms that can generate Zipf-like distributions and argues that deriving the curve alone is weak evidence for a psychological explanation. A credible account must also explain other empirical properties and test its assumptions through independent predictions."
    locator: {type: section, value: "Introduction and Section 4; conclusion and forward directions", label: "Evaluating explanatory accounts"}
    evidence:
      kind: critical-literature-review
      confidence: well-supported
      scope: "The theoretical accounts and empirical phenomena reviewed in the paper."
      assumptions: ["A causal account should make testable predictions beyond reproducing the rank-frequency curve."]
      limitations: ["The article is a 2014 review; later work may add or revise particular models."]
    technical_assessment:
      status: not-reviewed
      rationale: "Synthesis of the author's critical review; later literature requires separate evaluation."
      corroborating_sources: [lestrade-unzipping-zipfs-law-2017, linders-louwerse-zipf-spoken-dialog-2023]
    pedagogical_profile:
      learner_question: "Does the observed curve explain why language has this distribution?"
      explanatory_lens: underdetermination of causal models by descriptive fit
      teaching_form: [contrast, misconception-correction]
      abstraction_level: intermediate-to-advanced
      prerequisites: ["empirical law versus causal mechanism"]
      distinctive_value: "Separates a compact statistical description from the much harder problem of identifying its generative cause."
      limitations: ["Does not settle which later explanatory model is best."]
    pedagogical_assessment:
      novelty: {level: moderate, rationale: "The Day 01 lesson states that the law is not a causal explanation; this source broadens the range of candidate mechanisms."}
      complementarity: {level: high, rationale: "Provides a framework for comparing competing explanations without selecting one prematurely."}
      pedagogical_value: {level: high, rationale: "Prevents the common mistake of treating a successful fit as a causal theory."}
      applicability: {level: high, rationale: "Useful as the organizing principle for a later comparison of explanatory models."}
      redundancy: {level: moderate, rationale: "The central warning exists already; the comparative framework is new."}
      evidence_quality: {level: high, rationale: "Peer-reviewed critical review that explicitly evaluates the empirical reach of proposed explanations."}
