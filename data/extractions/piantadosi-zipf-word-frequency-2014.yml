items:
  - id: piantadosi-zipf-word-frequency-2014:rank-frequency-form
    kind: definition
    summary: "The paper defines the near-Zipfian rank-frequency relation as f(r) proportional to r raised to -alpha, with alpha often near 1. It uses 'near-Zipfian' for approximate fits rather than treating the simple formula as an exact identity."
    locator: {type: section, value: "Introduction, Eq. 1", label: "Rank-frequency law"}
    evidence:
      kind: author-formalization
      confidence: established
      scope: "Frequency of lexical word types ordered by empirical frequency rank in natural-language corpora."
      assumptions: ["The counted units and corpus-specific ranking are held fixed for the analysis."]
      limitations: ["The exponent and fit depend on corpus and measurement choices; the formula is an approximation."]
    technical_assessment:
      status: not-reviewed
      rationale: "Primary review source; independent specialist validation not performed in this ingestion pass."
      corroborating_sources: [pilgrim-hills-bias-zipf-estimators-2021]
    pedagogical_profile:
      learner_question: "What does Zipf's law actually state?"
      explanatory_lens: mathematical rank-frequency description
      teaching_form: [definition, equation, worked-rank-example]
      abstraction_level: introductory-to-intermediate
      prerequisites: ["frequency counts", "sorting and rank"]
      distinctive_value: "Provides the canonical equation and frames it as an approximate empirical relation."
      limitations: ["Does not explain why language generates the distribution."]
    pedagogical_assessment:
      novelty: {level: low, rationale: "The published Day 01 lesson already presents the equation and rank interpretation."}
      complementarity: {level: moderate, rationale: "The review's explicit use of near-Zipfian and its Mandelbrot parameterization can support more careful terminology in an advanced note."}
      pedagogical_value: {level: moderate, rationale: "Helps learners distinguish the empirical pattern from a strict mathematical identity."}
      applicability: {level: moderate, rationale: "Potential reference note in the existing lesson or Deepen page, not a second introductory explanation."}
      redundancy: {level: moderate, rationale: "The central equation and variable definitions already appear in the current bilingual lesson."}
      evidence_quality: {level: high, rationale: "Peer-reviewed theoretical review with explicit equations and corpus discussion."}
    classification:
      tags: [topic:zipfs-law, topic:word-frequency]
      concept_ids: [word-frequency-distribution, zipf-law]
    candidate_destinations:
      pages: [fr/advent-calendar-story-day-01, en/advent-calendar-story-day-01]
      concepts: []
      route_ids: []
