  - id: piantadosi-zipf-word-frequency-2014:correlated-rank-frequency-errors
    kind: limitation
    summary: "Estimating a word's frequency and its rank from the same corpus sample creates correlated measurement errors: a word over-counted by chance is also promoted in the empirical ranking. The resulting rank-frequency plot can look more regular than the underlying relation, especially in the rare-word tail."
    locator: {type: section, value: "Section 2, discussion of correlated errors and Fig. 1", label: "The word frequency distribution is complex"}
    evidence:
      kind: methodological-analysis
      confidence: well-supported
      scope: "The standard construction of rank-frequency plots when ranks and counts are estimated from the same sample."
      assumptions: ["Observed word counts are noisy estimates of underlying usage frequencies."]
      limitations: ["This is a specific visualization/estimation pitfall; it does not imply that every observed Zipf-like pattern is spurious."]
    technical_assessment:
      status: not-reviewed
      rationale: "Methodological argument recorded from the primary review; later estimator analysis is separately extracted."
      corroborating_sources: [pilgrim-hills-bias-zipf-estimators-2021]
    pedagogical_profile:
      learner_question: "Why can a convincing log-log plot be misleading?"
      explanatory_lens: measurement-error coupling
      teaching_form: [counterexample, methodological-warning]
      abstraction_level: advanced
      prerequisites: ["sampling variability", "empirical ranking"]
      distinctive_value: "Explains that both plotted coordinates are estimated from the same noisy observations, rather than treating rank as error-free."
      limitations: ["The independent-split remedy is not a complete solution to every rank-estimation problem."]
    pedagogical_assessment:
      novelty: {level: moderate, rationale: "The current Day 01 lesson includes this warning, but the source provides a more explicit statistical mechanism."}
      complementarity: {level: high, rationale: "It supplies a concrete explanation for why ordinary rank-frequency plots may overstate regularity."}
      pedagogical_value: {level: high, rationale: "Addresses a common inferential error: interpreting visual linearity as evidence of a generative power law."}
      applicability: {level: high, rationale: "Could underpin an exercise asking learners to reason about shared sampling error."}
      redundancy: {level: moderate, rationale: "The current lesson already summarizes the pitfall; additional detail belongs in practice or optional depth."}
      evidence_quality: {level: high, rationale: "Explicit statistical argument and worked visualization in a peer-reviewed review."}
    classification:
      tags: [topic:statistical-estimation, method:sample-splitting]
      concept_ids: []
