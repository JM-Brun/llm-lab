  - id: piantadosi-zipf-word-frequency-2014:structure-beyond-simple-law
    kind: result
    summary: "After separating the samples used to estimate ranks and frequencies, the review reports interpretable residual structure beyond the Zipf–Mandelbrot fit, including systematic deviations among frequent words. The simple law captures substantial large-scale variation but not the complete lexical frequency distribution."
    locator: {type: section, value: "Section 2, Fig. 1 and discussion of residual structure", label: "Residuals beyond the fitted curve"}
    evidence:
      kind: reported-empirical-analysis
      confidence: well-supported
      scope: "The American National Corpus analysis presented in the review and its interpretation of residuals."
      assumptions: ["The split-sample construction is used to reduce correlated rank/count errors."]
      limitations: ["The reported residual pattern is tied to the examined corpus and analysis; it should not be generalized as an identical shape for every corpus."]
    technical_assessment:
      status: not-reviewed
      rationale: "Source result recorded; no independent replication performed."
      corroborating_sources: []
    pedagogical_assessment:
      novelty: {level: moderate, rationale: "The lesson currently states that real distributions deviate but does not show structured residuals."}
      complementarity: {level: high, rationale: "Adds a useful visual/statistical distinction between a broad trend and local structure."}
      pedagogical_value: {level: moderate, rationale: "Can motivate why model fit and residual analysis matter beyond a log-log straight line."}
      applicability: {level: moderate, rationale: "Potential advanced figure description or optional analysis activity."}
      redundancy: {level: low, rationale: "Residual structure is not yet explored in the short introductory lesson."}
