schema_version: 1
source_id: witten-neal-cleary-arithmetic-coding-1987
items:
  - id: witten-neal-cleary-arithmetic-coding-1987:shared-probability-model-contract
    kind: method
    summary: "The encoder maps an input string and a probability model to a bit string; the decoder must have access to the same model and reproduce the same next-symbol distribution in the same context to reconstruct the exact input."
    locator: {type: page-section, value: "pp. 520–521, Data Compression", label: "Model-based coding and decoder agreement"}
    evidence:
      kind: primary-method-description
      confidence: well-supported
      scope: "Lossless model-based coding with a shared fixed or adaptive probability model."
      assumptions: ["The model defines a distribution over the next symbol for each context.", "Encoder and decoder initialize and update the model identically.", "The input alphabet and symbol ordering are agreed."]
      limitations: ["The paper does not establish that arbitrary model log loss is itself a complete transport format.", "A model/checkpoint identifier alone is insufficient unless the model and all probability arithmetic are reproducible."]
    disposition: integrate
    mapped_concepts: [conditional-distribution, predictive-compression, arithmetic-coding, entropy-coding]
    target_resources: [fr/compression-revision, en/compression-revision]
  - id: witten-neal-cleary-arithmetic-coding-1987:interval-cost-and-termination
    kind: derivation
    summary: "Each symbol narrows a shared interval according to its model probability. The final interval width has negative logarithm equal to the accumulated ideal information cost in the example; an EOF symbol is used to make message termination decodable."
    locator: {type: page-section, value: "pp. 521–523, The Idea of Arithmetic Coding and Fig. 2", label: "Interval narrowing, ideal cost and EOF"}
    evidence:
      kind: primary-derivation
      confidence: well-supported
      scope: "The interval interpretation and illustrative fixed-model arithmetic coder."
      assumptions: ["A common model and cumulative probability table.", "The same symbol ordering and half-open interval convention at both ends.", "An explicit end-of-message convention such as the distinguished EOF symbol."]
      limitations: ["The worked example uses decimal arithmetic for exposition; production code uses finite-precision integer arithmetic.", "The logarithm of the ideal interval width is not automatically the exact byte length of the framed output."]
    disposition: integrate
    mapped_concepts: [surprisal, conditional-distribution, predictive-compression, arithmetic-coding]
    target_resources: [fr/compression-revision, en/compression-revision]
  - id: witten-neal-cleary-arithmetic-coding-1987:finite-precision-implementation
    kind: implementation
    summary: "The practical encoder and decoder use bounded integer state, renormalization, bit output/input and explicit finalization. The article identifies precision growth, incremental operation, overflow/underflow and model representation as implementation concerns."
    locator: {type: page-section, value: "pp. 523–527, Figs. 2–3 and implementation discussion", label: "Integer arithmetic encoder and decoder"}
    evidence:
      kind: primary-implementation
      confidence: well-supported
      scope: "The article's finite-precision arithmetic-coding implementation and its model interface."
      assumptions: ["Matching code-value width, cumulative-frequency model and update rules.", "Identical encoder/decoder state transitions.", "A shared termination and bitstream convention."]
      limitations: ["This is a historical C implementation; its constants and exact algorithm should not be copied without independent tests.", "The article's performance results were not rerun in this repository."]
    disposition: integrate
    mapped_concepts: [arithmetic-coding, entropy-coding, conditional-distribution]
    target_resources: [fr/compression-revision, en/compression-revision]
