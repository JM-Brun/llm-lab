items:
  - id: ai-scientist-platonic-representation-jepa-2026:good-view-bad-view
    kind: mechanism
    summary: "The article distinguishes good-view pairs, which connect different observations of the same underlying scene, from bad-view pairs, which connect corruptions of one observation. The labels concern cross-modal alignment, not the general usefulness of data augmentation."
    locator: {type: section, value: "Good-view and bad-view explanation", label: "Two descriptions of one scene versus two altered versions of one description"}
    evidence:
      kind: secondary-technical-synthesis
      confidence: well-supported
      scope: "The article's central explanatory distinction, checked against arXiv sections 1–2.3."
      assumptions: ["The paired observations are intended to preserve a relation to underlying world states."]
      limitations: ["Good/bad is task-relative; a crop or mask can be useful for other objectives.", "The primary paper's formal definitions and nuisance assumptions govern the precise claim."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [mathematical-tools-geometry]
      tags: [topic:jepa, topic:cross-modal-alignment, method:positive-pairs]
      concept_ids: [contextualized-representation]
    candidate_destinations:
      pages: [fr/contextualized-representations, en/contextualized-representations]
      concepts: []
    disposition: pending
  - id: ai-scientist-platonic-representation-jepa-2026:rotation-equivalence
    kind: claim
    summary: "Under the paper's idealized assumptions, separately trained modality encoders recover the same latent organization up to an orthogonal rotation; this is a sufficient conditional result, not a theorem that arbitrary models converge as they scale."
    locator: {type: section, value: "Mathematical contribution", label: "Platonic Representation Theorem summary"}
    evidence:
      kind: theorem-summary
      confidence: well-supported
      scope: "Secondary summary cross-checked with the theorem statement and assumptions in arXiv sections 2.1–2.2."
      assumptions: ["Finite world-state set with positive probabilities", "Injective modality renderings", "Shared positive-pair distribution over world states", "Population optima and minimizers unique up to rotation"]
      limitations: ["Full proof and spectral-gap conditions still require detailed audit.", "The article's summary should not be used as a substitute for the theorem statement."]
    classification:
      primary_theme: mathematical-tools-geometry
      tags: [topic:platonic-representation-hypothesis, topic:jepa, method:orthogonal-alignment]
    candidate_destinations:
      pages: [fr/contextualized-representations, en/contextualized-representations]
      concepts: []
    disposition: pending
  - id: ai-scientist-platonic-representation-jepa-2026:sample-efficiency
    kind: result
    summary: "The article reports that the good-view text JEPA reached a comparable measured alignment after 21.6 million training samples, while next-token prediction required 900 million samples on the same corpus. This is a 42-fold sample-count difference, not a demonstrated 42-fold reduction in total compute."
    locator: {type: section, value: "Figure 1 and scale discussion", label: "Good views need 42 times fewer samples"}
    evidence:
      kind: author-reported-experiment
      confidence: context-dependent
      scope: "Reported comparison under the paper's selected corpus, model, objective and alignment benchmark."
      assumptions: ["The compared runs use the paper's stated matched corpus and evaluation protocol."]
      limitations: ["Training samples are not equivalent to tokens, FLOPs, wall-clock time or energy.", "Not a universal constant or independently reproduced result."]
    classification:
      primary_theme: scale-research
      secondary_themes: [architectures-mechanisms]
      tags: [topic:jepa, topic:cross-modal-alignment, topic:training-efficiency]
    candidate_destinations:
      pages: [fr/contextualized-representations, en/contextualized-representations]
      concepts: [training-objective]
    disposition: pending
  - id: ai-scientist-platonic-representation-jepa-2026:captioner-data-provenance
    kind: limitation
    summary: "At web scale, much of the text used to train the text JEPA consists of descriptions generated by an existing vision-language captioner. Although the JEPA encoder does not receive pixels, its training text inherits information from an upstream image–text system."
    locator: {type: section, value: "Limitations", label: "Where the good views come from"}
    evidence:
      kind: author-stated-limitation
      confidence: well-supported
      scope: "Article's explicit qualification of the 940M-image text corpus."
      assumptions: []
      limitations: ["The exact provenance and filtering pipeline require verification in the paper's experimental details."]
    classification:
      primary_theme: scale-research
      tags: [topic:jepa, topic:data-provenance, modality:multimodal]
    candidate_destinations:
      pages: [fr/contextualized-representations, en/contextualized-representations]
      concepts: []
    disposition: pending

