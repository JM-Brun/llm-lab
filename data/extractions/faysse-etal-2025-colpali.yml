  - id: faysse-etal-2025-colpali:storage-footprint
    kind: result
    summary: "Appendix B.3 reports 257.5 KB per page for ColPali float16 embeddings on the DocVQA ViDoRe test set, compared with 8.60 KB for BGE-M3. The paper attributes the larger footprint to retaining one vector per image patch plus six prompt tokens, projected to 128 dimensions; it discusses pooling and quantization as possible reductions."
    locator: {type: section, value: "§5.2, Appendix B.3, Table 4, pp. 8 and 18", label: "Per-page embedding storage footprint"}
    evidence: {kind: reported-storage-measurement, confidence: well-supported, scope: "Embedding size comparison on the DocVQA test set, with ColPali in float16.", assumptions: [], limitations: ["Per-page embedding size, not total deployed index size including metadata, ANN structures, replication or serving overhead.", "Other models may use multiple vectors per page; the table's BGE-M3 value is 8.60 KB.", "Pooling and quantization savings are potential techniques, not measurements of the uncompressed Table 4 configuration."]}
    technical_assessment: {status: qualified, rationale: "Table 4 gives a direct per-page comparison; operational storage costs depend on indexing and serving choices.", corroborating_sources: []}
