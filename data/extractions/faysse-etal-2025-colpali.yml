    disposition_rationale: "Makes the effectiveness/indexing/storage trade-off explicit without treating embedding size as total infrastructure cost."
  - id: faysse-etal-2025-colpali:online-query-latency
    kind: result
    summary: "Section 5.2 reports approximately 30 ms to encode a query with ColPali's language model versus 22 ms for BGE-M3 on 15 tokens. For smaller corpora, the authors estimate late-interaction overhead at approximately 1 ms per 1,000 pages; the footnote states batch size 1 and an average over 1,000 queries."
    locator: {type: section, value: "§5.2, footnote 12, p. 8", label: "Online query latency"}
    evidence: {kind: reported-performance-measurement, confidence: well-supported, scope: "Authors' query-encoding and late-interaction measurements for the described setup.", assumptions: [], limitations: ["Query encoding and corpus scoring are separate components; do not report 30 ms as complete end-to-end search latency.", "The approximately 1 ms per 1,000 pages is scoped to smaller corpora; million-document scalability is attributed to optimized late-interaction engines rather than measured in this experiment."]}
    technical_assessment: {status: qualified, rationale: "The paper distinguishes encoding latency from late-interaction overhead and qualifies the small-corpus observation.", corroborating_sources: []}
