items:
  - id: faysse-etal-2025-colpali:vision-language-multi-vector-architecture
    kind: architecture
    summary: "ColPali adapts PaliGemma to encode document-page images and text queries as multi-vector representations in a shared 128-dimensional space. Page patch vectors are retained and matched to query token vectors by late interaction rather than collapsed into one document vector."
    locator: {type: section, value: "§4.1, pp. 5-6; Eq. (1)", label: "ColPali architecture and late interaction"}
    evidence: {kind: architecture-and-mathematical-method, confidence: established, scope: "ColPali architecture in the ICLR 2025 paper.", assumptions: [], limitations: ["Retrieval unit is the page, not an exact text span.", "Multi-vector representation increases index storage relative to a single-vector encoder."]}
    technical_assessment: {status: correct, rationale: "The paper defines multi-vector query/page representations and late-interaction scoring.", corroborating_sources: []}
    classification: {primary_theme: inference-efficiency, tags: [topic:visual-document-retrieval, topic:multimodal-rag, method:late-interaction, method:multi-vector], concept_ids: [retrieval-augmented-generation, contextualized-representation]}
    candidate_destinations: {pages: [en/document-retrieval, fr/document-retrieval, en/cosine-similarity, fr/cosine-similarity], concepts: [retrieval-augmented-generation, contextualized-representation], route_ids: []}
    disposition: integrate-by-reference
    disposition_rationale: "Supports the existing visual-document retrieval example; no new concept is necessary."
