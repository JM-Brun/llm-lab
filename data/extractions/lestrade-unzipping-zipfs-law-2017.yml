items:
  - id: lestrade-unzipping-zipfs-law-2017:syntax-class-size
    kind: mechanism
    summary: "The proposed syntactic contribution begins from word classes with very different vocabulary sizes but roughly comparable aggregate use: a small closed class can therefore have high average frequency per type, while a much larger open class spreads comparable use across many more types. In the paper's simulation, syntax/class-size differences alone produce frequency bands but do not align them into a natural-language-like Zipf distribution."
    locator: {type: section, value: "Materials and methods, Syntax; Table 1 and Fig. 2 discussion", label: "Syntax and word-class size"}
    evidence:
      kind: model-description-and-corpus-analysis
      confidence: context-dependent
      scope: "The paper's Dutch, English and Hungarian word-class comparison and syntax-only simulation."
      assumptions: ["The reported class-size and frequency relationships are representative of the selected corpora and annotation schemes."]
      limitations: ["This is one component of the author's proposed explanation; syntax alone is explicitly insufficient in the model."]
    technical_assessment:
      status: not-reviewed
      rationale: "Primary research claim recorded; underlying corpus annotations and simulation not independently reproduced."
      corroborating_sources: []
    pedagogical_profile:
      learner_question: "Why are function words often much more frequent than individual nouns?"
      explanatory_lens: distribution of usage across linguistic classes of unequal size
      teaching_form: [mechanism, comparison, simulation]
      abstraction_level: intermediate
      prerequisites: ["word classes", "frequency counts"]
      distinctive_value: "Makes the aggregate frequency versus number-of-types distinction visible."
      limitations: ["A class-size account alone does not generate the full observed distribution."]
    pedagogical_assessment:
      novelty: {level: high, rationale: "The current Day 01 lesson describes the outcome but does not explain the proposed role of syntactic class sizes."}
      complementarity: {level: high, rationale: "Adds a mechanism-level perspective distinct from the descriptive rank-frequency curve."}
      pedagogical_value: {level: moderate, rationale: "Could help learners reason about why grammatical and lexical words occupy different frequency regimes."}
      applicability: {level: moderate, rationale: "Potential optional model-comparison section; avoid adding causal complexity to the 10-minute core."}
      redundancy: {level: low, rationale: "The syntactic class-size mechanism is not in the existing lesson."}
      evidence_quality: {level: moderate, rationale: "Peer-reviewed model and cross-corpus analysis, but code/data have not been independently checked."}
