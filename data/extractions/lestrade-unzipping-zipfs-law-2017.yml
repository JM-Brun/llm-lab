  - id: lestrade-unzipping-zipfs-law-2017:semantic-specificity-reusability
    kind: mechanism
    summary: "The semantic component proposes that words become reusable when they are specific enough to distinguish a referent in context but general enough to apply across multiple referents. The paper uses lexical taxonomy depth as an initial proxy and then a computational representation of semantic dimensions; neither extreme generality nor extreme specificity is predicted to maximize frequency."
    locator: {type: section, value: "Materials and methods, Semantics; Fig. 3 and following model description", label: "Semantic specificity"}
    evidence:
      kind: model-description-and-corpus-analysis
      confidence: context-dependent
      scope: "The WordNet/Brown-corpus analysis and the paper's simulated semantic lexicon."
      assumptions: ["Taxonomy depth is treated as an initial proxy for semantic specificity; the later simulation operationalizes semantics differently."]
      limitations: ["The semantic representation is not equivalent to modern distributional word embeddings; the author explicitly distinguishes these approaches."]
    technical_assessment:
      status: not-reviewed
      rationale: "Model interpretation recorded; semantic operationalization and corpus analyses not independently replicated."
      corroborating_sources: []
    pedagogical_profile:
      learner_question: "Why might neither very general nor very specific words be maximally frequent?"
      explanatory_lens: trade-off between distinctiveness and reusability
      teaching_form: [mental-model, example, model-description]
      abstraction_level: intermediate
      prerequisites: ["referent", "semantic category", "ambiguity"]
      distinctive_value: "Offers a bounded semantic intuition: a word must distinguish enough without becoming unusably narrow."
      limitations: ["The proposed account is not established as the unique or complete cause of Zipf's law."]
    pedagogical_assessment:
      novelty: {level: high, rationale: "This explanatory trade-off is absent from the current introductory lesson."}
      complementarity: {level: high, rationale: "It provides a semantic mechanism that can be contrasted with purely statistical explanations."}
      pedagogical_value: {level: moderate, rationale: "May make the proposed mechanism intuitive, provided its status as a hypothesis remains explicit."}
      applicability: {level: moderate, rationale: "Suitable for optional depth or a model-comparison exercise."}
      redundancy: {level: low, rationale: "No comparable semantic specificity/reusability model appears in Day 01."}
      evidence_quality: {level: moderate, rationale: "The source offers empirical proxies and a computational model, but no independent reproduction is included here."}
