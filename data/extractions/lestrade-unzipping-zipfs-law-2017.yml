  - id: lestrade-unzipping-zipfs-law-2017:joint-model-and-non-consensus
    kind: limitation
    summary: "The paper reports that its combined syntax-and-semantics model produces a near-Zipfian distribution while either ingredient alone does not. The author nevertheless states that the origins of Zipf's law remain elusive; the result is a proposed linguistically motivated account, not a settled explanation."
    locator: {type: section, value: "Abstract and Conclusion", label: "Scope of the proposed explanation"}
