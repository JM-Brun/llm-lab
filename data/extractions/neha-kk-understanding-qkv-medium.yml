      teaching_form: [analogy, mental-model]
      abstraction_level: introductory
      prerequisites: [token, embedding]
      distinctive_value: "Frames Q/K as the matching interface and V as the retrieved payload."
      limitations: ["The mapping is functional, not literal; attention combines values rather than selecting one database record."]
    pedagogical_assessment:
      novelty: {level: low, rationale: "The current bilingual lesson already uses index cards and explicitly distinguishes comparison from aggregation."}
      complementarity: {level: moderate, rationale: "A database-search setting is a familiar alternative framing, but its mapping substantially overlaps the existing index-card analogy."}
      pedagogical_value: {level: low, rationale: "It does not resolve a learner difficulty not already addressed by the current bounded analogy."}
