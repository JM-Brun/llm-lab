  - id: neha-kk-understanding-qkv-medium:role-decoupling
    kind: mechanism
    summary: "Separate learned projections let matching information (Q and K) differ from the payload representation (V), so the same input position can participate in contextual matching and contribute a distinct vector to the output."
    pedagogical_assessment:
      novelty: {level: low, rationale: "The canonical Q/K/V lesson already distinguishes weight computation from value aggregation."}
      complementarity: {level: moderate, rationale: "The article foregrounds the design rationale for three projections rather than introducing them only by definition."}
      pedagogical_value: {level: moderate, rationale: "The 'why three?' question can motivate the existing role distinction for learners who see Q/K/V as redundant copies."}
      applicability: {level: moderate, rationale: "The rationale can be folded into the existing explanation without adding a separate section."}
      redundancy: {level: moderate, rationale: "The idea is implicit in the current page but the explicit design-motivation framing is useful."}
      evidence_quality: {level: moderate, rationale: "Conceptually sound secondary explanation; it does not provide an empirical demonstration."}
    pedagogical_profile:
      learner_question: "Why not use one representation for both matching and information transfer?"
      explanatory_lens: functional-decomposition
      teaching_form: [conceptual-explanation, contrast]
      abstraction_level: introductory
      prerequisites: [query, key, value]
      distinctive_value: "Explains the benefit of separating the matching interface from the content payload."
      limitations: ["The article does not quantify the benefit or prove that three separate projections are uniquely optimal."]
    locator: {type: section, value: "118–119", label: "Why Q, K, and V Are So Powerful"}
    evidence: {kind: conceptual-claim, confidence: well-supported, scope: "Rationale for separate learned projections.", assumptions: ["Standard attention mechanism."], limitations: ["Does not establish that all attention architectures use exactly these three separately parameterized projections."]}
