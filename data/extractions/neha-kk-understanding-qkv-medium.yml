  - id: neha-kk-understanding-qkv-medium:soft-retrieval-not-hard-selection
    kind: misconception
    summary: "The article says the closest query-key matches determine which values to get. This is a useful search intuition but risks suggesting hard nearest-neighbour retrieval. In the displayed scaled-dot-product formulation, softmax weights all accessible values and the output is their weighted sum; it is not generally a single argmax-selected value."
    pedagogical_profile:
      learner_question: "Does attention select the single best-matching token or combine information from several positions?"
      explanatory_lens: retrieval-versus-mixture
      teaching_form: [misconception-check, contrast]
      abstraction_level: introductory
      prerequisites: [attention-score, attention-weight, softmax, value]
      distinctive_value: "Makes the distinction between ranking candidates and aggregating a soft weighted mixture explicit."
      limitations: ["The source's subsequent weighted-sum equation does describe aggregation; the risk arises from its earlier 'closest matches determine which values to get' wording."]
    pedagogical_assessment:
      novelty: {level: low, rationale: "The canonical attention lesson already explains weighted aggregation and rejects winner-take-all interpretations."}
      complementarity: {level: moderate, rationale: "This source supplies a concrete wording example that can motivate the project's existing hard-selection misconception check."}
      pedagogical_value: {level: moderate, rationale: "It helps prevent learners from interpreting the database/search analogy as discrete retrieval."}
      applicability: {level: moderate, rationale: "Useful as a source-linked misconception in the audit; no additional page text is needed because the existing lesson already covers it."}
      redundancy: {level: high, rationale: "The correction is already represented in the canonical attention lesson."}
