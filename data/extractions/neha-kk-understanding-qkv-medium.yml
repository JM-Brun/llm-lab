  - id: neha-kk-understanding-qkv-medium:attention-map-interpretability
    kind: misconception
    summary: "The article suggests attention maps provide interpretability by showing which tokens influence a model's decisions. This formulation overstates what attention weights establish: they visualize a conditional weighting pattern, not causal influence or a complete explanation of a prediction."
    pedagogical_assessment:
      novelty: {level: low, rationale: "The project's attention lesson already explicitly rejects causal and semantic overinterpretation of attention weights."}
      complementarity: {level: moderate, rationale: "The source provides a useful example of a common introductory overclaim that can be checked against the project's existing fallacy treatment."}
      pedagogical_value: {level: moderate, rationale: "It reinforces the distinction between visualization and explanation."}
      applicability: {level: moderate, rationale: "Retain in the extraction and link to the existing attention-weight fallacy; no additional page content is necessary."}
      redundancy: {level: high, rationale: "The correction is already directly covered in the scaled dot-product attention lesson."}
      evidence_quality: {level: high, rationale: "The source's own claim can be directly inspected and contrasted with the existing technically qualified treatment."}
    locator: {type: section, value: "Why Q, K, and V Are So Powerful", label: "Why Q, K, and V Are So Powerful"}
    evidence: {kind: claim-and-correction, confidence: well-supported, scope: "Claim about interpretability from attention maps.", assumptions: ["Attention maps expose weights from a particular layer/head and input."], limitations: ["The source does not define interpretability or provide an evaluation protocol."]}
    classification: {primary_theme: architectures-mechanisms, tags: [topic:attention-weight, method:interpretability], concept_ids: [attention-weight, scaled-dot-product-attention]}
    candidate_destinations: {pages: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention], concepts: [attention-weight]}
    disposition: clarify
    disposition_rationale: "No change required: the existing bilingual fallacy already explains why attention weights do not establish causal importance. Record this article claim as an example of the overstatement the lesson guards against."

  - id: neha-kk-understanding-qkv-medium:parallelism-claim
    kind: limitation
    summary: "The article contrasts sequential RNN/LSTM processing with Transformers processing all words simultaneously and attributes efficiency to parallel computation. This is an oversimplification: parallelism applies to sequence positions during training/full-sequence forward passes, while causal autoregressive generation proceeds token by token and uses a causal mask."
    pedagogical_assessment:
      novelty: {level: low, rationale: "The source introduces no detailed parallel-computation analysis."}
      complementarity: {level: moderate, rationale: "It exposes a frequent introductory simplification that can be useful as a review checkpoint."}
      pedagogical_value: {level: moderate, rationale: "Learners may otherwise infer that a causal decoder can use future tokens or generate every output position simultaneously."}
      applicability: {level: moderate, rationale: "The distinction belongs in the architecture/generation lessons; this article does not provide enough detail to warrant editing them."}
      redundancy: {level: moderate, rationale: "The project treats causal masking and autoregressive generation elsewhere."}
      evidence_quality: {level: high, rationale: "The oversimplification is directly present in the article and can be checked against the canonical architecture."}
    locator: {type: section, value: "Why Attention Exists in the First Place", label: "Why Attention Exists in the First Place"}
    evidence: {kind: limitation, confidence: well-supported, scope: "High-level comparison between recurrent and Transformer processing.", assumptions: ["Standard Transformer training and decoder-only autoregressive inference."], limitations: ["The article does not distinguish training parallelism from generation-time dependencies."]}
    classification: {primary_theme: architectures-mechanisms, tags: [topic:transformer, method:parallel-computation], concept_ids: [self-attention]}
    candidate_destinations: {pages: [fr/transformer, en/transformer, fr/causal-masking, en/causal-masking], concepts: [self-attention]}
    disposition: link
    disposition_rationale: "Preserve the correction in this audit; rely on existing architecture and causal-mask lessons rather than expanding the Q/K/V lesson beyond its scope."

  - id: neha-kk-understanding-qkv-medium:projection-input-qualification
    kind: limitation
    summary: "The article describes token embeddings as compact vectors reflecting semantic meaning and presents them as the shared input to Q/K/V. This is a first-layer intuition, not a general layer-level description: embeddings are learned vectors rather than explicit semantic feature lists, the attention sublayer receives its current input representation, and deeper layers project hidden states that may already be contextualized. Positional information is also absent from the article's account."
    pedagogical_assessment:
      novelty: {level: low, rationale: "The canonical lesson already correctly calls X a representation stream rather than raw word embeddings."}
      complementarity: {level: moderate, rationale: "It identifies why the project's more precise wording matters for deeper layers."}
      pedagogical_value: {level: moderate, rationale: "It can prevent learners from assuming every attention layer reprojects the original static embedding."}
      applicability: {level: moderate, rationale: "A concise clarification in the Q/K/V lesson can connect the current hidden-state input to the positional mechanisms introduced on the preceding architecture path."}
      redundancy: {level: moderate, rationale: "The current representation stream was already named, but the interaction with positional mechanisms was not explicit on the Q/K/V page."}
      evidence_quality: {level: high, rationale: "Direct comparison between article wording and the general Transformer computation."}
    locator: {type: section, value: "The Basis: Word Embeddings / Getting Q, K, and V", label: "The Basis: Word Embeddings / Getting Q, K, and V"}
    evidence: {kind: technical-limitation, confidence: well-supported, scope: "Input representation to the Q/K/V projections.", assumptions: ["A multi-layer Transformer in which attention receives current hidden states."], limitations: ["The article's introductory simplification is not necessarily false for the first attention layer.", "The article does not explain how positional information enters the representation or attention computation.", "The phrase 'reflects semantic meaning' should not be read as a coordinate-wise semantic interpretation."]}
    classification: {primary_theme: architectures-mechanisms, tags: [topic:qkv, method:learned-linear-projection], concept_ids: [query, key, value]}
    candidate_destinations: {pages: [fr/queries-keys-values, en/queries-keys-values], concepts: [query, key, value]}
    disposition: clarify
    disposition_rationale: "Clarify locally that X is the current input to the attention sublayer, not always a raw token embedding, and distinguish input-level positional embeddings from attention-internal mechanisms such as RoPE."

