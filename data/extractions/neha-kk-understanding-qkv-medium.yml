  pedagogical_strengths:
    - "Accessible database-search framing makes the matching-versus-payload distinction concrete."
    - "The article places the question 'why three representations?' before the equations, explicitly motivating role decoupling."
    - "The pronoun example connects the mechanism to a familiar contextual-language problem."
    - "The four-step computation sequence is easy to scan and gives a first-pass overview."
    - "The article signals that the same general mechanism appears beyond text, including vision, speech and multimodal systems."
  pedagogical_limits:
    - "The database analogy can suggest exact lookup or nearest-neighbour retrieval; actual attention computes learned compatibility scores and a weighted sum over accessible values."
    - "The article says Transformers inspect all words simultaneously without qualifying causal masks or the distinction between parallel training computation and incremental autoregressive generation."
    - "The pronoun example asserts that scores favour 'animal' without providing model, head, weights, experiment or evidence; it is an intuition, not a demonstrated coreference result."
    - "The claim that attention maps provide interpretability is too broad: weights alone do not establish causal importance or explain a prediction."
    - "The scaling rationale is stated qualitatively; variance assumptions and the relationship to softmax concentration/gradients are not derived."
    - "The formula omits masking and does not distinguish self-attention from cross-attention."
    - "The input is called a word embedding; in deeper Transformer layers Q/K/V are projected from the current hidden representations, not necessarily the original token embedding."
    - "The article describes an embedding as a compact vector reflecting semantic meaning, which is a useful simplification but can suggest that embedding coordinates are explicit semantic features. Token embeddings are learned parameters; positional information and contextual processing are also needed to form the representations used by attention."
    - "No numerical worked example, tensor shapes, multi-head decomposition, implementation, exercise or explicit assessment is provided."
    - "The indexed snapshot exposes four in-body image placements, but none of the actual images can be visually inspected or evaluated."
    - "The phrase that closest query-key matches determine which values to get risks implying hard top-1 retrieval; the subsequent weighted-sum formula instead describes a soft mixture over accessible value vectors."
    - "The article calls attention directional and non-symmetric without showing a matrix example or qualifying that asymmetry is typical rather than universal for every possible parameter/input configuration."
