  - id: neha-kk-understanding-qkv-medium:database-search-analogy
    kind: analogy
    summary: "The article compares attention to searching a database: a query expresses what is sought, keys describe candidate items, and values carry the information returned. The analogy separates matching from payload, but does not describe exact lookup, literal labels or a nearest-neighbour algorithm."
    pedagogical_profile:
      learner_question: "Why are query, key and value separate representations?"
      explanatory_lens: information-retrieval
      teaching_form: [analogy, mental-model]
      abstraction_level: introductory
      prerequisites: [token, embedding]
      distinctive_value: "Frames Q/K as the matching interface and V as the retrieved payload."
      limitations: ["The mapping is functional, not literal; attention combines values rather than selecting one database record."]
    pedagogical_assessment:
      novelty: {level: low, rationale: "The current bilingual lesson already uses index cards and explicitly distinguishes comparison from aggregation."}
      complementarity: {level: moderate, rationale: "A database-search setting is a familiar alternative framing, but its mapping substantially overlaps the existing index-card analogy."}
      pedagogical_value: {level: low, rationale: "It does not resolve a learner difficulty not already addressed by the current bounded analogy."}
      applicability: {level: moderate, rationale: "Useful as an optional comparison in the source catalogue, not as a second core analogy on the lesson page."}
      redundancy: {level: high, rationale: "Same explanatory function and same Q/K matching versus V payload distinction as the current analogy."}
      evidence_quality: {level: moderate, rationale: "The analogy is clearly stated but is pedagogical framing rather than technical evidence."}
    locator: {type: section, value: "The Core Intuition—A Database Search Analogy", label: "Database-search analogy"}
    evidence:
      kind: pedagogical-explanation
      confidence: well-supported
      scope: "The author's stated analogy for the functional roles of Q, K and V."
      assumptions: ["The target is standard attention with learned Q/K/V representations."]
      limitations: ["The analogy must not be interpreted as exact lookup or selection of one record."]
    classification: {primary_theme: architectures-mechanisms, tags: [topic:qkv, method:information-retrieval-analogy], concept_ids: [query, key, value, self-attention]}
    candidate_destinations: {pages: [fr/queries-keys-values, en/queries-keys-values], concepts: [query, key, value]}
    disposition: reject
    disposition_rationale: "Retain as an alternative perspective in the extraction record; do not stack it beside the existing index-card analogy because the learner function is substantially the same."

  - id: neha-kk-understanding-qkv-medium:role-decoupling
    kind: mechanism
    summary: "Separate learned projections let matching information (Q and K) differ from the payload representation (V), so the same input position can participate in contextual matching and contribute a distinct vector to the output."
    pedagogical_assessment:
      novelty: {level: low, rationale: "The canonical Q/K/V lesson already distinguishes weight computation from value aggregation."}
      complementarity: {level: moderate, rationale: "The article foregrounds the design rationale for three projections rather than introducing them only by definition."}
      pedagogical_value: {level: moderate, rationale: "The 'why three?' question can motivate the existing role distinction for learners who see Q/K/V as redundant copies."}
      applicability: {level: moderate, rationale: "The rationale can be folded into the existing explanation without adding a separate section."}
      redundancy: {level: moderate, rationale: "The idea is implicit in the current page but the explicit design-motivation framing is useful."}
      evidence_quality: {level: moderate, rationale: "Conceptually sound secondary explanation; it does not provide an empirical demonstration."}
    pedagogical_profile:
      learner_question: "Why not use one representation for both matching and information transfer?"
      explanatory_lens: functional-decomposition
      teaching_form: [conceptual-explanation, contrast]
      abstraction_level: introductory
      prerequisites: [query, key, value]
      distinctive_value: "Explains the benefit of separating the matching interface from the content payload."
      limitations: ["The article does not quantify the benefit or prove that three separate projections are uniquely optimal."]
    locator: {type: section, value: "Why Three Representations Instead of One?", label: "Why Q, K, and V Are So Powerful"}
    evidence: {kind: conceptual-claim, confidence: well-supported, scope: "Rationale for separate learned projections.", assumptions: ["Standard attention mechanism."], limitations: ["Does not establish that all attention architectures use exactly these three separately parameterized projections."]}
    classification: {primary_theme: architectures-mechanisms, tags: [topic:qkv], concept_ids: [query, key, value, self-attention]}
    candidate_destinations: {pages: [fr/queries-keys-values, en/queries-keys-values], concepts: [query, key, value]}
    disposition: clarify
    disposition_rationale: "Use as a brief motivation for role decoupling within the existing lesson, not as a new concept or new page."

