  - id: neha-kk-understanding-qkv-medium:parallelism-claim
    kind: limitation
    summary: "The article contrasts sequential RNN/LSTM processing with Transformers processing all words simultaneously and attributes efficiency to parallel computation. This is an oversimplification: parallelism applies to sequence positions during training/full-sequence forward passes, while causal autoregressive generation proceeds token by token and uses a causal mask."
    pedagogical_assessment:
      novelty: {level: low, rationale: "The source introduces no detailed parallel-computation analysis."}
      complementarity: {level: moderate, rationale: "It exposes a frequent introductory simplification that can be useful as a review checkpoint."}
      pedagogical_value: {level: moderate, rationale: "Learners may otherwise infer that a causal decoder can use future tokens or generate every output position simultaneously."}
      applicability: {level: moderate, rationale: "The distinction belongs in the architecture/generation lessons; this article does not provide enough detail to warrant editing them."}
      redundancy: {level: moderate, rationale: "The project treats causal masking and autoregressive generation elsewhere."}
      evidence_quality: {level: high, rationale: "The oversimplification is directly present in the article and can be checked against the canonical architecture."}
    locator: {type: section, value: "52–61", label: "Why Attention Exists in the First Place"}
    evidence: {kind: limitation, confidence: well-supported, scope: "High-level comparison between recurrent and Transformer processing.", assumptions: ["Standard Transformer training and decoder-only autoregressive inference."], limitations: ["The article does not distinguish training parallelism from generation-time dependencies."]}
