schema_version: 1
source_id: sebastian-raschka-understanding-positional-embeddings-2026
pedagogical_model:
  reconstruction:
    status: partial
    basis:
      - "Complete article body and figure captions inspected on 2026-11-16; sections 1–7 and the article's equations and PyTorch snippets were reviewed."
      - "The article explicitly presents a progression from absolute and sinusoidal position vectors to RoPE mechanics, implementation, and architecture comparisons."
    limitations:
      - "The 38 figure assets were not individually downloaded or visually inspected; the graph reflects figure captions and their placement."
      - "The linked Qwen3 notebook was not independently audited or executed."
      - "Some architecture comparisons and model examples are author-curated snapshots and may change with model revisions."
  source_graph:
    nodes:
      - {id: src-token-order, kind: problem, description: "Token sequences have order that content embeddings alone do not explicitly identify.", locator: "Introduction"}
      - {id: src-token-embedding, kind: representation, description: "Vector representation of token identity before positional information is added.", locator: "§§1–2"}
      - {id: src-absolute-position, kind: representation, description: "Learned absolute position vector added to token embeddings in early GPT models.", locator: "§2"}
      - {id: src-sinusoidal-position, kind: representation, description: "Fixed sinusoidal vector added at the input in the original Transformer.", locator: "§2"}
      - {id: src-query-key, kind: representation, description: "Projected query and key vectors whose dot product determines attention scores.", locator: "§3"}
      - {id: src-rotary-pair, kind: operation, description: "Two-dimensional rotation applied to paired query/key features at a position.", locator: "§3"}
      - {id: src-frequency-schedule, kind: parameterization, description: "Geometrically spaced inverse frequencies define the rotation angle of each feature pair.", locator: "§4"}
      - {id: src-relative-offset, kind: property, description: "The rotated QK contribution depends on the relative position offset for fixed content vectors and frequency.", locator: "§3"}
      - {id: src-rope-cache, kind: implementation, description: "Precomputed cosine and sine values indexed by position and rotary feature pair.", locator: "§5"}
      - {id: src-pairing-layout, kind: implementation-choice, description: "Interleaved and split-half layouts assign coordinates to rotation pairs.", locator: "§5"}
      - {id: src-partial-rope, kind: architectural-variant, description: "Only a subset of each attention head's dimensions undergoes rotary transformation.", locator: "§6.1"}
      - {id: src-nope-layer, kind: architectural-variant, description: "A layer omits explicit positional transformations while retaining the causal attention structure.", locator: "§6.2"}
      - {id: src-causal-prefix, kind: mechanism, description: "Nested causal prefixes can expose implicit order information without an explicit position vector.", locator: "§6.2"}
      - {id: src-relative-bias, kind: mechanism, description: "A learned relative-position term is added to attention scores before softmax.", locator: "§6.3"}
      - {id: src-hybrid-layers, kind: architecture, description: "A model mixes layers that use RoPE with layers that omit it.", locator: "§6.4"}
      - {id: src-qwen3-implementation, kind: worked-implementation, description: "A from-scratch PyTorch Qwen3 implementation connects RoPE equations to a full model.", locator: "§5; linked notebook"}
