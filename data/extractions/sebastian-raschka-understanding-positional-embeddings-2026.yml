      - {from: src-hybrid-layers, type: combines, to: src-nope-layer}
      - {from: src-qwen3-implementation, type: implements, to: src-rotary-pair}
    interpretation: "Editorial reconstruction of the article's explanatory and architectural model, not a formal ontology authored by the source. The edges summarize the article's technical account; they do not assert that its architecture examples are exhaustive."
  learning_outcomes:
    - {status: inferred, outcome: "Distinguish learned absolute, fixed sinusoidal and rotary positional mechanisms by where they enter the Transformer computation.", basis: "Historical comparison in §§1–3."}
    - {status: inferred, outcome: "Explain how pairwise rotations of Q and K create a relative-offset effect in attention scores.", basis: "RoPE derivation in §3."}
    - {status: inferred, outcome: "Implement the RoPE frequency schedule and cosine/sine tables while respecting tensor shapes and feature-pair conventions.", basis: "PyTorch walkthrough in §5."}
    - {status: inferred, outcome: "Compare partial RoPE, NoPE, learned relative bias and hybrid layer designs without treating them as equivalent.", basis: "Architecture comparison in §6."}
  assumed_prerequisites:
    - {status: inferred, topic: "Vectors, dot products, sine/cosine and 2D rotations.", basis: "RoPE is derived through paired coordinate rotations."}
    - {status: inferred, topic: "Transformer self-attention and query/key/value projections.", basis: "The article places RoPE inside the Q/K attention path."}
    - {status: inferred, topic: "Basic PyTorch tensors, broadcasting and indexing.", basis: "The implementation section constructs and applies frequency tables."}
  teaching_route:
    - {order: 1, section: "Introduction and positional motivation", function: motivate-order-information, moves: ["Explain why token order matters", "Separate content identity from position"]}
    - {order: 2, section: "Absolute and sinusoidal positional vectors", function: establish-historical-baselines, moves: ["Compare learned GPT position vectors", "Explain fixed sinusoidal vectors"]}
    - {order: 3, section: "RoPE geometry", function: derive-relative-position-mechanism, moves: ["Rotate one feature pair", "Extend to multiple frequencies", "Connect rotations to relative offsets in QK scores"]}
    - {order: 4, section: "Frequency schedule", function: connect-math-to-parameterization, moves: ["Derive inverse frequencies", "Relate position to rotation angle"]}
    - {order: 5, section: "PyTorch and Qwen3 implementation", function: operationalize-equations, moves: ["Build cosine/sine tables", "Handle feature-pair conventions", "Apply RoPE to Q and K"]}
    - {order: 6, section: "Modern architecture variants", function: compare-design-alternatives, moves: ["Introduce partial RoPE", "Explain NoPE and implicit causal order", "Compare learned relative bias and hybrid layers"]}
    - {order: 7, section: "Conclusion and architecture comparison", function: consolidate-and-qualify, moves: ["Summarize trade-offs", "Separate observed model examples from universal claims"]}
  pedagogical_strengths:
    - "Moves from intuitive token order to geometric derivation, tensor implementation and architecture-level design."
    - "Uses diagrams and a from-scratch PyTorch implementation to connect equations with operational code."
    - "Explains implementation details such as feature-pairing layouts and Q/K placement that are easy to overlook."
    - "Compares modern alternatives instead of treating full RoPE as the only positional design."
  pedagogical_limits:
    - "The architecture gallery is curated and time-sensitive; it is not a representative census."
    - "Some claims about NoPE length generalization depend on specific experiments and should be checked against primary studies."
    - "The article's visual assets were not individually inspected in this source audit."
    - "The linked end-to-end Qwen3 implementation was not executed as part of this ingestion."
  comparison:
    dossier: docs/source-reviews/raschka-positional-embeddings-2026-11.md
    canonical_graph: data/concepts.yml
    canonical_routes: [data/guided-route.yml, docs/learning-path.md]
    decision: "Extend the existing bilingual RoPE deep dives rather than create a second positional-encoding introduction. Reuse the source's technical progression as a comparison lens, but keep its source-local teaching graph separate from the canonical concept graph."
