items:
  - id: the-ai-edge-how-flashattention-speeds-up-llm-attention:function-versus-kernel
    kind: claim
    summary: "The attention function specifies the mathematical mapping from Q, K and V under a mask; a kernel specifies how hardware executes that mapping. Kernel optimization need not redefine the function."
    locator: {type: section, value: "Introduction, paragraphs 1–3", label: "Attention function and execution kernel"}
    evidence:
      kind: direct-explanation
      confidence: well-supported
      scope: "The accessible introduction distinguishes the attention computation from the execution strategy."
      assumptions: ["The standard masked scaled-dot-product attention operation is assumed."]
      limitations: ["Exactness is mathematical equivalence subject to floating-point effects, not universal bitwise identity."]
    disposition: integrate
  - id: the-ai-edge-how-flashattention-speeds-up-llm-attention:exact-versus-sparse
    kind: misconception
    summary: "Exact FlashAttention preserves allowed attention connectivity while changing intermediate storage and data movement; sparse attention changes participating position pairs."
    locator: {type: section, value: "Introduction, paragraphs 3–4", label: "Exact attention versus sparse attention"}
    evidence:
      kind: conceptual-distinction
      confidence: established
      scope: "The accessible excerpt distinguishes exact FlashAttention from sparse attention; the primary paper confirms the exact IO-aware algorithm."
      assumptions: ["The claim concerns the exact dense FlashAttention algorithm, not its separate block-sparse extension."]
      limitations: ["The original paper also discusses a separate block-sparse extension; do not conflate it with exact dense FlashAttention."]
    disposition: integrate
  - id: the-ai-edge-how-flashattention-speeds-up-llm-attention:online-softmax
    kind: mechanism
    summary: "Tiled attention merges per-tile maxima, exponential sums and weighted-value accumulators with rescaling, preserving global softmax normalization without retaining all scores simultaneously."
    locator: {type: section, value: "Running-state explanation", label: "Online normalization across tiles"}
    evidence:
      kind: synthesis
      confidence: established
      scope: "The excerpt motivates the running state; the recurrence is reconciled with the primary FlashAttention and FlashAttention-2 papers."
      assumptions: ["Per-tile statistics are merged using a common running maximum and exponential rescaling."]
      limitations: ["Masks, dropout, dtype and backward details require primary algorithm and kernel documentation."]
    disposition: integrate
  - id: the-ai-edge-how-flashattention-speeds-up-llm-attention:io-not-compute-elimination
    kind: limitation
    summary: "FlashAttention primarily reduces IO and intermediate materialization; dense attention still performs pairwise query-key interactions and retains quadratic arithmetic in sequence length."
    locator: {type: external-source, value: "Dao et al. 2022, abstract and IO analysis", label: "IO complexity and dense attention"}
    evidence:
      kind: primary-paper
      confidence: established
      scope: "The original paper describes IO-aware tiling and its effect on data movement for exact dense attention."
      assumptions: ["The comparison is with conventional materialized dense attention under the paper's memory model."]
      limitations: ["IO complexity is not a universal wall-clock prediction."]
    disposition: integrate
  - id: the-ai-edge-how-flashattention-speeds-up-llm-attention:backend-dispatch
    kind: limitation
    summary: "PyTorch SDPA selects among eligible backends; invoking the API does not establish that a FlashAttention kernel was selected."
    locator: {type: external-source, value: "PyTorch scaled_dot_product_attention documentation", label: "SDPA backend dispatch"}
    evidence:
      kind: official-documentation
      confidence: established
      scope: "The official API documentation describes backend selection and constraints."
      assumptions: ["Backend selection is conditional on the actual runtime inputs and environment."]
      limitations: ["Eligibility and defaults vary by version, device, dtype, shape and mask."]
    disposition: integrate
