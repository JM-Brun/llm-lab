    dossier: docs/source-reviews/jay-joshi-transformer-mathematics-attention-2026-11.md
    canonical_graph: "data/concepts.yml and data/computational-graph.yml"
    canonical_routes: [data/guided-route.yml, docs/learning-path.md, "Page-level suggested_route metadata and Build route"]
