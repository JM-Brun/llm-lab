  assumed_prerequisites:
    - {status: inferred, topic: "Matrix multiplication, transposition and tensor shapes.", basis: "The attention equation and [1, 3, 3] tensor example."}
    - {status: inferred, topic: "Dot products, vector norms, angles and elementary 3D geometry.", basis: "The geometric interpretation of Q/K alignment and value mixing."}
    - {status: inferred, topic: "Softmax and weighted sums.", basis: "The transition from scaled scores to attention weights and context vectors."}
  teaching_route:
    - {order: 1, section: "Stage 1 — Q/K/V projections", function: "separate learned representational roles", moves: ["Start from the same position-encoded input X", "Apply three distinct learned linear maps", "Interpret Q, K and V as separate learned views rather than literal semantic labels"]}
    - {order: 2, section: "Stage 2 — alignment and softmax", function: "turn pairwise compatibility into normalized weights", moves: ["Compare each query with keys using dot products", "Scale by the square root of the key dimension", "Apply row-wise softmax and inspect the attention matrix"]}
    - {order: 3, section: "Stage 3 — value aggregation", function: "interpret the weighted sum geometrically", moves: ["Use attention weights to combine value vectors", "Interpret each result as a convex combination", "Visualize the result relative to the convex hull of the values"]}
    - {order: 4, section: "Stage 4 — output projection", function: "map the aggregated representation to the module output space", moves: ["Apply the learned output projection W_o", "Relate its output to the residual stream and, in multi-head attention, head combination"]}
  pedagogical_strengths:
    - "The four-stage decomposition gives a compact end-to-end view of the standard attention calculation."
    - "A common small input shape is carried across the stages, helping learners connect equations to tensor operations."
    - "The geometric treatment of the weighted value sum provides a useful bridge from softmax weights to convex combinations."
    - "The source explicitly connects the attention output to the later residual connection, rather than treating W_o as an isolated matrix multiplication."
  pedagogical_limits:
    - "The article's actual figures, code cells and numeric matrices could not be directly inspected or executed; the advertised hand-checkability and visual fidelity remain unverified."
    - "A dot product is not determined by angle alone: q^T k = ||q|| ||k|| cos(theta). A zero dot product means orthogonality, not general semantic unrelatedness."
    - "A negative query-key score is not itself a negative attention weight. Softmax weights are positive; a negative score only lowers a position's relative weight compared with other scores."
    - "Large logits can make softmax distributions highly concentrated and can reduce useful gradients in saturated regimes, but the article's claim that gradients simply vanish as dimensions grow is too categorical without assumptions and a derivation."
    - "A weighted sum with nonnegative coefficients summing to one lies in the convex hull of the values. Calling this set a convex cone or wedge is imprecise; the convex hull and the cone generated by the vectors are not generally the same set."
    - "A general learned W_o is a linear projection/mixing map to the model output dimension; it is not necessarily a rotation or an inverse that reconstructs the original residual coordinates."
    - "The article introduces a [1, 3, 3] tensor and 3x3 projections, but its single-head example does not demonstrate cross-head mixing. W_o's head-mixing role applies to the concatenated multi-head output in the standard multi-head construction."
    - "The text alternates between W_q(X) and PyTorch-style linear layers without making the row-vector/right-multiplication convention explicit in the inspected snapshot."
    - "The discussion of self-attention does not develop causal masking, cross-attention, multi-head tensor reshaping, gradients or implementation edge cases; these are not inferred from the article's teaser for later parts."
