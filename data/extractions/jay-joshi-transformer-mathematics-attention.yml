  - id: jay-joshi-transformer-mathematics-attention:dot-product-geometry
    kind: claim
    summary: "The article interprets query-key dot products through the angle between 3D vectors: acute alignment gives a positive score, orthogonality gives zero, and obtuse alignment gives a negative score."
    locator: {type: section, value: "Stage 2: Angular Alignment & The Softmax Heatmap", label: "Stage 2"}
    evidence:
      kind: mathematical-formulation
      confidence: context-dependent
      scope: "The sign relationship follows from the dot-product identity, but magnitude also depends on both vector norms."
      assumptions: ["The vectors are nonzero and compared using the Euclidean inner product."]
      limitations: ["Angle alone does not determine the score magnitude.", "A negative score is not a negative softmax weight or a hard suppression; softmax weights remain positive.", "Orthogonality is a geometric relation, not proof of semantic unrelatedness."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [mathematical-tools-geometry]
      tags: [topic:attention-score, method:dot-product]
      concept_ids: [attention-score, query, key]
    candidate_destinations:
      pages: [fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
      concepts: [attention-score, query, key]
    pedagogical_profile:
      learner_question: "What does a query-key dot product measure geometrically?"
      explanatory_lens: geometric
      teaching_form: [mental-model, visualization]
      abstraction_level: introductory
      prerequisites: [dot-product, vector-norm, angle]
      distinctive_value: "The angle view gives a visual interpretation of score sign."
      limitations: ["It risks suggesting that attention uses cosine similarity or that negative scores eliminate a key."]
    pedagogical_assessment:
      novelty: {level: low, rationale: "The current Q/K/V page already gives the dot-product identity and explicitly warns that norms matter; the attention page already explains relative softmax weights."}
      complementarity: {level: moderate, rationale: "A well-designed visual could reinforce the identity, but no visual could be assessed from this retrieval."}
      pedagogical_value: {level: moderate, rationale: "The distinction between angle, norm and score sign is useful, but already present in the canonical explanation."}
      applicability: {level: low, rationale: "No missing explanatory step was identified in the existing pages."}
      redundancy: {level: high, rationale: "The mathematical distinction is already explicitly taught."}
      evidence_quality: {level: moderate, rationale: "The prose is visible, but the panel that supposedly demonstrates it is not."}
    disposition: already-covered
    disposition_rationale: "Do not add another angular explanation. Preserve the canonical caveat that dot products depend on norms as well as angle, and that softmax weights are nonnegative."

