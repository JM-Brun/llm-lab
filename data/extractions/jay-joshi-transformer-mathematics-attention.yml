  - id: jay-joshi-transformer-mathematics-attention:convex-value-aggregation
    kind: claim
    summary: "The article correctly identifies the softmax-weighted sum of value vectors as a convex combination, but describes its location as a 'convex cone' or 'wedge'. The precise general set is the convex hull of the accessible value vectors."
    locator: {type: section, value: "Stage 3: The 'Convex Cone' of Value Blending (Panel 3)", label: "Stage 3"}
    evidence:
      kind: mathematical-formulation
      confidence: established
      scope: "For a row with at least one accessible key, softmax weights are nonnegative and sum to one; their weighted sum therefore lies in the convex hull of the corresponding values."
      assumptions: ["The aggregation is before W_o, residual addition or any subsequent transformation.", "The row has at least one accessible key."]
      limitations: ["The convex hull is generally not the same as the convex cone generated by the values.", "The output projection can map the context outside the original convex hull."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [mathematical-tools-geometry]
      tags: [topic:attention-output, method:convex-combination]
      concept_ids: [attention-weight, scaled-dot-product-attention]
    candidate_destinations:
      pages: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
      concepts: [attention-weight, scaled-dot-product-attention]
    pedagogical_profile:
      learner_question: "What geometric set contains the weighted sum of value vectors?"
      explanatory_lens: geometric
      teaching_form: [mathematical-derivation, mental-model]
      abstraction_level: intermediate
      prerequisites: [softmax, convex-combination, convex-hull]
      distinctive_value: "It foregrounds the geometry of the value aggregation."
      limitations: ["The article's cone/wedge terminology blurs two distinct geometric constructions."]
    pedagogical_assessment:
      novelty: {level: low, rationale: "The existing scaled-attention page already states and explains the convex-hull property."}
      complementarity: {level: moderate, rationale: "The source's three-vector triangle example is potentially visual, but its figure is unavailable."}
      pedagogical_value: {level: high, rationale: "The convex-hull interpretation is a useful exact geometric statement and a good diagnostic for misleading 'cone' language."}
      applicability: {level: low, rationale: "The canonical page already gives the exact statement and caveat that later projections/residuals need not remain in the hull."}
      redundancy: {level: high, rationale: "The same property is already explicitly taught, more precisely."}
      evidence_quality: {level: high, rationale: "The source's softmax premise is explicit and the convex-hull conclusion follows directly; the terminology correction is independently mathematical."}
    disposition: already-covered
    disposition_rationale: "No page change: the canonical page already contains the mathematically precise convex-hull statement. Record the source's cone/wedge imprecision as a review finding."

  - id: jay-joshi-transformer-mathematics-attention:output-projection
    kind: claim
    summary: "The article describes W_o as returning the blended context to the residual-stream coordinate space and, in multi-head attention, mixing the head outputs. The multi-head role is standard, but describing W_o as a rotation 'back' is too strong: it is a learned linear projection, not generally an inverse or rotation."
    locator: {type: section, value: "Stage 4: The Final Output Projection W_o (Panel 4)", label: "Stage 4"}
    evidence:
      kind: mathematical-formulation
      confidence: context-dependent
      scope: "The article gives a conceptual role for W_o but its actual dimensions and numerical matrix are not exposed in the indexed text."
      assumptions: ["In standard multi-head attention, per-head outputs are concatenated before the output projection.", "The final output dimension is compatible with the residual stream."]
      limitations: ["A general linear map need not be an orthogonal rotation.", "The described 3D single-head example does not demonstrate mixing across multiple heads.", "W_o does not reconstruct the original input or invert W_v."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [mathematical-tools-geometry]
      tags: [topic:multi-head-attention, topic:attention-output, method:linear-projection]
      concept_ids: [multi-head-attention, scaled-dot-product-attention]
    candidate_destinations:
      pages: [fr/transformer, en/transformer]
      concepts: [multi-head-attention, scaled-dot-product-attention]
    pedagogical_profile:
      learner_question: "Why is an output projection applied after the weighted value aggregation?"
      explanatory_lens: architectural
      teaching_form: [mental-model, mathematical-formulation]
      abstraction_level: intermediate
      prerequisites: [linear-map, multi-head-attention, residual-stream]
      distinctive_value: "It connects the attention sublayer output to the residual stream."
      limitations: ["The rotation-back metaphor can incorrectly imply an inverse coordinate transform."]
    pedagogical_assessment:
      novelty: {level: low, rationale: "The current architecture and attention materials already place the output projection after head aggregation."}
      complementarity: {level: moderate, rationale: "The residual-stream framing may be a useful emphasis, but the source's rotation metaphor needs qualification."}
      pedagogical_value: {level: moderate, rationale: "A careful explanation prevents treating W_o as an inverse of W_v or as a literal rotation."}
      applicability: {level: low, rationale: "No new explanatory gap was confirmed in the current page set."}
      redundancy: {level: high, rationale: "The output projection and multi-head concatenation are already part of the canonical architecture treatment."}
      evidence_quality: {level: moderate, rationale: "The text is visible, but the 3D panel and exact layer shapes are unavailable."}
    disposition: already-covered
    disposition_rationale: "Do not add another W_o explanation based on the uninspected panel. Preserve the precise interpretation as a learned output projection; do not call it an inverse or guaranteed rotation."

