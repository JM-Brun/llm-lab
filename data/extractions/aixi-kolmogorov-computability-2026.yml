schema_version: 1
source_ids:
  - hutter-universal-algorithmic-intelligence-2007
  - leike-hutter-computability-aixi-2015
  - hutter-quarel-catt-universal-ai-2024
pedagogical_model:
  reconstruction:
    status: partial
    basis:
      - "Hutter's 2007 report was inspected through its Kolmogorov-complexity definition and detailed Section 6 construction of AIXI(t,l)."
      - "Hutter, Quarel and Catt's 2024 textbook was inspected through its background treatment and the formal AIXI(t,l) algorithm and theorem in Section 13.2."
      - "Leike and Hutter's 2015 publisher and arXiv abstracts were reviewed for the computability-hierarchy result."
    limitations:
      - "The full proof of the 2015 arithmetical-hierarchy results was not audited."
      - "No implementation or benchmark was run; asymptotic time bounds conceal large constants and proof-search overhead."
  source_graph:
    nodes:
      - {id: src-kolmogorov-complexity, kind: mathematical-object, description: "Length of the shortest program producing an object on a fixed universal machine, up to an additive machine-dependent constant.", locator: "Hutter 2007, Section 3.2"}
      - {id: src-universal-semimeasure, kind: probability-model, description: "Universal mixture assigning weight 2^-length(program) to minimal programs generating an output prefix; lower semicomputable but not computable.", locator: "Hutter 2007, Section 3.4"}
      - {id: src-solomonoff-induction, kind: method, description: "Sequential prediction using the universal algorithmic mixture over computable generating processes.", locator: "Hutter 2007, Section 3"}
      - {id: src-sequential-decision, kind: framework, description: "Choose actions to maximize expected future reward under a probabilistic environment model.", locator: "Hutter 2007, Sections 2 and 4"}
      - {id: src-aixi, kind: theoretical-agent, description: "Combines the universal Solomonoff prior with sequential reward maximization for an unknown computable environment.", locator: "Hutter 2007, Section 4"}
      - {id: src-aixi-tl, kind: bounded-agent, description: "Computable resource-bounded construction over candidate policies/programs with bounded length and per-cycle time; later formalization uses proof-validated lower bounds.", locator: "Hutter 2007, Section 6; Hutter et al. 2024, Section 13.2"}
      - {id: src-proof-length-bound, kind: resource-parameter, description: "Maximum length l_P of proofs certifying a candidate policy's value estimate as a valid lower approximation in the 2024 formalization.", locator: "Hutter et al. 2024, Algorithm 13.1"}
      - {id: src-aixi-incomputability, kind: theorem-result, description: "AIXI is incomputable; Leike and Hutter show it is not limit computable, a stronger classification than merely saying exact computation is expensive.", locator: "Leike and Hutter 2015"}
    edges:
      - {from: src-kolmogorov-complexity, type: contributes-to, to: src-universal-semimeasure}
      - {from: src-universal-semimeasure, type: contributes-to, to: src-solomonoff-induction}
      - {from: src-solomonoff-induction, type: contributes-to, to: src-aixi}
      - {from: src-sequential-decision, type: contributes-to, to: src-aixi}
      - {from: src-aixi-tl, type: approximates, to: src-aixi}
      - {from: src-proof-length-bound, type: constrains, to: src-aixi-tl}
      - {from: src-aixi-incomputability, type: constrains, to: src-aixi}
    interpretation: "The graph separates descriptive complexity, universal prediction and active decision-making. AIXI(t,l) is a bounded computable construction with a restricted comparison class, not an exact computation of Kolmogorov complexity."
  technical_details:
    kolmogorov_complexity:
      definition: "K_U(x) = min{|p| : U(p)=x}"
      properties:
        - "The reference universal machine changes K by at most an additive constant."
        - "K is upper semicomputable (approximable from above), but not computable in general."
        - "A practical compressor gives a computable description length and hence an upper bound under a compatible coding model, not the exact K(x)."
    algorithmic_probability:
      definition: "M_U(x) = sum_{p: U(p) outputs a string beginning with x} 2^{-|p|}, using minimal programs in the prefix-free formulation."
      qualifications:
        - "M is a universal semimeasure, not generally a normalized computable probability distribution."
        - "The shortest-program term implies M_U(x) >= 2^{-K_U(x)} (up to the chosen universal-machine conventions)."
        - "The exact universal mixture is lower semicomputable, not computable."
    aixi:
      construction: "Replace the unknown environment prior in sequential decision theory by a universal Solomonoff mixture and choose actions maximizing expected future reward."
      caveats:
        - "AIXI is an idealized agent, not a practical neural network or a lossless compressor."
        - "Optimality is relative to a formal class of computable environments, a reward function, horizon/discount assumptions and a chosen universal machine."
        - "AIXI's uncomputability is not merely high runtime; Leike and Hutter classify it as not limit computable."
    aixi_tl:
      parameters:
        t: "Maximum computation time per interaction cycle for candidate policies."
        l: "Maximum program length of candidate policies."
        l_P: "In the later proof-validated formulation, maximum proof length for validity certificates."
      mechanism:
        - "Enumerate candidate programs/policies within the selected length and time bounds."
        - "In the later formalization, retain policies with proofs that their value estimates are valid lower approximations."
        - "At each cycle, run the candidates on the interaction history and select the action associated with the highest certified value estimate."
      complexity:
        per_cycle: "O(t * 2^l), with constants hidden by the construction."
        setup_later_formulation: "O(l_P^2 * 2^l_P) for enumerating and checking bounded-length proof candidates."
      limitations:
        - "The 2^l factor is exponential in the policy/program-length bound."
        - "The setup and proof machinery have very large hidden constants."
        - "The result compares against a restricted class of bounded policies satisfying the validity/proof assumptions; it is not global optimality among all agents."
        - "The detailed construction and the 2024 theorem support O(t * 2^l); avoid flattening superscripts into ambiguous O(t2l) or O(t^2 l)."
  claim_assessment:
    - claim: "There is no general computable algorithm for exact Kolmogorov complexity."
      status: "established"
      assessment: "K is upper semicomputable but not computable."
    - claim: "AIXI is uncomputable because Kolmogorov complexity is uncomputable."
      status: "incomplete-explanation"
      assessment: "K is conceptually related to the universal prior, but the direct AIXI construction uses a universal semimeasure and an optimal sequential decision rule. Exact universal prediction/value calculations are noncomputable; the 2015 result classifies AIXI as not limit computable."
    - claim: "AIXI(t,l) solves the same problem under time and space bounds."
      status: "needs-qualification"
      assessment: "It is a computable resource-bounded construction over candidate policies/programs. t bounds per-cycle execution time and l bounds program length; later formulations add proof-length l_P. Its guarantee is relative to a restricted candidate class and proof assumptions."
    - claim: "AIXI(t,l) runs in O(t 2^l)."
      status: "supported-with-scope"
      assessment: "This is the per-interaction-cycle bound in the detailed construction and the 2024 textbook theorem; the later formalization also has a separate proof-enumeration setup cost O(l_P^2 2^l_P)."
integration_decision:
  status: "integrated-as-advanced-deepen"
  rationale:
    - "Add a bilingual advanced page rather than expanding the introductory compression revision sheet with proof-level detail."
    - "Connect the concepts to existing entropy and predictive-compression material while keeping Kolmogorov complexity, algorithmic probability, universal prediction and active decision-making distinct."
    - "Treat AIXI(t,l) as a theoretical resource-bounded construction, not a practical algorithm or an exact computable form of K."
