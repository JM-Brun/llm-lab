    kind: limitation
    summary: "TokCollate implements intrinsic metrics only and explicitly warns that intrinsic measures such as Rényi efficiency do not reliably predict extrinsic downstream quality across settings."
    locator: {type: section, value: "§6, p. 424", label: "Limitations"}
