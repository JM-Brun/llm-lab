  - id: varis-stephen-libovicky-tokcollate-2026:two-stage-evaluation-architecture
    kind: mechanism
    summary: "TokCollate separates evaluation from exploration: a Python evaluation script consumes already-tokenized text files and emits metadata plus result matrices; a web visualizer then loads those outputs for interactive inspection. The paper explicitly says the current tool does not execute tokenization itself."
    locator: {type: section, value: "§2, pp. 419–420", label: "System overview and evaluation input/output"}
    evidence:
      kind: implementation-description
      confidence: established
      scope: "Architecture described in the ACL 2026 system demonstration paper."
      assumptions: []
      limitations: ["Repository behavior was not independently checked or executed.", "The distinction applies to the paper's described version."]
    technical_assessment:
      status: correct
      rationale: "The paper explicitly distinguishes precomputed tokenizer outputs from the subsequent scoring and visualization stages."
      corroborating_sources: []
    classification:
      primary_theme: text-tokenization
      tags: [topic:tokenizer-evaluation, topic:evaluation-pipeline]
      concept_ids: [token]
    candidate_destinations:
      pages: [en/tokenizer-design-evaluation, fr/tokenizer-design-evaluation]
      concepts: []
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "A concrete external example of separating tokenizer execution, metric computation and result exploration. It adds operational specificity, but does not warrant a new canonical pipeline or implementation."
  - id: varis-stephen-libovicky-tokcollate-2026:metric-families
    kind: definition
    summary: "The framework groups intrinsic metrics into monolingual measures computed per language (including corpus token count, fertility, characters per token, Rényi efficiency and Shannon entropy) and cross-lingual measures computed over language pairs (including vocabulary overlap, Jensen–Shannon divergence, Eflomal alignment and length ratios)."
    locator: {type: section, value: "§2.1, pp. 420–421; §6, p. 424", label: "Evaluation metrics"}
    evidence:
      kind: explicit-metric-definitions
      confidence: established
      scope: "Metric families implemented and described by the paper."
      assumptions: []
      limitations: ["Definitions and implementation details may depend on metric parameters and the selected corpus.", "This is an inventory of the paper's tool, not a universal taxonomy of tokenizer quality."]
    technical_assessment:
      status: correct
      rationale: "The paper explicitly distinguishes per-language from language-pair metrics and identifies the required data for each."
      corroborating_sources: []
    classification:
      primary_theme: text-tokenization
      tags: [topic:tokenizer-evaluation, method:intrinsic-evaluation, topic:multilingual-tokenization]
      concept_ids: [token]
    candidate_destinations:
      pages: [en/tokenizer-design-evaluation, fr/tokenizer-design-evaluation]
      concepts: []
      route_ids: []
    disposition: already-covered
    disposition_rationale: "The canonical advanced lesson already explains that token count, fertility, compression and downstream quality are distinct; the paper is useful as a concrete tool reference rather than another metric catalogue."
  - id: varis-stephen-libovicky-tokcollate-2026:cross-lingual-metric-distinction
    kind: mechanism
    summary: "The paper distinguishes vocabulary overlap, which measures shared subword types, from Jensen–Shannon divergence, which compares token-frequency distributions, and from alignment-based Eflomal scores, which estimate correspondence between tokens in parallel sentences. These metrics capture different aspects and require different evidence."
    locator: {type: section, value: "§2.1, pp. 420–421", label: "Cross-lingual metrics"}
    evidence:
      kind: method-description
      confidence: well-supported
      scope: "Cross-lingual metrics as implemented and described in TokCollate."
      assumptions: []
      limitations: ["Eflomal requires parallel sentence pairs.", "The paper's interpretation of alignment consistency as beneficial for transfer is not itself a causal result."]
    technical_assessment:
      status: qualified
      rationale: "The metric descriptions are explicit; downstream interpretation is appropriately bounded by the paper's data requirements and cited prior work."
      corroborating_sources: []
    classification:
      primary_theme: text-tokenization
