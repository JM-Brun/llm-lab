    kind: limitation
    summary: "The tool's language grouping depends on a composite metadata layer: FLORES+ for language coverage, ISO 639-3/15924 identifiers, Glottolog for genealogical families, Wikidata for speaker population and geographic annotations, Joshi et al. for resource tiers, manually assembled morphological typology, and FineWeb2 volume as a data-availability proxy."
    locator: {type: section, value: "§2.2, pp. 421–422", label: "Language information"}
    evidence:
      kind: implementation-description
      confidence: established
      scope: "Metadata sources and construction described in the paper."
      assumptions: []
      limitations: ["Some annotations are manually reconciled.", "Resource tiers date to Joshi et al. (2020).", "FineWeb2 volume is a proxy, not a direct measure of all model pretraining data."]
    technical_assessment:
      status: qualified
      rationale: "The paper discloses the main metadata sources and manual steps, which makes provenance and proxy limitations inspectable."
      corroborating_sources: []
