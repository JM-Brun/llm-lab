  decision_summary: "ColBERT introduces contextualized multi-vector late interaction: independent query/document encoding, MaxSim token matching and summation, with document vectors precomputed offline. Its FAISS path performs approximate token-vector candidate generation followed by full MaxSim refinement. The reported speedups and quality are specific to MS MARCO/TREC-CAR, the 2020 hardware and differing reranking/end-to-end measurement boundaries."
