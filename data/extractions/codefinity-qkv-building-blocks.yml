  decision_summary: "No canonical concepts or relations are missing. The source contributes a distinct geometric lens for Q/K and a lexical-polysemy example that complements the existing pronoun-coreference example. Both are integrated as optional, bounded perspectives in the bilingual Q/K/V lesson; the full bank treatment remains on contextualized-representations. The role definitions remain already covered; all three quiz questions are retained as assessment-design references rather than duplicated; no graph or route change is justified."
