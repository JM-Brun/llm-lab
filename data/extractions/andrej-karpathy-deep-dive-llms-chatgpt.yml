  - id: andrej-karpathy-deep-dive-llms-chatgpt:end-to-end-lifecycle
    kind: mental-model
    summary: "The lecture's central organizing model is a lifecycle: curated data is tokenized, a Transformer is pretrained with a next-token objective, the resulting base model is adapted through post-training, and the model is then used through iterative inference inside an application."
    locator: {type: chapter, value: "00:01:00-03:21:46", label: "Pretraining data through grand summary"}
    evidence: {kind: pedagogical-synthesis, confidence: well-supported, scope: "Cross-chapter synthesis of the lecture's explicit lifecycle narrative.", assumptions: ["The description is a high-level map, not a complete production training specification."], limitations: ["The exact stack varies by model family and provider.", "No single linear recipe captures every contemporary system."]}
    classification: {primary_theme: architectures-mechanisms, tags: [topic:llm-lifecycle, modality:video], concept_ids: [pretraining, fine-tuning, autoregressive-generation]}
    candidate_destinations: {pages: [fr/llm-overview, en/llm-overview], concepts: [pretraining, fine-tuning, autoregressive-generation]}
    disposition: integrate-by-reference
    disposition_rationale: "The lifecycle is a useful cross-page orientation, but the project already has canonical pages for its component mechanisms. Prefer a source card and contextual links over duplicating the complete pipeline."

  - id: andrej-karpathy-deep-dive-llms-chatgpt:tokenization-and-neural-io
    kind: mechanism
    summary: "Raw text is not directly consumed as ordinary words by the model: a tokenizer maps text into token IDs from a finite vocabulary, which become the discrete sequence processed by the neural network. The model's output scores correspond to candidate next tokens."
    locator: {type: chapter, value: "00:07:47-00:26:01", label: "Tokenization, neural-network I/O and internals"}
    evidence: {kind: technical-explanation, confidence: well-supported, scope: "General tokenization and model I/O explanation.", assumptions: ["The lecture's GPT-style token interface is the reference case."], limitations: ["Tokenizer algorithms and model input conventions vary.", "Multimodal models may represent non-text inputs through additional token or modality-specific pathways."]}
    classification: {primary_theme: architectures-mechanisms, secondary_themes: [probabilistic-foundations-training], tags: [topic:tokenization, topic:logits], concept_ids: [token, logits, softmax]}
    candidate_destinations: {pages: [fr/text-data, en/text-data, fr/tokenization-strategies, en/tokenization-strategies, fr/logits, en/logits], concepts: [token, logits, softmax]}
    disposition: already-covered
    disposition_rationale: "The project has canonical lessons for text-to-token IDs and prediction scores. Use the lecture as an additional explanation, not as a reason to repeat the definitions."

  - id: andrej-karpathy-deep-dive-llms-chatgpt:next-token-pretraining
    kind: mechanism
    summary: "Pretraining optimizes a model to predict observed next tokens over large text sequences. This objective produces a reusable base model, but it does not by itself specify the conversational interaction style expected from an assistant."
    locator: {type: chapter, value: "00:31:09-01:01:06", label: "GPT-2 training/inference and transition to post-training"}
    evidence: {kind: training-objective, confidence: well-supported, scope: "Lecture's explanation of GPT-style next-token pretraining.", assumptions: ["Autoregressive decoder-only language modeling is the main example."], limitations: ["Not all language models use the same architecture or objective.", "The lecture's simplified lifecycle omits many data, optimization and distributed-training details."]}
    classification: {primary_theme: probabilistic-foundations-training, tags: [topic:pretraining, method:next-token-prediction], concept_ids: [pretraining, cross-entropy]}
    candidate_destinations: {pages: [fr/loss, en/loss, fr/training-loop, en/training-loop, fr/llm-overview, en/llm-overview], concepts: [pretraining, cross-entropy]}
    disposition: integrate-by-reference
    disposition_rationale: "The source is an accessible lifecycle-level explanation; canonical lessons already own the objective and training loop."

  - id: andrej-karpathy-deep-dive-llms-chatgpt:base-model-versus-assistant
    kind: mental-model
    summary: "A pretrained base model is trained to continue sequences; assistant-style interaction is a behavior shaped by later stages such as supervised instruction fine-tuning and preference/reward-based optimization. These stages adapt a model rather than replacing the underlying Transformer inference process."
    locator: {type: chapter, value: "00:42:52-01:20:32", label: "Llama 3.1 base-model inference through conversation post-training"}
    evidence: {kind: conceptual-distinction, confidence: well-supported, scope: "The demonstrations and transition from pretraining to conversation-shaped post-training.", assumptions: ["The examples concern GPT-like assistant systems."], limitations: ["Production pipelines differ and may include multiple data, filtering, reward-model and policy-optimization stages.", "A chat template alone is not equivalent to post-training."]}
    classification: {primary_theme: probabilistic-foundations-training, tags: [topic:base-model, topic:assistant-model, topic:post-training], concept_ids: [pretraining, fine-tuning]}
    candidate_destinations: {pages: [fr/llm-overview, en/llm-overview, fr/post-training, en/post-training], concepts: [pretraining, fine-tuning]}
    disposition: integrate
    disposition_rationale: "This is a high-value distinction to preserve explicitly in the panorama and post-training lesson, with a link to the video."

  - id: andrej-karpathy-deep-dive-llms-chatgpt:parameters-versus-context
    kind: mental-model
    summary: "Information reflected in model parameters after training must be distinguished from information supplied in the active prompt or conversation context. Context can condition the current prediction without updating the model's parameters; neither should be casually equated with a human memory system."
    locator: {type: chapter, value: "01:20:32-01:46:56", label: "Hallucinations, tool use, knowledge/working memory and self-knowledge"}
    evidence: {kind: conceptual-distinction, confidence: well-supported, scope: "Lecture's contrast between model knowledge and working context.", assumptions: ["The parameter/context distinction is applied to ordinary inference without online weight updates."], limitations: ["The term working memory is an analogy for active context, not a claim of cognitive equivalence.", "External retrieval and application state add further information stores."]}
    classification: {primary_theme: inference-efficiency, secondary_themes: [architectures-mechanisms], tags: [topic:parametric-knowledge, topic:context-window, topic:in-context-learning], concept_ids: [in-context-learning]}
    candidate_destinations: {pages: [fr/in-context-learning, en/in-context-learning, fr/context-engineering, en/context-engineering, fr/rag-memory-boundaries, en/rag-memory-boundaries], concepts: [in-context-learning]}
    disposition: integrate
    disposition_rationale: "Retain this boundary as a recurring conceptual distinction. Cross-link the existing ICL/context-engineering lessons; do not create a new memory concept merely from the analogy."

  - id: andrej-karpathy-deep-dive-llms-chatgpt:hallucination-and-grounding
    kind: limitation
    summary: "Fluent next-token generation does not guarantee factual grounding. A model may produce plausible but unsupported statements, so users and applications need verification, provenance and appropriate external evidence rather than treating confident language as proof."
    locator: {type: chapter, value: "01:20:32", label: "Hallucinations, tool use, knowledge and working memory"}
    evidence: {kind: failure-mode-explanation, confidence: well-supported, scope: "General behavioral limitation discussed in the lecture.", assumptions: ["Hallucination is used broadly for unsupported or false generated content."], limitations: ["The lecture is not a complete taxonomy or causal account of hallucinations.", "Frequency and severity depend on task, model, prompting and evaluation."]}
    classification: {primary_theme: architectures-mechanisms, tags: [topic:hallucination, topic:reliability]}
    candidate_destinations: {pages: [fr/llm-limits, en/llm-limits, fr/llm-overview, en/llm-overview]}
    disposition: integrate-by-reference
    disposition_rationale: "The limitation is already represented in the bilingual limits page. Use the video as a supporting explanation and avoid presenting hallucination as one fully explained mechanism."

  - id: andrej-karpathy-deep-dive-llms-chatgpt:tool-use-boundary
    kind: mental-model
    summary: "A language model can generate a structured tool request, but the surrounding application or runtime is responsible for executing the tool, returning its result and deciding what happens next. Tool use is therefore a model-plus-orchestrator system behavior, not proof that the model directly performs external actions."
    locator: {type: chapter, value: "01:20:32", label: "Hallucinations and tool use"}
    evidence: {kind: system-boundary, confidence: well-supported, scope: "System-level distinction between generated tool calls and external execution.", assumptions: ["Tools are mediated by an application runtime."], limitations: ["Specific protocols and orchestration designs vary.", "The source's general discussion needs to be checked against the exact demonstration before attributing implementation details."]}
    classification: {primary_theme: inference-efficiency, tags: [topic:tool-use, topic:orchestration]}
    candidate_destinations: {pages: [fr/llm-evolution, en/llm-evolution, fr/llm-overview, en/llm-overview]}
    disposition: integrate
    disposition_rationale: "This boundary is important for preventing anthropomorphic descriptions of tool execution. Link to the existing application/system discussion rather than adding a new agent tutorial."

  - id: andrej-karpathy-deep-dive-llms-chatgpt:tokens-and-reasoning
    kind: mental-model
    summary: "The lecture emphasizes that computation during autoregressive inference is expressed through token generation: when a model produces intermediate reasoning text, those tokens become part of the context on which later predictions condition. This is a useful operational model, not a complete explanation of internal computation or a guarantee that visible reasoning faithfully reports it."
    locator: {type: chapter, value: "01:46:56-02:01:11", label: "Models need tokens to think"}
    evidence: {kind: pedagogical-interpretation, confidence: context-dependent, scope: "Lecture's explanation of token-mediated reasoning.", assumptions: ["The discussion concerns autoregressive language-model inference."], limitations: ["Visible chain-of-thought is not a transparent readout of all internal computation.", "Not every reasoning method requires exposing natural-language intermediate steps.", "The phrase 'think' is anthropomorphic shorthand."]}
    classification: {primary_theme: inference-efficiency, secondary_themes: [scale-research], tags: [topic:reasoning, topic:inference-time-compute]}
    candidate_destinations: {pages: [fr/llm-evolution, en/llm-evolution, fr/post-training, en/post-training]}
    disposition: integrate-by-reference
    disposition_rationale: "Preserve the token-level operational intuition with explicit caveats; do not convert it into a claim that all reasoning is equivalent to human thought or visible chain-of-thought."

  - id: andrej-karpathy-deep-dive-llms-chatgpt:jagged-intelligence
    kind: limitation
    summary: "LLM capabilities can be highly uneven: strong performance on one task does not imply reliable performance on another, even when the tasks appear similarly difficult to a human. Evaluation therefore needs task-specific tests, counterexamples and explicit failure analysis rather than a single undifferentiated intelligence score."
    locator: {type: chapter, value: "02:04:53", label: "Jagged intelligence"}
    evidence: {kind: behavioral-generalization, confidence: context-dependent, scope: "The lecture's general framing of uneven capability.", assumptions: ["Capability is evaluated across distinct task families."], limitations: ["The term is descriptive rather than a formal metric.", "The lecture's examples should not be generalized without task-specific evidence."]}
    classification: {primary_theme: scale-research, tags: [topic:jagged-intelligence, topic:evaluation]}
    candidate_destinations: {pages: [fr/llm-limits, en/llm-limits, fr/llm-overview, en/llm-overview]}
    disposition: integrate
    disposition_rationale: "This is a useful organizing caution for evaluation and learner expectations. Keep it tied to concrete task-level evidence rather than treating it as a new measurable construct."

  - id: andrej-karpathy-deep-dive-llms-chatgpt:sft-and-reinforcement-learning
    kind: mental-model
    summary: "Supervised fine-tuning teaches from demonstration examples, whereas reinforcement-learning stages optimize behavior using reward or preference signals. These are distinct learning signals and should not be collapsed into a single generic 'fine-tuning' operation."
    locator: {type: chapter, value: "02:07:28-02:48:26", label: "Supervised fine-tuning, reinforcement learning, DeepSeek-R1 and AlphaGo"}
    evidence: {kind: training-method-comparison, confidence: well-supported, scope: "High-level comparison of demonstrations and reward-based optimization.", assumptions: ["The terms refer to common post-training families."], limitations: ["Specific algorithms, reward models, data pipelines and policy objectives differ substantially.", "AlphaGo is an analogy/history case, not the same training setup as an LLM."]}
    classification: {primary_theme: probabilistic-foundations-training, secondary_themes: [scale-research], tags: [method:supervised-fine-tuning, method:reinforcement-learning]}
    candidate_destinations: {pages: [fr/post-training, en/post-training], concepts: [fine-tuning ]}
    disposition: integrate
    disposition_rationale: "The distinction is central to the post-training lesson; preserve the differences between SFT, RL and preference optimization."

  - id: andrej-karpathy-deep-dive-llms-chatgpt:rlhf-and-reasoning-case-studies
    kind: claim
    summary: "The lecture uses DeepSeek-R1 and AlphaGo to make reward-based learning and search more concrete, then introduces RLHF as a human-preference-based post-training family. These cases should be compared by their environment, action space, reward signal, optimization algorithm and evaluation protocol rather than treated as interchangeable examples."
