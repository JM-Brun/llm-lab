    kind: distinction
    summary: "SentencePiece is a tokenizer toolkit that supports multiple subword model families, including BPE and Unigram; it should not be treated as one segmentation algorithm."
    locator: {type: section, value: "SentencePiece overview, supported models", label: "Model families"}
    evidence:
      kind: official-documentation
      confidence: established
      scope: "The overview and model-family information included in the existing project audit."
      assumptions: []
      limitations: ["The available configuration and behavior depend on the SentencePiece version and model."]
    technical_assessment: {status: not-reviewed, rationale: "Existing source audit reused.", corroborating_sources: []}
    classification:
      primary_theme: text-tokenization
      tags: [topic:tokenizer-library, topic:subword-tokenization]
      concept_ids: [tokenizer, subword-tokenization, byte-pair-encoding, unigram-tokenization]
    candidate_destinations:
      pages: [fr/tokenization-strategies, en/tokenization-strategies]
      concepts: [tokenizer, subword-tokenization, byte-pair-encoding, unigram-tokenization]
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "The distinction prevents the library from being conflated with a single algorithm."

  - id: google-sentencepiece-documentation:raw-text-and-whitespace
    kind: mechanism
    summary: "SentencePiece's raw-text approach makes whitespace handling an explicit tokenizer convention rather than assuming that words have already been split by spaces."
    locator: {type: section, value: "SentencePiece overview and normalization documentation", label: "Raw text and whitespace"}
    evidence:
      kind: official-documentation
      confidence: well-supported
      scope: "The specific raw-Unicode and whitespace material retained in the existing audit."
      assumptions: []
      limitations: ["This statement is about the audited SentencePiece design, not every tokenizer library."]
    technical_assessment: {status: not-reviewed, rationale: "Existing source audit reused.", corroborating_sources: []}
    classification:
      primary_theme: text-tokenization
      tags: [topic:whitespace, topic:text-normalization, topic:tokenizer-pipeline]
      concept_ids: [tokenizer-pipeline, text-normalization, tokenization]
    candidate_destinations:
      pages: [fr/tokenization-strategies, en/tokenization-strategies]
      concepts: [tokenizer-pipeline, text-normalization, tokenization]
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Useful to explain that whitespace behavior is part of the tokenizer specification, not a universal precondition."
    
