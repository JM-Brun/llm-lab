  - id: sebastian-raschka-understanding-large-language-models-2023:transformer-foundations
    kind: claim
    summary: "The opening group traces a route from attention for recurrent sequence models to the original encoder-decoder Transformer, including scaled dot-product attention, multi-head attention and positional encodings."
    locator: {type: section, value: "Understanding the Main Architecture and Tasks; entries 1–2", label: "Attention origins and Transformer"}
    evidence:
      kind: literature-summary
      confidence: well-supported
      scope: "The author's brief descriptions of Bahdanau et al. (2014) and Vaswani et al. (2017)."
      assumptions: ["The extracted statement is a summary of the article's framing, not a substitute for either primary paper."]
      limitations: ["The article's historical narrative is compressed; consult the original papers for precise contributions and terminology."]
    disposition: cite
    disposition_rationale: "The canonical lessons already explain the Transformer; this article adds a compact historical reading path."

  - id: sebastian-raschka-understanding-large-language-models-2023:normalization-debate
    kind: question
    summary: "The article highlights the distinction between Post-LN in the original Transformer figure and Pre-LN in the updated reference implementation, and points to research on optimization stability and possible representation-collapse trade-offs."
    locator: {type: section, value: "On Layer Normalization in the Transformer Architecture", label: "Pre-LN and Post-LN"}
    evidence:
      kind: literature-summary
      confidence: context-dependent
      scope: "The article's summary of Xiong et al. (2020) and its mention of ResiDual."
      assumptions: ["Normalization behavior depends on architecture, depth, optimization setup and training regime."]
      limitations: ["The source does not reproduce the experiments or establish a universal ranking of Pre-LN and Post-LN variants."]
    disposition: link
    disposition_rationale: "Keep as a lead to the primary literature; any implementation guidance should be based on direct study and controlled experiments."

  - id: sebastian-raschka-understanding-large-language-models-2023:historical-fast-weights
    kind: claim
    summary: "The article connects Schmidhuber's 1991 fast-weight programmers to later linearized-attention formulations, noting the relationship between query/key/value terminology and additive outer-product updates."
    locator: {type: section, value: "Learning to Control Fast-Weight Memories", label: "Fast-weight historical connection"}
    evidence:
      kind: historical-comparison
      confidence: context-dependent
      scope: "The article's summary and its linked explanatory post about fast-weight programmers."
      assumptions: ["The correspondence is an analogy/equivalence under particular mathematical formulations and normalization choices."]
      limitations: ["The linked historical explanation and primary papers were not independently inspected in this pass; do not infer that all modern attention is identical to the 1991 model."]
    disposition: link
    disposition_rationale: "A valuable historical lead for advanced learners, but not a basis for changing the canonical attention explanation without a separate mathematical review."

  - id: sebastian-raschka-understanding-large-language-models-2023:model-family-orientation
    kind: definition
    summary: "The article uses BERT, GPT and BART to orient readers among encoder-oriented masked-language modeling, decoder-style autoregressive generation and encoder-decoder sequence-to-sequence pretraining."
    locator: {type: section, value: "BERT; Improving Language Understanding by Generative Pre-Training; BART", label: "Model-family examples"}
    evidence:
      kind: literature-summary
      confidence: well-supported
      scope: "The article's high-level comparison of the three cited model families."
      assumptions: ["These are representative historical examples, not an exhaustive or mutually exclusive taxonomy of all LLMs."]
      limitations: ["The task boundaries are simplified; model architecture and objective should be distinguished from downstream use cases."]
    disposition: cite
    disposition_rationale: "The project's existing lessons cover Transformer and generation mechanics; use this as a pointer to foundational papers rather than reproducing its simplified taxonomy."

  - id: sebastian-raschka-understanding-large-language-models-2023:scaling-and-compute-allocation
    kind: claim
    summary: "The scaling section connects model size, training-token count and compute allocation, using Gopher, Chinchilla and Pythia to point toward empirical studies of scaling, data exposure and training dynamics."
    locator: {type: section, value: "Scaling Laws and Improving Efficiency; entries 14–16", label: "Scaling and training dynamics"}
    evidence:
      kind: literature-summary
      confidence: context-dependent
      scope: "The article's summaries of Gopher, Chinchilla and Pythia."
      assumptions: ["Reported results are conditional on the models, datasets, compute budgets, objectives and evaluation tasks studied in the cited works."]
      limitations: ["The article's shorthand should not be converted into a universal scaling law or a current compute-optimal prescription."]
    disposition: link
    disposition_rationale: "Retain as a curated route to primary scaling papers; current training recommendations require newer evidence and explicit assumptions."

  - id: sebastian-raschka-understanding-large-language-models-2023:efficient-attention-and-training
    kind: claim
    summary: "The article points to efficient-Transformer surveys, FlashAttention and single-GPU training work as complementary perspectives on memory traffic, attention efficiency and practical training constraints."
    locator: {type: section, value: "Scaling Laws and Improving Efficiency; entries 10–11", label: "Efficiency references"}
    evidence:
      kind: literature-summary
      confidence: well-supported
      scope: "The article's descriptions of FlashAttention and Cramming."
      assumptions: ["The cited papers study different efficiency bottlenecks and should not be treated as directly comparable benchmarks."]
      limitations: ["No runtime, memory or throughput comparison was reproduced."]
    disposition: cite
    disposition_rationale: "Use the papers as separate primary references when discussing algorithmic and systems efficiency."

  - id: sebastian-raschka-understanding-large-language-models-2023:parameter-efficient-fine-tuning
    kind: mechanism
    summary: "The article presents LoRA as a low-rank parameterization of weight updates and points to a survey of other parameter-efficient adaptation methods such as adapters and prefix tuning."
    locator: {type: section, value: "LoRA; Scaling Down to Scale Up", label: "Parameter-efficient fine-tuning"}
    evidence:
      kind: literature-summary
      confidence: well-supported
      scope: "The article's summary of Hu et al. and the parameter-efficient fine-tuning survey."
      assumptions: ["The low-rank update is an adaptation parameterization, not a claim that the pretrained weight matrix itself is low rank."]
      limitations: ["The article does not derive LoRA optimization or compare methods under controlled conditions."]
    disposition: link
    disposition_rationale: "Keep as a gateway to primary PEFT literature; no duplicate implementation is justified by this source alone."

  - id: sebastian-raschka-understanding-large-language-models-2023:alignment-methods
    kind: mechanism
    summary: "The alignment section sketches supervised instruction examples, reward modeling and RLHF, alongside Constitutional AI and Self-Instruct as alternative or complementary approaches to shaping model behavior."
    locator: {type: section, value: "Alignment; Reinforcement Learning with Human Feedback", label: "Post-pretraining alignment"}
    evidence:
      kind: literature-summary
      confidence: well-supported
      scope: "The article's summaries of InstructGPT, Constitutional AI and Self-Instruct."
      assumptions: ["These methods have distinct objectives and supervision sources; the grouping is thematic, not an assertion that they are interchangeable."]
      limitations: ["The article does not fully specify the algorithms, reward-model limitations or evaluation protocols."]
    disposition: cite
    disposition_rationale: "Use the cited primary papers for an introductory historical path; current alignment practice requires a newer and broader review."

