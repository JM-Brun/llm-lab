  - id: kaden-zheng-model-carving-implementation:gate-update-and-removal
    kind: mechanism
    summary: "The gate implementation uses Adam moments and a logarithmic pressure slope with ln(20), clips gates at zero, and schedules graph removal after a configurable lead interval. Pending removals can be cancelled if a gate reopens before the scheduled removal; the final topology is frozen for cooldown."
