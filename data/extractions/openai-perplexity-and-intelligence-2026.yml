items:
  - id: openai-perplexity-and-intelligence-2026:log-perplexity-as-cross-entropy
    kind: definition
    summary: "For the reported natural-log convention, log-perplexity is the mean negative log probability assigned to observed next tokens on an evaluation corpus; this is the token-level cross-entropy averaged over evaluated positions."
    pedagogical_assessment:
      novelty: {level: low, rationale: "The mathematical relationship between cross-entropy and next-token NLL is already established in LLM Lab."}
      complementarity: {level: high, rationale: "The source connects that objective to a longitudinal base-model evaluation series and an explicit held-out dataset."}
      pedagogical_value: {level: high, rationale: "Makes the transition from a per-token loss to a corpus-level progress metric concrete."}
      applicability: {level: high, rationale: "Use as an evidence-backed case study attached to the existing cross-entropy lesson."}
      redundancy: {level: moderate, rationale: "The definition overlaps with existing loss material; the evaluation use case and caveats do not."}
      evidence_quality: {level: high, rationale: "The article explicitly defines the metric and identifies its dataset; the underlying internal dataset remains unavailable."}
    pedagogical_profile:
      learner_question: "How does token-level cross-entropy become a model-level metric?"
      explanatory_lens: "Average conditional negative log-likelihood over a held-out token sequence."
      teaching_form: "Metric definition and evaluation case study."
      abstraction_level: "Intermediate."
      prerequisites: ["Conditional probability", "Cross-entropy", "Held-out evaluation"]
      distinctive_value: "Connects a familiar training objective to a fixed evaluation series for base models."
      limitations: ["The underlying dataset and pipeline are internal."]
    locator: {type: section, value: "Paragraph beginning 'The primary way we measure progress' and footnotes 2–3", label: "Held-out log-perplexity"}
    evidence:
      kind: source-explanation
      confidence: context-dependent
      scope: "OpenAI's stated definition and use of log-perplexity on a fixed internal code dataset."
      assumptions: ["The reported logarithm is natural, consistent with the article's log-perplexity/cross-entropy equivalence."]
      limitations: ["Cross-lab comparisons require compatible datasets and data mixtures.", "The internal corpus is not available for independent replication."]
    disposition: clarify
    mapped_concepts: [cross-entropy, next-token-prediction]
    target_resources: [fr/cross-entropy, en/cross-entropy, fr/training-loop, en/training-loop]
  - id: openai-perplexity-and-intelligence-2026:perplexity-limitations
    kind: limitation
    summary: "OpenAI identifies four limitations: different labs use different datasets and data mixtures; perplexity is not a direct task-success metric; it omits improvements outside pre-training such as chain-of-thought reasoning; and the irreducible entropy floor is unknown."
    pedagogical_assessment:
      novelty: {level: high, rationale: "These specific evaluation caveats are not assembled in the existing token-level cross-entropy lesson."}
      complementarity: {level: high, rationale: "Adds a critical evaluation lens to the metric rather than treating lower loss as a universal capability ranking."}
      pedagogical_value: {level: high, rationale: "Prevents learners from over-interpreting a single aggregate metric."}
      applicability: {level: high, rationale: "A short caveat box or optional reading link can accompany the existing cross-entropy and evaluation material."}
      redundancy: {level: low, rationale: "Existing lessons define the metric but do not provide this four-part limitation set."}
      evidence_quality: {level: high, rationale: "The limitations are explicitly enumerated by the source; their broader empirical resolution is not established."}
    pedagogical_profile:
      learner_question: "What can a lower perplexity tell us, and what can it not tell us?"
      explanatory_lens: "Measurement validity and construct coverage."
      teaching_form: "Four-part limitations checklist."
      abstraction_level: "Intermediate to advanced."
      prerequisites: ["Perplexity", "Cross-entropy", "Evaluation datasets"]
      distinctive_value: "Separates predictive fit, downstream task performance, post-training gains and irreducible uncertainty."
      limitations: ["The source does not quantify the unknown entropy floor."]
    locator: {type: section, value: "Section 'Perplexity as a shared metric has challenges'", label: "Limitations of perplexity"}
    evidence:
      kind: source-explanation
      confidence: well-supported
      scope: "The author's explicit limitations for using perplexity as a shared metric."
      assumptions: ["The limitations are presented as the author's assessment, not an exhaustive formal theorem."]
      limitations: ["No cross-lab benchmark protocol is supplied."]
    disposition: integrate-by-reference
    mapped_concepts: [cross-entropy, next-token-prediction]
    target_resources: [fr/cross-entropy, en/cross-entropy, fr/scaling-laws, en/scaling-laws]
  - id: openai-perplexity-and-intelligence-2026:capability-association-not-causation
    kind: limitation
    summary: "The article associates historical log-perplexity improvements with capability milestones but explicitly states that the relevant thresholds were not predictable a priori; the examples do not establish a universal causal threshold from loss to capability."
    pedagogical_assessment:
      novelty: {level: moderate, rationale: "The explicit warning against treating capability associations as predictable thresholds is useful beyond the metric definition."}
      complementarity: {level: high, rationale: "It adds a careful reading of empirical trend charts and guards against causal overclaiming."}
      pedagogical_value: {level: high, rationale: "Learners practice distinguishing correlation, retrospective interpretation and causal evidence."}
      applicability: {level: moderate, rationale: "Retain in the source review and optional evaluation discussion; no canonical graph edge is warranted."}
      redundancy: {level: low, rationale: "No equivalent caveat was found in the inspected cross-entropy lesson."}
      evidence_quality: {level: high, rationale: "The source itself explicitly qualifies its historical interpretation."}
    locator: {type: section, value: "Paragraphs describing GPT-2 through recent models and the following a-priori qualification", label: "Capabilities and log-perplexity"}
    evidence:
      kind: source-interpretation
      confidence: context-dependent
      scope: "The author's retrospective association between reported loss levels and capabilities."
      assumptions: ["Historical examples are not treated as a predictive law."]
      limitations: ["No controlled causal analysis is provided."]
