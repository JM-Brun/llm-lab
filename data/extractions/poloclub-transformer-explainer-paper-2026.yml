items:
  - id: poloclub-transformer-explainer-paper-2026:token-centric-flow-design
    kind: visualization
    summary: "The paper proposes a token-centric, continuous flow visualization that follows token embeddings from input through repeated Transformer components to next-token probabilities, using a Sankey-inspired visual grammar to connect high-level architecture and intermediate transformations."
    locator: {type: section, value: "§1, pp. 1–2; §5.1, pp. 6–7; §6.1, pp. 7–8", label: "Contribution and token-centric flow design"}
    evidence:
      kind: explicit-design-rationale
      confidence: established
      scope: "The authors' design rationale for an educational visualization of decoder-only text-generation Transformers."
      assumptions: []
      limitations:
        - "The visual flow is an explanatory representation, not a literal conservation-flow model of information."
        - "The overview displays one selected block and one attention head at a time; navigation and animation stand in for the full depth and width."
    technical_assessment:
      status: qualified
      rationale: "The paper describes the design and its rationale; the claim that this visual grammar improves learning is evaluated separately in the user study."
      corroborating_sources: []
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:transformer-visualization, topic:token-embedding, method:information-flow]
      concept_ids: [token, token-embedding, contextualized-representation, self-attention]
    candidate_destinations:
      pages: [en/embedding-space, fr/embedding-space, en/contextualized-representations, fr/contextualized-representations]
      concepts: []
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Useful design evidence for the visual pedagogy of token and embedding flow; it should complement, not replace, mechanistic explanations of Transformer computation."

  - id: poloclub-transformer-explainer-paper-2026:progressive-attention-explanation
    kind: visualization
    summary: "The system progressively discloses multi-head self-attention: it moves from an architectural overview to animated, step-by-step views of Q/K/V projections, attention scores, value aggregation and matrix operations, while retaining the surrounding token flow."
    locator: {type: section, value: "§4.2, pp. 5–6; §5.2, pp. 7; §6.2, pp. 8–9", label: "Attention design challenge and expanded explanation"}
    evidence:
      kind: explicit-design-description
      confidence: established
      scope: "The interaction and visual explanation techniques implemented in Transformer Explainer."
      assumptions: []
      limitations:
        - "The authors explicitly simplify the presentation for non-experts."
        - "The study does not separately isolate the causal contribution of each animation or mathematical view."
    technical_assessment:
      status: qualified
      rationale: "The design is documented in detail, but its component-level educational effect is not independently identified by the experiment."
      corroborating_sources: []
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:self-attention, topic:multi-head-attention, method:progressive-disclosure]
      concept_ids: [self-attention, query, multi-head-attention]
    candidate_destinations:
      pages: [en/queries-keys-values, fr/queries-keys-values]
      concepts: []
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Relevant as a concrete visualization pattern; do not treat the interface as a substitute for exact attention equations or implementation details."

  - id: poloclub-transformer-explainer-paper-2026:autoregressive-sampling-interaction
    kind: mechanism
    summary: "The tool lets learners enter text, run a browser-hosted GPT-2 model, and manipulate temperature, top-k and top-p while observing the next-token probability distribution and the iterative append-one-token generation process."
    locator: {type: section, value: "§2, pp. 2–3; §6.3–6.4, pp. 9–10", label: "Decoder-only generation and interactive sampling"}
    evidence:
      kind: implementation-description
      confidence: established
      scope: "The GPT-2 text-generation demonstration described in the paper."
      assumptions: []
      limitations:
        - "The demonstration uses GPT-2 Small, not a current frontier LLM."
        - "The paper describes inference hyperparameters and interface behavior; it does not establish that these controls represent all decoding strategies."
        - "The paper's temperature examples are illustrative settings, not universal output behavior."
    technical_assessment:
      status: qualified
      rationale: "The described pipeline is consistent with autoregressive decoding at a high level; exact implementation behavior requires code inspection."
      corroborating_sources: []
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:autoregressive-generation, topic:sampling, topic:temperature, topic:top-k, topic:top-p]
      concept_ids: [token, self-attention]
    candidate_destinations:
      pages: [en/generation, fr/generation]
      concepts: []
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Useful for the connection between next-token distributions and sampling controls; retain the GPT-2 and implementation scope."

  - id: poloclub-transformer-explainer-paper-2026:browser-model-implementation
    kind: implementation-pattern
    summary: "The paper reports converting a PyTorch GPT-2 Small model to ONNX and running it with ONNX Runtime Web in the browser; the frontend uses Svelte and D3.js, while model files are split for parallel download and cached in IndexedDB."
    locator: {type: section, value: "§6.7, p. 11", label: "Web-based implementation"}
    evidence:
      kind: explicit-implementation-description
      confidence: established
      scope: "The architecture and deployment approach as reported by the CHI 2026 paper."
      assumptions: []
      limitations:
        - "The implementation repository and exact dependency versions were not audited."
        - "This is not evidence that the application remains deployable with current browsers or package versions."
        - "The paper's statement that the model runs locally in the browser describes this implementation, not all interactive LLM explainers."
    technical_assessment:
      status: qualified
      rationale: "The paper explicitly describes the deployment stack; reproducibility and current compatibility remain unverified."
      corroborating_sources: []
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:gpt-2, topic:onnx, topic:browser-inference, ecosystem:onnx-runtime-web]
      concept_ids: [token-embedding]
