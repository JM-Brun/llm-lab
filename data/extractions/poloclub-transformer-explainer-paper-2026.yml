  - id: poloclub-transformer-explainer-paper-2026:controlled-user-study-design
    kind: experiment
    summary: "The summative evaluation randomly assigned self-identified non-experts interested in generative AI to one of three between-subject conditions: Transformer Explainer, a blog, or a 3Blue1Brown video. The conditions were aligned to six learning objectives and followed by the same seven-question quiz and subjective measures."
    locator: {type: section, value: "§8.1–8.3, pp. 12–14; Table 1", label: "Study design, participants and learning objectives"}
    evidence:
      kind: experimental-protocol
      confidence: established
      scope: "One-hour online study; participants studied their assigned resource for up to 45 minutes; final analyzed sample of 90."
      assumptions: []
      limitations:
        - "The comparator materials were curated to align with six learning objectives and stripped of content considered irrelevant to this study."
        - "The sample was restricted to interested participants with low self-reported familiarity with generative AI."
        - "The outcome measures were collected immediately after a single study session."
    technical_assessment:
      status: qualified
      rationale: "The paper reports random assignment and a common quiz, supporting a controlled comparison within the study's selected population and materials."
      corroborating_sources: []
    classification:
      primary_theme: probabilistic-foundations-training
      tags: [method:controlled-experiment, topic:ai-education, topic:learning-outcome]
      concept_ids: []
    candidate_destinations:
      pages: [en/generation, fr/generation]
      concepts: []
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "The protocol is important context for interpreting the reported educational effects and their external validity."

  - id: poloclub-transformer-explainer-paper-2026:participant-exclusion-and-final-sample
    kind: limitation
    summary: "Of 128 initial participants, 38 were excluded using resource-specific attention checks, minimum focused-use time and quiz-speed criteria, leaving 90 participants in the final analysis."
    locator: {type: section, value: "§8.2–8.3.1, pp. 13–14", label: "Participant recruitment and engagement checks"}
    evidence:
      kind: reported-method-and-sample-flow
      confidence: established
      scope: "The summative user study reported by the authors."
      assumptions: []
      limitations:
        - "The analyzed sample is selected by post-recruitment engagement and attention criteria."
        - "The result should be reported with both the initial n=128 and analyzed n=90 when discussing sample selection."
        - "The paper reports balanced conditions but this extraction does not infer more detailed subgroup representativeness."
    technical_assessment:
      status: qualified
      rationale: "The attrition and filtering rules are explicit; exclusion may improve data quality while narrowing the population represented by the analyzed sample."
      corroborating_sources: []
    classification:
      primary_theme: probabilistic-foundations-training
      tags: [method:participant-screening, topic:sample-size, topic:external-validity]
      concept_ids: []
    candidate_destinations:
      pages: [en/generation, fr/generation]
      concepts: []
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Essential denominator and selection context for every quantitative claim from the study."

  - id: poloclub-transformer-explainer-paper-2026:quiz-performance-result
    kind: result
    summary: "In the final 90-participant sample, mean quiz accuracy across seven questions was 73.3% for Transformer Explainer, 59.5% for the blog and 61.9% for the video. The paper reports pairwise differences favoring the tool over the blog and video (both p=0.021), with an overall condition effect p=0.041."
    locator: {type: section, value: "§8.4.1, pp. 14–15; Fig. 9A; §9.1.1", label: "Objective quiz accuracy"}
    evidence:
      kind: reported-experimental-result
      confidence: well-supported
      scope: "Immediate post-session seven-question quiz in the selected non-expert sample and the three study conditions."
      assumptions: []
      limitations:
        - "This is short-term post-session quiz performance, not long-term retention or transfer."
        - "The result is tied to the selected content, comparator materials, participant pool and engagement exclusions."
        - "The study does not establish effectiveness for advanced learners, formal courses or other Transformer modalities."
    technical_assessment:
      status: qualified
      rationale: "The paper reports a randomized between-subject comparison and GLMM analysis; generalization beyond this study should remain cautious."
      corroborating_sources: []
    classification:
      primary_theme: probabilistic-foundations-training
      tags: [topic:learning-outcome, metric:quiz-accuracy, method:between-subjects]
      concept_ids: []
    candidate_destinations:
      pages: [en/generation, fr/generation]
      concepts: []
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Report the exact means, comparison and immediate-test scope; do not convert the result into a general claim that interactive tools always teach better."

  - id: poloclub-transformer-explainer-paper-2026:self-reported-understanding
    kind: result
    summary: "Participants rated their achievement of learning objectives at 3.59/5 for Transformer Explainer, 3.02/5 for the blog and 3.54/5 for the video. The tool was significantly higher than the blog (p=0.006), but not significantly different from the video (p=0.500)."
    locator: {type: section, value: "§8.4.1, pp. 14–15; Fig. 9B; §9.1.1", label: "Self-reported learning objectives"}
    evidence:
      kind: reported-subjective-result
      confidence: well-supported
      scope: "Self-reported understanding immediately after the study session, on a five-point scale."
      assumptions: []
      limitations:
        - "Self-report is not equivalent to demonstrated knowledge."
        - "The video condition's self-ratings were comparable to the tool despite lower mean quiz accuracy."
        - "The comparison is specific to the study's materials and participants."
    technical_assessment:
      status: correct
      rationale: "The extraction preserves the distinction between self-reported understanding and objective quiz performance."
      corroborating_sources: []
    classification:
      primary_theme: probabilistic-foundations-training
      tags: [topic:self-report, topic:likert-scale, topic:learning-outcome]
      concept_ids: []
    candidate_destinations:
      pages: [en/generation, fr/generation]
      concepts: []
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Useful paired evidence for discussing the difference between perceived understanding and quiz performance."

  - id: poloclub-transformer-explainer-paper-2026:learning-objective-heterogeneity
    kind: result
    summary: "The study reports uneven effects across learning objectives: the tool outperformed the video on architecture overview (p=0.026), outperformed the blog on output probabilities (p=0.011), and showed only marginal differences for attention (p=0.056). The MLP objective had comparatively lower quiz accuracy and lacked a dedicated interactive feature."
    locator: {type: section, value: "§9.1.2, pp. 15–16; Fig. 10", label: "Question-level learning outcomes"}
    evidence:
      kind: reported-subgroup-result
      confidence: well-supported
      scope: "Seven quiz questions mapped to six learning objectives in the final sample."
      assumptions: []
      limitations:
        - "The attention result at p=0.056 is described by the authors as marginal, not conventionally statistically significant at 0.05."
        - "Question-level results should not be generalized beyond the quiz and study conditions."
        - "The MLP interpretation is a design hypothesis, not an isolated causal test of feature presence."
    technical_assessment:
      status: qualified
      rationale: "The result suggests alignment between richer interaction and selected learning objectives, but the design does not isolate individual feature effects."
      corroborating_sources: []
    classification:
      primary_theme: probabilistic-foundations-training
      tags: [topic:learning-objective, topic:attention, topic:mlp, topic:sampling]
      concept_ids: [self-attention]
    candidate_destinations:
      pages: [en/generation, fr/generation]
      concepts: []
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Preserve the heterogeneous results and the non-significant/marginal distinction; avoid a single undifferentiated efficacy claim."

  - id: poloclub-transformer-explainer-paper-2026:feature-usefulness-ratings
    kind: result
    summary: "Among the 30 participants in the Transformer Explainer condition, guided learning received the highest feature usefulness rating (mean 4.47/5); flow visualization and custom text generation each averaged 4.10/5."
    locator: {type: section, value: "§9.3, pp. 16–17; Fig. 12", label: "Feature usefulness ratings"}
    evidence:
      kind: reported-subjective-result
      confidence: established
      scope: "Feature ratings from the 30 participants assigned to the Transformer Explainer condition."
      assumptions: []
      limitations:
        - "These are subjective usefulness ratings, not randomized feature ablations."
        - "The denominator is 30 tool-condition participants, not the full sample of 90."
        - "The ratings do not identify the independent causal contribution of each feature."
    technical_assessment:
      status: qualified
      rationale: "The means are reported by the authors; they describe perceived usefulness rather than measured feature-specific learning gains."
      corroborating_sources: []
    classification:
      primary_theme: probabilistic-foundations-training
      tags: [topic:feature-rating, topic:likert-scale, topic:guided-learning]
      concept_ids: []
    candidate_destinations:
      pages: [en/generation, fr/generation]
      concepts: []
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Useful for prioritizing design features, provided subjective rating and sample denominator remain explicit."

  - id: poloclub-transformer-explainer-paper-2026:short-term-study-limitations
    kind: limitation
    summary: "The evaluation is a one-hour study with up to 45 minutes of exposure and immediate post-session tests; it does not measure long-term retention or transfer, and the authors explicitly exclude detailed assessment of mathematical mechanisms."
    locator: {type: section, value: "§10.3, pp. 18–19", label: "Limitations of study design"}
    evidence:
      kind: author-stated-limitation
      confidence: established
      scope: "The paper's summative user study."
      assumptions: []
      limitations:
        - "The study does not establish durable learning gains."
        - "The study does not test detailed mathematical mastery."
        - "Advanced learners, instructors and practitioners are not the target population studied."
    technical_assessment:
      status: correct
      rationale: "These limits are explicitly acknowledged by the authors and constrain the interpretation of the efficacy results."
      corroborating_sources: []
    classification:
      primary_theme: probabilistic-foundations-training
      tags: [topic:external-validity, topic:retention, topic:measurement]
      concept_ids: []
    candidate_destinations:
      pages: [en/generation, fr/generation]
      concepts: []
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Mandatory caveat whenever the study is cited as evidence for educational effectiveness."

canonical_mapping:
  proposed_concepts: []
  proposed_relations: []
  route_implications: []
  decision_summary: "The CHI 2026 paper contributes a distinct HCI design rationale and a controlled short-term evaluation of an interactive Transformer learning tool. Preserve its study protocol, sample filtering, objective and subjective outcomes, heterogeneous learning-objective results, and limitations as structured evidence. Link to existing bilingual Transformer, embedding, self-attention and learning-science pages by reference; do not infer long-term retention, general educational superiority, or causal effects of individual interface features."
