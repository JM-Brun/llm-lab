items:
  - id: david-chen-compression-is-intelligence-2025:feature-selection
    kind: mechanism
    summary: "Feature selection retains terms or features considered informative for a defined classification task. The relevance of a feature is task- and distribution-dependent; this does not imply that a small set of words preserves every aspect of a document's meaning."
    locator: {type: section, value: "From Information Theory to Semantic Cores"}
    evidence:
      kind: cited-research-summary
      confidence: context-dependent
      scope: "The article's summary of Yoo et al. (2007) and its feature-selection motivation."
      assumptions: ["The downstream classification or ranking objective is specified."]
      limitations: ["The cited 2007 paper's full text and experimental details were not audited."]
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [scale-research]
      tags: [topic:feature-selection, method:bag-of-words]
      concept_ids: [contextualized-representation]
    candidate_destinations:
      pages: [en/entropy, fr/entropy, en/compression-revision, fr/compression-revision]
    disposition: integrate
  - id: david-chen-compression-is-intelligence-2025:compact-ranking
    kind: result
    summary: "Rau, Dehghani and Kamps (2024) study compact bag-of-words document representations for efficient Transformer ranking. This supports a bounded claim about ranking efficiency in the evaluated information-retrieval setting, not universal preservation of document semantics."
    locator: {type: section, value: "From Information Theory to Semantic Cores"}
    evidence:
      kind: paper-description
      confidence: context-dependent
      scope: "Bibliographic record and related special-section overview."
      assumptions: ["The representation and ranking objective are those defined by the cited paper."]
      limitations: ["Full experimental tables, ablations and exact performance trade-offs were not audited."]
    classification:
      primary_theme: inference-efficiency
      secondary_themes: [probabilistic-foundations-training]
      tags: [topic:document-ranking, method:bag-of-words, topic:feature-selection]
      concept_ids: [contextualized-representation]
    candidate_destinations:
      pages: [en/compression-revision, fr/compression-revision]
    disposition: integrate
  - id: david-chen-compression-is-intelligence-2025:nncp-predictive-coding
    kind: mechanism
    summary: "NNCP predicts the next symbol from preceding symbols and uses arithmetic coding to encode the observed symbol at approximately its negative log probability. A matching decoder repeats the model updates to reconstruct the original sequence losslessly."
    locator: {type: section, value: "Neural Compression in the Real World: Fabrice Bellard's NNCP"}
    evidence:
      kind: primary-paper-method
      confidence: well-supported
      scope: "Bellard's 2019 NNCP paper and 2021 NNCP v2 paper."
      assumptions: ["Encoder and decoder use compatible model parameters, preprocessing, arithmetic coding and deterministic update behavior."]
      limitations: ["Lossless coding performance demonstrates predictive coding under the benchmark setup, not semantic understanding or general intelligence."]
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [inference-efficiency, architectures-mechanisms]
      tags: [topic:predictive-compression, topic:entropy-coding, method:arithmetic-coding]
      concept_ids: [predictive-compression, conditional-distribution, surprisal, entropy-coding, arithmetic-coding]
    candidate_destinations:
      pages: [en/compression-revision, fr/compression-revision, en/entropy, fr/entropy]
    disposition: integrate
  - id: david-chen-compression-is-intelligence-2025:generation-as-decompression
    kind: limitation
    summary: "Treating prompting as compression and generation as decompression is a useful analogy for conditional expansion, but ordinary LLM generation is not the inverse of a known lossless encoder and does not guarantee recovery of omitted intent or a unique original output."
    locator: {type: section, value: "Generation can be seen as Decompression"}
    evidence:
      kind: critical-assessment
      confidence: well-supported
      scope: "Conceptual boundary of the article's generation/decompression analogy."
      assumptions: ["LLM generation is modeled as decoding from a conditional distribution under a decoding policy."]
      limitations: ["This is a conceptual qualification, not an empirical measurement of all prompting workflows."]
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [architectures-mechanisms]
      tags: [topic:conditional-generation, topic:representation]
      concept_ids: [conditional-distribution, predictive-compression, contextualized-representation]
    candidate_destinations:
      pages: [en/llm-limits, fr/llm-limits, en/compression-revision, fr/compression-revision]
    disposition: clarify
  - id: david-chen-compression-is-intelligence-2025:compression-taxonomy
    kind: limitation
    summary: "Feature selection, predictive lossless coding, learned latent representations and model compression preserve different objects and use different metrics. Their rates and quality measures cannot be compared as if they were one universal compression scale."
    locator: {type: section, value: "Compression in Deep Learning"}
    evidence:
      kind: critical-assessment
      confidence: well-supported
      scope: "Editorial taxonomy used to qualify the article's grouping of compression techniques."
      assumptions: []
      limitations: ["The taxonomy is an explanatory synthesis rather than a new formal classification."]
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [inference-efficiency, scale-research]
      concept_ids: [predictive-compression, entropy, contextualized-representation]
    candidate_destinations:
      pages: [en/compression-revision, fr/compression-revision]
    disposition: integrate
