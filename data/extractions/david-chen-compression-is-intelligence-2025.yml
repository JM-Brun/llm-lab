    - "Creates a useful opportunity to distinguish task-specific representations from universal semantic claims."
  pedagogical_limits:
    - "The slogan that compression is intelligence is a thesis or metaphor, not a result proved by the cited studies."
    - "The article groups distinct forms of compression without fully distinguishing their objectives or metrics."
    - "The prompt/decompression analogy can imply reversibility and information preservation that ordinary LLM generation does not guarantee."
    - "The full Yoo et al. paper and full Rau et al. experimental analysis were not audited."
    - "The LinkedIn cover image was not retrieved as image bytes or visually inspected."
