items:
  - id: towardsai-understanding-llms-tokenization-2026:granularity-tradeoff
    kind: mental-model
    summary: "The article motivates tokenization by contrasting large word vocabularies with long character sequences, then positions subwords as a compromise."
    locator: {type: section, value: "I.1–I.3", label: "The tokenization challenge"}
    evidence:
      kind: author-explanation
      confidence: established
      scope: "Introductory qualitative comparison in the article."
      assumptions: []
      limitations: ["The tradeoff is presented qualitatively; no measured corpus or model comparison is supplied."]
    technical_assessment:
      status: correct
      rationale: "The broad vocabulary-versus-sequence-length tradeoff is sound, though the article's account of Transformer cost is simplified."
      corroborating_sources: []
    pedagogical_assessment:
      learner_question: "Why not represent every word or every character as one token?"
      explanatory_lens: "Compare vocabulary growth, unknown units and sequence length."
      teaching_form: [comparison, mental-model]
      novelty: {level: low, rationale: "The same contrast is already explicit in the bilingual tokenization-strategies lesson."}
      complementarity: {level: low, rationale: "No new learner question or explanatory mechanism is introduced."}
      pedagogical_value: {level: moderate, rationale: "It is a concise introductory framing, but the project has a more qualified comparison."}
      applicability: {level: low, rationale: "No change to the existing lesson is justified."}
      redundancy: {level: high, rationale: "Word, character, byte and subword tradeoffs are already compared."}
      evidence_quality: {level: moderate, rationale: "A qualitative explanatory claim without supporting measurements."}
    classification:
      primary_theme: text-tokenization
      tags: [topic:tokenization, topic:tokenizer-design]
      concept_ids: [tokenization, subword-tokenization]
    candidate_destinations:
      pages: [fr/tokenization-strategies, en/tokenization-strategies]
      concepts: []
      route_ids: []
    disposition: already-covered
    disposition_rationale: "The existing lesson compares word, character, byte and learned subword granularities and qualifies their limitations."

  - id: towardsai-understanding-llms-tokenization-2026:wordpiece-compute-claim
    kind: claim
    summary: "The article attributes the decline of WordPiece in modern LLMs to the compute cost of repeatedly evaluating a pair-cohesion score."
    locator: {type: section, value: "II.1.1 WordPiece", label: "WordPiece and computational cost"}
    evidence:
      kind: author-assertion
      confidence: unverified
      scope: "A broad historical and computational explanation without cited measurements or comparative evidence in the retrieved article."
      assumptions: []
      limitations: ["The article does not establish that modern LLMs generally abandoned WordPiece or that this score was the decisive reason."]
    technical_assessment:
      status: qualified
      rationale: "The score is a known WordPiece-style heuristic, but the sweeping adoption-history and compute-causality claim is unsupported. Do not repeat it as fact."
      corroborating_sources: []
    classification:
      primary_theme: text-tokenization
      tags: [topic:wordpiece, topic:tokenizer-design]
      concept_ids: [wordpiece]
    candidate_destinations:
      pages: [fr/tokenization-strategies, en/tokenization-strategies]
      concepts: []
      route_ids: []
    disposition: reject
    disposition_rationale: "The project already distinguishes WordPiece from BPE; the article's explanation for modern adoption is not sufficiently evidenced."

  - id: towardsai-understanding-llms-tokenization-2026:unigram-pruning
    kind: mechanism
    summary: "The article describes Unigram as starting from a large candidate vocabulary and pruning tokens according to their effect on corpus likelihood."
    locator: {type: section, value: "II.1.2 Unigram", label: "Probabilistic pruning"}
    evidence:
      kind: author-explanation
      confidence: context-dependent
      scope: "High-level description of Unigram vocabulary reduction."
      assumptions: []
      limitations: ["The stated 10–20% pruning rate per iteration is not established as a general property; the example is illustrative, not a reproduced calculation."]
    technical_assessment:
      status: qualified
      rationale: "The top-down pruning intuition is broadly appropriate, but the article presents implementation-dependent details as fixed behavior."
      corroborating_sources: []
    classification:
      primary_theme: text-tokenization
      tags: [topic:unigram-tokenization, method:probabilistic-model]
      concept_ids: [unigram-tokenization]
    candidate_destinations:
      pages: [fr/tokenization-strategies, en/tokenization-strategies]
      concepts: []
      route_ids: []
    disposition: already-covered
    disposition_rationale: "The existing lesson already introduces Unigram as a probabilistic subword method. The article's fixed pruning percentage should not be imported."

  - id: towardsai-understanding-llms-tokenization-2026:sentencepiece-description
    kind: claim
    summary: "The article describes SentencePiece as a wrapper around BPE or Unigram that replaces spaces with a visible marker and guarantees lossless reconstruction."
    locator: {type: section, value: "II.1.3 SentencePiece", label: "SentencePiece"}
    evidence:
      kind: author-explanation
      confidence: context-dependent
      scope: "The article's simplified description of SentencePiece's whitespace and model behavior."
      assumptions: []
      limitations: ["The description omits SentencePiece's own training and encoding implementation and overstates losslessness independently of normalization and configuration."]
    technical_assessment:
      status: qualified
      rationale: "Whitespace escaping is a useful part of SentencePiece's design, but calling the library merely a wrapper and promising unconditional lossless recovery are misleading."
      corroborating_sources: []
    classification:
      primary_theme: text-tokenization
      tags: [topic:sentencepiece, topic:tokenizer-pipeline]
      concept_ids: [tokenizer, tokenizer-pipeline, text-normalization]
    candidate_destinations:
      pages: [fr/tokenization-strategies, en/tokenization-strategies]
      concepts: []
      route_ids: []
    disposition: reject
    disposition_rationale: "The current lesson already points to SentencePiece and distinguishes tokenizer components. The article's simplification would reduce technical accuracy."

  - id: towardsai-understanding-llms-tokenization-2026:byte-level-emoji-example
    kind: code-example
    summary: "The article decomposes the waving-hand emoji into its four UTF-8 bytes to motivate byte-level fallback."
    locator: {type: section, value: "II.3 The Ultimate Solution: Byte-Level BPE", label: "Emoji byte sequence"}
    evidence:
      kind: author-example
      confidence: established
      scope: "The UTF-8 byte sequence shown for U+1F44B waving hand."
      assumptions: []
      limitations: ["The example illustrates UTF-8 encoding, not the actual token segmentation or token IDs produced by a particular byte-level BPE tokenizer."]
    technical_assessment:
      status: correct
      rationale: "The four-byte UTF-8 sequence is correct for the specified emoji, but byte sequence and tokenizer output must remain distinct."
      corroborating_sources: []
    pedagogical_assessment:
      learner_question: "Why can one visible emoji correspond to several bytes?"
      explanatory_lens: "Contrast a Unicode code point with its UTF-8 encoding."
      teaching_form: [worked-example, byte-inspection]
      novelty: {level: low, rationale: "The Unicode lesson already contrasts code points and UTF-8 bytes with a composed/decomposed accented character."}
      complementarity: {level: moderate, rationale: "An emoji is a more intuitive multilingual example but does not add a new mechanism."}
      pedagogical_value: {level: moderate, rationale: "Could diversify examples if the lesson later needs a second visual case."}
      applicability: {level: low, rationale: "No evidence that replacing or extending the current Unicode example would improve learning."}
      redundancy: {level: moderate, rationale: "It reinforces the existing code-point/byte distinction."}
      evidence_quality: {level: high, rationale: "The UTF-8 bytes are directly checkable and unambiguous."}
    classification:
      primary_theme: text-tokenization
      tags: [topic:byte-level-encoding, modality:worked-example]
      concept_ids: [byte-level-encoding]
    candidate_destinations:
      pages: [fr/unicode-text, en/unicode-text, fr/tokenization-strategies, en/tokenization-strategies]
      concepts: []
      route_ids: []
    disposition: already-covered
    disposition_rationale: "The Unicode lesson already teaches the code-point/byte distinction with exact byte-level output. Keep this emoji as an optional future alternative, not a required addition."

  - id: towardsai-understanding-llms-tokenization-2026:multilingual-cost-claim
    kind: claim
    summary: "The article gives a ten-versus-thirty-token English/Arabic translation example and attributes the disparity to English-heavy training data."
    locator: {type: section, value: "III.2 Cost and Performance Disparities", label: "Language-dependent token costs"}
    evidence:
      kind: author-assertion
      confidence: unverified
      scope: "Illustrative numerical claim with no named tokenizer, exact sentence, token counts or reproducible measurement."
      assumptions: []
      limitations: ["Token counts depend on the exact text, tokenizer, version and normalization; the proposed causal explanation is not established by this example."]
    technical_assessment:
      status: qualified
      rationale: "Language-dependent fertility and token costs are real topics, but the article's 10-versus-30 comparison is not reproducible and should not be reused."
      corroborating_sources: []
    classification:
      primary_theme: text-tokenization
      tags: [topic:multilingual-tokenization, topic:token-fertility]
      concept_ids: [multilingual-tokenization, token-fertility]
    candidate_destinations:
      pages: [fr/tokenizer-multilingual-evaluation, en/tokenizer-multilingual-evaluation]
      concepts: []
      route_ids: []
    disposition: reject
    disposition_rationale: "The project already covers language-dependent tokenization with more carefully scoped evidence; this unsourced numerical illustration adds no value."

  - id: towardsai-understanding-llms-tokenization-2026:special-tokens-and-tiktoken
    kind: code-example
    summary: "The article shows tiktoken encoding a mixed text and explicitly authorizing the end-of-text special token, then inspecting each token's bytes."
    locator: {type: section, value: "III.1–III.3", label: "Special tokens and tiktoken example"}
    evidence:
      kind: author-code-and-output
      confidence: context-dependent
      scope: "The displayed cl100k_base example and output in the indexed article text."
      assumptions: []
      limitations: ["The snippet was not executed; behavior is specific to the named encoding and tiktoken API version. The retrieved formatting around the main guard is ambiguous."]
    technical_assessment:
      status: qualified
      rationale: "The allowlist and byte-inspection ideas are consistent with tiktoken's API, but the article's code is not independently validated."
      corroborating_sources: []
    classification:
      primary_theme: text-tokenization
      tags: [topic:special-token, ecosystem:tiktoken, modality:code-example]
      concept_ids: [special-token, token-encoding, tokenizer]
    candidate_destinations:
      pages: [fr/tokenization-strategies, en/tokenization-strategies, fr/text-data, en/text-data]
      concepts: []
      route_ids: []
    disposition: already-covered
    disposition_rationale: "The current lesson already explains implementation-specific special-token policies and links the tiktoken API. A second unexecuted snippet is unnecessary."

