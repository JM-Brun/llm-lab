  - id: linders-louwerse-zipf-spoken-dialog-2023:cognitive-effort-hypothesis
    kind: assumption
    summary: "The authors formulate a cognitive-effort hypothesis: when an external task consumes more cognitive resources, speakers may economize their linguistic contributions, predicting a steeper Zipf curve and a larger alpha. The article presents this as a hypothesis and examines it across dialogue conditions; it does not turn the principle of least effort into a universal law."
    locator: {type: section, value: "The cognitive effort hypothesis, theoretical framework and discussion", label: "Cognitive effort hypothesis"}
    evidence:
      kind: author-proposed-hypothesis-and-empirical-test
      confidence: context-dependent
      scope: "The study's operationalized dialogue conditions and linguistic-unit measures."
      assumptions: ["Alpha is interpreted as a proxy for the concentration/economy of linguistic contributions under the study's model."]
      limitations: ["The authors state that the hypothesis is not yet precise enough to yield an exact mathematical prediction for all conditions."]
    technical_assessment:
      status: not-reviewed
      rationale: "Hypothesis and scope recorded; the empirical tests and detailed effect sizes require a separate table-level audit."
      corroborating_sources: [zipf-human-behavior-least-effort-1949]
    pedagogical_profile:
      learner_question: "What does the principle of least effort predict about language use?"
      explanatory_lens: cognitive-resource trade-off in communication
      teaching_form: [hypothesis, model-comparison]
      abstraction_level: advanced
      prerequisites: ["Zipf exponent", "cognitive load", "communication"]
      distinctive_value: "Connects the exponent to a testable cognitive hypothesis rather than presenting least effort as an obvious explanation."
      limitations: ["The relationship is study-specific and should not be generalized beyond the tested conditions."]
    pedagogical_assessment:
      novelty: {level: high, rationale: "The Day 01 story intentionally avoids explaining the causal origin and contains no operational cognitive-effort hypothesis."}
      complementarity: {level: high, rationale: "Adds an empirically investigated theoretical framing to contrast with Lestrade's syntax–semantics model."}
      pedagogical_value: {level: moderate, rationale: "Useful for teaching how explanatory principles are operationalized and tested."}
      applicability: {level: moderate, rationale: "Optional depth only; it is not necessary for the core Zipf concept."}
      redundancy: {level: low, rationale: "No cognitive-load mechanism is currently presented."}
      evidence_quality: {level: moderate, rationale: "The paper reports empirical tests, but full tables, supplementary material and data are not yet audited."}
    classification:
      tags: [topic:principle-of-least-effort, topic:cognitive-load, method:empirical-hypothesis]
