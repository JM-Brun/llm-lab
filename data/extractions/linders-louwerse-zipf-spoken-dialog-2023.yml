      concepts: []
      route_ids: []
    disposition: integrate
    disposition_rationale: "The goodness-of-fit exercise introduces spoken dialogue and multiple linguistic units as the study context."
  - id: linders-louwerse-zipf-spoken-dialog-2023:fit-vs-exponent
    kind: limitation
    summary: "Across the studied units and dialog corpora, fit statistics are often similarly high, but the estimated exponent varies substantially between linguistic units and sometimes between corpora. A good fit statistic therefore does not mean that the same exponent or the same communicative process is present everywhere."
    locator: {type: section, value: "Results and discussion, paragraphs comparing R-squared and alpha", label: "Variation in exponent across units"}
    evidence:
      kind: reported-empirical-result
      confidence: well-supported
      scope: "The reported corpus samples and unit-specific frequency distributions."
      assumptions: ["The fitting procedure and sampled observations are those specified in the article."]
      limitations: ["Detailed numeric estimates should be taken from the paper's tables; they are not reproduced in this extraction."]
    technical_assessment:
      status: not-reviewed
      rationale: "Qualitative result recorded; full result-table audit remains outstanding."
      corroborating_sources: []
    pedagogical_profile:
      learner_question: "Does a high R-squared mean that every corpus follows the same Zipf law?"
      explanatory_lens: goodness-of-fit versus parameter stability
      teaching_form: [contrast, misconception-correction]
      abstraction_level: intermediate
      prerequisites: ["curve fitting", "exponent", "goodness of fit"]
      distinctive_value: "Separates the visual/fit quality of a power-law approximation from the stability and interpretation of its exponent."
      limitations: ["The extraction intentionally omits detailed numerical comparisons pending table-level audit."]
    pedagogical_assessment:
      novelty: {level: moderate, rationale: "The current lesson mentions exponent variation but does not distinguish it from goodness-of-fit statistics."}
      complementarity: {level: high, rationale: "Adds a statistical interpretation lesson that complements Piantadosi's residual analysis."}
      pedagogical_value: {level: high, rationale: "Helps prevent over-reading a high R-squared or visually straight curve."}
      applicability: {level: moderate, rationale: "Could inform a challenge about comparing fitted models across corpora."}
      redundancy: {level: low, rationale: "The distinction is not explicitly taught in the current exercises."}
      evidence_quality: {level: moderate, rationale: "The result is peer-reviewed, but the full tables and supplement remain to be checked."}
