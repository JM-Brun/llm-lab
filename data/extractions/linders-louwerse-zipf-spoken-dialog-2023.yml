items:
  - id: linders-louwerse-zipf-spoken-dialog-2023:unit-generalization
    kind: result
    summary: "The study extends rank-frequency analysis beyond written monologue and word unigrams. It examines spoken dialogues and units at word, utterance, syntactic, pragmatic and nonverbal levels, reporting generally good Zipf-formula fits while showing that the exponent varies more across units and corpora than the fit statistic alone suggests."
    locator: {type: section, value: "Abstract; Introduction; linguistic units; results and discussion", label: "Beyond written word unigrams"}
    evidence:
      kind: empirical-study
      confidence: well-supported
      scope: "The selected spoken-dialog corpora, linguistic units, languages and annotation levels in this study."
      assumptions: ["The corpus selection and annotation schemes provide the operational units used in the analysis."]
      limitations: ["This is one multi-corpus study; it does not establish identical exponents or mechanisms across all spoken communication."]
    technical_assessment:
      status: not-reviewed
      rationale: "Reported study design and results recorded; no independent corpus analysis."
      corroborating_sources: []
    pedagogical_profile:
      learner_question: "Does Zipf's law apply only to written word counts?"
      explanatory_lens: generalization across communication modes and linguistic units
      teaching_form: [comparison, empirical-study, taxonomy]
      abstraction_level: intermediate-to-advanced
      prerequisites: ["word types and tokens", "spoken dialogue", "basic frequency distributions"]
      distinctive_value: "Broadens the unit of analysis from word unigrams to syntactic, pragmatic, utterance and nonverbal units."
      limitations: ["The exponent is not constant across the different units and corpora."]
    pedagogical_assessment:
      novelty: {level: high, rationale: "The published lesson focuses on lexical word frequencies and does not cover spoken dialogue or nonverbal units."}
      complementarity: {level: high, rationale: "Adds an important boundary check against treating the familiar written-word example as the whole phenomenon."}
      pedagogical_value: {level: moderate, rationale: "Useful for showing that the empirical pattern depends on the chosen linguistic unit."}
      applicability: {level: moderate, rationale: "Best as a short optional perspective, not a prerequisite for LLM tokenization."}
      redundancy: {level: low, rationale: "The current page explicitly scopes itself to lexical words and does not discuss spoken interaction."}
      evidence_quality: {level: high, rationale: "Peer-reviewed empirical study with multiple corpora, though data were not independently accessed."}
    classification:
      tags: [topic:spoken-dialog, topic:linguistic-units, method:corpus-analysis]
      concept_ids: [word-frequency-distribution, zipf-law]
    candidate_destinations:
