  - id: philip-gage-byte-pair-compression-1994:blockwise-processing-and-decoding
    kind: method
    summary: "The algorithm is multi-pass and requires a working block in memory. Gage processes bounded blocks independently, with a pair table per block. Decoding uses that table and a stack to expand nested pair codes before reading the next encoded byte."
    locator: {type: section, value: "§§1, 3-4 and 7; Listings 1-4, pp. 1-4 and 7-13; Figures 1-2", label: "Blockwise processing, pair table and stack expansion"}
    evidence: {kind: implementation-detail, confidence: established, scope: "The paper's blockwise design and published C implementation.", assumptions: [], limitations: ["Block size affects speed and compression ratio.", "The sample implementation uses fixed-size structures and notes missing robustness checks.", "Code was inspected but not executed."]}
