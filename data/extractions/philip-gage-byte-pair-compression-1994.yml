    kind: method
    summary: "Within a data block, count adjacent byte pairs, repeatedly replace occurrences of a most-frequent pair with an unused byte value, and record the substitution so the decoder can reconstruct the original sequence."
    locator: {type: section, value: "§1 Theory; Listing 1, pp. 1 and 7", label: "Byte-pair substitution algorithm"}
