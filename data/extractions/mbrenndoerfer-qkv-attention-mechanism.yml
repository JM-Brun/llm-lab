items:
  - id: mbrenndoerfer-qkv-attention-mechanism:scaling-variance
    kind: derivation
    summary: "Under independent zero-mean, unit-variance query/key components, the dot product has variance d_k and standard deviation sqrt(d_k), motivating division by sqrt(d_k) before softmax."
    locator: {type: section, value: "The Scaling Problem and Its Solution, lines 809-831", label: "Variance derivation"}
    evidence:
      kind: mathematical-derivation
      confidence: context-dependent
      assumptions: ["q and k components have zero mean and unit variance", "Products q_m k_m are independent across dimensions", "Query and key components are independent for the product variance argument"]
      limitations: ["The derivation is conditional on its stated distributional assumptions; it is not a universal empirical description of trained Q/K activations."]
    pedagogical_profile:
      learner_question: "Why divide query-key dot products by sqrt(d_k)?"
      explanatory_lens: probabilistic-derivation
      teaching_form: [stepwise-derivation, numerical-scale-comparison, code-simulation]
      abstraction_level: intermediate
      prerequisites: [variance, independence, dot-product]
      distinctive_value: "Makes the dimension dependence of score variance explicit and connects a formula to a probabilistic model."
      limitations: ["The source's assumptions must remain visible; empirical simulation uses Gaussian random vectors."]
    pedagogical_assessment:
      novelty: {level: moderate, rationale: "The derivation is more explicit than a bare scaling formula, but the canonical attention lesson already owns the scaled-score computation."}
      complementarity: {level: high, rationale: "A probabilistic route can help learners who need a reason for the square-root factor, rather than memorizing it."}
      pedagogical_value: {level: high, rationale: "It links dimension, score scale and softmax concentration through an inspectable derivation."}
      applicability: {level: high, rationale: "Useful as optional depth/reference linked from the existing scaled-attention lesson."}
      redundancy: {level: moderate, rationale: "The concept is already canonical; the value is the explicit assumption-led derivation and simulation."}
      evidence_quality: {level: high, rationale: "The algebra is independently checkable, with assumptions made explicit in the source."}
    classification: {primary_theme: architectures-mechanisms, tags: [topic:qkv, topic:attention, method:scaled-dot-product], concept_ids: [query, key, attention-score, scaled-dot-product-attention]}
    candidate_destinations:
      pages: [en/scaled-dot-product-attention, fr/scaled-dot-product-attention]
      concepts: [attention-score, scaled-dot-product-attention]
    disposition: integrate-by-reference
    disposition_rationale: "Do not duplicate the derivation on the canonical page. Retain the source as an optional intermediate-level derivation/reference; revisit a concise project-authored derivation only if learner evidence shows that the scaling rationale remains a difficulty."

