    - {order: 2, section: "The Database Lookup Analogy", function: provide-functional-mental-model, moves: ["Map query to request", "Map key to searchable description", "Map value to returned content"]}
    - {order: 3, section: "The QKV Mechanism: From Intuition to Formula", function: derive-computation, moves: ["Project inputs", "Compute query-key dot products", "Motivate scaling", "Normalize and aggregate values"]}
    - {order: 4, section: "Dimensions and Shapes", function: formalize-tensor-contracts, moves: ["Track input and projected dimensions", "Distinguish score matrix and output shapes"]}
