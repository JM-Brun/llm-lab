    - {order: 10, section: "Summary", function: consolidate, moves: ["Restate core roles and computation"]}
    - {order: 11, section: "Quiz", function: retrieval-practice, moves: ["Check role and mechanism understanding"]}
  pedagogical_strengths:
    - "A coherent progression from intuition to equations, dimensions, code and a complete numerical trace."
    - "The scaling section exposes assumptions and derives Var(q dot k)=d_k rather than presenting sqrt(d_k) as an unexplained convention."
    - "The worked example exposes every stage and explicitly warns that seeded random projections do not produce linguistically meaningful patterns."
    - "The article separates Q/K matching from V aggregation and states that d_v need not equal d_k."
  pedagogical_limits:
    - "The database analogy can over-literalize retrieval; standard attention computes a soft weighted mixture, not a database lookup or hard selection."
    - "The article's variance derivation requires independence across q and k components and across dimensions, plus zero mean and unit variance; these assumptions are explanatory, not universal properties of trained activations."
    - "The claim that scaling prevents saturation and preserves gradients is directionally useful but too categorical without discussing score distributions, masking, temperature and learned activation statistics."
    - "The toy example uses hand-crafted interpretable inputs and random projection matrices; it demonstrates tensor flow, not learned linguistic behavior."
    - "The statement that trained patterns become linguistically meaningful (for example, verbs attending to subjects) is not established by the example and risks implying a universal head-level interpretation."
    - "The description of attention as treating all positions symmetrically omits the effect of causal/padding masks and positional mechanisms."
    - "The claim that stacked linear attention operations approximate complex functions is imprecise: the full attention operation includes softmax and is nonlinear; the surrounding block also includes nonlinear feed-forward layers."
    - "The phrase 'arbitrary attention patterns' overstates what parameterization, input, masking and finite model capacity guarantee."
    - "The convex-hull property applies to a single normalized weighted sum over the values included in that row; it does not imply a convex hull of the original token embeddings or the whole layer output after output projection/residual/MLP."
  comparison:
    dossier: docs/source-reviews/qkv-source-collection.md
    canonical_graph: data/concepts.yml
    canonical_routes: [data/guided-route.yml, docs/learning-path.md]
    decision: "No new canonical concept, graph edge, page or route. Retain as a high-value optional derivation/reference for scaling assumptions, tensor shapes and an end-to-end numerical trace; do not duplicate the existing canonical attention derivation."
