  - id: balestriero-lecun-platonic-representation-jepas-2026:matched-flickr-experiment
    kind: result
    summary: "On Flickr30k, the authors train image and text encoders separately. With matched text encoder, data and training recipe, caption views from different captions of the same image outperform masked spans and next-token prediction on mutual 10-NN and retrieval through one orthogonal map. The paper reports three seeds for these comparisons."
    locator: {type: section, value: "3.1", label: "Good Views Align Across Modalities"}
    evidence:
      kind: author-reported-experiment
      confidence: well-supported
      scope: "Flickr30k Karpathy split, 29k training images with five captions each; reported Table 1 and section 3.1."
      assumptions: ["The reported matched setup is as described by the authors."]
      limitations: ["Small caption dataset and image encoder limit absolute scores.", "No independent reproduction has been run.", "Alignment metrics do not measure reasoning."]
    classification:
      primary_theme: scale-research
      secondary_themes: [architectures-mechanisms]
      tags: [topic:jepa, topic:cross-modal-alignment, modality:image, modality:text]
    candidate_destinations:
      pages: []
      concepts: []
