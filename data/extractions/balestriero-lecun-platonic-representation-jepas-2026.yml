items:
  - id: balestriero-lecun-platonic-representation-jepas-2026:platonic-theorem
    kind: claim
    summary: "For a finite world with positive state probabilities, injective modality renderings, a shared symmetric positive-pair distribution with the same marginals, and population minimizers unique up to rotation, separately trained modality JEPAs minimize the same world-level objective and therefore recover the same representation up to orthogonal rotation."
    locator: {type: section, value: "2.1", label: "The Platonic Representation Theorem"}
    evidence:
      kind: formal-theorem
      confidence: well-supported
      scope: "The theorem statement and proof setup in section 2.1; full proof details remain to be checked in Appendix A."
      assumptions: ["Finite latent world-state set", "p(z)>0", "Injective modality rendering", "Same positive-pair distribution over world states with both marginals p", "Rotation-invariant pair loss and anti-collapse term", "Population optimization", "Minimizers unique up to rotation"]
      limitations: ["Not a theorem that arbitrary neural networks or all modalities converge in practice.", "The full proof and spectral-gap argument have not yet been audited."]
    classification:
      primary_theme: mathematical-tools-geometry
      tags: [topic:platonic-representation-hypothesis, topic:jepa, method:orthogonal-alignment]
    candidate_destinations:
      pages: [fr/contextualized-representations, en/contextualized-representations]
      concepts: []
    disposition: pending
  - id: balestriero-lecun-platonic-representation-jepas-2026:spectral-embedding
    kind: mechanism
    summary: "With second-order anti-collapse constraints, the JEPA optimum is characterized by the top eigenvectors of the normalized adjacency matrix of the graph induced by positive pairs; a spectral gap makes the relevant embedding unique up to rotation."
    locator: {type: section, value: "2.1", label: "Normalized positive-pair adjacency and spectral embedding"}
    evidence:
      kind: mathematical-derivation-summary
      confidence: well-supported
      scope: "The normalized kernel definition and spectral interpretation in section 2.1."
      assumptions: ["Second-order anti-collapse formulation", "Appropriate spectral ordering and gap", "Population objective"]
      limitations: ["Exact optimization and eigenvector ordering details require full Appendix A audit.", "The paper notes that the full-distribution SIGReg constraint's uniqueness is left as an assumption."]
    classification:
      primary_theme: mathematical-tools-geometry
      tags: [topic:jepa, topic:spectral-embedding, method:whitening]
    candidate_destinations:
      pages: [fr/contextualized-representations, en/contextualized-representations]
      concepts: []
    disposition: pending
  - id: balestriero-lecun-platonic-representation-jepas-2026:kernel-mismatch
    kind: result
    summary: "When modalities induce different positive-pair kernels over world states, their optimal spectral embeddings need not coincide; the paper bounds their post-rotation mismatch using the difference between kernels and the separation of the relevant spectrum."
    locator: {type: section, value: "2.2", label: "When Positives Differ"}
    evidence:
      kind: theorem-summary
      confidence: well-supported
      scope: "Section 2.2 and the article's summary of the 300 synthetic-world numerical check."
      assumptions: ["The spectral perturbation setup and gap conditions of the paper."]
      limitations: ["The exact bound and constants are not transcribed here; they require a full derivation audit.", "The 300-world result is a synthetic numerical validation, not a real-world guarantee."]
    classification:
      primary_theme: mathematical-tools-geometry
      tags: [topic:jepa, topic:spectral-embedding, topic:cross-modal-alignment]
    candidate_destinations:
      pages: [fr/contextualized-representations, en/contextualized-representations]
      concepts: []
    disposition: pending
  - id: balestriero-lecun-platonic-representation-jepas-2026:modality-nuisance
    kind: mechanism
    summary: "The paper models an observation as a function of both world state and modality-specific nuisance, such as caption wording or camera viewpoint. Pairing two corruptions of one observation can retain that nuisance, consuming embedding dimensions that cannot be aligned with another modality; pairing independent observations of a related scene can remove it from the shared signal."
    locator: {type: section, value: "2.3", label: "Good-View and Bad-View JEPAs"}
    evidence:
      kind: formal-model-summary
      confidence: well-supported
      scope: "Nuisance model, scene-explained covariance and positive-pair comparison in section 2.3."
      assumptions: ["Nuisance is independent of the world state in the formal model.", "The embedding is centered and whitened."]
      limitations: ["A nuisance for cross-modal alignment may be essential for a world model conditioned on actions or camera motion.", "The formal rendering assumes each observation determines its state; captions in reality can omit scene information."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [mathematical-tools-geometry]
      tags: [topic:jepa, topic:cross-modal-alignment, topic:modality-nuisance]
    candidate_destinations:
      pages: [fr/contextualized-representations, en/contextualized-representations]
      concepts: []
    disposition: pending
  - id: balestriero-lecun-platonic-representation-jepas-2026:next-token-as-bad-view
    kind: claim
    summary: "The paper reformulates next-token prediction as a JEPA-like objective whose positive pairs are a document prefix and its continuation and whose anti-collapse term is the softmax log-partition. The authors use this to motivate a heuristic account of weaker alignment with vision; this explanation is not a corollary of the rotation theorem."
    locator: {type: section, value: "2.4", label: "Next-Token Prediction is a Bad-View JEPA"}
    evidence:
      kind: mathematical-reformulation
      confidence: context-dependent
      scope: "Section 2.4, including the explicit caveats about the theorem not directly covering next-token prediction."
      assumptions: ["The paper's factorization and embedding parameterization."]
      limitations: ["Next-token prediction is not a spectral JEPA and is identified only up to a general invertible linear transform in the discussion.", "The nuisance explanation is heuristic rather than a direct theorem consequence."]
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [architectures-mechanisms, mathematical-tools-geometry]
      tags: [topic:next-token-prediction, topic:jepa, topic:cross-modal-alignment]
      concept_ids: [next-token-prediction, training-objective]
    candidate_destinations:
      pages: [fr/contextualized-representations, en/contextualized-representations]
      concepts: [next-token-prediction, training-objective]
    disposition: pending
  - id: balestriero-lecun-platonic-representation-jepas-2026:captioning-pairs
    kind: limitation
    summary: "The captioning demonstration fits a constrained linear map between frozen independently trained encoders using image–caption pairs; it does not jointly train the encoders or train the text decoder on image inputs, but it is not a completely pair-free demonstration."
    locator: {type: section, value: "5.1", label: "Captioning Without Training a Network on Image–Caption Pairs"}
    evidence:
      kind: author-reported-method
      confidence: context-dependent
      scope: "Abstract and article's detailed description of the captioning demonstration; section 5.1 awaits full audit."
      assumptions: ["The article's summary accurately reflects the paper's method."]
      limitations: ["Exact fitting protocol, data split and map parameterization require direct inspection of section 5.1."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [scale-research]
      tags: [topic:cross-modal-alignment, application:image-captioning]
    candidate_destinations:
      pages: [fr/contextualized-representations, en/contextualized-representations]
      concepts: []
    disposition: pending
