  - id: balestriero-lecun-platonic-representation-jepas-2026:captioning-linear-map
    kind: mechanism
    summary: "The captioning system trains a text decoder on text alone to reconstruct captions from frozen text-JEPA embeddings. At inference, frozen image embeddings are transformed by a constrained orthogonal map and decoded. No network is trained on image-caption pairs, but the map is fitted on paired Flickr data; the main reported COCO CIDEr .838 configuration uses 30k Flickr pairs."
    locator: {type: section, value: "5.1", label: "Captioning Without Training a Network on Image–Caption Pairs"}
    evidence:
      kind: author-reported-method
      confidence: well-supported
      scope: "Full section 5.1, including the map, decoder noise and transfer results."
      assumptions: ["The map is constrained to preserve the geometry assumed by the representation alignment."]
      limitations: ["The 30k paired examples mean the headline captioning demonstration is not pair-free.", "The result is not state-of-the-art captioning; it demonstrates composability of independently trained components."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [scale-research]
      tags: [topic:cross-modal-alignment, application:image-captioning, method:orthogonal-alignment]
    candidate_destinations:
