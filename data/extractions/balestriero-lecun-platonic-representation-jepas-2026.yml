  - id: balestriero-lecun-platonic-representation-jepas-2026:video-good-views
    kind: result
    summary: "On MSR-VTT, using different frames of one video clip as image-side views and different captions as text-side views improves mutual 10-NN alignment. This provides evidence that the view design can be applied on both modalities when multiple observations of the same scene are available."
    locator: {type: section, value: "3.3", label: "Good Views Help on Both Sides"}
    evidence:
      kind: author-reported-experiment
      confidence: context-dependent
      scope: "MSR-VTT experiment with 7k training clips and 20 captions per clip."
      assumptions: ["A clip is treated as a shared underlying scene/event for the paired frames and captions."]
      limitations: ["The image JEPA trained from scratch on the 7k clips remains weaker than DINOv2.", "This does not establish scalable video JEPA performance."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [scale-research]
      tags: [topic:jepa, topic:cross-modal-alignment, modality:video]
    candidate_destinations:
      pages: []
      concepts: []
