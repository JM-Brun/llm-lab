    kind: limitation
    summary: "The captioning demonstration fits a constrained linear map between frozen independently trained encoders using image–caption pairs; it does not jointly train the encoders or train the text decoder on image inputs, but it is not a completely pair-free demonstration."
    locator: {type: section, value: "5.1", label: "Captioning Without Training a Network on Image–Caption Pairs"}
    evidence:
      kind: author-reported-method
      confidence: context-dependent
      scope: "Abstract and article's detailed description of the captioning demonstration; section 5.1 awaits full audit."
      assumptions: ["The article's summary accurately reflects the paper's method."]
