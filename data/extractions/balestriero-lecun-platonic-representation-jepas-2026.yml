  - id: balestriero-lecun-platonic-representation-jepas-2026:sample-token-compute-distinction
    kind: result
    summary: "The headline comparison is 42 times fewer training samples for good-view JEPA than next-token prediction to reach a comparable WIT alignment score. Because each good-view sample reads three texts, the paper reports a smaller 14-fold text-token difference and 435 times fewer unique images. These are not total-compute or wall-clock ratios."
    locator: {type: section, value: "4.2", label: "Good Views Need 42 Times Fewer Samples"}
    evidence:
      kind: author-reported-comparison
      confidence: context-dependent
      scope: "109M encoder comparison on Recap-DataComp texts; 21.6M versus 900M samples."
      assumptions: ["The compared runs use the stated model and corpus configurations."]
      limitations: ["Different batch sizes and learning-rate recipes are used at the two scales.", "No FLOPs, energy or wall-clock equivalence is established.", "The paper reports samples, tokens and unique images as distinct denominators."]
    classification:
      primary_theme: scale-research
      secondary_themes: [architectures-mechanisms]
      tags: [topic:jepa, topic:training-efficiency, topic:cross-modal-alignment]
