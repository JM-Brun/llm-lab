  - id: balestriero-lecun-platonic-representation-jepas-2026:alignment-scaling-law
    kind: result
    summary: "The authors fit an empirical alignment law combining the fraction q of good-view training items, sample count M and number of images N. It predicts 85 held-out runs with RMSE .0093, comparable to seed-to-seed variation .0096, within the tested range. It overestimates good-view-only runs when extrapolated to 320M samples because the fitted form lacks a repeated-data term."
    locator: {type: section, value: "4.4", label: "A Scaling Law for the PRH"}
    evidence:
      kind: author-reported-scaling-law
      confidence: context-dependent
      scope: "One BERT-S recipe, 45 fitting cells up to 80M samples and 85 predicted runs."
      assumptions: ["Same Recap-DataComp training recipe and Flickr retrieval evaluation."]
      limitations: ["Empirical summary, not derived from the theorem.", "Extrapolation failure under repeated exposure is explicitly reported.", "Exponents are poorly identified."]
    classification:
