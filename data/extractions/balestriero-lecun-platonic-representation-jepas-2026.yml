  - id: balestriero-lecun-platonic-representation-jepas-2026:pair-free-alignment
    kind: result
    summary: "A separate experiment aligns unpaired image and caption sets using geometric structure and optimal transport. The 109M good-view text JEPA reaches 64.4% ImageNet-100 top-5 in the reported pair-free setup, compared with at most 56% among the language-model results in the cited benchmark; the authors also report that next-token prediction is unstable in half of its runs."
    locator: {type: section, value: "5.2", label: "Alignment Without Any Pair"}
    evidence:
      kind: author-reported-experiment
      confidence: context-dependent
      scope: "Unpaired COCO alignment protocol and zero-shot classification benchmark."
      assumptions: ["The benchmark protocol and baselines are those defined by the cited work and reproduced by the authors."]
      limitations: ["This is not a zero-pair training procedure for all components in the paper; it is a particular post-hoc alignment evaluation.", "The comparison is protocol-specific and author-reported.", "Flickr results show substantial seed variability."]
