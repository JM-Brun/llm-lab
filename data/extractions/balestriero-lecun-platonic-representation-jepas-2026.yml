  - id: balestriero-lecun-platonic-representation-jepas-2026:trimming-and-stability
    kind: result
    summary: "Trimming captions into shorter spans is the most consequential tested adjustment to good-view JEPA: full captions reduce retrieval R@1 from .246 to .185. Other tested settings move the mean less, while training stability remains important: gradient clipping prevents most observed collapses."
    locator: {type: section, value: "3.2", label: "Trimming Makes Good Views, the Rest Barely Matters"}
    evidence:
      kind: author-reported-ablation
      confidence: context-dependent
      scope: "One-factor-at-a-time Flickr ablations and stability observations in section 3.2."
      assumptions: ["The comparisons use the authors' selected training recipe and evaluation protocol."]
      limitations: ["Ablation scope is bounded to the tested settings.", "The result does not establish that shorter views are always better for every modality or objective."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [scale-research]
      tags: [topic:jepa, topic:positive-pairs, method:data-augmentation]
    candidate_destinations:
      pages: []
      concepts: []
