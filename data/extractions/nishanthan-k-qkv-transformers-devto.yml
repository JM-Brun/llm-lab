items:
  - id: nishanthan-k-qkv-transformers-devto:role-separation
    kind: definition
    summary: "Query is the representation compared against keys; Key is the representation against which queries are scored; Value is the representation aggregated using the resulting weights. Q, K, and V are learned representations of positions, not three token categories."
    pedagogical_assessment:
      novelty: {level: low, rationale: "The functional distinction is already explicit in the bilingual QKV lesson."}
      complementarity: {level: moderate, rationale: "The concise narrative framing may be an accessible entry point before the formal notation."}
      pedagogical_value: {level: moderate, rationale: "Could help readers who need an initial verbal distinction between matching and aggregation."}
      applicability: {level: moderate, rationale: "Could inform a short introductory transition, but needs comparison with the current opening."}
      redundancy: {level: moderate, rationale: "The underlying roles and learner question are already covered."}
      evidence_quality: {level: moderate, rationale: "Clear secondary tutorial explanation; not a primary technical source."}
    locator: {type: section, value: "1", label: "What Are Query, Key, and Value (QKV)?"}
    evidence:
      kind: pedagogical-explanation
      confidence: well-supported
      scope: "Conceptual role distinction in the article's introduction."
      assumptions: ["Standard attention with learned query, key, and value projections."]
      limitations: ["The search/document analogy is not a literal symbolic retrieval process.", "The article is a secondary tutorial, not a primary specification."]
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:qkv, topic:self-attention]
      concept_ids: [query, key, value, self-attention]
    candidate_destinations:
      pages: [fr/queries-keys-values, en/queries-keys-values]
      concepts: [query, key, value]
    disposition: defer
    disposition_rationale: "The bilingual canonical lesson already states this distinction and warns that Q/K/V are learned numerical vectors rather than readable questions, labels, or cards."

  - id: nishanthan-k-qkv-transformers-devto:shared-input-projections
    kind: mechanism
    summary: "For self-attention, the same representation matrix X is projected through learned parameter matrices W_Q, W_K, and W_V to produce Q, K, and V."
    pedagogical_assessment:
      novelty: {level: low, rationale: "The projection equations and shared representation stream are already covered."}
      complementarity: {level: low, rationale: "The source uses the same standard formulation without a distinct explanatory model."}
      pedagogical_value: {level: low, rationale: "No additional learner difficulty is addressed."}
      applicability: {level: low, rationale: "The existing page already presents the equations with dimensions and caveats."}
      redundancy: {level: high, rationale: "The content and explanatory function substantially duplicate the canonical lesson."}
      evidence_quality: {level: moderate, rationale: "The equations are standard, but the article is a secondary tutorial."}
    locator: {type: section, value: "3", label: "How Are Q, K, and V Generated?"}
    evidence:
      kind: mathematical-formulation
      confidence: well-supported
      scope: "The article gives Q = X W_Q, K = X W_K, and V = X W_V."
      assumptions: ["X is the representation stream entering the attention sublayer, not necessarily raw token embeddings.", "Optional biases are omitted."]
      limitations: ["Fused QKV implementations and tensor reshaping are not discussed.", "The single-input formulation is specific to self-attention; cross-attention uses distinct source streams."]
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:qkv, method:learned-linear-projection]
      concept_ids: [query, key, value, self-attention]
    candidate_destinations:
      pages: [fr/queries-keys-values, en/queries-keys-values, fr/transformer-block-walkthrough, en/transformer-block-walkthrough]
      concepts: [query, key, value]
    disposition: defer
    disposition_rationale: "The canonical Q/K/V page already gives the equations, matrix dimensions, shared representation stream, learned parameters, and self-attention/cross-attention distinction."

  - id: nishanthan-k-qkv-transformers-devto:scaled-dot-product-computation
