      type: section
      value: "4, Step 1"
      label: "Calculate Attention Scores"
    evidence:
      kind: interpretive-caveat
      confidence: well-supported
      scope: "The article explicitly limits the interpretation of query-key dot products."
      assumptions: ["The scores are produced by learned Q and K projections."]
      limitations:
        - "The caveat does not by itself explain all factors that determine the final attention output."
        - "Attention weights remain relative to the other accessible positions after masking and softmax."
    pedagogical_assessment:
      novelty: {level: low, rationale: "The bilingual Q/K/V page already warns that attention is not nearest-neighbour search and weights are not universal semantic relevance."}
      complementarity: {level: moderate, rationale: "It independently reinforces the distinction between learned compatibility scores and semantic similarity."}
      pedagogical_value: {level: moderate, rationale: "This is a useful misconception guardrail for learners who interpret dot products linguistically."}
      applicability: {level: low, rationale: "The canonical page already expresses the caveat in a broader and more precise form."}
      redundancy: {level: high, rationale: "The learner question and explanatory function are already covered."}
      evidence_quality: {level: moderate, rationale: "The source states a correct interpretive caveat, but does not provide an empirical or theoretical analysis of attention interpretability."}
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:attention, topic:interpretability]
      concept_ids: [query, key, self-attention]
    candidate_destinations:
      pages: [fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
      concepts: [query, key, self-attention]
    disposition: reject
    disposition_rationale: "The canonical Q/K/V and scaled-attention lessons already explain why learned scores and normalized weights are not semantic-similarity measures; retain the article as convergent evidence without duplicating the misconception guardrail."

  - id: nishanthan-k-qkv-transformers-devto:weighted-aggregation-not-argmax
