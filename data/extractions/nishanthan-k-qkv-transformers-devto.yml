  - id: nishanthan-k-qkv-transformers-devto:multi-head-attention
    kind: mechanism
    summary: "The article describes multi-head attention as parallel attention computations with per-head Q/K/V projections, followed by concatenation and an output projection."
    pedagogical_assessment:
      novelty: {level: low, rationale: "The architecture is already covered in the Transformer overview and block walkthrough."}
      complementarity: {level: moderate, rationale: "The article offers a compact beginner-level summary distinct in depth, but not in mechanism."}
      pedagogical_value: {level: low, rationale: "The existing overview already serves the introductory role while preserving important caveats."}
      applicability: {level: low, rationale: "A second summary would add little unless reader testing identifies a comprehension gap."}
      redundancy: {level: moderate, rationale: "It overlaps strongly, though at a simpler explanatory level."}
      evidence_quality: {level: moderate, rationale: "Broadly standard architectural description with limited implementation detail."}
    locator: {type: section, value: "6", label: "QKV in Multi-Head Attention"}
    evidence:
      kind: architectural-description
      confidence: context-dependent
      scope: "High-level description of conventional multi-head attention."
      assumptions: ["Distinct learned projections are used for each head."]
      limitations: ["Head specialization examples are illustrative, not guaranteed.", "Fused projections, head dimensions, reshaping and the output projection's mixing role are not detailed.", "Grouped-query and multi-query variants are outside scope."]
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:multi-head-attention, topic:qkv]
      concept_ids: [query, key, value, output-projection]
    candidate_destinations:
      pages: [fr/transformer, en/transformer, fr/transformer-block-walkthrough, en/transformer-block-walkthrough]
      concepts: [output-projection]
    disposition: defer
    disposition_rationale: "The overview already cautions against assuming interpretable head specialization; the implementation walkthrough explains head slicing and isolation until w_o."

  - id: nishanthan-k-qkv-transformers-devto:document-search-analogy
    kind: analogy
    summary: "The article compares Q/K/V to a search process: a query expresses what is sought, keys provide matching features, and values provide the information retrieved."
    pedagogical_assessment:
      novelty: {level: low, rationale: "The mapping repeats the query/matching-key/retrieved-value distinction already represented."}
      complementarity: {level: low, rationale: "It is another retrieval analogy, not a clearly different mental model from the existing index-card analogy."}
      pedagogical_value: {level: low, rationale: "No distinct learner difficulty or additional aspect is demonstrated."}
      applicability: {level: low, rationale: "Adding it would create competing analogies without a demonstrated benefit."}
      redundancy: {level: high, rationale: "The mapped roles and explanatory function substantially overlap the existing analogy."}
      evidence_quality: {level: moderate, rationale: "Useful as an introductory metaphor when bounded, but it is not a literal account of attention."}
    locator: {type: section, value: "1", label: "What Are Query, Key, and Value (QKV)?"}
    evidence:
      kind: pedagogical-analogy
      confidence: context-dependent
      scope: "Introductory analogy for separating matching from information aggregation."
      assumptions: ["The analogy is intended only to explain functional roles."]
      limitations: ["It can suggest explicit documents or symbolic labels, which the attention equations do not use.", "It overlaps with the existing index-card analogy."]
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:qkv, topic:analogy]
    candidate_destinations:
      pages: [fr/queries-keys-values, en/queries-keys-values]
      concepts: [query, key, value]
    disposition: reject
    disposition_rationale: "Compared by mapping and learner function—not merely by topic—the search metaphor repeats the same retrieval/matching distinction as the existing bounded index-card analogy. It does not illuminate a distinct aspect or address a separate learner difficulty."

  - id: nishanthan-k-qkv-transformers-devto:context-examples
    kind: mental-model
    summary: "The article uses lexical ambiguity (bank) and pronoun reference (it) to motivate why token representations need contextual information from other positions."
    pedagogical_profile:
      learner_question: "Why does a token representation need information from other positions in the sequence?"
      explanatory_lens: linguistic
      teaching_form: [worked-example, mental-model]
      abstraction_level: introductory
      prerequisites: [tokenization, contextualized-representation]
      distinctive_value: "Pairs lexical ambiguity (bank) with cross-position pronoun reference (it → the animal), illustrating two distinct motivations for contextualization."
      limitations:
        - "Illustrative motivation, not evidence that one attention head resolves coreference."
        - "Does not establish that attention alone accounts for linguistic reference resolution."
    pedagogical_assessment:
      novelty: {level: low, rationale: "Lexical ambiguity and pronoun reference are established motivation examples."}
      complementarity: {level: high, rationale: "The pronoun example adds a distinct cross-position dependency to the page's existing lexical-ambiguity example."}
      pedagogical_value: {level: high, rationale: "The paired examples distinguish lexical sense selection from using context across token positions."}
      applicability: {level: high, rationale: "A concise bilingual subsection fits directly after the existing bank example on the contextualized-representations page."}
      redundancy: {level: low, rationale: "The current page has a lexical ambiguity example but no pronoun-reference example; the new item adds a distinct relation without repeating the mechanism explanation."}
      evidence_quality: {level: moderate, rationale: "Illustrative examples motivate the need for context but do not prove that one attention layer resolves ambiguity or coreference."}
    locator: {type: section, value: "2", label: "Why Do We Need Q, K, and V?"}
    evidence:
      kind: illustrative-example
      confidence: context-dependent
      scope: "Examples motivating contextual interaction between sequence positions."
      assumptions: ["Examples illustrate possible contextual dependencies, not a specific model computation."]
      limitations: ["They do not establish that one attention layer resolves lexical ambiguity or coreference.", "Attention alone is not a complete account of contextual representation or linguistic understanding."]
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:contextualization, topic:self-attention]
      concept_ids: [self-attention, contextualized-representation]
    candidate_destinations:
      pages: [fr/contextualized-representations, en/contextualized-representations]
      concepts: [contextualized-representation]
    disposition: integrate
    disposition_rationale: "The bilingual contextualized-representations lesson already uses lexical ambiguity (bank) but did not illustrate a cross-position pronoun dependency. Add the animal/it example as a short complementary subsection, explicitly framing it as motivation rather than evidence that one attention head resolves coreference. This preserves the source's useful second viewpoint without duplicating the QKV mechanism explanation."

  - id: nishanthan-k-qkv-transformers-devto:reader-comment-kv-cache
    kind: open-question
    summary: "A reader comment proposes KV caching as a follow-up to Q/K/V, noting that incremental generation can use the current token's query with previously cached keys and values, and that cache memory grows with context length. The comment also suggests a small NumPy example to make tensor shapes concrete."
    provenance:
      voice: reader-comment
      parent_source_id: nishanthan-k-qkv-transformers-devto
      locator:
        type: comment
        value: "First visible reader comment following the article conclusion; KV-cache follow-up"
      captured_at: "2026-11-04"
    verification:
      status: corroborated
      sources:
        - huggingface-transformers-kv-cache-explanation
      assessment: "The Hugging Face Transformers caching documentation independently confirms that, during incremental causal decoding, the current query attends to cached past K/V plus the current K/V, and that current K/V are appended per layer. The comment's shorthand should not be read as saying that the current token computes only Q: its K and V are also computed and appended. Cache memory grows with retained sequence length; exact growth depends on the cache strategy and model configuration."
    pedagogical_assessment:
      novelty: {level: moderate, rationale: "KV caching is a distinct inference-time consequence of separating Q from K/V, not covered by the article body."}
      complementarity: {level: high, rationale: "It connects the introductory QKV mechanism to incremental autoregressive decoding and implementation-level reuse."}
      pedagogical_value: {level: high, rationale: "It answers why Q is computed for the current step while past K/V can be reused, and introduces a concrete compute-memory trade-off."}
      applicability: {level: moderate, rationale: "Useful as a follow-up in an inference-efficiency lesson, but outside the scope of the introductory QKV page."}
      redundancy: {level: low, rationale: "The article's main text does not discuss caching or incremental decoding."}
      evidence_quality: {level: moderate, rationale: "The comment is only a lead; its technical content is corroborated separately by official Transformers documentation."}
    locator:
      type: comment
      value: "First visible reader comment following the article conclusion"
      label: "Reader suggestion: KV cache and tensor-shape example"
    evidence:
      kind: community-comment
      confidence: context-dependent
      scope: "A reader-suggested follow-up topic and a concise description of incremental K/V reuse."
      assumptions: ["The comment refers to standard causal autoregressive decoding with a KV cache."]
      limitations:
        - "The comment is not part of the article author's claims."
        - "The shorthand omits that the current token's K and V are also computed and appended."
        - "The cache-memory trade-off depends on cache strategy, layer count, KV-head count, head dimension, precision and retained context."
    classification:
      primary_theme: inference-efficiency
      tags: [topic:kv-cache, topic:autoregressive-generation]
      concept_ids: [key, value]
    candidate_destinations:
      pages: []
      concepts: [key, value]
    disposition: defer
    disposition_rationale: "Preserve the community lead and its independent verification, but do not add KV-cache detail to the introductory Q/K/V page. Revisit when the inference-efficiency curriculum has a canonical destination."
