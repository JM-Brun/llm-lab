      novelty: {level: low, rationale: "The complete computation is treated in greater detail on the adjacent attention page."}
      complementarity: {level: low, rationale: "The article gives a compact sequence but no distinct derivation or visualization."}
      pedagogical_value: {level: low, rationale: "It does not improve on the existing mask-aware explanation and numerical example."}
      applicability: {level: low, rationale: "Moving it to the QKV page would duplicate the next learning step."}
      redundancy: {level: high, rationale: "Same computation and learner question as the dedicated attention lesson."}
      evidence_quality: {level: moderate, rationale: "Standard equations are presented, but scaling assumptions are abbreviated."}
    locator: {type: section, value: "4-5", label: "How Do Queries and Keys Calculate Attention? / How Do Values Produce Contextual Information?"}
    evidence:
      kind: mathematical-formulation
      confidence: well-supported
      scope: "Equations for scores, scaled scores, attention weights, and output."
      assumptions: ["Softmax is applied row-wise over accessible key positions."]
