      complementarity: {level: high, rationale: "The pronoun example adds a distinct cross-position dependency to the page's existing lexical-ambiguity example."}
      pedagogical_value: {level: high, rationale: "The paired examples distinguish lexical sense selection from using context across token positions."}
      applicability: {level: high, rationale: "A concise bilingual subsection fits directly after the existing bank example on the contextualized-representations page."}
