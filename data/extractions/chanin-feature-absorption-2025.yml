  - id: chanin-feature-absorption-sparse-autoencoders-2025:abstract-finding
    kind: limitation
    summary: "The NeurIPS 2025 paper reports feature absorption: hierarchical child features can absorb activations expected for a broader feature, exposing coverage failures despite apparent interpretability."
    locator: {type: section, value: "NeurIPS 2025 proceedings; arXiv:2409.14507; DOI 10.52202/085713-2755", label: "Abstract or report overview"}
