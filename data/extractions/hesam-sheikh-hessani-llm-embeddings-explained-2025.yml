  - id: hesam-sheikh-hessani-llm-embeddings-explained-2025:tfidf-geometry
    kind: limitation
    summary: "The TF-IDF visualization illustrates a count-based representation, but the article's wording that it has a ten-dimensional embedding because it uses ten document chunks appears inaccurate: TF-IDF feature vectors are indexed by vocabulary terms, while document count determines the number of rows; PCA then chooses a separate projection dimension."
    locator: {type: section, value: "TF-IDF example using TinyShakespeare", label: "Ten document chunks and 2D PCA projection"}
    evidence:
      kind: technical-correction
      confidence: well-supported
      scope: "Dimensional interpretation of a standard document-term TF-IDF matrix."
      assumptions: ["The described pipeline uses documents as samples and vocabulary terms as features."]
      limitations: ["The notebook implementation was not inspected, so this corrects the article's prose as retrieved rather than asserting the actual array shape in its code."]
    candidate_destinations:
      pages: [fr/embedding-space, en/embedding-space, fr/cosine-similarity, en/cosine-similarity]
    disposition: defer
    disposition_rationale: "The current core lesson does not teach TF-IDF; verify the source notebook before using this as a worked correction."
