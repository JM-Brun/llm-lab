    interpretation: "Source-local pedagogical reconstruction. Relations summarize the article's narrative and are not formal relations defined by the author; in particular, the method-family comparison does not imply that TF-IDF, Word2Vec, token embeddings and sentence embeddings are interchangeable objects."
  learning_outcomes:
    - {status: inferred, outcome: "Distinguish count-based, prediction-trained, token-table and contextualized representations.", basis: "Historical overview and static-versus-contextual distinction."}
    - {status: inferred, outcome: "Explain how a token ID retrieves a row from an embedding table in a Transformer.", basis: "torch.nn.Embedding and modern LLM sections."}
    - {status: inferred, outcome: "Interpret a nearest-neighbour visualization as a model- and metric-dependent inspection rather than a universal semantic map.", basis: "DeepSeek case study and token-neighbour graph."}
    - {status: inferred, outcome: "Identify memory and computation as relevant embedding-dimension trade-offs without assuming that larger dimensions always improve quality.", basis: "What Makes a Good Embedding? section, critically qualified."}
  assumed_prerequisites:
    - {status: inferred, topic: "Basic familiarity with vectors, tokens and vocabulary IDs.", basis: "The article uses these terms before formally defining them."}
    - {status: inferred, topic: "Basic understanding of Transformer layers and cosine similarity.", basis: "The modern LLM case study assumes both concepts."}
  teaching_route:
    - {order: 1, section: "What Are Embeddings?", function: establish-terminology, moves: ["Define data-to-vector representation", "Separate input token vectors from contextual hidden states", "Warn that the word embedding is used for several different objects"]}
    - {order: 2, section: "What Makes a Good Embedding?", function: introduce-quality-criteria, moves: ["Introduce task-relevant relationships", "Raise vector dimensionality and resource trade-offs"]}
    - {order: 3, section: "Traditional Embedding Techniques — TF-IDF", function: contrast-count-based-methods, moves: ["Derive term frequency and inverse document frequency", "Show a small corpus example", "Visualize the result after dimensionality reduction"]}
    - {order: 4, section: "word2vec", function: explain-predictive-learning, moves: ["Introduce CBOW and Skip-gram objectives", "Locate the learned vectors in the network", "Connect negative sampling to efficient training"]}
    - {order: 5, section: "BERT", function: introduce-contextualization, moves: ["Place embeddings inside an encoder architecture", "Explain masked-language modeling and the original BERT next-sentence objective", "Show layer-wise contextual representations"]}
    - {order: 6, section: "Embeddings in Modern LLMs", function: connect-to-llm-input, moves: ["Distinguish token lookup from contextual hidden states", "Describe training of the input table", "Relate token IDs to indexed vector retrieval"]}
    - {order: 7, section: "Embeddings in Action — DeepSeek-R1-Distill-Qwen-1.5B", function: demonstrate-model-inspection, moves: ["Load a concrete model's input embedding table", "Tokenize an example sentence", "Inspect token vectors and cosine neighbours"]}
    - {order: 8, section: "Embeddings as Graphs", function: visualize-local-neighbourhoods, moves: ["Connect tokens to nearest neighbours", "Inspect token spelling and subword variants", "Close with a visual atlas of local neighbourhoods"]}
  pedagogical_strengths:
    - "Combines a historical comparison with a concrete modern-model case study rather than treating embeddings as one timeless technique."
    - "Uses an interactive visual atlas and a trace from tokenization to actual model vectors to make a high-dimensional parameter table tangible."
    - "Makes the distinction between initial token vectors and contextual hidden states explicit in more than one section."
    - "Connects vector representations to practical inspection with PyTorch and cosine-neighbour retrieval."
  pedagogical_limits:
    - "The quality discussion overstates semantic closeness as a universal criterion; usefulness is objective-, data-, model- and task-dependent."
    - "The dimensionality discussion implies that larger vectors inherently capture more intricate relationships and are more prone to overfitting; this is not a general law."
    - "The TF-IDF example's description of a ten-dimensional embedding appears to confuse the number of documents with the vocabulary feature dimension; PCA output dimensionality is a separate choice."
    - "The article's BERT summary presents next-sentence prediction without noting that it is specific to original BERT and was removed in variants such as RoBERTa."
    - "The nearest-neighbour graph does not by itself establish semantic equivalence; graph directionality, tokenization variants, metric choices and model-specific geometry need explicit treatment."
    - "Several citations and figure-source placeholders are missing in the retrieved page text, limiting independent verification of some historical and implementation claims."
  comparison:
    dossier: docs/source-reviews/hesam-sheikh-hessani-llm-embeddings-explained-2026-11.md
    canonical_graph: "data/concepts.yml"
    canonical_routes: [data/guided-route.yml, docs/learning-path.md]
    decision: "Treat as a complementary visual tutorial and model-inspection case study. The core token-lookup and contextualization content is already present in the bilingual embedding-space lessons; do not create a duplicate core lesson. The current Space-linked primer-llm-embeddings source has been inspected but not executed; its implementation caveats and a bilingual optional Practice blueprint are recorded in the canonical source review. Keep the atlas external and link-only. An initial NumPy-only reference implementation and unit tests now exist in src/llm_lab/foundations/embedding_inspection.py and tests/unit/test_embedding_inspection.py; bilingual exercise hubs demonstrate the same tiny fixture. This is not a reproduction of the external checkpoint or atlas. Keep checkpoint-level reproduction, live interaction inspection and final FR/EN rendering verification open. The distinct earlier LLM Mechanics repository remains unaudited."
    structures_kept_separate: [source-explanatory-graph, canonical-concept-graph, page-navigation-graph, pedagogical-route]
items:
  - id: hesam-sheikh-hessani-llm-embeddings-explained-2025:static-and-contextualized
    kind: definition
    summary: "The article distinguishes a token's fixed input-table vector from the contextual hidden representations produced by later Transformer layers. The same token ID retrieves the same initial row, while its hidden state can differ across contexts."
    locator: {type: section, value: "What Are Embeddings?; Embeddings in Modern LLMs", label: "Static and contextualized representations"}
    evidence:
      kind: secondary-technical-explanation
      confidence: well-supported
      scope: "The article's terminology distinction, consistent with the existing embedding-space lesson."
      assumptions: ["The comparison concerns a fixed model checkpoint and its input embedding table."]
      limitations: ["The word embedding is overloaded in the literature; sentence/document encoders and internal hidden states require separate definitions."]
    classification:
      concept_ids: [token-embedding, contextualized-representation]
    candidate_destinations:
      pages: [fr/embedding-space, en/embedding-space, fr/contextualized-representations, en/contextualized-representations]
    disposition: already-covered
    disposition_rationale: "The bilingual core lesson already teaches this distinction and explicitly warns against conflating token, contextual and sentence/document embeddings."
  - id: hesam-sheikh-hessani-llm-embeddings-explained-2025:embedding-quality-and-dimension
    kind: misconception
    summary: "The tutorial proposes semantic representation and dimensionality as two quality properties, but these should be reframed as task-dependent evaluation and resource trade-offs. Higher dimensionality does not by itself guarantee richer semantic structure or imply overfitting."
    locator: {type: section, value: "What Makes a Good Embedding?", label: "Semantic Representation; Dimensionality"}
    evidence:
      kind: critical-source-review
      confidence: well-supported
      scope: "Review of the article's two stated quality criteria against standard representation-learning distinctions."
      assumptions: ["Embedding quality is evaluated for a specified task, dataset, model and downstream use."]
      limitations: ["No model comparison or dimensionality ablation was run for this source review."]
    candidate_destinations:
      pages: [fr/embedding-space, en/embedding-space, fr/cosine-similarity, en/cosine-similarity]
    disposition: clarify
    disposition_rationale: "The existing lessons emphasize task- and model-dependent geometry; the tutorial's dimensionality paragraph is a useful prompt for a concise qualification, not a claim to reproduce."
    pedagogical_profile:
      learner_question: "Does a larger embedding dimension automatically make representations better?"
      explanatory_lens: computational
      teaching_form: [misconception, critical-comparison]
      abstraction_level: introductory
      prerequisites: [token-embedding]
      distinctive_value: "Connects representational capacity to memory and compute costs."
      limitations: ["The source's overfitting statement is not substantiated by a controlled experiment."]
    pedagogical_assessment:
      novelty: {level: moderate, rationale: "The resource trade-off is a useful addition to the current lookup-focused core explanation."}
      complementarity: {level: moderate, rationale: "It introduces a design consideration adjacent to, but not central to, the current token lookup mechanism."}
      pedagogical_value: {level: moderate, rationale: "The question can help learners avoid equating vector size with quality."}
      applicability: {level: moderate, rationale: "A short caveat could fit the existing lesson or a later model-comparison activity."}
      redundancy: {level: low, rationale: "The current lesson does not develop embedding dimension as a model-design trade-off."}
