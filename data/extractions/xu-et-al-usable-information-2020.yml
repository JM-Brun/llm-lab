    - id: xu-et-al-usable-information-2020:predictive-v-information-definition
      kind: definition
      summary: "Predictive V-information is the no-side-information predictive V-entropy minus the predictive V-entropy conditioned on X."
      locator: {type: section, value: "2 Definitions and Notations", label: "Definition 3"}
      evidence:
        kind: definition
        confidence: established
        assumptions: ["Logarithmic loss and the predictive-family definition are used."]
        limitations: ["Its value depends on the chosen family and direction."]
      classification:
