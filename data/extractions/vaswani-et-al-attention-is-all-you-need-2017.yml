  - id: vaswani-et-al-attention-is-all-you-need-2017:sinusoidal-formula
    kind: mechanism
    summary: "The original Transformer adds a fixed position vector to token embeddings. Even dimensions use sine and odd dimensions use cosine, with angular frequencies forming a geometric progression determined by the model dimension and a base of 10,000."
    locator: {type: section, value: "3.5", label: "Positional Encoding"}
    evidence:
      kind: formal-definition
      confidence: established
      scope: "The paper's stated sinusoidal equations and description of the wavelength range."
      assumptions: ["Position indices are integers; the embedding dimension is even for paired sine/cosine coordinates."]
      limitations: ["The paper's wavelength endpoint description is approximate for finite model dimension.", "The paper does not establish that the model will generalize reliably beyond training lengths."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [mathematical-tools-geometry]
      tags: [topic:positional-encoding, method:sinusoidal-encoding]
      concept_ids: []
    candidate_destinations:
      pages: [fr/sinusoidal-positional-encoding, en/sinusoidal-positional-encoding]
    disposition: integrate
    disposition_rationale: "This is the primary source for the exact formula, frequency schedule, and original motivation; the new bilingual deep dive derives and qualifies these claims."
  - id: vaswani-et-al-attention-is-all-you-need-2017:fixed-offset-linearity
    kind: derivation
    summary: "For any fixed offset k, the positional vector at p+k can be represented as a linear transformation of the positional vector at p. Each sine/cosine pair transforms through a 2-by-2 matrix whose coefficients depend on k and that pair's frequency, not on p."
    locator: {type: section, value: "3.5", label: "Positional Encoding"}
    evidence:
      kind: mathematical-claim
      confidence: established
      scope: "The paper states the fixed-offset linear-transform motivation; the pairwise matrix derivation is reconstructed from trigonometric addition identities."
      assumptions: ["The standard interleaved sine/cosine construction is used."]
      limitations: ["The existence of the transformation does not prove that a trained attention head learns a particular relative-position rule."]
    classification:
      primary_theme: mathematical-tools-geometry
      tags: [topic:positional-encoding, method:sinusoidal-encoding]
      concept_ids: []
    candidate_destinations:
      pages: [fr/sinusoidal-positional-encoding, en/sinusoidal-positional-encoding]
    disposition: integrate
    disposition_rationale: "The derivation is central to the advanced page and is explicitly separated from claims about learned behaviour."
  - id: vaswani-et-al-attention-is-all-you-need-2017:scaled-dot-product-attention
    kind: mechanism
    summary: "Scaled dot-product attention computes query–key dot products, divides the scores by the square root of the key dimension, applies softmax across keys for each query, and uses the resulting weights to form a weighted sum of value vectors. In matrix form: Attention(Q, K, V) = softmax(QK^T / sqrt(d_k)) V."
    locator: {type: section, value: "3.2.1", label: "Scaled Dot-Product Attention"}
    evidence:
      kind: formal-definition
      confidence: established
      scope: "The paper's prose and Equation (1) define the scaled dot-product attention operation; the softmax weights are applied to the value vectors."
      assumptions:
        - "Q and K use key dimension d_k; V uses value dimension d_v."
        - "Softmax is applied over the key positions for each query."
      limitations:
        - "The equation defines an attention computation, not mutual information between query and key variables."
        - "The paper does not interpret attention weights as Shannon entropy, semantic relevance, causal importance, or a lossless compression code."
        - "Masking is an optional operation shown in Figure 2 and is not written explicitly in Equation (1)."
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [mathematical-tools-geometry, probabilistic-foundations-training]
      tags: [topic:attention, topic:transformer]
      concept_ids: [query, key, value, attention-score, attention-weight, softmax, scaled-dot-product-attention, self-attention]
    candidate_destinations:
      pages: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention, fr/queries-keys-values, en/queries-keys-values]
      concepts: [query, key, value, attention-score, attention-weight, softmax, scaled-dot-product-attention, self-attention]
    disposition: integrate
    disposition_rationale: "Add the primary mathematical definition as a source-backed extraction item so the existing canonical concepts and computational attention nodes can be traversed to the exact paper section and equation without duplicating the concept graph."

  - id: vaswani-et-al-attention-is-all-you-need-2017:learned-qkv-projections
    kind: architecture
    summary: "The Transformer forms each attention head by applying distinct learned linear projections to queries, keys and values, producing per-head key/query and value dimensions; the head outputs are concatenated and projected again."
    locator: {type: section, value: "3.2.2", label: "Multi-Head Attention"}
    evidence:
      kind: formal-definition
      confidence: established
      scope: "Section 3.2.2 explicitly states that queries, keys and values are linearly projected h times with different learned matrices, gives the head_i equation and specifies the projection-matrix dimensions."
      assumptions:
        - "This is the paper's multi-head formulation; section 3.2.3 states that Q, K and V share the previous-layer source in self-attention."
      limitations:
        - "The page's XW_Q, XW_K, XW_V notation is a compact single-head specialization, not the exact multi-head equation as printed."
        - "The original paper's encoder-decoder and self-attention data flows should not be generalized to every modern architecture without checking its design."
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:qkv, topic:self-attention, topic:multi-head-attention]
      concept_ids: [query, key, value, multi-head-attention]
    candidate_destinations:
      pages: [fr/queries-keys-values, en/queries-keys-values]
      concepts: [query, key, value, multi-head-attention]
    disposition: integrate-by-reference
    disposition_rationale: "Provides an exact primary-source locator for the existing learned-projection explanation; no new page or concept is required."
