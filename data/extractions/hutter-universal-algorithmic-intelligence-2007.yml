      - {from: src-sequential-decision, type: contributes-to, to: src-aixi}
      - {from: src-aixi-tl, type: approximates, to: src-aixi}
    interpretation: "This graph separates shortest descriptions, universal prediction and active decision-making. The edges are editorially reconstructed from the report's formal development."
  learning_outcomes:
    - {status: inferred, outcome: "Define prefix Kolmogorov complexity relative to a universal machine and explain the additive-constant qualification.", basis: "Section 3.2."}
    - {status: inferred, outcome: "Explain why K is upper semicomputable but not computable.", basis: "Section 3.2."}
    - {status: inferred, outcome: "Distinguish the universal algorithmic mixture from shortest-program complexity.", basis: "Section 3.4."}
    - {status: inferred, outcome: "Explain how a universal predictor becomes an active reward-maximizing agent in AIXI.", basis: "Sections 3–4."}
    - {status: inferred, outcome: "Interpret the time and program-length bounds in AIXI(t,l).", basis: "Section 6."}
  assumed_prerequisites:
    - {status: inferred, topic: "Binary strings, programs and universal Turing machines.", basis: "The definition of K is expressed in terms of programs on a universal machine."}
    - {status: inferred, topic: "Basic probability and Bayesian mixtures.", basis: "The universal semimeasure and environment prior are central to the construction."}
    - {status: inferred, topic: "Sequential decision theory and expected reward.", basis: "The AIXI agent maximizes expected future reward."}
  teaching_route:
    - {order: 1, section: "Algorithmic information theory", function: define-description-complexity, moves: ["Define shortest program length", "Explain reference-machine invariance", "Establish noncomputability"]}
    - {order: 2, section: "Universal sequence prediction", function: build-universal-prior, moves: ["Introduce program-weighted mixture", "Relate the mixture to K", "Explain Solomonoff induction"]}
    - {order: 3, section: "The universal algorithmic agent", function: add-active-decision, moves: ["Introduce actions and percepts", "Define expected reward", "Replace the unknown environment prior with the universal mixture"]}
    - {order: 4, section: "Time-bounded AIXI", function: bound-computation, moves: ["Enumerate bounded candidate programs", "Introduce time and length limits", "Derive the exponential candidate factor"]}
  pedagogical_strengths:
    - "Builds AIXI from identifiable mathematical components rather than treating it as a standalone intelligence slogan."
    - "Makes the transition from passive sequence prediction to active decision-making explicit."
    - "Introduces a resource-bounded construction to address the gap between ideal theory and computability."
  pedagogical_limits:
    - "The report is mathematically dense and is not a self-contained beginner course in computability or sequential decision theory."
    - "The AIXI(t,l) construction is theoretical; its asymptotic bounds hide large constants and proof overhead."
    - "The ideal AIXI optimality claims depend on the formal environment class, reward criterion, horizon and reference machine."
