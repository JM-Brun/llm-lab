items:
  - id: hutter-universal-algorithmic-intelligence-2007:kolmogorov-complexity
    kind: definition
    summary: "Prefix Kolmogorov complexity K_U(x) is the length of the shortest program that makes a fixed universal prefix machine U output x."
    locator: {type: section, value: "3.2", label: "Algorithmic Information Theory"}
    evidence:
      kind: formal-definition
      confidence: established
      scope: "Definition of prefix Kolmogorov complexity relative to a universal prefix machine."
      assumptions: ["A reference universal prefix machine is fixed."]
      limitations: ["Values depend on the reference machine up to an additive constant."]
    disposition: integrate
    mapped_concepts: [kolmogorov-complexity]
    target_resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence]
  - id: hutter-universal-algorithmic-intelligence-2007:kolmogorov-uncomputability
    kind: result
    summary: "K is not finitely computable; it is co-enumerable/upper semicomputable, so enumerating candidate programs can improve an upper bound without certifying that the minimum has been reached."
    locator: {type: section, value: "3.2", label: "Algorithmic Information Theory"}
    evidence:
      kind: theorem-result
      confidence: established
      scope: "Computability status of Kolmogorov complexity."
      assumptions: ["Standard universal-machine formulation of Kolmogorov complexity."]
      limitations: ["The report's exposition is introductory; proofs rely on computability theory."]
    disposition: integrate
    mapped_concepts: [kolmogorov-complexity, resource-bounded-computation]
    target_resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence]
  - id: hutter-universal-algorithmic-intelligence-2007:solomonoff-mixture
    kind: mechanism
    summary: "The universal mixture weights minimal programs by 2 to the negative program length and aggregates their support for an output prefix; it is a semimeasure closely related to K."
    locator: {type: section, value: "3.4", label: "Algorithmic Probability and Universal Induction"}
    evidence:
      kind: formal-construction
      confidence: established
      scope: "Universal algorithmic probability and its relation to shortest descriptions."
      assumptions: ["A universal monotone/prefix machine and corresponding minimal-program convention."]
      limitations: ["The universal mixture is not computable exactly and is not generally a normalized probability measure."]
    disposition: integrate
    mapped_concepts: [algorithmic-probability, solomonoff-induction, kolmogorov-complexity]
    target_resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence]
  - id: hutter-universal-algorithmic-intelligence-2007:aixi-agent
    kind: mechanism
    summary: "AIXI replaces the unknown environment prior in sequential decision theory with a universal Solomonoff mixture and chooses actions to maximize expected future reward."
    locator: {type: section, value: "4", label: "The Universal Algorithmic Agent AIXI"}
    evidence:
      kind: formal-construction
      confidence: established
      scope: "Construction of the idealized universal algorithmic agent."
      assumptions: ["Computable environment class, specified reward criterion and formal horizon/discount setup."]
      limitations: ["The ideal AIXI agent is uncomputable and its optimality is relative to the formal setup."]
    disposition: integrate
    mapped_concepts: [aixi, solomonoff-induction, sequential-decision-theory]
    target_resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence]
  - id: hutter-universal-algorithmic-intelligence-2007:aixi-tl-bound
    kind: result
    summary: "The detailed AIXI(t,l) construction is computable under candidate time and program-length bounds, with per-cycle computation of order t times 2^l; the exponential program-count factor prevents practical use at substantial l."
    locator: {type: section, value: "6", label: "Time-Bounded AIXI Model"}
    evidence:
      kind: theorem-result
      confidence: established
      scope: "Asymptotic per-interaction-cycle complexity of the resource-bounded construction."
      assumptions: ["The candidate program length and per-cycle time are bounded as specified by Hutter."]
      limitations: ["Very large hidden constants; this report's later proof-validated formulation adds a separate proof-length setup cost."]
    disposition: integrate
    mapped_concepts: [aixi-tl, aixi, resource-bounded-computation]
    target_resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence]
