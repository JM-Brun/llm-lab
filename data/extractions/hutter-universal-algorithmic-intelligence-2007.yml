  source_graph:
    nodes:
      - {id: src-kolmogorov-complexity, kind: mathematical-object, description: "Length of the shortest program producing an object on a fixed universal machine, up to an additive machine-dependent constant.", locator: "Section 3.2"}
      - {id: src-universal-semimeasure, kind: probability-model, description: "Universal mixture assigning weight 2^-length(program) to minimal programs generating an output prefix.", locator: "Section 3.4"}
      - {id: src-solomonoff-induction, kind: method, description: "Sequential prediction using the universal algorithmic mixture.", locator: "Section 3"}
      - {id: src-sequential-decision, kind: framework, description: "Choose actions to maximize expected future reward under a probabilistic environment model.", locator: "Sections 2 and 4"}
      - {id: src-aixi, kind: theoretical-agent, description: "Combines the universal Solomonoff mixture with sequential reward maximization.", locator: "Section 4"}
      - {id: src-aixi-tl, kind: bounded-agent, description: "Computable resource-bounded construction comparing candidate programs/policies under time and length bounds.", locator: "Section 6"}
