  decision_summary: "ColBERTv2 combines the original MaxSim late-interaction architecture with denoised cross-encoder supervision and centroid-plus-residual vector compression. It introduces LoTTE to test natural long-tail queries and reports a 6–10x MS MARCO index-footprint reduction, with strong but not uniformly dominant results across BEIR, Wikipedia Open QA and LoTTE. All results are English, models are trained on MS MARCO, benchmark judgments have known limitations, and the storage ratio is configuration-specific."
