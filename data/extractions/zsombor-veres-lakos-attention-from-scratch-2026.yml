      - "Page 1 identifies title, author, publication date and the author's LLM-assisted review/editing disclosure."
    limitations:
      - "Complete only for the supplied PDF export; live-page edits, comments and linked resources were not inspected."
      - "No executable code or dataset appears in the PDF."
      - "The page-11 matrix is credited as Figure 3.11 from Sebastian Raschka's Build a Large Language Model (From Scratch); original asset and reuse rights were not inspected."
      - "No licence or reproduction permission was established; retain link-only."
  source_graph:
    nodes:
      - {id: src-state, kind: input-matrix, description: "X records known and needed Python/design competencies for each participant.", locator: "pp. 1–2"}
      - {id: src-wq, kind: learned-projection, description: "W_Q selects the competencies each participant needs.", locator: "pp. 2–3"}
      - {id: src-wk, kind: learned-projection, description: "W_K selects the competencies each participant can offer.", locator: "pp. 3–4"}
      - {id: src-wv, kind: learned-projection, description: "W_V maps offered knowledge to transmissible information, with toy absorption rates.", locator: "pp. 6–7"}
      - {id: src-q, kind: representation, description: "Q = X W_Q represents what each participant seeks.", locator: "p. 3"}
      - {id: src-k, kind: representation, description: "K = X W_K represents what each participant offers.", locator: "p. 4"}
      - {id: src-v, kind: representation, description: "V = X W_V represents information each participant can transmit.", locator: "p. 7"}
      - {id: src-scores, kind: intermediate, description: "S = 10 Q K^T; rows are attention payers/queries and columns are recipients/keys.", locator: "pp. 4–5"}
      - {id: src-weights, kind: intermediate, description: "P = row-wise softmax(S); each row sums to one, including a uniform row for equal zero logits.", locator: "pp. 5–6"}
      - {id: src-context, kind: intermediate, description: "P V aggregates value vectors according to attention weights.", locator: "p. 8"}
      - {id: src-wo, kind: learned-projection, description: "W_O maps context from the value-feature space back to the four-dimensional toy state space.", locator: "p. 8"}
      - {id: src-delta, kind: state-update, description: "Delta X = (P V) W_O is added to X to form X_new.", locator: "pp. 8–9"}
      - {id: src-residual-stream, kind: representation, description: "The toy state is mapped to GPT's residual stream: token-position states in the model embedding space.", locator: "p. 10"}
      - {id: src-causal-mask, kind: constraint, description: "The article says its attention illustration omits GPT's restriction to the current and earlier tokens.", locator: "p. 11"}
      - {id: src-mha, kind: architecture, description: "Multi-head attention is explicitly left outside the article's scope.", locator: "p. 12"}
    edges:
      - {from: src-state, type: projected-by, to: src-wq}
      - {from: src-state, type: projected-by, to: src-wk}
      - {from: src-state, type: projected-by, to: src-wv}
