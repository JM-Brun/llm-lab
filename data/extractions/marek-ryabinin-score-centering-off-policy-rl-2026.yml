canonical_mapping:
  proposed_concepts:
    - id: policy-gradient
      definition: "Gradient estimator for optimizing expected reward under a parameterized policy."
      rationale: "Prerequisite for understanding the score-function term and its role in RL updates."
    - id: score-function
      definition: "Gradient of the log probability of an action under a parameterized policy."
      rationale: "Mathematical object centered by the method; disambiguate from attention scores."
    - id: off-policy-reinforcement-learning
      definition: "Learning from trajectories sampled by a behavior policy different from the policy being optimized."
      rationale: "Names the training setting in which the mismatch appears."
    - id: training-inference-mismatch
      definition: "Difference between the effective token/action distributions used to generate rollouts and to compute training updates."
      rationale: "Connects serving/inference implementation choices with RL optimization."
    - id: score-centering
      definition: "Additive correction that removes the sampler-expected trainer-score drift component in off-policy policy-gradient updates."
      rationale: "Names the paper's central method."
    - id: importance-sampling
      definition: "Reweighting samples to correct expectations under a target distribution when data were drawn from another distribution."
      rationale: "Necessary comparator; not equivalent to score centering."
  proposed_relations:
    - "policy-gradient uses score-function"
    - "off-policy-reinforcement-learning creates training-inference-mismatch"
    - "training-inference-mismatch can induce policy-drift"
    - "score-centering corrects score-function drift"
    - "importance-sampling reweights off-policy samples"
    - "score-centering composes with compatible importance-sampling corrections"
  route_implications:
    - "Future advanced RL/post-training path: policy gradient → score function and zero-mean identity → on-policy vs off-policy sampling → training-inference mismatch and drift → score centering → importance-sampling comparison → implementation/top-k approximation."
    - "Do not add this to the core eight-stage predictive spine or the Transformer attention path."
  decision_summary: "The source cluster establishes a high-value advanced topic at the intersection of probabilistic policy gradients, asynchronous/off-policy LLM training and inference-engine numerics. The full-text mirror supports the per-prefix correction equation, residual covariance interpretation, distinction from group reward centering, selected experiment qualifications and top-k approximation. Canonical PDF/appendix verification and official test execution remain open. The Cameron Wolfe article itself remains partially scanned because its canonical Substack body was not retrievable; its content must not be conflated with the primary paper."
