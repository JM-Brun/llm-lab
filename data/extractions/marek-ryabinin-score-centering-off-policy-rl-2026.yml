  - id: marek-ryabinin-score-centering-off-policy-rl-2026:empirical-boundaries
    kind: limitation
    summary: "In a severe Qwen3-30B-A3B-Base sampler configuration (INT8 weights/activations and INT4 KV cache), the rendering reports 30% training accuracy for score centering versus 12% for TIS, with other methods below 5%; training accuracy is mean reward on sampled rollouts, not held-out benchmark accuracy. Under milder FP8 mismatch plain policy gradient can remain stable. In Qwen3-0.6B Countdown with sampler refresh every 64 steps, score centering combined with TIS/MIS performs best in the reported staleness comparison. Seed counts vary across some experiments."
    locator: {type: section, value: "Canonical arXiv PDF, §5 and Appendix B, pp. 5–9 and 13–16, Figures 1–5 and Tables 1–2", label: "Experimental comparisons and limitations"}
    evidence:
      kind: primary-paper-fulltext-mirror
