  - id: marek-ryabinin-score-centering-off-policy-rl-2026:score-centering-equation
    kind: derivation
    summary: "At prefix h, let p_theta(.|h) be the trainer distribution and q(.|h) the rollout sampler distribution. For token v, the trainer score is s_v = grad_theta log p_theta(v|h), and the sampler-expected trainer score is s_bar = E_{v~q(.|h)}[s_v]. Score centering replaces s_v by s_tilde_v = s_v - s_bar. Therefore E_q[s_tilde_v|h] = 0. With a reward/advantage A, the remaining expected update is the reward-score covariance under q; it is not in general the covariance under p_theta."
    locator: {type: section, value: "alphaXiv full-text rendering, p. 5; arXiv:2609.20807", label: "Update decomposition and score-centering equation"}
    evidence:
      kind: primary-paper-fulltext-mirror
      confidence: well-supported
      scope: "The per-prefix score-centering definition, zero sampler expectation and residual reward-score covariance described in the rendered paper text."
      assumptions: ["The sampler distribution q(.|h) and trainer distribution p_theta(.|h) are defined on the relevant token support.", "The expectation and gradient terms are well-defined."]
      limitations: ["The alphaXiv rendering is a secondary full-text mirror; the canonical arXiv PDF was not directly fetched in this pass."]
    technical_assessment:
      status: qualified
      rationale: "The method equation and interpretation are available in the full-text rendering; claims about exact theorem assumptions remain bounded by that rendering."
      corroborating_sources: ["https://arxiv.org/abs/2609.20807", "https://www.alphaxiv.org/abs/2609.20807"]
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [inference-efficiency]
      tags: [topic:score-centering, topic:policy-drift, method:score-function]
      concept_ids: []
