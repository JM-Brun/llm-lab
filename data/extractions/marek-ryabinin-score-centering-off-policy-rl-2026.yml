  - id: marek-ryabinin-score-centering-off-policy-rl-2026:group-reward-centering-distinction
    kind: distinction
    summary: "Group-centering rewards/advantages and score centering are different operations. Group-centering makes advantages sum to zero across a prompt's rollouts; it does not guarantee that the expected advantage is zero at every prefix. Score centering instead subtracts the sampler-expected trainer score at each prefix."
    locator: {type: section, value: "alphaXiv full-text rendering, p. 5; arXiv:2609.20807", label: "Group-centered rewards versus score centering"}
    evidence:
      kind: primary-paper-fulltext-mirror
      confidence: well-supported
      scope: "Explicit distinction between reward/advantage centering and score centering."
      assumptions: []
      limitations: ["Exact notation for group construction should be checked against the canonical PDF before reproducing the full derivation."]
    technical_assessment:
