  - id: marek-ryabinin-score-centering-off-policy-rl-2026:score-centering-equation
    kind: derivation
    summary: "At prefix h, let p_theta(.|h) be the trainer distribution and q(.|h) the rollout sampler distribution. For token v, the trainer score is s_v = grad_theta log p_theta(v|h), and the sampler-expected trainer score is s_bar = E_{v~q(.|h)}[s_v]. Score centering replaces s_v by s_tilde_v = s_v - s_bar. Therefore E_q[s_tilde_v|h] = 0. With a reward/advantage A, the remaining expected update is the reward-score covariance under q; it is not in general the covariance under p_theta."
    locator: {type: section, value: "Canonical arXiv PDF, §4, pp. 4–5, Eqs. (3)–(5)", label: "Update decomposition and score-centering equation"}
    evidence:
      kind: primary-paper-fulltext-mirror
      confidence: well-supported
      scope: "The per-prefix score-centering definition, zero sampler expectation and residual reward-score covariance described in the rendered paper text."
      assumptions: ["The sampler distribution q(.|h) and trainer distribution p_theta(.|h) are defined on the relevant token support.", "The expectation and gradient terms are well-defined."]
      limitations: ["The paper's derivation is algebraic and does not provide a separately formalized theorem/proof; the residual covariance is measured under q, not p."]
    technical_assessment:
      status: qualified
      rationale: "The method equation and interpretation are available in the full-text rendering; claims about exact theorem assumptions remain bounded by that rendering."
      corroborating_sources: ["https://arxiv.org/pdf/2609.20807v1", "https://github.com/martin-marek/score-centering"]
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [inference-efficiency]
      tags: [topic:score-centering, topic:policy-drift, method:score-function]
      concept_ids: [score-centering, score-function, off-policy-reinforcement-learning]
    candidate_destinations:
      pages: [fr/score-centering, en/score-centering]
      concepts: [score-function, score-centering, off-policy-reinforcement-learning]
      route_ids: []
    disposition: integrate
    disposition_rationale: "This is the central equation and should appear in the advanced conceptual lesson, with the distribution q explicitly named."
  - id: marek-ryabinin-score-centering-off-policy-rl-2026:group-reward-centering-distinction
    kind: misconception
    summary: "Group-centering rewards/advantages and score centering are different operations. Group-centering makes advantages sum to zero across a prompt's rollouts; it does not guarantee that the expected advantage is zero at every prefix. Score centering instead subtracts the sampler-expected trainer score at each prefix."
    locator: {type: section, value: "Canonical arXiv PDF, §3–4, pp. 3–5, Eqs. (3)–(5) and footnotes 3–4", label: "Group-centered rewards versus score centering"}
    evidence:
      kind: primary-paper-fulltext-mirror
      confidence: well-supported
      scope: "Explicit distinction between reward/advantage centering and score centering."
      assumptions: []
      limitations: ["Group centering is defined per prompt's rollout group; it does not imply zero expected advantage at every individual prefix."]
    technical_assessment:
      status: correct
      rationale: "The paper explicitly distinguishes the two centering operations; this is important for GRPO-oriented readers."
      corroborating_sources: ["https://arxiv.org/pdf/2609.20807v1"]
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [mathematical-tools-geometry]
      tags: [topic:advantage-estimation, topic:group-relative-policy-optimization, topic:score-centering]
      concept_ids: [score-centering]
    candidate_destinations:
      pages: [fr/score-centering, en/score-centering]
      concepts: [score-centering]
      route_ids: []
    disposition: integrate
    disposition_rationale: "Zero-sum group advantages do not cancel the per-prefix sampler-expected score."
  - id: marek-ryabinin-score-centering-off-policy-rl-2026:topk-and-compute
    kind: implementation-pattern
    summary: "The practical approximation transmits sampler top-k log-probabilities and reconstructs the remaining tail by assuming it is proportional to the trainer distribution, scaled to match sampler tail mass. The rendering reports top-k values of 32 or 128 as close to full-vocabulary centering in tested settings; the README defaults to k=128. It reports top-128 covering more than 99.9% of sampler mass in most tested configurations and under-1% added overhead in the authors' matched-hardware setup; overhead was not measured for vLLM or SGLang."
    locator: {type: section, value: "Canonical arXiv PDF, §4.1 and Appendix A.1/A.4, pp. 5 and 11–13, Eqs. (6)–(8), Figure 5", label: "Top-k approximation and efficiency"}
    evidence:
      kind: primary-paper-mirror-and-official-implementation
      confidence: context-dependent
      scope: "Top-k data contract, tail approximation and reported overhead."
      assumptions: ["The tail approximation q_tail proportional to p_tail is adequate for the relevant distribution and regime."]
      limitations: ["The paper reports top-128 sampler-mass coverage above 99.9% on average except the 30B INT8 W/A + INT4 KV setting (99.45% average, 95.8% worst batch). k=32 and k=128 match full-vocabulary centering in tested settings; this is not a guarantee outside those settings. Overhead was not measured for vLLM or SGLang."]
    technical_assessment:
      status: qualified
      rationale: "The estimator contract is corroborated by the official README; performance numbers retain their original measurement scope."
      corroborating_sources: ["https://github.com/martin-marek/score-centering", "https://arxiv.org/pdf/2609.20807v1"]
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [inference-efficiency]
      tags: [method:top-k-approximation, topic:vocabulary-tail, topic:inference-overhead]
      concept_ids: [score-centering]
    candidate_destinations:
      pages: [fr/score-centering, en/score-centering]
      concepts: [score-centering, log-probability]
