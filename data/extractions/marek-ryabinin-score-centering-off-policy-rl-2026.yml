  - id: marek-ryabinin-score-centering-off-policy-rl-2026:score-function-zero-mean
    kind: derivation
    summary: "For a policy sampled from its own distribution, the expected score function is zero: E_{a~p_theta(.|x)}[∇_theta log p_theta(a|x)] = 0, assuming the usual regularity conditions that permit exchanging differentiation and integration/summation. Under a different sampler distribution q, the trainer score ∇_theta log p_theta evaluated on q-sampled actions need not have zero expectation."
    locator: {type: section, value: "Canonical arXiv PDF, §4, pp. 3–5, Eqs. (3)–(5)", label: "Score-function centering principle"}
    evidence:
      kind: mathematical-property-cross-checked
      confidence: well-supported
      scope: "The zero-expected-score property and its relevance to off-policy mismatch."
      assumptions: ["p_theta is a normalized differentiable categorical policy over the action/token support.", "Differentiation and summation may be interchanged."]
      limitations: ["The manuscript gives an algebraic derivation rather than a formal theorem with a separately enumerated assumption list; regularity follows from the normalized finite categorical policy and well-defined expectations."]
    technical_assessment:
      status: qualified
      rationale: "The canonical PDF derives the per-prefix identity and distinguishes the sampler-distribution residual covariance from the trainer-distribution covariance; no stronger theorem claim is made."
      corroborating_sources: ["https://arxiv.org/abs/2609.20807", "https://github.com/martin-marek/score-centering"]
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [mathematical-tools-geometry]
      tags: [topic:score-function, topic:policy-gradient, method:score-centering]
      concept_ids: [score-function, policy-gradient]
    candidate_destinations:
      pages: [fr/score-centering, en/score-centering]
      concepts: [score-function, policy-gradient]
      route_ids: []
    disposition: integrate
    disposition_rationale: "The zero-mean score identity is the mathematical prerequisite that makes the correction intelligible; teach it before the method rather than as a memorized trick."
  - id: marek-ryabinin-score-centering-off-policy-rl-2026:drift-correction
    kind: mechanism
    summary: "Score centering adds a correction that subtracts the sampler-expected trainer score contribution responsible for off-policy drift. The intended separation is between the reward-correlated learning signal and a drift component that can pull the trainer toward the sampler independently of which sampled actions earned reward."
    locator: {type: section, value: "arXiv abstract; official repository README; authors' public method explanation", label: "Score-centering mechanism"}
    evidence:
      kind: author-method-description
      confidence: well-supported
      scope: "High-level purpose and mechanism of score centering."
      assumptions: ["The sampler's relevant probability information is available or estimated."]
      limitations: ["The top-k implementation approximates the sampler tail using a rescaled trainer tail; the CPU test run is qualified because the available JAX version is below the upstream README's declared minimum. Large-scale experiments were not reproduced."]
    technical_assessment:
      status: qualified
      rationale: "The correction's purpose is explicit in the paper abstract and official repository; implementation-level derivation remains pending."
      corroborating_sources: ["https://github.com/martin-marek/score-centering"]
