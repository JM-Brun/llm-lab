  decision_summary: "Ahia et al. adds a distinct user-facing and socio-economic dimension to multilingual tokenization: token counts affect API bills and the number of in-context examples that fit, not just compression metrics. The paper also connects those effects to language-level affordability proxies. Preserve the 2023 model/pricing context and the ecological nature of the socio-economic correlations; no new canonical concept or route step is warranted."
