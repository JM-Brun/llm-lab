    disposition: integrate-by-reference
    disposition_rationale: "Adds a distinct social-accessibility perspective that is not captured by tokenizer compression metrics alone; preserve its ecological and historical scope."
  - id: ahia-do-all-languages-cost-the-same-2023:reproducibility-and-generalization-limits
    kind: limitation
    summary: "The study's downstream evaluation uses closed ChatGPT models whose weights and training data are unavailable and may change, estimates training-language proportions from CC100, and uses translated FLORES-200 text for the cross-language token-count comparison."
    locator: {type: section, value: "Limitations, p. 9912; §4.1 and §8", label: "Reproducibility and generalization limits"}
    evidence:
      kind: author-stated-limitations
      confidence: established
      scope: "The paper's commercial API analysis and cross-language evaluation design."
      assumptions: []
      limitations:
        - "The open-tokenizer cost analysis is more reproducible than the closed-model downstream evaluation."
        - "The paper's conclusions concern the model/API versions available at the time of the 2023 study."
        - "CC100 is a proxy for unknown ChatGPT training-language proportions, not verified training data."
    technical_assessment:
      status: correct
      rationale: "These limitations are explicitly acknowledged by the authors and materially constrain reproducibility and generalization."
      corroborating_sources: []
    classification:
      primary_theme: text-tokenization
      tags: [topic:reproducibility, topic:multilingual-tokenization, application:api-cost]
      concept_ids: [token]
    candidate_destinations:
      pages: [en/tokenizer-design-evaluation, fr/tokenizer-design-evaluation]
      concepts: []
      route_ids: []
    disposition: already-covered
    disposition_rationale: "The advanced lesson already treats the results as historically scoped; the extraction adds the exact reproducibility caveats."
canonical_mapping:
  proposed_concepts: []
