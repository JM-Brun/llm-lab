      concepts: []
      route_ids: []
    disposition: clarify
    disposition_rationale: "Use the structural distinction, but pair parameter reduction with a hardware-aware distinction between theoretical sparsity and realized latency/throughput."
  - id: sasirekha-cota-understanding-llm-compression-2023:quantization
    kind: mechanism
    summary: "Quantization represents weights and/or activations with lower numerical precision; post-training quantization is applied after training, while quantization-aware training exposes the model to quantization effects during training."
    locator: {type: section, value: "Quantization", label: "PTQ, QAT, calibration and mixed precision"}
    evidence:
      kind: technical-explanation
      confidence: established
      scope: "The article introduces PTQ, dynamic-range quantization, float16 and QAT."
      assumptions: []
      limitations: ["The article's 4x size reduction and 2x–3x speedup statements are not universal guarantees; they depend on bit width, quantized tensors, metadata, kernels, hardware and workload. Weight-only quantization is not the same as W8A8 quantization. Activation outliers and calibration data can materially affect quality."]
    classification:
      primary_theme: inference-efficiency
      secondary_themes: [mathematical-tools-geometry]
      tags: [method:quantization, topic:post-training-quantization, topic:quantization-aware-training]
      concept_ids: []
    candidate_destinations:
      pages: [fr/llm-computational-complexity, en/llm-computational-complexity]
      concepts: []
      route_ids: []
    disposition: correct
    disposition_rationale: "Retain the PTQ/QAT distinction; replace blanket compression/speedup figures with benchmark-scoped claims and distinguish weights, activations and KV cache."
  - id: sasirekha-cota-understanding-llm-compression-2023:knowledge-distillation
    kind: mechanism
    summary: "Knowledge distillation trains a smaller student to reproduce selected behavior or representations of a teacher, using one or more distillation objectives."
    locator: {type: section, value: "Knowledge Distillation", label: "Teacher–student transfer and black-box/white-box KD"}
    evidence:
      kind: technical-explanation
      confidence: established
      scope: "The article distinguishes black-box from white-box teacher access and gives DistilBERT as an example."
      assumptions: []
      limitations: ["Distillation does not automatically preserve all teacher capabilities or guarantee generalization; results depend on task, student capacity, data, losses and evaluation. Teacher access and output-use restrictions are licensing and governance questions, not merely technical choices."]
    classification:
      primary_theme: inference-efficiency
      secondary_themes: [probabilistic-foundations-training]
      tags: [method:knowledge-distillation, topic:teacher-student-learning]
      concept_ids: []
