  - id: sasirekha-cota-understanding-llm-compression-2023:pruning
    kind: mechanism
    summary: "Pruning removes or suppresses parameters or larger model structures; structured pruning removes organized components, while unstructured pruning targets individual weights and creates irregular sparsity."
    locator: {type: section, value: "Pruning", label: "Structured and unstructured pruning"}
    evidence:
      kind: technical-explanation
      confidence: established
      scope: "The distinction between structured and unstructured pruning is standard; SparseGPT is cited as a one-shot example."
      assumptions: []
      limitations: ["Zeroing weights does not guarantee faster inference: benefits depend on sparsity pattern, sparse-kernel support, memory layout and hardware. SparseGPT's reported results are specific to evaluated models and perplexity settings."]
    classification:
      primary_theme: inference-efficiency
      secondary_themes: [architectures-mechanisms]
      tags: [method:pruning, topic:sparsity]
      concept_ids: []
    candidate_destinations:
