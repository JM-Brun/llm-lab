  - id: schmidt-tokenization-more-than-compression-2024:corpus-token-count-not-sufficient
    kind: result
    summary: "Across the reported experimental settings, the authors find no clear relationship between corpus token count and downstream accuracy; changing tokenizer stages can change accuracy even when corpus token count alone does not explain the result."
    locator: {type: section, value: "§5.3, pp. 683–684; Figure 3 and Table 2; §7, p. 685", label: "CTC versus downstream accuracy"}
    evidence:
      kind: reported-experimental-result
      confidence: well-supported
      scope: "The paper's English Pile/MiniPile experiments, evaluated tokenizer variants, model sizes and ten multiple-choice tasks."
      assumptions: []
      limitations:
        - "The authors note confounding factors including pre-tokenization, vocabulary initialization and differing token counts/computational opportunities."
        - "The task suite is finite and the results are not a universal ranking of tokenizers."
        - "The paper reports a Pearson correlation of 0.241 between CTC and average accuracy in the summarized comparison, not evidence of a strong general relationship."
    technical_assessment:
      status: qualified
      rationale: "The results challenge a simple compression-only explanation but do not prove that compression is never useful."
      corroborating_sources: []
