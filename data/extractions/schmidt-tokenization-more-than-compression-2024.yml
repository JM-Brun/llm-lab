  - id: schmidt-tokenization-more-than-compression-2024:pathpiece-minimum-token-segmentation
    kind: method
    summary: "PathPiece finds a minimum-token segmentation for a fixed vocabulary by shortest-path dynamic programming over byte positions; its vocabulary-construction procedure then heuristically removes tokens to reduce corpus token count."
    locator: {type: section, value: "§3.1–3.2, pp. 680–681; Algorithm 1", label: "PathPiece segmentation and vocabulary construction"}
    evidence:
      kind: algorithm-description
      confidence: established
      scope: "The PathPiece method proposed in this paper, with a maximum token width of 16 bytes in the described segmentation algorithm."
      assumptions: []
      limitations:
        - "Minimum token count is conditional on the supplied vocabulary and the algorithm's byte-width constraint."
        - "The vocabulary-construction stage is heuristic and distinct from the exact shortest-path segmentation step."
    technical_assessment:
      status: correct
      rationale: "The paper distinguishes shortest-path segmentation from the top-down vocabulary construction heuristic."
      corroborating_sources: []
