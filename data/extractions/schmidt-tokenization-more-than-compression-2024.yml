  decision_summary: "The paper challenges the hypothesis that fewer tokens alone improve downstream performance. Its main contribution is a controlled analysis of pre-tokenization, vocabulary construction and segmentation; preserve the English-only and task/model limits, and treat its results as a counterpoint to Goldman et al. rather than a universal refutation."
