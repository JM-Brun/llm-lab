      confidence: context-dependent
      scope: "Informal description of computationally bounded or model-class-relative information."
      assumptions: ["A precise V-information formulation requires a specified predictive family and task."]
      limitations: ["The article does not define the functional or its estimator.", "The proposed comparison between self-attention and bag-of-words is not demonstrated in a controlled experiment."]
    classification:
