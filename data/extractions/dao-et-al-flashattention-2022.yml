schema_version: 1
source_id: dao-et-al-flashattention-2022
items:
  - id: dao-et-al-flashattention-2022:exact-io-aware-attention
    kind: mechanism
    summary: "FlashAttention computes exact dense softmax attention using tiling to reduce reads and writes between GPU high-bandwidth memory (HBM) and on-chip SRAM, avoiding materialization of the full attention score and probability matrices in HBM."
    locator: {type: section, value: "Abstract; Sections 3.1–3.2", label: "Exact IO-aware attention and IO-complexity analysis"}
    evidence:
      kind: primary-paper
      confidence: established
      scope: "The abstract describes the IO-aware exact algorithm; Section 3.1 gives the tiled algorithm and Theorem 1; Section 3.2 gives the IO-complexity analysis."
      assumptions:
        - "The exactness claim concerns the dense attention operation defined by the paper and its stated algorithm."
        - "IO complexity is measured in HBM accesses under the paper's two-level memory model with on-chip SRAM capacity M."
      limitations:
        - "Mathematical exactness does not imply bitwise-identical floating-point outputs across implementations."
        - "The algorithm retains O(N^2 d) arithmetic FLOPs; its principal asymptotic advantage is reduced HBM traffic and additional memory."
        - "The paper's separate block-sparse extension is approximate and must not be merged into the exact dense algorithm claim."
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [inference-efficiency, mathematical-tools-geometry]
      tags: [topic:attention, topic:flashattention, method:io-aware-computation]
      concept_ids: [self-attention, scaled-dot-product-attention, attention-score, attention-weight, softmax]
    candidate_destinations:
      pages: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
      concepts: [self-attention, scaled-dot-product-attention, attention-score, attention-weight, softmax]
    disposition: integrate
    disposition_rationale: "Provide a primary-source evidence anchor for the existing FlashAttention source review and computational attention path; do not create a FlashAttention concept node."

  - id: dao-et-al-flashattention-2022:online-softmax-tiling
    kind: mechanism
    summary: "The tiled algorithm maintains running row maxima, rescaled exponential sums and weighted-value accumulators so softmax and value aggregation can be combined across key/value blocks without materializing the full attention matrix."
    locator: {type: section, value: "3.1, Algorithm 1, lines 8–13", label: "Tiling and online softmax"}
    evidence:
      kind: primary-paper
      confidence: established
      scope: "Section 3.1 derives the merge of per-block softmax statistics and specifies the update in Algorithm 1."
      assumptions:
        - "Partial statistics are rescaled to a common running maximum before being combined."
        - "The same attention inputs, mask semantics and scaling are used across blocks."
      limitations:
        - "The recurrence is a computational aggregation mechanism, not a source-coding scheme or information bottleneck."
        - "Implementation details for dropout and backward computation are treated separately in the paper and appendices."
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [mathematical-tools-geometry, inference-efficiency]
      tags: [topic:attention, topic:flashattention, method:online-softmax]
      concept_ids: [softmax, attention-weight, scaled-dot-product-attention]
    candidate_destinations:
      pages: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
      concepts: [softmax, attention-weight, scaled-dot-product-attention]
    disposition: integrate
    disposition_rationale: "Ground the existing source-local online-softmax reconstruction in the primary algorithm and exact section locator."

  - id: dao-et-al-flashattention-2022:io-complexity
    kind: result
    summary: "Under the paper's two-level memory model and stated SRAM-size range, Theorem 2 gives Θ(Nd + N²) HBM accesses for standard attention and Θ(N²d²M⁻¹) for FlashAttention; Proposition 3 gives a matching lower-bound statement over the stated range of M."
    locator: {type: section, value: "3.2, Theorem 2 and Proposition 3", label: "IO complexity and lower bound"}
    evidence:
      kind: theorem
      confidence: established
      scope: "The asymptotic HBM-access results under the paper's assumptions and notation."
      assumptions:
        - "N is sequence length, d is head dimension and M is SRAM size."
        - "The stated range d ≤ M ≤ Nd applies."
      limitations:
        - "The asymptotic IO bound is not a universal wall-clock speedup prediction."
        - "Hardware, kernel implementation, tensor shape, dtype and workload determine observed latency."
    classification:
      primary_theme: mathematical-tools-geometry
      secondary_themes: [architectures-mechanisms, inference-efficiency]
      tags: [topic:flashattention, method:io-complexity]
      concept_ids: [scaled-dot-product-attention]
    candidate_destinations:
      pages: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
      concepts: [scaled-dot-product-attention]
    disposition: integrate
    disposition_rationale: "Preserve the theorem's assumptions and prevent IO complexity from being mistaken for arithmetic complexity or a universal runtime claim."

  - id: dao-et-al-flashattention-2022:block-sparse-extension
    kind: limitation
    summary: "The paper's block-sparse FlashAttention extension skips blocks according to a predefined block-sparsity mask and is an approximate attention algorithm, distinct from the exact dense FlashAttention algorithm."
    locator: {type: section, value: "3.3, Proposition 4", label: "Block-sparse FlashAttention"}
    evidence:
      kind: primary-paper
      confidence: established
      scope: "Section 3.3 defines the block-sparse extension and its IO complexity."
      assumptions:
        - "The block-sparsity mask is predefined and has the block structure specified in the paper."
      limitations:
        - "Do not generalize properties of the block-sparse extension to exact dense FlashAttention."
        - "Approximation quality and speed depend on the sparsity pattern and workload."
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [inference-efficiency]
      tags: [topic:attention, topic:flashattention, method:block-sparse-attention]
      concept_ids: [self-attention, scaled-dot-product-attention, attention-mask]
    candidate_destinations:
      pages: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention, fr/causal-masking, en/causal-masking]
      concepts: [self-attention, scaled-dot-product-attention, attention-mask]
    disposition: clarify
    disposition_rationale: "Make the exact-versus-approximate boundary explicit so the source's block-sparse extension is not conflated with its exact dense algorithm."
