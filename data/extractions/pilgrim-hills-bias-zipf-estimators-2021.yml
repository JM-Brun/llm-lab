  - id: pilgrim-hills-bias-zipf-estimators-2021:maximum-likelihood-bias
    kind: limitation
    summary: "The paper argues that common maximum-likelihood estimators for power laws can be biased when applied to rank-frequency data because their likelihood assumes an a priori ordering, whereas lexical ranks are inferred from the same observed frequencies. The authors derive a likelihood that accounts for possible rank permutations, but its computation scales factorially and is intractable for realistic vocabularies."
    locator: {type: section, value: "Abstract; Introduction; Model, Eqs. 3–6", label: "Likelihood and rank-estimation bias"}
    evidence:
      kind: mathematical-derivation-and-simulation
      confidence: well-supported
      scope: "The estimator setup and simulated rank-frequency data studied in the paper."
      assumptions: ["The event set and sampling model are specified as in the paper."]
      limitations: ["The exact likelihood's intractability is discussed for the paper's general model; the paper explores approximations rather than a universally exact practical estimator."]
    technical_assessment:
      status: not-reviewed
      rationale: "Mathematical argument recorded from the paper; no independent derivation or code audit."
      corroborating_sources: []
    pedagogical_profile:
      learner_question: "Why is estimating the Zipf exponent statistically harder than drawing a straight line?"
      explanatory_lens: mismatch between assumed and observed ranking process
      teaching_form: [formal-distinction, derivation, limitation]
      abstraction_level: advanced
      prerequisites: ["maximum likelihood", "permutations", "sampling models"]
      distinctive_value: "Shows that fitting an exponent is not just a regression problem because ranks are data-derived."
      limitations: ["Detailed likelihood derivation is beyond the introductory audience."]
    pedagogical_assessment:
      novelty: {level: high, rationale: "No current lesson explains the likelihood assumption behind common exponent estimators."}
      complementarity: {level: high, rationale: "Adds a rigorous estimation perspective beyond the visual warning in Piantadosi."}
      pedagogical_value: {level: moderate, rationale: "Most valuable for mathematically prepared readers and careful experimental design."}
      applicability: {level: moderate, rationale: "Optional Deepen note or an advanced exercise, not core story content."}
      redundancy: {level: low, rationale: "This estimator derivation is absent from the current page."}
      evidence_quality: {level: high, rationale: "Peer-reviewed derivation and controlled simulation, with explicit assumptions."}
