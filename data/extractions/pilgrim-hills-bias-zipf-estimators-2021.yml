items:
  - id: pilgrim-hills-bias-zipf-estimators-2021:empirical-rank-vs-probability-rank
    kind: distinction
    summary: "The paper distinguishes an event's empirical rank in a finite sample from its rank in the unknown underlying probability distribution. They need not match: sampling noise can reorder events, so the nth most frequent observed word is not necessarily the nth most probable word."
    locator: {type: section, value: "Introduction, Eqs. 1–2 and discussion of Fig. 2", label: "Empirical and probability ranks"}
    evidence:
      kind: formal-distinction-and-simulation
      confidence: established
      scope: "Finite-sample rank-frequency data generated from an unordered vocabulary of events."
      assumptions: ["The underlying event probabilities are not known a priori."]
      limitations: ["The paper studies the statistical estimation problem; it does not deny the empirical usefulness of rank-frequency plots."]
    technical_assessment:
      status: not-reviewed
      rationale: "Primary article distinction recorded; independent implementation review not performed."
      corroborating_sources: [piantadosi-zipf-word-frequency-2014]
    pedagogical_profile:
      learner_question: "Why is the observed rank not the same as the true probability rank?"
      explanatory_lens: sampling and order-statistic uncertainty
      teaching_form: [definition, contrast, simulation]
      abstraction_level: advanced
      prerequisites: ["sampling", "probability", "empirical frequency"]
      distinctive_value: "Names the hidden variable mismatch that makes naive rank-frequency likelihood fitting problematic."
      limitations: ["The full likelihood derivation is too technical for the introductory lesson."]
    pedagogical_assessment:
      novelty: {level: high, rationale: "The current Day 01 lesson mentions correlated errors but does not explicitly distinguish empirical and latent probability ranks."}
      complementarity: {level: high, rationale: "Adds a sharper statistical explanation that extends Piantadosi's split-sample warning."}
      pedagogical_value: {level: high, rationale: "Helps learners understand why a rank is itself estimated and uncertain."}
      applicability: {level: high, rationale: "Strong basis for an advanced exercise or optional note on estimation."}
      redundancy: {level: low, rationale: "The distinction is not currently explicit in the published lesson."}
      evidence_quality: {level: high, rationale: "The paper formalizes the distinction and demonstrates it with simulation."}
