  - id: pilgrim-hills-bias-zipf-estimators-2021:abc-not-a-universal-fix
    kind: limitation
    summary: "Approximate Bayesian computation reduces estimator bias on synthetic data generated from idealized Zipf distributions, but the authors find that results remain problematic for natural-language corpora because the assumed simple power-law data-generating model is itself inadequate. Different ABC variants also yield different estimates on books."
    locator: {type: section, value: "Abstract; ABC results; Analysis of books; Discussion", label: "ABC results and model mismatch"}
    evidence:
      kind: reported-simulation-and-empirical-analysis
      confidence: well-supported
      scope: "Simulations from idealized power laws and the book samples analyzed from Project Gutenberg."
      assumptions: ["The ABC comparison uses the simulated generative models and summary statistics specified in the paper."]
      limitations: ["The study does not establish a universally best estimator; the authors emphasize model dependence and arbitrary choices."]
    technical_assessment:
      status: not-reviewed
      rationale: "Reported result and caveat recorded; scripts and raw data not independently reproduced."
      corroborating_sources: [piantadosi-zipf-word-frequency-2014]
    pedagogical_assessment:
      novelty: {level: high, rationale: "The current lesson warns about estimation but does not discuss residual model dependence."}
      complementarity: {level: high, rationale: "Shows why even a more sophisticated estimator cannot repair a misspecified generative model."}
      pedagogical_value: {level: high, rationale: "Teaches the distinction between estimator bias under a model and model misspecification for natural language."}
      applicability: {level: high, rationale: "Useful in an advanced exercise about what can and cannot be concluded from an estimated exponent."}
      redundancy: {level: low, rationale: "The current exercise set does not yet distinguish estimator quality from generative-model adequacy."}
