pedagogical_limits:
  - "The article is short journalism, not a technical review or independently reproducible study."
  - "It focuses on pruning and does not compare quantization, distillation, low-rank methods or architecture-level efficiency."
  - "The 360% versus 36% figures are attributed to Epoch.AI but the underlying study and measurement definitions were not checked."
  - "Compression does not automatically yield faster inference, lower total energy, privacy or security; outcomes depend on implementation and deployment."
