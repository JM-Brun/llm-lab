    kind: implementation-pattern
    summary: "The illustrative PyTorch excerpt detaches correction coefficients, retains the sampled token's log-probability separately from the top-k head, and masks contributions outside generated tokens."
    locator: {type: section, value: "Concrete implementation (within Score Centering); footnote 10", label: "Illustrative PyTorch loss excerpt"}
    evidence:
