items:
  - id: cameron-wolfe-score-centering-substack:constant-reward-diagnostic
    kind: method
    summary: "Wolfe uses a constant-reward control to isolate mismatch-induced drift before reintroducing reward–score covariance. At a fixed prefix, a constant reward makes that covariance zero, leaving any uncorrected mean-score term exposed."
    locator: {type: section, value: "Exploring Instability (and TIM) in RL; Motivation for Score Centering", label: "Constant-reward control and decomposition"}
    evidence:
      kind: secondary-explanation-of-primary-method
      confidence: well-supported
      scope: "The diagnostic design and the fixed-prefix expectation identity."
      assumptions: ["The reward used in this control is constant and nonzero; the sampler is held fixed when differentiating the trainer policy."]
      limitations: ["This control isolates drift in the expected estimator. It does not measure task learning or prove that training will become unstable under another mismatch regime."]
    technical_assessment:
      status: correct
      rationale: "The primary paper establishes the constant-reward diagnostic and separates the drift and covariance terms in sections 3–4, including Eqs. (3)–(5)."
      corroborating_sources: ["https://arxiv.org/html/2609.20807v1"]
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [inference-efficiency]
      tags: [method:score-centering, topic:training-inference-mismatch]
      concept_ids: [score-centering, training-inference-mismatch]
    candidate_destinations: {pages: [fr/score-centering, en/score-centering], concepts: [score-centering, training-inference-mismatch], route_ids: []}
    disposition: integrate-by-reference
    disposition_rationale: "The article offers a reusable reading order from a negative control to the general estimator. The existing advanced lesson owns the derivation."
  - id: cameron-wolfe-score-centering-substack:importance-ratio-boundary
    kind: limitation
    summary: "The article separates the PPO-style update ratio from the trainer-to-sampler importance ratio and distinguishes a per-token ratio from a trajectory ratio. At a fixed prefix, exact conditional reweighting makes the score correction vanish."
    locator: {type: section, value: "Limitations of Importance Sampling; Score Centering; footnotes 3 and 6–8", label: "Ratio scope and residual drift"}
    evidence:
      kind: secondary-explanation-of-primary-method
      confidence: well-supported
      scope: "Conditional score centering with exact or modified importance weights."
      assumptions: ["Exact conditional importance weighting requires sampler support wherever trainer mass contributes; the published additive coefficient uses compatible nonnegative weights."]
      limitations: ["A token ratio at a given prefix does not repair the sampled prefix distribution or the distribution of later tokens in a completion. Clipping or masking changes what is reweighted."]
    technical_assessment:
      status: qualified
      rationale: "Appendix A.2 establishes the conditional identity. Recovery of the entire on-policy trajectory expectation requires stronger support and reweighting conditions."
      corroborating_sources: ["https://arxiv.org/html/2609.20807v1"]
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [inference-efficiency]
      tags: [method:score-centering, method:importance-sampling]
      concept_ids: [score-centering, importance-sampling, off-policy-reinforcement-learning]
    candidate_destinations: {pages: [fr/score-centering, en/score-centering], concepts: [score-centering, importance-sampling], route_ids: []}
    disposition: integrate-by-reference
    disposition_rationale: "The ratio comparison is supplementary reading. The lesson retains the primary manuscript as authority for its claims."
