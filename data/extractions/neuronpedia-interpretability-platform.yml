schema_version: 1
source_id: neuronpedia-interpretability-platform

pedagogical_model:
  reconstruction:
    status: partial
    basis:
      - "Official Neuronpedia platform and documentation inspected 2026-11-16 and 2026-11-17; see docs/source-reviews/embedding-atlas-neuronpedia-integration-2026-11.md."
      - "The review covers SAE overview, feature dashboards, activation/logit/density views, Auto-Interp, identifiers, API and conditional inference support."
      - "The bilingual investigation protocol and exercise use the documented Gemma Scope example gemma-2-2b/20-gemmascope-res-16k/10956."
    inferred_elements:
      - "Learning outcomes are inferred from the platform documentation and the integrated learner investigation; Neuronpedia does not prescribe this exact teaching sequence."
      - "The source-local graph below reconstructs documented data objects and investigative relations; it is not a formal causal graph of model computation."
      - "The reviewed documentation does not establish that every feature source supports custom-text inference or exposes identical evidence fields."
  source_graph:
    nodes:
      - {id: src-model-release, kind: constraint, description: "A named model and source/release identify the context in which a feature index and its evidence are defined.", locator: "https://docs.neuronpedia.org/getting-started/key-concepts"}
      - {id: src-sae-feature, kind: representation, description: "A feature is a learned SAE latent/direction associated with a particular model source and release; it is not automatically a native neuron or a unique human concept.", locator: "https://docs.neuronpedia.org/sparse-autoencoders/overview"}
      - {id: src-activation-evidence, kind: intermediate, description: "Feature dashboards expose activation examples and activation-density information for inspecting where a feature responds.", locator: "https://docs.neuronpedia.org/sparse-autoencoders/feature-dashboards"}
      - {id: src-logit-evidence, kind: intermediate, description: "Dashboard logits provide evidence about associations with output tokens; they are not interchangeable with activation magnitudes.", locator: "https://docs.neuronpedia.org/sparse-autoencoders/feature-dashboards"}
      - {id: src-auto-interpretation, kind: representation, description: "Auto-Interp methods generate natural-language explanations from selected activation evidence, with method-dependent scoring.", locator: "https://docs.neuronpedia.org/sparse-autoencoders/auto-interp"}
      - {id: src-custom-text-test, kind: operation, description: "Some feature sources expose inference endpoints that allow testing custom text; availability is source-dependent.", locator: "https://docs.neuronpedia.org/api/"}
      - {id: src-attention-head-view, kind: visualization, description: "The platform also provides attention-head exploration, a distinct object of analysis from SAE features.", locator: "https://docs.neuronpedia.org/"}
      - {id: src-attribution-graph, kind: visualization, description: "Attribution/circuit views summarize selected computational paths under method-specific approximations.", locator: "https://docs.neuronpedia.org/"}
    edges:
      - {from: src-model-release, type: scopes-identity-of, to: src-sae-feature}
      - {from: src-sae-feature, type: has-observed-evidence, to: src-activation-evidence}
      - {from: src-sae-feature, type: has-associated-output-evidence, to: src-logit-evidence}
      - {from: src-activation-evidence, type: input-to, to: src-auto-interpretation}
      - {from: src-sae-feature, type: may-be-tested-by, to: src-custom-text-test}
      - {from: src-model-release, type: also-exposes, to: src-attention-head-view}
      - {from: src-model-release, type: also-exposes, to: src-attribution-graph}
    interpretation: "The graph distinguishes learned features, observed activations, output-token associations, generated explanations, conditional interventions and attention-head views. None of these objects alone proves a complete causal mechanism. The documented platform surface varies by model/source release."
  learning_outcomes:
    - {status: inferred, outcome: "Record model, source/release, layer or hook, and feature identifier before interpreting a dashboard.", basis: "Official key-concepts and search documentation; integrated bilingual investigation."}
    - {status: inferred, outcome: "Distinguish activation examples and density from logits associated with output tokens.", basis: "Official feature-dashboard documentation."}
    - {status: inferred, outcome: "Treat an Auto-Interp explanation as a testable hypothesis and check it against positive examples and counterexamples.", basis: "Official Auto-Interp documentation and integrated investigation protocol."}
    - {status: inferred, outcome: "Use custom-text inference only when the selected source supports it, and report that condition.", basis: "Official API documentation."}
    - {status: inferred, outcome: "Separate correlational evidence, approximate attribution and causal intervention claims.", basis: "Source review's documented limitations and evidence distinctions."}
  assumed_prerequisites:
    - {status: inferred, topic: "Basic understanding of Transformer representations, activations and model layers.", basis: "The investigation targets advanced contextualized representations and internal features."}
    - {status: inferred, topic: "Ability to compare examples and formulate falsifiable hypotheses.", basis: "The integrated activity requires counterexample search and calibrated conclusions."}
  teaching_route:
    - {order: 1, section: "Identify the feature", function: establish-provenance, moves: ["Record model, release/source, layer or hook and feature index."]}
    - {order: 2, section: "Inspect evidence", function: distinguish-observations, moves: ["Read activation examples and density.", "Inspect logits separately from activations."]}
    - {order: 3, section: "Evaluate explanation", function: test-generated-hypothesis, moves: ["Compare Auto-Interp text with observed examples.", "Search for counterexamples and note ambiguity."]}
    - {order: 4, section: "Test conditionally", function: controlled-probe, moves: ["Use custom-text inference only if available for the selected source.", "Record prompts and limitations."]}
    - {order: 5, section: "Calibrate conclusion", function: separate-evidence-from-causality, moves: ["State what the evidence supports.", "Do not infer a complete causal role from a dashboard or attribution graph alone."]}
  pedagogical_strengths:
    - "Makes model-internal evidence inspectable through concrete feature-level examples rather than relying only on verbal descriptions."
    - "Supports a falsifiable workflow: identify a feature, inspect activations, test an explanation against counterexamples, and qualify the conclusion."
    - "Makes provenance operational through model, source/release and feature identifiers."
    - "Provides distinct views for activations, logits, density, attention heads and attribution/circuit exploration."
  pedagogical_limits:
    - "This is a documentation-level extraction; no model weights were run and no activations were independently recomputed."
    - "AI-generated explanations may be incomplete, overly broad or wrong; scores depend on the method."
    - "Feature identity is source/release-specific; a feature index is not a portable semantic label."
    - "Activations and logits are different evidence types and neither alone establishes a causal role."
    - "Attribution graphs depend on approximations; steering responses require controls and counterfactuals before causal interpretation."
    - "Custom-text inference is conditional on source support and should not be assumed for every dashboard."
    - "No screenshot, figure or dataset reuse permission was established."
  comparison:
    dossier: docs/source-reviews/embedding-atlas-neuronpedia-integration-2026-11.md
    canonical_graph: "data/concepts.yml and generated JSON-LD projection"
    canonical_routes: [docs/learning-path.md, data/guided-route.yml]
    decision: "Use as an advanced evidence-inspection activity attached to existing contextualized-representation learning resources. Do not create a new standalone chapter or claim that the platform provides causal explanations."
    structures_kept_separate:
      - "Source-local feature and evidence objects are not canonical concept nodes."
      - "The platform's feature identifiers are scoped to model/source releases, not global concept identifiers."
      - "A natural-language explanation is a hypothesis about activation evidence, not the feature itself."
      - "The platform's attribution views are not equivalent to a validated causal graph of the full model."
      - "The learner investigation is a pedagogical route, not a reproduction of Neuronpedia's internal algorithms."

items:
  - id: neuronpedia-interpretability-platform:feature-provenance
    kind: mechanism
    summary: "A feature must be interpreted together with its model, source/release and feature identifier; the same numeric index is not a globally stable semantic identity."
    locator: {type: section, value: "Key concepts; search documentation", label: "Model/source/release and feature identifiers"}
    evidence:
      kind: official-documentation
      confidence: established
      scope: "Official key-concepts and search documentation inspected 2026-11-17."
      assumptions: ["The recorded identifier refers to the exact source/release shown in the dashboard."]
      limitations: ["The extraction does not verify persistence or availability of every historical release."]
    disposition: integrate
    disposition_rationale: "Make provenance a required first step in the bilingual feature-investigation worksheet."

  - id: neuronpedia-interpretability-platform:activation-evidence
    kind: result
    summary: "Feature dashboards expose activation examples and density views that help inspect where a feature responds."
    locator: {type: section, value: "Sparse autoencoder feature dashboards", label: "Activation examples and density"}
    evidence:
      kind: official-documentation
      confidence: established
      scope: "Official feature-dashboard documentation inspected 2026-11-17."
      assumptions: ["The selected feature dashboard exposes the relevant evidence fields."]
      limitations: ["Examples are sampled evidence; they do not establish complete feature semantics or causal necessity."]
    disposition: integrate
    disposition_rationale: "Use activation examples as observations to test a hypothesis, not as a definition."

  - id: neuronpedia-interpretability-platform:logit-evidence
    kind: claim
    summary: "Logit views describe associations with output tokens and must not be conflated with feature activation magnitude."
    locator: {type: section, value: "Sparse autoencoder feature dashboards", label: "Logits and activation views"}
    evidence:
      kind: official-documentation-plus-editorial-distinction
      confidence: well-supported
      scope: "Dashboard documentation and the source review's distinction between activation and output-token evidence."
      assumptions: []
      limitations: ["The meaning of a displayed logit depends on the dashboard's exact computation and context."]
    disposition: clarify
    disposition_rationale: "Preserve separate labels and interpretations for activation and logit evidence."

  - id: neuronpedia-interpretability-platform:auto-interp-hypothesis
    kind: limitation
    summary: "Auto-Interp generates natural-language feature explanations from selected activation evidence; explanations and scores are method-dependent hypotheses requiring inspection of underlying examples."
    locator: {type: section, value: "Auto-interpretability", label: "Explanation generation and scoring"}
    evidence:
      kind: official-documentation
      confidence: established
      scope: "Official Auto-Interp documentation inspected 2026-11-17."
      assumptions: ["The explanation method and scoring procedure are identified for the selected result."]
      limitations: ["A fluent explanation or high score does not establish completeness, uniqueness or causal role."]
    disposition: integrate
    disposition_rationale: "Make counterexample search and explicit uncertainty part of the learner activity."

  - id: neuronpedia-interpretability-platform:conditional-inference
    kind: limitation
    summary: "Custom-text activation testing is available only for sources that expose the required inference support; it must not be assumed for every feature dashboard."
    locator: {type: section, value: "API documentation", label: "Feature and inference endpoints"}
    evidence:
      kind: official-documentation
      confidence: established
      scope: "Official API documentation inspected 2026-11-17."
      assumptions: ["The selected source has an available inference endpoint."]
      limitations: ["Availability and behavior may differ by model/source release."]
    disposition: clarify
    disposition_rationale: "Keep the custom-text step conditional and require learners to report when it is unavailable."

  - id: neuronpedia-interpretability-platform:attribution-causality-boundary
    kind: limitation
    summary: "Attribution graphs and steering views can guide mechanistic hypotheses, but neither a visualization nor an output change alone establishes a complete causal mechanism."
    locator: {type: section, value: "Platform tools; source review synthesis", label: "Attribution, circuit tracing and steering"}
    evidence:
      kind: technical-assessment
      confidence: well-supported
      scope: "Documentation-level review and explicit methodological boundary recorded in the source dossier."
      assumptions: ["Causal conclusions require suitable interventions, controls and counterfactual comparisons."]
      limitations: ["No attribution method or intervention was independently reproduced in this ingestion."]
    disposition: clarify
    disposition_rationale: "Keep association, approximation and intervention claims separate in advanced interpretability teaching."
