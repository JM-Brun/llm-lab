      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Use the release/model/layer/hook/feature identity checklist in the existing bilingual investigation; do not create a new canonical concept from a platform identifier."

  - id: neuronpedia-interpretability-platform:activation-evidence
    kind: visualization
    summary: "Feature dashboards expose activation examples and activation-density views that let a learner inspect where a feature responds, rather than relying only on its textual explanation."
    locator:
      type: url
      value: "https://docs.neuronpedia.org/sparse-autoencoders/feature-dashboards"
      label: "Feature dashboards"
    evidence:
      kind: direct-documentation
      confidence: well-supported
      scope: "Official feature-dashboard documentation as summarized in the source review."
      assumptions: []
      limitations:
        - "Displayed examples and density views are evidence about the selected feature/source, not proof of a unique human-interpretable concept or a complete causal role."
        - "No feature activations were independently recomputed."
    technical_assessment:
      status: reviewed
      rationale: "The documentation describes inspectable activation evidence; interpretation still requires counterexamples and source-specific context."
      corroborating_sources: []
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:sparse-autoencoders, modality:interactive-visualization]
      concept_ids: [contextualized-representation]
    candidate_destinations:
      pages: [fr/contextualized-representations-advanced, en/contextualized-representations-advanced]
      concepts: [contextualized-representation]
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Retain activation-example inspection and counterexample search in the existing bilingual exercise; do not treat the dashboard as an experimental reproduction."

  - id: neuronpedia-interpretability-platform:logits-and-activation-distinction
    kind: limitation
    summary: "Activation evidence and positive/negative logit associations describe different quantities and should not be conflated; neither alone establishes a feature's full causal role."
    locator:
      type: url
      value: "https://docs.neuronpedia.org/sparse-autoencoders/feature-dashboards"
      label: "Feature dashboards: activations and logits"
    evidence:
      kind: editorial-synthesis
      confidence: context-dependent
      scope: "Distinction reconstructed from the dashboard elements and critical boundaries documented in the source review."
      assumptions: []
      limitations:
        - "The causal-boundary statement is an editorial interpretation of what these views can establish, not a claim that the platform proves causality."
    technical_assessment:
      status: reviewed
      rationale: "The distinction is pedagogically important; the limits are deliberately stated more narrowly than a mechanistic claim."
      corroborating_sources: []
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:features]
      concept_ids: [contextualized-representation]
    candidate_destinations:
      pages: [fr/contextualized-representations-advanced, en/contextualized-representations-advanced, fr/llm-limits, en/llm-limits]
      concepts: [contextualized-representation]
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Preserve the distinction in the existing learner debrief; do not add a separate concept node for dashboard display types."

  - id: neuronpedia-interpretability-platform:auto-interpretability-explanations
    kind: limitation
    summary: "Auto-Interp explanations are generated from selected activation evidence by AI models; methods and scoring procedures vary, so explanations and scores are hypotheses to test against examples rather than ground truth."
    locator:
      type: url
      value: "https://docs.neuronpedia.org/sparse-autoencoders/auto-interp"
      label: "Auto-Interp"
    evidence:
      kind: direct-documentation
      confidence: well-supported
      scope: "Official Auto-Interp documentation on explanation provenance, methods and scoring workflow."
      assumptions: []
      limitations:
        - "The review did not independently compare all explanation or scoring methods."
        - "No generated explanation was independently benchmarked in this pass."
    technical_assessment:
      status: reviewed
      rationale: "The platform documents model-generated explanations and method-dependent scoring; the learner activity appropriately asks for manual inspection and counterexamples."
      corroborating_sources: []
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:mechanistic-interpretability, topic:sparse-autoencoders]
      concept_ids: [contextualized-representation]
    candidate_destinations:
