    kind: definition
    summary: "A feature dashboard is interpreted in the context of its model, source/release and feature identifier; a feature index is not a globally stable semantic label."
    locator:
      type: url
      value: "https://docs.neuronpedia.org/getting-started/key-concepts"
      label: "Key concepts: models, sources, releases and feature identifiers"
    evidence:
      kind: direct-documentation
      confidence: well-supported
      scope: "Official key-concepts documentation and the documented Gemma Scope example recorded in the source review."
      assumptions: []
      limitations:
        - "The example gemma-2-2b/20-gemmascope-res-16k/10956 is illustrative and does not establish the meaning of that index in another release or model."
    technical_assessment:
      status: reviewed
      rationale: "The identity boundary is explicit in the documentation and is essential for reproducible interpretation."
      corroborating_sources: []
    classification:
      primary_theme: architectures-mechanisms
