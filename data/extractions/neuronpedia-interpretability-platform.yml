      concepts: [contextualized-representation]
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "Use as a critical-reading checkpoint in the existing investigation; no new page is needed."

  - id: neuronpedia-interpretability-platform:conditional-custom-text-inference
    kind: limitation
    summary: "Custom-text activation tests are available only for sources/releases where inference is enabled; availability must be checked for the selected model and source."
    locator:
      type: url
      value: "https://docs.neuronpedia.org/api/"
      label: "API documentation and inference availability"
    evidence:
      kind: direct-documentation
      confidence: context-dependent
      scope: "Official API documentation as reviewed on 2026-11-17."
      assumptions: []
      limitations:
