schema_version: 1
source_id: min-et-al-demonstrations-icl-2022
items:
  - id: min-et-al-demonstrations-icl-2022:demonstration-components
    kind: definition
    summary: "A demonstration can convey input-label correspondence, the distribution of input text, the label space, and the input-label-pair format; these components can contribute separately to task performance."
    locator:
      type: section
      value: "§5, Figure 7"
      label: "Why does In-Context Learning work?"
    evidence:
      kind: empirical-analysis
      confidence: well-supported
      scope: "The authors define four aspects of demonstrations and design ablations to isolate the input distribution, label space, input-label mapping, and pair format."
      assumptions:
        - "The decomposition is an experimental analysis of the paper's prompting setups, not a claim that these are the only possible sources of information in every prompt."
      limitations:
        - "The experiments focus on classification and multiple-choice tasks."
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [architectures-mechanisms]
      concept_ids: [in-context-learning, conditional-distribution]
    candidate_destinations:
      pages: [en/in-context-learning, fr/in-context-learning]
      concepts: [in-context-learning]
    disposition: integrate

  - id: min-et-al-demonstrations-icl-2022:random-label-aggregate-result
    kind: result
    summary: "Across the evaluated classification and multiple-choice settings, replacing ground-truth demonstration labels with random labels often causes only a small decrease in aggregate performance, while demonstrations still outperform the no-demonstration baseline."
    locator:
      type: section
      value: "§4.1–§4.2, Figures 1, 3 and 5"
      label: "Impact of ground-truth labels"
    evidence:
      kind: experimental-result
      confidence: context-dependent
      scope: "The study evaluates 12 models on 26 classification and multiple-choice datasets, typically using 16 demonstrations and repeated sampling; the largest models are evaluated on a smaller subset."
      assumptions:
        - "The reported aggregate results are interpreted within the paper's selected datasets, models, prompting methods, and metrics."
      limitations:
        - "The aggregate trend does not hold equally for every dataset-model pair."
        - "The paper explicitly limits its experiments to classification and multiple-choice tasks, not open-ended generation."
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [architectures-mechanisms]
      concept_ids: [in-context-learning]
    candidate_destinations:
      pages: [en/in-context-learning, fr/in-context-learning]
      concepts: [in-context-learning]
    disposition: integrate

  - id: min-et-al-demonstrations-icl-2022:input-space-label-space-format
    kind: result
    summary: "The input distribution, label space, and pair format can retain substantial performance gains even when individual input-label mappings are randomized or when one component is selectively removed."
    locator:
      type: section
      value: "§5.1–§5.4, Figures 8–10"
      label: "Ablations of input distribution, label space, format, and meta-training"
    evidence:
      kind: experimental-result
      confidence: context-dependent
      scope: "Ablations compare in-distribution and out-of-distribution inputs, true labels, random labels, random English words, and variants that remove pair formatting."
      assumptions:
        - "The retained-gain percentages are specific to the reported model, inference method, and task configurations."
      limitations:
        - "MetaICL was explicitly meta-trained with an in-context learning objective and behaves differently from the other evaluated models."
        - "The results do not establish the same component importance for free-form generation or reasoning tasks."
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [architectures-mechanisms]
      concept_ids: [in-context-learning, conditional-distribution]
    candidate_destinations:
      pages: [en/in-context-learning, fr/in-context-learning]
      concepts: [in-context-learning]
    disposition: integrate

  - id: min-et-al-demonstrations-icl-2022:scope-and-limitations
    kind: limitation
    summary: "The authors caution that dataset-level averages hide task-specific differences, that some model-task pairs show larger gaps between correct and random labels, and that their findings do not directly extend to open-set generation."
    locator:
      type: section
      value: "§6, Limitations"
      label: "Discussion and limitations"
    evidence:
      kind: author-stated-limitation
      confidence: well-supported
      scope: "The paper discusses task and dataset dependence, aggregate reporting, examples with larger performance gaps, and the absence of open-ended generation experiments."
      assumptions: []
      limitations:
        - "This extraction records the authors' stated scope; it does not independently test generalization beyond their benchmarks."
    classification:
      primary_theme: probabilistic-foundations-training
      secondary_themes: [architectures-mechanisms]
      concept_ids: [in-context-learning]
    candidate_destinations:
      pages: [en/in-context-learning, fr/in-context-learning]
      concepts: [in-context-learning]
    disposition: integrate
