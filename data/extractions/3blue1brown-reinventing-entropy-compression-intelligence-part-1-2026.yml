  - id: 3blue1brown-reinventing-entropy-compression-intelligence-part-1-2026:surprisal-as-ideal-code-length
    kind: derivation
    summary: "For an event with probability p, its ideal information cost is -log2(p) bits. The logarithm makes the information of a sequence additive when its probability factorizes into conditional probabilities."
    pedagogical_assessment:
      novelty: {level: low, rationale: "The canonical surprisal and autoregressive likelihood lessons already define the quantity; the source adds a derivational teaching route."}
      complementarity: {level: high, rationale: "The robot-code example and binary-tree animation make the link between code length and negative log probability intuitive."}
      pedagogical_value: {level: high, rationale: "Useful as a visual companion before the formal treatment."}
      applicability: {level: high, rationale: "Can support the existing entropy and compression revision lessons without duplicating them."}
      redundancy: {level: high, rationale: "The mathematical definition is already present in canonical pages."}
      evidence_quality: {level: high, rationale: "Standard information-theoretic identity, presented pedagogically; the video is not a primary research source."}
    locator: {type: timestamp, value: "14:47–20:13", label: "Defining information and information of language"}
    evidence:
      kind: source-explanation
      confidence: well-supported
      scope: "Ideal code length and surprisal for an event under a specified probability model."
      assumptions: ["Base-two logarithm for bits.", "The event probability is defined under the source model.", "Idealized coding or an asymptotic/average coding interpretation."]
      limitations: ["Actual finite codewords have integer bit lengths.", "A practical code has overhead and must be decodable.", "A model probability is not automatically the true source probability."]
