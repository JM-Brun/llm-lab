  - id: 3blue1brown-reinventing-entropy-compression-intelligence-part-1-2026:entropy-rate-language
    kind: definition
    summary: "For context-dependent language, the relevant compression limit is average conditional information per symbol, not simply the entropy of one fixed character distribution."
    pedagogical_assessment:
      novelty: {level: moderate, rationale: "The canonical entropy lesson is next-token and context-specific, but the distinction between iid symbol entropy and sequence entropy rate is not explicit in the revision sheet."}
      complementarity: {level: high, rationale: "This clarifies why long context can improve prediction and why unigram frequencies do not characterize language compressibility."}
      pedagogical_value: {level: high, rationale: "It links Shannon's historical language experiments to autoregressive conditional distributions."}
