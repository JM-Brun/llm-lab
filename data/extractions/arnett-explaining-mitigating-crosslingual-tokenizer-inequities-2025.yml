  decision_summary: "Arnett et al. provides a controlled study of crosslingual compression in monolingual tokenizers. Its strongest complementary contribution is the interaction between whitespace pre-tokenization and language-specific vocabulary sizing. Preserve the distinction between tokenizer compression, token premiums and downstream model quality; no new canonical concept or learner route is warranted."
