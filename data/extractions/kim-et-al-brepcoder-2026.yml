  - id: kim-et-al-brepcoder-2026:brep-code-alignment
    kind: mechanism
    summary: "BrepCoder encodes B-rep as a face-adjacency graph using UV-Net-derived local and global geometric features, then aligns the representation with Python-like CAD Code. The paper uses contrastive alignment and autoregressive code-generation loss rather than treating the CAD solid as ordinary prose."
    locator: {type: section, value: "3.1 Multimodal Alignment"}
    evidence:
      kind: method-description
      confidence: well-supported
      scope: "The architecture and objective as described by the authors."
      assumptions: ["The paper's reported implementation matches the described method."]
      limitations: ["Full implementation and independent reproduction were not inspected."]
    classification:
      primary_theme: mathematical-tools-geometry
      secondary_themes: [architectures-mechanisms, probabilistic-foundations-training]
      tags: [topic:geometric-representation, application:computer-aided-design, modality:multimodal]
      concept_ids: [contextualized-representation, training-objective]
    candidate_destinations:
      pages: [en/llm-limits, fr/llm-limits]
    disposition: integrate
  - id: kim-et-al-brepcoder-2026:two-stage-training
    kind: implementation-pattern
    summary: "The proposed two-stage strategy first learns reverse-engineering correspondences between B-rep geometry and CAD construction code, then fine-tunes for downstream tasks including completion, error correction and CAD question answering."
    locator: {type: section, value: "1 Introduction and 3 Method"}
    evidence:
      kind: method-description
      confidence: well-supported
      scope: "Training stages and tasks claimed by the paper."
      assumptions: []
