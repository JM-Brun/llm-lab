  - id: kim-et-al-brepcoder-2026:representation-is-not-design-intent
    kind: limitation
    summary: "B-rep plus CAD construction code provides richer access to geometry and procedural design history than a final shape alone, but it does not by itself prove preservation of engineering intent, material behavior, tolerances, loads or manufacturing validity."
    locator: {type: section, value: "3.1 Multimodal Alignment"}
    evidence:
      kind: critical-assessment
      confidence: context-dependent
      scope: "Boundary of what the described representation and tasks establish."
      assumptions: ["Engineering intent can include semantic and physical constraints not recoverable from shape/code alignment alone."]
      limitations: ["This is an assessment of scope, not a reported negative experimental result."]
    classification:
