  - id: brenndoerfer-query-key-value-attention-2025:independent-projection-ambiguity
    kind: misconception
    summary: "The source says the Q/K/V projections 'operate independently'; this should be interpreted as separate representational transformations, not as independently optimized parameters. In standard Transformer training, the projection parameters are optimized jointly through the shared training objective."
    locator: {type: section, value: "§5 QKV as Learned Transformations, lines 1122–1126", label: "QKV as Learned Transformations"}
    evidence:
      kind: wording-ambiguity
      confidence: well-supported
      scope: "Interpretation of the phrase 'operate independently' in the context of the standard jointly trained Transformer block."
      assumptions: ["Standard end-to-end gradient-based training."]
      limitations: ["The author may intend only separate representational spaces; no author clarification was obtained."]
    technical_assessment:
      status: qualified
      rationale: "The phrase is ambiguous; the canonical page correctly states that the projections are separately parameterized but jointly optimized."
      corroborating_sources: ["Vaswani et al. (2017)", "LLM Lab canonical Q/K/V lesson"]
    pedagogical_profile:
      learner_question: "Does having three separate projection matrices mean they are trained independently?"
      explanatory_lens: "parameterization-versus-optimization"
      teaching_form: [misconception, clarification]
      abstraction_level: intermediate
      prerequisites: [gradient-descent, parameterization]
      distinctive_value: "Separates independent representational roles from independent optimization."
      limitations: ["This is a wording clarification, not evidence of a different architecture."]
    pedagogical_assessment:
      novelty: {level: moderate, rationale: "The existing page already makes the distinction, but the source's ambiguous wording gives a concrete adversarial test case."}
      complementarity: {level: moderate, rationale: "Useful for testing whether the workflow notices a subtle ambiguity despite broad agreement across tutorials."}
      pedagogical_value: {level: moderate, rationale: "Can prevent a common misreading of separate matrices as separate training processes."}
      applicability: {level: high, rationale: "Suitable as an adversarial regression fixture for source synthesis and technical review."}
      redundancy: {level: low, rationale: "The canonical statement exists, but the source-specific ambiguity is new as a test case."}
      evidence_quality: {level: high, rationale: "The distinction follows from the standard jointly optimized computation graph; the source's intended meaning remains uncertain."}
