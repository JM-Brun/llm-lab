    - "The statement that projections operate independently is ambiguous. Separate matrices/representational roles do not mean independently optimized parameters; standard training optimizes them jointly through the model objective."
    - "The claim that QKV attention treats all positions symmetrically needs qualification: the raw mechanism can be permutation-equivariant absent positional/asymmetric constraints, while masks and positional mechanisms break that symmetry."
    - "The tutorial's statement that modern Transformers rely entirely on QKV attention is too broad for architectures with alternative attention or sequence-mixing mechanisms."
    - "The displayed complexity O(n^2 d_k) concerns the pairwise score computation; total attention-block costs also include projections and value aggregation, and memory depends on whether the score matrix is materialized."
