items:
  - id: brenndoerfer-query-key-value-attention-2025:variance-scaling-derivation
    kind: derivation
    summary: "Assuming independent zero-mean, unit-variance query/key components, each product q_m k_m has variance 1 and the sum over d_k dimensions has variance d_k; dividing scores by sqrt(d_k) therefore gives an approximately dimension-stable variance under those assumptions."
    locator: {type: section, value: "§3, lines 809–831", label: "Step 3: The Scaling Problem and Its Solution"}
    evidence:
      kind: mathematical-derivation
      confidence: well-supported
      scope: "Statistical motivation for the standard scaling factor under the tutorial's stated independence and unit-variance assumptions."
      assumptions: ["Query/key components are independent across paired dimensions.", "Each component has zero mean and unit variance.", "The products are independent or at least have negligible cross-covariances."]
      limitations: ["Real learned Q/K distributions need not meet these assumptions.", "Variance stabilization is approximate and does not guarantee unsaturated softmax or healthy gradients in every model."]
    technical_assessment:
      status: qualified
      rationale: "The derivation is mathematically valid under the stated simplifying assumptions; the prose overstates the guarantee when it says gradients will flow to all positions."
      corroborating_sources: ["Vaswani et al. (2017), Attention Is All You Need"]
    pedagogical_profile:
      learner_question: "Why is the dot product divided by sqrt(d_k)?"
      explanatory_lens: statistical-derivation
      teaching_form: [derivation, visualization]
      abstraction_level: advanced
      prerequisites: [dot-product, variance, independence, softmax]
      distinctive_value: "Connects the scaling factor to the variance growth of a sum of random products and to softmax concentration."
      limitations: ["Assumptions are idealized; do not present the result as a universal guarantee."]
    pedagogical_assessment:
      novelty: {level: moderate, rationale: "The canonical attention-score-scaling lesson already derives the factor, but this source provides a longer variance-to-softmax teaching chain."}
      complementarity: {level: moderate, rationale: "Potentially useful as an optional statistical derivation, but overlaps the existing scaling deep dive and must be compared section-by-section before any integration."}
      pedagogical_value: {level: moderate, rationale: "Could help learners understand why scaling exists rather than memorize it; its assumptions and limits must be made explicit."}
      applicability: {level: moderate, rationale: "Appropriate for the advanced/deep-dive layer, not the core Q/K/V lesson."}
      redundancy: {level: moderate, rationale: "The square-root rationale already exists; only the fuller assumption-explicit chain may add value."}
      evidence_quality: {level: high, rationale: "A transparent derivation from explicit assumptions, but still a tutorial exposition and not independent empirical evidence."}
    classification:
      primary_theme: architectures-mechanisms
      tags: [topic:qkv, method:scaled-dot-product-attention]
      concept_ids: [attention-score, scaled-dot-product-attention]
    candidate_destinations:
      pages: [en/attention-score-scaling, fr/attention-score-scaling]
      concepts: []
      route_ids: []
    disposition: integrate-by-reference
    disposition_rationale: "The source is a useful optional alternative derivation, but the existing deep-dive already owns the scaling explanation. Do not duplicate it; link as a deeper worked explanation only if a precise learner gap remains."

