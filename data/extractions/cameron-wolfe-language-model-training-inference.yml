items:
  - id: cameron-wolfe-language-model-training-inference:shared-next-token-objective
    kind: mechanism
    summary: "Causal language-model pretraining and inference both rely on predicting a next-token distribution from the available prefix. During pretraining, the next token is observed in the corpus and supplies the target; during inference, a token is selected from the distribution and appended to the context."
    locator: {type: section, value: "Understanding Next Token Prediction; Language Model Pretraining; Autoregressive Inference Process", label: "Shared next-token prediction mechanism"}
    evidence:
      kind: explanatory-claim
      confidence: well-supported
      scope: "The article's conceptual explanation and equations for causal language-model pretraining and autoregressive inference."
      assumptions: ["The scope is causal/autoregressive language models, not every model family or every LLM training objective."]
      limitations: ["This is the article's framing; modern post-training and non-autoregressive objectives are outside its scope."]
    classification:
      concept_ids: [next-token-prediction, conditional-distribution, observed-target, pretraining, autoregressive-generation]
    candidate_destinations:
      pages: [fr/generation, en/generation, fr/transformer, en/transformer]
      concepts: [next-token-prediction, conditional-distribution, observed-target, pretraining, autoregressive-generation]
    disposition: already-covered
    disposition_rationale: "The shared prediction mechanism and its generation/scoring/training branches are now explicitly owned by the canonical computational spine and existing bilingual lessons. Cite or link this source; do not duplicate the explanation."

  - id: cameron-wolfe-language-model-training-inference:parallel-sequence-prediction
    kind: mechanism
    summary: "With causal self-attention, each position can use only its own token and preceding tokens. The model can therefore compute next-token predictions at all positions of a training sequence in one forward pass, with a target aligned to each position."
    locator: {type: section, value: "Language Model Pretraining", label: "Predicting tokens across a sequence"}
    evidence:
      kind: explanatory-claim
      confidence: well-supported
      scope: "The article's explanation of causal masking and parallel per-position next-token prediction."
      assumptions: ["The described setup is a decoder-only causal Transformer."]
      limitations: ["The article does not fully formalize shifted-target indexing, padding/document-boundary masks or loss masking."]
    classification:
      concept_ids: [next-token-prediction, self-attention, causal-mask, observed-target]
    candidate_destinations:
      pages: [fr/training-examples, en/training-examples, fr/causal-masking, en/causal-masking]
      concepts: [next-token-prediction, self-attention, causal-mask, observed-target]
    disposition: clarify
    disposition_rationale: "Useful cross-reference for the distinction between parallel training positions and sequential generation. LLM Lab already owns the precise target-shift and masking treatment; use the article only as a supporting explanation."

  - id: cameron-wolfe-language-model-training-inference:input-representations
    kind: mechanism
    summary: "The described GPT-2/NanoGPT input path tokenizes text, maps token IDs to learned token embeddings, adds learned positional embeddings, and passes the resulting vectors into a decoder-only Transformer. The article also mentions RoPE and ALiBi as alternative ways to provide positional information."
    locator: {type: section, value: "Tokens and Vocabularies", label: "Tokenization, token embeddings and positional information"}
    evidence:
      kind: explanatory-claim
      confidence: context-dependent
      scope: "The article's input representation explanation and its GPT-2/NanoGPT implementation context."
      assumptions: ["Additive learned positional embeddings describe the specific implementation under discussion."]
      limitations: ["Do not generalize additive positional embeddings to all current architectures; the article itself notes alternative positional mechanisms."]
    classification:
      concept_ids: [positional-encoding]
    candidate_destinations:
      pages: [fr/text-data, en/text-data, fr/positional-encoding, en/positional-encoding]
      concepts: [positional-encoding]
    disposition: already-covered
    disposition_rationale: "The existing text/data and positional-encoding lessons own these explanations. The source is useful as an additional reference, not a reason to duplicate them."

  - id: cameron-wolfe-language-model-training-inference:forward-pass-targets-and-loss
    kind: implementation-pattern
    summary: "The NanoGPT forward method accepts input token IDs and an optional target tensor. With targets, it computes vocabulary logits at each position and applies cross-entropy; without targets, it returns predictions for inference. This makes the shared model computation and the training-only target/loss path visible in code."
    locator: {type: section, value: "Implementing Next Token Prediction", label: "Forward pass and performing inference"}
    evidence:
      kind: implementation-description
      confidence: well-supported
      scope: "The article's description of NanoGPT's forward method and its use in pretraining versus inference."
      assumptions: ["The optional-target API is specific to the presented implementation."]
      limitations: ["The linked source code was not independently fetched or tested in this ingestion pass."]
    classification:
      concept_ids: [conditional-distribution, observed-target, cross-entropy, training-objective]
    candidate_destinations:
      pages: [fr/transformer, en/transformer, fr/loss, en/loss, fr/training-examples, en/training-examples]
      concepts: [conditional-distribution, observed-target, cross-entropy, training-objective]
    disposition: link
    disposition_rationale: "A useful implementation cross-reference for the separation between forward computation, observed targets and loss. Do not copy its code into the maintained NumPy reference."

  - id: cameron-wolfe-language-model-training-inference:training-systems
    kind: implementation-pattern
    summary: "The NanoGPT training walkthrough discusses distributed data parallelism, fully sharded data parallelism, gradient accumulation, data loading from context-sized chunks, learning-rate warm-up and cosine decay, automatic mixed precision, gradient clipping and the training loop."
