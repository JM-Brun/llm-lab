    - "Connects one next-token prediction objective to both pretraining and autoregressive inference rather than presenting two unrelated model mechanisms."
    - "Makes the key parallelism distinction explicit: causal masking permits all positions in a sequence to be predicted in one training forward pass, whereas generation extends the context iteratively."
