items:
  - id: eleventh-hour-enthusiast-platonic-representation-jepa-2026:pair-loss-laplacian
    kind: derivation
    summary: "For symmetric pair probabilities Π with marginal distribution p and D = diag(p), the expected squared-distance loss can be written as 2 tr(Hᵀ(D − Π)H). Thus D − Π is the weighted graph Laplacian of the positive-pair graph."
    locator: {type: section, value: "Which coordinates minimize the loss?", label: "Expansion of the pair loss into a trace"}
    evidence:
      kind: secondary-mathematical-derivation
      confidence: well-supported
      scope: "Full derivation in the Medium article, cross-checked against the primary paper's second-order objective framing."
      assumptions: ["Π is symmetric", "Both pair marginals equal p", "D is the diagonal matrix of p"]
      limitations: ["This is the squared-distance objective before adding anti-collapse constraints.", "The graph is over latent world states in the idealized model."]
    classification:
      primary_theme: mathematical-tools-geometry
      secondary_themes: [architectures-mechanisms]
      tags: [topic:jepa, topic:positive-pairs, topic:graph-laplacian]
      concept_ids: [training-objective]
    candidate_destinations:
      pages: []
      concepts: []
  - id: eleventh-hour-enthusiast-platonic-representation-jepa-2026:whitened-spectral-form
    kind: derivation
    summary: "With U = D^(1/2)H, centering and whitening impose UᵀU = I and orthogonality to the constant direction. The loss becomes 2k − 2 tr(UᵀKU), where K = D^(−1/2)ΠD^(−1/2). Ky Fan's maximum principle selects the k largest non-constant eigenvalues."
    locator: {type: section, value: "Whitening and normalized adjacency", label: "Reduction to a spectral trace maximization"}
    evidence:
      kind: secondary-mathematical-derivation
      confidence: well-supported
      scope: "Article's matrix derivation and spectral optimization explanation."
      assumptions: ["Centered, whitened second-order constraints", "Symmetric normalized adjacency matrix"]
      limitations: ["The spectral characterization applies to this constrained objective family, not automatically to all JEPA regularizers."]
    classification:
      primary_theme: mathematical-tools-geometry
      secondary_themes: [architectures-mechanisms]
      tags: [topic:jepa, topic:spectral-embedding, method:whitening]
      concept_ids: [training-objective]
    candidate_destinations:
      pages: []
      concepts: []
  - id: eleventh-hour-enthusiast-platonic-representation-jepa-2026:four-state-cycle
    kind: example
    summary: "For a four-state cycle with transition probability 1/2 to stay and 1/4 to either adjacent state, K has eigenvalues 1, 1/2, 1/2, 0. Retaining two coordinates selects the full tied eigenspace and yields a square up to rotation/reflection; retaining one coordinate allows equally optimal but geometrically different cosine- or sine-like solutions because the dimensionality boundary cuts through the eigenvalue tie."
    locator: {type: section, value: "When does the graph determine the geometry?", label: "Four-state cycle and cosine/sine eigenvectors"}
    evidence:
      kind: secondary-mathematical-example
      confidence: well-supported
      scope: "Explicit transition matrix and eigenvector calculation in the article."
      assumptions: ["Four equally likely states on a cycle", "Symmetric transition probabilities as specified in the example"]
      limitations: ["Toy example illustrates spectral non-uniqueness; it is not an empirical JEPA result."]
    classification:
      primary_theme: mathematical-tools-geometry
      tags: [topic:jepa, topic:eigengap, topic:spectral-embedding]
      concept_ids: [training-objective]
    candidate_destinations:
