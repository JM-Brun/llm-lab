    kind: mechanism
    summary: "Chapter 6's fast-tokenizer workflow exposes word IDs and offset mappings to align subword predictions with source-text spans. Offsets support token classification and extractive QA, including mapping predictions back from overflow windows; this fills a small implementation gap in LLM Lab's existing tokenizer theory."
