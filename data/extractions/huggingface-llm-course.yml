      value: "https://huggingface.co/learn/llm-course/fr/chapter1/1"
      label: "French Chapter 1 introduction"
    evidence:
      kind: course-outline
      confidence: high
      scope: "Visible French chapter navigation and introductory text."
      assumptions: []
      limitations: ["Only the introduction and outline were inspected, not the linked lesson bodies."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: []
      tags: [topic:transformer, topic:model-limitations, ecosystem:huggingface]
      concept_ids: [self-attention]
    candidate_destinations:
