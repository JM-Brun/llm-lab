      concepts: [fine-tuning]
    disposition: integrate-by-reference
  - id: huggingface-llm-course:chapter4-model-cards
    kind: implementation-pattern
    summary: "Chapter 4 treats a model card as a reusable and reproducible description of a shared model, covering intended uses, limitations, training data/procedure and evaluation. Added as an optional Build-path reference rather than a duplicate project provenance schema."
