schema_version: 1
source_id: huggingface-llm-course
reconstruction_basis:
  accessed_at: "2026-11-16"
  inspected:
    - "Current English LLM Course chapter index (chapters 0–12)"
    - "French Chapter 1 introduction and its visible section outline"
    - "Chapter 10 lesson bodies: Argilla setup, dataset configuration, annotation guidelines, multiple responses, export and quiz"
    - "Chapter 11 lesson bodies: chat templates, SFTTrainer, LoRA and evaluation"
    - "Chapter 12 lesson bodies: RL introduction, DeepSeek R1 walkthrough, GRPO and TRL implementation"
  not_inspected:
    - "Lesson bodies and code for Chapters 2–9"
    - "Notebooks, quizzes, videos, Hub artifacts and live demos"
    - "Runtime execution or learner outcomes"
  limitations:
    - "Index-level statements are not evidence of chapter depth or technical correctness."
    - "The English and French course outlines differ; the current French page appears to expose an earlier course outline."
    - "Living documentation was not pinned to an immutable commit."
    - "Chapters 10–12 were inspected as text and selected code; examples were not executed and no learner outcomes were measured."
    - "The course's GRPO code snippets and API defaults are version-sensitive; validate against a pinned TRL release before reproducing."
pedagogical_model:
  audience:
    declared: "Learners with good Python knowledge; prior deep-learning exposure recommended; prior PyTorch/TensorFlow expertise not required."
    confidence: high
  outcomes:
    - "Understand Transformer models and common NLP/LLM tasks."
    - "Use pretrained models and fine-tune them on datasets."
    - "Work with tokenizers and datasets."
    - "Share models and demos through the Hugging Face Hub."
    - "Explore dataset curation, LLM fine-tuning and reasoning-model construction."
  route:
    - "Setup"
    - "Transformer models"
    - "Using Transformers"
    - "Fine-tune a pretrained model"
    - "Share models and tokenizers"
    - "Datasets"
    - "Tokenizers"
    - "Classical NLP tasks"
    - "Ask for help"
    - "Build and share demos"
    - "Curate high-quality datasets"
    - "Fine-tune LLMs"
    - "Build reasoning models"
  route_status: "Reconstructed from the current English index; not a prerequisite graph."
items:
  - id: huggingface-llm-course:course-architecture
    kind: teaching-sequence
    summary: "The course progresses from Transformer concepts and pretrained-model use through fine-tuning, artifact sharing, data/tokenizer tooling and task recipes, before introducing data curation, LLM fine-tuning and reasoning-model construction."
    locator:
      type: page
      value: "https://huggingface.co/learn/llm-course/"
      label: "Current English course index"
    evidence:
      kind: course-outline
      confidence: high
      scope: "Visible chapter titles and the overview's declared outcomes."
      assumptions: []
      limitations: ["Does not establish lesson-level depth, chapter prerequisites or learner mastery."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [training-learning, text-tokenization]
      tags: [topic:transformer, topic:llm-training, ecosystem:huggingface]
      concept_ids: [self-attention, token]
    candidate_destinations:
      pages: []
      concepts: [self-attention, token]
    disposition: already-covered
  - id: huggingface-llm-course:chapter1-scope
    kind: teaching-sequence
    summary: "Chapter 1 introduces NLP as the broader field and LLMs as a subset, then frames Transformer capabilities, internal operation, encoder/decoder/sequence-to-sequence families, bias and limitations. The supplied French page exposes this outline."
