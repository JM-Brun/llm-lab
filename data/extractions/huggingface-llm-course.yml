  - id: huggingface-llm-course:chapter3-trainer-learning-curves
    kind: implementation-pattern
    summary: "Chapter 3 presents a pretrained task-fine-tuning workflow through both Trainer and a custom PyTorch loop, then teaches evaluation metrics and learning-curve interpretation. LLM Lab already covers the conceptual training loop and train/validation losses; the distinct value is the library-oriented implementation."
