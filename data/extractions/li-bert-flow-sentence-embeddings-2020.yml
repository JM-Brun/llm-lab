  - id: li-bert-flow-sentence-embeddings-2020:anisotropic-sentence-space
    kind: result
    summary: "The authors find that the studied pretrained BERT sentence embeddings occupy a non-smooth anisotropic space, which can make simple cosine or dot-product similarity unreliable in some regions."
    locator: {type: section, value: "§2.2, pp. 9120–9122", label: "Geometric analysis of BERT sentence embeddings"}
    evidence:
      kind: reported-analysis
      confidence: well-supported
      scope: "Sentence embeddings constructed from the BERT configurations and corpora evaluated in the paper."
      assumptions: []
      limitations: ["This is not a universal result for every sentence encoder or modern embedding model."]
    technical_assessment:
      status: correct
      rationale: "The claim is the central empirical motivation for BERT-flow in the paper."
      corroborating_sources: []
