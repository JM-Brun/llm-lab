  - id: li-bert-flow-sentence-embeddings-2020:normalizing-flow
    kind: mechanism
    summary: "BERT-flow learns an invertible normalizing-flow transformation that maps the BERT sentence-embedding distribution toward a standard isotropic Gaussian while keeping BERT's parameters fixed."
    locator: {type: section, value: "§3, pp. 9122–9124; Figure 1", label: "BERT-flow calibration"}
    evidence:
      kind: method-description
      confidence: established
      scope: "The post-hoc sentence-embedding transformation proposed by the paper."
      assumptions: []
