  - id: clare-nie-memonce-implementation:write-retrieve-inference-loop
    kind: implementation-pattern
    summary: "The released Qwen3.5 inference path segments history into chunks of at most 4096 tokens, writes one 64-token memory block per segment, keeps a 1024-token short-state FIFO, computes retrieval keys for stored blocks, and retrieves up to 64 long-term blocks for each question before constructing layer-specific memory KV caches."
    locator: {type: file, value: "eval/post-training/inference.py, MemOnceChat.write and MemOnceChat.answer; post-training/model.py", label: "Post-training memory session"}
