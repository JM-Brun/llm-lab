      assumptions: []
      limitations:
        - "The English rank-correlation table contains only six tokenizer-support conditions per task/model setting."
        - "For the 1B English model, the classification-task Spearman correlations are not statistically significant."
        - "The Turkish extrinsic evaluation uses only three tokenizer conditions because of compute cost."
        - "Correlation within this intervention is not proof that minimizing token count universally improves model quality."
    technical_assessment:
