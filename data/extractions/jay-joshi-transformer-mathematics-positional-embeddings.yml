  - id: jay-joshi-transformer-mathematics-positional-embeddings:relative-offset-rotation
    kind: claim
    summary: "For each sine/cosine frequency pair, the encoding at position pos + k is obtained from the pair at pos by a fixed two-dimensional rotation whose angle depends on k and that pair's frequency."
    locator: {type: section, value: "Positional encoding", label: "Relative-offset rotation explanation"}
    evidence:
      kind: mathematical-property
      confidence: well-supported
      scope: "The indexed snapshot invokes sine/cosine addition identities to motivate the fixed-rotation property."
      assumptions: ["The offset k is fixed.", "The rotation is considered separately for each frequency pair."]
      limitations: ["This does not guarantee that an attention head learns a discrete offset detector or attends to a fixed number of tokens back.", "The informal 'attend k tokens back' phrasing is motivation, not a theorem."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [mathematical-tools-geometry]
      tags: [topic:positional-encoding, method:sinusoidal-encoding]
      concept_ids: [positional-encoding]
