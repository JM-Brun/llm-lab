items:
  - id: jay-joshi-transformer-mathematics-positional-embeddings:permutation-equivariance
    kind: claim
    summary: "The article states that content-only self-attention treats the sequence as a set: permuting input rows permutes output rows in the same way. This is permutation equivariance, not permutation invariance."
    locator: {type: section, value: "Positional encoding", label: "Why positional information is needed"}
    evidence:
      kind: source-claim-with-independent-mathematical-check
      confidence: well-supported
      scope: "The indexed article explicitly states the row-shuffling property. The matrix derivation is an independent LLM Lab verification, not a derivation reproduced from the source."
      assumptions: ["Self-attention uses content-derived Q, K and V.", "No position-dependent bias, positional encoding or order-dependent mask is applied; the row permutation is applied consistently to Q, K and V."]
      limitations: ["A fixed causal mask is order-dependent and changes this symmetry; the statement must not be generalized to every causal Transformer computation.", "Permutation equivariance does not mean outputs are invariant to reordering."]
    classification:
      primary_theme: architectures-mechanisms
      secondary_themes: [mathematical-tools-geometry]
      tags: [topic:self-attention, topic:positional-encoding, method:permutation-equivariance]
      concept_ids: [self-attention, positional-encoding]
    candidate_destinations:
      pages: [fr/positional-encoding, en/positional-encoding]
      concepts: [self-attention, positional-encoding]
    pedagogical_profile:
      learner_question: "Why does content-based self-attention need an additional ordering signal?"
      explanatory_lens: symmetry
      teaching_form: [mathematical-derivation, mental-model]
      abstraction_level: intermediate
      prerequisites: [self-attention, matrix-permutation]
      distinctive_value: "Turns the informal set analogy into a precise symmetry property and clarifies the assumptions under which it holds."
      limitations: ["The source states the property informally; the matrix proof added to LLM Lab is an independent explanation."]
    pedagogical_assessment:
      novelty: {level: moderate, rationale: "The existing page says content embeddings alone do not encode position but does not expose the permutation-equivariance argument."}
      complementarity: {level: high, rationale: "A short optional proof explains why the need for positional information follows from the symmetry of content-only self-attention."}
      pedagogical_value: {level: high, rationale: "The distinction between equivariance and invariance prevents a common conceptual error and gives a mathematical reason for positional signals."}
      applicability: {level: high, rationale: "A compact optional note fits the existing positional-encoding concept lesson without adding a new page or concept."}
      redundancy: {level: low, rationale: "The current lesson does not derive this property."}
      evidence_quality: {level: high, rationale: "The source claim is visible in the indexed article; the property is independently checkable from the self-attention equations under stated assumptions."}
    disposition: integrate
    disposition_rationale: "Add a concise optional note to the existing bilingual positional-encoding lesson. Do not create a separate concept or computational-graph node: this is a property explaining the role of the existing self-attention and positional-encoding concepts."
