  - id: jay-joshi-transformer-mathematics-positional-embeddings:sinusoidal-position-encoding
    kind: derivation
    summary: "The article gives the standard sinusoidal encoding: even coordinates use sin(pos / 10000^(2i/d)) and odd coordinates use cos(pos / 10000^(2i/d)). Each paired coordinate is interpreted as a point on a circle with a dimension-dependent frequency."
