schema_version: 1
stages:
  - id: orientation
    title:
      fr: "Fonctionnement d’un LLM"
      en: "How an LLM works"
    objective:
      fr: "Comprendre ce qu'est un LLM et suivre une génération complète comme une boîte noire, avec des paramètres fixes, avant d'en étudier les mécanismes internes."
      en: "Understand what an LLM is and follow a complete generation loop as a black box with fixed parameters before studying its internal mechanisms."
    pages:
      fr: [fr/llm-overview, fr/generation]
      en: [en/llm-overview, en/generation]
    compact_title: {fr: "Prédiction et boucle", en: "Prediction and feedback"}
    conceptual_focus:
      llm-overview:
        objects: ["concept:next-token-prediction"]
        outcome: {fr: "Identifier ce que prédit le modèle", en: "Identify what the model predicts"}
      inference-generation:
        visit: preview
        mobilizes: ["concept:next-token-prediction"]
        objects: ["concept:autoregressive-generation"]
        outcome: {fr: "Suivre le retour du token choisi dans le contexte", en: "Follow the selected token back into the context"}
    optional_pages:
      fr: [fr/transformer-architectures, fr/llm-limits, fr/llm-evolution, fr/next-concept-modeling]
      en: [en/transformer-architectures, en/llm-limits, en/llm-evolution, en/next-concept-modeling]

  - id: text-input
    title:
      fr: "Du texte aux tokens"
      en: "From text to tokens"
    objective:
      fr: "Distinguer le texte, les tokens et les identifiants qui constituent l'entrée discrète du modèle, sans devoir connaître les algorithmes de segmentation."
      en: "Distinguish text, tokens, and token IDs that form the model's discrete input without needing to study segmentation algorithms."
    pages:
      fr: [fr/text-data]
      en: [en/text-data]
    compact_title: {fr: "Texte → identifiants", en: "Text → token IDs"}
    conceptual_focus:
      text-data:
        mobilizes: ["node:raw-text-context"]
        objects: ["concept:token", "node:token-ids"]
        outcome: {fr: "Relier chaque token à son identifiant", en: "Relate each token to its ID"}
    optional_pages:
      fr: [fr/tokenization-strategies, fr/unicode-text, fr/tokenizer-design-evaluation]
      en: [en/tokenization-strategies, en/unicode-text, en/tokenizer-design-evaluation]

  - id: representations
    title:
      fr: "Des identifiants aux représentations"
      en: "From IDs to representations"
    objective:
      fr: "Suivre la lecture des vecteurs d'embedding et l'ajout d'information positionnelle, puis distinguer les états initiaux des représentations contextualisées."
      en: "Trace embedding lookup and the addition of positional information, then distinguish initial states from contextualized representations."
    pages:
      fr: [fr/embedding-space, fr/positional-encoding, fr/contextualized-representations]
      en: [en/embedding-space, en/positional-encoding, en/contextualized-representations]
    compact_title: {fr: "Représentations", en: "Representations"}
    conceptual_focus:
      embedding-space:
        mobilizes: ["node:token-ids"]
        objects: ["concept:token-embedding"]
        outcome: {fr: "Retrouver le vecteur associé à un identifiant", en: "Retrieve the vector for a token ID"}
      positional-encoding:
        mobilizes: ["concept:token-embedding"]
        objects: ["concept:positional-encoding"]
        outcome: {fr: "Distinguer le contenu du token et sa position", en: "Distinguish token content from its position"}
      contextualized-representations:
        mobilizes: ["concept:token-embedding", "concept:positional-encoding"]
        objects: ["concept:contextualized-representation"]
        outcome: {fr: "Distinguer état initial et état contextualisé", en: "Distinguish initial and contextualized states"}
    optional_pages:
      fr: [fr/tensors, fr/rope, fr/sinusoidal-positional-encoding, fr/contextualized-representations-advanced, fr/embeddings-deep-dive]
      en: [en/tensors, en/rope, en/sinusoidal-positional-encoding, en/contextualized-representations-advanced, en/embeddings-deep-dive]

  - id: computation
    title:
      fr: "Comprendre le calcul du Transformer"
      en: "Understand Transformer computation"
    objective:
      fr: "Relier les projections Q/K/V, les scores et poids d'attention, l'agrégation des valeurs, le masque causal et les autres opérations d'un bloc Transformer."
      en: "Connect Q/K/V projections, attention scores and weights, value aggregation, causal masking, and the other operations in a Transformer block."
    pages:
      fr: [fr/transformer, fr/queries-keys-values, fr/scaled-dot-product-attention, fr/causal-masking]
      en: [en/transformer, en/queries-keys-values, en/scaled-dot-product-attention, en/causal-masking]
    compact_title: {fr: "Blocs Transformer", en: "Transformer blocks"}
    conceptual_focus:
      transformer:
        mobilizes: ["node:initial-hidden-states"]
        objects: ["node:forward-computation"]
        outcome: {fr: "Suivre la transformation des états par les blocs", en: "Trace how the blocks transform the states"}
      queries-keys-values:
        mobilizes: ["node:transformer-block-input"]
        objects: ["concept:query", "concept:key", "concept:value"]
        outcome: {fr: "Distinguer requête, clé et contenu agrégé", en: "Distinguish the query, key and aggregated content"}
      scaled-dot-product-attention:
        mobilizes: ["concept:query", "concept:key", "concept:value"]
        objects: ["concept:scaled-dot-product-attention"]
        outcome: {fr: "Passer des scores à une somme pondérée", en: "Turn scores into a weighted sum"}
      causal-masking:
        mobilizes: ["concept:attention-score"]
        objects: ["concept:causal-mask"]
        outcome: {fr: "Déterminer les positions accessibles", en: "Determine which positions are accessible"}
    optional_pages:
      fr: [fr/cross-attention, fr/attention-score-scaling, fr/queries-keys-values-advanced, fr/multimodal-architectures, fr/hybrid-llm-architectures]
      en: [en/cross-attention, en/attention-score-scaling, en/queries-keys-values-advanced, en/multimodal-architectures, en/hybrid-llm-architectures]

  - id: prediction
    title:
      fr: "Des états à la distribution prédictive"
      en: "From hidden states to the predictive distribution"
    objective:
      fr: "Suivre la projection des états finaux vers les logits et la distribution conditionnelle du prochain token ; interpréter son entropie avant toute sélection ou observation d'une cible."
      en: "Trace the projection from final hidden states to logits and the conditional next-token distribution; interpret its entropy before any token selection or observed target."
    pages:
      fr: [fr/logits, fr/probabilites, fr/entropy]
      en: [en/logits, en/probabilities, en/entropy]
    compact_title: {fr: "Distribution prédictive", en: "Predictive distribution"}
    conceptual_focus:
      logits:
        mobilizes: ["node:final-hidden-states"]
        objects: ["concept:logits"]
        outcome: {fr: "Associer un score à chaque token du vocabulaire", en: "Assign a score to each vocabulary token"}
      probabilites:
        mobilizes: ["concept:logits"]
        objects: ["concept:conditional-distribution"]
        outcome: {fr: "Normaliser les scores sur le vocabulaire", en: "Normalize scores over the vocabulary"}
      entropy:
        mobilizes: ["concept:conditional-distribution"]
        objects: ["concept:entropy"]
        outcome: {fr: "Mesurer l’incertitude avant observation", en: "Measure uncertainty before observation"}
    optional_pages:
      fr: []
      en: []

  - id: inference
    title:
      fr: "Exécuter l'inférence et générer du texte"
      en: "Run inference and generate text"
    objective:
      fr: "Distinguer le prefill du prompt du decode itératif, sélectionner un token selon une politique de décodage, le réinjecter dans le contexte et arrêter la génération sans mettre à jour les paramètres."
      en: "Distinguish prompt prefill from iterative decode, select a token with a decoding policy, feed it back into the context, and stop generation without updating parameters."
    pages:
      fr: [fr/generation]
      en: [en/generation]
    compact_title: {fr: "Générer", en: "Generate"}
    use_branch: generation
    conceptual_focus:
      inference-generation:
        visit: revisit
        mobilizes: ["concept:conditional-distribution"]
        objects: ["concept:autoregressive-generation", "concept:prefill", "concept:decode-step"]
        outcome: {fr: "Relier le premier token aux tours suivants", en: "Connect the first token to subsequent steps"}
    optional_pages:
      fr: [fr/decoding-strategies, fr/llm-computational-complexity]
      en: [en/decoding-strategies, en/llm-computational-complexity]

  - id: context-use
    title:
      fr: "Exploiter et concevoir le contexte"
      en: "Use and design context"
    objective:
      fr: "Distinguer les informations encodées dans les paramètres (pré-entraînement et fine-tuning) des informations récupérées ou fournies à l'inférence (RAG et contexte), puis comprendre comment un système les sélectionne, structure, actualise et sécurise."
      en: "Distinguish information encoded in parameters (pretraining and fine-tuning) from information retrieved or supplied at inference (RAG and context), then understand how a system selects, structures, updates, and secures it."
    pages:
      fr: [fr/in-context-learning, fr/context-engineering]
      en: [en/in-context-learning, en/context-engineering]
    compact_title: {fr: "Adapter le contexte", en: "Adapt the context"}
    use_branch: generation
    conceptual_focus:
      in-context-learning:
        mobilizes: ["node:token-context"]
        objects: ["concept:in-context-learning"]
        outcome: {fr: "Expliquer l’adaptation à paramètres fixes", en: "Explain adaptation with fixed parameters"}
      context-engineering:
        mobilizes: ["node:token-context"]
        objects: ["concept:context-engineering"]
        outcome: {fr: "Composer les informations fournies au modèle", en: "Assemble the information supplied to the model"}
    optional_pages:
      fr: [fr/rag-memory-boundaries, fr/document-retrieval]
      en: [en/rag-memory-boundaries, en/document-retrieval]

  - id: scoring
    title:
      fr: "Attribuer un score aux tokens observés"
      en: "Score observed tokens"
    objective:
      fr: "Évaluer la probabilité attribuée à une cible connue, construire la vraisemblance d'une séquence et relier la log-vraisemblance négative à l'entropie croisée, sans sélectionner de token ni modifier les paramètres."
      en: "Evaluate the probability assigned to a known target, build a sequence likelihood, and connect negative log-likelihood to cross-entropy without selecting a token or changing parameters."
    pages:
      fr: [fr/vraisemblance, fr/cross-entropy]
      en: [en/likelihood, en/cross-entropy]
    compact_title: {fr: "Scorer", en: "Score"}
    use_branch: observed-target-scoring
    conceptual_focus:
      vraisemblance:
        mobilizes: ["concept:conditional-distribution", "concept:observed-target"]
        objects: ["concept:sequence-likelihood"]
        outcome: {fr: "Évaluer la probabilité d’une séquence observée", en: "Evaluate the probability of an observed sequence"}
      cross-entropy:
        mobilizes: ["concept:conditional-distribution", "concept:observed-target"]
        objects: ["concept:cross-entropy"]
        outcome: {fr: "Calculer le coût prédictif associé à la cible", en: "Compute the predictive cost of the target"}
    optional_pages:
      fr: [fr/language-modeling-math, fr/mathematical-foundations]
      en: [en/language-modeling-math, en/mathematical-foundations]

  - id: training
    title:
      fr: "Apprendre et mettre à jour les paramètres"
      en: "Learn and update parameters"
    objective:
      fr: "Relier les cibles observées à la loss agrégée, aux gradients et aux mises à jour des paramètres, puis à la boucle d'entraînement répétée et à la loss de validation ; comprendre conceptuellement le teacher forcing, sans faire de la préparation des exemples décalés une étape du parcours théorique."
      en: "Connect observed targets to the aggregated loss, gradients, and parameter updates, then to the repeated training loop and validation loss; understand teacher forcing conceptually without making shifted-example preparation a stage of the Theory path."
    pages:
      fr: [fr/loss, fr/gradients, fr/training-loop]
      en: [en/loss, en/gradients, en/training-loop]
    compact_title: {fr: "Entraîner", en: "Train"}
    use_branch: training
    conceptual_focus:
      loss:
        mobilizes: ["concept:cross-entropy"]
        objects: ["node:loss-reduction", "node:training-objective"]
        outcome: {fr: "Agréger les pertes des positions valides", en: "Aggregate losses over valid positions"}
      gradients:
        mobilizes: ["node:training-objective"]
        objects: ["concept:gradient", "concept:parameter-update"]
        outcome: {fr: "Relier la pente à la mise à jour", en: "Relate the gradient to the update"}
      training-loop:
        mobilizes: ["concept:parameter-update"]
        objects: ["concept:training-loop"]
        outcome: {fr: "Répéter et contrôler l’apprentissage", en: "Repeat and monitor training"}
    optional_pages:
      fr: [fr/cross-entropy, fr/scaling-laws, fr/post-training, fr/mathematical-foundations, fr/score-centering]
      en: [en/cross-entropy, en/scaling-laws, en/post-training, en/mathematical-foundations, en/score-centering]

transitions:
  - id: predictive-distribution-to-generation
    from: prediction
    to: inference
    direction: directed
    pages:
      fr: [fr/generation]
      en: [en/generation]
    purpose:
      fr: "Relier la distribution conditionnelle du prochain token à sa sélection, puis à sa réinjection dans la boucle autorégressive jusqu'à l'arrêt."
      en: "Connect the conditional next-token distribution to token selection, then to feedback into the autoregressive loop until stopping."

  - id: observed-target-to-training-objective
    from: scoring
    to: training
    direction: symmetric
    pages:
      fr: [fr/cross-entropy]
      en: [en/cross-entropy]
    purpose:
      fr: "Relier le score attribué à une cible observée à l'objectif d'apprentissage qui agrège ces pénalités pour ajuster les paramètres, sans faire du scoring un prérequis."
      en: "Connect the score assigned to an observed target with the learning objective that aggregates these penalties to update parameters, without making scoring a prerequisite."
