schema_version: 1
stages:
  - id: orientation
    title:
      fr: "Fonctionnement d’un LLM"
      en: "How an LLM works"
    objective:
      fr: "Situer le contexte et les paramètres du modèle. Suivre deux tours de génération dans le panorama avant d’étudier le calcul de la prédiction."
      en: "Locate the model’s context and parameters. Follow two generation steps in the overview before studying how a prediction is computed."
    overview:
      question:
        fr: 'Que calcule un GPT à partir du texte qu’on lui donne ?'
        en: 'What does a GPT compute from the text it receives?'
      result:
        fr: 'Il attribue des probabilités aux candidats pour la suite immédiate.'
        en: 'It assigns probabilities to candidates for the next piece of text.'
      signature: 'c \mapsto p_\theta(\cdot \mid c)'
      criterion:
        fr: >-
          Pour un préfixe $c$ donné, la distribution porte sur le prochain token. Les paramètres $\theta$
          restent fixes pendant les deux tours du Panorama.
        en: >-
          For a given prefix $c$, the distribution is over the next token. The parameters $\theta$ stay
          fixed across the overview’s two steps.
    pages:
      fr: [fr/llm-overview]
      en: [en/llm-overview]
    compact_title: {fr: "Prédiction et boucle (aperçu)", en: "Prediction and loop (preview)"}
    conceptual_focus:
      llm-overview:
        visit: preview
        objects: ["concept:next-token-prediction", "concept:autoregressive-generation"]
        outcome: {fr: "Suivre deux tours de prédiction et de réinjection", en: "Trace two rounds of prediction and feedback"}
    optional_pages:
      fr: [fr/transformer-architectures, fr/llm-limits, fr/llm-evolution, fr/next-concept-modeling]
      en: [en/transformer-architectures, en/llm-limits, en/llm-evolution, en/next-concept-modeling]

  - id: text-input
    title:
      fr: "Du texte aux tokens"
      en: "From text to tokens"
    objective:
      fr: "Distinguer le texte, les tokens et les identifiants qui constituent l'entrée discrète du modèle, sans devoir connaître les algorithmes de segmentation."
      en: "Distinguish text, tokens, and token IDs that form the model's discrete input without needing to study segmentation algorithms."
    overview:
      question:
        fr: 'Comment le texte devient-il une entrée du réseau ?'
        en: 'How does text become input to the network?'
      result:
        fr: 'Un tokenizer découpe le texte en unités et retrouve le numéro de chacune dans son vocabulaire.'
        en: 'A tokenizer splits the text into units and looks up each unit’s ID in its vocabulary.'
      signature: 's \xrightarrow{\mathrm{tok}} (i_1,\ldots,i_T), \qquad i_t \in \{0,\ldots,V-1\}'
      criterion:
        fr: 'La longueur $T$ dépend du texte et du tokenizer. $V$ est la taille du vocabulaire.'
        en: 'The length $T$ depends on the text and the tokenizer. $V$ is the vocabulary size.'
    pages:
      fr: [fr/text-data]
      en: [en/text-data]
    compact_title: {fr: "Tokeniser", en: "Tokenize"}
    conceptual_focus:
      text-data:
        mobilizes: ["node:raw-text-context"]
        objects: ["concept:token", "node:token-ids"]
        outcome: {fr: "Relier chaque token à son identifiant", en: "Relate each token to its ID"}
    optional_pages:
      fr: [fr/tokenization-strategies, fr/unicode-text, fr/tokenizer-design-evaluation]
      en: [en/tokenization-strategies, en/unicode-text, en/tokenizer-design-evaluation]

  - id: representations
    title:
      fr: "Des identifiants aux représentations"
      en: "From IDs to representations"
    objective:
      fr: "Identifier les plongements et l’information de position. Comparer les états initiaux et contextualisés avant d’ouvrir les blocs qui transforment les premiers en seconds."
      en: "Identify embeddings and positional information. Compare initial and contextualized states before opening the blocks that turn the former into the latter."
    overview:
      question:
        fr: 'Que deviennent les numéros à l’entrée du réseau ?'
        en: 'What happens to the IDs at the network input?'
      result:
        fr: >-
          Chaque numéro sélectionne une liste de nombres. Dans le GPT du projet, on lui ajoute un signal
          qui dépend de sa position.
        en: >-
          Each ID selects a list of numbers. In the project’s GPT, a signal based on its position is added
          to that list.
      signature: 'H^{(0)}_t = E_\theta[i_t] + P_\theta[t]'
      criterion:
        fr: >-
          $E_\theta[i_t]$ est le même plongement de base pour toutes les occurrences du même ID, à table
          fixée. $P_\theta[t]$ dépend de la position.
        en: >-
          With a fixed embedding table, $E_\theta[i_t]$ is the same base embedding for every occurrence of
          the same ID. $P_\theta[t]$ depends on the position.
    pages:
      fr: [fr/embedding-space, fr/positional-encoding, fr/contextualized-representations]
      en: [en/embedding-space, en/positional-encoding, en/contextualized-representations]
    compact_title: {fr: "Représenter", en: "Represent"}
    conceptual_focus:
      embedding-space:
        mobilizes: ["node:token-ids"]
        objects: ["concept:token-embedding"]
        outcome: {fr: "Retrouver le vecteur associé à un identifiant", en: "Retrieve the vector for a token ID"}
      positional-encoding:
        mobilizes: ["concept:token-embedding"]
        objects: ["concept:positional-encoding"]
        outcome: {fr: "Distinguer le contenu du token et sa position", en: "Distinguish token content from its position"}
      contextualized-representations:
        mobilizes: ["concept:token-embedding", "concept:positional-encoding"]
        objects: ["concept:contextualized-representation"]
        outcome: {fr: "Expliquer pourquoi deux occurrences du même token peuvent avoir des états différents", en: "Explain why two occurrences of one token can have different states"}
    optional_pages:
      fr: [fr/tensors, fr/rope, fr/sinusoidal-positional-encoding, fr/contextualized-representations-advanced, fr/embeddings-deep-dive]
      en: [en/tensors, en/rope, en/sinusoidal-positional-encoding, en/contextualized-representations-advanced, en/embeddings-deep-dive]

  - id: computation
    title:
      fr: "Comprendre le calcul du Transformer"
      en: "Understand Transformer computation"
    objective:
      fr: "Relier les projections Q/K/V, les scores et poids d'attention, l'agrégation des valeurs, le masque causal et les autres opérations d'un bloc Transformer."
      en: "Connect Q/K/V projections, attention scores and weights, value aggregation, causal masking, and the other operations in a Transformer block."
    overview:
      question:
        fr: 'Comment le préfixe influence-t-il la représentation à une position ?'
        en: 'How does the prefix influence the representation at one position?'
      result:
        fr: >-
          D’un bloc à l’autre, l’attention combine des informations des positions accessibles et chaque
          position reçoit une représentation mise à jour.
        en: >-
          Across blocks, attention combines information from accessible positions and each position
          receives an updated representation.
      signature: 'H^{(0)} \mapsto H^{(L)}, \qquad H^{(0)}, H^{(L)} \in \mathbb{R}^{T \times d}'
      criterion:
        fr: >-
          $L$ est le nombre de blocs et $d$ la largeur des états. Dans un GPT causal, une modification
          après $t$ laisse l’état en $t$ inchangé à chaque couche, à positions et paramètres fixes et en
          mode déterministe.
        en: >-
          $L$ is the number of blocks and $d$ is the width of the states. In a causal GPT, a change after
          $t$ leaves the state at $t$ unchanged at each layer, with positions and parameters fixed and
          deterministic execution.
    pages:
      fr: [fr/transformer, fr/queries-keys-values, fr/scaled-dot-product-attention, fr/causal-masking]
      en: [en/transformer, en/queries-keys-values, en/scaled-dot-product-attention, en/causal-masking]
    compact_title: {fr: "Contextualiser", en: "Contextualize"}
    conceptual_focus:
      transformer:
        mobilizes: ["node:initial-hidden-states"]
        objects: ["node:forward-computation"]
        outcome: {fr: "Suivre la transformation des états par les blocs", en: "Trace how the blocks transform the states"}
      queries-keys-values:
        mobilizes: ["node:transformer-block-input"]
        objects: ["concept:query", "concept:key", "concept:value"]
        outcome: {fr: "Prévoir l’effet de V à requêtes, clés et masque fixés", en: "Predict the effect of V with queries, keys and mask fixed"}
      scaled-dot-product-attention:
        mobilizes: ["concept:query", "concept:key", "concept:value"]
        objects: ["concept:scaled-dot-product-attention", "node:attention-weights"]
        outcome: {fr: "Calculer les poids d’une requête et agréger les valeurs", en: "Compute one query’s weights and aggregate the values"}
      causal-masking:
        mobilizes: ["concept:attention-score"]
        objects: ["concept:causal-mask", "node:masked-attention-scores"]
        outcome: {fr: "Déterminer quelles positions participent au softmax", en: "Determine which positions participate in softmax"}
    optional_pages:
      fr: [fr/cross-attention, fr/attention-score-scaling, fr/queries-keys-values-advanced, fr/multimodal-architectures, fr/hybrid-llm-architectures]
      en: [en/cross-attention, en/attention-score-scaling, en/queries-keys-values-advanced, en/multimodal-architectures, en/hybrid-llm-architectures]

  - id: prediction
    title:
      fr: "Des états à la distribution prédictive"
      en: "From hidden states to the predictive distribution"
    objective:
      fr: "Suivre la projection des états finaux vers les logits et la distribution conditionnelle du prochain token ; interpréter son entropie avant toute sélection ou observation d'une cible."
      en: "Trace the projection from final hidden states to logits and the conditional next-token distribution; interpret its entropy before any token selection or observed target."
    overview:
      question:
        fr: 'Comment passe-t-on des représentations aux probabilités ?'
        en: 'How do representations become probabilities?'
      result:
        fr: >-
          L’état final donne un score brut par candidat. Le modèle transforme ces scores en probabilités
          qui totalisent 100 %.
        en: >-
          The final state gives one raw score per candidate. The model converts those scores into
          probabilities that total 100%.
      signature: 'h_T \mapsto z = W_\theta h_T + b_\theta \mapsto p = \operatorname{softmax}(z)'
      criterion:
        fr: >-
          $h_T$ désigne l’état de la dernière position en entrée de la tête de sortie. Le softmax
          transforme les scores en une distribution sur le vocabulaire. L’entropie dépend de toutes les
          probabilités.
        en: >-
          $h_T$ is the state of the last position at the output head’s input. Softmax maps scores to a
          distribution over the vocabulary. Entropy depends on all the probabilities.
    pages:
      fr: [fr/logits, fr/probabilites, fr/entropy]
      en: [en/logits, en/probabilities, en/entropy]
    compact_title: {fr: "Projeter et normaliser", en: "Project and normalize"}
    conceptual_focus:
      logits:
        mobilizes: ["node:final-hidden-states"]
        objects: ["concept:logits"]
        outcome: {fr: "Associer un score à chaque token du vocabulaire", en: "Assign a score to each vocabulary token"}
      probabilites:
        mobilizes: ["concept:logits"]
        objects: ["concept:conditional-distribution"]
        outcome: {fr: "Normaliser les scores sur le vocabulaire", en: "Normalize scores over the vocabulary"}
      entropy:
        mobilizes: ["concept:conditional-distribution"]
        objects: ["concept:entropy"]
        outcome: {fr: "Distinguer l’incertitude de la distribution et la surprise d’un token", en: "Distinguish distribution uncertainty from one token’s surprisal"}
    optional_pages:
      fr: []
      en: []

  - id: inference
    title:
      fr: "Exécuter l'inférence et générer du texte"
      en: "Run inference and generate text"
    objective:
      fr: "Distinguer le prefill du prompt du decode itératif, sélectionner un token selon une politique de décodage, le réinjecter dans le contexte et arrêter la génération sans mettre à jour les paramètres."
      en: "Distinguish prompt prefill from iterative decode, select a token with a decoding policy, feed it back into the context, and stop generation without updating parameters."
    overview:
      question:
        fr: 'Comment une prédiction devient-elle une suite de texte ?'
        en: 'How does a prediction become a continuation?'
      result:
        fr: >-
          Une règle choisit un candidat. On l’ajoute au texte, puis on recommence jusqu’au critère
          d’arrêt.
        en: >-
          A rule selects a candidate. It is appended to the text and the process repeats until the
          stopping criterion is met.
      signature: 'x_t \sim \pi(\cdot \mid p_\theta(\cdot\mid c_t)), \qquad c_{t+1} = c_t \Vert x_t'
      criterion:
        fr: >-
          Le symbole $\Vert$ désigne la concaténation. Les paramètres $\theta$ restent fixes. La politique
          de décodage $\pi$ règle le choix, qui peut être déterministe ou aléatoire.
        en: >-
          The symbol $\Vert$ denotes concatenation. The parameters $\theta$ stay fixed. The decoding
          policy $\pi$ controls selection, which can be deterministic or stochastic.
    pages:
      fr: [fr/generation]
      en: [en/generation]
    compact_title: {fr: "Générer (reprise)", en: "Generate (revisit)"}
    prediction_use:
      phase: output
      context: {fr: "S’allonge à chaque token réinjecté", en: "Grows with each token fed back"}
      parameters: fixed
      action: {fr: "Sélectionner puis réinjecter un token", en: "Select and feed back a token"}
    conceptual_focus:
      inference-generation:
        visit: revisit
        mobilizes: ["concept:conditional-distribution"]
        objects: ["concept:autoregressive-generation", "concept:prefill", "concept:decode-step"]
        outcome: {fr: "Relier le premier token aux tours suivants", en: "Connect the first token to subsequent steps"}
    optional_pages:
      fr: [fr/decoding-strategies, fr/llm-computational-complexity]
      en: [en/decoding-strategies, en/llm-computational-complexity]

  - id: context-use
    title:
      fr: "Exploiter et concevoir le contexte"
      en: "Use and design context"
    objective:
      fr: "Prolonger l’inférence côté application. Expliquer l’effet d’exemples fournis dans le prompt, puis choisir les informations qu’un système transmet au modèle."
      en: "Extend inference to the application level. Explain the effect of examples supplied in the prompt, then choose what information a system passes to the model."
    overview:
      question:
        fr: 'Que change-t-on lorsqu’on ajoute une consigne ou un document ?'
        en: 'What changes when an instruction or document is added?'
      result:
        fr: >-
          L’application sélectionne les éléments à transmettre. Le modèle recalcule sa prédiction à partir
          du texte qu’il reçoit.
        en: >-
          The application selects what to send. The model computes its prediction from the text it
          receives.
      signature: 'c \mapsto c'', \qquad p_\theta(\cdot\mid c) \mapsto p_\theta(\cdot\mid c'')'
      criterion:
        fr: >-
          On compare les deux entrées à paramètres $\theta$ fixés. L’effet des éléments ajoutés dépend de
          ce qui atteint effectivement le contexte.
        en: >-
          The two inputs are compared at fixed parameters $\theta$. The effect of added material depends
          on what actually reaches the context.
    pages:
      fr: [fr/in-context-learning, fr/context-engineering]
      en: [en/in-context-learning, en/context-engineering]
    compact_title: {fr: "Concevoir le contexte", en: "Design the context"}
    prediction_use:
      phase: input
      context: {fr: "Assemblé pour chaque appel", en: "Assembled for each call"}
      parameters: fixed
      action: {fr: "Choisir les informations fournies", en: "Choose the information supplied"}
    conceptual_focus:
      in-context-learning:
        mobilizes: ["node:token-context"]
        objects: ["concept:in-context-learning"]
        outcome: {fr: "Expliquer l’effet d’un exemple fourni à paramètres fixes", en: "Explain the effect of a supplied example with fixed parameters"}
      context-engineering:
        mobilizes: ["node:token-context"]
        objects: ["concept:context-engineering"]
        outcome: {fr: "Déterminer ce qui est effectivement transmis à chaque appel", en: "Determine what is actually supplied in each call"}
    optional_pages:
      fr: [fr/rag-memory-boundaries, fr/document-retrieval]
      en: [en/rag-memory-boundaries, en/document-retrieval]

  - id: scoring
    title:
      fr: "Attribuer un score aux tokens observés"
      en: "Score observed tokens"
    objective:
      fr: "Évaluer la probabilité attribuée à une cible connue, construire la vraisemblance d'une séquence et relier la log-vraisemblance négative à l'entropie croisée, sans sélectionner de token ni modifier les paramètres."
      en: "Evaluate the probability assigned to a known target, build a sequence likelihood, and connect negative log-likelihood to cross-entropy without selecting a token or changing parameters."
    overview:
      question:
        fr: 'Quelle probabilité a été attribuée à une suite déjà connue ?'
        en: 'What probability did the model assign to a known continuation?'
      result:
        fr: >-
          On relève la probabilité de chaque token de la suite à partir du texte déjà observé, puis on les
          combine.
        en: >-
          Each token’s probability is read using the text observed so far. Those probabilities are then
          combined.
      signature: '\log p_\theta(x_{1:n}\mid c) = \sum_{t=1}^{n} \log p_\theta(x_t \mid c \Vert x_{<t})'
      criterion:
        fr: >-
          À paramètres fixes, chaque terme utilise le préfixe observé à ce pas. Chaque probabilité de
          cible est une composante de sa distribution prédictive.
        en: >-
          At fixed parameters, each term uses the prefix observed at that step. Each target probability is
          one component of its predictive distribution.
    pages:
      fr: [fr/vraisemblance, fr/cross-entropy]
      en: [en/likelihood, en/cross-entropy]
    compact_title: {fr: "Scorer", en: "Score"}
    prediction_use:
      phase: output
      context: {fr: "Préfixe donné pour chaque cible", en: "Prefix given for each target"}
      parameters: fixed
      action: {fr: "Calculer le score d’une cible ou d’une suite observée", en: "Score an observed target or sequence"}
    conceptual_focus:
      vraisemblance:
        mobilizes: ["concept:conditional-distribution", "concept:observed-target"]
        objects: ["concept:sequence-likelihood", "concept:log-likelihood"]
        outcome: {fr: "Combiner les probabilités conditionnelles d’une suite observée", en: "Combine the conditional probabilities of an observed sequence"}
      cross-entropy:
        mobilizes: ["concept:conditional-distribution", "concept:observed-target"]
        objects: ["concept:cross-entropy", "node:token-nll"]
        outcome: {fr: "Calculer la pénalité à une position et reconnaître le cas one-hot", en: "Compute a one-position penalty and identify the one-hot case"}
    optional_pages:
      fr: [fr/language-modeling-math, fr/mathematical-foundations]
      en: [en/language-modeling-math, en/mathematical-foundations]

  - id: training
    title:
      fr: "Apprendre et mettre à jour les paramètres"
      en: "Learn and update parameters"
    objective:
      fr: "Relier les cibles observées à la loss agrégée, aux gradients et aux mises à jour des paramètres, puis à la boucle d'entraînement répétée et à la loss de validation ; comprendre conceptuellement le teacher forcing, sans faire de la préparation des exemples décalés une étape du parcours théorique."
      en: "Connect observed targets to the aggregated loss, gradients, and parameter updates, then to the repeated training loop and validation loss; understand teacher forcing conceptually without making shifted-example preparation a stage of the Theory path."
    overview:
      question:
        fr: 'Comment des exemples servent-ils à ajuster les paramètres ?'
        en: 'How do examples inform parameter updates?'
      result:
        fr: >-
          Les prédictions et les cibles donnent une perte. L’optimiseur utilise les gradients de cette
          perte pour ajuster les paramètres.
        en: 'Predictions and targets give a loss. The optimizer uses its gradients to update the parameters.'
      signature: 'L(\theta) \mapsto \nabla_\theta L \mapsto \theta'''
      criterion:
        fr: >-
          En teacher forcing, les préfixes et les cibles viennent des exemples observés. Les paramètres
          sont mis à jour au pas de l’optimiseur.
        en: >-
          With teacher forcing, prefixes and targets come from the observed examples. The optimizer step
          is where parameters are updated.
    pages:
      fr: [fr/loss, fr/gradients, fr/training-loop]
      en: [en/loss, en/gradients, en/training-loop]
    compact_title: {fr: "Entraîner", en: "Train"}
    prediction_use:
      phase: training
      context: {fr: "Préfixes des exemples observés", en: "Prefixes from observed examples"}
      parameters: updated
      action: {fr: "Agréger les pertes et ajuster les paramètres", en: "Aggregate losses and update parameters"}
    conceptual_focus:
      loss:
        mobilizes: ["node:token-nll"]
        objects: ["node:loss-reduction", "node:training-objective"]
        outcome: {fr: "Former un scalaire à partir des pertes sur les positions valides", en: "Form a scalar from the losses at valid positions"}
      gradients:
        mobilizes: ["node:training-objective"]
        objects: ["concept:gradient", "concept:parameter-update"]
        outcome: {fr: "Passer du gradient à la variation des paramètres", en: "Use the gradient to compute the parameter change"}
      training-loop:
        mobilizes: ["concept:parameter-update"]
        objects: ["concept:training-loop"]
        outcome: {fr: "Repérer quand les paramètres sont ajustés et quand le modèle est évalué", en: "Identify when parameters are updated and when the model is evaluated"}
    optional_pages:
      fr: [fr/cross-entropy, fr/scaling-laws, fr/post-training, fr/mathematical-foundations, fr/score-centering]
      en: [en/cross-entropy, en/scaling-laws, en/post-training, en/mathematical-foundations, en/score-centering]

transitions:
  - id: predictive-distribution-to-generation
    from: prediction
    to: inference
    direction: directed
    pages:
      fr: [fr/generation]
      en: [en/generation]
    purpose:
      fr: "Relier la distribution conditionnelle du prochain token à sa sélection, puis à sa réinjection dans la boucle autorégressive jusqu'à l'arrêt."
      en: "Connect the conditional next-token distribution to token selection, then to feedback into the autoregressive loop until stopping."

  - id: observed-target-to-training-objective
    from: scoring
    to: training
    direction: symmetric
    pages:
      fr: [fr/cross-entropy]
      en: [en/cross-entropy]
    purpose:
      fr: "Relier le score attribué à une cible observée à l'objectif d'apprentissage qui agrège ces pénalités pour ajuster les paramètres, sans faire du scoring un prérequis."
      en: "Connect the score assigned to an observed target with the learning objective that aggregates these penalties to update parameters, without making scoring a prerequisite."

lesson_contracts:
  llm-overview:
    synthesis: revision-llm-overview
  text-data:
    synthesis: revision-text-data
    requires: [llm-overview]
  embedding-space:
    synthesis: revision-embedding-space
    requires: [text-data]
  positional-encoding:
    synthesis: revision-positional-encoding
    requires: [embedding-space]
  contextualized-representations:
    synthesis: revision-contextualized-representations
    requires: [embedding-space, positional-encoding]
  transformer:
    synthesis: revision-transformer
    requires: [contextualized-representations]
  queries-keys-values:
    synthesis: revision-queries-keys-values
    requires: [transformer]
  scaled-dot-product-attention:
    synthesis: revision-scaled-dot-product-attention
    requires: [queries-keys-values]
  causal-masking:
    synthesis: revision-causal-masking
    requires: [scaled-dot-product-attention]
  logits:
    synthesis: revision-logits
    requires: [transformer]
  probabilites:
    synthesis: revision-probabilites
    requires: [logits]
  entropy:
    synthesis: revision-entropy
    requires: [probabilites]
  inference-generation:
    synthesis: revision-inference-generation
    requires: [probabilites]
  in-context-learning:
    synthesis: revision-in-context-learning
    requires: [inference-generation]
  context-engineering:
    synthesis: revision-context-engineering
    requires: [in-context-learning]
  vraisemblance:
    synthesis: revision-vraisemblance
    requires: [probabilites]
  cross-entropy:
    synthesis: revision-cross-entropy
    requires: [probabilites]
  loss:
    synthesis: revision-loss
    requires: [probabilites]
  gradients:
    synthesis: revision-gradients
    requires: [loss]
  training-loop:
    synthesis: revision-training-loop
    requires: [causal-masking, loss, gradients]

# Source review of conceptual boundaries in the Understand route (2026-11-20).
# Stage, concept, and page IDs reference the existing registries. Each criterion
# records an editorial judgment; the test verifies the referenced evidence exists.
# Show return links below a solution by including the
# generated-exercise-review-<page-id with slash replaced by hyphen>-<anchor>.qmd partial.
boundaries:
  token-ids-and-embedding-lookup:
    criterion: >-
      The vocabulary assigns token IDs and the embedding lookup uses them as row
      indices. At a fixed table, repeated IDs give identical lookup vectors in their
      original positions. For a fixed segmentation, permuting vocabulary IDs and
      applying the same permutation to the table rows preserves the lookup output.
    explanations:
      text-input:
        concept_ids: [token]
        pages: {fr: fr/text-data, en: en/text-data}
      representations:
        concept_ids: [token-embedding]
        pages: {fr: fr/embedding-space, en: en/embedding-space}
    transfer:
      pages: {fr: fr/text-data-exercises, en: en/text-data-exercises}
      anchor: ex-text-to-embedding-lookup
      label:
        fr: "Suivre les identifiants jusqu’aux lignes de la table de plongements"
        en: "Trace token IDs to their embedding rows"

  positional-input-and-contextualization:
    criterion: >-
      In a model with additive positional embeddings, two occurrences of the
      same token can enter the first block with different vectors because their
      positional terms differ. Causal self-attention then combines information
      from accessible positions to contextualize those inputs.
    explanations:
      representations:
        concept_ids: [token-embedding, positional-encoding]
        pages: {fr: fr/positional-encoding, en: en/positional-encoding}
      computation:
        concept_ids: [self-attention]
        pages: {fr: fr/transformer, en: en/transformer}
    transfer:
      pages: {fr: fr/text-data-exercises, en: en/text-data-exercises}
      anchor: ex-token-to-block-input
      label:
        fr: "Séparer l’ajout positionnel de la contextualisation"
        en: "Separate positional addition from contextualization"

  contextualization-and-causality:
    criterion: >-
      At a fixed token ID and position, the base embedding stays the same.
      A change in the accessible prefix can affect hidden states; a change
      exclusively in the future cannot affect the current state in a causal GPT.
    explanations:
      representations:
        concept_ids: [token-embedding, contextualized-representation]
        pages: {fr: fr/contextualized-representations, en: en/contextualized-representations}
      computation:
        concept_ids: [causal-mask]
        pages: {fr: fr/causal-masking, en: en/causal-masking}
    transfer:
      pages:
        fr: fr/contextualized-representations-exercises
        en: en/contextualized-representations-exercises
      anchor: ex-contextualization-causal-boundary
      label:
        fr: "Comparer un changement avant ou après le token étudié"
        en: "Compare a change before or after the token under study"

  final-states-and-next-token-prediction:
    criterion: >-
      The output head maps each final state to one score per vocabulary token,
      preserving the position axis. Softmax normalizes over the vocabulary at
      each position. For a single unpadded causal prefix, the last row gives the
      distribution for the token after the complete prefix.
    explanations:
      computation:
        concept_ids: [contextualized-representation]
        pages: {fr: fr/transformer, en: en/transformer}
      prediction:
        concept_ids: [output-projection, logits, softmax]
        pages: {fr: fr/logits, en: en/logits}
    transfer:
      pages: {fr: fr/logits-exercises, en: en/logits-exercises}
      anchor: ex-final-state-to-next-token
      label:
        fr: "Calculer les probabilités et repérer la ligne du prochain token"
        en: "Compute the probabilities and find the next-token row"

  attention-positions-and-vocabulary:
    criterion: >-
      For a fixed query, attention softmax normalizes scores over key positions
      and its weights combine the value vectors. Output softmax normalizes the
      logits over the vocabulary. Even if the two axes have the same length,
      adding attention weights at positions with the same token does not give
      its probability as a next token.
    explanations:
      computation:
        concept_ids: [attention-score, attention-weight]
        pages: {fr: fr/scaled-dot-product-attention, en: en/scaled-dot-product-attention}
      prediction:
        concept_ids: [softmax, conditional-distribution]
        pages: {fr: fr/probabilites, en: en/probabilities}
    transfer:
      pages: {fr: fr/logits-exercises, en: en/logits-exercises}
      anchor: ex-attention-vocabulary-softmax
      label:
        fr: "Distinguer les poids d’attention des probabilités du prochain token"
        en: "Distinguish attention weights from next-token probabilities"

  predictive-distribution-and-selection:
    criterion: >-
      At a fixed context and fixed logits, greedy decoding selects the unique
      maximum with probability one. Sampling at unit temperature with all candidates
      retained selects each token with its predicted probability.
    explanations:
      prediction:
        concept_ids: [softmax, conditional-distribution]
        pages: {fr: fr/probabilites, en: en/probabilities}
      inference:
        concept_ids: [decoding-policy]
        pages: {fr: fr/generation, en: en/generation}
    transfer:
      pages: {fr: fr/exercises-generation, en: en/exercises-generation}
      anchor: ex-generation-distribution-selection
      label:
        fr: "Comparer le choix glouton et le tirage à distribution fixée"
        en: "Compare greedy selection and sampling with a fixed distribution"

  predictive-entropy-and-observed-score:
    criterion: >-
      The entropy of a predictive distribution uses every outcome. The score
      of an observed token uses one probability. Equal observed scores can
      therefore coexist with different entropies at the same prediction step.
    explanations:
      prediction:
        concept_ids: [entropy]
        pages: {fr: fr/entropy, en: en/entropy}
      scoring:
        concept_ids: [observed-target, sequence-likelihood, log-likelihood]
        pages: {fr: fr/vraisemblance, en: en/likelihood}
    transfer:
      pages: {fr: fr/entropy-exercises, en: en/entropy-exercises}
      anchor: ex-entropy-and-observed-score
      label:
        fr: "Comparer deux distributions qui attribuent la même probabilité au token observé"
        en: "Compare two distributions that assign the same probability to the observed token"

  generation-and-observed-continuation:
    criterion: >-
      With fixed parameters, generation and scoring start from the same
      base next-token distribution at a shared prefix. Generation extends the prefix
      with the selected token. Scoring extends it with the observed token to
      evaluate the next target. The two prefixes can diverge as early as the
      second prediction. Greedy decoding can yield a continuation with lower
      model likelihood than the observed one over the same number of tokens.
    explanations:
      inference:
        concept_ids: [autoregressive-generation, decoding-policy]
        pages: {fr: fr/generation, en: en/generation}
      scoring:
        concept_ids: [teacher-forcing, sequence-likelihood]
        pages: {fr: fr/vraisemblance, en: en/likelihood}
    transfer:
      pages: {fr: fr/vraisemblance-exercises, en: en/likelihood-exercises}
      anchor: ex-generation-versus-scoring
      label:
        fr: "Suivre le préfixe généré et le préfixe observé"
        en: "Trace the generated and observed prefixes"

  generation-and-context-across-calls:
    criterion: >-
      Within a generation, the chosen token is fed back into the current prefix
      if generation continues. On another call, the application defines the input.
      Stored history and examples can affect the new prediction through context
      only if they are supplied again, directly or through derived information.
      Both calls can use the same fixed model parameters.
    explanations:
      inference:
        concept_ids: [autoregressive-generation]
        pages: {fr: fr/generation, en: en/generation}
      context-use:
        concept_ids: [context-engineering, in-context-learning]
        pages: {fr: fr/context-engineering, en: en/context-engineering}
    transfer:
      pages: {fr: fr/context-engineering-exercises, en: en/context-engineering-exercises}
      anchor: ex-context-between-calls
      label:
        fr: "Suivre ce qui passe d’un appel au suivant"
        en: "Trace what carries over to the next call"

  observed-score-and-parameter-update:
    criterion: >-
      At one included position with a one-hot target, equal target probabilities give
      equal cross-entropy losses. The gradient with respect to the logits is the
      predicted distribution minus the target vector. If only the additive output
      bias is trainable, different distributions with the same loss can give different
      bias updates under the same gradient-descent rule. Computing a gradient
      leaves the bias fixed. After an optimizer step, a new forward pass can assign
      different target probabilities even when the target bias changed equally.
    explanations:
      scoring:
        concept_ids: [cross-entropy, negative-log-likelihood]
        pages: {fr: fr/cross-entropy, en: en/cross-entropy}
      training:
        concept_ids: [gradient, parameter-update]
        pages: {fr: fr/gradients, en: en/gradients}
    transfer:
      pages: {fr: fr/gradients-exercises, en: en/gradients-exercises}
      anchor: ex-score-to-parameter-update
      label:
        fr: "Calculer deux mises à jour à perte égale"
        en: "Calculate two updates at equal loss"
