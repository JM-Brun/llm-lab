schema_version: 1
stages:
  - id: orientation
    title:
      fr: "Situer le système"
      en: "Place the system in context"
    objective:
      fr: "Comprendre ce qu'est un LLM et suivre une génération complète comme une boîte noire, avec des paramètres fixes, avant d'en étudier les mécanismes internes."
      en: "Understand what an LLM is and follow a complete generation loop as a black box with fixed parameters before studying its internal mechanisms."
    pages:
      fr: [fr/llm-overview, fr/generation]
      en: [en/llm-overview, en/generation]
    optional_pages:
      fr: [fr/transformer-architectures, fr/llm-limits]
      en: [en/transformer-architectures, en/llm-limits]

  - id: text-input
    title:
      fr: "Du texte aux tokens"
      en: "From text to tokens"
    objective:
      fr: "Distinguer le texte, les tokens et les identifiants qui constituent l'entrée discrète du modèle, sans devoir connaître les algorithmes de segmentation."
      en: "Distinguish text, tokens, and token IDs that form the model's discrete input without needing to study segmentation algorithms."
    pages:
      fr: [fr/text-data]
      en: [en/text-data]
    optional_pages:
      fr: [fr/tokenization-strategies, fr/unicode-text, fr/tokenizer-design-evaluation]
      en: [en/tokenization-strategies, en/unicode-text, en/tokenizer-design-evaluation]

  - id: representations
    title:
      fr: "Des identifiants aux représentations"
      en: "From IDs to representations"
    objective:
      fr: "Suivre la lecture des vecteurs d'embedding et l'ajout d'information positionnelle, puis distinguer les états initiaux des représentations contextualisées."
      en: "Trace embedding lookup and the addition of positional information, then distinguish initial states from contextualized representations."
    pages:
      fr: [fr/embedding-space, fr/positional-encoding, fr/contextualized-representations]
      en: [en/embedding-space, en/positional-encoding, en/contextualized-representations]
    optional_pages:
      fr: [fr/tensors, fr/rope]
      en: [en/tensors, en/rope]

  - id: computation
    title:
      fr: "Comprendre le calcul du Transformer"
      en: "Understand Transformer computation"
    objective:
      fr: "Relier les projections Q/K/V, les scores et poids d'attention, l'agrégation des valeurs, le masque causal et les autres opérations d'un bloc Transformer."
      en: "Connect Q/K/V projections, attention scores and weights, value aggregation, causal masking, and the other operations in a Transformer block."
    pages:
      fr: [fr/transformer, fr/queries-keys-values, fr/scaled-dot-product-attention, fr/causal-masking]
      en: [en/transformer, en/queries-keys-values, en/scaled-dot-product-attention, en/causal-masking]
    optional_pages:
      fr: [fr/cross-attention, fr/attention-score-scaling]
      en: [en/cross-attention, en/attention-score-scaling]

  - id: prediction
    title:
      fr: "Des états à la distribution prédictive"
      en: "From hidden states to the predictive distribution"
    objective:
      fr: "Suivre la projection des états finaux vers les logits et la distribution conditionnelle du prochain token ; interpréter son entropie avant toute sélection ou observation d'une cible."
      en: "Trace the projection from final hidden states to logits and the conditional next-token distribution; interpret its entropy before any token selection or observed target."
    pages:
      fr: [fr/logits, fr/probabilites, fr/entropy]
      en: [en/logits, en/probabilities, en/entropy]
    optional_pages:
      fr: []
      en: []

  - id: inference
    title:
      fr: "Exécuter l'inférence et générer du texte"
      en: "Run inference and generate text"
    objective:
      fr: "Distinguer le prefill du prompt du decode itératif, sélectionner un token selon une politique de décodage, le réinjecter dans le contexte et arrêter la génération sans mettre à jour les paramètres."
      en: "Distinguish prompt prefill from iterative decode, select a token with a decoding policy, feed it back into the context, and stop generation without updating parameters."
    pages:
      fr: [fr/generation]
      en: [en/generation]
    optional_pages:
      fr: [fr/decoding-strategies]
      en: [en/decoding-strategies]

  - id: context-use
    title:
      fr: "Exploiter et concevoir le contexte"
      en: "Use and design context"
    objective:
      fr: "Distinguer l'apprentissage en contexte de la mise à jour des paramètres, puis comprendre comment un système sélectionne, structure, actualise et sécurise les informations fournies au modèle."
      en: "Distinguish in-context learning from parameter updates, then understand how a system selects, structures, updates, and secures the information supplied to the model."
    pages:
      fr: [fr/in-context-learning, fr/context-engineering]
      en: [en/in-context-learning, en/context-engineering]
    optional_pages:
      fr: []
      en: []

  - id: scoring
    title:
      fr: "Attribuer un score aux tokens observés"
      en: "Score observed tokens"
    objective:
      fr: "Évaluer la probabilité attribuée à une cible connue, construire la vraisemblance d'une séquence et relier la log-vraisemblance négative à l'entropie croisée, sans sélectionner de token ni modifier les paramètres."
      en: "Evaluate the probability assigned to a known target, build a sequence likelihood, and connect negative log-likelihood to cross-entropy without selecting a token or changing parameters."
    pages:
      fr: [fr/vraisemblance, fr/cross-entropy]
      en: [en/likelihood, en/cross-entropy]
    optional_pages:
      fr: []
      en: []

  - id: training
    title:
      fr: "Apprendre et mettre à jour les paramètres"
      en: "Learn and update parameters"
    objective:
      fr: "Relier les cibles observées à la loss agrégée, aux gradients et aux mises à jour des paramètres, puis à la boucle d'entraînement répétée et à la loss de validation ; comprendre conceptuellement le teacher forcing, sans faire de la préparation des exemples décalés une étape du parcours théorique."
      en: "Connect observed targets to the aggregated loss, gradients, and parameter updates, then to the repeated training loop and validation loss; understand teacher forcing conceptually without making shifted-example preparation a stage of the Theory path."
    pages:
      fr: [fr/loss, fr/gradients, fr/training-loop]
      en: [en/loss, en/gradients, en/training-loop]
    optional_pages:
      fr: [fr/cross-entropy, fr/scaling-laws, fr/post-training]
      en: [en/cross-entropy, en/scaling-laws, en/post-training]

transitions:
  - id: inference-to-context-use
    from: inference
    to: context-use
    direction: directed
    pages:
      fr: [fr/generation, fr/in-context-learning, fr/context-engineering]
      en: [en/generation, en/in-context-learning, en/context-engineering]
    purpose:
      fr: "Relier la boucle d'inférence au contexte qui la conditionne : l'ICL décrit comment le modèle exploite les informations présentes, tandis que le context engineering décrit comment le système les prépare et les organise."
      en: "Connect the inference loop to the context that conditions it: ICL describes how the model uses the supplied information, while context engineering describes how the system prepares and organizes it."

  - id: predictive-distribution-to-generation
    from: prediction
    to: inference
    direction: directed
    pages:
      fr: [fr/generation]
      en: [en/generation]
    purpose:
      fr: "Relier la distribution conditionnelle du prochain token à sa sélection, puis à sa réinjection dans la boucle autorégressive jusqu'à l'arrêt."
      en: "Connect the conditional next-token distribution to token selection, then to feedback into the autoregressive loop until stopping."

  - id: observed-target-to-training-objective
    from: scoring
    to: training
    direction: symmetric
    pages:
      fr: [fr/cross-entropy]
      en: [en/cross-entropy]
    purpose:
      fr: "Relier le score attribué à une cible observée à l'objectif d'apprentissage qui agrège ces pénalités pour ajuster les paramètres, sans faire du scoring un prérequis."
      en: "Connect the score assigned to an observed target with the learning objective that aggregates these penalties to update parameters, without making scoring a prerequisite."
