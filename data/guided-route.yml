schema_version: 1
stages:
  - id: orientation
    title:
      fr: "Fonctionnement d’un LLM"
      en: "How an LLM works"
    objective:
      fr: "Situer le contexte et les paramètres du modèle. Suivre deux tours de génération dans le panorama avant d’étudier le calcul de la prédiction."
      en: "Locate the model’s context and parameters. Follow two generation steps in the overview before studying how a prediction is computed."
    overview:
      question:
        fr: 'Que calcule un GPT à partir du texte qu’on lui donne ?'
        en: 'What does a GPT compute from the text it receives?'
      result:
        fr: 'Il attribue une probabilité à chaque candidat pour la prochaine unité de texte, appelée token.'
        en: 'It assigns a probability to each candidate for the next unit of text, called a token.'
      signature: 'c \mapsto p_\theta(\cdot \mid c)'
      criterion:
        fr: >-
          Pour un préfixe $c$ donné, la distribution porte sur le prochain token. Les paramètres $\theta$
          restent fixes pendant les deux tours du Panorama.
        en: >-
          For a given prefix $c$, the distribution is over the next token. The parameters $\theta$ stay
          fixed across the overview’s two steps.
    pages:
      fr: [fr/llm-overview]
      en: [en/llm-overview]
    compact_title: {fr: "Vue d’ensemble", en: "Overview"}
    conceptual_focus:
      llm-overview:
        visit: preview
        objects: ["concept:next-token-prediction", "concept:autoregressive-generation"]
        outcome: {fr: "Suivre deux tours de prédiction et de réinjection", en: "Trace two rounds of prediction and feedback"}
    optional_pages:
      fr: [fr/transformer-architectures, fr/llm-limits, fr/llm-evolution, fr/next-concept-modeling]
      en: [en/transformer-architectures, en/llm-limits, en/llm-evolution, en/next-concept-modeling]

  - id: text-input
    title:
      fr: "Du langage aux tokens"
      en: "From language to tokens"
    objective:
      fr: "Comprendre pourquoi le réseau a besoin de représentations numériques, puis distinguer le texte, les tokens et les IDs qui constituent son entrée discrète, sans devoir connaître les algorithmes de segmentation."
      en: "Understand why the network needs numerical representations, then distinguish text, tokens, and IDs that form its discrete input without studying segmentation algorithms."
    overview:
      question:
        fr: 'Pourquoi et comment le texte devient-il une entrée calculable du réseau ?'
        en: 'Why and how does text become computable input to the network?'
      result:
        fr: 'Le réseau opère sur des objets numériques : le tokenizer fournit des IDs, qui servent d’adresses avant le lookup des vecteurs appris.'
        en: 'The network operates on numerical objects: the tokenizer supplies IDs, which act as addresses before learned-vector lookup.'
      signature: 's \xrightarrow{\mathrm{tok}} (i_1,\ldots,i_T), \qquad i_t \in \mathcal{I}_{\mathrm{tok}}'
      criterion:
        fr: >-
          La longueur $T$ dépend du texte $s$ et du tokenizer choisi. Les IDs appartiennent au vocabulaire de ce tokenizer :
          leurs valeurs servent d'adresses et ne mesurent ni une quantité linguistique ni une distance sémantique.
        en: >-
          Sequence length $T$ depends on text $s$ and the tokenizer. IDs belong to that tokenizer's vocabulary:
          their values act as addresses and measure neither a linguistic quantity nor semantic distance.
    pages:
      fr: [fr/language-representation, fr/text-data]
      en: [en/language-representation, en/text-data]
    compact_title: {fr: "Encoder", en: "Encode"}
    conceptual_focus:
      language-representation:
        mobilizes: ["concept:token"]
        objects: ["concept:token-id", "concept:token-embedding", "concept:contextualized-representation"]
        outcome:
          fr: "Expliquer comment des vecteurs appris et les transformations du réseau rendent exploitables des régularités linguistiques pour la prédiction, tout en distinguant ID, vecteur initial et état contextualisé."
          en: "Explain how learned vectors and network transformations make linguistic regularities usable for prediction, while distinguishing an ID, an initial vector, and a contextualized state."
      text-data:
        mobilizes: ["node:raw-text-context"]
        objects: ["concept:token", "node:token-ids"]
        outcome:
          fr: "Suivre le passage du texte aux IDs et expliquer ce qui varie entre deux tokenizers."
          en: "Trace text to IDs and explain what can change between two tokenizers."
    optional_pages:
      fr: [fr/tokenization-strategies, fr/unicode-text, fr/tokenizer-design-evaluation]
      en: [en/tokenization-strategies, en/unicode-text, en/tokenizer-design-evaluation]

  - id: representations
    title:
      fr: "Des identifiants aux représentations"
      en: "From IDs to representations"
    objective:
      fr: "Identifier les plongements et l’information de position. Comparer les états initiaux et contextualisés avant d’ouvrir les blocs qui transforment les premiers en seconds."
      en: "Identify embeddings and positional information. Compare initial and contextualized states before opening the blocks that turn the former into the latter."
    overview:
      question:
        fr: 'Que deviennent les numéros à l’entrée du réseau ?'
        en: 'What happens to the IDs at the network input?'
      result:
        fr: >-
          Chaque numéro sélectionne une liste de nombres. Dans le GPT du projet, on lui ajoute un signal
          qui dépend de sa position.
        en: >-
          Each ID selects a list of numbers. In the project’s GPT, a signal based on its position is added
          to that list.
      signature: 'H^{(0)}_t = E_\theta[i_t] + P_\theta[t]'
      criterion:
        fr: >-
          À table fixée, le même ID donne le même plongement de base $E_\theta[i_t]$. La formule décrit le
          GPT du projet, qui ajoute le vecteur de position appris $P_\theta[t]$ avant le premier bloc.
          Avec RoPE, l’information de position intervient sur les requêtes et les clés dans l’attention.
        en: >-
          With a fixed table, the same ID gives the same base embedding $E_\theta[i_t]$. The formula
          describes the project’s GPT, which adds the learned position vector $P_\theta[t]$ before the
          first block. RoPE instead applies positional information to queries and keys within attention.
    pages:
      fr: [fr/embedding-space, fr/positional-encoding, fr/contextualized-representations]
      en: [en/embedding-space, en/positional-encoding, en/contextualized-representations]
    compact_title: {fr: "Représenter", en: "Represent"}
    conceptual_focus:
      embedding-space:
        mobilizes: ["node:token-ids", "node:embedding-lookup"]
        objects: ["concept:token-embedding"]
        outcome: {fr: "Retrouver dans l’ordre les vecteurs sélectionnés par une séquence d’IDs et justifier l’égalité des occurrences répétées à table fixée", en: "Trace the vectors selected by an ID sequence in order and explain why repeated IDs retrieve the same vector with a fixed table"}
      positional-encoding:
        mobilizes: ["concept:token-embedding"]
        objects: ["concept:positional-encoding"]
        outcome: {fr: "Distinguer le contenu du token et sa position", en: "Distinguish token content from its position"}
      contextualized-representations:
        mobilizes: ["concept:token-embedding", "concept:positional-encoding"]
        objects: ["concept:contextualized-representation"]
        outcome: {fr: "Expliquer pourquoi deux occurrences du même token peuvent avoir des états différents", en: "Explain why two occurrences of one token can have different states"}
    optional_pages:
      fr: [fr/tensors, fr/rope, fr/sinusoidal-positional-encoding, fr/contextualized-representations-advanced, fr/embeddings-deep-dive]
      en: [en/tensors, en/rope, en/sinusoidal-positional-encoding, en/contextualized-representations-advanced, en/embeddings-deep-dive]

  - id: computation
    title:
      fr: "Comprendre le calcul du Transformer"
      en: "Understand Transformer computation"
    objective:
      fr: "Relier les projections Q/K/V, les scores et poids d'attention, l'agrégation des valeurs, le masque causal et les autres opérations d'un bloc Transformer."
      en: "Connect Q/K/V projections, attention scores and weights, value aggregation, causal masking, and the other operations in a Transformer block."
    overview:
      question:
        fr: 'Comment le préfixe influence-t-il la représentation à une position ?'
        en: 'How does the prefix influence the representation at one position?'
      result:
        fr: >-
          Dans chaque bloc, l’attention combine des informations des positions accessibles. Le MLP
          transforme ensuite la représentation de chaque position séparément.
        en: >-
          In each block, attention combines information from accessible positions. The MLP then
          transforms each position’s representation independently.
      signature: 'H^{(0)} \mapsto H^{(L)}, \qquad H^{(0)}, H^{(L)} \in \mathbb{R}^{T \times d}'
      criterion:
        fr: >-
          La pile conserve les $T$ positions et la largeur $d$ sur ses $L$ blocs. Pour chaque requête,
          le softmax d’attention normalise les scores sur les positions de clés autorisées. Dans un GPT
          causal, modifier les tokens après $t$ laisse l’état en $t$ inchangé à chaque couche, à positions
          et paramètres fixes et en mode déterministe.
        en: >-
          The stack preserves the $T$ positions and width $d$ across its $L$ blocks. For each query,
          attention softmax normalizes scores over the permitted key positions. In a causal GPT,
          changing tokens after $t$ leaves the state at $t$ unchanged at each layer, with positions and
          parameters fixed and deterministic execution.
    pages:
      fr: [fr/transformer, fr/queries-keys-values, fr/scaled-dot-product-attention, fr/causal-masking]
      en: [en/transformer, en/queries-keys-values, en/scaled-dot-product-attention, en/causal-masking]
    compact_title: {fr: "Contextualiser", en: "Contextualize"}
    conceptual_focus:
      transformer:
        mobilizes: ["node:initial-hidden-states"]
        objects: ["node:forward-computation"]
        outcome: {fr: "Suivre la transformation des états par les blocs", en: "Trace how the blocks transform the states"}
      queries-keys-values:
        mobilizes: ["node:transformer-block-input"]
        objects: ["concept:query", "concept:key", "concept:value"]
        outcome: {fr: "Prévoir l’effet de V à requêtes, clés et masque fixés", en: "Predict the effect of V with queries, keys and mask fixed"}
      scaled-dot-product-attention:
        mobilizes: ["concept:query", "concept:key", "concept:value"]
        objects: ["concept:scaled-dot-product-attention", "node:attention-weights"]
        outcome: {fr: "Calculer les poids d’une requête et agréger les valeurs", en: "Compute one query’s weights and aggregate the values"}
      causal-masking:
        mobilizes: ["concept:attention-score"]
        objects: ["concept:causal-mask", "node:masked-attention-scores"]
        outcome: {fr: "Déterminer quelles positions participent au softmax", en: "Determine which positions participate in softmax"}
    optional_pages:
      fr: [fr/cross-attention, fr/attention-score-scaling, fr/queries-keys-values-advanced, fr/multimodal-architectures, fr/hybrid-llm-architectures]
      en: [en/cross-attention, en/attention-score-scaling, en/queries-keys-values-advanced, en/multimodal-architectures, en/hybrid-llm-architectures]

  - id: prediction
    title:
      fr: "Des états à la distribution prédictive"
      en: "From hidden states to the predictive distribution"
    objective:
      fr: "Suivre la projection des états finaux vers les logits et la distribution conditionnelle du prochain token ; interpréter son entropie avant toute sélection ou observation d'une cible."
      en: "Trace the projection from final hidden states to logits and the conditional next-token distribution; interpret its entropy before any token selection or observed target."
    overview:
      question:
        fr: 'Comment passe-t-on des représentations aux probabilités ?'
        en: 'How do representations become probabilities?'
      result:
        fr: >-
          À chaque position, la tête de sortie donne un score par token du vocabulaire. Le softmax
          transforme ces scores en probabilités qui totalisent 100 % à cette position.
        en: >-
          At each position the output head gives one score per vocabulary token. Softmax converts the
          scores into probabilities that total 100% at that position.
      signature: |-
        \begin{aligned}
        z_t &= W_\theta h_t + b_\theta, \\
        p_t &= \operatorname{softmax}_{\mathrm{vocab}}(z_t).
        \end{aligned}
      criterion:
        fr: >-
          $h_t$ est l’état en entrée de la tête de sortie, après normalisation finale dans le GPT du projet.
          Pour un préfixe de $T$ tokens sans padding, $p_T$ prédit le token suivant le préfixe entier.
          L’entropie de cette distribution dépend des probabilités de tous les candidats.
        en: >-
          $h_t$ is the state at the output head’s input, after final normalization in the project’s GPT.
          For an unpadded prefix of $T$ tokens, $p_T$ predicts the token after the full prefix.
          The entropy of that distribution depends on the probabilities of all candidates.
    pages:
      fr: [fr/logits, fr/probabilites, fr/entropy]
      en: [en/logits, en/probabilities, en/entropy]
    compact_title: {fr: "Prédire", en: "Predict"}
    conceptual_focus:
      logits:
        mobilizes: ["node:final-hidden-states"]
        objects: ["concept:logits"]
        outcome: {fr: "Associer un score à chaque token du vocabulaire", en: "Assign a score to each vocabulary token"}
      probabilites:
        mobilizes: ["concept:logits"]
        objects: ["concept:conditional-distribution"]
        outcome: {fr: "Normaliser les scores sur le vocabulaire", en: "Normalize scores over the vocabulary"}
      entropy:
        mobilizes: ["concept:conditional-distribution"]
        objects: ["concept:entropy"]
        outcome: {fr: "Distinguer l’incertitude de la distribution et la surprise d’un token", en: "Distinguish distribution uncertainty from one token’s surprisal"}
    optional_pages:
      fr: []
      en: []

  - id: inference
    title:
      fr: "Exécuter l'inférence et générer du texte"
      en: "Run inference and generate text"
    objective:
      fr: "Distinguer le prefill du prompt du decode itératif, sélectionner un token selon une politique de décodage, le réinjecter dans le contexte et arrêter la génération sans mettre à jour les paramètres."
      en: "Distinguish prompt prefill from iterative decode, select a token with a decoding policy, feed it back into the context, and stop generation without updating parameters."
    overview:
      question:
        fr: 'Comment une prédiction devient-elle une suite de texte ?'
        en: 'How does a prediction become a continuation?'
      result:
        fr: >-
          Une règle choisit un candidat. On ajoute le token à la séquence, puis on recommence jusqu’au critère
          d’arrêt.
        en: >-
          A rule selects a candidate. The token is appended to the sequence and the process repeats until the
          stopping criterion is met.
      signature: |-
        \begin{aligned}
        x_t &\sim \pi(\cdot \mid p_\theta(\cdot\mid c_t)), \\
        c_{t+1} &= c_t \Vert x_t.
        \end{aligned}
      criterion:
        fr: >-
          Le symbole $\Vert$ désigne la concaténation. Les paramètres $\theta$ restent fixes. La politique
          de décodage $\pi$ donne les probabilités de sélection. Un choix déterministe donne une
          probabilité de sélection de 1 au candidat retenu.
        en: >-
          The symbol $\Vert$ denotes concatenation. The parameters $\theta$ stay fixed. The decoding
          policy $\pi$ gives the selection probabilities. A deterministic choice assigns selection
          probability 1 to the chosen candidate.
    pages:
      fr: [fr/generation]
      en: [en/generation]
    compact_title: {fr: "Générer", en: "Generate"}
    prediction_use:
      phase: output
      context: {fr: "S’allonge à chaque token réinjecté", en: "Grows with each token fed back"}
      parameters: fixed
      action: {fr: "Sélectionner puis réinjecter un token", en: "Select and feed back a token"}
    conceptual_focus:
      inference-generation:
        visit: revisit
        mobilizes: ["concept:conditional-distribution"]
        objects: ["concept:autoregressive-generation", "concept:prefill", "concept:decode-step"]
        outcome: {fr: "Relier le premier token aux tours suivants", en: "Connect the first token to subsequent steps"}
    optional_pages:
      fr: [fr/decoding-strategies, fr/llm-computational-complexity]
      en: [en/decoding-strategies, en/llm-computational-complexity]

  - id: context-use
    title:
      fr: "Exploiter et concevoir le contexte"
      en: "Use and design context"
    objective:
      fr: "Prolonger l’inférence côté application. Expliquer l’effet d’exemples fournis dans le prompt, puis choisir les informations qu’un système transmet au modèle."
      en: "Extend inference to the application level. Explain the effect of examples supplied in the prompt, then choose what information a system passes to the model."
    overview:
      question:
        fr: 'Que change-t-on lorsqu’on ajoute une consigne ou un document ?'
        en: 'What changes when an instruction or document is added?'
      result:
        fr: >-
          L’application choisit le contexte transmis au prochain appel. Le modèle calcule sa prédiction
          à partir des tokens de ce contexte.
        en: >-
          The application chooses the context for the next call. The model computes its prediction
          from the tokens in that context.
      signature: |-
        \begin{aligned}
        c &\longmapsto p_\theta(\cdot\mid c), \\
        c' &\longmapsto p_\theta(\cdot\mid c').
        \end{aligned}
      criterion:
        fr: >-
          On compare les deux entrées à paramètres $\theta$ fixés. L’effet des éléments ajoutés dépend de
          ce qui atteint effectivement le contexte.
        en: >-
          The two inputs are compared at fixed parameters $\theta$. The effect of added material depends
          on what actually reaches the context.
    pages:
      fr: [fr/in-context-learning, fr/context-engineering]
      en: [en/in-context-learning, en/context-engineering]
    compact_title: {fr: "Adapter le contexte", en: "Shape context"}
    prediction_use:
      phase: input
      context: {fr: "Assemblé pour chaque appel", en: "Assembled for each call"}
      parameters: fixed
      action: {fr: "Choisir les informations fournies", en: "Choose the information supplied"}
    conceptual_focus:
      in-context-learning:
        mobilizes: ["node:token-context"]
        objects: ["concept:in-context-learning"]
        outcome: {fr: "Expliquer l’effet d’un exemple fourni à paramètres fixes", en: "Explain the effect of a supplied example with fixed parameters"}
      context-engineering:
        mobilizes: ["node:token-context"]
        objects: ["concept:context-engineering"]
        outcome: {fr: "Déterminer ce qui est effectivement transmis à chaque appel", en: "Determine what is actually supplied in each call"}
    optional_pages:
      fr: [fr/rag-memory-boundaries, fr/document-retrieval]
      en: [en/rag-memory-boundaries, en/document-retrieval]

  - id: scoring
    title:
      fr: "Attribuer un score aux tokens observés"
      en: "Score observed tokens"
    objective:
      fr: "Évaluer la probabilité attribuée à une cible connue, construire la vraisemblance d'une séquence et relier la log-vraisemblance négative à l'entropie croisée, sans sélectionner de token ni modifier les paramètres."
      en: "Evaluate the probability assigned to a known target, build a sequence likelihood, and connect negative log-likelihood to cross-entropy without selecting a token or changing parameters."
    overview:
      question:
        fr: 'Quelle probabilité a été attribuée à une suite déjà connue ?'
        en: 'What probability did the model assign to a known continuation?'
      result:
        fr: >-
          À chaque pas, on lit la probabilité du token observé à partir du préfixe qui le précède.
          Le produit de ces probabilités donne la vraisemblance de la suite.
        en: >-
          At each step, we read the probability of the observed token given the prefix before it.
          The product of these probabilities gives the likelihood of the continuation.
      signature: |-
        \begin{gathered}
        \log p_\theta(x_{1:n}\mid c) \\
        = \sum_{t=1}^{n} \log p_\theta(x_t \mid c \Vert x_{<t}).
        \end{gathered}
      criterion:
        fr: >-
          À paramètres fixes, chaque terme utilise le contexte initial $c$ suivi des tokens observés
          avant la cible $x_t$. L’entropie croisée à cette position vaut l’opposé du terme correspondant
          lorsque la cible est one-hot.
        en: >-
          With parameters fixed, each term uses the initial context $c$ followed by the observed tokens
          before target $x_t$. For a one-hot target, the cross-entropy at that position is the negative
          of the corresponding term.
    pages:
      fr: [fr/vraisemblance, fr/cross-entropy]
      en: [en/likelihood, en/cross-entropy]
    compact_title: {fr: "Scorer", en: "Score"}
    prediction_use:
      phase: output
      context: {fr: "Préfixe donné pour chaque cible", en: "Prefix given for each target"}
      parameters: fixed
      action: {fr: "Calculer le score d’une cible ou d’une suite observée", en: "Score an observed target or sequence"}
    conceptual_focus:
      vraisemblance:
        mobilizes: ["concept:conditional-distribution", "concept:observed-target"]
        objects: ["concept:sequence-likelihood", "concept:log-likelihood"]
        outcome: {fr: "Combiner les probabilités conditionnelles d’une suite observée", en: "Combine the conditional probabilities of an observed sequence"}
      cross-entropy:
        mobilizes: ["concept:conditional-distribution", "concept:observed-target"]
        objects: ["concept:cross-entropy", "node:token-nll"]
        outcome: {fr: "Calculer la pénalité à une position et reconnaître le cas one-hot", en: "Compute a one-position penalty and identify the one-hot case"}
    optional_pages:
      fr: [fr/language-modeling-math, fr/mathematical-foundations]
      en: [en/language-modeling-math, en/mathematical-foundations]

  - id: training
    title:
      fr: "Apprendre et mettre à jour les paramètres"
      en: "Learn and update parameters"
    objective:
      fr: "Relier les cibles observées à la loss agrégée, aux gradients et aux mises à jour des paramètres, puis à la boucle d'entraînement répétée et à la loss de validation ; comprendre conceptuellement le teacher forcing, sans faire de la préparation des exemples décalés une étape du parcours théorique."
      en: "Connect observed targets to the aggregated loss, gradients, and parameter updates, then to the repeated training loop and validation loss; understand teacher forcing conceptually without making shifted-example preparation a stage of the Theory path."
    overview:
      question:
        fr: 'Comment des exemples servent-ils à ajuster les paramètres ?'
        en: 'How do examples inform parameter updates?'
      result:
        fr: >-
          Les prédictions et les cibles donnent une perte. L’optimiseur utilise les gradients de cette
          perte pour ajuster les paramètres.
        en: 'Predictions and targets give a loss. The optimizer uses its gradients to update the parameters.'
      signature: |-
        \begin{aligned}
        g &= \nabla_\theta \mathcal{L}(\theta), \\
        \theta' &= \theta - \eta g \quad \text{(SGD)}.
        \end{aligned}
      criterion:
        fr: >-
          En teacher forcing, les préfixes et les cibles viennent des exemples observés. La loss
          $\mathcal{L}$ agrège les pertes des positions cibles valides. Le calcul de $g$ laisse les
          paramètres fixes. La seconde ligne donne le pas de descente de gradient stochastique,
          avec un taux d’apprentissage $\eta$. En validation, on mesure la loss à paramètres fixes.
        en: >-
          With teacher forcing, prefixes and targets come from the observed examples. The loss
          $\mathcal{L}$ aggregates losses at valid target positions. Computing $g$ leaves the parameters
          fixed. The second line gives a stochastic gradient descent step with learning rate $\eta$.
          Validation measures loss with the parameters fixed.
    pages:
      fr: [fr/loss, fr/gradients, fr/training-loop]
      en: [en/loss, en/gradients, en/training-loop]
    compact_title: {fr: "Entraîner", en: "Train"}
    prediction_use:
      phase: training
      context: {fr: "Préfixes des exemples observés", en: "Prefixes from observed examples"}
      parameters: updated
      action: {fr: "Agréger les pertes et ajuster les paramètres", en: "Aggregate losses and update parameters"}
    conceptual_focus:
      loss:
        mobilizes: ["node:token-nll"]
        objects: ["node:loss-reduction", "node:training-objective"]
        outcome: {fr: "Former un scalaire à partir des pertes sur les positions valides", en: "Form a scalar from the losses at valid positions"}
      gradients:
        mobilizes: ["node:training-objective"]
        objects: ["concept:gradient", "concept:parameter-update"]
        outcome: {fr: "Passer du gradient à la variation des paramètres", en: "Use the gradient to compute the parameter change"}
      training-loop:
        mobilizes: ["concept:parameter-update"]
        objects: ["concept:training-loop"]
        outcome: {fr: "Repérer quand les paramètres sont ajustés et quand le modèle est évalué", en: "Identify when parameters are updated and when the model is evaluated"}
    optional_pages:
      fr: [fr/cross-entropy, fr/scaling-laws, fr/post-training, fr/mathematical-foundations, fr/score-centering]
      en: [en/cross-entropy, en/scaling-laws, en/post-training, en/mathematical-foundations, en/score-centering]

transitions:
  - id: predictive-distribution-to-generation
    from: prediction
    to: inference
    direction: directed
    pages:
      fr: [fr/generation]
      en: [en/generation]
    purpose:
      fr: "Relier la distribution conditionnelle du prochain token à sa sélection, puis à sa réinjection dans la boucle autorégressive jusqu'à l'arrêt."
      en: "Connect the conditional next-token distribution to token selection, then to feedback into the autoregressive loop until stopping."

  - id: predictive-distribution-to-observed-scoring
    from: prediction
    to: scoring
    direction: directed
    pages:
      fr: [fr/vraisemblance]
      en: [en/likelihood]
    purpose:
      fr: "Montrer que la même distribution conditionnelle peut servir soit à sélectionner un token à générer, soit à lire la probabilité d’une cible observée pour construire une vraisemblance. Le scoring suit le préfixe de référence : il ne sélectionne aucun token et ne modifie pas les paramètres."
      en: "Show that the same conditional distribution can be used either to select a token for generation or to read the probability of an observed target and build a likelihood. Scoring follows the reference prefix: it selects no token and does not update parameters."

  - id: observed-target-to-training-objective
    from: scoring
    to: training
    direction: symmetric
    pages:
      fr: [fr/cross-entropy]
      en: [en/cross-entropy]
    purpose:
      fr: "Relier le score attribué à une cible observée à l'objectif d'apprentissage qui agrège ces pénalités pour ajuster les paramètres, sans faire du scoring un prérequis."
      en: "Connect the score assigned to an observed target with the learning objective that aggregates these penalties to update parameters, without making scoring a prerequisite."

