# Source review of conceptual boundaries in the Understand route (2026-11-20).
# Stage, concept, and page IDs reference the existing registries. Each criterion
# records an editorial judgment; the test verifies the referenced evidence exists.
# Show return links below a solution by including the
# generated-exercise-review-<page-id with slash replaced by hyphen>-<anchor>.qmd partial.
boundaries:
  token-ids-and-embedding-lookup:
    criterion: >-
      The vocabulary assigns token IDs and the embedding lookup uses them as row
      indices. At a fixed table, repeated IDs give identical lookup vectors in their
      original positions. For a fixed segmentation, permuting vocabulary IDs and
      applying the same permutation to the table rows preserves the lookup output.
    explanations:
      text-input:
        concept_ids: [token]
        pages: {fr: fr/text-data, en: en/text-data}
      representations:
        concept_ids: [token-embedding]
        pages: {fr: fr/embedding-space, en: en/embedding-space}
    transfer:
      pages: {fr: fr/text-data-exercises, en: en/text-data-exercises}
      anchor: ex-text-to-embedding-lookup
      label:
        fr: "Suivre les identifiants jusqu’aux lignes de la table de plongements"
        en: "Trace token IDs to their embedding rows"

  positional-input-and-contextualization:
    criterion: >-
      In a model with additive positional embeddings, two occurrences of the
      same token can enter the first block with different vectors because their
      positional terms differ. Causal self-attention then combines information
      from accessible positions to contextualize those inputs.
    explanations:
      representations:
        concept_ids: [token-embedding, positional-encoding]
        pages: {fr: fr/positional-encoding, en: en/positional-encoding}
      computation:
        concept_ids: [self-attention]
        pages: {fr: fr/transformer, en: en/transformer}
    transfer:
      pages: {fr: fr/text-data-exercises, en: en/text-data-exercises}
      anchor: ex-token-to-block-input
      label:
        fr: "Séparer l’ajout positionnel de la contextualisation"
        en: "Separate positional addition from contextualization"

  contextualization-and-causality:
    criterion: >-
      At a fixed token ID and position, the base embedding stays the same.
      A change in the accessible prefix can affect hidden states; a change
      exclusively in the future cannot affect the current state in a causal GPT.
    explanations:
      representations:
        concept_ids: [token-embedding, contextualized-representation]
        pages: {fr: fr/contextualized-representations, en: en/contextualized-representations}
      computation:
        concept_ids: [causal-mask]
        pages: {fr: fr/causal-masking, en: en/causal-masking}
    transfer:
      pages:
        fr: fr/contextualized-representations-exercises
        en: en/contextualized-representations-exercises
      anchor: ex-contextualization-causal-boundary
      label:
        fr: "Comparer un changement avant ou après le token étudié"
        en: "Compare a change before or after the token under study"

  final-states-and-next-token-prediction:
    criterion: >-
      The output head maps each final state to one score per vocabulary token,
      preserving the position axis. Softmax normalizes over the vocabulary at
      each position. For a single unpadded causal prefix, the last row gives the
      distribution for the token after the complete prefix.
    explanations:
      computation:
        concept_ids: [contextualized-representation]
        pages: {fr: fr/transformer, en: en/transformer}
      prediction:
        concept_ids: [output-projection, logits, softmax]
        pages: {fr: fr/logits, en: en/logits}
    transfer:
      pages: {fr: fr/logits-exercises, en: en/logits-exercises}
      anchor: ex-final-state-to-next-token
      label:
        fr: "Calculer les probabilités et repérer la ligne du prochain token"
        en: "Compute the probabilities and find the next-token row"

  attention-positions-and-vocabulary:
    criterion: >-
      For a fixed query, attention softmax normalizes scores over key positions
      and its weights combine the value vectors. Output softmax normalizes the
      logits over the vocabulary. Even if the two axes have the same length,
      adding attention weights at positions with the same token does not give
      its probability as a next token.
    explanations:
      computation:
        concept_ids: [attention-score, attention-weight]
        pages: {fr: fr/scaled-dot-product-attention, en: en/scaled-dot-product-attention}
      prediction:
        concept_ids: [softmax, conditional-distribution]
        pages: {fr: fr/probabilites, en: en/probabilities}
    transfer:
      pages: {fr: fr/logits-exercises, en: en/logits-exercises}
      anchor: ex-attention-vocabulary-softmax
      label:
        fr: "Distinguer les poids d’attention des probabilités du prochain token"
        en: "Distinguish attention weights from next-token probabilities"

  predictive-distribution-and-selection:
    criterion: >-
      At a fixed context and fixed logits, greedy decoding selects the unique
      maximum with probability one. Sampling at unit temperature with all candidates
      retained selects each token with its predicted probability.
    explanations:
      prediction:
        concept_ids: [softmax, conditional-distribution]
        pages: {fr: fr/probabilites, en: en/probabilities}
      inference:
        concept_ids: [decoding-policy]
        pages: {fr: fr/generation, en: en/generation}
    transfer:
      pages: {fr: fr/exercises-generation, en: en/exercises-generation}
      anchor: ex-generation-distribution-selection
      label:
        fr: "Comparer le choix glouton et le tirage à distribution fixée"
        en: "Compare greedy selection and sampling with a fixed distribution"

  predictive-entropy-and-observed-score:
    criterion: >-
      The entropy of a predictive distribution uses every outcome. The score
      of an observed token uses one probability. Equal observed scores can
      therefore coexist with different entropies at the same prediction step.
    explanations:
      prediction:
        concept_ids: [entropy]
        pages: {fr: fr/entropy, en: en/entropy}
      scoring:
        concept_ids: [observed-target, sequence-likelihood, log-likelihood]
        pages: {fr: fr/vraisemblance, en: en/likelihood}
    transfer:
      pages: {fr: fr/entropy-exercises, en: en/entropy-exercises}
      anchor: ex-entropy-and-observed-score
      label:
        fr: "Comparer deux distributions qui attribuent la même probabilité au token observé"
        en: "Compare two distributions that assign the same probability to the observed token"

  generation-and-observed-continuation:
    criterion: >-
      With fixed parameters, generation and scoring start from the same
      base next-token distribution at a shared prefix. Generation extends the prefix
      with the selected token. Scoring extends it with the observed token to
      evaluate the next target. The two prefixes can diverge as early as the
      second prediction. Greedy decoding can yield a continuation with lower
      model likelihood than the observed one over the same number of tokens.
    explanations:
      inference:
        concept_ids: [autoregressive-generation, decoding-policy]
        pages: {fr: fr/generation, en: en/generation}
      scoring:
        concept_ids: [teacher-forcing, sequence-likelihood]
        pages: {fr: fr/vraisemblance, en: en/likelihood}
    transfer:
      pages: {fr: fr/vraisemblance-exercises, en: en/likelihood-exercises}
      anchor: ex-generation-versus-scoring
      label:
        fr: "Suivre le préfixe généré et le préfixe observé"
        en: "Trace the generated and observed prefixes"

  generation-and-context-across-calls:
    criterion: >-
      Within a generation, the chosen token is fed back into the current prefix
      if generation continues. On another call, the application defines the input.
      Stored history and examples can affect the new prediction through context
      only if they are supplied again, directly or through derived information.
      Both calls can use the same fixed model parameters.
    explanations:
      inference:
        concept_ids: [autoregressive-generation]
        pages: {fr: fr/generation, en: en/generation}
      context-use:
        concept_ids: [context-engineering, in-context-learning]
        pages: {fr: fr/context-engineering, en: en/context-engineering}
    transfer:
      pages: {fr: fr/context-engineering-exercises, en: en/context-engineering-exercises}
      anchor: ex-context-between-calls
      label:
        fr: "Suivre ce qui passe d’un appel au suivant"
        en: "Trace what carries over to the next call"

  attention-visibility-and-loss-mask:
    criterion: >-
      Causal attention determines which input positions can contribute to each
      prediction. A separate loss mask selects which shifted targets contribute
      to the objective. Excluding a token as a target leaves it available at
      its input position. Also, a changed future token can change the target
      being scored without changing the predicted distribution for that row.
    explanations:
      computation:
        concept_ids: [causal-mask]
        pages: {fr: fr/causal-masking, en: en/causal-masking}
      training:
        concept_ids: [loss-mask]
        pages: {fr: fr/loss, en: en/loss}
    transfer:
      pages: {fr: fr/loss-exercises, en: en/loss-exercises}
      anchor: ex-visible-token-masked-target
      label:
        fr: "Suivre un token visible en entrée et ignoré comme cible"
        en: "Trace a token visible as input and ignored as a target"

  observed-score-and-parameter-update:
    criterion: >-
      At one included position with a one-hot target, equal target probabilities give
      equal cross-entropy losses. The gradient with respect to the logits is the
      predicted distribution minus the target vector. If only the additive output
      bias is trainable, different distributions with the same loss can give different
      bias updates under the same gradient-descent rule. Computing a gradient
      leaves the bias fixed. After an optimizer step, a new forward pass can assign
      different target probabilities even when the target bias changed equally.
    explanations:
      scoring:
        concept_ids: [cross-entropy, negative-log-likelihood]
        pages: {fr: fr/cross-entropy, en: en/cross-entropy}
      training:
        concept_ids: [gradient, parameter-update]
        pages: {fr: fr/gradients, en: en/gradients}
    transfer:
      pages: {fr: fr/gradients-exercises, en: en/gradients-exercises}
      anchor: ex-score-to-parameter-update
      label:
        fr: "Calculer deux mises à jour à perte égale"
        en: "Calculate two updates at equal loss"
