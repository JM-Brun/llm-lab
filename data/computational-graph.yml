views:
  - id: persistent-spine
    labels: {fr: "Tronc computationnel", en: "Computational spine"}
    descriptions:
      fr: "Du contexte à la distribution conditionnelle, en passant par les représentations et le Transformer."
      en: "From context to the conditional distribution, through representations and the Transformer."
    nodes: [raw-text-context, tokenization, tokens, token-id-encoding, token-ids, token-context, forward-computation, embedding-lookup, token-embeddings, positional-information, initial-hidden-states, transformer-block-input, contextualized-hidden-states, final-hidden-states, vocabulary-projection, logits, vocabulary-softmax, next-token-distribution]
    edges: [e-context-tokenization, e-tokenization-tokens, e-tokens-id-encoding, e-id-encoding-ids, e-ids-context, e-context-forward, e-forward-logits, e-context-embedding, e-embedding-vectors, e-embeddings-initial, e-position-initial, e-initial-block-input, e-block-contextualized, e-contextualized-final, e-final-vocab, e-vocab-logits, e-logits-softmax, e-softmax-distribution]
  - id: transformer-block
    labels: {fr: "Intérieur d'un bloc Transformer", en: "Inside a Transformer block"}
    descriptions:
      fr: "Détail des projections Q/K/V, du masque causal, de l'attention et de la mise à jour des états."
      en: "Detail of Q/K/V projections, causal masking, attention, and state update."
    nodes: [transformer-block-input, query-projection, queries, key-projection, keys, value-projection, values, attention-score-computation, attention-scores, causal-mask, masked-attention-scores, attention-softmax, attention-weights, value-aggregation, attention-output, block-update, contextualized-hidden-states]
    edges: [e-block-q, e-q-projection, e-block-k, e-k-projection, e-block-v, e-v-projection, e-q-scores, e-k-scores, e-score-output, e-score-mask, e-mask-scores, e-scores-masked, e-masked-softmax, e-softmax-weights, e-weights-aggregation, e-values-aggregation, e-aggregation-output, e-attention-block, e-block-contextualized, e-contextualized-next-block]
  - id: generation
    labels: {fr: "Branche génération", en: "Generation branch"}
    descriptions:
      fr: "Sélectionne un token depuis la distribution puis le réinjecte dans le contexte."
      en: "Selects a token from the distribution and feeds it back into the context."
    nodes: [token-context, forward-computation, next-token-distribution, decoding-policy, generated-token]
    edges: [e-distribution-policy, e-policy-token, e-token-feedback]
  - id: observed-target-scoring
    labels: {fr: "Scoring d'une cible observée", en: "Observed-target scoring"}
    descriptions:
      fr: "Compare la distribution à une cible connue pour obtenir sa probabilité et la vraisemblance."
      en: "Compares the distribution with a known target to obtain its probability and likelihood."
    nodes: [next-token-distribution, observed-target, target-probability, target-probability-value, sequence-log-likelihood]
    edges: [e-distribution-target, e-target-score, e-target-probability-value, e-target-likelihood]
  - id: evaluation
    labels: {fr: "Branche évaluation", en: "Evaluation branch"}
    descriptions:
      fr: "Agrège les scores sur des données tenues à l'écart sans modifier les paramètres."
      en: "Aggregates scores on held-out data without changing parameters."
    nodes: [observed-target, target-probability, target-probability-value, sequence-log-likelihood, token-nll, evaluation-metrics]
    edges: [e-target-score, e-target-probability-value, e-target-likelihood, e-target-nll, e-score-metrics, e-loss-metrics]
  - id: training
    labels: {fr: "Branche apprentissage", en: "Training branch"}
    descriptions:
      fr: "Utilise les préfixes observés, calcule l'objectif, les gradients et la mise à jour des paramètres."
      en: "Uses observed prefixes, computes the objective and gradients, and updates parameters."
    nodes: [teacher-forcing, training-context, observed-target, token-context, next-token-distribution, target-probability, target-probability-value, token-nll, loss-reduction, training-objective, model-parameters, gradients, optimizer-update, updated-parameters]
    edges: [e-teacher-context, e-observed-context, e-training-forward, e-distribution-target, e-target-score, e-target-probability-value, e-target-nll, e-nll-reduction, e-loss-objective, e-objective-gradients, e-gradients-optimizer, e-params-optimizer, e-optimizer-updated, e-updated-params-forward]
  - id: inference-execution
    labels: {fr: "Phases d'exécution de l'inférence", en: "Inference execution phases"}
    descriptions:
      fr: "Distingue le traitement initial du prompt (prefill), le décodage itératif et le cache KV facultatif."
      en: "Distinguishes initial prompt processing (prefill), iterative decode, and the optional KV cache."
    nodes: [token-context, forward-computation, prefill, autoregressive-decode, kv-cache, next-token-distribution, generated-token]
    edges: [e-prefill-forward, e-decode-forward, e-prefill-cache, e-decode-cache, e-token-feedback]
