schema_version: 2
# Stable concept IDs are language-independent. Labels and descriptions are bilingual.
concepts:
  - id: token
    importance: core
    labels: {fr: "Token", en: "Token"}
    definitions:
      fr: "Unité discrète produite par la tokenisation et consommée par le modèle."
      en: "Discrete unit produced by tokenization and consumed by the model."
    domains: [text-tokenization]
    resources: [fr/text-data, en/text-data, fr/tokenization-strategies, en/tokenization-strategies]
  - id: token-embedding
    importance: core
    labels: {fr: "Plongement initial du token", en: "Initial token embedding"}
    definitions:
      fr: "Vecteur obtenu par consultation de la matrice de plongements à partir de l’identifiant du token."
      en: "Vector retrieved from the embedding matrix using the token ID."
    domains: [text-tokenization, mathematical-tools-geometry]
    resources: [fr/embedding-space, en/embedding-space]
  - id: contextualized-representation
    importance: core
    labels: {fr: "Représentation contextualisée", en: "Contextualized representation"}
    definitions:
      fr: "État vectoriel dont la valeur dépend du token, de son contexte et des calculs du réseau."
      en: "Vector state whose value depends on the token, its context, and the network computation."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/contextualized-representations, en/contextualized-representations]
  - id: query
    importance: supporting
    labels: {fr: "Query (requête)", en: "Query"}
    definitions:
      fr: "Projection qui encode ce qu’une position cherche à récupérer dans les autres positions."
      en: "Projection encoding what a position seeks to retrieve from other positions."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention, fr/cross-attention, en/cross-attention]
  - id: key
    importance: supporting
    labels: {fr: "Key (clé)", en: "Key"}
    definitions:
      fr: "Projection qui rend une position adressable par les requêtes des autres positions."
      en: "Projection that makes a position addressable by queries from other positions."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention, fr/cross-attention, en/cross-attention]
  - id: value
    importance: supporting
    labels: {fr: "Value (valeur)", en: "Value"}
    definitions:
      fr: "Projection porteuse de l’information agrégée selon les poids d’attention."
      en: "Projection carrying the information aggregated according to attention weights."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention, fr/cross-attention, en/cross-attention]
  - id: self-attention
    importance: core
    labels: {fr: "Auto-attention", en: "Self-attention"}
    definitions:
      fr: "Mécanisme qui calcule des poids entre positions d’une même séquence et agrège leurs valeurs."
      en: "Mechanism that computes weights between positions in one sequence and aggregates their values."
    domains: [architectures-mechanisms]
    resources: [fr/transformer, en/transformer, fr/transformer-architectures, en/transformer-architectures, fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
  - id: attention-score
    importance: supporting
    labels: {fr: "Score d'attention", en: "Attention score"}
    definitions:
      fr: >-
        Score de compatibilité calculé entre une requête et une clé avant sa conversion en poids
        d'attention normalisés.
      en: >-
        Compatibility score computed between a query and a key before conversion into normalized
        attention weights.
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
  - id: attention-weight
    importance: supporting
    labels: {fr: "Poids d'attention", en: "Attention weight"}
    definitions:
      fr: >-
        Coefficient normalisé, après prise en compte du masque éventuel, qui pondère la contribution
        d'une valeur à une sortie d'attention.
      en: >-
        Normalized coefficient, after any applicable mask, that weights a value's contribution
        to an attention output.
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
  - id: scaled-dot-product-attention
    importance: core
    labels: {fr: "Attention à produit scalaire mise à l'échelle", en: "Scaled dot-product attention"}
    definitions:
      fr: >-
        Mécanisme qui calcule des scores par produit scalaire entre requêtes et clés, les met à
        l'échelle, les normalise et agrège les vecteurs de valeur.
      en: >-
        Mechanism that computes query–key dot-product scores, scales and normalizes them, and
        aggregates value vectors.
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
  - id: multi-head-attention
    importance: supporting
    labels: {fr: "Attention multi-têtes", en: "Multi-head attention"}
    definitions:
      fr: >-
        Mécanisme qui exécute plusieurs calculs d'attention avec des projections propres à chaque
        tête, puis combine leurs sorties par concaténation et projection.
      en: >-
        Mechanism that runs multiple attention computations with per-head projections, then
        combines their outputs through concatenation and projection.
    domains: [architectures-mechanisms]
    resources:
      - fr/transformer
      - en/transformer
      - fr/transformer-block-walkthrough
      - en/transformer-block-walkthrough
  - id: causal-mask
    importance: core
    labels: {fr: "Masque causal", en: "Causal mask"}
    definitions:
      fr: "Contrainte qui empêche une position de prendre en compte les positions futures."
      en: "Constraint preventing a position from attending to future positions."
    domains: [architectures-mechanisms]
    resources:
      - fr/causal-masking
      - en/causal-masking
      - fr/scaled-dot-product-attention
      - en/scaled-dot-product-attention
      - fr/transformer-architectures
      - en/transformer-architectures
  - id: attention-mask
    importance: core
    labels: {fr: "Masque d'attention", en: "Attention mask"}
    definitions:
      fr: "Contrainte qui détermine quelles positions clés peuvent contribuer à la représentation calculée pour chaque position requête."
      en: "Constraint determining which key positions may contribute to the representation computed for each query position."
    domains: [architectures-mechanisms]
    resources: [fr/causal-masking, en/causal-masking, fr/training-examples, en/training-examples]
  - id: padding-mask
    importance: core
    labels: {fr: "Masque de padding", en: "Padding mask"}
    definitions:
      fr: "Masque d'attention qui empêche les positions de padding d'être utilisées comme contexte lorsqu'elles ne sont pas admissibles."
      en: "Attention mask that prevents padding positions from being used as context when they are not admissible."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/training-examples, en/training-examples]
  - id: document-boundary-mask
    importance: supporting
    labels: {fr: "Masque de frontière documentaire", en: "Document-boundary mask"}
    definitions:
      fr: "Masque d'attention qui contrôle si les positions appartenant à des documents différents peuvent interagir dans une séquence packée."
      en: "Attention mask that controls whether positions from different documents may interact within a packed sequence."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/training-examples, en/training-examples]
  - id: positional-encoding
    importance: core
    labels: {fr: "Encodage positionnel", en: "Positional encoding"}
    definitions:
      fr: "Mécanisme qui injecte ou expose l’information de position dans les calculs du modèle."
      en: "Mechanism that injects or exposes positional information in model computations."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/positional-encoding, en/positional-encoding]
  - id: output-projection
    importance: core
    labels: {fr: "Projection de sortie", en: "Output projection"}
    definitions:
      fr: "Transformation qui projette l’état final d’une position vers les scores du vocabulaire."
      en: "Transformation projecting a position's final state to vocabulary scores."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/logits, en/logits]
  - id: logits
    importance: core
    labels: {fr: "Logits", en: "Logits"}
    definitions:
      fr: "Scores non normalisés produits pour les tokens du vocabulaire avant conversion en probabilités."
      en: "Unnormalized scores produced for vocabulary tokens before conversion to probabilities."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/logits, en/logits]
  - id: softmax
    importance: core
    labels: {fr: "Softmax", en: "Softmax"}
    definitions:
      fr: "Transformation qui convertit un vecteur de scores en une distribution de probabilité."
      en: "Transformation converting a score vector into a probability distribution."
    domains: [mathematical-tools-geometry, probabilistic-foundations-training]
    resources:
      - fr/probabilites
      - en/probabilities
      - fr/scaled-dot-product-attention
      - en/scaled-dot-product-attention
  - id: cross-entropy
    importance: core
    labels: {fr: "Entropie croisée", en: "Cross-entropy"}
    definitions:
      fr: "Quantité qui mesure le coût probabiliste d’une distribution prédite relativement à une cible."
      en: "Quantity measuring the probabilistic cost of a predicted distribution relative to a target."
    domains: [probabilistic-foundations-training]
    resources: [fr/cross-entropy, en/cross-entropy]
  - id: training-objective
    importance: core
    labels: {fr: "Objectif d'entraînement", en: "Training objective"}
    definitions:
      fr: "Fonction optimisée pendant l'entraînement ; pour un GPT, la prédiction du prochain token. Ses garanties se limitent à la prédiction elle-même."
      en: "Function optimized during training; for a GPT, next-token prediction. Its guarantees are limited to prediction itself."
    domains: [probabilistic-foundations-training]
    resources: [fr/llm-limits, en/llm-limits, fr/llm-overview, en/llm-overview]
  - id: calibration
    importance: specialized
    labels: {fr: "Calibration", en: "Calibration"}
    definitions:
      fr: "Accord entre les probabilités prédites et les fréquences observées ; non garanti par l'objectif, à établir par une évaluation."
      en: "Agreement between predicted probabilities and observed frequencies; not guaranteed by the objective, established by evaluation."
    domains: [probabilistic-foundations-training]
    resources: [fr/llm-limits, en/llm-limits, fr/evaluation-experimentale, en/experimental-evaluation]
  - id: emergent-ability
    importance: specialized
    labels: {fr: "Capacité émergente", en: "Emergent ability"}
    definitions:
      fr: "Compétence qui semble apparaître au-delà d'une échelle de modèle ; sa réalité dépend de la tâche, de la métrique et du protocole."
      en: "Ability that seems to appear beyond a model scale; its reality depends on the task, the metric, and the protocol."
    domains: [scale-research]
    resources: [fr/llm-limits, en/llm-limits, fr/emergence, en/emergence]
  - id: operational-competence
    importance: supporting
    labels: {fr: "Compétence opérationnelle", en: "Operational competence"}
    definitions:
      fr: "Capacité mesurée sur des tâches dans un périmètre donné, distincte d'une thèse de compréhension humaine."
      en: "Ability measured on tasks within a given scope, distinct from a claim of human-like understanding."
    domains: [probabilistic-foundations-training]
    resources: [fr/llm-limits, en/llm-limits]
  - id: conditional-distribution
    importance: core
    labels: {fr: "Distribution conditionnelle du prochain token", en: "Next-token conditional distribution"}
    definitions:
      fr: "Distribution de probabilité sur le vocabulaire, conditionnée par le contexte précédent et produite à partir des logits."
      en: "Probability distribution over the vocabulary, conditioned on the preceding context and produced from logits."
    domains: [probabilistic-foundations-training, inference-efficiency]
    resources: [fr/probabilites, en/probabilities]
  - id: next-token-prediction
    importance: core
    labels: {fr: "Prédiction du prochain token", en: "Next-token prediction"}
    definitions:
      fr: "Tâche consistant à estimer, à chaque position, une distribution conditionnelle sur le token suivant à partir du contexte disponible."
      en: "Task of estimating, at each position, a conditional distribution over the next token from the available context."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/logits, en/logits, fr/probabilites, en/probabilities]
  - id: observed-target
    importance: core
    labels: {fr: "Token cible observé", en: "Observed target token"}
    definitions:
      fr: "Token suivant effectivement présent dans les données, utilisé pour évaluer la probabilité attribuée par le modèle."
      en: "The actual next token present in the data, used to evaluate the probability assigned by the model."
    domains: [probabilistic-foundations-training]
    resources: [fr/vraisemblance, en/likelihood, fr/training-examples, en/training-examples]
  - id: sequence-likelihood
    importance: core
    labels: {fr: "Vraisemblance d'une séquence", en: "Sequence likelihood"}
    definitions:
      fr: "Produit des probabilités conditionnelles attribuées par le modèle aux tokens observés successifs d'une séquence."
      en: "Product of the conditional probabilities assigned by the model to the successive observed tokens in a sequence."
    domains: [probabilistic-foundations-training]
    resources: [fr/vraisemblance, en/likelihood]
  - id: log-likelihood
    importance: supporting
    labels: {fr: "Log-vraisemblance", en: "Log-likelihood"}
    definitions:
      fr: "Logarithme de la vraisemblance d'une séquence, égal à la somme des log-probabilités conditionnelles des tokens observés."
      en: "Logarithm of a sequence likelihood, equal to the sum of the conditional log-probabilities of observed tokens."
    domains: [probabilistic-foundations-training]
    resources: [fr/vraisemblance, en/likelihood]
  - id: logarithm
    importance: supporting
    labels: {fr: "Logarithme", en: "Logarithm"}
    definitions:
      fr: "Transformation qui convertit une vraisemblance positive en log-vraisemblance et transforme un produit de probabilités en somme."
      en: "Transformation that converts a positive likelihood into log-likelihood and turns a product of probabilities into a sum."
    domains: [mathematical-tools-geometry, probabilistic-foundations-training]
    resources: [fr/vraisemblance, en/likelihood]
  - id: negation
    importance: supporting
    labels: {fr: "Opposé additif", en: "Additive inverse"}
    definitions:
      fr: "Transformation qui change le signe de la log-vraisemblance pour obtenir une quantité à minimiser."
      en: "Transformation that changes the sign of log-likelihood to obtain a quantity to minimize."
    domains: [mathematical-tools-geometry, probabilistic-foundations-training]
    resources: [fr/cross-entropy, en/cross-entropy]
  - id: negative-log-likelihood
    importance: core
    labels: {fr: "Négative log-vraisemblance", en: "Negative log-likelihood"}
    definitions:
      fr: "Opposé de la log-vraisemblance ; pour une cible one-hot au niveau token, elle correspond à l'entropie croisée."
      en: "Negative log-likelihood; for a one-hot token-level target, it equals cross-entropy."
    domains: [probabilistic-foundations-training]
    resources: [fr/cross-entropy, en/cross-entropy]
  - id: autoregressive-generation
    importance: core
    labels: {fr: "Génération autorégressive", en: "Autoregressive generation"}
    definitions:
      fr: "Procédure qui sélectionne un token à partir de la distribution prédite, l'ajoute au contexte, puis répète le calcul avec les mêmes paramètres."
      en: "Procedure that selects a token from the predicted distribution, appends it to the context, and repeats computation with unchanged parameters."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: decoding-policy
    importance: supporting
    labels: {fr: "Politique de décodage", en: "Decoding policy"}
    definitions:
      fr: "Règle déterministe ou stochastique qui sélectionne un token à partir de la distribution conditionnelle prédite."
      en: "Deterministic or stochastic rule that selects a token from the predicted conditional distribution."
    domains: [inference-efficiency]
    resources: [fr/decoding-strategies, en/decoding-strategies, fr/generation, en/generation]
  - id: prefill
    importance: core
    labels: {fr: "Prefill", en: "Prefill"}
    definitions:
      fr: "Phase d'inférence qui traite le prompt ou le contexte initial avant la génération incrémentale des tokens."
      en: "Inference phase that processes the prompt or initial context before incremental token generation."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: decode-step
    importance: core
    labels: {fr: "Étape de décodage incrémental", en: "Incremental decode step"}
    definitions:
      fr: "Étape d'inférence qui calcule la distribution du prochain token à partir du contexte étendu, puis sélectionne ce token."
      en: "Inference step that computes the next-token distribution from the extended context and selects that token."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: kv-cache
    importance: specialized
    labels: {fr: "Cache clé-valeur (KV cache)", en: "Key-value cache"}
    definitions:
      fr: "Mécanisme d'inférence qui conserve les clés et valeurs déjà calculées afin d'éviter de recalculer le préfixe à chaque étape."
      en: "Inference mechanism that retains previously computed keys and values to avoid recomputing the prefix at each step."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: generated-token-feedback
    importance: supporting
    labels: {fr: "Retour du token généré dans le contexte", en: "Generated-token context feedback"}
    definitions:
      fr: "Opération qui ajoute le token sélectionné au contexte afin que le calcul suivant conditionne sa prédiction sur ce token."
      en: "Operation that appends the selected token to the context so the next computation conditions its prediction on that token."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: training-example
    importance: core
    labels: {fr: "Exemple d'entraînement", en: "Training example"}
    definitions:
      fr: "Paire ou séquence d'entrées et de cibles alignées qui permet de calculer les prédictions du prochain token et leur coût."
      en: "Aligned input and target sequence or pair used to compute next-token predictions and their cost."
    domains: [probabilistic-foundations-training]
    resources: [fr/training-examples, en/training-examples]
  - id: teacher-forcing
    importance: core
    labels: {fr: "Teacher forcing", en: "Teacher forcing"}
    definitions:
      fr: "Stratégie qui fournit les tokens précédents observés comme contexte lors du calcul des prédictions d'entraînement, plutôt que les tokens générés par le modèle."
      en: "Strategy that supplies observed previous tokens as context when computing training predictions, rather than tokens generated by the model."
    domains: [probabilistic-foundations-training]
    resources: [fr/training-examples, en/training-examples]
  - id: loss-mask
    importance: core
    labels: {fr: "Masque de perte", en: "Loss mask"}
    definitions:
      fr: "Sélectionne les positions cibles qui contribuent à la loss ; ne détermine pas quelles positions peuvent être utilisées comme contexte par l'attention."
      en: "Selects target positions that contribute to the loss; it does not determine which positions attention may use as context."
    domains: [probabilistic-foundations-training]
    resources: [fr/loss, en/loss, fr/training-examples, en/training-examples]
  - id: gradient
    importance: core
    labels: {fr: "Gradient", en: "Gradient"}
    definitions:
      fr: "Dérivée de l'objectif par rapport aux paramètres, indiquant localement comment l'objectif varie lorsque les paramètres changent."
      en: "Derivative of the objective with respect to parameters, indicating locally how the objective changes as parameters change."
    domains: [probabilistic-foundations-training, mathematical-tools-geometry]
    resources: [fr/gradients, en/gradients]
  - id: optimizer
    importance: core
    labels: {fr: "Optimiseur", en: "Optimizer"}
    definitions:
      fr: "Algorithme qui utilise les gradients et son état interne pour calculer une mise à jour des paramètres."
      en: "Algorithm that uses gradients and its internal state to compute a parameter update."
    domains: [probabilistic-foundations-training]
    resources: [fr/gradients, en/gradients, fr/training-loop, en/training-loop]
  - id: parameter-update
    importance: core
    labels: {fr: "Mise à jour des paramètres", en: "Parameter update"}
    definitions:
      fr: "Modification des paramètres du modèle calculée par l'optimiseur à partir des gradients et de son état."
      en: "Modification of model parameters computed by the optimizer from gradients and its state."
    domains: [probabilistic-foundations-training]
    resources: [fr/gradients, en/gradients, fr/training-loop, en/training-loop]
  - id: training-loop
    importance: core
    labels: {fr: "Boucle d'entraînement", en: "Training loop"}
    definitions:
      fr: "Répétition du cycle passe avant, loss, gradient et mise à jour des paramètres sur des batchs successifs, accompagnée de mesures sur des données de validation sans mise à jour."
      en: "Repetition of the cycle of forward pass, loss, gradient and parameter update over successive batches, accompanied by measurements on validation data without updates."
    domains: [probabilistic-foundations-training]
    resources: [fr/training-loop, en/training-loop]
  - id: overfitting
    importance: core
    labels: {fr: "Surapprentissage", en: "Overfitting"}
    definitions:
      fr: "Situation où la loss d'entraînement continue de baisser alors que la loss de validation cesse de s'améliorer ou remonte, signe d'un ajustement à des détails de l'échantillon d'entraînement."
      en: "Situation where training loss keeps falling while validation loss stops improving or rises, indicating a fit to details of the training sample."
    domains: [probabilistic-foundations-training]
    resources: [fr/training-loop, en/training-loop]
  - id: held-out-evaluation
    importance: core
    labels: {fr: "Évaluation sur données réservées", en: "Held-out evaluation"}
    definitions:
      fr: "Évaluation de prédictions sur des données qui n'ont pas servi à ajuster les paramètres, sans mise à jour de ceux-ci."
      en: "Evaluation of predictions on data not used to fit parameters, without updating those parameters."
    domains: [probabilistic-foundations-training, scale-research]
    resources: [fr/evaluation-experimentale, en/experimental-evaluation, fr/llm-overview, en/llm-overview, fr/training-loop, en/training-loop]
  - id: in-context-learning
    labels: {fr: "Apprentissage en contexte", en: "In-context learning"}
    definitions:
      fr: "Comportement par lequel un modèle adapte ses prédictions aux instructions, exemples ou régularités présents dans son contexte d'entrée, sans mise à jour de ses paramètres."
      en: "Behavior in which a model adapts its predictions to instructions, examples, or patterns in its input context without updating its parameters."
    domains: [inference-efficiency]
    importance: core
    resources: [fr/in-context-learning, en/in-context-learning, fr/in-context-learning-exercises, en/in-context-learning-exercises, fr/llm-evolution, en/llm-evolution]
  - id: context-engineering
    labels: {fr: "Ingénierie du contexte", en: "Context engineering"}
    definitions:
      fr: "Pratique d'ingénierie qui sélectionne, récupère, structure, hiérarchise, actualise et sécurise les informations fournies à un modèle pour une tâche donnée."
      en: "Engineering practice that selects, retrieves, structures, prioritizes, updates, and secures the information supplied to a model for a given task."
    domains: [inference-efficiency]
    importance: core
    resources: [fr/context-engineering, en/context-engineering, fr/context-engineering-exercises, en/context-engineering-exercises]
  - id: pretraining
    labels: {fr: "Pré-entraînement", en: "Pretraining"}
    definitions:
      fr: "Phase d'entraînement initiale qui ajuste les paramètres du modèle sur un corpus à grande échelle selon un objectif prédéfini, souvent la prédiction du prochain token."
      en: "Initial training phase that adjusts model parameters on a large corpus using a defined objective, often next-token prediction."
    domains: [probabilistic-foundations-training]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: post-training
    labels: {fr: "Post-entraînement", en: "Post-training"}
    definitions:
      fr: "Ensemble de procédures appliquées après le pré-entraînement pour adapter le modèle à des instructions, préférences ou usages ciblés."
      en: "Set of procedures applied after pretraining to adapt a model to instructions, preferences, or targeted uses."
    domains: [probabilistic-foundations-training]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution, fr/post-training, en/post-training]
  - id: instruction-tuning
    labels: {fr: "Ajustement supervisé sur instructions", en: "Instruction tuning"}
    definitions:
      fr: "Fine-tuning supervisé sur des exemples associant des instructions à des réponses attendues."
      en: "Supervised fine-tuning on examples pairing instructions with expected responses."
    domains: [probabilistic-foundations-training]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: reinforcement-learning-from-human-feedback
    labels: {fr: "Apprentissage par renforcement à partir de retours humains", en: "Reinforcement learning from human feedback"}
    definitions:
      fr: "Famille de méthodes qui utilisent des préférences ou évaluations humaines pour orienter l'optimisation du comportement d'un modèle."
      en: "Family of methods using human preferences or evaluations to guide optimization of model behavior."
    domains: [probabilistic-foundations-training]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: direct-preference-optimization
    labels: {fr: "Optimisation directe sur préférences", en: "Direct preference optimization"}
    definitions:
      fr: "Méthode d'optimisation qui ajuste directement une politique à partir de comparaisons de préférences, sans entraîner séparément un modèle de récompense dans sa formulation de base."
      en: "Optimization method that directly adjusts a policy from preference comparisons, without separately training a reward model in its basic formulation."
    domains: [probabilistic-foundations-training]
    importance: specialized
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: inference-time-compute
    labels: {fr: "Calcul à l'inférence", en: "Inference-time compute"}
    definitions:
      fr: "Ressources de calcul supplémentaires mobilisées pendant l'utilisation du modèle pour traiter une requête, rechercher ou vérifier une réponse."
      en: "Additional compute resources used during model operation to process a request, search, or verify an answer."
    domains: [inference-efficiency]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: reasoning-model
    labels: {fr: "Modèle orienté raisonnement", en: "Reasoning model"}
    definitions:
      fr: "Modèle ou variante entraînée et/ou configurée pour consacrer davantage de calcul à la résolution de problèmes nécessitant plusieurs étapes."
      en: "Model or variant trained and/or configured to spend more compute on problems requiring multiple steps."
    domains: [inference-efficiency, scale-research]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: tool-calling
    labels: {fr: "Appel d'outil", en: "Tool calling"}
    definitions:
      fr: "Émission par le modèle d'une demande d'action structurée qu'une application ou un service externe peut exécuter."
      en: "Model emission of a structured action request that an application or external service can execute."
    domains: [inference-efficiency]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: agentic-system
    labels: {fr: "Système agentique", en: "Agentic system"}
    definitions:
      fr: "Système qui poursuit un objectif au moyen d'une boucle de planification, d'utilisation d'outils, d'observation des résultats et d'ajustement."
      en: "System that pursues a goal through a loop of planning, tool use, observing results, and adjustment."
    domains: [inference-efficiency]
    importance: specialized
    resources: [fr/llm-evolution, en/llm-evolution]

  - id: policy-gradient
    importance: supporting
    labels: {fr: "Gradient de politique", en: "Policy gradient"}
    definitions:
      fr: "Méthode d'optimisation d'une politique paramétrée qui utilise le gradient de la log-probabilité des actions échantillonnées, pondéré par un signal de récompense ou d'avantage."
      en: "Method for optimizing a parameterized policy using gradients of sampled-action log-probabilities weighted by a reward or advantage signal."
    domains: [probabilistic-foundations-training]
    resources: [fr/score-centering, en/score-centering]
  - id: score-function
    importance: supporting
    labels: {fr: "Fonction score", en: "Score function"}
    definitions:
      fr: "Gradient du logarithme de la probabilité d'une action ou d'un token sous une politique paramétrée ; à distinguer d'un score de compatibilité ou d'attention."
      en: "Gradient of the log-probability of an action or token under a parameterized policy; distinct from a compatibility or attention score."
    domains: [probabilistic-foundations-training, mathematical-tools-geometry]
    resources: [fr/score-centering, en/score-centering]
  - id: off-policy-reinforcement-learning
    importance: specialized
    labels: {fr: "Apprentissage par renforcement hors politique", en: "Off-policy reinforcement learning"}
    definitions:
      fr: "Apprentissage à partir de trajectoires produites par une politique de comportement qui peut différer de la politique dont on calcule la mise à jour."
      en: "Learning from trajectories generated by a behavior policy that may differ from the policy whose update is being computed."
    domains: [probabilistic-foundations-training, inference-efficiency]
    resources: [fr/score-centering, en/score-centering]
  - id: training-inference-mismatch
    importance: supporting
    labels: {fr: "Décalage entraînement-inférence", en: "Training-inference mismatch"}
    definitions:
      fr: "Écart entre les distributions effectives du moteur qui échantillonne les trajectoires et du moteur qui calcule les mises à jour d'entraînement."
      en: "Difference between the effective distributions of the engine sampling trajectories and the engine computing training updates."
    domains: [probabilistic-foundations-training, inference-efficiency]
    resources: [fr/score-centering, en/score-centering]
  - id: score-centering
    importance: specialized
    labels: {fr: "Centrage du score", en: "Score centering"}
    definitions:
      fr: "Correction additive qui soustrait, à chaque préfixe, l'espérance sous le sampler du score de la politique entraînée afin d'annuler le terme de dérive identifié en apprentissage hors politique."
      en: "Additive correction that subtracts, at each prefix, the sampler expectation of the trainer-policy score to cancel the identified drift term in off-policy learning."
    domains: [probabilistic-foundations-training, inference-efficiency]
    resources: [fr/score-centering, en/score-centering]
  - id: importance-sampling
    importance: supporting
    labels: {fr: "Échantillonnage par importance", en: "Importance sampling"}
    definitions:
      fr: "Technique qui pondère les échantillons par un rapport de probabilités afin d'estimer une espérance associée à une distribution cible à partir d'échantillons issus d'une autre distribution."
      en: "Technique that weights samples by a probability ratio to estimate an expectation under a target distribution from samples drawn from another distribution."
    domains: [probabilistic-foundations-training]
    resources: [fr/score-centering, en/score-centering]


  - id: next-concept-modeling
    importance: supporting
    labels: {fr: "Next-Concept Modeling (NCM)", en: "Next-Concept Modeling (NCM)"}
    definitions:
      fr: "Cadre de génération non autorégressive qui représente une séquence par une hiérarchie de codes discrets et prédit ces codes niveau par niveau, de grossier à fin, avec parallélisme à l'intérieur de chaque niveau."
      en: "Non-autoregressive generation framework that represents a sequence as a hierarchy of discrete codes and predicts those codes level by level, coarse to fine, with parallelism within each level."
    domains: [architectures-mechanisms, inference-efficiency]
    resources: [fr/next-concept-modeling, en/next-concept-modeling]
  - id: hierarchical-discrete-codes
    importance: specialized
    labels: {fr: "Codes discrets hiérarchiques", en: "Hierarchical discrete codes"}
    definitions:
      fr: "Représentation d'une séquence par plusieurs niveaux de codes discrets, les niveaux ultérieurs ajoutant des détails à la reconstruction fournie par les précédents."
      en: "Representation of a sequence through multiple levels of discrete codes, with later levels adding detail to the reconstruction supplied by earlier ones."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/next-concept-modeling, en/next-concept-modeling]
  - id: coarse-to-fine-generation
    importance: supporting
    labels: {fr: "Génération du grossier au fin", en: "Coarse-to-fine generation"}
    definitions:
      fr: "Stratégie qui génère d'abord une représentation grossière, puis la raffine par étapes successives ; dans NCM, les codes d'un même niveau sont prédits en parallèle."
      en: "Strategy that first generates a coarse representation and then refines it through successive stages; in NCM, codes within one level are predicted in parallel."
    domains: [architectures-mechanisms, inference-efficiency]
    resources: [fr/next-concept-modeling, en/next-concept-modeling]
  - id: multiscale-residual-vector-quantization
    importance: specialized
    labels: {fr: "Quantification vectorielle résiduelle multi-échelle", en: "Multiscale residual vector quantization"}
    definitions:
      fr: "Procédé de tokenisation appris qui encode une séquence en plusieurs niveaux de codes discrets résiduels, chaque niveau apportant une information de reconstruction supplémentaire."
      en: "Learned tokenization procedure that encodes a sequence into multiple levels of residual discrete codes, each level adding further reconstruction information."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/next-concept-modeling, en/next-concept-modeling]
  - id: joint-embedding-predictive-architecture
    importance: supporting
    labels: {fr: "Architecture à plongements joints prédictifs (JEPA)", en: "Joint-Embedding Predictive Architecture (JEPA)"}
    definitions:
      fr: "Famille d'architectures qui apprend des représentations en prédisant l'embedding d'une observation déclarée liée, sous une contrainte anti-effondrement qui empêche tous les embeddings de devenir identiques."
      en: "Family of architectures that learns representations by predicting the embedding of a declared-related observation, under an anti-collapse constraint that prevents all embeddings from becoming identical."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/jepa-platonic-representation, en/jepa-platonic-representation]
  - id: positive-pair-distribution
    importance: supporting
    labels: {fr: "Distribution de paires positives", en: "Positive-pair distribution"}
    definitions:
      fr: "Distribution des paires d'observations qu'un objectif d'entraînement déclare liées ; lue géométriquement, elle définit un graphe pondéré sur les observations."
      en: "Distribution of observation pairs that a training objective declares related; read geometrically, it defines a weighted graph over observations."
    domains: [probabilistic-foundations-training, mathematical-tools-geometry]
    resources: [fr/jepa-platonic-representation, en/jepa-platonic-representation]
  - id: platonic-representation-hypothesis
    importance: specialized
    labels: {fr: "Hypothèse de représentation platonique", en: "Platonic Representation Hypothesis"}
    definitions:
      fr: "Conjecture selon laquelle les représentations internes de modèles entraînés sur des modalités ou architectures différentes se ressemblent de plus en plus à mesure que les modèles et les données gagnent en échelle ; un théorème conditionnel la rend précise pour les JEPA dont les paires positives partagent les mêmes relations d'états du monde."
      en: "Conjecture that internal representations of models trained on different modalities or architectures increasingly resemble each other as models and data scale; a conditional theorem makes it precise for JEPAs whose positive pairs share the same world-state relations."
    domains: [scale-research, mathematical-tools-geometry]
    resources: [fr/jepa-platonic-representation, en/jepa-platonic-representation]
  - id: laplacian-eigenmaps
    importance: specialized
    labels: {fr: "Cartes propres laplaciennes (Laplacian eigenmaps)", en: "Laplacian eigenmaps"}
    definitions:
      fr: "Méthode d'apprentissage de variété qui attribue des coordonnées aux sommets d'un graphe pondéré en minimisant l'énergie de Dirichlet, de sorte que les sommets fortement reliés reçoivent des coordonnées proches ; la solution est portée par les premiers vecteurs propres du laplacien normalisé du graphe."
      en: "Manifold-learning method that assigns coordinates to the vertices of a weighted graph by minimizing the Dirichlet energy, so that strongly connected vertices receive nearby coordinates; the solution is carried by the leading eigenvectors of the normalized graph Laplacian."
    domains: [mathematical-tools-geometry]
    resources: [fr/jepa-platonic-representation, en/jepa-platonic-representation]

relation_types:
  represented-by:
    direction: directed
    family: representational
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est représenté par", en: "is represented by"}
    descriptions:
      fr: "La source est représentée par la cible."
      en: "The source concept is represented by the target."
  prerequisite:
    direction: directed
    family: pedagogical
    transitive: false
    acyclic: true
    learning_dependency: true
    inverse: null
    labels: {fr: "est prérequis pour", en: "is a prerequisite for"}
    descriptions:
      fr: "La source est nécessaire pour comprendre ou utiliser la cible ; cela ne définit pas à lui seul un ordre global du parcours."
      en: "The source is needed to understand or use the target; this alone does not define a global learning sequence."
  part-of:
    direction: directed
    family: structural
    transitive: true
    acyclic: true
    learning_dependency: false
    inverse: null
    labels: {fr: "fait partie de", en: "is part of"}
    descriptions:
      fr: "La source est un composant ou une partie de la cible."
      en: "The source is a component or part of the target."
  constrains:
    direction: directed
    family: constraint
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "contraint", en: "constrains"}
    descriptions:
      fr: "La source impose une contrainte à la cible."
      en: "The source imposes a constraint on the target."
  contributes-to:
    direction: directed
    family: functional
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "contribue à", en: "contributes to"}
    descriptions:
      fr: "La source contribue à la construction ou au fonctionnement de la cible."
      en: "The source contributes to the construction or operation of the target."
  applies-to:
    direction: directed
    family: functional
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "s'applique à", en: "applies to"}
    descriptions:
      fr: "Le mécanisme source peut être utilisé dans le contexte ou le mécanisme cible."
      en: "The source mechanism can be used within the target context or mechanism."
  mapped-by:
    direction: directed
    family: representational
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est projeté par", en: "is mapped by"}
    descriptions:
      fr: "La source est transformée ou projetée par la cible."
      en: "The source is transformed or projected by the target."
  produces:
    direction: directed
    family: functional
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "produit", en: "produces"}
    descriptions:
      fr: "La source produit la cible."
      en: "The source produces the target."
  normalized-by:
    direction: directed
    family: functional
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est normalisé par", en: "is normalized by"}
    descriptions:
      fr: "La source est normalisée par la transformation cible."
      en: "The source is normalized by the target transformation."
  contrasts-with:
    direction: symmetric
    family: associative
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est à distinguer de", en: "contrasts with"}
    descriptions:
      fr: "La source et la cible doivent être distinguées pour éviter une confusion conceptuelle ; cela n'implique pas qu'elles soient des opposés."
      en: "The source and target should be distinguished to prevent conceptual confusion; this does not imply that they are opposites."
  evaluated-by:
    direction: directed
    family: evaluative
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est évalué par", en: "is evaluated by"}
    descriptions:
      fr: "La source est évaluée au moyen de la cible."
      en: "The source is evaluated using the target."
