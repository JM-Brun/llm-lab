schema_version: 1
# Stable concept IDs are language-independent. Labels and descriptions are bilingual.
concepts:
  - id: token
    labels: {fr: "Token", en: "Token"}
    definitions:
      fr: "Unité discrète produite par la tokenisation et consommée par le modèle."
      en: "Discrete unit produced by tokenization and consumed by the model."
    domains: [text-tokenization]
    resources: [fr/text-data, en/text-data, fr/tokenization-strategies, en/tokenization-strategies]
  - id: token-embedding
    labels: {fr: "Plongement initial du token", en: "Initial token embedding"}
    definitions:
      fr: "Vecteur obtenu par consultation de la matrice de plongements à partir de l’identifiant du token."
      en: "Vector retrieved from the embedding matrix using the token ID."
    domains: [text-tokenization, mathematical-tools-geometry]
    resources: [fr/embedding-space, en/embedding-space]
  - id: contextualized-representation
    labels: {fr: "Représentation contextualisée", en: "Contextualized representation"}
    definitions:
      fr: "État vectoriel dont la valeur dépend du token, de son contexte et des calculs du réseau."
      en: "Vector state whose value depends on the token, its context, and the network computation."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/contextualized-representations, en/contextualized-representations]
  - id: query
    labels: {fr: "Query (requête)", en: "Query"}
    definitions:
      fr: "Projection qui encode ce qu’une position cherche à récupérer dans les autres positions."
      en: "Projection encoding what a position seeks to retrieve from other positions."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention, fr/cross-attention, en/cross-attention]
  - id: key
    labels: {fr: "Key (clé)", en: "Key"}
    definitions:
      fr: "Projection qui rend une position adressable par les requêtes des autres positions."
      en: "Projection that makes a position addressable by queries from other positions."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention, fr/cross-attention, en/cross-attention]
  - id: value
    labels: {fr: "Value (valeur)", en: "Value"}
    definitions:
      fr: "Projection porteuse de l’information agrégée selon les poids d’attention."
      en: "Projection carrying the information aggregated according to attention weights."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention, fr/cross-attention, en/cross-attention]
  - id: self-attention
    labels: {fr: "Auto-attention", en: "Self-attention"}
    definitions:
      fr: "Mécanisme qui calcule des poids entre positions d’une même séquence et agrège leurs valeurs."
      en: "Mechanism that computes weights between positions in one sequence and aggregates their values."
    domains: [architectures-mechanisms]
    resources: [fr/transformer, en/transformer, fr/transformer-architectures, en/transformer-architectures, fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
  - id: attention-score
    labels: {fr: "Score d'attention", en: "Attention score"}
    definitions:
      fr: >-
        Score de compatibilité calculé entre une requête et une clé avant sa conversion en poids
        d'attention normalisés.
      en: >-
        Compatibility score computed between a query and a key before conversion into normalized
        attention weights.
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
  - id: attention-weight
    labels: {fr: "Poids d'attention", en: "Attention weight"}
    definitions:
      fr: >-
        Coefficient normalisé, après prise en compte du masque éventuel, qui pondère la contribution
        d'une valeur à une sortie d'attention.
      en: >-
        Normalized coefficient, after any applicable mask, that weights a value's contribution
        to an attention output.
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
  - id: scaled-dot-product-attention
    labels: {fr: "Attention à produit scalaire mise à l'échelle", en: "Scaled dot-product attention"}
    definitions:
      fr: >-
        Mécanisme qui calcule des scores par produit scalaire entre requêtes et clés, les met à
        l'échelle, les normalise et agrège les vecteurs de valeur.
      en: >-
        Mechanism that computes query–key dot-product scores, scales and normalizes them, and
        aggregates value vectors.
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
  - id: multi-head-attention
    labels: {fr: "Attention multi-têtes", en: "Multi-head attention"}
    definitions:
      fr: >-
        Mécanisme qui exécute plusieurs calculs d'attention avec des projections propres à chaque
        tête, puis combine leurs sorties par concaténation et projection.
      en: >-
        Mechanism that runs multiple attention computations with per-head projections, then
        combines their outputs through concatenation and projection.
    domains: [architectures-mechanisms]
    resources:
      - fr/transformer
      - en/transformer
      - fr/transformer-block-walkthrough
      - en/transformer-block-walkthrough
  - id: causal-mask
    labels: {fr: "Masque causal", en: "Causal mask"}
    definitions:
      fr: "Contrainte qui empêche une position de prendre en compte les positions futures."
      en: "Constraint preventing a position from attending to future positions."
    domains: [architectures-mechanisms]
    resources:
      - fr/causal-masking
      - en/causal-masking
      - fr/scaled-dot-product-attention
      - en/scaled-dot-product-attention
      - fr/transformer-architectures
      - en/transformer-architectures
  - id: positional-encoding
    labels: {fr: "Encodage positionnel", en: "Positional encoding"}
    definitions:
      fr: "Mécanisme qui injecte ou expose l’information de position dans les calculs du modèle."
      en: "Mechanism that injects or exposes positional information in model computations."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/positional-encoding, en/positional-encoding]
  - id: output-projection
    labels: {fr: "Projection de sortie", en: "Output projection"}
    definitions:
      fr: "Transformation qui projette l’état final d’une position vers les scores du vocabulaire."
      en: "Transformation projecting a position's final state to vocabulary scores."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/logits, en/logits]
  - id: logits
    labels: {fr: "Logits", en: "Logits"}
    definitions:
      fr: "Scores non normalisés produits pour les tokens du vocabulaire avant conversion en probabilités."
      en: "Unnormalized scores produced for vocabulary tokens before conversion to probabilities."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/logits, en/logits]
  - id: softmax
    labels: {fr: "Softmax", en: "Softmax"}
    definitions:
      fr: "Transformation qui convertit un vecteur de scores en une distribution de probabilité."
      en: "Transformation converting a score vector into a probability distribution."
    domains: [mathematical-tools-geometry, probabilistic-foundations-training]
    resources:
      - fr/probabilites
      - en/probabilities
      - fr/scaled-dot-product-attention
      - en/scaled-dot-product-attention
  - id: cross-entropy
    labels: {fr: "Entropie croisée", en: "Cross-entropy"}
    definitions:
      fr: "Quantité qui mesure le coût probabiliste d’une distribution prédite relativement à une cible."
      en: "Quantity measuring the probabilistic cost of a predicted distribution relative to a target."
    domains: [probabilistic-foundations-training]
    resources: [fr/cross-entropy, en/cross-entropy]
  - id: training-objective
    labels: {fr: "Objectif d'entraînement", en: "Training objective"}
    definitions:
      fr: "Fonction optimisée pendant l'entraînement ; pour un GPT, la prédiction du prochain token. Ses garanties se limitent à la prédiction elle-même."
      en: "Function optimized during training; for a GPT, next-token prediction. Its guarantees are limited to prediction itself."
    domains: [probabilistic-foundations-training]
    resources: [fr/llm-limits, en/llm-limits, fr/llm-overview, en/llm-overview]
  - id: calibration
    labels: {fr: "Calibration", en: "Calibration"}
    definitions:
      fr: "Accord entre les probabilités prédites et les fréquences observées ; non garanti par l'objectif, à établir par une évaluation."
      en: "Agreement between predicted probabilities and observed frequencies; not guaranteed by the objective, established by evaluation."
    domains: [probabilistic-foundations-training]
    resources: [fr/llm-limits, en/llm-limits, fr/evaluation-experimentale, en/experimental-evaluation]
  - id: emergent-ability
    labels: {fr: "Capacité émergente", en: "Emergent ability"}
    definitions:
      fr: "Compétence qui semble apparaître au-delà d'une échelle de modèle ; sa réalité dépend de la tâche, de la métrique et du protocole."
      en: "Ability that seems to appear beyond a model scale; its reality depends on the task, the metric, and the protocol."
    domains: [scale-research]
    resources: [fr/llm-limits, en/llm-limits, fr/emergence, en/emergence]
  - id: operational-competence
    labels: {fr: "Compétence opérationnelle", en: "Operational competence"}
    definitions:
      fr: "Capacité mesurée sur des tâches dans un périmètre donné, distincte d'une thèse de compréhension humaine."
      en: "Ability measured on tasks within a given scope, distinct from a claim of human-like understanding."
    domains: [probabilistic-foundations-training]
    resources: [fr/llm-limits, en/llm-limits]
  - id: conditional-distribution
    labels: {fr: "Distribution conditionnelle du prochain token", en: "Next-token conditional distribution"}
    definitions:
      fr: "Distribution de probabilité sur le vocabulaire, conditionnée par le contexte précédent et produite à partir des logits."
      en: "Probability distribution over the vocabulary, conditioned on the preceding context and produced from logits."
    domains: [probabilistic-foundations-training, inference-efficiency]
    resources: [fr/probabilites, en/probabilities]
  - id: next-token-prediction
    labels: {fr: "Prédiction du prochain token", en: "Next-token prediction"}
    definitions:
      fr: "Tâche consistant à estimer, à chaque position, une distribution conditionnelle sur le token suivant à partir du contexte disponible."
      en: "Task of estimating, at each position, a conditional distribution over the next token from the available context."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/logits, en/logits, fr/probabilites, en/probabilities]
  - id: observed-target
    labels: {fr: "Token cible observé", en: "Observed target token"}
    definitions:
      fr: "Token suivant effectivement présent dans les données, utilisé pour évaluer la probabilité attribuée par le modèle."
      en: "The actual next token present in the data, used to evaluate the probability assigned by the model."
    domains: [probabilistic-foundations-training]
    resources: [fr/vraisemblance, en/likelihood, fr/training-examples, en/training-examples]
  - id: sequence-likelihood
    labels: {fr: "Vraisemblance d'une séquence", en: "Sequence likelihood"}
    definitions:
      fr: "Produit des probabilités conditionnelles attribuées par le modèle aux tokens observés successifs d'une séquence."
      en: "Product of the conditional probabilities assigned by the model to the successive observed tokens in a sequence."
    domains: [probabilistic-foundations-training]
    resources: [fr/vraisemblance, en/likelihood]
  - id: log-likelihood
    labels: {fr: "Log-vraisemblance", en: "Log-likelihood"}
    definitions:
      fr: "Logarithme de la vraisemblance d'une séquence, égal à la somme des log-probabilités conditionnelles des tokens observés."
      en: "Logarithm of a sequence likelihood, equal to the sum of the conditional log-probabilities of observed tokens."
    domains: [probabilistic-foundations-training]
    resources: [fr/vraisemblance, en/likelihood]
  - id: negative-log-likelihood
    labels: {fr: "Négative log-vraisemblance", en: "Negative log-likelihood"}
    definitions:
      fr: "Opposé de la log-vraisemblance ; pour une cible one-hot au niveau token, elle correspond à l'entropie croisée."
      en: "Negative log-likelihood; for a one-hot token-level target, it equals cross-entropy."
    domains: [probabilistic-foundations-training]
    resources: [fr/cross-entropy, en/cross-entropy]
  - id: autoregressive-generation
    labels: {fr: "Génération autorégressive", en: "Autoregressive generation"}
    definitions:
      fr: "Procédure qui sélectionne un token à partir de la distribution prédite, l'ajoute au contexte, puis répète le calcul avec les mêmes paramètres."
      en: "Procedure that selects a token from the predicted distribution, appends it to the context, and repeats computation with unchanged parameters."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: decoding-policy
    labels: {fr: "Politique de décodage", en: "Decoding policy"}
    definitions:
      fr: "Règle déterministe ou stochastique qui sélectionne un token à partir de la distribution conditionnelle prédite."
      en: "Deterministic or stochastic rule that selects a token from the predicted conditional distribution."
    domains: [inference-efficiency]
    resources: [fr/decoding-strategies, en/decoding-strategies, fr/generation, en/generation]
  - id: prefill
    labels: {fr: "Prefill", en: "Prefill"}
    definitions:
      fr: "Phase d'inférence qui traite le prompt ou le contexte initial avant la génération incrémentale des tokens."
      en: "Inference phase that processes the prompt or initial context before incremental token generation."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: decode-step
    labels: {fr: "Étape de décodage incrémental", en: "Incremental decode step"}
    definitions:
      fr: "Étape d'inférence qui calcule la distribution du prochain token à partir du contexte étendu, puis sélectionne ce token."
      en: "Inference step that computes the next-token distribution from the extended context and selects that token."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: kv-cache
    labels: {fr: "Cache clé-valeur (KV cache)", en: "Key-value cache"}
    definitions:
      fr: "Mécanisme d'inférence qui conserve les clés et valeurs déjà calculées afin d'éviter de recalculer le préfixe à chaque étape."
      en: "Inference mechanism that retains previously computed keys and values to avoid recomputing the prefix at each step."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: generated-token-feedback
    labels: {fr: "Retour du token généré dans le contexte", en: "Generated-token context feedback"}
    definitions:
      fr: "Opération qui ajoute le token sélectionné au contexte afin que le calcul suivant conditionne sa prédiction sur ce token."
      en: "Operation that appends the selected token to the context so the next computation conditions its prediction on that token."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: training-example
    labels: {fr: "Exemple d'entraînement", en: "Training example"}
    definitions:
      fr: "Paire ou séquence d'entrées et de cibles alignées qui permet de calculer les prédictions du prochain token et leur coût."
      en: "Aligned input and target sequence or pair used to compute next-token predictions and their cost."
    domains: [probabilistic-foundations-training]
    resources: [fr/training-examples, en/training-examples]
  - id: teacher-forcing
    labels: {fr: "Teacher forcing", en: "Teacher forcing"}
    definitions:
      fr: "Stratégie qui fournit les tokens précédents observés comme contexte lors du calcul des prédictions d'entraînement, plutôt que les tokens générés par le modèle."
      en: "Strategy that supplies observed previous tokens as context when computing training predictions, rather than tokens generated by the model."
    domains: [probabilistic-foundations-training]
    resources: [fr/training-examples, en/training-examples]
  - id: gradient
    labels: {fr: "Gradient", en: "Gradient"}
    definitions:
      fr: "Dérivée de l'objectif par rapport aux paramètres, indiquant localement comment l'objectif varie lorsque les paramètres changent."
      en: "Derivative of the objective with respect to parameters, indicating locally how the objective changes as parameters change."
    domains: [probabilistic-foundations-training, mathematical-tools-geometry]
    resources: [fr/gradients, en/gradients]
  - id: optimizer
    labels: {fr: "Optimiseur", en: "Optimizer"}
    definitions:
      fr: "Algorithme qui utilise les gradients et son état interne pour calculer une mise à jour des paramètres."
      en: "Algorithm that uses gradients and its internal state to compute a parameter update."
    domains: [probabilistic-foundations-training]
    resources: [fr/gradients, en/gradients]
  - id: parameter-update
    labels: {fr: "Mise à jour des paramètres", en: "Parameter update"}
    definitions:
      fr: "Modification des paramètres du modèle calculée par l'optimiseur à partir des gradients et de son état."
      en: "Modification of model parameters computed by the optimizer from gradients and its state."
    domains: [probabilistic-foundations-training]
    resources: [fr/gradients, en/gradients]
  - id: held-out-evaluation
    labels: {fr: "Évaluation sur données réservées", en: "Held-out evaluation"}
    definitions:
      fr: "Évaluation de prédictions sur des données qui n'ont pas servi à ajuster les paramètres, sans mise à jour de ceux-ci."
      en: "Evaluation of predictions on data not used to fit parameters, without updating those parameters."
    domains: [probabilistic-foundations-training, scale-research]
    resources: [fr/evaluation-experimentale, en/experimental-evaluation, fr/llm-overview, en/llm-overview]
relation_types:
  represented-by:
    direction: directed
    family: representational
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est représenté par", en: "is represented by"}
    descriptions:
      fr: "La source est représentée par la cible."
      en: "The source concept is represented by the target."
  prerequisite:
    direction: directed
    family: pedagogical
    transitive: false
    acyclic: true
    learning_dependency: true
    inverse: null
    labels: {fr: "est prérequis pour", en: "is a prerequisite for"}
    descriptions:
      fr: "La source est nécessaire pour comprendre ou utiliser la cible ; cela ne définit pas à lui seul un ordre global du parcours."
      en: "The source is needed to understand or use the target; this alone does not define a global learning sequence."
  part-of:
    direction: directed
    family: structural
    transitive: true
    acyclic: true
    learning_dependency: false
    inverse: null
    labels: {fr: "fait partie de", en: "is part of"}
    descriptions:
      fr: "La source est un composant ou une partie de la cible."
      en: "The source is a component or part of the target."
  constrains:
    direction: directed
    family: constraint
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "contraint", en: "constrains"}
    descriptions:
      fr: "La source impose une contrainte à la cible."
      en: "The source imposes a constraint on the target."
  contributes-to:
    direction: directed
    family: functional
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "contribue à", en: "contributes to"}
    descriptions:
      fr: "La source contribue à la construction ou au fonctionnement de la cible."
      en: "The source contributes to the construction or operation of the target."
  applies-to:
    direction: directed
    family: functional
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "s'applique à", en: "applies to"}
    descriptions:
      fr: "Le mécanisme source peut être utilisé dans le contexte ou le mécanisme cible."
      en: "The source mechanism can be used within the target context or mechanism."
  mapped-by:
    direction: directed
    family: representational
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est projeté par", en: "is mapped by"}
    descriptions:
      fr: "La source est transformée ou projetée par la cible."
      en: "The source is transformed or projected by the target."
  produces:
    direction: directed
    family: functional
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "produit", en: "produces"}
    descriptions:
      fr: "La source produit la cible."
      en: "The source produces the target."
  normalized-by:
    direction: directed
    family: functional
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est normalisé par", en: "is normalized by"}
    descriptions:
      fr: "La source est normalisée par la transformation cible."
      en: "The source is normalized by the target transformation."
  evaluated-by:
    direction: directed
    family: evaluative
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est évalué par", en: "is evaluated by"}
    descriptions:
      fr: "La source est évaluée au moyen de la cible."
      en: "The source is evaluated using the target."
relations:
  - {from: token, type: represented-by, to: token-embedding}
  - from: token-embedding
    type: prerequisite
    to: contextualized-representation
    rationale:
      fr: "La représentation initiale du token doit être comprise avant les transformations contextuelles."
      en: "The initial token representation should be understood before its contextual transformations."
  - {from: query, type: part-of, to: self-attention}
  - {from: key, type: part-of, to: self-attention}
  - {from: value, type: part-of, to: self-attention}
  - {from: query, type: part-of, to: scaled-dot-product-attention}
  - {from: key, type: part-of, to: scaled-dot-product-attention}
  - {from: value, type: part-of, to: scaled-dot-product-attention}
  - {from: query, type: contributes-to, to: attention-score}
  - {from: key, type: contributes-to, to: attention-score}
  - {from: attention-score, type: part-of, to: scaled-dot-product-attention}
  - {from: attention-weight, type: part-of, to: scaled-dot-product-attention}
  - {from: attention-score, type: normalized-by, to: softmax}
  - {from: softmax, type: produces, to: attention-weight}
  - {from: causal-mask, type: constrains, to: scaled-dot-product-attention}
  - {from: scaled-dot-product-attention, type: applies-to, to: self-attention}
  - {from: scaled-dot-product-attention, type: part-of, to: multi-head-attention}
  - {from: multi-head-attention, type: contributes-to, to: contextualized-representation}
  - {from: causal-mask, type: constrains, to: self-attention}
  - {from: positional-encoding, type: contributes-to, to: self-attention}
  - {from: self-attention, type: contributes-to, to: contextualized-representation}
  - {from: contextualized-representation, type: mapped-by, to: output-projection}
  - {from: output-projection, type: produces, to: logits}
  - {from: logits, type: normalized-by, to: softmax}
  - {from: softmax, type: evaluated-by, to: cross-entropy}
  - {from: training-objective, type: evaluated-by, to: cross-entropy}
  - {from: softmax, type: produces, to: conditional-distribution}
  - {from: next-token-prediction, type: part-of, to: training-objective}
  - {from: conditional-distribution, type: contributes-to, to: sequence-likelihood}
  - {from: observed-target, type: contributes-to, to: sequence-likelihood}
  - from: conditional-distribution
    type: prerequisite
    to: sequence-likelihood
    rationale:
      fr: "La vraisemblance d'une séquence est construite à partir des probabilités conditionnelles des tokens observés."
      en: "Sequence likelihood is built from conditional probabilities of the observed tokens."
  - from: observed-target
    type: prerequisite
    to: sequence-likelihood
    rationale:
      fr: "Une vraisemblance de séquence porte sur des tokens effectivement observés."
      en: "A sequence likelihood is defined with respect to actually observed tokens."
  - {from: sequence-likelihood, type: mapped-by, to: log-likelihood}
  - from: sequence-likelihood
    type: prerequisite
    to: log-likelihood
    rationale:
      fr: "La log-vraisemblance est obtenue en prenant le logarithme de la vraisemblance."
      en: "Log-likelihood is obtained by taking the logarithm of likelihood."
  - {from: log-likelihood, type: mapped-by, to: negative-log-likelihood}
  - from: log-likelihood
    type: prerequisite
    to: negative-log-likelihood
    rationale:
      fr: "La négative log-vraisemblance est l'opposé de la log-vraisemblance."
      en: "Negative log-likelihood is the negation of log-likelihood."
  - {from: negative-log-likelihood, type: contributes-to, to: cross-entropy}
  - {from: training-example, type: produces, to: observed-target}
  - {from: teacher-forcing, type: applies-to, to: training-example}
  - from: cross-entropy
    type: prerequisite
    to: training-objective
    rationale:
      fr: "L'objectif usuel d'un GPT agrège les coûts de prédiction des tokens cibles."
      en: "The usual GPT objective aggregates prediction costs for target tokens."
