    type: prerequisite
    to: score-centering
    rationale:
      fr: "Le centrage porte sur le gradient de log-probabilité de la politique ; il faut définir cette fonction score avant de la centrer."
      en: "Centering operates on the policy log-probability gradient; define the score function before centering it."
  - {from: off-policy-reinforcement-learning, type: part-of, to: post-training}
  - {from: training-inference-mismatch, type: constrains, to: policy-gradient}
  - {from: score-centering, type: applies-to, to: off-policy-reinforcement-learning}
  - {from: attention-score, type: contrasts-with, to: score-centering}
  - {from: importance-sampling, type: contrasts-with, to: score-centering}
  - {from: importance-sampling, type: applies-to, to: off-policy-reinforcement-learning}
  - {from: post-training, type: contrasts-with, to: pretraining}
  - {from: instruction-tuning, type: part-of, to: post-training}
  - {from: reinforcement-learning-from-human-feedback, type: part-of, to: post-training}
  - {from: direct-preference-optimization, type: part-of, to: post-training}
  - {from: in-context-learning, type: contrasts-with, to: instruction-tuning}
  - {from: context-engineering, type: contributes-to, to: in-context-learning}
  - {from: inference-time-compute, type: applies-to, to: reasoning-model}
