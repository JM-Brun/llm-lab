schema_version: 2
# Stable concept IDs are language-independent. Labels and descriptions are bilingual.
concepts:
  - id: token
    importance: core
    labels: {fr: "Token", en: "Token"}
    definitions:
      fr: "Unité discrète produite par la tokenisation et consommée par le modèle."
      en: "Discrete unit produced by tokenization and consumed by the model."
    domains: [text-tokenization]
    resources: [fr/text-data, en/text-data, fr/tokenization-strategies, en/tokenization-strategies, fr/language-representation, en/language-representation]
  - id: tokenizer
    importance: core
    labels: {fr: "Tokenizer", en: "Tokenizer"}
    definitions:
      fr: "Système qui transforme du texte en séquences de tokens et d'identifiants selon une configuration donnée."
      en: "System that transforms text into token and identifier sequences according to a defined configuration."
    domains: [text-tokenization]
    resources: [fr/text-data, en/text-data, fr/tokenization-strategies, en/tokenization-strategies]
  - id: tokenization
    importance: core
    labels: {fr: "Tokenisation", en: "Tokenization"}
    definitions:
      fr: "Opération qui segmente ou représente un texte en unités discrètes consommées par un modèle."
      en: "Operation that segments or represents text as discrete units consumed by a model."
    domains: [text-tokenization]
    resources: [fr/text-data, en/text-data, fr/tokenization-strategies, en/tokenization-strategies]
  - id: tokenizer-pipeline
    importance: core
    labels: {fr: "Pipeline du tokenizer", en: "Tokenizer pipeline"}
    definitions:
      fr: "Ensemble ordonné et configurable d'opérations qui transforment le texte en encodage, notamment normalisation, pré-tokenisation, modèle de segmentation et post-traitement."
      en: "Ordered, configurable set of operations transforming text into an encoding, including normalization, pre-tokenization, segmentation model and post-processing."
    domains: [text-tokenization]
    resources: [fr/tokenization-strategies, en/tokenization-strategies]
  - id: token-encoding
    importance: core
    labels: {fr: "Encodage des tokens", en: "Token encoding"}
    definitions:
      fr: "Application d'un tokenizer à un texte pour produire une séquence de tokens et leurs identifiants selon un vocabulaire et des conventions déterminés."
      en: "Application of a tokenizer to text to produce a token sequence and its IDs according to a defined vocabulary and conventions."
    domains: [text-tokenization]
    resources: [fr/text-data, en/text-data, fr/tokenization-strategies, en/tokenization-strategies]
  - id: token-post-processing
    importance: supporting
    labels: {fr: "Post-traitement du tokenizer", en: "Tokenizer post-processing"}
    definitions:
      fr: "Étape qui transforme l'encodage obtenu, par exemple en ajoutant des tokens de séquence ou des éléments structurants."
      en: "Stage that transforms the resulting encoding, for example by adding sequence tokens or structural elements."
    domains: [text-tokenization]
    resources: [fr/tokenization-strategies, en/tokenization-strategies]
  - id: text-normalization
    importance: supporting
    labels: {fr: "Normalisation du texte", en: "Text normalization"}
    definitions:
      fr: "Transformation préalable du texte, par exemple de la casse, des espaces ou de la représentation Unicode, selon la configuration du tokenizer."
      en: "Preliminary transformation of text, such as case, whitespace or Unicode representation, according to tokenizer configuration."
    domains: [text-tokenization]
    resources: [fr/unicode-text, en/unicode-text, fr/tokenization-strategies, en/tokenization-strategies]
  - id: pre-tokenization
    importance: core
    labels: {fr: "Pré-tokenisation", en: "Pre-tokenization"}
    definitions:
      fr: "Découpage ou transformation initiale du texte en segments qui contraignent les unités auxquelles s'applique le modèle de segmentation."
      en: "Initial splitting or transformation of text into segments that constrain the units processed by the segmentation model."
    domains: [text-tokenization]
    resources: [fr/tokenization-strategies, en/tokenization-strategies]
  - id: token-vocabulary
    importance: core
    labels: {fr: "Vocabulaire du tokenizer", en: "Tokenizer vocabulary"}
    definitions:
      fr: "Ensemble des unités reconnues par un tokenizer, associées à des identifiants entiers."
      en: "Set of units recognized by a tokenizer and associated with integer identifiers."
    domains: [text-tokenization]
    resources: [fr/text-data, en/text-data, fr/tokenization-strategies, en/tokenization-strategies]
  - id: token-id
    importance: core
    labels: {fr: "Identifiant de token", en: "Token ID"}
    definitions:
      fr: "Identifiant entier d'une entrée du vocabulaire ; sa signification dépend du tokenizer et de son vocabulaire."
      en: "Integer identifier for a vocabulary entry; its meaning depends on the tokenizer and its vocabulary."
    domains: [text-tokenization]
    resources: [fr/text-data, en/text-data, fr/embedding-space, en/embedding-space, fr/language-representation, en/language-representation]
  - id: subword-tokenization
    importance: core
    labels: {fr: "Tokenisation en sous-mots", en: "Subword tokenization"}
    definitions:
      fr: "Famille de méthodes qui représente les textes à l'aide de fragments de mots appris ou définis par un vocabulaire."
      en: "Family of methods representing text with word fragments learned or defined by a vocabulary."
    domains: [text-tokenization]
    resources: [fr/tokenization-strategies, en/tokenization-strategies]
  - id: byte-pair-encoding
    importance: core
    labels: {fr: "Byte Pair Encoding (BPE)", en: "Byte Pair Encoding (BPE)"}
    definitions:
      fr: "Méthode de construction d'un vocabulaire par fusions successives de paires adjacentes selon une règle de sélection."
      en: "Vocabulary construction method based on successive merges of adjacent pairs according to a selection rule."
    domains: [text-tokenization]
    resources: [fr/tokenization-strategies, en/tokenization-strategies]
  - id: wordpiece
    importance: supporting
    labels: {fr: "WordPiece", en: "WordPiece"}
    definitions:
      fr: "Méthode de segmentation en sous-mots utilisant un vocabulaire appris et une procédure de sélection et d'encodage propre à cette famille."
      en: "Subword segmentation method using a learned vocabulary and family-specific selection and encoding procedures."
    domains: [text-tokenization]
    resources: [fr/tokenization-strategies, en/tokenization-strategies]
  - id: unigram-tokenization
    importance: supporting
    labels: {fr: "Tokenisation Unigram", en: "Unigram tokenization"}
    definitions:
      fr: "Approche probabiliste de segmentation en sous-mots fondée sur un modèle de tokens et une procédure de sélection de segmentation."
      en: "Probabilistic subword segmentation approach based on a token model and a segmentation-selection procedure."
    domains: [text-tokenization]
    resources: [fr/tokenization-strategies, en/tokenization-strategies]
  - id: byte-level-encoding
    importance: supporting
    labels: {fr: "Encodage au niveau des octets", en: "Byte-level encoding"}
    definitions:
      fr: "Représentation initiale d'un texte par ses octets encodés, souvent UTF-8, avant d'éventuelles fusions en unités plus grandes."
      en: "Initial representation of text using its encoded bytes, often UTF-8, before possible merges into larger units."
    domains: [text-tokenization]
    resources: [fr/unicode-text, en/unicode-text, fr/tokenization-strategies, en/tokenization-strategies]
  - id: special-token
    importance: supporting
    labels: {fr: "Token spécial", en: "Special token"}
    definitions:
      fr: "Token réservé auquel le tokenizer ou le modèle attribue une fonction de contrôle ou de structure distincte du texte ordinaire."
      en: "Reserved token assigned a control or structural role distinct from ordinary text."
    domains: [text-tokenization, architectures-mechanisms]
    resources: [fr/tokenization-strategies, en/tokenization-strategies, fr/generation, en/generation]
  - id: token-decoding
    importance: supporting
    labels: {fr: "Décodage des tokens", en: "Token decoding"}
    definitions:
      fr: "Opération qui reconstruit une représentation textuelle à partir d'une séquence de tokens ou d'identifiants selon les conventions du tokenizer."
      en: "Operation that reconstructs a text representation from a sequence of tokens or IDs according to tokenizer conventions."
    domains: [text-tokenization]
    resources: [fr/tokenization-strategies, en/tokenization-strategies]
  - id: tokenizer-training
    importance: supporting
    labels: {fr: "Entraînement d'un tokenizer", en: "Tokenizer training"}
    definitions:
      fr: "Procédure qui apprend ou ajuste le vocabulaire et les paramètres d'un tokenizer à partir d'un corpus d'entraînement."
      en: "Procedure that learns or fits a tokenizer vocabulary and parameters from a training corpus."
    domains: [text-tokenization]
    resources: [fr/tokenization-strategies, en/tokenization-strategies, fr/corpus-preparation, en/corpus-preparation]
  - id: tokenizer-compatibility
    importance: core
    labels: {fr: "Compatibilité du tokenizer", en: "Tokenizer compatibility"}
    definitions:
      fr: "Correspondance nécessaire entre le tokenizer, son vocabulaire, ses conventions d'encodage et les poids du modèle qui consomme ses identifiants."
      en: "Required correspondence between a tokenizer, its vocabulary and encoding conventions, and the weights of the model consuming its IDs."
    domains: [text-tokenization]
    resources: [fr/text-data, en/text-data, fr/tokenization-strategies, en/tokenization-strategies]
  - id: tokenizer-evaluation
    importance: supporting
    labels: {fr: "Évaluation d'un tokenizer", en: "Tokenizer evaluation"}
    definitions:
      fr: "Évaluation des propriétés intrinsèques d'un tokenizer et de ses effets sur le coût et les performances du modèle en aval."
      en: "Evaluation of a tokenizer's intrinsic properties and its effects on downstream model cost and performance."
    domains: [text-tokenization]
    resources: [fr/tokenizer-design-evaluation, en/tokenizer-design-evaluation]
  - id: token-fertility
    importance: supporting
    labels: {fr: "Fertilité de tokenisation", en: "Token fertility"}
    definitions:
      fr: "Mesure du nombre moyen de tokens produits pour une unité de référence linguistique ou textuelle, selon une définition expérimentale explicite."
      en: "Measure of the average number of tokens produced for a reference linguistic or textual unit, under an explicit experimental definition."
    domains: [text-tokenization]
    resources: [fr/tokenizer-design-evaluation, en/tokenizer-design-evaluation]
  - id: multilingual-tokenization
    importance: supporting
    labels: {fr: "Tokenisation multilingue", en: "Multilingual tokenization"}
    definitions:
      fr: "Étude de la segmentation et du coût en tokens selon les langues, les systèmes d'écriture et les variations linguistiques."
      en: "Study of segmentation and token cost across languages, writing systems and linguistic variation."
    domains: [text-tokenization]
    resources: [fr/tokenizer-design-evaluation, en/tokenizer-design-evaluation]
  - id: token-embedding
    importance: core
    labels: {fr: "Plongement initial du token", en: "Initial token embedding"}
    definitions:
      fr: "Vecteur obtenu par consultation de la matrice de plongements à partir de l’identifiant du token."
      en: "Vector retrieved from the embedding matrix using the token ID."
    domains: [text-tokenization, mathematical-tools-geometry]
    resources: [fr/embedding-space, en/embedding-space, fr/language-representation, en/language-representation]
  - id: contextualized-representation
    importance: core
    labels: {fr: "Représentation contextualisée", en: "Contextualized representation"}
    definitions:
      fr: "État vectoriel associé à une occurrence de token, calculé à partir de sa représentation initiale, de l'information positionnelle et du contexte accessible selon l'architecture du modèle."
      en: "Vector state associated with a token occurrence, computed from its initial representation, positional information, and the context accessible under the model architecture."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/contextualized-representations, en/contextualized-representations, fr/contextualized-representations-advanced, en/contextualized-representations-advanced, fr/language-representation, en/language-representation]
  - id: query
    importance: supporting
    labels: {fr: "Query (requête)", en: "Query"}
    definitions:
      fr: "Projection qui encode ce qu’une position cherche à récupérer dans les autres positions."
      en: "Projection encoding what a position seeks to retrieve from other positions."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention, fr/cross-attention, en/cross-attention]
  - id: key
    importance: supporting
    labels: {fr: "Key (clé)", en: "Key"}
    definitions:
      fr: "Projection qui rend une position adressable par les requêtes des autres positions."
      en: "Projection that makes a position addressable by queries from other positions."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention, fr/cross-attention, en/cross-attention]
  - id: value
    importance: supporting
    labels: {fr: "Value (valeur)", en: "Value"}
    definitions:
      fr: "Projection porteuse de l’information agrégée selon les poids d’attention."
      en: "Projection carrying the information aggregated according to attention weights."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention, fr/cross-attention, en/cross-attention]
  - id: self-attention
    importance: core
    labels: {fr: "Auto-attention", en: "Self-attention"}
    definitions:
      fr: "Mécanisme qui calcule des poids entre positions d’une même séquence et agrège leurs valeurs."
      en: "Mechanism that computes weights between positions in one sequence and aggregates their values."
    domains: [architectures-mechanisms]
    resources: [fr/transformer, en/transformer, fr/transformer-architectures, en/transformer-architectures, fr/queries-keys-values, en/queries-keys-values, fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
  - id: attention-score
    importance: supporting
    labels: {fr: "Score d'attention", en: "Attention score"}
    definitions:
      fr: >-
        Score de compatibilité calculé entre une requête et une clé avant sa conversion en poids
        d'attention normalisés.
      en: >-
        Compatibility score computed between a query and a key before conversion into normalized
        attention weights.
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
  - id: attention-weight
    importance: supporting
    labels: {fr: "Poids d'attention", en: "Attention weight"}
    definitions:
      fr: >-
        Coefficient normalisé, après prise en compte du masque éventuel, qui pondère la contribution
        d'une valeur à une sortie d'attention.
      en: >-
        Normalized coefficient, after any applicable mask, that weights a value's contribution
        to an attention output.
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
  - id: scaled-dot-product-attention
    importance: core
    labels: {fr: "Attention à produit scalaire mise à l'échelle", en: "Scaled dot-product attention"}
    definitions:
      fr: >-
        Mécanisme qui calcule des scores par produit scalaire entre requêtes et clés, les met à
        l'échelle, les normalise et agrège les vecteurs de valeur.
      en: >-
        Mechanism that computes query–key dot-product scores, scales and normalizes them, and
        aggregates value vectors.
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention]
  - id: multi-head-attention
    importance: supporting
    labels: {fr: "Attention multi-têtes", en: "Multi-head attention"}
    definitions:
      fr: >-
        Mécanisme qui exécute plusieurs calculs d'attention avec des projections propres à chaque
        tête, puis combine leurs sorties par concaténation et projection.
      en: >-
        Mechanism that runs multiple attention computations with per-head projections, then
        combines their outputs through concatenation and projection.
    domains: [architectures-mechanisms]
    resources:
      - fr/transformer
      - en/transformer
      - fr/transformer-block-walkthrough
      - en/transformer-block-walkthrough
  - id: causal-mask
    importance: core
    labels: {fr: "Masque causal", en: "Causal mask"}
    definitions:
      fr: "Contrainte qui empêche une position de prendre en compte les positions futures."
      en: "Constraint preventing a position from attending to future positions."
    domains: [architectures-mechanisms]
    resources:
      - fr/causal-masking
      - en/causal-masking
      - fr/scaled-dot-product-attention
      - en/scaled-dot-product-attention
      - fr/transformer-architectures
      - en/transformer-architectures
  - id: attention-mask
    importance: core
    labels: {fr: "Masque d'attention", en: "Attention mask"}
    definitions:
      fr: "Contrainte qui détermine quelles positions clés peuvent contribuer à la représentation calculée pour chaque position requête."
      en: "Constraint determining which key positions may contribute to the representation computed for each query position."
    domains: [architectures-mechanisms]
    resources: [fr/causal-masking, en/causal-masking, fr/training-examples, en/training-examples]
  - id: padding-mask
    importance: core
    labels: {fr: "Masque de padding", en: "Padding mask"}
    definitions:
      fr: "Masque d'attention qui empêche les positions de padding d'être utilisées comme contexte lorsqu'elles ne sont pas admissibles."
      en: "Attention mask that prevents padding positions from being used as context when they are not admissible."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/training-examples, en/training-examples]
  - id: document-boundary-mask
    importance: supporting
    labels: {fr: "Masque de frontière documentaire", en: "Document-boundary mask"}
    definitions:
      fr: "Masque d'attention qui contrôle si les positions appartenant à des documents différents peuvent interagir dans une séquence packée."
      en: "Attention mask that controls whether positions from different documents may interact within a packed sequence."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/training-examples, en/training-examples]
  - id: positional-encoding
    importance: core
    labels: {fr: "Encodage positionnel", en: "Positional encoding"}
    definitions:
      fr: "Mécanisme qui injecte ou expose l’information de position dans les calculs du modèle."
      en: "Mechanism that injects or exposes positional information in model computations."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/positional-encoding, en/positional-encoding]
  - id: output-projection
    importance: core
    labels: {fr: "Projection de sortie", en: "Output projection"}
    definitions:
      fr: "Transformation qui projette l’état final d’une position vers les scores du vocabulaire."
      en: "Transformation projecting a position's final state to vocabulary scores."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/logits, en/logits]
  - id: logits
    importance: core
    labels: {fr: "Logits", en: "Logits"}
    definitions:
      fr: "Scores non normalisés produits pour les tokens du vocabulaire avant conversion en probabilités."
      en: "Unnormalized scores produced for vocabulary tokens before conversion to probabilities."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/logits, en/logits]
  - id: softmax
    importance: core
    labels: {fr: "Softmax", en: "Softmax"}
    definitions:
      fr: "Transformation qui convertit un vecteur de scores en une distribution de probabilité."
      en: "Transformation converting a score vector into a probability distribution."
    domains: [mathematical-tools-geometry, probabilistic-foundations-training]
    resources:
      - fr/probabilites
      - en/probabilities
      - fr/scaled-dot-product-attention
      - en/scaled-dot-product-attention
  - id: cross-entropy
    importance: core
    labels: {fr: "Entropie croisée", en: "Cross-entropy"}
    definitions:
      fr: "Quantité qui mesure le coût probabiliste d’une distribution prédite relativement à une cible."
      en: "Quantity measuring the probabilistic cost of a predicted distribution relative to a target."
    domains: [probabilistic-foundations-training]
    resources: [fr/cross-entropy, en/cross-entropy, fr/language-modeling-math, en/language-modeling-math]
  - id: training-objective
    importance: core
    labels: {fr: "Objectif d'entraînement", en: "Training objective"}
    definitions:
      fr: "Fonction optimisée pendant l'entraînement ; pour un GPT, la prédiction du prochain token. Ses garanties se limitent à la prédiction elle-même."
      en: "Function optimized during training; for a GPT, next-token prediction. Its guarantees are limited to prediction itself."
    domains: [probabilistic-foundations-training]
    resources: [fr/llm-limits, en/llm-limits, fr/llm-overview, en/llm-overview]
  - id: calibration
    importance: specialized
    labels: {fr: "Calibration", en: "Calibration"}
    definitions:
      fr: "Accord entre les probabilités prédites et les fréquences observées ; non garanti par l'objectif, à établir par une évaluation."
      en: "Agreement between predicted probabilities and observed frequencies; not guaranteed by the objective, established by evaluation."
    domains: [probabilistic-foundations-training]
    resources: [fr/llm-limits, en/llm-limits, fr/evaluation-experimentale, en/experimental-evaluation]
  - id: emergent-ability
    importance: specialized
    labels: {fr: "Capacité émergente", en: "Emergent ability"}
    definitions:
      fr: "Compétence qui semble apparaître au-delà d'une échelle de modèle ; sa réalité dépend de la tâche, de la métrique et du protocole."
      en: "Ability that seems to appear beyond a model scale; its reality depends on the task, the metric, and the protocol."
    domains: [scale-research]
    resources: [fr/llm-limits, en/llm-limits, fr/emergence, en/emergence]
  - id: operational-competence
    importance: supporting
    labels: {fr: "Compétence opérationnelle", en: "Operational competence"}
    definitions:
      fr: "Capacité mesurée sur des tâches dans un périmètre donné, distincte d'une thèse de compréhension humaine."
      en: "Ability measured on tasks within a given scope, distinct from a claim of human-like understanding."
    domains: [probabilistic-foundations-training]
    resources: [fr/llm-limits, en/llm-limits]
  - id: conditional-distribution
    importance: core
    labels: {fr: "Distribution conditionnelle du prochain token", en: "Next-token conditional distribution"}
    definitions:
      fr: "Distribution de probabilité sur le vocabulaire, conditionnée par le contexte précédent et produite à partir des logits."
      en: "Probability distribution over the vocabulary, conditioned on the preceding context and produced from logits."
    domains: [probabilistic-foundations-training, inference-efficiency]
    resources: [fr/probabilites, en/probabilities]
  - id: next-token-prediction
    importance: core
    labels: {fr: "Prédiction du prochain token", en: "Next-token prediction"}
    definitions:
      fr: "Tâche consistant à estimer, à chaque position, une distribution conditionnelle sur le token suivant à partir du contexte disponible."
      en: "Task of estimating, at each position, a conditional distribution over the next token from the available context."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/llm-overview, en/llm-overview, fr/logits, en/logits, fr/probabilites, en/probabilities]
  - id: observed-target
    importance: core
    labels: {fr: "Token cible observé", en: "Observed target token"}
    definitions:
      fr: "Token suivant effectivement présent dans les données, utilisé pour évaluer la probabilité attribuée par le modèle."
      en: "The actual next token present in the data, used to evaluate the probability assigned by the model."
    domains: [probabilistic-foundations-training]
    resources: [fr/vraisemblance, en/likelihood, fr/training-examples, en/training-examples]
  - id: sequence-likelihood
    importance: core
    labels: {fr: "Vraisemblance d'une séquence", en: "Sequence likelihood"}
    definitions:
      fr: "Produit des probabilités conditionnelles attribuées par le modèle aux tokens observés successifs d'une séquence."
      en: "Product of the conditional probabilities assigned by the model to the successive observed tokens in a sequence."
    domains: [probabilistic-foundations-training]
    resources: [fr/vraisemblance, en/likelihood]
  - id: log-likelihood
    importance: supporting
    labels: {fr: "Log-vraisemblance", en: "Log-likelihood"}
    definitions:
      fr: "Logarithme de la vraisemblance d'une séquence, égal à la somme des log-probabilités conditionnelles des tokens observés."
      en: "Logarithm of a sequence likelihood, equal to the sum of the conditional log-probabilities of observed tokens."
    domains: [probabilistic-foundations-training]
    resources: [fr/vraisemblance, en/likelihood]
  - id: logarithm
    importance: supporting
    labels: {fr: "Logarithme", en: "Logarithm"}
    definitions:
      fr: "Transformation qui convertit une vraisemblance positive en log-vraisemblance et transforme un produit de probabilités en somme."
      en: "Transformation that converts a positive likelihood into log-likelihood and turns a product of probabilities into a sum."
    domains: [mathematical-tools-geometry, probabilistic-foundations-training]
    resources: [fr/vraisemblance, en/likelihood]
  - id: negation
    importance: supporting
    labels: {fr: "Opposé additif", en: "Additive inverse"}
    definitions:
      fr: "Transformation qui change le signe de la log-vraisemblance pour obtenir une quantité à minimiser."
      en: "Transformation that changes the sign of log-likelihood to obtain a quantity to minimize."
    domains: [mathematical-tools-geometry, probabilistic-foundations-training]
    resources: [fr/cross-entropy, en/cross-entropy]
  - id: negative-log-likelihood
    importance: core
    labels: {fr: "Négative log-vraisemblance", en: "Negative log-likelihood"}
    definitions:
      fr: "Opposé de la log-vraisemblance ; pour une cible one-hot au niveau token, elle correspond à l'entropie croisée."
      en: "Negative log-likelihood; for a one-hot token-level target, it equals cross-entropy."
    domains: [probabilistic-foundations-training]
    resources: [fr/cross-entropy, en/cross-entropy]
  - id: autoregressive-generation
    importance: core
    labels: {fr: "Génération autorégressive", en: "Autoregressive generation"}
    definitions:
      fr: "Procédure qui sélectionne un token à partir de la distribution prédite, l'ajoute au contexte, puis répète le calcul avec les mêmes paramètres."
      en: "Procedure that selects a token from the predicted distribution, appends it to the context, and repeats computation with unchanged parameters."
    domains: [inference-efficiency]
    resources: [fr/llm-overview, en/llm-overview, fr/generation, en/generation]
  - id: decoding-policy
    importance: supporting
    labels: {fr: "Politique de décodage", en: "Decoding policy"}
    definitions:
      fr: "Règle déterministe ou stochastique qui sélectionne un token à partir de la distribution conditionnelle prédite."
      en: "Deterministic or stochastic rule that selects a token from the predicted conditional distribution."
    domains: [inference-efficiency]
    resources: [fr/decoding-strategies, en/decoding-strategies, fr/generation, en/generation]
  - id: prefill
    importance: core
    labels: {fr: "Prefill", en: "Prefill"}
    definitions:
      fr: "Phase d'inférence qui traite le prompt ou le contexte initial avant la génération incrémentale des tokens."
      en: "Inference phase that processes the prompt or initial context before incremental token generation."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: decode-step
    importance: core
    labels: {fr: "Étape de décodage incrémental", en: "Incremental decode step"}
    definitions:
      fr: "Étape d'inférence qui calcule la distribution du prochain token à partir du contexte étendu, puis sélectionne ce token."
      en: "Inference step that computes the next-token distribution from the extended context and selects that token."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: kv-cache
    importance: specialized
    labels: {fr: "Cache clé-valeur (KV cache)", en: "Key-value cache"}
    definitions:
      fr: "Mécanisme d'inférence qui conserve les clés et valeurs déjà calculées afin d'éviter de recalculer le préfixe à chaque étape."
      en: "Inference mechanism that retains previously computed keys and values to avoid recomputing the prefix at each step."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: generated-token-feedback
    importance: supporting
    labels: {fr: "Retour du token généré dans le contexte", en: "Generated-token context feedback"}
    definitions:
      fr: "Opération qui ajoute le token sélectionné au contexte afin que le calcul suivant conditionne sa prédiction sur ce token."
      en: "Operation that appends the selected token to the context so the next computation conditions its prediction on that token."
    domains: [inference-efficiency]
    resources: [fr/generation, en/generation]
  - id: training-example
    importance: core
    labels: {fr: "Exemple d'entraînement", en: "Training example"}
    definitions:
      fr: "Paire ou séquence d'entrées et de cibles alignées qui permet de calculer les prédictions du prochain token et leur coût."
      en: "Aligned input and target sequence or pair used to compute next-token predictions and their cost."
    domains: [probabilistic-foundations-training]
    resources: [fr/training-examples, en/training-examples]
  - id: teacher-forcing
    importance: core
    labels: {fr: "Teacher forcing", en: "Teacher forcing"}
    definitions:
      fr: "Stratégie qui fournit les tokens précédents observés comme contexte lors du calcul des prédictions d'entraînement, plutôt que les tokens générés par le modèle."
      en: "Strategy that supplies observed previous tokens as context when computing training predictions, rather than tokens generated by the model."
    domains: [probabilistic-foundations-training]
    resources: [fr/training-examples, en/training-examples]
  - id: loss-mask
    importance: core
    labels: {fr: "Masque de perte", en: "Loss mask"}
    definitions:
      fr: "Sélectionne les positions cibles qui contribuent à la loss ; ne détermine pas quelles positions peuvent être utilisées comme contexte par l'attention."
      en: "Selects target positions that contribute to the loss; it does not determine which positions attention may use as context."
    domains: [probabilistic-foundations-training]
    resources: [fr/loss, en/loss, fr/training-examples, en/training-examples]
  - id: gradient
    importance: core
    labels: {fr: "Gradient", en: "Gradient"}
    definitions:
      fr: "Dérivée de l'objectif par rapport aux paramètres, indiquant localement comment l'objectif varie lorsque les paramètres changent."
      en: "Derivative of the objective with respect to parameters, indicating locally how the objective changes as parameters change."
    domains: [probabilistic-foundations-training, mathematical-tools-geometry]
    resources: [fr/gradients, en/gradients]
  - id: optimizer
    importance: core
    labels: {fr: "Optimiseur", en: "Optimizer"}
    definitions:
      fr: "Algorithme qui utilise les gradients et son état interne pour calculer une mise à jour des paramètres."
      en: "Algorithm that uses gradients and its internal state to compute a parameter update."
    domains: [probabilistic-foundations-training]
    resources: [fr/gradients, en/gradients, fr/training-loop, en/training-loop]
  - id: parameter-update
    importance: core
    labels: {fr: "Mise à jour des paramètres", en: "Parameter update"}
    definitions:
      fr: "Modification des paramètres du modèle calculée par l'optimiseur à partir des gradients et de son état."
      en: "Modification of model parameters computed by the optimizer from gradients and its state."
    domains: [probabilistic-foundations-training]
    resources: [fr/gradients, en/gradients, fr/training-loop, en/training-loop]
  - id: training-loop
    importance: core
    labels: {fr: "Boucle d'entraînement", en: "Training loop"}
    definitions:
      fr: "Répétition du cycle passe avant, loss, gradient et mise à jour des paramètres sur des batchs successifs, accompagnée de mesures sur des données de validation sans mise à jour."
      en: "Repetition of the cycle of forward pass, loss, gradient and parameter update over successive batches, accompanied by measurements on validation data without updates."
    domains: [probabilistic-foundations-training]
    resources: [fr/training-loop, en/training-loop]
  - id: overfitting
    importance: core
    labels: {fr: "Surapprentissage", en: "Overfitting"}
    definitions:
      fr: "Situation où la loss d'entraînement continue de baisser alors que la loss de validation cesse de s'améliorer ou remonte, signe d'un ajustement à des détails de l'échantillon d'entraînement."
      en: "Situation where training loss keeps falling while validation loss stops improving or rises, indicating a fit to details of the training sample."
    domains: [probabilistic-foundations-training]
    resources: [fr/training-loop, en/training-loop]
  - id: held-out-evaluation
    importance: core
    labels: {fr: "Évaluation sur données réservées", en: "Held-out evaluation"}
    definitions:
      fr: "Évaluation de prédictions sur des données qui n'ont pas servi à ajuster les paramètres, sans mise à jour de ceux-ci."
      en: "Evaluation of predictions on data not used to fit parameters, without updating those parameters."
    domains: [probabilistic-foundations-training, scale-research]
    resources: [fr/evaluation-experimentale, en/experimental-evaluation, fr/llm-overview, en/llm-overview, fr/training-loop, en/training-loop]
  - id: in-context-learning
    labels: {fr: "Apprentissage en contexte", en: "In-context learning"}
    definitions:
      fr: "Comportement par lequel un modèle adapte ses prédictions aux instructions, exemples ou régularités présents dans son contexte d'entrée, sans mise à jour de ses paramètres."
      en: "Behavior in which a model adapts its predictions to instructions, examples, or patterns in its input context without updating its parameters."
    domains: [inference-efficiency]
    importance: core
    resources: [fr/in-context-learning, en/in-context-learning, fr/in-context-learning-exercises, en/in-context-learning-exercises, fr/llm-evolution, en/llm-evolution]
  - id: context-engineering
    labels: {fr: "Ingénierie du contexte", en: "Context engineering"}
    definitions:
      fr: "Pratique d'ingénierie qui sélectionne, récupère, structure, hiérarchise, actualise et sécurise les informations fournies à un modèle pour une tâche donnée."
      en: "Engineering practice that selects, retrieves, structures, prioritizes, updates, and secures the information supplied to a model for a given task."
    domains: [inference-efficiency]
    importance: core
    resources: [fr/context-engineering, en/context-engineering, fr/context-engineering-exercises, en/context-engineering-exercises]
  - id: pretraining
    labels: {fr: "Pré-entraînement", en: "Pretraining"}
    definitions:
      fr: "Phase d'entraînement initiale qui ajuste les paramètres du modèle sur un corpus à grande échelle selon un objectif prédéfini, souvent la prédiction du prochain token."
      en: "Initial training phase that adjusts model parameters on a large corpus using a defined objective, often next-token prediction."
    domains: [probabilistic-foundations-training]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: post-training
    labels: {fr: "Post-entraînement", en: "Post-training"}
    definitions:
      fr: "Ensemble de procédures appliquées après le pré-entraînement pour adapter le modèle à des instructions, préférences ou usages ciblés."
      en: "Set of procedures applied after pretraining to adapt a model to instructions, preferences, or targeted uses."
    domains: [probabilistic-foundations-training]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution, fr/post-training, en/post-training]
  - id: fine-tuning
    labels: {fr: "Fine-tuning (ajustement du modèle)", en: "Fine-tuning"}
    definitions:
      fr: "Adaptation d'un modèle pré-entraîné par une optimisation supplémentaire sur des données ou objectifs ciblés, qui modifie tout ou partie de ses paramètres."
      en: "Adaptation of a pretrained model through additional optimization on targeted data or objectives, changing all or some of its parameters."
    domains: [probabilistic-foundations-training]
    importance: supporting
    resources: [fr/post-training, en/post-training]
  - id: instruction-tuning
    labels: {fr: "Ajustement supervisé sur instructions", en: "Instruction tuning"}
    definitions:
      fr: "Fine-tuning supervisé sur des exemples associant des instructions à des réponses attendues."
      en: "Supervised fine-tuning on examples pairing instructions with expected responses."
    domains: [probabilistic-foundations-training]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: chat-template
    importance: supporting
    labels: {fr: "Modèle de conversation (chat template)", en: "Chat template"}
    definitions:
      fr: "Règle de sérialisation qui transforme des messages et leurs rôles, frontières et marqueurs de contrôle en une séquence de tokens conforme à la convention attendue par un modèle."
      en: "Serialization rule that turns messages and their roles, boundaries, and control markers into a token sequence matching a model's expected convention."
    domains: [text-tokenization, probabilistic-foundations-training]
    resources: [fr/post-training, en/post-training]
  - id: dataset-curation
    importance: supporting
    labels: {fr: "Curation de jeux de données", en: "Dataset curation"}
    definitions:
      fr: "Processus de sélection, structuration, annotation, contrôle et documentation d'un jeu de données pour un usage défini."
      en: "Process of selecting, structuring, annotating, checking, and documenting a dataset for a defined use."
    domains: [probabilistic-foundations-training]
    resources: [fr/corpus-preparation, en/corpus-preparation]
  - id: group-relative-policy-optimization
    importance: specialized
    labels: {fr: "Optimisation de politique relative au groupe (GRPO)", en: "Group Relative Policy Optimization (GRPO)"}
    definitions:
      fr: "Algorithme d'optimisation de politique pour lequel plusieurs réponses sont échantillonnées par prompt et leurs récompenses comparées au sein du groupe pour construire un avantage relatif ; la méthode originale évite un critique séparé."
      en: "Policy-optimization algorithm that samples multiple responses per prompt and compares their rewards within the group to form a relative advantage; the original method avoids a separate critic."
    domains: [probabilistic-foundations-training]
    resources: [fr/glossary, en/glossary, fr/score-centering, en/score-centering]
  - id: reinforcement-learning-from-human-feedback
    labels: {fr: "Apprentissage par renforcement à partir de retours humains", en: "Reinforcement learning from human feedback"}
    definitions:
      fr: "Famille de méthodes qui utilisent des préférences ou évaluations humaines pour orienter l'optimisation du comportement d'un modèle."
      en: "Family of methods using human preferences or evaluations to guide optimization of model behavior."
    domains: [probabilistic-foundations-training]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: direct-preference-optimization
    labels: {fr: "Optimisation directe sur préférences", en: "Direct preference optimization"}
    definitions:
      fr: "Méthode d'optimisation qui ajuste directement une politique à partir de comparaisons de préférences, sans entraîner séparément un modèle de récompense dans sa formulation de base."
      en: "Optimization method that directly adjusts a policy from preference comparisons, without separately training a reward model in its basic formulation."
    domains: [probabilistic-foundations-training]
    importance: specialized
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: inference-time-compute
    labels: {fr: "Calcul à l'inférence", en: "Inference-time compute"}
    definitions:
      fr: "Ressources de calcul supplémentaires mobilisées pendant l'utilisation du modèle pour traiter une requête, rechercher ou vérifier une réponse."
      en: "Additional compute resources used during model operation to process a request, search, or verify an answer."
    domains: [inference-efficiency]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: reasoning-model
    labels: {fr: "Modèle orienté raisonnement", en: "Reasoning model"}
    definitions:
      fr: "Modèle ou variante entraînée et/ou configurée pour consacrer davantage de calcul à la résolution de problèmes nécessitant plusieurs étapes."
      en: "Model or variant trained and/or configured to spend more compute on problems requiring multiple steps."
    domains: [inference-efficiency, scale-research]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: tool-calling
    labels: {fr: "Appel d'outil", en: "Tool calling"}
    definitions:
      fr: "Émission par le modèle d'une demande d'action structurée qu'une application ou un service externe peut exécuter."
      en: "Model emission of a structured action request that an application or external service can execute."
    domains: [inference-efficiency]
    importance: supporting
    resources: [fr/llm-evolution, en/llm-evolution]
  - id: agentic-system
    labels: {fr: "Système agentique", en: "Agentic system"}
    definitions:
      fr: "Système qui poursuit un objectif au moyen d'une boucle de planification, d'utilisation d'outils, d'observation des résultats et d'ajustement."
      en: "System that pursues a goal through a loop of planning, tool use, observing results, and adjustment."
    domains: [inference-efficiency]
    importance: specialized
    resources: [fr/llm-evolution, en/llm-evolution]

  - id: policy-gradient
    importance: supporting
    labels: {fr: "Gradient de politique", en: "Policy gradient"}
    definitions:
      fr: "Méthode d'optimisation d'une politique paramétrée qui utilise le gradient de la log-probabilité des actions échantillonnées, pondéré par un signal de récompense ou d'avantage."
      en: "Method for optimizing a parameterized policy using gradients of sampled-action log-probabilities weighted by a reward or advantage signal."
    domains: [probabilistic-foundations-training]
    resources: [fr/score-centering, en/score-centering]
  - id: score-function
    importance: supporting
    labels: {fr: "Fonction score", en: "Score function"}
    definitions:
      fr: "Gradient du logarithme de la probabilité d'une action ou d'un token sous une politique paramétrée ; à distinguer d'un score de compatibilité ou d'attention."
      en: "Gradient of the log-probability of an action or token under a parameterized policy; distinct from a compatibility or attention score."
    domains: [probabilistic-foundations-training, mathematical-tools-geometry]
    resources: [fr/score-centering, en/score-centering]
  - id: off-policy-reinforcement-learning
    importance: specialized
    labels: {fr: "Apprentissage par renforcement hors politique", en: "Off-policy reinforcement learning"}
    definitions:
      fr: "Apprentissage à partir de trajectoires produites par une politique de comportement qui peut différer de la politique dont on calcule la mise à jour."
      en: "Learning from trajectories generated by a behavior policy that may differ from the policy whose update is being computed."
    domains: [probabilistic-foundations-training, inference-efficiency]
    resources: [fr/score-centering, en/score-centering]
  - id: training-inference-mismatch
    importance: supporting
    labels: {fr: "Décalage entraînement-inférence", en: "Training-inference mismatch"}
    definitions:
      fr: "Écart entre les distributions effectives du moteur qui échantillonne les trajectoires et du moteur qui calcule les mises à jour d'entraînement."
      en: "Difference between the effective distributions of the engine sampling trajectories and the engine computing training updates."
    domains: [probabilistic-foundations-training, inference-efficiency]
    resources: [fr/score-centering, en/score-centering]
  - id: score-centering
    importance: specialized
    labels: {fr: "Centrage du score", en: "Score centering"}
    definitions:
      fr: "Correction additive qui soustrait, à chaque préfixe, l'espérance sous le sampler du score de la politique entraînée afin d'annuler le terme de dérive identifié en apprentissage hors politique."
      en: "Additive correction that subtracts, at each prefix, the sampler expectation of the trainer-policy score to cancel the identified drift term in off-policy learning."
    domains: [probabilistic-foundations-training, inference-efficiency]
    resources: [fr/score-centering, en/score-centering]
  - id: importance-sampling
    importance: supporting
    labels: {fr: "Échantillonnage par importance", en: "Importance sampling"}
    definitions:
      fr: "Technique qui pondère les échantillons par un rapport de probabilités afin d'estimer une espérance associée à une distribution cible à partir d'échantillons issus d'une autre distribution."
      en: "Technique that weights samples by a probability ratio to estimate an expectation under a target distribution from samples drawn from another distribution."
    domains: [probabilistic-foundations-training]
    resources: [fr/score-centering, en/score-centering]


  - id: next-concept-modeling
    importance: supporting
    labels: {fr: "Next-Concept Modeling (NCM)", en: "Next-Concept Modeling (NCM)"}
    definitions:
      fr: "Cadre de génération non autorégressive qui représente une séquence par une hiérarchie de codes discrets et prédit ces codes niveau par niveau, de grossier à fin, avec parallélisme à l'intérieur de chaque niveau."
      en: "Non-autoregressive generation framework that represents a sequence as a hierarchy of discrete codes and predicts those codes level by level, coarse to fine, with parallelism within each level."
    domains: [architectures-mechanisms, inference-efficiency]
    resources: [fr/next-concept-modeling, en/next-concept-modeling]
  - id: hierarchical-discrete-codes
    importance: specialized
    labels: {fr: "Codes discrets hiérarchiques", en: "Hierarchical discrete codes"}
    definitions:
      fr: "Représentation d'une séquence par plusieurs niveaux de codes discrets, les niveaux ultérieurs ajoutant des détails à la reconstruction fournie par les précédents."
      en: "Representation of a sequence through multiple levels of discrete codes, with later levels adding detail to the reconstruction supplied by earlier ones."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/next-concept-modeling, en/next-concept-modeling]
  - id: coarse-to-fine-generation
    importance: supporting
    labels: {fr: "Génération du grossier au fin", en: "Coarse-to-fine generation"}
    definitions:
      fr: "Stratégie qui génère d'abord une représentation grossière, puis la raffine par étapes successives ; dans NCM, les codes d'un même niveau sont prédits en parallèle."
      en: "Strategy that first generates a coarse representation and then refines it through successive stages; in NCM, codes within one level are predicted in parallel."
    domains: [architectures-mechanisms, inference-efficiency]
    resources: [fr/next-concept-modeling, en/next-concept-modeling]
  - id: multiscale-residual-vector-quantization
    importance: specialized
    labels: {fr: "Quantification vectorielle résiduelle multi-échelle", en: "Multiscale residual vector quantization"}
    definitions:
      fr: "Procédé de tokenisation appris qui encode une séquence en plusieurs niveaux de codes discrets résiduels, chaque niveau apportant une information de reconstruction supplémentaire."
      en: "Learned tokenization procedure that encodes a sequence into multiple levels of residual discrete codes, each level adding further reconstruction information."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/next-concept-modeling, en/next-concept-modeling]
  - id: joint-embedding-predictive-architecture
    importance: supporting
    labels: {fr: "Architecture à plongements joints prédictifs (JEPA)", en: "Joint-Embedding Predictive Architecture (JEPA)"}
    definitions:
      fr: "Famille d'architectures qui apprend des représentations en prédisant l'embedding d'une observation déclarée liée, sous une contrainte anti-effondrement qui empêche tous les embeddings de devenir identiques."
      en: "Family of architectures that learns representations by predicting the embedding of a declared-related observation, under an anti-collapse constraint that prevents all embeddings from becoming identical."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/jepa-platonic-representation, en/jepa-platonic-representation]
  - id: positive-pair-distribution
    importance: supporting
    labels: {fr: "Distribution de paires positives", en: "Positive-pair distribution"}
    definitions:
      fr: "Distribution des paires d'observations qu'un objectif d'entraînement déclare liées ; lue géométriquement, elle définit un graphe pondéré sur les observations."
      en: "Distribution of observation pairs that a training objective declares related; read geometrically, it defines a weighted graph over observations."
    domains: [probabilistic-foundations-training, mathematical-tools-geometry]
    resources: [fr/jepa-platonic-representation, en/jepa-platonic-representation]
  - id: platonic-representation-hypothesis
    importance: specialized
    labels: {fr: "Hypothèse de représentation platonique", en: "Platonic Representation Hypothesis"}
    definitions:
      fr: "Conjecture selon laquelle les représentations internes de modèles entraînés sur des modalités ou architectures différentes se ressemblent de plus en plus à mesure que les modèles et les données gagnent en échelle ; un théorème conditionnel la rend précise pour les JEPA dont les paires positives partagent les mêmes relations d'états du monde."
      en: "Conjecture that internal representations of models trained on different modalities or architectures increasingly resemble each other as models and data scale; a conditional theorem makes it precise for JEPAs whose positive pairs share the same world-state relations."
    domains: [scale-research, mathematical-tools-geometry]
    resources: [fr/jepa-platonic-representation, en/jepa-platonic-representation]
  - id: laplacian-eigenmaps
    importance: specialized
    labels: {fr: "Cartes propres laplaciennes (Laplacian eigenmaps)", en: "Laplacian eigenmaps"}
    definitions:
      fr: "Méthode d'apprentissage de variété qui attribue des coordonnées aux sommets d'un graphe pondéré en minimisant l'énergie de Dirichlet, de sorte que les sommets fortement reliés reçoivent des coordonnées proches ; la solution est portée par les premiers vecteurs propres du laplacien normalisé du graphe."
      en: "Manifold-learning method that assigns coordinates to the vertices of a weighted graph by minimizing the Dirichlet energy, so that strongly connected vertices receive nearby coordinates; the solution is carried by the leading eigenvectors of the normalized graph Laplacian."
    domains: [mathematical-tools-geometry]
    resources: [fr/jepa-platonic-representation, en/jepa-platonic-representation]

  - id: document-retrieval
    importance: supporting
    labels: {fr: "Récupération documentaire", en: "Document retrieval"}
    definitions:
      fr: "Sélection de documents ou de passages à partir d'une requête, au moyen de critères lexicaux, sémantiques, structurés ou hybrides."
      en: "Selection of documents or passages from a query using lexical, semantic, structured, or hybrid criteria."
    domains: [inference-efficiency]
    resources: [fr/rag-memory-boundaries, en/rag-memory-boundaries]
  - id: retrieval-augmented-generation
    importance: supporting
    labels: {fr: "Génération augmentée par récupération (RAG)", en: "Retrieval-augmented generation (RAG)"}
    definitions:
      fr: "Architecture qui récupère des informations externes puis les rend disponibles à un modèle génératif, généralement en les intégrant à son contexte."
      en: "Architecture that retrieves external information and makes it available to a generative model, usually by adding it to the model context."
    domains: [inference-efficiency]
    resources: [fr/rag-memory-boundaries, en/rag-memory-boundaries]
  - id: persistent-memory
    importance: supporting
    labels: {fr: "Mémoire persistante applicative", en: "Persistent application memory"}
    definitions:
      fr: "Informations conservées par un système LLM entre plusieurs appels ou sessions afin d'être sélectionnées et réutilisées ultérieurement."
      en: "Information retained by an LLM system across calls or sessions so it can be selected and reused later."
    domains: [inference-efficiency]
    resources: [fr/rag-memory-boundaries, en/rag-memory-boundaries]
  - id: context-injection
    importance: supporting
    labels: {fr: "Injection dans le contexte", en: "Context injection"}
    definitions:
      fr: "Opération par laquelle une application inclut une information sélectionnée dans l'entrée effectivement transmise au modèle."
      en: "Operation by which an application includes selected information in the input actually supplied to the model."
    domains: [inference-efficiency]
    resources: [fr/rag-memory-boundaries, en/rag-memory-boundaries]



  - id: surprisal
    importance: supporting
    labels: {fr: "Surprise informationnelle", en: "Surprisal"}
    definitions:
      fr: "Quantité d'information associée à un événement observé, égale à l'opposé du logarithme de sa probabilité."
      en: "Information associated with an observed event, equal to the negative logarithm of its probability."
    domains: [probabilistic-foundations-training]
    resources: [fr/entropy, en/entropy, fr/revision-entropy, en/revision-entropy, fr/vraisemblance, en/likelihood, fr/compression-revision, en/compression-revision]
  - id: predictive-compression
    importance: supporting
    labels: {fr: "Compression prédictive", en: "Predictive compression"}
    definitions:
      fr: "Codage d'une séquence en exploitant les probabilités conditionnelles d'un modèle pour attribuer des longueurs de code adaptées à la prévisibilité des événements."
      en: "Coding a sequence using a model's conditional probabilities to assign code lengths according to how predictable events are."
    domains: [probabilistic-foundations-training]
    resources: [fr/entropy, en/entropy, fr/cross-entropy, en/cross-entropy, fr/compression-revision, en/compression-revision]
  - id: minimum-description-length
    importance: supporting
    labels: {fr: "Longueur minimale de description (MDL)", en: "Minimum description length (MDL)"}
    definitions:
      fr: "Principe de sélection et d'évaluation qui considère le coût total de description d'un modèle et des données conditionnellement à ce modèle : L(M) + L(D|M), relativement à un langage de description et à un protocole de codage."
      en: "Model-selection and evaluation principle that considers the total description cost of a model and the data conditional on that model: L(M) + L(D|M), relative to a description language and coding protocol."
    domains: [probabilistic-foundations-training, mathematical-tools-geometry]
    resources: [fr/compression-revision, en/compression-revision]
  - id: entropy-coding
    importance: supporting
    labels: {fr: "Codage entropique", en: "Entropy coding"}
    definitions:
      fr: "Famille de méthodes qui convertissent une distribution de probabilités en codes dont la longueur moyenne approche la limite informationnelle, avec décodage compatible."
      en: "Family of methods that convert a probability distribution into codes whose average length approaches the information limit, with a compatible decoder."
    domains: [probabilistic-foundations-training]
    resources: [fr/compression-revision, en/compression-revision]
  - id: arithmetic-coding
    importance: supporting
    labels: {fr: "Codage arithmétique", en: "Arithmetic coding"}
    definitions:
      fr: "Méthode de codage entropique qui représente une séquence entière par un intervalle numérique progressivement resserré selon les probabilités conditionnelles des symboles."
      en: "Entropy-coding method that represents an entire sequence by a numerical interval progressively narrowed according to symbols' conditional probabilities."
    domains: [probabilistic-foundations-training]
    resources: [fr/compression-revision, en/compression-revision]
  - id: model-compression
    importance: supporting
    labels: {fr: "Compression du modèle", en: "Model compression"}
    definitions:
      fr: "Ensemble de transformations visant à réduire le coût de stockage ou d'exécution d'un modèle, avec un compromis possible sur la qualité."
      en: "Set of transformations intended to reduce a model's storage or execution cost, potentially trading off quality."
    domains: [inference-efficiency]
    resources: [fr/llm-computational-complexity, en/llm-computational-complexity, fr/llm-evolution, en/llm-evolution, fr/compression-revision, en/compression-revision]
  - id: pruning
    importance: supporting
    labels: {fr: "Élagage des paramètres", en: "Pruning"}
    definitions:
      fr: "Suppression de poids ou de structures d'un modèle afin de réduire sa représentation ou son calcul, avec des gains dépendant notamment de la structure et du matériel."
      en: "Removal of model weights or structures to reduce representation size or computation, with gains depending notably on structure and hardware."
    domains: [inference-efficiency]
    resources: [fr/llm-computational-complexity, en/llm-computational-complexity, fr/compression-revision, en/compression-revision]
  - id: quantization
    importance: supporting
    labels: {fr: "Quantification numérique", en: "Quantization"}
    definitions:
      fr: "Réduction de la précision numérique utilisée pour représenter les poids ou activations, afin de diminuer le stockage ou les coûts d'exécution."
      en: "Reduction of the numerical precision used to represent weights or activations to lower storage or execution costs."
    domains: [inference-efficiency]
    resources: [fr/llm-computational-complexity, en/llm-computational-complexity, fr/compression-revision, en/compression-revision]
  - id: knowledge-distillation
    importance: supporting
    labels: {fr: "Distillation de connaissances", en: "Knowledge distillation"}
    definitions:
      fr: "Entraînement d'un modèle étudiant à reproduire certains comportements ou sorties d'un modèle enseignant."
      en: "Training a student model to reproduce selected behaviours or outputs of a teacher model."
    domains: [inference-efficiency]
    resources: [fr/llm-evolution, en/llm-evolution, fr/language-modeling-math, en/language-modeling-math, fr/compression-revision, en/compression-revision]


  - id: entropy
    importance: core
    labels: {fr: "Entropie", en: "Entropy"}
    definitions:
      fr: "Information moyenne associée à une variable aléatoire, égale à l'espérance de son surprisal sous sa distribution."
      en: "Average information associated with a random variable, equal to the expected surprisal under its distribution."
    domains: [probabilistic-foundations-training]
    resources: [fr/entropy, en/entropy, fr/revision-entropy, en/revision-entropy, fr/cross-entropy, en/cross-entropy, fr/compression-revision, en/compression-revision]
  - id: kl-divergence
    importance: supporting
    labels: {fr: "Divergence KL", en: "KL divergence"}
    definitions:
      fr: "Mesure asymétrique de l'écart entre deux distributions, égale à l'espérance sous la distribution cible du logarithme du rapport entre les probabilités."
      en: "Asymmetric measure of the discrepancy between two distributions, equal to the target-distribution expectation of the log probability ratio."
    domains: [probabilistic-foundations-training]
    resources: [fr/cross-entropy, en/cross-entropy, fr/compression-revision, en/compression-revision]
  - id: mutual-information
    importance: supporting
    labels: {fr: "Information mutuelle", en: "Mutual information"}
    definitions:
      fr: "Quantité qui mesure la réduction de l'incertitude sur une variable lorsque l'autre est connue, définie à partir de leur distribution jointe."
      en: "Quantity measuring the reduction in uncertainty about one variable when the other is known, defined from their joint distribution."
    domains: [probabilistic-foundations-training, architectures-mechanisms]
    resources: [fr/scaled-dot-product-attention, en/scaled-dot-product-attention, fr/compression-revision, en/compression-revision]

  - id: v-information
    importance: specialized
    labels: {fr: "V-information prédictive", en: "Predictive V-information"}
    definitions:
      fr: >-
        Gain de prédictibilité d'une variable cible apporté par une information latérale,
        mesuré relativement à une famille explicitement définie de prédicteurs et à une
        perte logarithmique ; sa valeur dépend donc de la classe de modèles considérée.
      en: >-
        Gain in predictability of a target variable from side information, measured relative
        to an explicitly specified family of predictors and logarithmic loss; its value
        therefore depends on the model class considered.
    domains: [probabilistic-foundations-training, architectures-mechanisms]
    resources: [fr/entropy, en/entropy, fr/llm-limits, en/llm-limits]


  - id: kolmogorov-complexity
    importance: specialized
    labels: {fr: "Complexité de Kolmogorov", en: "Kolmogorov complexity"}
    definitions:
      fr: "Longueur du plus court programme, sur une machine universelle de référence, qui produit un objet donné ; elle est définie à une constante additive près selon la machine, mais n'est pas calculable en général."
      en: "Length of the shortest program, on a reference universal machine, that produces a given object; it is defined up to an additive machine-dependent constant but is not computable in general."
    domains: [mathematical-tools-geometry, probabilistic-foundations-training]
    resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence]
  - id: algorithmic-probability
    importance: specialized
    labels: {fr: "Probabilité algorithmique", en: "Algorithmic probability"}
    definitions:
      fr: "Somme des poids 2^{-longueur(programme)} des programmes préfixes d'une machine universelle qui produisent un préfixe donné ; elle définit une semi-mesure universelle, semi-calculable par le bas mais pas calculable exactement."
      en: "Sum of the 2^{-program-length} weights of prefix-free programs on a universal machine that produce an output beginning with a given string; it defines a universal semimeasure that is lower semicomputable but not exactly computable."
    domains: [mathematical-tools-geometry, probabilistic-foundations-training]
    resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence]
  - id: solomonoff-induction
    importance: specialized
    labels: {fr: "Induction de Solomonoff", en: "Solomonoff induction"}
    definitions:
      fr: "Prédiction séquentielle fondée sur la semi-mesure algorithmique universelle ; elle bénéficie de garanties de convergence sous des hypothèses formelles, mais la semi-mesure ne peut pas être calculée exactement."
      en: "Sequential prediction based on the universal algorithmic semimeasure; it has formal convergence guarantees under stated assumptions, but the semimeasure cannot be computed exactly."
    domains: [probabilistic-foundations-training, mathematical-tools-geometry]
    resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence]
  - id: sequential-decision-theory
    importance: specialized
    labels: {fr: "Théorie de la décision séquentielle", en: "Sequential decision theory"}
    definitions:
      fr: "Cadre dans lequel un agent choisit des actions successives afin de maximiser une récompense future espérée, compte tenu de ses observations et d'un modèle de l'environnement."
      en: "Framework in which an agent chooses successive actions to maximize expected future reward given its observations and a model of the environment."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence]
  - id: aixi
    importance: specialized
    labels: {fr: "AIXI", en: "AIXI"}
    definitions:
      fr: "Agent universel théorique qui combine le mélange universel sur les semi-mesures chronologiques énumérables avec la maximisation de récompense en décision séquentielle ; il est optimal dans un sens formel donné, mais incalculable."
      en: "Theoretical universal agent combining the universal mixture over enumerable chronological semimeasures with reward maximization in sequential decision-making; it is optimal in a specified formal sense but incomputable."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence]
  - id: free-energy-principle
    importance: specialized
    labels: {fr: "Principe de l'énergie libre (FEP)", en: "Free Energy Principle (FEP)"}
    definitions:
      fr: "Cadre théorique selon lequel les systèmes auto-organisés peuvent être décrits comme limitant une quantité de surprise à long terme via une borne variationnelle appelée énergie libre ; cette formulation dépend d'un modèle génératif et ne signifie pas que surprise, erreur de prédiction et énergie libre sont identiques."
      en: "Theoretical framework in which self-organizing systems can be described as limiting long-run surprise through a variational bound called free energy; the formulation depends on a generative model and does not make surprise, prediction error, and free energy identical."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence, fr/compression-revision, en/compression-revision]
  - id: active-inference
    importance: specialized
    labels: {fr: "Inférence active", en: "Active inference"}
    definitions:
      fr: "Cadre de perception-action dans lequel un agent ajuste ses croyances et peut agir sur son environnement selon un modèle génératif et des états préférés, en minimisant une énergie libre attendue ; ce cadre ne se réduit ni à la maximisation d'une récompense au sens d'AIXI, ni à une simple compression de données."
      en: "Perception-action framework in which an agent updates its beliefs and may act on its environment according to a generative model and preferred states, minimizing expected free energy; it is neither equivalent to AIXI-style reward maximization nor reducible to ordinary data compression."
    domains: [architectures-mechanisms, probabilistic-foundations-training]
    resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence, fr/compression-revision, en/compression-revision]
  - id: aixi-tl
    importance: specialized
    labels: {fr: "AIXI(t,l)", en: "AIXI(t,l)"}
    definitions:
      fr: "Construction calculable sous contraintes qui compare des politiques candidates bornées en temps par cycle et en longueur de programme ; son coût reste exponentiel en la borne de longueur et son optimalité est relative à la classe et aux conditions de preuve retenues."
      en: "Computable resource-bounded construction comparing candidate policies bounded in per-cycle time and program length; its cost remains exponential in the length bound and its optimality is relative to the selected class and proof conditions."
    domains: [architectures-mechanisms, mathematical-tools-geometry]
    resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence]
  - id: resource-bounded-computation
    importance: supporting
    labels: {fr: "Calcul sous contraintes de ressources", en: "Resource-bounded computation"}
    definitions:
      fr: "Analyse ou construction d'algorithmes en imposant des bornes explicites sur le temps d'exécution, la mémoire ou la longueur des programmes."
      en: "Analysis or construction of algorithms under explicit bounds on execution time, memory, or program length."
    domains: [mathematical-tools-geometry, architectures-mechanisms]
    resources: [fr/universal-artificial-intelligence, en/universal-artificial-intelligence, fr/llm-computational-complexity, en/llm-computational-complexity]


  - id: word-frequency-distribution
    importance: supporting
    labels: {fr: "Distribution des fréquences lexicales", en: "Lexical frequency distribution"}
    definitions:
      fr: "Distribution empirique des nombres d'occurrences des formes lexicales dans un corpus défini, sous des conventions explicites de segmentation et de normalisation. Elle dépend du corpus et de l'unité comptée ; elle ne doit pas être confondue avec la distribution conditionnelle du prochain token prédite par un modèle."
      en: "Empirical distribution of occurrence counts for lexical forms in a defined corpus, under explicit segmentation and normalization conventions. It depends on the corpus and counted unit; it must not be confused with a model's conditional distribution over the next token."
    domains: [probabilistic-foundations-training, text-tokenization]
    resources: [fr/advent-calendar-story-day-01, en/advent-calendar-story-day-01, fr/exercises-zipf-law, en/exercises-zipf-law, fr/text-data, en/text-data]
  - id: zipf-law
    importance: supporting
    labels: {fr: "Loi de Zipf", en: "Zipf's law"}
    definitions:
      fr: "Régularité empirique approximative selon laquelle, dans une distribution de fréquences lexicales classées par fréquence décroissante, la fréquence f(r) du rang r suit souvent une relation de puissance f(r) ∝ r^{-α}, avec α proche de 1 dans certains corpus. L'exposant et la qualité de l'ajustement dépendent du corpus, de l'unité et de la méthode d'estimation ; la relation ne constitue pas en elle-même une explication causale."
      en: "Approximate empirical regularity in which, for lexical frequencies ordered from highest to lowest, the frequency f(r) at rank r often follows a power relation f(r) ∝ r^{-α}, with α near 1 in some corpora. The exponent and fit depend on corpus, unit, and estimation method; the relation is not itself a causal explanation."
    domains: [probabilistic-foundations-training, text-tokenization]
    resources: [fr/advent-calendar-story-day-01, en/advent-calendar-story-day-01, fr/exercises-zipf-law, en/exercises-zipf-law]

relation_types:
  represented-by:
    direction: directed
    family: representational
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est représenté par", en: "is represented by"}
    descriptions:
      fr: "La source est représentée par la cible."
      en: "The source concept is represented by the target."
  prerequisite:
    direction: directed
    family: pedagogical
    transitive: false
    acyclic: true
    learning_dependency: true
    inverse: null
    labels: {fr: "est prérequis pour", en: "is a prerequisite for"}
    descriptions:
      fr: "La source est nécessaire pour comprendre ou utiliser la cible ; cela ne définit pas à lui seul un ordre global du parcours."
      en: "The source is needed to understand or use the target; this alone does not define a global learning sequence."
  part-of:
    direction: directed
    family: structural
    transitive: true
    acyclic: true
    learning_dependency: false
    inverse: null
    labels: {fr: "fait partie de", en: "is part of"}
    descriptions:
      fr: "La source est un composant ou une partie de la cible."
      en: "The source is a component or part of the target."
  constrains:
    direction: directed
    family: constraint
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "contraint", en: "constrains"}
    descriptions:
      fr: "La source impose une contrainte à la cible."
      en: "The source imposes a constraint on the target."
  contributes-to:
    direction: directed
    family: functional
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "contribue à", en: "contributes to"}
    descriptions:
      fr: "La source contribue à la construction ou au fonctionnement de la cible."
      en: "The source contributes to the construction or operation of the target."
  applies-to:
    direction: directed
    family: functional
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "s'applique à", en: "applies to"}
    descriptions:
      fr: "Le mécanisme source peut être utilisé dans le contexte ou le mécanisme cible."
      en: "The source mechanism can be used within the target context or mechanism."
  mapped-by:
    direction: directed
    family: representational
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est projeté par", en: "is mapped by"}
    descriptions:
      fr: "La source est transformée ou projetée par la cible."
      en: "The source is transformed or projected by the target."
  produces:
    direction: directed
    family: functional
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "produit", en: "produces"}
    descriptions:
      fr: "La source produit la cible."
      en: "The source produces the target."
  normalized-by:
    direction: directed
    family: functional
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est normalisé par", en: "is normalized by"}
    descriptions:
      fr: "La source est normalisée par la transformation cible."
      en: "The source is normalized by the target transformation."
  contrasts-with:
    direction: symmetric
    family: associative
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est à distinguer de", en: "contrasts with"}
    descriptions:
      fr: "La source et la cible doivent être distinguées pour éviter une confusion conceptuelle ; cela n'implique pas qu'elles soient des opposés."
      en: "The source and target should be distinguished to prevent conceptual confusion; this does not imply that they are opposites."
  evaluated-by:
    direction: directed
    family: evaluative
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "est évalué par", en: "is evaluated by"}
    descriptions:
      fr: "La source est évaluée au moyen de la cible."
      en: "The source is evaluated using the target."





  approximates:
    direction: directed
    family: functional
    transitive: false
    acyclic: false
    learning_dependency: false
    inverse: null
    labels: {fr: "approxime", en: "approximates"}
    descriptions:
      fr: "La source est un modèle, une loi empirique ou une construction bornée qui approxime certains aspects du comportement de la cible sans lui être identique ; la portée et les hypothèses de l’approximation doivent être explicites."
      en: "The source is a model, empirical law, or bounded construction that approximates selected aspects of the target’s behaviour without being identical to it; the scope and assumptions of the approximation must be explicit."

