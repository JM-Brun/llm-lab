      en: "Negative log-likelihood is the negation of log-likelihood."
  - {from: negative-log-likelihood, type: contributes-to, to: training-objective}
  - {from: observed-target, type: part-of, to: training-example}
  - {from: teacher-forcing, type: applies-to, to: training-example}
  - from: cross-entropy
    type: prerequisite
    to: training-objective
    rationale:
      fr: "L'objectif usuel d'un GPT agrège les coûts de prédiction des tokens cibles."
      en: "The usual GPT objective aggregates prediction costs for target tokens."
  - {from: training-objective, type: produces, to: gradient}
  - from: gradient
    type: prerequisite
    to: parameter-update
    rationale:
      fr: "Dans le parcours minimal d'entraînement par descente de gradient, l'optimiseur utilise les gradients pour mettre à jour les paramètres."
      en: "In the minimum gradient-based training path, the optimizer uses gradients to update parameters."
