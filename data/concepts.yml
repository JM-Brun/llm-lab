  - {from: self-attention, type: contributes-to, to: contextualized-representation}
  - {from: output-projection, type: produces, to: logits}
  - {from: logits, type: normalized-by, to: softmax}
  - {from: softmax, type: evaluated-by, to: cross-entropy}
  - {from: training-objective, type: evaluated-by, to: cross-entropy}
  - {from: softmax, type: produces, to: conditional-distribution}
  - {from: conditional-distribution, type: contributes-to, to: sequence-likelihood}
  - {from: observed-target, type: contributes-to, to: sequence-likelihood}
  - from: conditional-distribution
    type: prerequisite
    to: sequence-likelihood
    rationale:
      fr: "La vraisemblance d'une séquence est construite à partir des probabilités conditionnelles des tokens observés."
      en: "Sequence likelihood is built from conditional probabilities of the observed tokens."
  - from: observed-target
    type: prerequisite
    to: sequence-likelihood
    rationale:
      fr: "Une vraisemblance de séquence porte sur des tokens effectivement observés."
      en: "A sequence likelihood is defined with respect to actually observed tokens."
  - {from: sequence-likelihood, type: mapped-by, to: logarithm}
  - {from: logarithm, type: produces, to: log-likelihood}
  - from: sequence-likelihood
    type: prerequisite
    to: log-likelihood
    rationale:
      fr: "La log-vraisemblance est obtenue en prenant le logarithme de la vraisemblance."
      en: "Log-likelihood is obtained by taking the logarithm of likelihood."
  - {from: log-likelihood, type: mapped-by, to: negation}
