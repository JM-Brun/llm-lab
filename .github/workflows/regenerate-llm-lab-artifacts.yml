name: Regenerate branch learning-map artifacts

on:
  push:
    branches:
      - docs/llm-overview-learning-review

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Generate canonical learning-map artifacts
        run: uv run --no-project --with-requirements docs/requirements-history-validation.txt --python 3.12 python site/tools/build_learning_map.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/includes/generated-*.qmd site/learning-map-data-*.json site/knowledge-graph.jsonld
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git commit -m "chore: regenerate learning-map artifacts"
          git push origin "HEAD:${{ github.ref_name }}"
