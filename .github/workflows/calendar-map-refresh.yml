name: Regenerate learning-map artifacts (temporary)

on:
  push:
    branches: [fix/advent-calendar-post-merge-validation]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install project and generator dependencies
        run: |
          uv sync --locked --dev
          uv pip install --python .venv/bin/python -r docs/requirements-history-validation.txt
      - name: Regenerate bilingual learning-map artifacts
        run: uv run python site/tools/build_learning_map.py
      - name: Commit refreshed bilingual map payloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/includes/generated-map-data-fr.qmd site/includes/generated-map-data-en.qmd
          if git diff --cached --quiet; then
            echo "Generated map payloads are already current."
          else
            git commit -m "build(learning-map): refresh bilingual page-map payloads [skip ci]"
            git push
          fi
      - name: Upload generated artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-learning-map-artifacts
          path: |
            site/includes/generated-*.qmd
            site/learning-map-data-*.json
            site/knowledge-graph.jsonld
          if-no-files-found: error
          retention-days: 3
