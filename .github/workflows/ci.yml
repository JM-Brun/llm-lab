name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install documentation example dependency
        run: uv pip install --python .venv/bin/python -r docs/requirements-tokenizer-example.txt

      - name: Install history data validation dependency
        run: uv pip install --python .venv/bin/python -r docs/requirements-history-validation.txt

      - name: Validate source catalogue and extraction records
        run: uv run python site/tools/check_source_catalogue.py

      - name: Validate page metadata learning graph
        run: uv run python site/tools/check_page_metadata.py

      - name: Audit page metadata topology
        run: uv run python site/tools/audit_page_metadata.py

      - name: Validate bilingual concept registry
        run: uv run python site/tools/check_concept_registry.py

      - name: Validate first-class learning resources
        run: uv run python site/tools/check_resource_registry.py

      - name: Validate bilingual history pilot dataset
        run: uv run python site/tools/check_history_pilot.py

      - name: Generate bilingual history timeline fragments
        run: uv run python site/tools/render_history_pilot.py

      - name: Execute bilingual tokenizer-to-embedding example
        run: uv run python site/tools/check_embedding_trace.py

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest
