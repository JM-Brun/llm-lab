name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_concept_benchmark:
        description: "Run the 500/2,000/10,000 concept-registry benchmark"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and domain checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect domain-validation scope
        id: validation_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            echo "domain_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
          if printf '%s\n' "$changed_files" | grep -Eq '^(site/|data/|src/|scripts/|docs/|pyproject.toml$|uv.lock$|.github/workflows/ci.yml$)'; then
            echo "domain_checks=true" >> "$GITHUB_OUTPUT"
          else
            echo "domain_checks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            docs/requirements-*.txt

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install YAML validation dependencies
        # Also required by the static type check for the repository's YAML helpers.
        run: uv pip install --python .venv/bin/python -r docs/requirements-history-validation.txt

      - name: Install tokenizer example dependency
        if: steps.validation_scope.outputs.domain_checks == 'true'
        run: uv pip install --python .venv/bin/python -r docs/requirements-tokenizer-example.txt

      - name: Validate source catalogue and extraction records
        if: steps.validation_scope.outputs.domain_checks == 'true'
        run: uv run python site/tools/check_source_catalogue.py

      - name: Publish source-to-knowledge coverage in job summary
        if: steps.validation_scope.outputs.domain_checks == 'true'
        run: |
          uv run python site/tools/report_source_coverage.py --output "$RUNNER_TEMP/source-coverage.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/source-coverage.md"

      - name: Validate page metadata learning graph
        if: steps.validation_scope.outputs.domain_checks == 'true'
        run: uv run python site/tools/check_page_metadata.py

      - name: Audit page metadata topology
        if: steps.validation_scope.outputs.domain_checks == 'true'
        run: uv run python site/tools/audit_page_metadata.py

      - name: Validate bilingual concept registry
        if: steps.validation_scope.outputs.domain_checks == 'true'
        run: uv run python site/tools/check_concept_registry.py

      - name: Validate first-class learning resources
        if: steps.validation_scope.outputs.domain_checks == 'true'
        run: uv run python site/tools/check_resource_registry.py

      - name: Validate bilingual history pilot dataset
        if: steps.validation_scope.outputs.domain_checks == 'true'
        run: uv run python site/tools/check_history_pilot.py

      - name: Generate bilingual history timeline fragments
        if: steps.validation_scope.outputs.domain_checks == 'true'
        run: uv run python site/tools/render_history_pilot.py

      - name: Execute bilingual tokenizer-to-embedding example
        if: steps.validation_scope.outputs.domain_checks == 'true'
        run: uv run python site/tools/check_embedding_trace.py

      - name: Validate display-math delimiters
        if: steps.validation_scope.outputs.domain_checks == 'true'
        run: uv run python site/tools/check_math_delimiters.py site

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: |
          uv run mypy src
          uv run mypy site/tools/strict_yaml.py site/tools/page_index.py site/tools/artifact_writer.py

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect reference-parity scope
        id: reference_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            echo "reference_parity=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
          if printf '%s\n' "$changed_files" | grep -Eq '^(src/llm_lab/foundations/|tests/unit/test_gpt2_reference_parity\.py$|docs/requirements-gpt2-reference\.txt$|pyproject\.toml$|uv\.lock$|.github/workflows/ci\.yml$)'; then
            echo "reference_parity=true" >> "$GITHUB_OUTPUT"
          else
            echo "reference_parity=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          # The reference-only CPU PyTorch wheel makes this cache ~255 MB.
          # Its download is faster than saving/restoring the full cache on every run.
          enable-cache: false
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            docs/requirements-gpt2-reference.txt

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install site-tool test dependencies
        # These tests import site generators that use Pydantic and PyYAML.
        # Keep this explicit instead of relying on Transformers to install Pydantic transitively.
        run: uv pip install --python .venv/bin/python -r docs/requirements-history-validation.txt

      - name: Install CPU-only PyTorch
        if: steps.reference_scope.outputs.reference_parity == 'true'
        # Avoid multi-gigabyte CUDA wheels. The pin matches the reference requirements.
        run: uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch==2.15.0

      - name: Install GPT-2 reference dependency
        if: steps.reference_scope.outputs.reference_parity == 'true'
        run: uv pip install --python .venv/bin/python -r docs/requirements-gpt2-reference.txt

      - name: Install parallel test runner
        # CI-only orchestration; keep it outside the project lock.
        run: uv pip install --python .venv/bin/python pytest-xdist==3.8.0

      - name: Test
        # Keep the complete suite and coverage threshold; scheduling is benchmarked separately.
        run: uv run pytest -n 2 --dist loadscope --durations=20

  benchmark:
    name: Opt-in concept-registry scale benchmark
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_concept_benchmark) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[benchmark]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out benchmark commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            docs/requirements-history-validation.txt

      - name: Run concept-registry benchmark
        env:
          BENCHMARK_COMMAND: uv run --no-project --with-requirements docs/requirements-history-validation.txt --python 3.12 python site/tools/benchmark_concept_registry.py --sizes 500 2000 10000 --repeats 5 --output "$RUNNER_TEMP/concept-registry-benchmark.json"
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          start_epoch="$(date +%s)"
          uv run --no-project --with-requirements docs/requirements-history-validation.txt --python 3.12 python site/tools/benchmark_concept_registry.py --sizes 500 2000 10000 --repeats 5 --output "$RUNNER_TEMP/concept-registry-benchmark.json"
          end_epoch="$(date +%s)"
          BENCHMARK_STARTED_AT="$started_at" BENCHMARK_DURATION_SECONDS="$((end_epoch - start_epoch))" uv run --no-project --with-requirements docs/requirements-history-validation.txt --python 3.12 python - <<'PY'
          import datetime
          import json
          import os
          import platform
          import subprocess
          import sys
          import yaml

          metadata = {
              "commit_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "pull_request_head_sha": os.environ.get("PR_HEAD_SHA"),
              "command": os.environ["BENCHMARK_COMMAND"],
              "started_at_utc": os.environ["BENCHMARK_STARTED_AT"],
              "completed_at_utc": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "duration_seconds": int(os.environ["BENCHMARK_DURATION_SECONDS"]),
              "python_version": sys.version,
              "python_implementation": platform.python_implementation(),
              "platform": platform.platform(),
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "pyyaml_version": yaml.__version__,
              "uv_version": subprocess.check_output(
                  ["uv", "--version"], text=True
              ).strip(),
              "sizes": [500, 2000, 10000],
              "repeats": 5,
          }
          with open(
              os.environ["RUNNER_TEMP"] + "/concept-registry-benchmark-metadata.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(metadata, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          python - "$RUNNER_TEMP/concept-registry-benchmark.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              report = json.load(f)
          print("### Concept-registry benchmark")
          print()
          print("| Concepts | Relations | Build median (s) | Validation median (s) | Validation peak (MiB) | Errors |")
          print("|---:|---:|---:|---:|---:|---:|")
          for row in report["results"]:
              peak_mib = row["validation_peak_bytes_max"] / (1024 * 1024)
              errors = max(row["validation_error_counts"], default=0)
              print(
                  f"| {row['concepts']} | {row['relations']} | "
                  f"{row['fixture_build_seconds_median']:.6f} | "
                  f"{row['validation_seconds_median']:.6f} | "
                  f"{peak_mib:.2f} | {errors} |"
              )
          print()
          print(f"Commit: `{report['environment']['commit_sha']}`")
          PY

      - name: Upload raw benchmark and execution metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-registry-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/concept-registry-benchmark.json
            ${{ runner.temp }}/concept-registry-benchmark-metadata.json
          if-no-files-found: warn
          retention-days: 90
