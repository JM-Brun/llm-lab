name: Publish Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-quarto-${{ github.ref }}
  # Let an active Pages deployment finish before starting the next one.
  # Pending runs are still coalesced by GitHub Actions concurrency.
  cancel-in-progress: false

jobs:
  build:
    name: Render Quarto site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A site cache is reusable only when it was built from the exact parent
      # commit of this push. The cache key is immutable; restore-keys only
      # locate a candidate, and the marker below validates its provenance.
      - name: Restore previous rendered site
        id: site_cache
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: site/_site
          key: quarto-publish-site-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            quarto-publish-site-${{ runner.os }}-

      - name: Detect publish render scope
        id: render_scope
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch or missing parent commit: requiring a full render."
            exit 0
          fi

          changed_files_json="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$GITHUB_SHA" --jq '.files[] | {filename, status}' | jq -s '.')"
          changed_count="$(jq 'length' <<< "$changed_files_json")"
          if [ "$changed_count" -ge 300 ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "GitHub truncated the changed-file list; requiring a full render."
            exit 0
          fi

          PR_CHANGED_FILES_JSON="$changed_files_json" python3 scripts/quarto_render_scope.py
          # The shared classifier writes render_mode to GITHUB_OUTPUT.
          # Copy it to a publish-specific output for clarity in later steps.
          mode="$(sed -n 's/^render_mode=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          echo "mode=${mode:-full}" >> "$GITHUB_OUTPUT"

      - name: Validate restored site provenance
        id: site_provenance
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          marker="site/_site/.llm-lab-source-sha"
          source_sha=""
          if [ -s "$marker" ] && [ -s site/_site/index.html ] && [ -d site/_site/site_libs ]; then
            source_sha="$(cat "$marker")"
          fi

          if [ "$source_sha" = "$GITHUB_SHA" ]; then
            echo "state=current" >> "$GITHUB_OUTPUT"
            echo "The restored site already matches this commit."
          elif [ -n "$BEFORE_SHA" ] && [ "$source_sha" = "$BEFORE_SHA" ]; then
            echo "state=parent" >> "$GITHUB_OUTPUT"
            echo "The restored site matches the exact parent commit."
          else
            echo "state=invalid" >> "$GITHUB_OUTPUT"
            echo "No site cache from the exact parent commit; requiring a full render."
          fi

      - name: Select publish render strategy
        id: publish_strategy
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ steps.render_scope.outputs.mode }}
          CACHE_STATE: ${{ steps.site_provenance.outputs.state }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            mode=full
          elif [ "$CACHE_STATE" = "current" ]; then
            mode=skip
          elif [ "$CACHE_STATE" = "parent" ]; then
            mode="${REQUESTED_MODE:-full}"
          else
            mode=full
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Publish strategy: $mode"

      - name: Cache Quarto Linux tarball
        if: steps.publish_strategy.outputs.mode != 'skip'
        id: quarto_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/quarto-1.11.9-linux-amd64.tar.gz
          key: quarto-tarball-${{ runner.os }}-1.11.9

      - name: Set up Quarto
        if: steps.publish_strategy.outputs.mode != 'skip'
        env:
          QUARTO_VERSION: "1.11.9"
          QUARTO_SHA256: "9d037baa3b38ffac7217edca1d2e53760b0fab4d5749220740a32056e03a1530"
        run: |
          archive="$RUNNER_TEMP/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz"
          if [ ! -s "$archive" ] || ! echo "$QUARTO_SHA256  $archive" | sha256sum --check --status; then
            rm -f "$archive"
            url="https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 240 --output "$archive" "$url"
          fi
          echo "$QUARTO_SHA256  $archive" | sha256sum --check
          install_dir="$RUNNER_TEMP/quarto-${QUARTO_VERSION}"
          mkdir -p "$install_dir"
          tar -xzf "$archive" --strip-components=1 -C "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/quarto" --version

      - name: Set up uv and Python
        if: steps.publish_strategy.outputs.mode != 'skip'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: docs/requirements-history-validation.txt

      # Keep uv-managed Python at a stable path: virtualenvs contain an
      # interpreter link, so caching .venv alone is not portable when uv
      # installs Python under runner.temp (which changes between runs).
      - name: Configure stable uv Python directory
        if: steps.publish_strategy.outputs.mode != 'skip'
        run: echo "UV_PYTHON_INSTALL_DIR=$GITHUB_WORKSPACE/.uv-python" >> "$GITHUB_ENV"

      - name: Cache shared render environment
        if: steps.publish_strategy.outputs.mode != 'skip'
        id: render_venv_cache
        uses: actions/cache@v4
        with:
          path: |
            .uv-python
            .venv
          key: quarto-publish-python-${{ runner.os }}-py3.12.16-uv0.13.7-${{ hashFiles('docs/requirements-history-validation.txt') }}

      - name: Install pinned Python
        if: steps.publish_strategy.outputs.mode != 'skip'
        run: uv python install 3.12.16

      - name: Verify cached render environment
        if: steps.publish_strategy.outputs.mode != 'skip'
        id: verify_render_venv
        run: |
          if [ -x .venv/bin/python ] && .venv/bin/python -c 'import sys, yaml, pydantic; assert sys.version_info[:3] == (3, 12, 16)'; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Reusing the cached Python environment."
          else
            rm -rf .venv
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "No usable Python environment cache; creating it now."
          fi

      - name: Create shared render environment
        if: steps.publish_strategy.outputs.mode != 'skip' && steps.verify_render_venv.outputs.valid != 'true'
        run: |
          uv venv --python 3.12.16 .venv
          uv pip install --python .venv/bin/python -r docs/requirements-history-validation.txt

      - name: Generate bilingual history timeline fragments
        if: steps.publish_strategy.outputs.mode != 'skip'
        run: .venv/bin/python site/tools/render_history_pilot.py

      - name: Generate learning-map data and guided-route Markdown
        if: steps.publish_strategy.outputs.mode != 'skip'
        run: .venv/bin/python site/tools/build_learning_map.py

      - name: Generate bilingual computational-graph fragments
        if: steps.publish_strategy.outputs.mode != 'skip'
        run: .venv/bin/python site/tools/render_computational_graph.py

      - name: Render changed pages incrementally
        if: steps.publish_strategy.outputs.mode == 'incremental'
        env:
          RENDER_TARGETS: ${{ steps.render_scope.outputs.render_targets }}
          RENDER_ASSETS: ${{ steps.render_scope.outputs.render_assets }}
        run: |
          if [ -z "$RENDER_TARGETS" ] && [ -z "$RENDER_ASSETS" ]; then
            echo "Incremental mode has no safe page or asset targets; falling back to a full render."
            quarto render site
          else
            while IFS= read -r page; do
              [ -n "$page" ] || continue
              echo "Incrementally rendering $page"
              quarto render "$page" --no-clean
            done <<< "$RENDER_TARGETS"
          fi

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            relative="${asset#site/}"
            destination="site/_site/$relative"
            mkdir -p "$(dirname "$destination")"
            cp -- "$asset" "$destination"
            echo "Copied updated static asset $relative"
          done <<< "$RENDER_ASSETS"

      - name: Render full site
        if: steps.publish_strategy.outputs.mode == 'full'
        run: quarto render site

      - name: Mark rendered site source commit
        if: success() && steps.publish_strategy.outputs.mode != ''
        run: |
          mkdir -p site/_site
          echo "$GITHUB_SHA" > site/_site/.llm-lab-source-sha

      # Cache is saved only after a successful render/deploy-artifact preparation.
      - name: Save rendered site for the next publish
        if: success() && github.event_name == 'push' && steps.site_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: site/_site
          key: quarto-publish-site-${{ runner.os }}-${{ github.sha }}

      # Keep a short-lived copy of the latest complete site so PRs that
      # touch only a few pages can render those pages against the real site.
      - name: Upload rendered site cache for pull requests
        uses: actions/upload-artifact@v4
        with:
          name: quarto-site-cache
          path: site/_site
          if-no-files-found: error
          retention-days: 3
          compression-level: 1

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346c9 # v5.0.1
