name: Branch hygiene

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete branches proven redundant against main (false = dry run)"
        type: boolean
        default: false
      exclude:
        description: "Comma-separated branch names that must never be deleted"
        type: string
        default: ""
      delete:
        description: "Comma-separated branch names to delete as obsolete (explicit human arbitration)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ['.github/branch-hygiene-trigger.md']

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  audit:
    name: Classify branches against main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 fetches all branch tips and their history; a second
          # explicit fetch of every branch would duplicate the same network work.
          fetch-depth: 0

      - name: Resolve run mode
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -f .github/branch-hygiene-trigger.md ]; then
            marker=".github/branch-hygiene-trigger.md"
            if grep -Eq '^[[:space:]]*apply[[:space:]]*[:=][[:space:]]*true[[:space:]]*$' "$marker"; then
              echo "APPLY=true" >> "$GITHUB_ENV"
            else
              echo "APPLY=false" >> "$GITHUB_ENV"
            fi
            exclude="$(sed -n 's/^[[:space:]]*exclude[[:space:]]*[:=][[:space:]]*//p' "$marker" | head -n 1)"
            echo "EXCLUDE=$exclude" >> "$GITHUB_ENV"
            delete_list="$(sed -n 's/^[[:space:]]*delete[[:space:]]*[:=][[:space:]]*//p' "$marker" | head -n 1)"
            echo "DELETE_LIST=$delete_list" >> "$GITHUB_ENV"
          else
            if [ "${{ inputs.apply }}" = "true" ]; then
              echo "APPLY=true" >> "$GITHUB_ENV"
            else
              echo "APPLY=false" >> "$GITHUB_ENV"
            fi
            echo "EXCLUDE=${{ inputs.exclude }}" >> "$GITHUB_ENV"
            echo "DELETE_LIST=${{ inputs.delete }}" >> "$GITHUB_ENV"
          fi

      - name: Collect protected branch names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            printf 'main\n'
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json headRefName --jq '.[].headRefName'
            printf '%s\n' "$EXCLUDE"
          } | sed 's/[[:space:]]//g' | grep -v '^$' | sort -u > "$RUNNER_TEMP/protected.txt"
          echo "Protected branches:"
          cat "$RUNNER_TEMP/protected.txt"

      - name: Classify each branch against main
        run: |
          set -euo pipefail
          main_tree="$(git rev-parse 'refs/remotes/origin/main^{tree}')"
          redundant="$RUNNER_TEMP/redundant.tsv"
          kept="$RUNNER_TEMP/kept.tsv"
          : > "$redundant"
          : > "$kept"

          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin); do
            branch="${ref#origin/}"
            if [ "$branch" = "HEAD" ]; then
              continue
            fi
            if grep -qx "$branch" "$RUNNER_TEMP/protected.txt"; then
              printf '%s\tprotected (main, open pull request, or explicit exclusion)\n' "$branch" >> "$kept"
              continue
            fi
            branch_ref="refs/remotes/origin/$branch"
            if printf '%s' "$DELETE_LIST" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -qx "$branch"; then
              tip="$(git rev-parse --short "$branch_ref")"
              printf '%s\tobsolete (tip %s): explicit human arbitration on issue #652\n' "$branch" "$tip" >> "$redundant"
              continue
            fi
            ahead="$(git rev-list --count "refs/remotes/origin/main..$branch_ref")"
            if git merge-base --is-ancestor "$branch_ref" refs/remotes/origin/main; then
              behind="$(git rev-list --count "$branch_ref..refs/remotes/origin/main")"
              if [ "$behind" -eq 0 ]; then
                printf '%s\ttip equals the current main tip (fresh or unchanged branch); never deleted automatically\n' "$branch" >> "$kept"
              else
                printf '%s\tbranch tip is an ancestor of main (fully merged)\n' "$branch" >> "$redundant"
              fi
              continue
            fi
            merge_status=0
            merge_output="$(git merge-tree --write-tree refs/remotes/origin/main "$branch_ref")" || merge_status=$?
            merge_tree="$(printf '%s\n' "$merge_output" | sed -n '1p')"
            if [ "$merge_status" -eq 0 ] && [ "$merge_tree" = "$main_tree" ]; then
              printf '%s\tmerging into main reproduces the exact main tree (changes already integrated)\n' "$branch" >> "$redundant"
            elif [ "$merge_status" -ne 0 ]; then
              printf '%s\t%s unique commit(s); merging conflicts with current main\n' "$branch" "$ahead" >> "$kept"
            else
              printf '%s\t%s unique commit(s); merge result differs from main (content not fully integrated)\n' "$branch" "$ahead" >> "$kept"
            fi
          done

          echo "Redundant branches:"
          cat "$redundant"
          echo "Kept branches:"
          cat "$kept"

      - name: Delete redundant branches
        if: ${{ env.APPLY == 'true' }}
        run: |
          set -euo pipefail
          cut -f1 "$RUNNER_TEMP/redundant.tsv" | while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            echo "Deleting origin/$branch"
            git push origin --delete "$branch"
          done

      - name: Write job summary and publish report
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APPLY="${APPLY:-false}"
          redundant="$RUNNER_TEMP/redundant.tsv"
          kept="$RUNNER_TEMP/kept.tsv"
          [ -f "$redundant" ] || : > "$redundant"
          [ -f "$kept" ] || : > "$kept"
          {
            echo "## Branch hygiene report"
            echo
            if [ "$APPLY" = "true" ]; then
              echo "Mode: **apply** (the branches listed below as redundant were deleted)."
            else
              echo 'Mode: **dry run** (no branch was deleted; set `apply: true` in `.github/branch-hygiene-trigger.md`, or re-run the workflow with `apply` enabled, to delete the branches listed below).'
            fi
            echo
            echo "Redundancy is proven by one of two Git checks: the branch tip is an ancestor of main, or a three-way merge of the branch into current main reproduces main's exact tree. Diverged branches with unique content are always kept, and a branch whose tip equals the current main tip is never deleted automatically (it may be a freshly created working branch). Branches listed in 'delete:' are deleted as obsolete by explicit human decision; protected branches (main, open pull-request heads, excluded names) are never deleted."
            echo
            echo "### Redundant branches (proven)"
            echo
            echo "| Branch | Proof of redundancy |"
            echo "| --- | --- |"
            awk -F'\t' 'NF >= 2 { printf "| \`%s\` | %s |\n", $1, $2 }' "$redundant"
            echo
            echo "### Kept branches"
            echo
            echo "| Branch | Reason |"
            echo "| --- | --- |"
            awk -F'\t' 'NF >= 2 { printf "| \`%s\` | %s |\n", $1, $2 }' "$kept"
          } > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment 652 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
