name: Quarto site

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: quarto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Quarto site & browser audit
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56.1 does not
    # support ("Playwright does not support chromium on ubuntu26.04-x64").
    # Move back to ubuntu-latest together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    # The matching Playwright image already contains Chromium and its Linux
    # libraries. This avoids a per-run apt update/install (and its flaky mirrors).
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only modified, already-listed .qmd pages qualify for incremental rendering.
      # Any shared input, deletion, rename, addition, or config change falls back to full.
      - name: Detect site and browser review scope
        id: site_changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed_files_json="$(python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          pull_number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          files = []
          page = 1
          while True:
              url = (
                  f"https://api.github.com/repos/{repository}/pulls/{pull_number}/files"
                  f"?per_page=100&page={page}"
              )
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  batch = json.load(response)
              files.extend(
                  {"filename": item["filename"], "status": item["status"]}
                  for item in batch
              )
              if len(batch) < 100:
                  break
              page += 1
          print(json.dumps(files))
          PY
          )"
          PR_CHANGED_FILES_JSON="$changed_files_json" python3 scripts/quarto_render_scope.py

      - name: Find latest published site cache
        id: site_cache
        if: github.event_name == 'pull_request' && (steps.site_changes.outputs.render_mode == 'incremental' || (steps.site_changes.outputs.render_mode == 'skip' && steps.site_changes.outputs.browser_relevant == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base_sha = os.environ["BASE_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              with urlopen(Request(url, headers=headers), timeout=30) as response:
                  return json.load(response)

          api = f"https://api.github.com/repos/{repository}"
          query = urlencode({"branch": "main", "status": "success", "per_page": 100})
          runs = get_json(f"{api}/actions/workflows/publish-quarto.yml/runs?{query}")
          run_id = None
          for run in runs["workflow_runs"]:
              if run["head_sha"] != base_sha:
                  continue
              artifacts = get_json(f"{api}/actions/runs/{run['id']}/artifacts?per_page=100")
              if any(
                  item["name"] == "quarto-site-cache" and not item["expired"]
                  for item in artifacts["artifacts"]
              ):
                  run_id = run["id"]
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"available={'true' if run_id else 'false'}\n")
              if run_id:
                  output.write(f"run_id={run_id}\n")
          if run_id:
              print(f"Found published site cache in workflow run {run_id}.")
          else:
              print("No recent published site cache; falling back to a full render.")
          PY

      - name: Restore latest published site
        id: restore_site
        if: github.event_name == 'pull_request' && (steps.site_changes.outputs.render_mode == 'incremental' || (steps.site_changes.outputs.render_mode == 'skip' && steps.site_changes.outputs.browser_relevant == 'true')) && steps.site_cache.outputs.available == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: quarto-site-cache
          run-id: ${{ steps.site_cache.outputs.run_id }}
          github-token: ${{ github.token }}
          path: site/_site

      - name: Verify restored site cache
        id: verify_site_cache
        if: github.event_name == 'pull_request' && (steps.site_changes.outputs.render_mode == 'incremental' || (steps.site_changes.outputs.render_mode == 'skip' && steps.site_changes.outputs.browser_relevant == 'true'))
        run: |
          missing=()
          while IFS= read -r source; do
            [ -n "$source" ] || continue
            output="site/_site/${source%.qmd}.html"
            if [ ! -s "$output" ]; then
              missing+=("$output")
            fi
          done < <(sed -n '/^  render:/,/^website:/s/^    - //p' site/_quarto.yml)

          if [ -s site/_site/index.html ] && [ -d site/_site/site_libs ] && [ "${#missing[@]}" -eq 0 ]; then
            echo "cache_restored=true" >> "$GITHUB_OUTPUT"
            echo "Restored site cache contains every page in the current Quarto render list."
          else
            echo "cache_restored=false" >> "$GITHUB_OUTPUT"
            if [ "${#missing[@]}" -gt 0 ]; then
              printf 'Cached site is missing configured page(s): %s\n' "${missing[@]}"
            else
              echo "Site cache unavailable or incomplete."
            fi
            echo "Falling back to a full render."
          fi

      # Scheduled/manual full audits should validate the exact published commit,
      # not spend minutes rebuilding a site that publication has already rendered.
      # Non-main workflow_dispatch runs deliberately keep the full-render fallback.
      - name: Find exact published site cache for full audit
        id: published_site_cache
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_SHA: ${{ github.sha }}
        run: |
          BASE_SHA="$AUDIT_SHA" python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base_sha = os.environ["BASE_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              with urlopen(Request(url, headers=headers), timeout=30) as response:
                  return json.load(response)

          api = f"https://api.github.com/repos/{repository}"
          query = urlencode({"branch": "main", "status": "success", "per_page": 100})
          runs = get_json(f"{api}/actions/workflows/publish-quarto.yml/runs?{query}")
          run_id = None
          for run in runs["workflow_runs"]:
              if run["head_sha"] != base_sha:
                  continue
              artifacts = get_json(f"{api}/actions/runs/{run['id']}/artifacts?per_page=100")
              if any(
                  item["name"] == "quarto-site-cache" and not item["expired"]
                  for item in artifacts["artifacts"]
              ):
                  run_id = run["id"]
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"available={'true' if run_id else 'false'}\n")
              if run_id:
                  output.write(f"run_id={run_id}\n")
          if run_id:
              print(f"Found exact-commit published site cache in workflow run {run_id}.")
          else:
              print("No exact-commit published site cache; retaining the full-render fallback.")
          PY

      - name: Restore published site for full audit
        if: steps.published_site_cache.outputs.available == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: quarto-site-cache
          run-id: ${{ steps.published_site_cache.outputs.run_id }}
          github-token: ${{ github.token }}
          path: site/_site

      - name: Verify published site for full audit
        id: verify_published_site
        if: steps.published_site_cache.outputs.available == 'true'
        run: |
          missing=()
          while IFS= read -r source; do
            [ -n "$source" ] || continue
            output="site/_site/${source%.qmd}.html"
            if [ ! -s "$output" ]; then
              missing+=("$output")
            fi
          done < <(sed -n '/^  render:/,/^website:/s/^    - //p' site/_quarto.yml)

          marker="site/_site/.llm-lab-source-sha"
          if [ -s "$marker" ] && [ "$(cat "$marker")" = "$GITHUB_SHA" ] && [ -s site/_site/index.html ] && [ -d site/_site/site_libs ] && [ "${#missing[@]}" -eq 0 ]; then
            echo "cache_restored=true" >> "$GITHUB_OUTPUT"
            echo "Verified exact-commit published site cache; full audit can skip Quarto rendering."
          else
            echo "cache_restored=false" >> "$GITHUB_OUTPUT"
            echo "Published site cache failed provenance or completeness checks; falling back to a full render."
            [ "${#missing[@]}" -eq 0 ] || printf 'Missing configured page(s): %s\n' "${missing[@]}"
          fi

      - name: Cache Quarto Linux tarball
        if: (github.event_name != 'pull_request' && steps.verify_published_site.outputs.cache_restored != 'true') || (github.event_name == 'pull_request' && ((steps.site_changes.outputs.site_relevant == 'true' || steps.site_changes.outputs.browser_relevant == 'true') && (steps.site_changes.outputs.render_mode != 'skip' || steps.verify_site_cache.outputs.cache_restored != 'true') && (steps.site_changes.outputs.render_targets != '' || steps.site_changes.outputs.render_assets == '' || steps.verify_site_cache.outputs.cache_restored != 'true')))
        id: quarto_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/quarto-1.11.9-linux-amd64.tar.gz
          key: quarto-tarball-${{ runner.os }}-1.11.9

      - name: Set up Quarto
        if: (github.event_name != 'pull_request' && steps.verify_published_site.outputs.cache_restored != 'true') || (github.event_name == 'pull_request' && ((steps.site_changes.outputs.site_relevant == 'true' || steps.site_changes.outputs.browser_relevant == 'true') && (steps.site_changes.outputs.render_mode != 'skip' || steps.verify_site_cache.outputs.cache_restored != 'true') && (steps.site_changes.outputs.render_targets != '' || steps.site_changes.outputs.render_assets == '' || steps.verify_site_cache.outputs.cache_restored != 'true')))
        env:
          QUARTO_VERSION: "1.11.9"
          QUARTO_SHA256: "9d037baa3b38ffac7217edca1d2e53760b0fab4d5749220740a32056e03a1530"
        run: |
          archive="$RUNNER_TEMP/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz"
          if [ ! -s "$archive" ] || ! echo "$QUARTO_SHA256  $archive" | sha256sum --check --status; then
            rm -f "$archive"
            url="https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 240 --output "$archive" "$url"
          fi
          echo "$QUARTO_SHA256  $archive" | sha256sum --check
          install_dir="$RUNNER_TEMP/quarto-${QUARTO_VERSION}"
          mkdir -p "$install_dir"
          tar -xzf "$archive" --strip-components=1 -C "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/quarto" --version

      # Image-only PRs with a verified published-site cache need neither Quarto
      # nor Python: they copy the changed image and still run output/link checks.
      # Keep the environment for cache misses and all changes needing a render.
      - name: Set up uv and Python
        if: github.event_name != 'pull_request' || ((steps.site_changes.outputs.site_relevant == 'true' || steps.site_changes.outputs.browser_relevant == 'true') && (steps.site_changes.outputs.render_mode != 'skip' || steps.verify_site_cache.outputs.cache_restored != 'true') && (steps.site_changes.outputs.render_targets != '' || steps.site_changes.outputs.render_assets == '' || steps.verify_site_cache.outputs.cache_restored != 'true'))
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            docs/requirements-*.txt

      - name: Create shared validation environment
        if: github.event_name != 'pull_request' || ((steps.site_changes.outputs.site_relevant == 'true' || steps.site_changes.outputs.browser_relevant == 'true') && (steps.site_changes.outputs.render_mode != 'skip' || steps.verify_site_cache.outputs.cache_restored != 'true') && (steps.site_changes.outputs.render_targets != '' || steps.site_changes.outputs.render_assets == '' || steps.verify_site_cache.outputs.cache_restored != 'true'))
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r docs/requirements-history-validation.txt

      - name: Validate page metadata learning graph
        if: github.event_name != 'pull_request'
        run: .venv/bin/python site/tools/check_page_metadata.py

      - name: Validate first-class learning resources
        if: github.event_name != 'pull_request'
        run: .venv/bin/python site/tools/check_resource_registry.py

      - name: Generate bilingual history timeline fragments
        if: (github.event_name != 'pull_request' && steps.verify_published_site.outputs.cache_restored != 'true') || (github.event_name == 'pull_request' && ((steps.site_changes.outputs.site_relevant == 'true' || steps.site_changes.outputs.browser_relevant == 'true') && (steps.site_changes.outputs.render_mode != 'skip' || steps.verify_site_cache.outputs.cache_restored != 'true') && steps.site_changes.outputs.generate_history == 'true'))
        run: .venv/bin/python site/tools/render_history_pilot.py

      - name: Generate learning-map data and guided-route Markdown
        if: (github.event_name != 'pull_request' && steps.verify_published_site.outputs.cache_restored != 'true') || (github.event_name == 'pull_request' && ((steps.site_changes.outputs.site_relevant == 'true' || steps.site_changes.outputs.browser_relevant == 'true') && (steps.site_changes.outputs.render_mode != 'skip' || steps.verify_site_cache.outputs.cache_restored != 'true') && steps.site_changes.outputs.generate_learning_map == 'true'))
        run: .venv/bin/python site/tools/build_learning_map.py

      - name: Generate bilingual computational-graph fragments
        if: (github.event_name != 'pull_request' && steps.verify_published_site.outputs.cache_restored != 'true') || (github.event_name == 'pull_request' && ((steps.site_changes.outputs.site_relevant == 'true' || steps.site_changes.outputs.browser_relevant == 'true') && (steps.site_changes.outputs.render_mode != 'skip' || steps.verify_site_cache.outputs.cache_restored != 'true') && steps.site_changes.outputs.generate_computational_graph == 'true'))
        run: .venv/bin/python site/tools/render_computational_graph.py

      - name: Render changed pages incrementally
        if: ${{ github.event_name == 'pull_request' && steps.site_changes.outputs.render_mode == 'incremental' && steps.verify_site_cache.outputs.cache_restored == 'true' && (steps.site_changes.outputs.render_targets != '' || steps.site_changes.outputs.render_assets != '') }}
        env:
          RENDER_TARGETS: ${{ steps.site_changes.outputs.render_targets }}
          RENDER_ASSETS: ${{ steps.site_changes.outputs.render_assets }}
        run: |
          .venv/bin/python scripts/quarto_render_batch.py

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            relative="${asset#site/}"
            destination="site/_site/$relative"
            mkdir -p "$(dirname "$destination")"
            cp -- "$asset" "$destination"
            echo "Copied updated static asset $relative"
          done <<< "$RENDER_ASSETS"

      - name: Render full site
        if: ${{ (github.event_name != 'pull_request' && steps.verify_published_site.outputs.cache_restored != 'true') || (github.event_name == 'pull_request' && ((steps.site_changes.outputs.site_relevant == 'true' || (steps.site_changes.outputs.browser_relevant == 'true' && steps.verify_site_cache.outputs.cache_restored != 'true')) && (steps.site_changes.outputs.render_mode != 'incremental' || steps.verify_site_cache.outputs.cache_restored != 'true'))) }}
        run: quarto render site

      # Exercise renderer changes against the restored or freshly rendered site.
      # This validates the actual CLI path without forcing an unnecessary full build.
      - name: Smoke-test isolated batched incremental renderer
        if: github.event_name == 'pull_request' && steps.site_changes.outputs.renderer_smoke_test == 'true'
        env:
          RENDER_TARGETS: site/fr/deepen.qmd
        run: .venv/bin/python scripts/quarto_render_batch.py

      - name: Verify isolated render overlays the site root
        if: github.event_name == 'pull_request' && contains(steps.site_changes.outputs.files, 'scripts/quarto_render_batch.py')
        run: |
          test -s site/_site/index.html
          test -s site/_site/fr/learning-map.html
          test -s site/_site/en/learning-map.html
          test ! -e site/_site/_site/index.html
          echo "The isolated render preserved the expected site root and did not create a nested _site directory."

      - name: Check rendered learning-map controls
        if: github.event_name != 'pull_request' || steps.site_changes.outputs.site_relevant == 'true'
        run: python3 site/tools/check_learning_map_rendered.py site/_site

      - name: Check rendered knowledge graph export
        if: github.event_name != 'pull_request' || steps.site_changes.outputs.site_relevant == 'true'
        run: python3 site/tools/check_knowledge_graph_rendered.py site/_site

      - name: Check rendered history timeline parity
        if: github.event_name != 'pull_request' || steps.site_changes.outputs.site_relevant == 'true'
        run: python3 site/tools/check_history_rendered.py

      - name: Check local links in rendered site
        if: github.event_name != 'pull_request' || steps.site_changes.outputs.site_relevant == 'true'
        run: |
          if ! python3 site/tools/check_site_links.py site/_site; then
            grep -n -C 2 -E 'training-loop\.html|post-training\.html' \
              site/_site/en/learning-map.html site/_site/fr/learning-map.html || true
            exit 1
          fi

      - name: Set up Node
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm packages
        id: npm_cache
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')
        uses: actions/cache@v4
        with:
          # Cache both npm's download cache and the fully resolved, version-pinned
          # modules. A warm runner can skip npm install altogether.
          path: |
            ~/.npm
            node_modules
          key: npm-browser-${{ runner.os }}-node22-playwright-1.56.1-axe-4.10.2

      - name: Install browser test dependencies
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')) && steps.npm_cache.outputs.cache-hit != 'true'
        run: npm install --prefer-offline --no-audit --no-fund --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2

      - name: Verify preinstalled Playwright browser
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')
        run: |
          npx playwright --version
          test -d "$PLAYWRIGHT_BROWSERS_PATH"
          find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 1 -mindepth 1 -type d -print

      - name: Serve this PR's rendered site
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')
        run: |
          python3 -m http.server 4173 --directory site/_site >/tmp/qkv-site-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/en/learning-map.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qkv-site-server.log
          exit 1

      - name: Review rendered bilingual learning pages and concept navigation
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')
        env:
          SITE_BROWSER_BASE_URL: http://127.0.0.1:4173
          SITE_BROWSER_PROFILE: ${{ github.event_name == 'pull_request' && 'targeted' || 'full' }}
          SITE_BROWSER_CHANGED_FILES: ${{ steps.site_changes.outputs.files }}
        run: node scripts/site-browser-review.mjs

      - name: Upload screenshots and audit report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true'))
        uses: actions/upload-artifact@v4
        with:
          name: site-browser-review-${{ github.sha }}
          path: artifacts/site-browser-review/
          if-no-files-found: warn
          retention-days: 30
