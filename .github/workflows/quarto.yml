name: Quarto site

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: quarto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Quarto site & browser audit
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56.1 does not
    # support ("Playwright does not support chromium on ubuntu26.04-x64").
    # Move back to ubuntu-latest together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only modified, already-listed .qmd pages qualify for incremental rendering.
      # Any shared input, deletion, rename, addition, or config change falls back to full.
      - name: Detect site and browser review scope
        id: site_changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed_files_json="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | {filename, status}' | jq -s '.')"
          PR_CHANGED_FILES_JSON="$changed_files_json" python3 scripts/quarto_render_scope.py

      - name: Find latest published site cache
        id: site_cache
        if: github.event_name == 'pull_request' && steps.site_changes.outputs.render_mode == 'incremental'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Never restore a site built from an older main commit than this PR's base.
          for run_id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-quarto.yml/runs?branch=main&status=success&per_page=100" --jq ".workflow_runs[] | select(.head_sha == \"$BASE_SHA\") | .id"); do
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "quarto-site-cache" and .expired == false) | .id' | head -n 1)"
            if [ -n "$artifact_id" ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Found published site cache in workflow run $run_id."
              exit 0
            fi
          done
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "No recent published site cache; falling back to a full render."

      - name: Restore latest published site
        id: restore_site
        if: github.event_name == 'pull_request' && steps.site_changes.outputs.render_mode == 'incremental' && steps.site_cache.outputs.available == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: quarto-site-cache
          run-id: ${{ steps.site_cache.outputs.run_id }}
          github-token: ${{ github.token }}
          path: site/_site

      - name: Verify restored site cache
        id: verify_site_cache
        if: github.event_name == 'pull_request' && steps.site_changes.outputs.render_mode == 'incremental'
        run: |
          if [ -s site/_site/index.html ] && [ -d site/_site/site_libs ]; then
            echo "cache_restored=true" >> "$GITHUB_OUTPUT"
            echo "Restored a complete Quarto site; changed pages can be rendered incrementally."
          else
            echo "cache_restored=false" >> "$GITHUB_OUTPUT"
            echo "Site cache unavailable or incomplete; using a full render."
          fi

      - name: Cache Quarto Linux tarball
        if: github.event_name != 'pull_request' || (steps.site_changes.outputs.site_relevant == 'true' && (steps.site_changes.outputs.render_targets != '' || steps.site_changes.outputs.render_assets == '' || steps.verify_site_cache.outputs.cache_restored != 'true'))
        id: quarto_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/quarto-1.11.9-linux-amd64.tar.gz
          key: quarto-tarball-${{ runner.os }}-1.11.9

      - name: Set up Quarto
        if: github.event_name != 'pull_request' || (steps.site_changes.outputs.site_relevant == 'true' && (steps.site_changes.outputs.render_targets != '' || steps.site_changes.outputs.render_assets == '' || steps.verify_site_cache.outputs.cache_restored != 'true'))
        env:
          QUARTO_VERSION: "1.11.9"
          QUARTO_SHA256: "9d037baa3b38ffac7217edca1d2e53760b0fab4d5749220740a32056e03a1530"
        run: |
          archive="$RUNNER_TEMP/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz"
          if [ ! -s "$archive" ] || ! echo "$QUARTO_SHA256  $archive" | sha256sum --check --status; then
            rm -f "$archive"
            url="https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 240 --output "$archive" "$url"
          fi
          echo "$QUARTO_SHA256  $archive" | sha256sum --check
          install_dir="$RUNNER_TEMP/quarto-${QUARTO_VERSION}"
          mkdir -p "$install_dir"
          tar -xzf "$archive" --strip-components=1 -C "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/quarto" --version

      # Image-only PRs with a verified published-site cache need neither Quarto
      # nor Python: they copy the changed image and still run output/link checks.
      # Keep the environment for cache misses and all changes needing a render.
      - name: Set up uv and Python
        if: github.event_name != 'pull_request' || (steps.site_changes.outputs.site_relevant == 'true' && (steps.site_changes.outputs.render_targets != '' || steps.site_changes.outputs.render_assets == '' || steps.verify_site_cache.outputs.cache_restored != 'true'))
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            docs/requirements-*.txt

      - name: Create shared validation environment
        if: github.event_name != 'pull_request' || (steps.site_changes.outputs.site_relevant == 'true' && (steps.site_changes.outputs.render_targets != '' || steps.site_changes.outputs.render_assets == '' || steps.verify_site_cache.outputs.cache_restored != 'true'))
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r docs/requirements-history-validation.txt

      - name: Validate page metadata learning graph
        if: github.event_name != 'pull_request'
        run: .venv/bin/python site/tools/check_page_metadata.py

      - name: Validate first-class learning resources
        if: github.event_name != 'pull_request'
        run: .venv/bin/python site/tools/check_resource_registry.py

      - name: Generate bilingual history timeline fragments
        if: github.event_name != 'pull_request' || (steps.site_changes.outputs.site_relevant == 'true' && (steps.site_changes.outputs.render_targets != '' || steps.site_changes.outputs.render_assets == '' || steps.verify_site_cache.outputs.cache_restored != 'true'))
        run: .venv/bin/python site/tools/render_history_pilot.py

      - name: Generate learning-map data and guided-route Markdown
        if: github.event_name != 'pull_request' || (steps.site_changes.outputs.site_relevant == 'true' && (steps.site_changes.outputs.render_targets != '' || steps.site_changes.outputs.render_assets == '' || steps.verify_site_cache.outputs.cache_restored != 'true'))
        run: .venv/bin/python site/tools/build_learning_map.py

      - name: Generate bilingual computational-graph fragments
        if: github.event_name != 'pull_request' || (steps.site_changes.outputs.site_relevant == 'true' && (steps.site_changes.outputs.render_targets != '' || steps.site_changes.outputs.render_assets == '' || steps.verify_site_cache.outputs.cache_restored != 'true'))
        run: .venv/bin/python site/tools/render_computational_graph.py

      - name: Render changed pages incrementally
        if: ${{ github.event_name == 'pull_request' && steps.site_changes.outputs.render_mode == 'incremental' && steps.verify_site_cache.outputs.cache_restored == 'true' }}
        env:
          RENDER_TARGETS: ${{ steps.site_changes.outputs.render_targets }}
          RENDER_ASSETS: ${{ steps.site_changes.outputs.render_assets }}
        run: |
          .venv/bin/python scripts/quarto_render_batch.py

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            relative="${asset#site/}"
            destination="site/_site/$relative"
            mkdir -p "$(dirname "$destination")"
            cp -- "$asset" "$destination"
            echo "Copied updated static asset $relative"
          done <<< "$RENDER_ASSETS"

      - name: Render full site
        if: ${{ github.event_name != 'pull_request' || (steps.site_changes.outputs.site_relevant == 'true' && (steps.site_changes.outputs.render_mode != 'incremental' || steps.verify_site_cache.outputs.cache_restored != 'true')) }}
        run: quarto render site

      - name: Check rendered learning-map controls
        if: github.event_name != 'pull_request' || steps.site_changes.outputs.site_relevant == 'true'
        run: python3 site/tools/check_learning_map_rendered.py site/_site

      - name: Check rendered knowledge graph export
        if: github.event_name != 'pull_request' || steps.site_changes.outputs.site_relevant == 'true'
        run: python3 site/tools/check_knowledge_graph_rendered.py site/_site

      - name: Check rendered history timeline parity
        if: github.event_name != 'pull_request' || steps.site_changes.outputs.site_relevant == 'true'
        run: python3 site/tools/check_history_rendered.py

      - name: Check local links in rendered site
        if: github.event_name != 'pull_request' || steps.site_changes.outputs.site_relevant == 'true'
        run: python3 site/tools/check_site_links.py site/_site

      - name: Set up Node
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm packages
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-browser-${{ runner.os }}-playwright-1.56.1-axe-4.10.2

      - name: Install browser test dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')
        run: npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2

      - name: Cache Playwright Chromium
        id: playwright_cache
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.56.1

      - name: Install Playwright system dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')
        run: npx playwright install-deps chromium

      - name: Install Chromium when the browser cache is cold
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')) && steps.playwright_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Serve this PR's rendered site
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')
        run: |
          python3 -m http.server 4173 --directory site/_site >/tmp/qkv-site-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/en/learning-map.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qkv-site-server.log
          exit 1

      - name: Review rendered bilingual learning pages and concept navigation
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true')
        env:
          SITE_BROWSER_BASE_URL: http://127.0.0.1:4173
          SITE_BROWSER_PROFILE: ${{ github.event_name == 'pull_request' && 'targeted' || 'full' }}
          SITE_BROWSER_CHANGED_FILES: ${{ steps.site_changes.outputs.files }}
        run: node scripts/site-browser-review.mjs

      - name: Upload screenshots and audit report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.site_changes.outputs.browser_relevant == 'true'))
        uses: actions/upload-artifact@v4
        with:
          name: site-browser-review-${{ github.sha }}
          path: artifacts/site-browser-review/
          if-no-files-found: warn
          retention-days: 30
